name: Work Claim
description: 실행 전 범위와 재사용 입력을 기록해 중복 작업을 줄입니다.
title: "[WORK] "
body:
  - type: input
    id: claim_id
    attributes:
      label: Claim ID
      placeholder: CLAIM-YYYYMMDD-short-name
    validations:
      required: true
  - type: input
    id: base_revision
    attributes:
      label: Base revision
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective and expected contribution
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and explicit exclusions
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Claims, registries, results, validation cache and PRs checked
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Source IDs, dataset IDs, code, evaluation contract and dependency fingerprint
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Expected artifacts and decision condition
    validations:
      required: true
  - type: checkboxes
    id: replication
    attributes:
      label: Independent reproduction
      options:
        - label: 겹침은 의도적인 독립 재현이며 차이와 의사결정 가치를 위에 기록했습니다.
