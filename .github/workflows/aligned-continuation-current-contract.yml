name: Audit aligned-continuation current contract

on:
  push:
    branches: [agent/ml-aligned-continuation-audit-001]
    paths:
      - 'research/aligned_continuation_audit/download_registered_source.py'
      - 'research/aligned_continuation_audit/current_contract_audit.py'
      - '.github/workflows/aligned-continuation-current-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aligned-continuation-current-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.3' 'pandas==2.3.3' 'pyarrow==21.0.0'

      - name: Recover exact registered baseline source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aligned-source"
          blob='2eb432b03b7126d0feda365c4af44669c58336a0'
          git cat-file blob "$blob" > "$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py"
          echo 'e9ce4e211e060d74cfb43759bb6afb69616cc8b12fa66aa6ad317ceac01d56b8  '"$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py" | sha256sum -c -
          python -m py_compile \
            "$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py" \
            research/aligned_continuation_audit/download_registered_source.py \
            research/aligned_continuation_audit/current_contract_audit.py

      - name: Restore official source cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/aligned-data/raw
          key: aligned-continuation-binance-usdm-202203-202312-v1

      - name: Download and verify registered Binance source
        run: |
          set -euo pipefail
          python research/aligned_continuation_audit/download_registered_source.py \
            --root "$RUNNER_TEMP/aligned-data" \
            --workers 16

      - name: Run registered, latency-corrected, no-time and protected-flow paths
        run: |
          set -euo pipefail
          mkdir -p artifact/aligned-continuation-current-contract
          python research/aligned_continuation_audit/current_contract_audit.py \
            --original-source "$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py" \
            --prepared-root "$RUNNER_TEMP/aligned-data/prepared" \
            --output artifact/aligned-continuation-current-contract
          cp "$RUNNER_TEMP/aligned-data/SOURCE_MANIFEST.json" \
            artifact/aligned-continuation-current-contract/SOURCE_MANIFEST.json
          cp "$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py" \
            artifact/aligned-continuation-current-contract/REGISTERED_SOURCE.py

      - name: Verify result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifact/aligned-continuation-current-contract')
          result=json.loads((root/'RESULT.json').read_text())
          assert result['candidate_id']=='aligned_continuation|h48|z3-inf|t3|f0.1|e0.45|hold0.7|buf0.5|rr4|life720|xidiosyncratic'
          assert {row['mode'] for row in result['paths']}=={
              'registered_horizon','corrected_horizon','stop_target_only','protected_flow'
          }
          assert {row['cost'] for row in result['paths']}=={'15bp','18bp','24bp','30bp'}
          assert result['orders_submitted'] is False
          print(json.dumps({'decision':result['decision'],'reproduction':result['reproduction']},sort_keys=True))
          PY

      - name: Hash compact evidence
        run: |
          find artifact/aligned-continuation-current-contract -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > artifact/aligned-continuation-current-contract/SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aligned-continuation-current-contract-${{ github.sha }}
          path: artifact/aligned-continuation-current-contract
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
