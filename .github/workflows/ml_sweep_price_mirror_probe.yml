name: ML sweep Bybit one-minute mirror probe

on:
  push:
    branches:
      - agent/r22-ml-sweep-crowding-001
    paths:
      - research/triggers/ml_sweep_price_probe/**

permissions:
  contents: write

concurrency:
  group: ml-sweep-price-mirror-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore immutable mirror cache
        uses: actions/cache@v4
        with:
          path: .cache/ml_sweep_crowding/hf_bybit_price
          key: ml-sweep-bybit-price-probe-v1
      - name: Install pinned probe runtime
        run: |
          python -m pip install \
            numpy==2.1.3 \
            pandas==2.2.3 \
            pyarrow==18.1.0 \
            requests==2.32.3
      - name: Probe immutable Bybit one-minute mirrors
        run: python research/ml_sweep_crowding/probe_hf_bybit_price.py
      - name: Publish immutable probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/ml_sweep_crowding/bybit_price_mirror_probe.json
          git commit -m "research: publish pinned Bybit one-minute mirror probe"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-sweep-bybit-price-mirror-probe-v1
          path: research/results/ml_sweep_crowding/bybit_price_mirror_probe.json
          if-no-files-found: warn
          retention-days: 30
