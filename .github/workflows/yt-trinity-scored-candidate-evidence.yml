name: YT Trinity scored-candidate evidence integration

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/apply_scored_candidate_evidence.py
      - .github/workflows/yt-trinity-scored-candidate-evidence.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-scored-candidate-evidence
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Integrate exact scored candidates
        run: python research/yt_trinity_ml/apply_scored_candidate_evidence.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile and run research invariants
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow requests pytest playwright
          python -m py_compile \
            research/yt_trinity_ml/run_full_sequential_survivor.py \
            research/yt_trinity_ml/run_pooled_trinity_system.py
          pytest -q research/yt_trinity_ml/tests
      - name: Commit integration and remove materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/yt_trinity_ml/run_full_sequential_survivor.py \
            research/yt_trinity_ml/run_pooled_trinity_system.py
          git rm -f research/yt_trinity_ml/apply_scored_candidate_evidence.py .github/workflows/yt-trinity-scored-candidate-evidence.yml
          git commit -m "Persist frozen scored candidates for event-tape replay"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
