name: Cross-margin contingent normalized source probe

on:
  push:
    branches:
      - agent/r5-cross-margin-dislocation-001
    paths:
      - "research/cross_margin_dislocation_20260725/preregistration_tardis_v2.json"
      - "research/cross_margin_dislocation_20260725/tardis_source_probe.py"
      - "research_results/r5_cross_margin_dislocation_001/STATUS_INFRASTRUCTURE_BLOCKED.txt"
      - ".github/workflows/cross-margin-tardis-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r5-cross-margin-tardis-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contingent-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-cross-margin-dislocation-001
          fetch-depth: 1

      - name: Enforce official-source blocking precondition
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/r5-cross-margin-dislocation-001
          git reset --hard origin/agent/r5-cross-margin-dislocation-001
          blocked=false
          if [[ -f research_results/r5_cross_margin_dislocation_001/STATUS_INFRASTRUCTURE_BLOCKED.txt ]]; then
            blocked=true
          fi
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          mkdir -p research_runs/cross_margin_dislocation_20260725/tardis_source_probe
          python - "$blocked" <<'PY'
          import json, pathlib, sys
          pathlib.Path('research_runs/cross_margin_dislocation_20260725/tardis_source_probe/PRECONDITION.json').write_text(
              json.dumps({
                  'official_source_infrastructure_blocked':sys.argv[1]=='true',
                  'strategy_or_pnl_computed':False,
                  'selection_opened':False,
                  'confirmation_opened':False,
                  '2026_opened':False,
                  'orders_submitted':False,
              },indent=2,sort_keys=True)+'\n')
          PY

      - name: Install fixed environment
        if: steps.gate.outputs.blocked == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "requests==2.32.4"

      - name: Verify contingent preregistration and self-test
        if: steps.gate.outputs.blocked == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_margin_dislocation_20260725
          python -m py_compile "$root/tardis_source_probe.py"
          sha256sum "$root/preregistration_tardis_v2.json" "$root/tardis_source_probe.py" > research_runs/cross_margin_dislocation_20260725/tardis_source_probe/INPUT_SHA256SUMS.txt
          python "$root/tardis_source_probe.py" --self-test --output research_runs/cross_margin_dislocation_20260725/tardis_source_probe \
            2>&1 | tee research_runs/cross_margin_dislocation_20260725/tardis_source_probe/self_test.log
          python - <<'PY'
          import json
          p=json.load(open('research/cross_margin_dislocation_20260725/preregistration_tardis_v2.json'))
          assert p['status']=='CONTINGENT_PREREGISTRATION_BEFORE_ANY_TARDIS_PRICE_OR_PNL_SCREEN'
          assert p['safety']['2026_opened'] is False
          PY

      - name: Probe contingent local-arrival trades and quotes
        if: steps.gate.outputs.blocked == 'true'
        shell: bash
        run: |
          set +e
          root=research/cross_margin_dislocation_20260725
          python "$root/tardis_source_probe.py" \
            --date 2023-07-01 \
            --output research_runs/cross_margin_dislocation_20260725/tardis_source_probe/result \
            2>&1 | tee research_runs/cross_margin_dislocation_20260725/tardis_source_probe/probe.log
          exit 0

      - name: Commit durable contingent source decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_results/r5_cross_margin_dislocation_001
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('research_runs/cross_margin_dislocation_20260725/tardis_source_probe')
          output=pathlib.Path('research_results/r5_cross_margin_dislocation_001')
          pre=json.loads((root/'PRECONDITION.json').read_text())
          path=root/'result'/'TARDIS_SOURCE_PROBE.json'
          probe=json.loads(path.read_text()) if path.exists() else None
          usable=bool(probe and probe.get('all_required_sources_usable'))
          if not pre['official_source_infrastructure_blocked']:
              status='NOT_ACTIVATED_OFFICIAL_SOURCE_NOT_BLOCKED'
          else:
              status='TARDIS_SOURCE_USABLE' if usable else 'TARDIS_SOURCE_UNAVAILABLE'
          result={
              'schema_version':2,
              'result_id':'RES-20260725-CROSS-MARGIN-SOURCE-TARDIS-002',
              'claim_id':'CLM-20260725-2120-CROSS-MARGIN-001',
              'status':status,
              'official_source_infrastructure_blocked':pre['official_source_infrastructure_blocked'],
              'tardis_source_probe':probe,
              'strategy_or_pnl_computed':False,
              'development_opened':False,
              'selection_opened':False,
              'confirmation_opened':False,
              '2026_opened':False,
              'orders_submitted':False,
              'paper_live_started':False,
              'champion_eligible':False,
          }
          durable=output/'tardis_source_result.json'
          durable.write_text(json.dumps(result,indent=2,sort_keys=True,default=str)+'\n')
          (output/'tardis_source_result.sha256').write_text(hashlib.sha256(durable.read_bytes()).hexdigest()+'  tardis_source_result.json\n')
          for old in output.glob('STATUS_TARDIS_*.txt'):
              old.unlink()
          (output/f'STATUS_{status}.txt').write_text(json.dumps({'status':status,'strategy_or_pnl_computed':False,'2026_opened':False,'orders_submitted':False},indent=2,sort_keys=True)+'\n')
          PY
          find research_results/r5_cross_margin_dislocation_001 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > research_results/r5_cross_margin_dislocation_001/SHA256SUMS.txt
          git config user.name "smc-ict-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_results/r5_cross_margin_dislocation_001
          if ! git diff --cached --quiet; then
            git commit -m "Record contingent cross-margin source decision"
            git push origin HEAD:agent/r5-cross-margin-dislocation-001
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-margin-tardis-source-probe-${{ github.sha }}
          path: research_runs/cross_margin_dislocation_20260725/tardis_source_probe
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
