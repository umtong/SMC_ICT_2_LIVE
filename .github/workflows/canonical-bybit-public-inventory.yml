name: Canonical Bybit public archive inventory

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/market_data/inventory_public_bybit.py
      - .github/workflows/canonical-bybit-public-inventory.yml
  push:
    branches:
      - agent/r22-canonical-halfyear-market-data-001
    paths:
      - scripts/market_data/inventory_public_bybit.py
      - .github/workflows/canonical-bybit-public-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-bybit-public-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependency
        run: python -m pip install "requests==2.32.4"
      - name: Inventory official public archives
        run: |
          python scripts/market_data/inventory_public_bybit.py \
            --out artifact/public_archive_inventory
      - name: Upload immutable inventory
        uses: actions/upload-artifact@v4
        with:
          name: canonical-bybit-public-archive-inventory
          path: artifact/public_archive_inventory
          if-no-files-found: error
          retention-days: 30
