name: Cross-sectional positioning metrics research

on:
  push:
    branches:
      - agent/r7-xsec-positioning-metrics-001
    paths:
      - "research/xsec_positioning_metrics_20260725/**"
      - ".github/workflows/xsec-positioning-metrics.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/xsec_positioning_metrics_20260725/**"
      - ".github/workflows/xsec-positioning-metrics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xsec-positioning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r7-xsec-positioning-metrics-001
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "pytest==8.3.4"

      - name: Restore immutable sources and run causal tests
        run: |
          set -euo pipefail
          python research/xsec_positioning_metrics_20260725/restore_source_bundle.py
          python scripts/validate_project.py
          python research/xsec_positioning_metrics_20260725/test_causality.py
          python -m py_compile \
            research/xsec_positioning_metrics_20260725/download_data.py \
            research/xsec_positioning_metrics_20260725/run_research.py

      - name: Download development inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/xsec-positioning/outputs
          python research/xsec_positioning_metrics_20260725/download_data.py \
            --root /tmp/xsec-positioning \
            --config research/xsec_positioning_metrics_20260725/config.json \
            --start-date 2021-10-01 \
            --end-date 2022-12-31 \
            --workers 32 | tee /tmp/xsec-positioning/download-development.log

      - name: Run development gate
        run: |
          set -euo pipefail
          python research/xsec_positioning_metrics_20260725/run_research.py \
            --root /tmp/xsec-positioning \
            --config research/xsec_positioning_metrics_20260725/config.json \
            --output /tmp/xsec-positioning/outputs \
            --stage development | tee /tmp/xsec-positioning/development.log

      - name: Open frozen selection only when development passes
        run: |
          set -euo pipefail
          survivors=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/xsec-positioning/outputs/compact_development.json'))['survivor_count'])
          PY
          )
          echo "development survivors=${survivors}"
          if [ "$survivors" -gt 0 ]; then
            python research/xsec_positioning_metrics_20260725/download_data.py \
              --root /tmp/xsec-positioning \
              --config research/xsec_positioning_metrics_20260725/config.json \
              --start-date 2023-01-01 \
              --end-date 2023-12-31 \
              --workers 32 | tee /tmp/xsec-positioning/download-selection.log
            python research/xsec_positioning_metrics_20260725/run_research.py \
              --root /tmp/xsec-positioning \
              --config research/xsec_positioning_metrics_20260725/config.json \
              --output /tmp/xsec-positioning/outputs \
              --stage selection | tee /tmp/xsec-positioning/selection.log
          fi

      - name: Open conditional validation only when selection passes
        run: |
          set -euo pipefail
          if [ -f /tmp/xsec-positioning/outputs/compact_selection.json ]; then
            survivors=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/xsec-positioning/outputs/compact_selection.json'))['survivor_count'])
          PY
          )
            echo "selection survivors=${survivors}"
            if [ "$survivors" -gt 0 ]; then
              python research/xsec_positioning_metrics_20260725/download_data.py \
                --root /tmp/xsec-positioning \
                --config research/xsec_positioning_metrics_20260725/config.json \
                --start-date 2024-01-01 \
                --end-date 2024-12-31 \
                --workers 32 | tee /tmp/xsec-positioning/download-validation.log
              python research/xsec_positioning_metrics_20260725/run_research.py \
                --root /tmp/xsec-positioning \
                --config research/xsec_positioning_metrics_20260725/config.json \
                --output /tmp/xsec-positioning/outputs \
                --stage validation | tee /tmp/xsec-positioning/validation.log
            fi
          fi

      - name: Verify output inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          out = pathlib.Path('/tmp/xsec-positioning/outputs')
          inventory = json.loads((out / 'artifact_inventory.json').read_text())
          registered = {row['path']: row['sha256'] for row in inventory}
          for path in out.iterdir():
              if path.is_file() and path.name != 'artifact_inventory.json':
                  observed = hashlib.sha256(path.read_bytes()).hexdigest()
                  assert registered.get(path.name) == observed, (path.name, observed, registered.get(path.name))
          development = json.loads((out / 'compact_development.json').read_text())
          assert development['hard_valid'] is True
          assert development['orders_submitted'] is False
          print(json.dumps(development, indent=2, sort_keys=True))
          PY

      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: xsec-positioning-metrics-evidence
          path: |
            /tmp/xsec-positioning/manifest.json
            /tmp/xsec-positioning/*.log
            /tmp/xsec-positioning/outputs/**
          if-no-files-found: error
          retention-days: 14
