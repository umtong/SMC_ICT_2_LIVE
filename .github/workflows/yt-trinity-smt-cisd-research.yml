name: YT Trinity SMT CISD BPR causal screen

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/COMPRESSION_BPR_RUN_POINTER.json
      - research/yt_trinity_ml/run_smt_cisd_research.py
      - .github/workflows/yt-trinity-smt-cisd-research.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: yt-trinity-smt-cisd-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      run_third_alpha: ${{ steps.gate.outputs.run_third_alpha }}
      parent_decision: ${{ steps.gate.outputs.parent_decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: gate
        name: Require explicit second-route economic failure
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('research/yt_trinity_ml/COMPRESSION_BPR_RUN_POINTER.json')
          decision = 'MISSING_PARENT_POINTER'
          run_third = False
          if path.exists():
              payload = json.loads(path.read_text(encoding='utf-8'))
              decision = str(payload.get('decision') or 'MISSING_PARENT_DECISION')
              run_third = decision == 'ECONOMIC_FAIL_SWITCH_ALPHA'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"parent_decision={decision}\n")
              handle.write(f"run_third_alpha={'true' if run_third else 'false'}\n")
          print(json.dumps({'parent_decision': decision, 'run_third_alpha': run_third}, indent=2))
          PY

  test-and-screen:
    needs: decide
    if: needs.decide.outputs.run_third_alpha == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install causal research dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow requests pytest
      - name: Compile and run every shared invariant
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python -m py_compile \
            research/yt_trinity_ml/run_cisd_bpr_ifvg_research.py \
            research/yt_trinity_ml/run_smt_cisd_research.py \
            research/yt_trinity_ml/system/*.py
          pytest -q research/yt_trinity_ml/tests
      - uses: actions/cache@v4
        with:
          path: artifact/bybit-cache
          key: yt-trinity-bybit-linear-1m-20220101-20240701-v1
      - name: Run fixed SMT pre-2024 selection and conditional 2024H1 opening
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -o pipefail
          mkdir -p artifact/bybit-cache artifact/smt-cisd-run
          python research/yt_trinity_ml/run_smt_cisd_research.py \
            --cache-dir artifact/bybit-cache \
            --output artifact/smt-cisd-run \
            --data-start 2022-01-01T00:00:00Z \
            --pre2024-start 2023-01-01T00:00:00Z \
            --official-start 2024-01-01T00:00:00Z \
            --official-end-exclusive 2024-07-01T00:00:00Z \
            2>&1 | tee artifact/smt-cisd-run/STDOUT.log
      - name: Hash immutable run evidence
        if: always()
        run: |
          if [[ -d artifact/smt-cisd-run ]]; then
            (
              cd artifact/smt-cisd-run
              find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            )
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-smt-cisd-${{ github.sha }}
          path: artifact/smt-cisd-run
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
      - name: Persist compact decision pointer
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          summary_path = Path('artifact/smt-cisd-run/RUN_SUMMARY.json')
          summary = json.loads(summary_path.read_text(encoding='utf-8')) if summary_path.exists() else None
          pointer = {
              'schema_version': 1,
              'workflow': 'YT Trinity SMT CISD BPR causal screen',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'source_sha': os.environ['GITHUB_SHA'],
              'artifact_name': f"yt-trinity-smt-cisd-{os.environ['GITHUB_SHA']}",
              'summary_sha256': hashlib.sha256(summary_path.read_bytes()).hexdigest() if summary_path.exists() else None,
              'decision': summary.get('decision') if isinstance(summary, dict) else 'EXECUTION_FAILED_NO_SUMMARY',
              'candidate_count': summary.get('candidate_count') if isinstance(summary, dict) else None,
              'action_label_count': summary.get('action_label_count') if isinstance(summary, dict) else None,
              'selected_basic': summary.get('selected_basic') if isinstance(summary, dict) else None,
              'selected_risk': summary.get('selected_risk') if isinstance(summary, dict) else None,
              'official_2024h1': summary.get('official_2024h1') if isinstance(summary, dict) else None,
              'parent_decision': 'ECONOMIC_FAIL_SWITCH_ALPHA',
              'rankable': False,
          }
          Path('research/yt_trinity_ml/SMT_CISD_RUN_POINTER.json').write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/SMT_CISD_RUN_POINTER.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record SMT CISD causal screen ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

  record-skip:
    needs: decide
    if: needs.decide.outputs.run_third_alpha != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "SMT alpha not opened. Parent decision: ${{ needs.decide.outputs.parent_decision }}" >> "$GITHUB_STEP_SUMMARY"
