name: YT Trinity corrected conditional killzone

on:
  push:
    branches: [agent/r22-yt-trinity-ml-exec-001]
    paths:
      - research/yt_trinity_ml/EXEC_AGGREGATE_V2_POINTER.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-exec-killzone-v3
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-exec-001
          fetch-depth: 0
      - name: Gate
        id: gate
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('research/yt_trinity_ml/EXEC_AGGREGATE_V2_POINTER.json');run=False
          if p.exists(): run=bool(json.loads(p.read_text()).get('needs_killzone'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"run={'true' if run else 'false'}\n")
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install stack
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'pyarrow==19.0.1' 'scikit-learn==1.6.1'
      - name: Download inputs
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_artifact(){ curl --fail --silent --show-error --location -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"; }
          mkdir -p input/{btc2023,eth2023,btc2024,eth2024} output
          fetch_artifact 8636781702 /tmp/btc2023.zip;fetch_artifact 8636761741 /tmp/eth2023.zip;fetch_artifact 8636867995 /tmp/btc2024.zip;fetch_artifact 8636882043 /tmp/eth2024.zip
          unzip -q /tmp/btc2023.zip -d input/btc2023;unzip -q /tmp/eth2023.zip -d input/eth2023;unzip -q /tmp/btc2024.zip -d input/btc2024;unzip -q /tmp/eth2024.zip -d input/eth2024
      - name: Resolve paths
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          for pair in 'btc2023 btcusdt_2023' 'eth2023 ethusdt_2023' 'btc2024 btcusdt_2024h1' 'eth2024 ethusdt_2024h1';do set -- $pair;root=$1;key=$2;find input/$root -path '*/trade_bars/1m.parquet' -print -quit >/tmp/${key}_bars;find input/$root -path '*/streams/mark_price_1m.parquet' -print -quit >/tmp/${key}_marks;find input/$root -path '*/streams/open_interest_5m.parquet' -print -quit >/tmp/${key}_oi;find input/$root -path '*/streams/funding_events.parquet' -print -quit >/tmp/${key}_funding;test -s /tmp/${key}_bars&&test -s /tmp/${key}_marks&&test -s /tmp/${key}_oi&&test -s /tmp/${key}_funding;done
      - name: Execute corrected causal alpha
        if: steps.gate.outputs.run == 'true'
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set +e
          python -m py_compile research/yt_trinity_ml/run_killzone_smt_cisd_v1.py research/yt_trinity_ml/run_killzone_smt_cisd_v2.py;compile=$?;if [[ $compile != 0 ]];then echo $compile>output/EXIT_CODE.txt;exit 0;fi
          python research/yt_trinity_ml/run_killzone_smt_cisd_v2.py --output output \
            --btcusdt-2023-bars "$(cat /tmp/btcusdt_2023_bars)" --btcusdt-2023-marks "$(cat /tmp/btcusdt_2023_marks)" --btcusdt-2023-oi "$(cat /tmp/btcusdt_2023_oi)" --btcusdt-2023-funding "$(cat /tmp/btcusdt_2023_funding)" --ethusdt-2023-bars "$(cat /tmp/ethusdt_2023_bars)" --ethusdt-2023-marks "$(cat /tmp/ethusdt_2023_marks)" --ethusdt-2023-oi "$(cat /tmp/ethusdt_2023_oi)" --ethusdt-2023-funding "$(cat /tmp/ethusdt_2023_funding)" \
            --btcusdt-2024h1-bars "$(cat /tmp/btcusdt_2024h1_bars)" --btcusdt-2024h1-marks "$(cat /tmp/btcusdt_2024h1_marks)" --btcusdt-2024h1-oi "$(cat /tmp/btcusdt_2024h1_oi)" --btcusdt-2024h1-funding "$(cat /tmp/btcusdt_2024h1_funding)" --ethusdt-2024h1-bars "$(cat /tmp/ethusdt_2024h1_bars)" --ethusdt-2024h1-marks "$(cat /tmp/ethusdt_2024h1_marks)" --ethusdt-2024h1-oi "$(cat /tmp/ethusdt_2024h1_oi)" --ethusdt-2024h1-funding "$(cat /tmp/ethusdt_2024h1_funding)" 2>&1|tee output/RUN_STDOUT.log
          echo ${PIPESTATUS[0]}>output/EXIT_CODE.txt;exit 0
      - name: Persist pointer
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('output');p=root/'KILLZONE_SMT_CISD_RESULT.json';r=json.loads(p.read_text()) if p.exists() else None;code=int((root/'EXIT_CODE.txt').read_text()) if (root/'EXIT_CODE.txt').exists() else 99;log=(root/'RUN_STDOUT.log').read_text(errors='replace') if (root/'RUN_STDOUT.log').exists() else ''
          Path('research/yt_trinity_ml/EXEC_KILLZONE_V2_POINTER.json').write_text(json.dumps({'schema_version':2,'run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'exit_code':code,'status':'success' if code==0 and r else 'execution_failure_not_economic_failure','result':r,'result_sha256':hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None,'stdout_tail':log[-16000:]},indent=2,sort_keys=True,default=str)+'\n')
          PY
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add research/yt_trinity_ml/EXEC_KILLZONE_V2_POINTER.json
          if ! git diff --cached --quiet;then git commit -m "Record corrected killzone ${GITHUB_RUN_ID}";for i in 1 2 3 4 5;do git pull --rebase origin agent/r22-yt-trinity-ml-exec-001&&git push origin HEAD:agent/r22-yt-trinity-ml-exec-001&&break||sleep $((i*3));done;fi
      - name: Upload
        if: always() && steps.gate.outputs.run == 'true'
        run: (cd output&&find . -type f ! -name SHA256SUMS -print0|sort -z|xargs -0 sha256sum>SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: yt-trinity-exec-killzone-v3-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90
