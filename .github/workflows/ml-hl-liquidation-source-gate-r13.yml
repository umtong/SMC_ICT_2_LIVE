name: Superseded Hyperliquid Linux source gate

on:
  push:
    branches: [agent/r13-ml-hl-liquidation-001]
    paths:
      - '.github/workflows/ml-hl-liquidation-source-gate-r13.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-hl-liquidation-source-r13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  superseded:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Superseded by ml-hl-liquidation-source-gate-convert-ref-r13.yml'
