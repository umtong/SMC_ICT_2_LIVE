name: YT Trinity canonical 2021-2022 BTC ETH history

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - .github/workflows/yt-trinity-pre2024-history-build.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-pre2024-history-${{ github.sha }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  BYBIT_PUBLIC_BASE_URL: https://api.manepa.jp
  TARGET_BRANCH: agent/r22-yt-trinity-ml-001
  CANONICAL_COMMIT: a2bb231966a517d29495bed7673e4d08ab8e30a9

jobs:
  build-history:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        segment: [PRE_2024_2021, PRE_2024_2022]
        symbol: [BTCUSDT, ETHUSDT]
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Checkout exact canonical builder
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: ${{ env.CANONICAL_COMMIT }}
          path: canonical_repo
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install canonical build dependencies
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q ./canonical_repo

      - name: Build official Bybit historical shard
        env:
          PYTHONPATH: canonical_repo
        run: |
          set -euo pipefail
          python canonical_repo/scripts/market_data/build_canonical_bybit.py \
            --segment "${{ matrix.segment }}" \
            --symbol "${{ matrix.symbol }}" \
            --base-url "$BYBIT_PUBLIC_BASE_URL" \
            --timeout 30 \
            --max-attempts 8 \
            --min-request-interval 0.10 \
            --out artifact

      - name: Verify immutable causal shard
        env:
          PYTHONPATH: canonical_repo
        run: |
          set -euo pipefail
          python canonical_repo/scripts/market_data/verify_canonical_bybit.py \
            "artifact/${{ matrix.segment }}/${{ matrix.symbol }}" \
            | tee "artifact/${{ matrix.segment }}/${{ matrix.symbol }}/VERIFICATION.json"
          test -f "artifact/${{ matrix.segment }}/${{ matrix.symbol }}/DATASET_MANIFEST.json"
          test -f "artifact/${{ matrix.segment }}/${{ matrix.symbol }}/trade_bars/1m.parquet"
          test -f "artifact/${{ matrix.segment }}/${{ matrix.symbol }}/trade_bars/5m.parquet"
          (
            cd "artifact/${{ matrix.segment }}/${{ matrix.symbol }}"
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload reusable immutable history shard
        uses: actions/upload-artifact@v4
        with:
          name: canonical-bybit-${{ matrix.segment }}-${{ matrix.symbol }}
          path: artifact/${{ matrix.segment }}/${{ matrix.symbol }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish-ready-pointer:
    needs: build-history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Persist exact history readiness
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          segments = ["PRE_2024_2021", "PRE_2024_2022"]
          symbols = ["BTCUSDT", "ETHUSDT"]
          payload = {
              "schema_version": 1,
              "claim_id": "CLM-20260727-0346-YT-TRINITY-ML-001",
              "stage": "CANONICAL_PRE2024_HISTORY_READY",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")),
              "trigger_source_commit": os.environ["GITHUB_SHA"],
              "canonical_builder_commit": os.environ["CANONICAL_COMMIT"],
              "built_at_utc": datetime.now(timezone.utc).isoformat(),
              "segments": segments,
              "symbols": symbols,
              "artifact_names": [
                  f"canonical-bybit-{segment}-{symbol}"
                  for segment in segments
                  for symbol in symbols
              ],
              "status": "PASS_COMPLETE",
              "training_use": {
                  "base_learning": ["2021", "2022"],
                  "calibration": "2023_H1",
                  "final_pre2024_selection": "2023_H2",
                  "official_evaluation_opened": False,
              },
              "ranking_effect": "NONE_DATA_ONLY",
          }
          target = Path("research/yt_trinity_ml/PRE2024_HISTORY_READY.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/PRE2024_HISTORY_READY.json
          if ! git diff --cached --quiet; then
            git commit -m "Record canonical 2021-2022 history readiness ${GITHUB_RUN_ID}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin "$TARGET_BRANCH"
              if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
