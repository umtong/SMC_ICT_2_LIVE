name: Export exact PR597 source for reactivation parity audit

on:
  push:
    branches: [agent/r48-core-then-protected-reactivation-001]
    paths:
      - .github/workflows/export-pr597-source-r48.yml
      - research/core_then_protected_reactivation/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Recover and validate exact PR597 source
        shell: bash
        run: |
          set -euo pipefail
          commit=56c7baf4fa7d809d0ee9e471267c6ed5cbf1b543
          src=research/xvenue_sponsorship_core_expansion_20260730
          out=artifact
          git fetch --depth=1 origin "$commit"
          mkdir -p "$out/carrier" "$out/materialized"
          for f in SOURCE_BUNDLE.tar.gz.b64 SOURCE_MANIFEST.json CONTRACT.json RESULT.json RESULT_FULL.json.gz.b64 REPORT.md VALIDATION_ATTESTATION.json materialize.py; do
            git show "$commit:$src/$f" > "$out/carrier/$f"
          done
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re
          p=Path('artifact/carrier/SOURCE_BUNDLE.tar.gz.b64')
          original=p.read_text(encoding='utf-8-sig')
          compact=''.join(original.split())
          bad=sorted(set(re.sub(r'[A-Za-z0-9+/=]', '', compact)))
          clean=''.join(re.findall(r'[A-Za-z0-9+/=]', compact))
          raw=base64.b64decode(clean, validate=True)
          observed=hashlib.sha256(raw).hexdigest()
          expected='0ea2750a9e089a2b4d9e994deb3f5903da4ae589a57522fcd13a7c023b5d8131'
          audit={'original_chars':len(original),'compact_chars':len(compact),'clean_chars':len(clean),'invalid_chars':bad,'decoded_bytes':len(raw),'observed_sha256':observed,'expected_sha256':expected}
          Path('artifact/CARRIER_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          if observed != expected:
              raise SystemExit(f'source SHA mismatch: {observed}')
          Path('artifact/source.tar.gz').write_bytes(raw)
          PY
          tar -xzf "$out/source.tar.gz" -C "$out/materialized"
          python -m py_compile "$out/materialized"/*.py
          (cd "$out" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: pr597-exact-source-r48-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
