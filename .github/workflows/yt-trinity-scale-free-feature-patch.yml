name: YT Trinity scale-free premium and ML feature patch

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-scale-free-feature-patch.yml
      - research/yt_trinity_ml/apply_scale_free_feature_patch.py

permissions:
  contents: write

concurrency:
  group: yt-trinity-scale-free-feature-patch
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply deterministic feature patch
        run: python research/yt_trinity_ml/apply_scale_free_feature_patch.py
      - name: Install deterministic test dependencies
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q numpy pandas scikit-learn pyarrow pytest
      - name: Compile and test scale-free feature invariants
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -euo pipefail
          python -m py_compile \
            research/yt_trinity_ml/system/core.py \
            research/yt_trinity_ml/system/model.py
          pytest -q \
            research/yt_trinity_ml/tests/test_scale_free_model_features.py \
            research/yt_trinity_ml/tests/test_action_value_model.py \
            research/yt_trinity_ml/tests/test_yt_trinity_system.py \
            research/yt_trinity_ml/tests/test_regressions.py
      - name: Persist tested feature contract
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/yt_trinity_ml/system/core.py \
            research/yt_trinity_ml/system/model.py \
            research/yt_trinity_ml/tests/test_scale_free_model_features.py
          git add -u research/yt_trinity_ml/apply_scale_free_feature_patch.py .github/workflows/yt-trinity-scale-free-feature-patch.yml || true
          rm -f research/yt_trinity_ml/apply_scale_free_feature_patch.py .github/workflows/yt-trinity-scale-free-feature-patch.yml
          git add -u research/yt_trinity_ml/apply_scale_free_feature_patch.py .github/workflows/yt-trinity-scale-free-feature-patch.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use scale-free premium and structural ML features'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
