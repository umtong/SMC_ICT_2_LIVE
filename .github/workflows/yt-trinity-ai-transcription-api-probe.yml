name: YT Trinity documented AI transcription API probe

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/probe_ai_transcription_api_surface.py
      - control/yt-trinity-ai-transcription-api-trigger.json
      - .github/workflows/yt-trinity-ai-transcription-api-probe.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-ai-transcription-api-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            key: Linux
          - os: macos-14
            key: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependency
        run: python -m pip install -q --upgrade requests
      - name: Discover and safely test documented transcription operations
        run: |
          mkdir -p artifact/ai-transcription
          python research/yt_trinity_ml/probe_ai_transcription_api_surface.py \
            --output artifact/ai-transcription \
            --workers 8 \
            2>&1 | tee artifact/ai-transcription/STDOUT.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-ai-transcription-api-${{ matrix.key }}-${{ github.sha }}
          path: artifact/ai-transcription
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
      - name: Persist result and validated winner
        if: always()
        run: |
          result_source="artifact/ai-transcription/result.json"
          winner_source="artifact/ai-transcription/winner.json"
          result_target="research/yt_trinity_ml/AI_TRANSCRIPTION_API_${{ matrix.key }}.json"
          winner_target="research/yt_trinity_ml/AI_TRANSCRIPTION_API_WINNER_${{ matrix.key }}.json"
          if [[ -f "$result_source" ]]; then cp "$result_source" "$result_target"; fi
          if [[ -f "$winner_source" ]]; then
            cp "$winner_source" "$winner_target"
          elif [[ -f "$winner_target" ]]; then
            rm -f "$winner_target"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$result_target"
          if [[ -f "$winner_target" ]]; then git add "$winner_target"; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record ${{ matrix.key }} AI transcription API probe ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
