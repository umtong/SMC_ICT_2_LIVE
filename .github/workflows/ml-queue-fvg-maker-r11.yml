name: ML queue-aware Sweep-MSS-FVG maker

on:
  push:
    branches:
      - agent/r11-ml-queue-fvg-maker-001
    paths:
      - "research/ml_queue_fvg_maker_20260726/**"
      - ".github/workflows/ml-queue-fvg-maker-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/ml_queue_fvg_maker_20260726/**"
      - ".github/workflows/ml-queue-fvg-maker-r11.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ml-queue-fvg-maker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  TZ: UTC
  ROOT: research/ml_queue_fvg_maker_20260726
  RUNNER: research/ml_queue_fvg_maker_20260726/reconstructed/run.py
  TESTS: research/ml_queue_fvg_maker_20260726/reconstructed/test_run.py
  CACHE: /tmp/ml-queue-fvg-maker-r11
  OUT: ${{ github.workspace }}/research_runs/ml_queue_fvg_maker_20260726

jobs:
  causal-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen environment
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.1.3" "pandas==2.2.3" \
            "scikit-learn==1.5.2" "pytest==8.3.4"

      - name: Verify source, causality and project contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python "$ROOT/reconstruct.py" | tee "$OUT/reconstruct.log"
          python -m py_compile \
            "$ROOT/reconstructed/core.py" \
            "$ROOT/reconstructed/execution.py" \
            "$RUNNER" "$TESTS"
          PYTHONPATH="$ROOT/reconstructed" pytest -q "$TESTS" \
            2>&1 | tee "$OUT/tests.log"
          PYTHONPATH="$ROOT/reconstructed" python "$RUNNER" self-test \
            2>&1 | tee "$OUT/self_test.log"
          python scripts/validate_project.py
          sha256sum \
            "$ROOT/WORK_CLAIM.json" \
            "$ROOT/preregistration.json" \
            "$ROOT/SOURCE_TRANSPORT.json" \
            "$ROOT/reconstructed/core.py" \
            "$ROOT/reconstructed/execution.py" \
            "$RUNNER" "$TESTS" \
            > "$OUT/INPUT_SHA256SUMS.txt"

      - uses: actions/cache@v4
        with:
          path: /tmp/ml-queue-fvg-maker-r11
          key: ml-queue-fvg-maker-r11-${{ runner.os }}-${{ hashFiles('research/ml_queue_fvg_maker_20260726/preregistration.json') }}
          restore-keys: |
            ml-queue-fvg-maker-r11-${{ runner.os }}-

      - name: Replay exact raw queue and account paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/output"
          PYTHONPATH="$ROOT/reconstructed" python "$RUNNER" run \
            --cache "$CACHE" \
            --output "$OUT/output" \
            2>&1 | tee "$OUT/run.log"

      - name: Enforce frozen result and sealed years
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["OUT"]) / "output"
          result = json.loads((root / "RESULT.json").read_text())
          manifest = json.loads((root / "SOURCE_MANIFEST.json").read_text())
          assert result["claim_id"] == "CLM-20260726-ML-QUEUE-FVG-MAKER-001"
          assert result["result_id"] == "RES-20260726-ML-QUEUE-FVG-MAKER-001"
          assert result["hard_validity"] in {
              "PASS_INITIAL_EVENT_SCARCITY",
              "PASS_FATAL_SCREEN_ONLY",
          }
          assert result["2024_opened"] is False
          assert result["2025_opened"] is False
          assert result["2026_opened"] is False
          assert result["orders_submitted"] is False
          assert result["rank_eligible"] is False
          assert len(manifest["sources"]) == 4
          assert all("/2024/" not in item["url"] for item in manifest["sources"])
          assert all("/2025/" not in item["url"] for item in manifest["sources"])
          assert all("/2026/" not in item["url"] for item in manifest["sources"])
          print("SEALED_RESULT_PASS")
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Record immutable output hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find "$OUT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$OUT/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-queue-fvg-maker-${{ github.sha }}
          path: research_runs/ml_queue_fvg_maker_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Commit decision-ready compact result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          target=research_results/r11_ml_queue_fvg_maker_001
          rm -rf "$target"
          mkdir -p "$target"
          cp "$OUT/output/RESULT.json" "$target/result.json"
          cp "$OUT/output/SOURCE_MANIFEST.json" "$target/SOURCE_MANIFEST.json"
          for name in MODEL_DIAGNOSTICS.json FIT_METRICS.json DEVELOPMENT_SCREEN.csv; do
            if test -f "$OUT/output/$name"; then
              cp "$OUT/output/$name" "$target/$name"
            fi
          done
          cp "$OUT/INPUT_SHA256SUMS.txt" "$target/INPUT_SHA256SUMS.txt"
          cp "$OUT/OUTPUT_SHA256SUMS.txt" "$target/OUTPUT_SHA256SUMS.txt"
          tail -n 300 "$OUT/run.log" > "$target/RUN_TAIL.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record ML queue-aware maker result"
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${branch}"
