name: ML xasset spillover pre-2024 snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-ml-xasset-spillover-001
    paths:
      - research/ml_xasset_spillover_20260727/build_pre2024_snapshot.py
      - .github/workflows/ml-xasset-spillover-snapshot.yml
  pull_request:
    branches:
      - main
    paths:
      - research/ml_xasset_spillover_20260727/build_pre2024_snapshot.py
      - .github/workflows/ml-xasset-spillover-snapshot.yml

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-pre2024-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned builder dependencies
        run: python -m pip install "numpy==2.3.1" "requests==2.32.4"
      - name: Build strict 2023 snapshot
        run: |
          python research/ml_xasset_spillover_20260727/build_pre2024_snapshot.py \
            --start 2023-01 \
            --end 2023-12 \
            --workers 8 \
            --out artifact/pre2024_snapshot
      - name: Upload immutable snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ml-xasset-spillover-pre2024-snapshot
          path: artifact/pre2024_snapshot
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
