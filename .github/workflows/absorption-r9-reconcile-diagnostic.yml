name: Diagnose and reconcile revision-9 absorption PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/absorption-r9-reconcile-diagnostic.trigger'
      - '.github/workflows/absorption-r9-reconcile-diagnostic.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r9-absorption-register-20260726
          fetch-depth: 0
          persist-credentials: true
      - name: Merge, resolve append-only state and capture diagnostics
        id: reconcile
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/r9-diagnostics
          cp control/current-state.md /tmp/r9-current-state.md
          cp control/ranking.json /tmp/r9-ranking.json
          git fetch origin main > /tmp/r9-diagnostics/fetch.log 2>&1
          git merge --no-ff --no-commit origin/main > /tmp/r9-diagnostics/merge.log 2>&1
          merge_rc=$?
          cp /tmp/r9-current-state.md control/current-state.md
          cp /tmp/r9-ranking.json control/ranking.json
          python - <<'PY' > /tmp/r9-diagnostics/union.log 2>&1
          import csv, io, json, pathlib, subprocess
          def show(ref,path):
            p=subprocess.run(['git','show',f'{ref}:{path}'],text=True,capture_output=True)
            return p.stdout if p.returncode==0 else ''
          for path,key in {
            'control/result-registry.jsonl':'result_id',
            'control/validation-cache.jsonl':'attestation_id',
            'data/catalog/dataset-registry.jsonl':'dataset_id',
          }.items():
            rows=[]; seen=set()
            for text in (show('origin/main',path),show('HEAD',path)):
              for raw in text.splitlines():
                if not raw.strip(): continue
                obj=json.loads(raw); ident=str(obj.get(key,''))
                if ident in seen: continue
                seen.add(ident); rows.append(obj)
            pathlib.Path(path).parent.mkdir(parents=True,exist_ok=True)
            pathlib.Path(path).write_text('\n'.join(json.dumps(x,separators=(',',':'),ensure_ascii=False) for x in rows)+'\n',encoding='utf-8')
            subprocess.run(['git','add',path],check=True)
          path='control/work-claims.csv'
          header=None; rows=[]; seen=set()
          for text in (show('origin/main',path),show('HEAD',path)):
            if not text.strip(): continue
            reader=csv.DictReader(io.StringIO(text))
            if header is None: header=reader.fieldnames
            for row in reader:
              ident=row.get('claim_id','')
              if ident in seen: continue
              seen.add(ident); rows.append(row)
          out=io.StringIO(); writer=csv.DictWriter(out,fieldnames=header,lineterminator='\n'); writer.writeheader(); writer.writerows(rows)
          pathlib.Path(path).write_text(out.getvalue(),encoding='utf-8')
          subprocess.run(['git','add',path],check=True)
          PY
          union_rc=$?
          git add control/current-state.md control/ranking.json
          git status --short > /tmp/r9-diagnostics/status.txt
          git diff --name-only --diff-filter=U > /tmp/r9-diagnostics/unmerged.txt
          python scripts/validate_project.py > /tmp/r9-diagnostics/validator.log 2>&1
          validator_rc=$?
          python -m pytest -q > /tmp/r9-diagnostics/pytest.log 2>&1
          pytest_rc=$?
          python scripts/build_context_bundle.py > /tmp/r9-diagnostics/context.log 2>&1
          context_rc=$?
          printf 'merge_rc=%s\nunion_rc=%s\nvalidator_rc=%s\npytest_rc=%s\ncontext_rc=%s\n' "$merge_rc" "$union_rc" "$validator_rc" "$pytest_rc" "$context_rc" > /tmp/r9-diagnostics/return-codes.txt
          remaining=$(cat /tmp/r9-diagnostics/unmerged.txt)
          if [ -z "$remaining" ] && [ "$union_rc" -eq 0 ] && [ "$validator_rc" -eq 0 ] && [ "$pytest_rc" -eq 0 ] && [ "$context_rc" -eq 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm -f .github/absorption-r9-main-reconcile.trigger .github/workflows/absorption-r9-main-reconcile.yml .github/absorption-r9-reconcile-diagnostic.trigger .github/workflows/absorption-r9-reconcile-diagnostic.yml
            git commit -m 'Merge latest main into revision-9 absorption result'
            git push origin HEAD:agent/r9-absorption-register-20260726
            echo 'success=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'success=false' >> "$GITHUB_OUTPUT"
          exit 1
      - name: Upload reconciliation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: absorption-r9-reconciliation-diagnostics-${{ github.run_id }}
          path: /tmp/r9-diagnostics
          if-no-files-found: error
          retention-days: 14
