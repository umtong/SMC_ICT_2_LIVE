name: Uniswap inventory-transfer ML economic continuation

on:
  push:
    branches:
      - agent/r20-ml-uniswap-economic-001
    paths:
      - '.github/workflows/ml-uniswap-economic-r20.yml'
      - 'research/ml_uniswap_hedge_transfer_economic_20260726/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-uniswap-economic-r20.yml'
      - 'research/ml_uniswap_hedge_transfer_economic_20260726/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ml-uniswap-economic-r20-${{ github.sha }}
  cancel-in-progress: false

jobs:
  economic:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 pandas==2.2.3 requests==2.32.4 \
            scikit-learn==1.6.1 pyarrow==18.1.0 pytest==8.3.5
      - name: Reconstruct and validate frozen economic engine
        run: |
          set -euo pipefail
          root=research/ml_uniswap_hedge_transfer_economic_20260726
          validation="$RUNNER_TEMP/uniswap-economic-validation"
          mkdir -p "$validation"
          python "$root/reconstruct.py"
          python -m py_compile "$root/run.py" "$root/test_run.py" "$root/reconstruct.py"
          PYTHONPATH="$root" pytest -q "$root/test_run.py" 2>&1 | tee "$validation/PYTEST.log"
          PYTHONPATH="$root" python "$root/run.py" self-test 2>&1 | tee "$validation/SELF_TEST.log"
          python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$root/FROZEN_CONTRACT.json" >/dev/null
          python -m json.tool "$root/BUNDLE_MANIFEST.json" >/dev/null
          python -m json.tool "$root/IMPLEMENTATION_FREEZE_001_BEFORE_SOURCE_PASS.json" >/dev/null
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('research/ml_uniswap_hedge_transfer_economic_20260726')
          contract=json.loads((root/'FROZEN_CONTRACT.json').read_text())
          observed=hashlib.sha256(json.dumps(contract,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          manifest=json.loads((root/'BUNDLE_MANIFEST.json').read_text())
          assert observed==manifest['contract_sha256'], (observed,manifest['contract_sha256'])
          assert contract['execution']['elapsed_time_liquidation'] is False
          assert contract['official_2024_2026_opened'] is False
          print('contract hash PASS', observed)
          PY
          set +e
          python scripts/validate_project.py 2>&1 | tee "$validation/PROJECT_VALIDATION.log"
          echo ${PIPESTATUS[0]} > "$validation/PROJECT_VALIDATION_EXIT_CODE.txt"
          set -e
      - id: source
        name: Consume first decision-ready parent source PASS
        shell: bash
        run: |
          set -euo pipefail
          out=research_runs/ml_uniswap_hedge_transfer_economic_20260726
          download="$RUNNER_TEMP/uniswap-parent-download"
          mkdir -p "$out/source" "$download"
          selected=0
          for attempt in $(seq 1 45); do
            mapfile -t runs < <(gh run list --repo "$GITHUB_REPOSITORY" \
              --branch agent/r14-ml-uniswap-hedge-transfer-001 --limit 100 \
              --json databaseId,name,status,conclusion,createdAt \
              --jq '.[] | select(.name == "ML Uniswap WETH-stable inventory source gate" and .status == "completed") | .databaseId')
            for run_id in "${runs[@]:-}"; do
              [ -n "$run_id" ] || continue
              rm -rf "$download"/*
              if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --dir "$download" >/dev/null 2>&1; then
                continue
              fi
              while IFS= read -r probe; do
                set +e
                python - <<'PY' "$probe"
          import json, sys
          p=json.load(open(sys.argv[1]))
          assert p['claim_id']=='CLM-20260726-2110-ML-UNISWAP-HEDGE-TRANSFER-001'
          assert p['source_gate_pass'] is True
          assert p['scientific_decision']=='OPEN_FROZEN_PRE2024_HISTORY_AND_MODEL_STAGE'
          assert p['market_outcome_opened'] is False
          assert p['model_fit'] is False
          assert p['trade_or_pnl_opened'] is False
          assert p['official_2024_2026_opened'] is False
          assert p['orders_submitted'] is False
          assert all(bool(value) for value in p['source_gate_checks'].values())
          assert p['forbidden_outcome_fields']==['future_return','label','action','trade','pnl','model_metric','official_2024_2026']
          PY
                rc=$?
                set -e
                if [ "$rc" = 0 ]; then
                  cp "$probe" "$out/source/PROBE_RESULT.json"
                  echo "$run_id" > "$out/source/PARENT_RUN_ID.txt"
                  selected=1
                  break 2
                fi
                printf '%s\t%s\n' "$run_id" "$probe" >> "$out/source/REJECTED_PARENT_RESULTS.tsv"
              done < <(find "$download" -type f -name PROBE_RESULT.json | sort)
            done
            if [ "$selected" = 1 ]; then break; fi
            echo "decision-ready Uniswap source PASS not yet available: attempt $attempt" >&2
            sleep 60
          done
          if [ "$selected" != 1 ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          out=Path('research_runs/ml_uniswap_hedge_transfer_economic_20260726')
          payload={
            'schema_version':1,
            'claim_id':'CLM-20260726-2110-ML-UNISWAP-HEDGE-TRANSFER-001',
            'continuation_id':'EXEC-20260726-ML-UNISWAP-ECONOMIC-001',
            'status':'NO_DECISION_READY_SOURCE_PASS',
            'source_pass_consumed':False,
            'market_outcome_opened':False,
            'model_fit':False,
            'official_2024h1_opened':False,
            'official_2024_2026_opened':False,
            'orders_submitted':False,
          }
          (out/'RESULT.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          else
            echo "parent_probe=$out/source/PROBE_RESULT.json" >> "$GITHUB_OUTPUT"
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run frozen pre-2024 history, HGBT and account screen
        if: steps.source.outputs.authorized == 'true'
        shell: bash
        run: |
          set -u
          root=research/ml_uniswap_hedge_transfer_economic_20260726
          out=research_runs/ml_uniswap_hedge_transfer_economic_20260726
          mkdir -p "$out/economic" "$out/cache"
          set +e
          PYTHONPATH="$root" python "$root/run.py" run \
            --parent-probe "${{ steps.source.outputs.parent_probe }}" \
            --cache "$out/cache" \
            --output "$out/economic" 2>&1 | tee "$out/economic/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$out/economic/RUN_EXIT_CODE.txt"
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then exit "$rc"; fi
          test -f "$out/economic/RESULT.json"
          python -m json.tool "$out/economic/RESULT.json" >/dev/null
      - name: Enforce authority and immediate research decision
        if: always()
        run: |
          set -euo pipefail
          out=research_runs/ml_uniswap_hedge_transfer_economic_20260726
          if [ -f "$out/economic/RESULT.json" ]; then
            result="$out/economic/RESULT.json"
          else
            result="$out/RESULT.json"
          fi
          python - <<'PY' "$result"
          import json, sys
          r=json.load(open(sys.argv[1]))
          assert r['claim_id']=='CLM-20260726-2110-ML-UNISWAP-HEDGE-TRANSFER-001'
          assert r['orders_submitted'] is False
          assert r.get('official_2024h1_opened',False) is False
          assert r.get('official_2024_2026_opened',False) is False
          status=r['status']
          if status=='PRE2024_SURVIVOR_READY_FOR_EXACT_BYBIT_AND_SEQUENTIAL_2024H1':
              assert r['confirmation_gate']['all'] is True
              assert r['development_gate']['all'] is True
              print('IMMEDIATE_NEXT_STAGE=EXACT_BYBIT_PRE2024_RISK_FREEZE_THEN_2024H1')
          elif status in {'CONFIRMATION_BELOW_GATE_RETIRE_INFORMATION_UNIT','DEVELOPMENT_BELOW_GATE_RETIRE_INFORMATION_UNIT'}:
              print('IMMEDIATE_NEXT_STAGE=RETIRE_AND_CHANGE_ALPHA')
          elif status=='NO_DECISION_READY_SOURCE_PASS':
              print('IMMEDIATE_NEXT_STAGE=SOURCE_DECISION_REQUIRED')
          else:
              print('IMMEDIATE_NEXT_STAGE=FIX_EXECUTION_FAILURE_WITHOUT_CHANGING_SCIENCE')
          print(json.dumps({'status':status,'official_2024h1_opened':r.get('official_2024h1_opened',False)},sort_keys=True))
          PY
      - name: Freeze immutable evidence hashes
        if: always()
        run: |
          set -euo pipefail
          root=research/ml_uniswap_hedge_transfer_economic_20260726
          out=research_runs/ml_uniswap_hedge_transfer_economic_20260726
          validation="$RUNNER_TEMP/uniswap-economic-validation"
          mkdir -p "$out/inputs"
          cp "$root"/{WORK_CLAIM.json,IMPLEMENTATION_FREEZE_001_BEFORE_SOURCE_PASS.json,FROZEN_CONTRACT.json,BUNDLE_MANIFEST.json,README.md,reconstruct.py} "$out/inputs/"
          cp "$root"/*.gz.b64.part* "$out/inputs/"
          cp "$root"/{run.py,test_run.py} "$out/inputs/"
          cp "$validation"/* "$out/inputs/" 2>/dev/null || true
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-uniswap-economic-r20-${{ github.sha }}
          path: research_runs/ml_uniswap_hedge_transfer_economic_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
