name: Minimal supervised 90-minute PO3 router

on:
  push:
    branches:
      - agent/r11-ml-90m-po3-001
    paths:
      - "research/ml_90m_po3_20260726/**"
      - ".github/workflows/ml-90m-po3-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/ml_90m_po3_20260726/**"
      - ".github/workflows/ml-90m-po3-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ml-90m-po3-r11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  TZ: UTC
  CACHE: /tmp/ml-90m-po3-r11
  OUT: ${{ github.workspace }}/research_runs/ml_90m_po3_20260726
  ROOT: research/ml_90m_po3_20260726
  RUNNER: research/ml_90m_po3_20260726/reconstructed/run.py
  TESTS: research/ml_90m_po3_20260726/reconstructed/test_run.py

jobs:
  causal-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 scikit-learn==1.5.2 requests==2.32.3 pytest==8.3.4
      - name: Validate project and causal engine
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          {
            python scripts/validate_project.py
            wc -c "$ROOT"/source_bundle.tar.gz.b64.part*
            sha256sum "$ROOT"/source_bundle.tar.gz.b64.part*
            python "$ROOT/reconstruct.py"
            python -m py_compile "$RUNNER" "$TESTS"
            PYTHONPATH="$ROOT/reconstructed" pytest -q "$TESTS"
            PYTHONPATH="$ROOT/reconstructed" python "$RUNNER" self-test
            python -m json.tool "$ROOT/WORK_CLAIM.json" >/dev/null
            python -m json.tool "$ROOT/preregistration.json" >/dev/null
            sha256sum "$RUNNER" "$TESTS" "$ROOT/reconstruct.py" "$ROOT/source_manifest.json" "$ROOT/preregistration.json" "$ROOT/WORK_CLAIM.json" "$ROOT/README.md" "$ROOT/SOURCES.md"
          } 2>&1 | tee "$OUT/validation.log"
      - uses: actions/cache@v4
        with:
          path: /tmp/ml-90m-po3-r11
          key: ml-90m-po3-r11-${{ runner.os }}-${{ hashFiles('research/ml_90m_po3_20260726/preregistration.json', 'research/ml_90m_po3_20260726/source_manifest.json') }}
          restore-keys: |
            ml-90m-po3-r11-${{ runner.os }}-
      - name: Run frozen staged screen
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          PYTHONPATH="$ROOT/reconstructed" python "$RUNNER" run --cache "$CACHE" --output "$OUT" 2>&1 | tee "$OUT/run.log"
      - name: Enforce minimal system and seals
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ["OUT"])
          summary_path = out / "summary.json"
          if not summary_path.exists():
              (out / "wrapper_status.json").write_text(json.dumps({
                  "hard_validity": "INCOMPLETE",
                  "2024_opened": False,
                  "orders_submitted": False,
                  "reason": "missing summary.json"
              }, indent=2, sort_keys=True) + "\n")
              raise SystemExit("missing summary.json")
          summary = json.loads(summary_path.read_text())
          assert summary["hard_validity"] == "PASS"
          assert summary["engine_version"] == "FIXED_90M_SUPERVISED_PO3_LOGIT_V1"
          assert summary["model_count"] == 1
          assert summary["feature_count"] == 8
          assert summary["strategy_route_count"] == 1
          assert summary["threshold_candidates"] == [0.55, 0.65, 0.75]
          assert summary["orders_submitted"] is False
          assert summary["paper_live_enabled"] is False
          if not summary["development_gate_pass"]:
              assert summary["2024_opened"] is False
              assert summary["2025_opened"] is False
              assert summary["2026_opened"] is False
          (out / "wrapper_status.json").write_text(json.dumps({
              "hard_validity": "PASS",
              "economic_status": summary["economic_status"],
              "calibration_survivor_count": summary["calibration_survivor_count"],
              "selected_threshold": summary["selected_threshold"],
              "development_opened": summary["development_opened"],
              "sequential_opened": summary["sequential_2024_2026_opened"],
              "orders_submitted": False
          }, indent=2, sort_keys=True) + "\n")
          print("SEALED_MINIMAL_ML_RESEARCH_PASS")
          PY
      - name: Record immutable output hashes
        if: always()
        run: |
          mkdir -p "$OUT"
          find "$OUT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-90m-po3-r11-${{ github.sha }}
          path: research_runs/ml_90m_po3_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
