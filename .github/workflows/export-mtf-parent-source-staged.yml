name: Export exact MTF parent source for staged-entry audit

on:
  push:
    branches: [agent/r23-mtf-staged-risk-001]
    paths:
      - '.github/workflows/export-mtf-parent-source-staged.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-mtf-parent-source-staged.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export-parent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r23-mtf-staged-risk-001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact parent runtime dependencies
        run: python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'numba==0.61.0'
      - name: Recover exact PR 430 parent tree and materialize source
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mtf-parent"
          mkdir -p "$out"
          git fetch --no-tags --depth=1 origin agent/r23-mtf-confluence-daytrade-001
          git archive --format=tar FETCH_HEAD research/mtf_confluence_daytrade | tar -xf - -C "$out"
          root="$out/research/mtf_confluence_daytrade"
          python "$root/materialize.py"
          python -m py_compile "$root/run.py" "$root/evaluate.py"
          python "$root/run.py" --self-test
          find "$root" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS.txt"
          cp "$root/RESULT.json" "$out/PARENT_RESULT.json"
          cp "$root/inventory.csv" "$out/PARENT_INVENTORY.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: exact-mtf-parent-for-staged-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mtf-parent
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
