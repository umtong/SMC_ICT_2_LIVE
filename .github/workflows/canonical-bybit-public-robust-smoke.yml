name: Canonical Bybit robust historical trade build

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/market_data/build_public_trade_compact_robust.py
      - tests/test_public_trade_compact_robust.py
      - .github/workflows/canonical-bybit-public-robust-smoke.yml
  push:
    branches:
      - agent/r22-canonical-halfyear-market-data-001
    paths:
      - scripts/market_data/build_public_trade_compact_robust.py
      - tests/test_public_trade_compact_robust.py
      - .github/workflows/canonical-bybit-public-robust-smoke.yml
  workflow_dispatch:

concurrency:
  group: canonical-bybit-robust-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {symbol: BTCUSDT, month: "2021-01"}
          - {symbol: BTCUSDT, month: "2021-02"}
          - {symbol: BTCUSDT, month: "2021-03"}
          - {symbol: BTCUSDT, month: "2021-04"}
          - {symbol: BTCUSDT, month: "2021-05"}
          - {symbol: BTCUSDT, month: "2021-07"}
          - {symbol: BTCUSDT, month: "2021-08"}
          - {symbol: BTCUSDT, month: "2021-09"}
          - {symbol: BTCUSDT, month: "2021-10"}
          - {symbol: BTCUSDT, month: "2021-11"}
          - {symbol: BTCUSDT, month: "2021-12"}
          - {symbol: ETHUSDT, month: "2021-03"}
          - {symbol: ETHUSDT, month: "2021-04"}
          - {symbol: ETHUSDT, month: "2021-05"}
          - {symbol: ETHUSDT, month: "2021-06"}
          - {symbol: ETHUSDT, month: "2021-07"}
          - {symbol: ETHUSDT, month: "2021-08"}
          - {symbol: ETHUSDT, month: "2021-09"}
          - {symbol: ETHUSDT, month: "2021-10"}
          - {symbol: ETHUSDT, month: "2021-11"}
          - {symbol: ETHUSDT, month: "2021-12"}
          - {symbol: SOLUSDT, month: "2021-10"}
          - {symbol: SOLUSDT, month: "2021-11"}
          - {symbol: SOLUSDT, month: "2021-12"}
          - {symbol: XRPUSDT, month: "2021-05"}
          - {symbol: XRPUSDT, month: "2021-06"}
          - {symbol: XRPUSDT, month: "2021-07"}
          - {symbol: XRPUSDT, month: "2021-08"}
          - {symbol: XRPUSDT, month: "2021-09"}
          - {symbol: XRPUSDT, month: "2021-10"}
          - {symbol: XRPUSDT, month: "2021-11"}
          - {symbol: XRPUSDT, month: "2021-12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[dev]"
      - name: Run robust ordering unit tests
        run: python -m pytest -q tests/test_public_trade_compact_robust.py
      - name: Build historical month
        run: |
          python scripts/market_data/build_public_trade_compact_robust.py \
            --symbol "${{ matrix.symbol }}" \
            --month "${{ matrix.month }}" \
            --out artifact
      - name: Repack and verify compact lower-time shard
        shell: bash
        run: |
          shard="artifact/PRE_2024/${{ matrix.symbol }}/${{ matrix.month }}"
          python scripts/market_data/repack_public_trade_compact_v5.py "$shard"
          python scripts/market_data/verify_public_trade_compact_v5.py "$shard" \
            | tee "$shard/VERIFICATION.json"
          find "$shard" -type f -printf '%P\t%s\n' | sort \
            | tee "$shard/FILE_SIZES.tsv"
          test "$(stat -c %s "$shard/micro_bars/500ms_observed_v5.parquet")" -lt 104857600
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-bybit-robust-v5-${{ matrix.symbol }}-${{ matrix.month }}
          path: artifact/PRE_2024/${{ matrix.symbol }}/${{ matrix.month }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
