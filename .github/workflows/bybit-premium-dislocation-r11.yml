name: Bybit native premium-dislocation fatal screen

on:
  push:
    branches:
      - agent/r11-bybit-premium-dislocation-001
    paths:
      - "research/bybit_premium_dislocation_20260726/**"
      - ".github/workflows/bybit-premium-dislocation-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/bybit_premium_dislocation_20260726/**"
      - ".github/workflows/bybit-premium-dislocation-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bybit-premium-dislocation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fatal-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen research environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "requests==2.32.4"

      - uses: actions/cache@v4
        with:
          path: .cache/bybit-premium-dislocation
          key: bybit-premium-dislocation-v1-20211220-20240101

      - name: Compile and run causal self-test
        run: |
          set -euo pipefail
          root=research/bybit_premium_dislocation_20260726
          mkdir -p research_runs/bybit_premium_dislocation
          python "$root/reconstruct.py" \
            2>&1 | tee research_runs/bybit_premium_dislocation/reconstruct.log
          cp "$root/RECONSTRUCTED_SOURCE.json" \
            research_runs/bybit_premium_dislocation/RECONSTRUCTED_SOURCE.json
          python -m py_compile "$root/reconstruct.py" "$root/run_screen.py"
          python "$root/run_screen.py" self-test \
            | tee research_runs/bybit_premium_dislocation/self_test.json

      - name: Probe every frozen Bybit public source
        run: |
          set -euo pipefail
          root=research/bybit_premium_dislocation_20260726
          mkdir -p research_runs/bybit_premium_dislocation/probe
          python "$root/run_screen.py" probe \
            --cache .cache/bybit-premium-dislocation/probe \
            --output research_runs/bybit_premium_dislocation/probe \
            2>&1 | tee research_runs/bybit_premium_dislocation/probe.log

      - name: Run frozen 2022 fit and 2023 development screen
        run: |
          set -euo pipefail
          root=research/bybit_premium_dislocation_20260726
          mkdir -p research_runs/bybit_premium_dislocation/output
          python "$root/run_screen.py" run \
            --cache .cache/bybit-premium-dislocation/full \
            --output research_runs/bybit_premium_dislocation/output \
            2>&1 | tee research_runs/bybit_premium_dislocation/screen.log

      - name: Verify sealed boundary and project integrity
        run: |
          set -euo pipefail
          (cd research_runs/bybit_premium_dislocation/output && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("research_runs/bybit_premium_dislocation/output/RESULT.json").read_text())
          assert result["2024_opened"] is False
          assert result["2025_or_2026_opened"] is False
          assert result["orders_submitted"] is False
          assert result["rank_eligible"] is False
          print(json.dumps({
              "status": result["status"],
              "hard_validity": result["hard_validity_status"],
              "economic": result["economic_status"],
              "survivors": result.get("survivor_count"),
          }, sort_keys=True))
          PY
          python scripts/validate_project.py

      - name: Record immutable input hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research_runs/bybit_premium_dislocation
          sha256sum \
            research/bybit_premium_dislocation_20260726/WORK_CLAIM.json \
            research/bybit_premium_dislocation_20260726/preregistration.json \
            research/bybit_premium_dislocation_20260726/source_transport_amendment.json \
            research/bybit_premium_dislocation_20260726/README.md \
            research/bybit_premium_dislocation_20260726/reconstruct.py \
            research/bybit_premium_dislocation_20260726/run_screen.py.gz.b64 \
            .github/workflows/bybit-premium-dislocation-r11.yml \
            > research_runs/bybit_premium_dislocation/INPUT_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bybit-premium-dislocation-${{ github.sha }}
          path: research_runs/bybit_premium_dislocation
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
