name: Analyze pre-2024 real-account decision behavior

on:
  push:
    branches: [agent/r36-real-account-behavior-decomp-001]
    paths:
      - '.github/workflows/real-account-behavior-decomp-r36.yml'
      - 'research/real_account_behavior_decomp/CONTRACT.json'
      - 'research/real_account_behavior_decomp/RUN_SOURCE.py.gz.b64'
      - 'research/real_account_behavior_decomp/SOURCE_MANIFEST.json'
  pull_request:
    paths:
      - '.github/workflows/real-account-behavior-decomp-r36.yml'
      - 'research/real_account_behavior_decomp/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-account-behavior-decomp-r36-${{ github.sha }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      SOURCE_COMMIT: 'f02a691c7f7cfd0cd08ffb7f13a656ebaf2c6ca6'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r36-real-account-behavior-decomp-001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen analysis runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade 'pip==25.1.1'
          python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'tabulate==0.9.0'
      - name: Materialize and verify corrected analysis source
        run: |
          set -euo pipefail
          root=research/real_account_behavior_decomp
          mkdir -p "$root/materialized"
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          root=Path('research/real_account_behavior_decomp')
          m=json.loads((root/'SOURCE_MANIFEST.json').read_text())
          b64=''.join((root/'RUN_SOURCE.py.gz.b64').read_text().split())
          assert len(b64)==m['base64_chars']
          gz=base64.b64decode(b64)
          assert hashlib.sha256(gz).hexdigest()==m['gzip_sha256']
          raw=gzip.decompress(gz)
          assert hashlib.sha256(raw).hexdigest()==m['source_sha256']
          assert len(raw)==m['source_bytes']
          out=root/'materialized'/m['source_file']
          out.write_bytes(raw)
          print(out)
          PY
          python -m py_compile "$root/materialized/run_analysis.py"
      - name: Checkout and verify exact public source
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/BTC-Trading-Since-2020"
          git clone --filter=blob:none --no-checkout https://github.com/bwjoke/BTC-Trading-Since-2020.git "$src"
          git -C "$src" fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C "$src" checkout --detach "$SOURCE_COMMIT"
          test "$(git -C "$src" rev-parse HEAD)" = "$SOURCE_COMMIT"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'BTC-Trading-Since-2020'
          manifest=json.loads((src/'manifest.json').read_text())
          required={'api-v1-execution-tradeHistory.csv','api-v1-order.csv','api-v1-user-walletHistory.csv'}
          entries={x['file']:x for x in manifest['files']}
          assert required <= set(entries)
          observed={}
          for name in sorted(required):
              path=src/name
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              expected=entries[name]['sha256']
              assert digest==expected, (name,digest,expected)
              observed[name]=digest
          pin={
              'source_commit':os.environ['SOURCE_COMMIT'],
              'manifest_sha256':hashlib.sha256((src/'manifest.json').read_bytes()).hexdigest(),
              'manifest_generated_at':manifest['generated_at'],
              'required_file_sha256':observed,
          }
          (Path(os.environ['RUNNER_TEMP'])/'SOURCE_PIN_WORKFLOW.json').write_text(json.dumps(pin,sort_keys=True,indent=2)+'\n')
          print(json.dumps(pin,sort_keys=True))
          PY
      - name: Run cutoff-enforced corrected decomposition twice
        run: |
          set -euo pipefail
          root=research/real_account_behavior_decomp
          src="$RUNNER_TEMP/BTC-Trading-Since-2020"
          out1="$RUNNER_TEMP/behavior_out_1"
          out2="$RUNNER_TEMP/behavior_out_2"
          python "$root/materialized/run_analysis.py" --source-dir "$src" --output "$out1" --source-commit "$SOURCE_COMMIT"
          python "$root/materialized/run_analysis.py" --source-dir "$src" --output "$out2" --source-commit "$SOURCE_COMMIT"
          diff -qr "$out1" "$out2"
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected=json.loads((Path(os.environ['RUNNER_TEMP'])/'SOURCE_PIN_WORKFLOW.json').read_text())
          actual=json.loads((Path(os.environ['RUNNER_TEMP'])/'behavior_out_1'/'SOURCE_PIN.json').read_text())
          assert actual['source_commit']==expected['source_commit']
          assert actual['manifest_sha256']==expected['manifest_sha256']
          assert actual['manifest_generated_at']==expected['manifest_generated_at']
          for name,digest in expected['required_file_sha256'].items():
              assert actual['verified_files'][name]['sha256']==digest
          print('source pin parity passed')
          PY
          rm -rf "$root/evidence"
          mkdir -p "$root/evidence"
          cp "$out1"/* "$root/evidence"/
      - name: Validate scientific boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/real_account_behavior_decomp')
          c=json.loads((root/'CONTRACT.json').read_text())
          r=json.loads((root/'evidence/RESULT.json').read_text())
          v=json.loads((root/'evidence/VALIDATION.json').read_text())
          assert r['claim_id']==c['claim_id']
          assert r['result_id']==c['result_id']
          assert r['source']['source_commit']==c['source']['pinned_commit']
          assert r['rank_eligible'] is False
          assert r['official_2024_2026_opened'] is False
          assert r['orders_submitted'] is False
          assert len(r['hypotheses']) <= 2
          assert v['status']=='PASS'
          assert all(v['checks'].values())
          print(json.dumps({'decision':r['decision'],'episodes':r['reconstruction']['episodes_total'],
                            'hypotheses':len(r['hypotheses'])},sort_keys=True))
          PY
      - name: Commit corrected compact evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/real_account_behavior_decomp/evidence research/real_account_behavior_decomp/materialized/run_analysis.py
          if git diff --cached --quiet; then
            echo 'Evidence unchanged'
          else
            git commit -m 'Record corrected pre-2024 real-account behavior decomposition'
            git push origin HEAD:agent/r36-real-account-behavior-decomp-001
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: real-account-behavior-decomp-r36-${{ github.run_id }}
          path: research/real_account_behavior_decomp/evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
