name: ML leverage-flow source probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-ml-xasset-spillover-001
    paths:
      - research/ml_xasset_spillover_20260727/probe_metrics_source.py
      - .github/workflows/ml-leverage-flow-source-probe.yml
  pull_request:
    branches:
      - main
    paths:
      - research/ml_xasset_spillover_20260727/probe_metrics_source.py
      - .github/workflows/ml-leverage-flow-source-probe.yml

permissions:
  contents: read

jobs:
  probe-pre2024-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned probe dependency
        run: python -m pip install "requests==2.32.4"
      - name: Probe official archive paths and schema
        run: python research/ml_xasset_spillover_20260727/probe_metrics_source.py
      - name: Upload source-semantics evidence
        uses: actions/upload-artifact@v4
        with:
          name: ml-leverage-flow-source-probe
          path: artifact/metrics_source_probe.json
          if-no-files-found: error
          retention-days: 14
