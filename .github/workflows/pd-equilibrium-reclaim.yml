name: Validate previous-day equilibrium reclaim result

on:
  push:
    branches:
      - agent/r24-pd-equilibrium-reclaim-001
    paths:
      - "research/pd_equilibrium_reclaim/**"
      - ".github/workflows/pd-equilibrium-reclaim.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/pd_equilibrium_reclaim/**"
      - ".github/workflows/pd-equilibrium-reclaim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen validation environment
        run: python -m pip install "numpy==2.1.3" "pandas==2.2.3" "scipy==1.14.1"
      - name: Reconstruct and verify source bundle
        run: |
          set -euo pipefail
          root=research/pd_equilibrium_reclaim
          python "$root/materialize.py"
          python -m py_compile "$root/materialize.py" "$root/run_pd_equilibrium.py" "$root/audit_strict_acceptance.py" "$root/test_pd_equilibrium.py"
      - name: Run focused synthetic timing and barrier tests
        run: |
          set -euo pipefail
          cd research/pd_equilibrium_reclaim
          python -m unittest -v test_pd_equilibrium.TestUnitSemantics
      - name: Validate visible result files and project harness
        run: |
          set -euo pipefail
          python -m json.tool research/pd_equilibrium_reclaim/CONTRACT.json >/dev/null
          python -m json.tool research/pd_equilibrium_reclaim/RESULT.json >/dev/null
          python scripts/validate_project.py
