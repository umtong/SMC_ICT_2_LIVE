name: Independent SCLD live-system screen

on:
  workflow_dispatch:
  push:
    branches: [agent/independent-scld-live-001]
    paths:
      - research/scld_independent/materialize_source.py
      - research/scld_independent/source_payload/**
      - .github/workflows/scld-independent-live-screen.yml
  pull_request:
    branches: [agent/r22-canonical-halfyear-market-data-001]
    paths:
      - research/scld_independent/materialize_source.py
      - research/scld_independent/source_payload/**
      - .github/workflows/scld-independent-live-screen.yml

permissions:
  contents: write

concurrency:
  group: independent-scld-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research runtime
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q numpy pandas scikit-learn pyarrow gdown

      - name: Materialize and verify independent source
        run: |
          python research/scld_independent/materialize_source.py \
            --output research/scld_independent/scld_system.py
          test "$(sha256sum research/scld_independent/scld_system.py | cut -d' ' -f1)" = \
            "1ae4df5dc6905a2e6c5b7956a028a4fa83489a6d35a0283f4f7838a9d7ec5578"

      - name: Compile and verify causal invariants
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile research/scld_independent/scld_system.py
          python research/scld_independent/scld_system.py --self-test

      - name: Restore immutable canonical-data cache
        uses: actions/cache@v4
        with:
          path: artifact/cache/scld
          key: scld-canonical-bybit-btceth-2023-2024h1-v1

      - name: Run 2023 causal selection and 2024H1 continuous evaluation
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/scld-screen
          python research/scld_independent/scld_system.py \
            --download \
            --cache-root artifact/cache/scld \
            --output artifact/scld-screen \
            2>&1 | tee artifact/scld-screen/RUN_STDOUT.log

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path("artifact/scld-screen/RUN_SUMMARY.json")
          lines = ["## Independent SCLD live-system screen"]
          if summary_path.exists():
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              metrics = summary.get("performance_2024H1", {})
              contract = summary.get("selected_pre_2024_contract", {})
              lines.extend([
                  f"- decision: `{summary.get('decision')}`",
                  f"- 2024H1 geometric daily growth: `{metrics.get('geometric_daily_growth')}`",
                  f"- account multiple: `{metrics.get('account_multiple')}`",
                  f"- completed trades: `{metrics.get('completed_trades')}`",
                  f"- max drawdown: `{metrics.get('max_drawdown')}`",
                  f"- top-5 profit share: `{metrics.get('top5_profit_share')}`",
                  f"- selected contract: `{contract}`",
              ])
          else:
              lines.append("- RUN_SUMMARY.json was not produced; inspect job logs.")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload immutable screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-scld-live-${{ env.SOURCE_SHA }}
          path: artifact/scld-screen
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90

      - name: Persist source and compact result pointer
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          summary_path = Path("artifact/scld-screen/RUN_SUMMARY.json")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          pointer = {
              "schema_version": 1,
              "system_id": summary.get("system_id"),
              "source_sha": os.environ["SOURCE_SHA"],
              "source_file_sha256": hashlib.sha256(Path("research/scld_independent/scld_system.py").read_bytes()).hexdigest(),
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "artifact_name": f"independent-scld-live-{os.environ['SOURCE_SHA']}",
              "summary_sha256": hashlib.sha256(summary_path.read_bytes()).hexdigest(),
              "decision": summary.get("decision"),
              "selected_pre_2024_contract": summary.get("selected_pre_2024_contract"),
              "training_candidates": summary.get("training_candidates"),
              "oof_candidates": summary.get("oof_candidates"),
              "evaluation_candidates": summary.get("evaluation_candidates"),
              "performance_2024H1": summary.get("performance_2024H1"),
              "candidate_diagnostics": summary.get("candidate_diagnostics"),
              "data_fingerprints": summary.get("data_fingerprints"),
          }
          path = Path("research/scld_independent/RUN_POINTER.json")
          path.write_text(json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/scld_independent/scld_system.py research/scld_independent/RUN_POINTER.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record independent SCLD screen ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${BRANCH_NAME}"
            if git push origin "HEAD:${BRANCH_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
