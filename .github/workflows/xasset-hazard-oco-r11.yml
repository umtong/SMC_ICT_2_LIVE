name: Cross-asset movement-hazard OCO fatal screen

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r11-xasset-hazard-oco-001
    paths:
      - "research/xasset_hazard_oco_20260726/**"
      - ".github/workflows/xasset-hazard-oco-r11.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/xasset_hazard_oco_20260726/**"
      - ".github/workflows/xasset-hazard-oco-r11.yml"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  NUMEXPR_NUM_THREADS: "2"

jobs:
  fatal-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 pandas==2.2.3 requests==2.32.4

      - name: Reconstruct immutable source bundle
        run: |
          python research/xasset_hazard_oco_20260726/reconstruct.py

      - name: Compile and run causal execution self-tests
        run: |
          python scripts/validate_project.py
          python -m py_compile research/xasset_hazard_oco_20260726/run_screen.py
          python research/xasset_hazard_oco_20260726/run_screen.py self-test
          python -m json.tool research/xasset_hazard_oco_20260726/preregistration.json >/dev/null

      - name: Cache immutable public Bybit archives
        uses: actions/cache@v4
        with:
          path: /tmp/bybit-xasset-hazard-oco
          key: bybit-xasset-hazard-oco-v1-btc-sol-xrp-20230108-20231112

      - name: Run frozen 864-candidate fatal screen
        shell: bash
        run: |
          rm -rf artifacts/xasset_hazard_oco
          mkdir -p artifacts/xasset_hazard_oco
          set -o pipefail
          python research/xasset_hazard_oco_20260726/run_screen.py run \
            --cache /tmp/bybit-xasset-hazard-oco \
            --output artifacts/xasset_hazard_oco \
            2>&1 | tee artifacts/xasset_hazard_oco/run.log

      - name: Verify frozen contract and causal boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root = Path("artifacts/xasset_hazard_oco")
          result = json.loads((root / "result_summary.json").read_text())
          manifest = json.loads((root / "source_manifest.json").read_text())
          prereg = json.loads(Path("research/xasset_hazard_oco_20260726/preregistration.json").read_text())
          candidates = pd.read_csv(root / "candidate_results.csv")
          events = pd.read_csv(root / "development_events.csv.gz")

          assert result["result_id"] == prereg["provisional_result_id"]
          assert result["candidate_count"] == prereg["frozen_candidate_grid"]["candidate_count"] == 864
          assert len(candidates) == 864
          assert result["2024_opened"] is False
          assert result["2025_opened"] is False
          assert result["2026_opened"] is False
          assert result["orders_submitted"] is False
          assert result["paper_or_live_started"] is False
          assert manifest["later_periods_opened"] is False
          assert manifest["orders_submitted"] is False
          assert tuple(manifest["symbols"]) == ("BTCUSDT", "SOLUSDT", "XRPUSDT")
          assert len(manifest["archives"]) == 18
          assert all(str(row["date"]).startswith("2023-") for row in manifest["archives"])
          assert all(int(row["compressed_bytes"]) > 0 and int(row["rows"]) > 0 for row in manifest["archives"])
          assert all(len(str(row["sha256"])) == 64 for row in manifest["archives"])
          assert len(events) == int(result["development_event_rows"])
          assert set(events["stage"]) == {"development"}
          assert set(events["date"]) <= {"2023-07-09", "2023-09-10", "2023-11-12"}
          assert set(events["target"]) <= {"SOLUSDT", "XRPUSDT"}
          assert (events["activation_time"] + 1e-9 >= events["decision_time"] + 0.1).all()
          assert (events["reference_timestamp"] <= events["decision_time"] + 1e-9).all()
          assert (events["target_stale_ms"] >= -1e-6).all()
          for cost in (12, 18, 24):
              for field in ("double_trigger_fraction", "terminal_loss_fraction", "positive_symbol_date_fraction"):
                  values = pd.to_numeric(candidates[f"{cost}bp_{field}"], errors="coerce")
                  finite = np.isfinite(values)
                  assert ((values[finite] >= -1e-12) & (values[finite] <= 1 + 1e-12)).all()
          totals12 = pd.to_numeric(candidates["12bp_total_return"], errors="coerce")
          totals18 = pd.to_numeric(candidates["18bp_total_return"], errors="coerce")
          totals24 = pd.to_numeric(candidates["24bp_total_return"], errors="coerce")
          finite = np.isfinite(totals12) & np.isfinite(totals18) & np.isfinite(totals24)
          assert (totals12[finite] + 1e-12 >= totals18[finite]).all()
          assert (totals18[finite] + 1e-12 >= totals24[finite]).all()
          print("FROZEN_CONTRACT_PASS")
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY

      - name: Attach exact source and build evidence checksums
        if: always()
        run: |
          mkdir -p artifacts/xasset_hazard_oco
          cp research/xasset_hazard_oco_20260726/run_screen.py artifacts/xasset_hazard_oco/RUN_SCREEN.py
          cp research/xasset_hazard_oco_20260726/preregistration.json artifacts/xasset_hazard_oco/PREREGISTRATION.json
          cp research/xasset_hazard_oco_20260726/WORK_CLAIM.json artifacts/xasset_hazard_oco/WORK_CLAIM.json
          cp research/xasset_hazard_oco_20260726/README.md artifacts/xasset_hazard_oco/README.md
          cp research/xasset_hazard_oco_20260726/SOURCES.md artifacts/xasset_hazard_oco/SOURCES.md
          cd artifacts/xasset_hazard_oco
          find . -maxdepth 1 -type f ! -name CI_SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > CI_SHA256SUMS.txt
          sha256sum --check CI_SHA256SUMS.txt
          sha256sum CI_SHA256SUMS.txt

      - name: Upload compact scientific evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xasset-hazard-oco-evidence-${{ github.sha }}
          path: artifacts/xasset_hazard_oco
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload raw BTC fit archives
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xasset-hazard-oco-raw-btc-fit-${{ github.sha }}
          path: |
            /tmp/bybit-xasset-hazard-oco/BTCUSDT/BTCUSDT2023-01-08.csv.gz
            /tmp/bybit-xasset-hazard-oco/BTCUSDT/BTCUSDT2023-03-12.csv.gz
            /tmp/bybit-xasset-hazard-oco/BTCUSDT/BTCUSDT2023-05-14.csv.gz
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Upload raw BTC development archives
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xasset-hazard-oco-raw-btc-development-${{ github.sha }}
          path: |
            /tmp/bybit-xasset-hazard-oco/BTCUSDT/BTCUSDT2023-07-09.csv.gz
            /tmp/bybit-xasset-hazard-oco/BTCUSDT/BTCUSDT2023-09-10.csv.gz
            /tmp/bybit-xasset-hazard-oco/BTCUSDT/BTCUSDT2023-11-12.csv.gz
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Upload raw SOL archives
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xasset-hazard-oco-raw-sol-${{ github.sha }}
          path: /tmp/bybit-xasset-hazard-oco/SOLUSDT/*.csv.gz
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Upload raw XRP archives
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xasset-hazard-oco-raw-xrp-${{ github.sha }}
          path: /tmp/bybit-xasset-hazard-oco/XRPUSDT/*.csv.gz
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
