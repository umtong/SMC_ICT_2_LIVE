name: Stablecoin Blockscout source gate

on:
  push:
    branches: [agent/r13-ml-stablecoin-issuance-001]
    paths:
      - '.github/workflows/ml-stablecoin-issuance-blockscout-source.yml'
      - 'research/ml_stablecoin_issuance_20260726/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-stablecoin-issuance-blockscout-source.yml'
      - 'research/ml_stablecoin_issuance_20260726/**'
  workflow_dispatch:

permissions:
  contents: read

# The frozen source question is independent of a moving project-state revision.
# Current-control validation is retained after source evidence and cannot block it.
concurrency:
  group: stablecoin-blockscout-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-slim
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.4 pytest==8.3.5
      - name: Validate sealed source code
        run: |
          set -euo pipefail
          r=research/ml_stablecoin_issuance_20260726
          o=research_runs/ml_stablecoin_issuance_20260726/blockscout_source
          mkdir -p "$o"
          python -m py_compile "$r"/source_gate*.py "$r/test_source_gate.py"
          PYTHONPATH="$r" pytest -q "$r/test_source_gate.py" | tee "$o/PYTEST.log"
          PYTHONPATH="$r" python "$r/source_gate_blockscout_authoritative.py" --self-test | tee "$o/SELF_TEST.log"
          python -m json.tool "$r/EXECUTION_CORRECTION_006_SLIM_RUNNERS_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$r/EXECUTION_CORRECTION_007_SHA_SCOPED_NO_CANCEL_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$r/EXECUTION_CORRECTION_008_SINGLE_BLOCKSCOUT_AUTHORITY_BEFORE_OUTCOME.json" >/dev/null
      - name: Query pre-2024 issuance source only
        run: |
          set -u
          r=research/ml_stablecoin_issuance_20260726
          o=research_runs/ml_stablecoin_issuance_20260726/blockscout_source
          set +e
          PYTHONPATH="$r" python "$r/source_gate_blockscout_authoritative.py" --output "$o" 2>&1 | tee "$o/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$o/RUN_EXIT_CODE.txt"
          test -f "$o/SOURCE_GATE_RESULT.json" || python "$r/write_transport_failure.py" --output "$o" --transport TRANSPORT-20260726-ML-STABLECOIN-BLOCKSCOUT-003 --exit-code "$rc"
      - name: Verify seals
        run: |
          python research/ml_stablecoin_issuance_20260726/verify_source_result.py research_runs/ml_stablecoin_issuance_20260726/blockscout_source/SOURCE_GATE_RESULT.json TRANSPORT-20260726-ML-STABLECOIN-BLOCKSCOUT-003
      - name: Validate current project control plane without blocking source evidence
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          o=research_runs/ml_stablecoin_issuance_20260726/blockscout_source
          mkdir -p "$o"
          python scripts/validate_project.py 2>&1 | tee "$o/PROJECT_VALIDATION.log"
      - name: Freeze hashes
        if: always()
        run: |
          o=research_runs/ml_stablecoin_issuance_20260726/blockscout_source
          find "$o" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$o/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-blockscout-source-${{ github.run_id }}
          path: research_runs/ml_stablecoin_issuance_20260726/blockscout_source
          if-no-files-found: error
          retention-days: 30
