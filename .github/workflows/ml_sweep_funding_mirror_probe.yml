name: ML sweep Bybit funding mirror probe

on:
  push:
    branches:
      - agent/r22-ml-sweep-crowding-001
    paths:
      - research/triggers/ml_sweep_funding_probe/**

permissions:
  contents: write

concurrency:
  group: ml-sweep-funding-mirror-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned probe runtime
        run: |
          python -m pip install \
            pandas==2.2.3 \
            pyarrow==18.1.0 \
            requests==2.32.3
      - name: Inventory immutable Bybit mirror files
        run: python research/ml_sweep_crowding/inventory_hf_bybit_files.py
      - name: Inspect all funding-mirror column semantics
        run: python research/ml_sweep_crowding/inspect_hf_bybit_funding_columns.py
      - name: Probe verified immutable Bybit funding rate column
        run: python -m research.ml_sweep_crowding.probe_hf_bybit_funding_open
      - name: Publish immutable inventory and probe decision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/results/ml_sweep_crowding/hf_bybit_file_inventory.json \
            research/results/ml_sweep_crowding/bybit_funding_column_inspection.json \
            research/results/ml_sweep_crowding/bybit_funding_mirror_probe.json
          git commit -m "research: publish verified Bybit funding semantics"
          git push origin HEAD:${GITHUB_REF_NAME}
