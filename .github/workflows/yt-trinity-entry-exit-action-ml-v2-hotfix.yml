name: YT Trinity contextual action account hotfix

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-entry-exit-action-ml-v2-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yt-trinity-entry-exit-action-ml-v2-hotfix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Replace stale action-column reference
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('research/yt_trinity_ml/run_entry_exit_action_ml_v2.py')
          text = path.read_text(encoding='utf-8')
          old = "        action_counts[row.action] = action_counts.get(row.action, 0) + 1\n"
          new = "        action_counts[row.identifier] = action_counts.get(row.identifier, 0) + 1\n"
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected stale reference count: {text.count(old)}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('neither stale nor corrected action-count reference found')
          assert 'action_counts[row.action]' not in path.read_text(encoding='utf-8')
          PY
          python -m py_compile research/yt_trinity_ml/run_entry_exit_action_ml_v2.py
      - name: Commit corrected account path
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/run_entry_exit_action_ml_v2.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix action identifier in contextual account replay'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
