name: Stablecoin supply shock strict causal V4 decision

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-stablecoin-strict-exec-r21.yml'
      - 'research/execution/stablecoin_strict_v4_20260727/**'
      - 'research/triggers/stablecoin_strict_v3/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stablecoin-strict-main-authority
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'
  PYTHONUNBUFFERED: '1'
  PYTHONFAULTHANDLER: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  SOURCE_SHA: 73aac90eacdc0ddcc34f4e45f0ff8d9369e5b539
  STRICT_SHA: 209a0fbe6e2f61d2c58b3eb7910b8c0c139cd46c
  SOURCE_ROOT: research/ml_stablecoin_issuance_20260726
  ECON_ROOT: research/ml_stablecoin_issuance_economic_20260726
  GUARD_ROOT: sourcefix/ml_stablecoin_causal_guard_20260726
  V4_ROOT: research/execution/stablecoin_strict_v4_20260727
  RUN_ROOT: research_runs/ml_stablecoin_strict_v4
  SOURCE_OUT: research_runs/ml_stablecoin_strict_v4/source
  ECON_OUT: research_runs/ml_stablecoin_strict_v4/economic
  MARKET_CACHE: ${{ runner.temp }}/stablecoin-market-v4

jobs:
  decision:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            requests==2.32.4 pytest==8.3.5 \
            numpy==2.1.3 pandas==2.2.3 scikit-learn==1.6.1 pyarrow==18.1.0

      - name: Materialize immutable source and strict engine snapshots
        run: |
          set -euo pipefail
          mkdir -p "$RUN_ROOT"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          rm -rf "$SOURCE_ROOT"
          git archive "$SOURCE_SHA" "$SOURCE_ROOT" | tar -x
          git fetch --no-tags --depth=1 origin "$STRICT_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$STRICT_SHA"
          rm -rf "$ECON_ROOT" "$GUARD_ROOT"
          git archive "$STRICT_SHA" "$ECON_ROOT" "$GUARD_ROOT" | tar -x
          printf '%s\n' "$SOURCE_SHA" > "$RUN_ROOT/PINNED_SOURCE_SHA.txt"
          printf '%s\n' "$STRICT_SHA" > "$RUN_ROOT/PINNED_STRICT_SHA.txt"

      - name: Validate source semantics and strict V4 before network access
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_OUT" "$ECON_OUT"
          python -m json.tool "$SOURCE_ROOT/CORRECTION_010_USDT_ISSUE_REDEEM_EVENT_SCHEMA_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$SOURCE_ROOT/CORRECTION_011_BLOCKSCOUT_NULL_TOPIC_PADDING_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$SOURCE_ROOT/CORRECTION_013_BIND_CORRECTED_SOURCE_SCHEMA_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$SOURCE_ROOT/CORRECTION_019_BLOCKSCOUT_STATUS0_FAIL_CLOSED_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$GUARD_ROOT/CORRECTION_002_PREENTRY_INFORMATION_BOUNDARY_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$V4_ROOT/CORRECTION_004_SIMULTANEOUS_EVENT_AND_LIQUIDATION_DISTANCE_BEFORE_OUTCOME.json" >/dev/null
          python "$ECON_ROOT/reconstruct.py"
          python -m py_compile \
            "$SOURCE_ROOT"/source_gate*.py \
            "$SOURCE_ROOT/run_pinned_snapshot_source.py" \
            "$SOURCE_ROOT/test_source_gate.py" \
            "$SOURCE_ROOT/write_transport_failure.py" \
            "$ECON_ROOT/run.py" "$ECON_ROOT/run_causal.py" \
            "$ECON_ROOT/test_run.py" "$ECON_ROOT/test_run_causal.py" \
            "$GUARD_ROOT/causal_guard.py" "$GUARD_ROOT/strict_guard.py" \
            "$GUARD_ROOT/test_causal_guard.py" "$V4_ROOT/strict_guard_v4.py"
          PYTHONPATH="$SOURCE_ROOT" pytest -q "$SOURCE_ROOT/test_source_gate.py"
          PYTHONPATH="$SOURCE_ROOT" python "$SOURCE_ROOT/run_pinned_snapshot_source.py" --self-test
          PYTHONPATH="$ECON_ROOT:$GUARD_ROOT:$V4_ROOT" pytest -q \
            "$ECON_ROOT/test_run.py" \
            "$ECON_ROOT/test_run_causal.py" \
            "$GUARD_ROOT/test_causal_guard.py"
          PYTHONPATH="$ECON_ROOT:$GUARD_ROOT:$V4_ROOT" python "$V4_ROOT/strict_guard_v4.py" self-test
          python scripts/validate_project.py

      - name: Run complete corrected 2021-2023 source gate
        run: |
          set -u
          rm -rf "$SOURCE_OUT/run"
          mkdir -p "$SOURCE_OUT/run"
          set +e
          PYTHONPATH="$SOURCE_ROOT" python "$SOURCE_ROOT/run_pinned_snapshot_source.py" \
            --output "$SOURCE_OUT/run" 2>&1 | tee "$SOURCE_OUT/run/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$SOURCE_OUT/run/RUN_EXIT_CODE.txt"
          if [[ ! -f "$SOURCE_OUT/run/SOURCE_GATE_RESULT.json" ]]; then
            python "$SOURCE_ROOT/write_transport_failure.py" \
              --output "$SOURCE_OUT/run" \
              --transport TRANSPORT-20260727-ML-STABLECOIN-STRICT-V4-MAIN \
              --exit-code "$rc"
          fi
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then
            echo "source transport returned unexpected exit $rc; durable outcome-sealed result retained" >&2
          fi

      - id: source
        name: Verify source decision and preserve the outcome seal
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['SOURCE_OUT'])/'run'
          result=json.loads((root/'SOURCE_GATE_RESULT.json').read_text())
          assert result['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert result['status'] in {'PASS','FAIL_BELOW_SOURCE_DENSITY_OR_COVERAGE','SOURCE_UNAVAILABLE_OR_TRANSPORT_FAILURE'}
          for key in ('market_outcome_opened','model_fit','trade_or_pnl_opened','official_2024_2026_opened','orders_submitted'):
              assert result[key] is False
          authorized=result['status']=='PASS'
          if authorized:
              manifest=json.loads((root/'SOURCE_MANIFEST.json').read_text())
              events=root/'EVENTS.jsonl'
              rows=[json.loads(line) for line in events.read_text().splitlines() if line.strip()]
              assert result['source_schema_id']=='STABLECOIN_SUPPLY_USDT_ISSUE_REDEEM_USDC_ZERO_TRANSFER_V1'
              assert result['source_correction_id']=='CORRECTION-20260726-ML-STABLECOIN-USDT-ISSUE-REDEEM-010'
              assert result['transport_response_policy_correction']=='CORRECTION-20260727-ML-STABLECOIN-BLOCKSCOUT-STATUS0-FAIL-CLOSED-019'
              assert result['status_zero_empty_policy']=='EXPLICIT_NO_RECORDS_ONLY'
              assert result['status_zero_range_policy']=='EXPLICIT_RANGE_LIMIT_ONLY'
              assert result['unrecognized_status_zero_policy']=='FAIL_CLOSED_SOURCE_UNAVAILABLE'
              assert manifest['source_schema_id']==result['source_schema_id']
              assert manifest['source_correction_id']==result['source_correction_id']
              assert manifest['transport_response_policy_correction']==result['transport_response_policy_correction']
              assert result['pass_checks'] and all(result['pass_checks'].values())
              assert result['event_semantics']['ordinary_usdt_transfer_excluded'] is True
              assert int(result['event_count'])>=120
              assert len(result['months_with_events'])>=24
              assert sorted(result['distinct_tokens'])==['USDC','USDT']
              assert {row['token'] for row in rows}=={'USDC','USDT'}
              assert {row['direction'] for row in rows}.issubset({'MINT','BURN'})
              assert all(int(row['available_timestamp_12'])<1704067200 for row in rows)
              assert all(int(row['available_timestamp_64'])<1704067200 for row in rows)
              assert hashlib.sha256(events.read_bytes()).hexdigest()==manifest['events_sha256']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f"authorized={'true' if authorized else 'false'}\n")
              if authorized:
                  handle.write(f"events={root/'EVENTS.jsonl'}\n")
          print(json.dumps({'source_status':result['status'],'event_count':result.get('event_count'),'months':len(result.get('months_with_events',[])),'tokens':result.get('distinct_tokens'),'authorized':authorized},sort_keys=True))
          PY

      - uses: actions/cache@v4
        if: steps.source.outputs.authorized == 'true'
        with:
          path: ${{ env.MARKET_CACHE }}
          key: stablecoin-market-2020-12-2023-12-strict-v4-main

      - name: Run strict causal V4 pre-2024 ML and account screen
        if: steps.source.outputs.authorized == 'true'
        run: |
          set -u
          rm -rf "$ECON_OUT/run"
          mkdir -p "$ECON_OUT/run" "$MARKET_CACHE"
          set +e
          PYTHONPATH="$ECON_ROOT:$GUARD_ROOT:$V4_ROOT" python "$V4_ROOT/strict_guard_v4.py" run \
            --events "${{ steps.source.outputs.events }}" \
            --market-cache "$MARKET_CACHE" \
            --output "$ECON_OUT/run" 2>&1 | tee "$ECON_OUT/run/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$ECON_OUT/run/RUN_EXIT_CODE.txt"
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then exit "$rc"; fi
          test -f "$ECON_OUT/run/RESULT.json"
          test -f "$ECON_OUT/run/FULL_RESULT.json"

      - name: Enforce strict V4 result and immediate sequential decision
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          source=json.loads((Path(os.environ['SOURCE_OUT'])/'run/SOURCE_GATE_RESULT.json').read_text())
          if source['status']!='PASS':
              print(json.dumps({'source_status':source['status'],'economic_status':'NOT_OPENED','next_stage':'CLOSE_SOURCE_OR_REPAIR_TRANSPORT_ONLY'},sort_keys=True))
              raise SystemExit(0)
          root=Path(os.environ['ECON_OUT'])/'run'
          result=json.loads((root/'RESULT.json').read_text())
          full=json.loads((root/'FULL_RESULT.json').read_text())
          assert result['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert result['engine']=='ML_STABLECOIN_ISSUANCE_FIRST_PASSAGE_STRICT_CAUSAL_V3'
          assert result['status'] in {'PRE2024_BELOW_GATE','PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1'}
          assert result['orders_submitted'] is False
          assert result['official_2024h1_opened'] is False
          assert result['official_2024_2026_opened'] is False
          guard=result['strict_causal_guard']
          assert guard['correction_id']=='CORRECTION-20260727-ML-STABLECOIN-PREENTRY-INFORMATION-BOUNDARY-002'
          assert guard['source_decision_second_respected'] is True
          assert guard['latest_completed_bar_cutoff_enforced'] is True
          assert guard['decision_reference_price_pre_entry'] is True
          assert guard['future_entry_open_used_for_model_or_action'] is False
          assert guard['entry_open_used_for_realized_execution_only'] is True
          assert guard['stage_boundary_positions_marked_not_closed'] is True
          assert guard['fatal_validity_violation'] is False
          v4=result['simultaneous_event_and_liquidation_guard']
          assert v4['correction_id']=='CORRECTION-20260727-ML-STABLECOIN-SIMULTANEOUS-EVENT-LIQUIDATION-DISTANCE-004'
          assert v4['simultaneous_event_prior_rule']=='STRICTLY_EARLIER_AVAILABILITY_SECOND_GROUPED_BEFORE_APPEND'
          assert v4['planned_quantity_rule']=='PREENTRY_EXPECTED_STOP_DISTANCE_PLUS_COST'
          assert v4['liquidation_test_rule']=='ACTUAL_FILL_TO_STRUCTURAL_STOP_OR_ADVERSE_STOP_GAP'
          assert v4['fatal_validity_violation'] is False
          serialized=json.dumps(full,sort_keys=True)
          assert '"exit_reason": "SOURCE_BOUNDARY"' not in serialized
          ledger_rows=[]
          def walk(value):
              if isinstance(value,dict):
                  if 'forced_boundary_close' in value:
                      assert value['forced_boundary_close'] is False
                  if {'event_id','leverage','account_return','stop_fraction'}.issubset(value):
                      ledger_rows.append(value)
                  for child in value.values(): walk(child)
              elif isinstance(value,list):
                  for child in value: walk(child)
          walk(full)
          for row in ledger_rows:
              assert 'planned_stop_fraction' in row
              assert 'actual_structural_stop_fraction' in row
              assert 'liquidation_test_distance' in row
              assert row['liquidation_distance_rule']=='ACTUAL_FILL_TO_STRUCTURAL_STOP_OR_ADVERSE_GAP'
          next_stage='CHANGE_ALPHA'
          if result['status']=='PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1':
              assert result['development_gate']['all'] is True
              selected=result['risk_search']['selected']
              assert selected is not None and selected['growth']>0 and selected['liquidation'] is False
              next_stage='OFFICIAL_2024H1_IMMEDIATELY'
          print(json.dumps({'source_status':source['status'],'economic_status':result['status'],'account_correction':v4['correction_id'],'development_gate':result['development_gate'].get('all'),'selected_risk_path':result.get('risk_search',{}).get('selected'),'next_stage':next_stage},sort_keys=True))
          PY

      - name: Freeze immutable evidence hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUN_ROOT/inputs"
          cp "$SOURCE_ROOT"/CORRECTION_010_USDT_ISSUE_REDEEM_EVENT_SCHEMA_BEFORE_OUTCOME.json "$RUN_ROOT/inputs/"
          cp "$SOURCE_ROOT"/CORRECTION_019_BLOCKSCOUT_STATUS0_FAIL_CLOSED_BEFORE_OUTCOME.json "$RUN_ROOT/inputs/"
          cp "$GUARD_ROOT"/CORRECTION_002_PREENTRY_INFORMATION_BOUNDARY_BEFORE_OUTCOME.json "$RUN_ROOT/inputs/"
          cp "$V4_ROOT"/CORRECTION_004_SIMULTANEOUS_EVENT_AND_LIQUIDATION_DISTANCE_BEFORE_OUTCOME.json "$RUN_ROOT/inputs/"
          cp "$GUARD_ROOT"/strict_guard.py "$GUARD_ROOT"/test_causal_guard.py "$RUN_ROOT/inputs/"
          cp "$V4_ROOT"/strict_guard_v4.py "$RUN_ROOT/inputs/"
          find "$RUN_ROOT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$RUN_ROOT/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-strict-v4-main-${{ github.run_id }}
          path: research_runs/ml_stablecoin_strict_v4
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
