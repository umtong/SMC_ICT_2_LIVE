name: YT Trinity 2024H1 path checkpoint

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-2024h1-path-checkpoint.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-2024h1-path-checkpoint
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Persist run identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          payload={'schema_version':1,'run_id':int(os.environ['GITHUB_RUN_ID']),'trigger_sha':os.environ['GITHUB_SHA'],'source_sha':'d7486872efccf0b67b7209baeadfd12ff35b56d0','artifact_name':f"yt-trinity-2024h1-path-{os.environ['GITHUB_SHA']}",'status':'in_progress'}
          Path('research/yt_trinity_ml/PATH_2024H1_POINTER.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/PATH_2024H1_POINTER.json
          git commit -m "Announce YT Trinity 2024H1 path ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

  checkpoint:
    needs: announce
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7486872efccf0b67b7209baeadfd12ff35b56d0
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: a2bb231966a517d29495bed7673e4d08ab8e30a9
          path: canonical_repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'pyarrow==19.0.1' 'scikit-learn==1.6.1'
      - name: Download immutable market shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_artifact() {
            curl --fail --silent --show-error --location -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"
          }
          mkdir -p inputs/data/PRE_2024_2023/BTCUSDT inputs/data/PRE_2024_2023/ETHUSDT inputs/data/2024_H1/BTCUSDT inputs/data/2024_H1/ETHUSDT output
          fetch_artifact 8636781702 /tmp/btc2023.zip
          fetch_artifact 8636761741 /tmp/eth2023.zip
          fetch_artifact 8636867995 /tmp/btc2024h1.zip
          fetch_artifact 8636882043 /tmp/eth2024h1.zip
          unzip -q /tmp/btc2023.zip -d inputs/data/PRE_2024_2023/BTCUSDT
          unzip -q /tmp/eth2023.zip -d inputs/data/PRE_2024_2023/ETHUSDT
          unzip -q /tmp/btc2024h1.zip -d inputs/data/2024_H1/BTCUSDT
          unzip -q /tmp/eth2024h1.zip -d inputs/data/2024_H1/ETHUSDT
      - name: Materialize frozen 2024H1 paths
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python - <<'PY'
          import gzip,hashlib,json,os,pickle
          from pathlib import Path
          import pandas as pd
          from run_research import PRIMARY,load_canonical_frames
          from system.core import FeatureConfig
          from system.corpus_alpha import build_corpus_features,generate_corpus_candidates_with_diagnostics

          start=pd.Timestamp('2024-01-01T00:00:00Z');end=pd.Timestamp('2024-07-01T00:00:00Z')
          decision,execution,funding=load_canonical_frames(Path('inputs/data'),Path('canonical_repo'),PRIMARY,('PRE_2024_2023','2024_H1'))
          candidates=[];diagnostics={}
          for symbol,frame in sorted(decision.items()):
              features=build_corpus_features(frame,FeatureConfig())
              rows,diag=generate_corpus_candidates_with_diagnostics(features,symbol)
              candidates.extend([row for row in rows if start<=row.timestamp<end]);diagnostics[symbol]=diag
          candidates.sort(key=lambda x:(x.timestamp,x.symbol,x.family.value,x.side))
          keep=('bar_start','open','high','low','close','mark_close','spread_bps','available_at_ms')
          execution={symbol:frame.loc[(pd.to_datetime(frame['bar_start'],utc=True)>=start)&(pd.to_datetime(frame['bar_start'],utc=True)<end),[c for c in keep if c in frame.columns]].copy() for symbol,frame in execution.items()}
          funding={key:value for key,value in funding.items() if start<=key[1]<end}
          for name,obj in {'CANDIDATES_2024H1.pkl.gz':candidates,'EXECUTION_2024H1.pkl.gz':execution,'FUNDING_2024H1.pkl.gz':funding}.items():
              with gzip.open(Path('output')/name,'wb',compresslevel=6) as fh:pickle.dump(obj,fh,pickle.HIGHEST_PROTOCOL)
          manifest={'schema_version':1,'source_sha':'d7486872efccf0b67b7209baeadfd12ff35b56d0','candidate_count':len(candidates),'execution_rows':{symbol:len(frame) for symbol,frame in execution.items()},'funding_events':len(funding),'diagnostics':diagnostics,'files':{}}
          for path in Path('output').glob('*'):manifest['files'][path.name]={'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          Path('output/MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-2024h1-path-${{ github.sha }}
          path: output
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
