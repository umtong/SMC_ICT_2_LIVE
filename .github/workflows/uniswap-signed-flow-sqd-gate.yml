name: Signed Uniswap WETH-stable flow SQD source gate

on:
  push:
    branches:
      - agent/r34-uniswap-signed-flow-sqd-takeover-001
    paths:
      - "research/uniswap_signed_flow_sqd/**"
      - ".github/workflows/uniswap-signed-flow-sqd-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/uniswap_signed_flow_sqd/**"
      - ".github/workflows/uniswap-signed-flow-sqd-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uniswap-signed-flow-sqd-source-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed source environment
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            requests==2.32.4 pytest==8.3.5
      - name: Materialize and verify immutable source bundle
        run: |
          set -euo pipefail
          root=research/uniswap_signed_flow_sqd
          runtime=research_runs/uniswap_signed_flow_sqd/runtime
          rm -rf "$runtime"
          mkdir -p "$runtime"
          base64 -d "$root/SOURCE_BUNDLE.tar.gz.b64" > "$runtime/SOURCE_BUNDLE.tar.gz"
          echo "842b281ea55e349ebfdf132c89f170fd88d427b1e228cdaa914666de76137a12  $runtime/SOURCE_BUNDLE.tar.gz" | sha256sum -c -
          tar -xzf "$runtime/SOURCE_BUNDLE.tar.gz" -C "$runtime"
          echo "b831ee70b58e6eb7cdc3c941d054e1d9b2dd0bc389c3b87f6af504b9c8e85cf8  $runtime/source_gate_sqd.py" | sha256sum -c -
          echo "0842b79ce8fa1990db305602e95b49e453f9a795062cbb81b144a520f36c98ad  $runtime/test_source_gate_sqd.py" | sha256sum -c -
          python -m json.tool "$root/CONTRACT.json" >/dev/null
          python -m json.tool "$root/SOURCE_MANIFEST.json" >/dev/null
      - name: Compile and run source semantics tests
        run: |
          set -euo pipefail
          runtime=research_runs/uniswap_signed_flow_sqd/runtime
          python -m py_compile "$runtime/source_gate_sqd.py" "$runtime/test_source_gate_sqd.py"
          PYTHONPATH="$runtime" python -m pytest -q "$runtime/test_source_gate_sqd.py"
      - name: Run outcome-sealed SQD source gate
        run: |
          set -euo pipefail
          runtime=research_runs/uniswap_signed_flow_sqd/runtime
          out=research_runs/uniswap_signed_flow_sqd/source_gate
          rm -rf "$out"
          mkdir -p "$out"
          PYTHONPATH="$runtime" python "$runtime/source_gate_sqd.py" --output "$out" \
            2>&1 | tee "$out/RUN.log"
      - name: Enforce source-only decision and classification
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('research_runs/uniswap_signed_flow_sqd/source_gate/SOURCE_GATE.json')
          result = json.loads(path.read_text())
          assert result['claim_id'] == 'CLM-20260730-UNISWAP-SIGNED-FLOW-SQD-TAKEOVER-001'
          assert result['phase'] == 'OUTCOME_SEALED_SOURCE_GATE'
          assert result['official_2024_2026_opened'] is False
          assert result['orders_submitted'] is False
          assert result['source_gate_status'] in {
              'PASS', 'FAIL_SOURCE_DENSITY_OR_SEMANTICS', 'SOURCE_UNAVAILABLE'
          }
          if result['source_gate_status'] == 'PASS':
              assert result['source_gate_pass'] is True
              assert all(result['source_gate_checks'].values())
              assert result['scientific_decision'] == 'OPEN_FROZEN_PRE2024_HISTORY_AND_MODEL_STAGE'
          elif result['source_gate_status'] == 'SOURCE_UNAVAILABLE':
              assert result['source_gate_pass'] is False
              assert result['scientific_decision'] == 'SOURCE_UNAVAILABLE_NO_ALPHA_CONCLUSION'
          else:
              assert result['source_gate_pass'] is False
              assert result['scientific_decision'] == 'CLOSE_SOURCE_ROUTE_BEFORE_OUTCOMES'

          serialized = json.dumps(result, sort_keys=True).lower()
          for key in (
              'future_return_value', 'first_passage_label_value', 'trade_return',
              'account_nav', 'model_auc', 'official_2024_opened'
          ):
              assert key not in serialized
          print(json.dumps({
              'status': result['source_gate_status'],
              'decision': result['scientific_decision'],
              'decoded_swaps': result.get('totals', {}).get('decoded_swaps', 0),
          }, sort_keys=True))
          PY
      - name: Freeze evidence hashes
        if: always()
        run: |
          set -euo pipefail
          root=research/uniswap_signed_flow_sqd
          out=research_runs/uniswap_signed_flow_sqd/source_gate
          cp "$root/CONTRACT.json" "$out/CONTRACT.json"
          cp "$root/README.md" "$out/README.md"
          {
            sha256sum "$root/CONTRACT.json"
            sha256sum "$root/README.md"
            sha256sum "$root/SOURCE_MANIFEST.json"
            sha256sum "$root/SOURCE_BUNDLE.tar.gz.b64"
            find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 sha256sum
          } > "$out/OUTPUT_SHA256SUMS.txt"
      - name: Publish compact source decision to branch
        if: ${{ always() && github.event_name == 'push' }}
        run: |
          set -euo pipefail
          out=research_runs/uniswap_signed_flow_sqd/source_gate
          dest=research_results/uniswap_signed_flow_sqd_source
          test -f "$out/SOURCE_GATE.json"
          mkdir -p "$dest"
          cp "$out/SOURCE_GATE.json" "$dest/RESULT.json"
          cp "$out/SOURCE_GATE_SHA256.txt" "$dest/SHA256SUMS.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest/RESULT.json" "$dest/SHA256SUMS.txt"
          if ! git diff --cached --quiet; then
            git commit -m "Record signed Uniswap SQD source decision"
            git push origin HEAD:agent/r34-uniswap-signed-flow-sqd-takeover-001
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uniswap-signed-flow-sqd-source-${{ github.sha }}
          path: research_runs/uniswap_signed_flow_sqd/source_gate
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
