name: YT Trinity direct Innertube transcript probe

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - control/yt-trinity-innertube-probe-trigger.json
      - .github/workflows/yt-trinity-innertube-direct-probe.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-innertube-direct-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install public Innertube transcript client
        run: npm install -g @nadimtuhin/ytranscript
      - name: Probe blocked videos and a known-positive caption control
        shell: bash
        run: |
          mkdir -p artifact
          node <<'JS'
          const { spawn } = require('node:child_process');
          const fs = require('node:fs');
          const videos = {
            swipalnam: 'UmEPMyzjQS8',
            chartbro: 'DnGemQi1sOE',
            indicator_sensei: '18U0aD4K21I',
            known_positive_control: 'F6wDs1HRTSo',
          };
          function run(args) {
            return new Promise((resolve) => {
              const child = spawn('ytranscript', args, { stdio: ['ignore', 'pipe', 'pipe'] });
              let stdout = '', stderr = '';
              const timer = setTimeout(() => child.kill('SIGKILL'), 60000);
              child.stdout.on('data', d => stdout += d.toString());
              child.stderr.on('data', d => stderr += d.toString());
              child.on('close', code => {
                clearTimeout(timer);
                resolve({ code, stdout, stderr });
              });
            });
          }
          (async () => {
            const rows = [];
            for (const [channel, videoId] of Object.entries(videos)) {
              for (const mode of ['ko', 'default']) {
                const args = ['get', videoId, '--format', 'json'];
                if (mode === 'ko') args.push('--lang', 'ko');
                const result = await run(args);
                let payload = null;
                try { payload = JSON.parse(result.stdout); } catch (_) {}
                const segments = Array.isArray(payload?.segments) ? payload.segments : [];
                rows.push({
                  channel, video_id: videoId, mode,
                  returncode: result.code,
                  language: payload?.language ?? null,
                  is_auto_generated: payload?.isAutoGenerated ?? null,
                  segment_count: segments.length,
                  text_chars: typeof payload?.text === 'string' ? payload.text.length : 0,
                  first_segments: segments.slice(0, 3),
                  stdout_prefix: result.stdout.slice(0, 1000),
                  stderr_tail: result.stderr.slice(-3000),
                });
              }
            }
            const successful = rows.filter(r => r.segment_count > 0 || r.text_chars > 0);
            const output = {
              schema_version: 2,
              run_id: Number(process.env.GITHUB_RUN_ID),
              source_sha: process.env.GITHUB_SHA,
              success_count: successful.length,
              positive_control_pass: successful.some(r => r.channel === 'known_positive_control'),
              successful,
              rows,
            };
            fs.writeFileSync('artifact/result.json', JSON.stringify(output, null, 2) + '\n');
            console.log(JSON.stringify({ success_count: successful.length, positive_control_pass: output.positive_control_pass, successful }, null, 2));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-direct-innertube-probe-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          retention-days: 14
      - name: Persist result on work branch
        if: always()
        run: |
          if [[ ! -f artifact/result.json ]]; then exit 0; fi
          cp artifact/result.json research/yt_trinity_ml/CAPTION_TRANSPORT_PROBE_DIRECT_INNERTUBE.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/CAPTION_TRANSPORT_PROBE_DIRECT_INNERTUBE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record direct Innertube transcript probe ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
