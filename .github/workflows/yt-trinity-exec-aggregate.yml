name: YT Trinity isolated research aggregate

on:
  push:
    branches: [agent/r22-yt-trinity-ml-exec-001]
    paths:
      - research/yt_trinity_ml/EXEC_STRUCTURAL_POINTER.json
      - research/yt_trinity_ml/EXEC_SMT_POINTER.json
      - research/yt_trinity_ml/EXEC_SQUEEZE_POINTER.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yt-trinity-exec-aggregate
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-exec-001
          fetch-depth: 0
      - name: Normalize all available results
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          root=Path('research/yt_trinity_ml')
          def load(name):
              p=root/name
              return json.loads(p.read_text()) if p.exists() else None
          structural=load('EXEC_STRUCTURAL_POINTER.json')
          smt=load('EXEC_SMT_POINTER.json')
          squeeze=load('EXEC_SQUEEZE_POINTER.json')
          rows=[]
          if structural:
              result=structural.get('result') or {}
              frozen=result.get('frozen_2024H1') or {}
              growth=frozen.get('growth') or {}
              rows.append({
                  'id':'QUALITY_STRUCTURAL_RUNNER',
                  'valid':structural.get('status')=='valid',
                  'stage':'2024H1' if frozen else 'PRE2024',
                  'account_multiple':growth.get('account_multiple'),
                  'geometric_daily_growth':growth.get('geometric_daily_growth'),
                  'maximum_drawdown':growth.get('maximum_drawdown'),
                  'completed_trades':growth.get('filled_trades'),
                  'details':{'selected_variant':result.get('selected_variant'),'validation':result.get('validation_2023H2'),'crosscheck_error':(structural.get('crosscheck') or {}).get('error')},
              })
          if smt:
              summary=smt.get('summary') or {}
              evaluation=summary.get('evaluation') or summary.get('official_2024h1') or summary.get('frozen_2024h1') or {}
              metrics=evaluation.get('metrics') if isinstance(evaluation,dict) else None
              if not metrics and isinstance(evaluation,dict): metrics=evaluation
              rows.append({
                  'id':'SMT_OPENING_RANGE_BPR',
                  'valid':smt.get('status')=='success',
                  'stage':'2024H1' if metrics else 'PRE2024',
                  'account_multiple':(metrics or {}).get('account_multiple'),
                  'geometric_daily_growth':(metrics or {}).get('geometric_daily_growth'),
                  'maximum_drawdown':(metrics or {}).get('maximum_drawdown'),
                  'completed_trades':(metrics or {}).get('completed_trades'),
                  'details':summary,
              })
          if squeeze:
              outputs=squeeze.get('json_outputs') or {}
              summary=outputs.get('RUN_SUMMARY.json') or outputs.get('SUMMARY.json') or {}
              metrics=summary.get('metrics') or summary.get('evaluation_metrics') or {}
              rows.append({
                  'id':'OI_LIQUIDITY_SQUEEZE',
                  'valid':squeeze.get('status')=='success',
                  'stage':summary.get('stage','PRE2024'),
                  'account_multiple':metrics.get('account_multiple'),
                  'geometric_daily_growth':metrics.get('geometric_daily_growth'),
                  'maximum_drawdown':metrics.get('maximum_drawdown'),
                  'completed_trades':metrics.get('completed_trades'),
                  'details':summary,
              })
          def score(row):
              g=row.get('geometric_daily_growth')
              return float(g) if row.get('valid') and isinstance(g,(int,float)) and math.isfinite(g) else -1e9
          ranked=sorted(rows,key=lambda row:(score(row),row.get('account_multiple') or -1),reverse=True)
          best=ranked[0] if ranked and score(ranked[0])>-1e8 else None
          target_met=bool(best and best.get('geometric_daily_growth') is not None and best['geometric_daily_growth']>=0.01)
          complete=all(x is not None for x in (structural,smt,squeeze))
          if target_met:
              next_action='ADVANCE_BEST_TO_EVENT_TAPE_AND_SEQUENTIAL_2024_2026'
          elif complete:
              next_action='BUILD_HIGH_FREQUENCY_HTF_KILLZONE_SWEEP_CISD_FIRST_RETRACE_ALPHA'
          else:
              next_action='WAIT_FOR_REMAINING_ISOLATED_EXECUTIONS'
          payload={'schema_version':1,'complete':complete,'target_met':target_met,'best':best,'ranked':ranked,'next_action':next_action}
          (root/'EXEC_AGGREGATE_POINTER.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True,default=str)+'\n')
          lines=['# YT Trinity isolated research aggregate','',f'- Complete: `{complete}`',f'- Target met: `{target_met}`',f'- Next action: `{next_action}`','']
          for index,row in enumerate(ranked,1):
              lines += [f'## {index}. {row["id"]}',f'- Valid: `{row["valid"]}`',f'- Stage: `{row["stage"]}`',f'- Daily geometric growth: `{row.get("geometric_daily_growth")}`',f'- Account multiple: `{row.get("account_multiple")}`',f'- MDD: `{row.get("maximum_drawdown")}`',f'- Trades: `{row.get("completed_trades")}`','']
          (root/'EXEC_AGGREGATE_REPORT.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(payload,indent=2,default=str))
          PY
      - name: Commit aggregate without retriggering research
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/yt_trinity_ml/EXEC_AGGREGATE_POINTER.json research/yt_trinity_ml/EXEC_AGGREGATE_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "Aggregate isolated YT Trinity research ${GITHUB_RUN_ID}"
            for i in 1 2 3 4 5; do git pull --rebase origin agent/r22-yt-trinity-ml-exec-001 && git push origin HEAD:agent/r22-yt-trinity-ml-exec-001 && break || sleep $((i*3)); done
          fi
