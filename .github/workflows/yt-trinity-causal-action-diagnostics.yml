name: YT Trinity causal action diagnostic persistence

on:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - .github/workflows/yt-trinity-causal-action-diagnostics.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-causal-action-diagnostics
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Persist raw and model funnel diagnostics
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('research/yt_trinity_ml/run_causal_action_v1.py')
          text=p.read_text()
          text=text.replace(
              '    selections: list[dict[str, Any]] = []\n',
              '    selections: list[dict[str, Any]] = []\n    selection_attempts: list[dict[str, Any]] = []\n    raw_pre2024: dict[str, Any] = {}\n',
              1,
          )
          marker='''    for variant in variants:\n        train_variant = training[training["exit_variant"] == variant].copy()\n        validation_variant = validation[validation["exit_variant"] == variant].copy()\n'''
          replacement='''    for variant in variants:\n        train_variant = training[training["exit_variant"] == variant].copy()\n        validation_variant = validation[validation["exit_variant"] == variant].copy()\n        raw_pre2024[variant] = {\n            "training_rows": int(len(train_variant)),\n            "validation_rows": int(len(validation_variant)),\n            "validation_fill_rate": float(validation_variant["filled"].mean()) if len(validation_variant) else None,\n            "validation_mean_budget_r": float(validation_variant["net_budget_r"].mean()) if len(validation_variant) else None,\n            "validation_status_counts": validation_variant["status"].value_counts().to_dict(),\n            "validation_by_action": {\n                str(name): {\n                    "rows": int(len(group)),\n                    "fill_rate": float(group["filled"].mean()),\n                    "mean_budget_r": float(group["net_budget_r"].mean()),\n                    "positive_rate": float((group["net_budget_r"] > 0).mean()),\n                    "status_counts": group["status"].value_counts().to_dict(),\n                }\n                for name, group in validation_variant.groupby("action")\n            },\n        }\n'''
          if marker not in text:
              raise SystemExit('variant diagnostic marker not found')
          text=text.replace(marker,replacement,1)
          marker='''            base = _account(validation_variant, h2_start, pre_end, threshold, 0.01, 5.0, rule_map)\n            if base["filled_trades"] < 15 or base["geometric_daily_growth"] <= 0:\n                continue\n'''
          replacement='''            base = _account(validation_variant, h2_start, pre_end, threshold, 0.01, 5.0, rule_map)\n            selection_attempts.append({\n                "variant": variant,\n                "quantile": quantile,\n                "threshold_h2": threshold,\n                "base_account_h2": base,\n            })\n            if base["filled_trades"] < 15 or base["geometric_daily_growth"] <= 0:\n                continue\n'''
          if marker not in text:
              raise SystemExit('base selection marker not found')
          text=text.replace(marker,replacement,1)
          marker='''            "candidate_count_2023": len(candidates_2023), "action_rows_2023": len(rows_2023),\n            "ranking_effect": "NONE",\n'''
          replacement='''            "candidate_count_2023": len(candidates_2023), "action_rows_2023": len(rows_2023),\n            "raw_pre2024": raw_pre2024,\n            "selection_attempts": sorted(\n                selection_attempts,\n                key=lambda row: (\n                    row["base_account_h2"]["geometric_daily_growth"],\n                    row["base_account_h2"]["nav_multiple"],\n                ),\n                reverse=True,\n            ),\n            "ranking_effect": "NONE",\n'''
          if marker not in text:
              raise SystemExit('no-survivor summary marker not found')
          text=text.replace(marker,replacement,1)
          marker='''        "selected_pre2024": selected,\n        "frozen_threshold": frozen_threshold,\n'''
          replacement='''        "selected_pre2024": selected,\n        "raw_pre2024": raw_pre2024,\n        "selection_attempts": sorted(\n            selection_attempts,\n            key=lambda row: (\n                row["base_account_h2"]["geometric_daily_growth"],\n                row["base_account_h2"]["nav_multiple"],\n            ),\n            reverse=True,\n        ),\n        "frozen_threshold": frozen_threshold,\n'''
          if marker not in text:
              raise SystemExit('positive summary marker not found')
          p.write_text(text.replace(marker,replacement,1))
          PY
          python -m py_compile research/yt_trinity_ml/run_causal_action_v1.py
          git rm .github/workflows/yt-trinity-causal-action-diagnostics.yml
      - name: Commit diagnostic persistence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/run_causal_action_v1.py
          git commit -m 'Persist complete causal action economics funnel'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
