name: SMT reclaim frozen base API audit

on:
  push:
    branches:
      - agent/r11-smt-reclaim-ml-meta-001
    paths:
      - ".github/workflows/smt-reclaim-base-api-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/smt-reclaim-base-api-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smt-reclaim-base-api-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen import environment
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" "pandas==2.2.3" "requests==2.32.4"

      - name: Reconstruct frozen sources and record exact API contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit runtime
          git fetch --depth=1 origin agent/r11-altlag-opportunity-001
          git show FETCH_HEAD:research/bybit_altlag_opportunity_20260726/probe.py.zlib.b64 \
            > runtime/base_probe.py.zlib.b64
          git fetch --depth=1 origin agent/r11-smt-overreaction-reclaim-001
          git show FETCH_HEAD:research/smt_overreaction_reclaim_20260726/run.py \
            > audit/rule_engine.py
          python - <<'PY'
          import ast
          import base64
          import hashlib
          import inspect
          import json
          import pathlib
          import sys
          import zlib

          root = pathlib.Path('runtime')
          out = pathlib.Path('audit')
          encoded = (root / 'base_probe.py.zlib.b64').read_text().strip()
          source = zlib.decompress(base64.b64decode(encoded))
          source_path = root / 'base_probe.py'
          source_path.write_bytes(source)
          sys.path.insert(0, str(root.resolve()))
          import base_probe

          names = [
              '_download',
              'inspect_source',
              'aggregate',
              'continuous_features',
              'utc_start',
          ]
          sections = []
          manifest = {
              'schema_version': 2,
              'claim_id': 'CLM-20260726-SMT-RECLAIM-ML-001',
              'source_sha256': hashlib.sha256(source).hexdigest(),
              'source_bytes': len(source),
              'market_data_opened': False,
              'model_fit_performed': False,
              'pnl_computed': False,
              'orders_submitted': False,
              'symbols': {},
          }
          for name in names:
              value = getattr(base_probe, name, None)
              record = {'present': value is not None}
              if value is not None:
                  try:
                      record['signature'] = str(inspect.signature(value))
                  except (TypeError, ValueError):
                      record['signature'] = None
                  try:
                      text = inspect.getsource(value)
                  except (OSError, TypeError):
                      text = '<source unavailable>'
                  record['source_sha256'] = hashlib.sha256(text.encode()).hexdigest()
                  sections.append(f'\n===== {name} {record["signature"]} =====\n{text}')
              manifest['symbols'][name] = record

          rule_source = out.joinpath('rule_engine.py').read_text(encoding='utf-8')
          tree = ast.parse(rule_source)
          keys_by_base = {}
          for node in ast.walk(tree):
              if not isinstance(node, ast.Subscript):
                  continue
              if not isinstance(node.value, ast.Name):
                  continue
              key_node = node.slice
              if isinstance(key_node, ast.Constant) and isinstance(key_node.value, str):
                  keys_by_base.setdefault(node.value.id, set()).add(key_node.value)
          key_payload = {name: sorted(values) for name, values in sorted(keys_by_base.items())}
          manifest['rule_engine_sha256'] = hashlib.sha256(rule_source.encode()).hexdigest()
          manifest['subscript_keys_by_variable'] = key_payload

          (out / 'API.txt').write_text(''.join(sections), encoding='utf-8')
          (out / 'FEATURE_KEYS.json').write_text(
              json.dumps(key_payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (out / 'MANIFEST.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (out / 'base_probe.py').write_bytes(source)
          print(json.dumps(manifest, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: smt-reclaim-base-api-audit-${{ github.sha }}
          path: audit
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
