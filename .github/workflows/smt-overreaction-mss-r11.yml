name: Bybit attention SMT overreaction MSS fatal screen

on:
  push:
    branches:
      - agent/r11-smt-overreaction-mss-001
    paths:
      - "research/smt_overreaction_mss_20260726/**"
      - ".github/workflows/smt-overreaction-mss-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/smt_overreaction_mss_20260726/**"
      - ".github/workflows/smt-overreaction-mss-r11.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smt-overreaction-mss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  TZ: UTC
  CACHE: /tmp/smt-overreaction-mss-r11
  OUT: ${{ github.workspace }}/research_runs/smt_overreaction_mss_20260726

jobs:
  fatal-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deterministic research environment
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" "pandas==2.2.3" "requests==2.32.4" "pytest==8.3.4"

      - name: Reconstruct registered causal base dependency
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin agent/r11-altlag-opportunity-001
          mkdir -p runtime/study "$OUT"
          git show FETCH_HEAD:research/bybit_altlag_opportunity_20260726/probe.py.zlib.b64 > runtime/base_probe.py.zlib.b64
          python - <<'PY'
          import base64,hashlib,pathlib,zlib
          root=pathlib.Path('runtime')
          source=zlib.decompress(base64.b64decode((root/'base_probe.py.zlib.b64').read_text().strip()))
          (root/'study'/'base_probe.py').write_bytes(source)
          print('base source sha256',hashlib.sha256(source).hexdigest())
          PY
          cp -R research/smt_overreaction_mss_20260726/. runtime/study/
          sha256sum runtime/study/base_probe.py runtime/study/run.py runtime/study/test_run.py runtime/study/implementation_manifest.json runtime/study/implementation.py.gz.b64.part* runtime/study/preregistration.json > "$OUT/INPUT_SHA256SUMS.txt"

      - name: Verify implementation and causal execution
        shell: bash
        run: |
          set -euo pipefail
          cd runtime/study
          python -m py_compile base_probe.py run.py test_run.py
          pytest -q test_run.py | tee "$OUT/tests.log"
          python run.py self-test | tee "$OUT/self_test.log"
          cd "$GITHUB_WORKSPACE"
          python -m json.tool research/smt_overreaction_mss_20260726/WORK_CLAIM.json >/dev/null
          python -m json.tool research/smt_overreaction_mss_20260726/preregistration.json >/dev/null
          python scripts/validate_project.py

      - uses: actions/cache@v4
        with:
          path: /tmp/smt-overreaction-mss-r11
          key: smt-overreaction-mss-r11-${{ runner.os }}-${{ hashFiles('research/smt_overreaction_mss_20260726/preregistration.json') }}
          restore-keys: |
            smt-overreaction-mss-r11-${{ runner.os }}-

      - name: Run frozen untouched-date PnL screen
        shell: bash
        run: |
          set -euo pipefail
          cd runtime/study
          python run.py run \
            --cache "$CACHE" \
            --output "$OUT/result" \
            2>&1 | tee "$OUT/run.log"

      - name: Enforce stage and research-only boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary=json.loads((Path(os.environ['OUT'])/'result'/'summary.json').read_text())
          assert summary['hard_validity']=='PASS_FATAL_SCREEN_ONLY'
          assert summary['candidate_count']==288
          assert len(summary['sources'])==8
          assert summary['2024_opened'] is False
          assert summary['2025_opened'] is False
          assert summary['2026_opened'] is False
          assert summary['orders_submitted'] is False
          assert summary['ranking_eligible'] is False
          print('SEALED_RESEARCH_STATE_PASS')
          print('DECISION_READY_RESULT='+json.dumps(summary,sort_keys=True,separators=(',',':')))
          PY

      - name: Record immutable output hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find "$OUT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$OUT/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smt-overreaction-mss-${{ github.sha }}
          path: research_runs/smt_overreaction_mss_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
