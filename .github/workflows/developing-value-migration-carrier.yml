name: Validate developing-value migration result carrier

on:
  push:
    branches: [agent/developing-value-migration-core-001]
    paths:
      - 'research/developing_value_migration_core/**'
      - '.github/workflows/developing-value-migration-carrier.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/developing_value_migration_core/**'
      - '.github/workflows/developing-value-migration-carrier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  carrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and materialize exact implementation
        run: |
          set -euo pipefail
          cd research/developing_value_migration_core
          python materialize.py
          python -m py_compile materialized/run.py
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('RESULT.json').read_text())
          validation=json.loads(Path('VALIDATION_ATTESTATION.json').read_text())
          assert result['decision']=='RETIRED_2022_SPARSE_AND_NEGATIVE_GROSS_DEVELOPING_VALUE_MIGRATION_FAILURE'
          assert result['loaded_market_years_before_gate']==[2021, 2022]
          assert result['opened_2023'] is False
          assert validation['status']=='PASS'
          assert validation['two_fresh_processes']['all_byte_identical'] is True
          print('carrier valid')
          PY
