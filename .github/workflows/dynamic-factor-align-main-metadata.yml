name: Align dynamic-factor metadata to latest main bytes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/dynamic-factor-align-main.trigger'
      - '.github/workflows/dynamic-factor-align-main-metadata.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r8-dynamic-factor-merge-20260726
          fetch-depth: 0
          persist-credentials: true
      - name: Check out exact latest-main metadata and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            data/catalog/DS-BINANCE-USDM-4ASSET-FUNDING-MARK-2023-R1.json \
            research/reports/RES-20260725-DYNAMIC-FACTOR-001.json \
            research/validation/VAL-20260725-DYNAMIC-FACTOR-ACTUAL-FUNDING-001.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/dynamic-factor-align-main.trigger .github/workflows/dynamic-factor-align-main-metadata.yml
          git commit -m 'Align integrated dynamic-factor metadata to latest main'
          git push origin HEAD:agent/r8-dynamic-factor-merge-20260726
