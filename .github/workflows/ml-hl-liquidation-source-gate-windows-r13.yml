name: ML Hyperliquid liquidation source gate Windows

on:
  push:
    branches:
      - agent/r13-ml-hl-liquidation-001
    paths:
      - 'research/ml_hl_liquidation_20260726/**'
      - '.github/workflows/ml-hl-liquidation-source-gate-windows-r13.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-hl-liquidation-source-windows-r13-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'
  PYTHONUNBUFFERED: '1'
  PYTHONFAULTHANDLER: '1'
  ROOT: research/ml_hl_liquidation_20260726
  OUT: research_runs/ml_hl_liquidation_20260726/source-gate-windows

jobs:
  source-gate:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check requests==2.32.4 duckdb==1.4.3 pytest==8.3.5

      - name: Compile and test parser before network access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m json.tool "$env:ROOT/WORK_CLAIM.json" | Out-Null
          python -m json.tool "$env:ROOT/AMENDMENT_001_SOURCE_GATE_BEFORE_DATA.json" | Out-Null
          python -m json.tool "$env:ROOT/AMENDMENT_002_PINNED_PARQUET_TRANSPORT_BEFORE_DATA.json" | Out-Null
          python -m py_compile "$env:ROOT/probe_hl_liquidations.py" "$env:ROOT/test_probe_hl_liquidations.py"
          $env:PYTHONPATH = $env:ROOT
          pytest -q "$env:ROOT/test_probe_hl_liquidations.py"
          python "$env:ROOT/probe_hl_liquidations.py" --self-test
          python scripts/validate_project.py

      - name: Run outcome-sealed commit-pinned Parquet source gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:OUT) { Remove-Item -Recurse -Force $env:OUT }
          New-Item -ItemType Directory -Force -Path $env:OUT | Out-Null
          $env:PYTHONPATH = $env:ROOT
          python "$env:ROOT/probe_hl_liquidations.py" --output $env:OUT 2>&1 | Tee-Object -FilePath "$env:OUT/RUN.log"

      - name: Enforce source-only authority and frozen decision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['OUT'])
          result = json.loads((out / 'SOURCE_GATE_RESULT.json').read_text())
          assert result['claim_id'] == 'CLM-20260726-2058-ML-HL-LIQUIDATION-001'
          assert result['phase'] == 'OUTCOME_SEALED_SOURCE_GATE'
          assert result['transport'] == 'COMMIT_PINNED_CONSOLIDATED_PARQUET_PREDICATE_PUSHDOWN'
          for key in ('market_price_opened','future_return_opened','model_fitted','strategy_pnl_opened','official_2026_opened','orders_submitted'):
              assert result[key] is False
          expected = 'OPEN_FROZEN_HISTORICAL_MODEL_STAGE' if result['source_gate_pass'] else 'CLOSE_SOURCE_ROUTE_BEFORE_MARKET_OUTCOMES'
          assert result['scientific_decision'] == expected
          manifest_path = out / 'SOURCE_MANIFEST.json'
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text())
              assert manifest['resolved_revision'] == result.get('resolved_revision')
              assert len(manifest['frozen_paths']) == 36
          print(json.dumps({
              'source_gate_pass': result['source_gate_pass'],
              'decision': result['scientific_decision'],
              'parsed_files': result.get('parsed_file_count'),
              'explicit_liquidations': result.get('explicit_liquidation_event_count'),
              'target_positions': result.get('target_position_record_count'),
              'fatal_error': result.get('fatal_error'),
          }, sort_keys=True))
          '@ | python -

      - name: Freeze evidence identities
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:OUT/source" | Out-Null
          $inputs = @(
            'WORK_CLAIM.json',
            'PREREGISTRATION.md',
            'AMENDMENT_001_SOURCE_GATE_BEFORE_DATA.json',
            'AMENDMENT_002_PINNED_PARQUET_TRANSPORT_BEFORE_DATA.json',
            'SOURCES.md',
            'probe_hl_liquidations.py',
            'test_probe_hl_liquidations.py'
          )
          foreach ($name in $inputs) { Copy-Item "$env:ROOT/$name" "$env:OUT/source/$name" }
          @'
          from pathlib import Path
          import hashlib
          import os
          root=Path(os.environ['OUT'])
          rows=[]
          for path in sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'OUTPUT_SHA256SUMS.txt'):
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}")
          (root/'OUTPUT_SHA256SUMS.txt').write_text('\n'.join(rows)+'\n')
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-hl-liquidation-source-windows-${{ github.run_id }}
          path: research_runs/ml_hl_liquidation_20260726/source-gate-windows
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
