name: Minimal ML cross-venue L2 sweep router

on:
  push:
    branches:
      - agent/r11-ml-xvenue-l2-sweep-router-001
    paths:
      - "research/ml_xvenue_l2_sweep_20260726/**"
      - ".github/workflows/ml-xvenue-l2-sweep-r11.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/ml_xvenue_l2_sweep_20260726/**"
      - ".github/workflows/ml-xvenue-l2-sweep-r11.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-xvenue-l2-sweep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  NUMEXPR_NUM_THREADS: "2"

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen research environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scikit-learn==1.6.1" \
            "requests==2.32.4" \
            "pytest==8.3.4"

      - name: Compile and run causal tests
        run: |
          set -euo pipefail
          root=research/ml_xvenue_l2_sweep_20260726
          python "$root/reconstruct.py"
          python -m py_compile "$root/reconstruct.py" "$root/run.py" "$root/test_run.py"
          python "$root/run.py" self-test
          python -m pytest -q "$root/test_run.py"
          python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$root/preregistration.json" >/dev/null
          python scripts/validate_project.py

      - name: Cache immutable first-day public sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ml-xvenue-l2-sweep-cache
          key: ml-xvenue-l2-sweep-v1-btcusdt-2022-2023

      - name: Probe frozen Binance L2 and Bybit execution sources
        run: |
          set -euo pipefail
          root=research/ml_xvenue_l2_sweep_20260726
          mkdir -p research_runs/ml_xvenue_l2_sweep/probe
          python "$root/run.py" probe \
            --cache "$RUNNER_TEMP/ml-xvenue-l2-sweep-cache" \
            --output research_runs/ml_xvenue_l2_sweep/probe

      - name: Run frozen one-model fit and conditional development
        shell: bash
        run: |
          set -o pipefail
          root=research/ml_xvenue_l2_sweep_20260726
          out=research_runs/ml_xvenue_l2_sweep/output
          mkdir -p "$out"
          set +e
          python "$root/run.py" run \
            --cache "$RUNNER_TEMP/ml-xvenue-l2-sweep-cache" \
            --output "$out" \
            2>&1 | tee research_runs/ml_xvenue_l2_sweep/run.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          echo "$code" > research_runs/ml_xvenue_l2_sweep/SCIENTIFIC_EXIT_CODE.txt

      - name: Verify decision-ready result and stage seals
        run: |
          set -euo pipefail
          out=research_runs/ml_xvenue_l2_sweep/output
          test -s "$out/RESULT.json"
          (cd "$out" && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('research_runs/ml_xvenue_l2_sweep/output/RESULT.json').read_text())
          assert result['hard_validity_status']=='PASS_FATAL_SCREEN_ONLY'
          assert result['2024_opened'] is False
          assert result['2025_opened'] is False
          assert result['2026_opened'] is False
          assert result['orders_submitted'] is False
          assert result['ranking_role']=='NOT_RANK_ELIGIBLE_PRE2024_FATAL_SCREEN'
          assert result['development_opened']==bool(result['fit']['gate_pass'])
          print('VERIFIED_RESULT='+json.dumps(result,sort_keys=True,separators=(',',':')))
          PY

      - name: Record exact input checksums
        if: always()
        run: |
          set -euo pipefail
          root=research/ml_xvenue_l2_sweep_20260726
          mkdir -p research_runs/ml_xvenue_l2_sweep/input
          sha256sum \
            "$root/WORK_CLAIM.json" \
            "$root/preregistration.json" \
            "$root/README.md" \
            "$root/SOURCES.md" \
            "$root/reconstruct.py" \
            "$root/source_bundle_manifest.json" \
            "$root/run.py.gz.b64.part00" \
            "$root/run.py.gz.b64.part01" \
            "$root/run.py.gz.b64.part02" \
            "$root/run.py.gz.b64.part03" \
            "$root/run.py.gz.b64.part04" \
            "$root/test_run.py" \
            .github/workflows/ml-xvenue-l2-sweep-r11.yml \
            > research_runs/ml_xvenue_l2_sweep/input/INPUT_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-xvenue-l2-sweep-${{ github.sha }}
          path: research_runs/ml_xvenue_l2_sweep
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
