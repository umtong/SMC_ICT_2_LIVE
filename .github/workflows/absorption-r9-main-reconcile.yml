name: Reconcile revision-9 absorption PR with latest main

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/absorption-r9-main-reconcile.trigger'
      - '.github/workflows/absorption-r9-main-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r9-absorption-register-20260726
          fetch-depth: 0
          persist-credentials: true
      - name: Merge latest main and preserve append-only state
        shell: bash
        run: |
          set -euo pipefail
          cp control/current-state.md /tmp/r9-current-state.md
          cp control/ranking.json /tmp/r9-ranking.json
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          set -e
          cp /tmp/r9-current-state.md control/current-state.md
          cp /tmp/r9-ranking.json control/ranking.json
          python - <<'PY'
          import csv, io, json, pathlib, subprocess
          def show(ref,path):
            p=subprocess.run(['git','show',f'{ref}:{path}'],text=True,capture_output=True)
            return p.stdout if p.returncode==0 else ''
          for path,key in {
            'control/result-registry.jsonl':'result_id',
            'control/validation-cache.jsonl':'attestation_id',
          }.items():
            rows=[]; seen=set()
            for text in (show('origin/main',path),show('HEAD',path)):
              for raw in text.splitlines():
                if not raw.strip(): continue
                obj=json.loads(raw); ident=str(obj.get(key,''))
                if ident in seen: continue
                seen.add(ident); rows.append(obj)
            pathlib.Path(path).write_text('\n'.join(json.dumps(x,separators=(',',':'),ensure_ascii=False) for x in rows)+'\n',encoding='utf-8')
            subprocess.run(['git','add',path],check=True)
          path='control/work-claims.csv'
          texts=(show('origin/main',path),show('HEAD',path))
          header=None; rows=[]; seen=set()
          for text in texts:
            if not text.strip(): continue
            reader=csv.DictReader(io.StringIO(text))
            if header is None: header=reader.fieldnames
            for row in reader:
              ident=row.get('claim_id','')
              if ident in seen: continue
              seen.add(ident); rows.append(row)
          out=io.StringIO(); writer=csv.DictWriter(out,fieldnames=header,lineterminator='\n'); writer.writeheader(); writer.writerows(rows)
          pathlib.Path(path).write_text(out.getvalue(),encoding='utf-8')
          subprocess.run(['git','add',path],check=True)
          PY
          git add control/current-state.md control/ranking.json
          remaining=$(git diff --name-only --diff-filter=U)
          if [ -n "$remaining" ]; then
            echo 'Unexpected conflicts:'; echo "$remaining"; exit 1
          fi
          python scripts/validate_project.py
          python -m pytest -q
          python scripts/build_context_bundle.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/absorption-r9-main-reconcile.trigger .github/workflows/absorption-r9-main-reconcile.yml
          git commit -m 'Merge latest main into revision-9 absorption result'
          git push origin HEAD:agent/r9-absorption-register-20260726
