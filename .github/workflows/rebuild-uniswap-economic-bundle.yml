name: Rebuild signed Uniswap economic bundle carrier

on:
  push:
    branches:
      - agent/r34-uniswap-signed-flow-sqd-takeover-001
    paths:
      - "research/uniswap_signed_flow_sqd/ECONOMIC_BUNDLE.segment*.b64"
      - ".github/workflows/rebuild-uniswap-economic-bundle.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/uniswap_signed_flow_sqd/ECONOMIC_BUNDLE.segment*.b64"
      - ".github/workflows/rebuild-uniswap-economic-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-uniswap-economic-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r34-uniswap-signed-flow-sqd-takeover-001
      - name: Audit exact carrier segments
        run: |
          set -euo pipefail
          root=research/uniswap_signed_flow_sqd
          files=(
            "$root/ECONOMIC_BUNDLE.segment00.b64"
            "$root/ECONOMIC_BUNDLE.segment01.b64"
            "$root/ECONOMIC_BUNDLE.segment02.b64"
            "$root/ECONOMIC_BUNDLE.segment03.b64"
            "$root/ECONOMIC_BUNDLE.segment04a0.b64"
            "$root/ECONOMIC_BUNDLE.segment04a1.b64"
            "$root/ECONOMIC_BUNDLE.segment04b.b64"
            "$root/ECONOMIC_BUNDLE.segment05.b64"
            "$root/ECONOMIC_BUNDLE.segment06.b64"
            "$root/ECONOMIC_BUNDLE.segment07.b64"
            "$root/ECONOMIC_BUNDLE.segment08.b64"
            "$root/ECONOMIC_BUNDLE.segment09.b64"
            "$root/ECONOMIC_BUNDLE.segment10.b64"
            "$root/ECONOMIC_BUNDLE.segment11.b64"
          )
          wc -c "${files[@]}"
          sha256sum "${files[@]}"
          for n in 00 01 02 03 05 06 07 08 09 10; do
            test "$(wc -c < "$root/ECONOMIC_BUNDLE.segment${n}.b64")" -eq 2000
          done
          test "$(wc -c < "$root/ECONOMIC_BUNDLE.segment04a0.b64")" -eq 500
          test "$(wc -c < "$root/ECONOMIC_BUNDLE.segment04a1.b64")" -eq 500
          test "$(wc -c < "$root/ECONOMIC_BUNDLE.segment04b.b64")" -eq 1000
          test "$(wc -c < "$root/ECONOMIC_BUNDLE.segment11.b64")" -eq 280
          echo "daffd0f01affc1e6db814fc9490f0d29f6852649697beaea88506bdb9b067fd5  $root/ECONOMIC_BUNDLE.segment00.b64" | sha256sum -c -
          echo "76ad5f0bb3cd2ae875e6fe64299596950c3ecd94fcf86094a348d87c109b0134  $root/ECONOMIC_BUNDLE.segment01.b64" | sha256sum -c -
          echo "8845d271de9d30d67d9ecbaebd3dcb5c2442af9bff1ae2e88209aac3b1703fd7  $root/ECONOMIC_BUNDLE.segment02.b64" | sha256sum -c -
          echo "57b14504132718a3b77656b17d7f7acea4027de39612491edf1432807286afb5  $root/ECONOMIC_BUNDLE.segment03.b64" | sha256sum -c -
          echo "37d298e31e1fda96cf84e9f4648e2f7e108db6899226a6f2f44b54c1c0223f7c  $root/ECONOMIC_BUNDLE.segment04a0.b64" | sha256sum -c -
          echo "7b85e1f5f7361a2718a22e7c7f85501f65075992a84ae089b97c49e0493d25d0  $root/ECONOMIC_BUNDLE.segment04a1.b64" | sha256sum -c -
          echo "be3762c8d455a161f71c062a939fd45427794fd9ed8b41c9e760f0085dceb75d  $root/ECONOMIC_BUNDLE.segment04b.b64" | sha256sum -c -
          echo "8d400d0315e9aaaa5fc8ec167b03e6662eb5bc9e45c64307dd9264de7f28154b  $root/ECONOMIC_BUNDLE.segment05.b64" | sha256sum -c -
          echo "446252a0b84b9792dd50b806092576bc5ee097a0947d46a726dd2e788c7b9a7f  $root/ECONOMIC_BUNDLE.segment06.b64" | sha256sum -c -
          echo "f09b94d1f5da82adbf9282ed7253ad9afb443af75e08e216df192774ceab7a79  $root/ECONOMIC_BUNDLE.segment07.b64" | sha256sum -c -
          echo "af54d0d7a7e10421108666129fc74ae230e8655f8c25c2d75fc36568a61b899b  $root/ECONOMIC_BUNDLE.segment08.b64" | sha256sum -c -
          echo "122912a73bf8751b3327f29bcb4781e63a71360883bb4ea530c5018c275f0919  $root/ECONOMIC_BUNDLE.segment09.b64" | sha256sum -c -
          echo "9946ac85a3baacdf33b297fe07b69bad806e6eea04ca6adc11c3d26f3fef6ec9  $root/ECONOMIC_BUNDLE.segment10.b64" | sha256sum -c -
          echo "109a6dfee1aaa71ad9e48ea4cff1c6723acebb0eddcbd745205cd51c0daea7a4  $root/ECONOMIC_BUNDLE.segment11.b64" | sha256sum -c -
      - name: Rebuild and verify carrier
        run: |
          set -euo pipefail
          root=research/uniswap_signed_flow_sqd
          cat \
            "$root/ECONOMIC_BUNDLE.segment00.b64" \
            "$root/ECONOMIC_BUNDLE.segment01.b64" \
            "$root/ECONOMIC_BUNDLE.segment02.b64" \
            "$root/ECONOMIC_BUNDLE.segment03.b64" \
            "$root/ECONOMIC_BUNDLE.segment04a0.b64" \
            "$root/ECONOMIC_BUNDLE.segment04a1.b64" \
            "$root/ECONOMIC_BUNDLE.segment04b.b64" \
            "$root/ECONOMIC_BUNDLE.segment05.b64" \
            "$root/ECONOMIC_BUNDLE.segment06.b64" \
            "$root/ECONOMIC_BUNDLE.segment07.b64" \
            "$root/ECONOMIC_BUNDLE.segment08.b64" \
            "$root/ECONOMIC_BUNDLE.segment09.b64" \
            "$root/ECONOMIC_BUNDLE.segment10.b64" \
            "$root/ECONOMIC_BUNDLE.segment11.b64" \
            > "$root/ECONOMIC_BUNDLE.tar.gz.b64"
          base64 -d "$root/ECONOMIC_BUNDLE.tar.gz.b64" > /tmp/economic-bundle.tar.gz
          echo "f466c08b520afc93261d38ce665122c762c9ca901cfe5781c4dac26eb04b5fcf  /tmp/economic-bundle.tar.gz" | sha256sum -c -
          mkdir -p /tmp/economic-bundle
          tar -xzf /tmp/economic-bundle.tar.gz -C /tmp/economic-bundle
          echo "5bf93ac504fad6d676a64d1e1ee900794529a4f9a7d9f7d5dc4741793d1e233e  /tmp/economic-bundle/full_history_sqd.py" | sha256sum -c -
          echo "b517d95fa3f8a07041653e00dcaffe0b5392087d23fbc5376563f4ce8890869a  /tmp/economic-bundle/test_full_history_sqd.py" | sha256sum -c -
          echo "67d662fb0255621df687157a0535dd35f06417e12beb4a195cf7d3d5bd32de0f  /tmp/economic-bundle/economic_screen.py" | sha256sum -c -
          echo "69e1fbdea120c47362fd71f4205770f49bba92620965a769f967f579b5413d92  /tmp/economic-bundle/test_economic_screen.py" | sha256sum -c -
      - name: Publish exact carrier
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/uniswap_signed_flow_sqd/ECONOMIC_BUNDLE.tar.gz.b64
          if ! git diff --cached --quiet; then
            git commit -m "Repair signed Uniswap economic bundle carrier"
            git push origin HEAD:agent/r34-uniswap-signed-flow-sqd-takeover-001
          fi
