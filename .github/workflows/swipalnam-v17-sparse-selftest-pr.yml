name: Swipalnam V17 sparse sweep equivalence

on:
  pull_request:
    branches: [agent/r22-canonical-halfyear-market-data-001]
    paths:
      - research/swipalnam_smc_ml/experiments/liquidity_delivery_ml_v17_sparse_sweep.py
      - .github/workflows/swipalnam-v17-sparse-selftest-pr.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swipalnam-v17-sparse-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q \
            "numpy>=1.26" "pandas>=2.2" "pyarrow>=16" \
            "scikit-learn>=1.5" "requests>=2.32"
      - name: Compile and prove economic-field equivalence
        run: |
          set -euo pipefail
          python -m py_compile research/swipalnam_smc_ml/experiments/liquidity_delivery_ml*.py
          python research/swipalnam_smc_ml/experiments/liquidity_delivery_ml_v17_sparse_sweep.py --self-test
