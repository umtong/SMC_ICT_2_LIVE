name: Canonical Bybit half-year market data

on:
  pull_request:
    branches: [main]
    paths:
      - control/canonical-data-build-trigger.json
      - scripts/market_data/build_canonical_bybit.py
      - scripts/market_data/bybit_client.py
      - scripts/market_data/bybit_fetch.py
      - scripts/market_data/canonical_spec.py
      - scripts/market_data/verify_canonical_bybit.py
      - data/contracts/canonical_bybit_usdt_linear_v1.json
      - .github/workflows/canonical-bybit-halfyear-data.yml
  workflow_dispatch:
    inputs:
      segment:
        description: Physical segment or REQUIRED_SET
        required: true
        default: REQUIRED_SET
        type: choice
        options:
          - REQUIRED_SET
          - PRE_2024_2020
          - PRE_2024_2021
          - PRE_2024_2022
          - PRE_2024_2023
          - 2024_H1
          - 2024_H2
          - 2025_H1
          - 2025_H2
          - 2026_H1
      symbol:
        description: One symbol or ALL
        required: true
        default: ALL
        type: choice
        options: [ALL, BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
  push:
    branches:
      - agent/r22-canonical-halfyear-market-data-001
    paths:
      - control/canonical-data-build-trigger.json

concurrency:
  group: canonical-bybit-halfyear-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  BYBIT_PUBLIC_BASE_URL: https://api.manepa.jp

jobs:
  unit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install ".[dev]"
      - name: Compile and test
        run: |
          python -m py_compile scripts/market_data/build_canonical_bybit.py scripts/market_data/bybit_client.py scripts/market_data/bybit_fetch.py scripts/market_data/canonical_spec.py scripts/market_data/load_canonical_bybit.py scripts/market_data/verify_canonical_bybit.py
          pytest -q tests/test_canonical_market_data.py
          python -m json.tool data/contracts/canonical_bybit_usdt_linear_v1.json >/dev/null

  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      segments: ${{ steps.resolve.outputs.segments }}
      symbols: ${{ steps.resolve.outputs.symbols }}
    steps:
      - id: resolve
        shell: bash
        env:
          INPUT_SEGMENT: ${{ inputs.segment }}
          INPUT_SYMBOL: ${{ inputs.symbol }}
        run: |
          segment="${INPUT_SEGMENT:-REQUIRED_SET}"
          symbol="${INPUT_SYMBOL:-ALL}"
          if [[ "$segment" == "REQUIRED_SET" ]]; then
            segments='["PRE_2024_2023","2024_H1","2024_H2","2025_H1","2025_H2","2026_H1"]'
          else
            segments="[\"$segment\"]"
          fi
          if [[ "$symbol" == "ALL" ]]; then
            symbols='["BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT"]'
          else
            symbols="[\"$symbol\"]"
          fi
          echo "segments=$segments" >> "$GITHUB_OUTPUT"
          echo "symbols=$symbols" >> "$GITHUB_OUTPUT"

  build-shard:
    needs: [unit-contract, resolve-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        segment: ${{ fromJSON(needs.resolve-matrix.outputs.segments) }}
        symbol: ${{ fromJSON(needs.resolve-matrix.outputs.symbols) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared build dependencies
        run: python -m pip install .
      - name: Build official Bybit shard through accessible official mainnet host
        run: |
          python scripts/market_data/build_canonical_bybit.py \
            --segment "${{ matrix.segment }}" \
            --symbol "${{ matrix.symbol }}" \
            --base-url "$BYBIT_PUBLIC_BASE_URL" \
            --timeout 30 \
            --max-attempts 8 \
            --min-request-interval 0.10 \
            --out artifact
      - name: Verify immutable shard
        run: |
          python scripts/market_data/verify_canonical_bybit.py \
            "artifact/${{ matrix.segment }}/${{ matrix.symbol }}" \
            | tee "artifact/${{ matrix.segment }}/${{ matrix.symbol }}/VERIFICATION.json"
      - name: Upload Drive-transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-bybit-${{ matrix.segment }}-${{ matrix.symbol }}
          path: artifact/${{ matrix.segment }}/${{ matrix.symbol }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
