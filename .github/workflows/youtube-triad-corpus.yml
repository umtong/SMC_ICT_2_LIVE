name: YouTube triad transcript corpus

on:
  workflow_dispatch:
  push:
    branches:
      - agent/youtube-triad-ml-alpha-001
    paths:
      - scripts/youtube/research_triad_channels.py
      - tests/test_youtube_triad_collector.py
      - control/youtube-triad-corpus-trigger.json
      - .github/workflows/youtube-triad-corpus.yml

concurrency:
  group: youtube-triad-corpus-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collector dependencies
        run: python -m pip install --upgrade "yt-dlp[default]" "pytest>=8"
      - name: Verify collector code
        run: |
          python -m py_compile scripts/youtube/research_triad_channels.py
          pytest -q tests/test_youtube_triad_collector.py
      - name: Collect all public uploads and captions
        shell: bash
        run: |
          set +e
          mkdir -p artifact
          python scripts/youtube/research_triad_channels.py \
            --out artifact \
            --workers 3 \
            > artifact/run.stdout.log \
            2> artifact/run.stderr.log
          echo "$?" > artifact/exit-code.txt
          exit 0
      - name: Upload immutable corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-triad-public-transcripts-${{ github.run_id }}
          path: artifact
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Enforce usable inventory
        shell: bash
        run: test "$(cat artifact/exit-code.txt)" = "0"
