name: YT Trinity causal SMT contract comparison v1

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/run_smt_contract_comparison_v1.py
      - research/yt_trinity_ml/system/smt.py
      - research/yt_trinity_ml/system/corpus_alpha.py
      - research/yt_trinity_ml/system/research_pipeline.py
      - .github/workflows/yt-trinity-smt-contract-v1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-smt-contract-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: a2bb231966a517d29495bed7673e4d08ab8e30a9
          path: canonical_repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deterministic dependencies
        run: python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'scikit-learn==1.6.1' 'pyarrow==19.0.1'
      - name: Verify required SMC and SMT contracts exist
        run: |
          python - <<'PY'
          from pathlib import Path
          core = Path('research/yt_trinity_ml/system/corpus_alpha.py').read_text()
          smt = Path('research/yt_trinity_ml/system/smt.py').read_text()
          for token in ('smt_confirmation_mode', 'reference_time_mode', 'order_block_range_mode', 'fvg_search_mode'):
              assert token in core, token
          assert 'add_pair_smt_features' in smt
          PY
      - name: Download canonical 2023 BTC and ETH shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/PRE_2024_2023/BTCUSDT input/PRE_2024_2023/ETHUSDT output
          fetch_artifact() {
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"
          }
          fetch_artifact 8636781702 /tmp/btc.zip
          fetch_artifact 8636761741 /tmp/eth.zip
          unzip -q /tmp/btc.zip -d input/PRE_2024_2023/BTCUSDT
          unzip -q /tmp/eth.zip -d input/PRE_2024_2023/ETHUSDT
          for symbol in BTCUSDT ETHUSDT; do
            root="input/PRE_2024_2023/${symbol}"
            if [[ ! -f "${root}/DATASET_MANIFEST.json" ]]; then
              manifest="$(find "${root}" -name DATASET_MANIFEST.json -print -quit)"
              test -n "${manifest}"
              source_dir="$(dirname "${manifest}")"
              tmp="${root}.flat"
              mv "${source_dir}" "${tmp}"
              rm -rf "${root}"
              mv "${tmp}" "${root}"
            fi
          done
      - name: Execute H1 selection and sealed H2 validation
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set +e
          python research/yt_trinity_ml/run_smt_contract_comparison_v1.py \
            --repo-root canonical_repo \
            --data-root input \
            --segments PRE_2024_2023 \
            --output output \
            2>&1 | tee output/STDOUT.log
          code=${PIPESTATUS[0]}
          echo "$code" > output/EXIT_CODE.txt
          exit 0
      - name: Persist exact SMT result
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path('output')
          result_path = out / 'SMT_CONTRACT_RESULT.json'
          code = int((out / 'EXIT_CODE.txt').read_text().strip()) if (out / 'EXIT_CODE.txt').exists() else 99
          result = json.loads(result_path.read_text()) if result_path.exists() else None
          log = (out / 'STDOUT.log').read_text(errors='replace') if (out / 'STDOUT.log').exists() else ''
          pointer = {
              'schema_version': 1,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'stage': 'PRE2024_SMT_CONTRACT_H1_SELECTION_H2_VALIDATION_NOT_RANKABLE',
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'exit_code': code,
              'job_status': 'success' if code == 0 else 'execution_failure_not_economic_failure',
              'result': result,
              'result_sha256': hashlib.sha256(result_path.read_bytes()).hexdigest() if result_path.exists() else None,
              'stdout_tail': log[-16000:],
              'ranking_effect': 'NONE_PRE2024_NOT_RANKABLE',
          }
          Path('research/yt_trinity_ml/SMT_CONTRACT_V1_POINTER.json').write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/SMT_CONTRACT_V1_POINTER.json
          if ! git diff --cached --quiet; then
            git commit -m "Record SMT contract comparison ${GITHUB_RUN_ID}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin agent/r22-yt-trinity-ml-001
              if git push origin HEAD:agent/r22-yt-trinity-ml-001; then break; fi
              sleep $((attempt * 3))
            done
          fi
      - name: Hash and upload evidence
        if: always()
        run: (cd output && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-smt-contract-v1-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Fail after evidence preservation
        if: always()
        run: test "$(cat output/EXIT_CODE.txt 2>/dev/null || echo 99)" = 0
