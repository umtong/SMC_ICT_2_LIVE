name: Cross-venue price-discovery conditional development V2

on:
  push:
    branches:
      - agent/r5-cross-venue-price-discovery-001
    paths:
      - "research/cross_venue_price_discovery_20260725/preregistration_v2.json"
      - "research/cross_venue_price_discovery_20260725/cross_venue_pilot.py"
      - "research/cross_venue_price_discovery_20260725/cross_venue_pilot_v2.py"
      - "research/cross_venue_price_discovery_20260725/cross_venue_development_v2.py"
      - "research/cross_venue_price_discovery_20260725/test_cross_venue_pilot_v2.py"
      - ".github/workflows/cross-venue-price-discovery-development-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r5-cross-venue-development-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sequential-research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-cross-venue-price-discovery-001
          fetch-depth: 1

      - name: Install fixed environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "requests==2.32.4" "pytest==8.3.4"
          mkdir -p research_runs/cross_venue_price_discovery_20260725/development_v2
          python - <<'PY'
          import json, numpy, pandas, platform, requests, sys
          from pathlib import Path
          Path('research_runs/cross_venue_price_discovery_20260725/development_v2/environment.json').write_text(
              json.dumps({
                  'python':sys.version,
                  'platform':platform.platform(),
                  'numpy':numpy.__version__,
                  'pandas':pandas.__version__,
                  'requests':requests.__version__,
                  'credentials_used':False,
                  'orders_submitted':False,
                  'paper_live_started':False,
                  'selection_opened':False,
                  'confirmation_opened':False,
                  '2026_opened':False,
              },indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Verify frozen contract and causal tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_venue_price_discovery_20260725
          python -m py_compile "$root/cross_venue_pilot.py" "$root/cross_venue_pilot_v2.py" "$root/cross_venue_development_v2.py" "$root/test_cross_venue_pilot_v2.py"
          sha256sum "$root/preregistration_v2.json" "$root/cross_venue_pilot.py" "$root/cross_venue_pilot_v2.py" "$root/cross_venue_development_v2.py" "$root/test_cross_venue_pilot_v2.py" > research_runs/cross_venue_price_discovery_20260725/development_v2/INPUT_SHA256SUMS.txt
          PYTHONPATH="$root" pytest -q "$root/test_cross_venue_pilot_v2.py" 2>&1 | tee research_runs/cross_venue_price_discovery_20260725/development_v2/tests.log

      - name: Run admissible V2 fatal-edge pilot
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_venue_price_discovery_20260725
          PYTHONPATH="$root" python "$root/cross_venue_pilot_v2.py" \
            --output research_runs/cross_venue_price_discovery_20260725/development_v2/pilot \
            --cache "$RUNNER_TEMP/xvenue-v2-cache" \
            2>&1 | tee research_runs/cross_venue_price_discovery_20260725/development_v2/pilot.log

      - name: Conditionally open remaining 2022-2023 development days
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_venue_price_discovery_20260725
          PYTHONPATH="$root" python "$root/cross_venue_development_v2.py" \
            --pilot-dir research_runs/cross_venue_price_discovery_20260725/development_v2/pilot \
            --output research_runs/cross_venue_price_discovery_20260725/development_v2/result \
            --cache "$RUNNER_TEMP/xvenue-v2-cache" \
            2>&1 | tee research_runs/cross_venue_price_discovery_20260725/development_v2/development.log
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('research_runs/cross_venue_price_discovery_20260725/development_v2')
          item=json.loads((root/'result'/'DEVELOPMENT_RESULT.json').read_text())
          status={
              'stage':item['stage'],
              'causal_version':2,
              'development_opened':bool(item.get('development_opened',False)),
              'development_gate_pass_count':int(item.get('development_gate_pass_count',0)),
              'selection_opened':False,
              'confirmation_opened':False,
              '2026_opened':False,
              'orders_submitted':False,
              'paper_live_started':False,
              'champion_eligible':False,
          }
          (root/'RUN_STATUS.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n')
          print(json.dumps(status,sort_keys=True))
          PY

      - name: Record immutable checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research_runs/cross_venue_price_discovery_20260725/development_v2
          find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-venue-price-discovery-development-v2-${{ github.sha }}
          path: research_runs/cross_venue_price_discovery_20260725/development_v2
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
