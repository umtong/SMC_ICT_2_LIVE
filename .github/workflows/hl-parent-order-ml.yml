name: Hyperliquid parent-order delivery ML

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hl-parent-order-ml.yml"
      - "research/hyperliquid_wallet_flow_20260726/preregistration_parent_order_ml_v1.json"
      - "research/hyperliquid_wallet_flow_20260726/PRE_OUTCOME_IMPLEMENTATION_CORRECTION_001.json"
      - "research/hyperliquid_wallet_flow_20260726/parent_order_ml_source_manifest.json"
      - "research/hyperliquid_wallet_flow_20260726/run_parent_order_ml.py.gz"
      - "research/hyperliquid_wallet_flow_20260726/reconstruct_parent_order_ml.py"
      - "research/hyperliquid_wallet_flow_20260726/test_parent_order_ml.py"
  push:
    branches:
      - agent/r11-hl-wallet-flow-001
    paths:
      - ".github/workflows/hl-parent-order-ml.yml"
      - "research/hyperliquid_wallet_flow_20260726/preregistration_parent_order_ml_v1.json"
      - "research/hyperliquid_wallet_flow_20260726/PRE_OUTCOME_IMPLEMENTATION_CORRECTION_001.json"
      - "research/hyperliquid_wallet_flow_20260726/parent_order_ml_source_manifest.json"
      - "research/hyperliquid_wallet_flow_20260726/run_parent_order_ml.py.gz"
      - "research/hyperliquid_wallet_flow_20260726/reconstruct_parent_order_ml.py"
      - "research/hyperliquid_wallet_flow_20260726/test_parent_order_ml.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hl-parent-order-ml-${{ github.sha }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 \
            orjson==3.10.18 \
            pyarrow==20.0.0 \
            requests==2.32.4 \
            scikit-learn==1.6.1 \
            pytest==8.3.4

      - name: Reconstruct and validate the frozen single model
        shell: bash
        run: |
          set -euo pipefail
          root=research/hyperliquid_wallet_flow_20260726
          out=research_runs/hyperliquid_parent_order_ml_20260726
          mkdir -p "$out"
          python "$root/reconstruct_parent_order_ml.py" 2>&1 | tee "$out/RECONSTRUCT.log"
          python -m py_compile "$root/run_parent_order_ml.py" "$root/test_parent_order_ml.py" 2>&1 | tee "$out/COMPILE.log"
          PYTHONPATH="$root" pytest -q "$root/test_parent_order_ml.py" 2>&1 | tee "$out/PYTEST.log"
          PYTHONPATH="$root" python "$root/run_parent_order_ml.py" --self-test 2>&1 | tee "$out/SELF_TEST.log"
          python scripts/validate_project.py 2>&1 | tee "$out/PROJECT_VALIDATION.log"
          python -m json.tool "$root/preregistration_parent_order_ml_v1.json" >/dev/null
          python -m json.tool "$root/PRE_OUTCOME_IMPLEMENTATION_CORRECTION_001.json" >/dev/null
          python -m json.tool "$root/parent_order_ml_source_manifest.json" >/dev/null

      - uses: actions/cache@v4
        with:
          path: /tmp/hyperliquid-parent-order-ml
          key: hl-parent-order-ml-${{ hashFiles('research/hyperliquid_wallet_flow_20260726/source_selection_v2.json', 'research/hyperliquid_wallet_flow_20260726/preregistration_parent_order_ml_v1.json', 'research/hyperliquid_wallet_flow_20260726/PRE_OUTCOME_IMPLEMENTATION_CORRECTION_001.json') }}

      - name: Execute frozen pre-2026 parent-order screen
        shell: bash
        run: |
          set -euo pipefail
          root=research/hyperliquid_wallet_flow_20260726
          out=research_runs/hyperliquid_parent_order_ml_20260726
          PYTHONPATH="$root" python "$root/run_parent_order_ml.py" \
            --selection "$root/source_selection_v2.json" \
            --preregistration "$root/preregistration_parent_order_ml_v1.json" \
            --work-dir /tmp/hyperliquid-parent-order-ml \
            --output "$out" \
            --download-workers 4 \
            2>&1 | tee "$out/RUN.log"

      - name: Enforce minimal-system and sealed boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_runs/hyperliquid_parent_order_ml_20260726')
          result=json.loads((root/'RESULT.json').read_text())
          contract=json.loads((root/'MODEL_CONTRACT.json').read_text())
          assert result['claim_id']=='CLM-20260726-1040-HL-WALLET-FLOW-001'
          assert result['experiment_id']=='HL-PARENT-ORDER-DELIVERY-ML-V1'
          assert contract['one_model_family'] is True
          assert contract['direction_lock'] is True
          assert contract['one_economic_decision_rule'] is True
          assert result['model_family_count']==1
          assert result['hyperparameter_grid'] is False
          assert result['direction_reversal_allowed'] is False
          assert result['one_global_slot'] is True
          assert result['bybit_execution_opened'] is False
          assert result['official_2024_2026_opened'] is False
          assert result['rank_eligible'] is False
          assert result['orders_submitted'] is False
          confirmation=result.get('confirmation')
          if confirmation is not None and confirmation.get('gate_passed') is True:
              assert result['validation_file_count_read']==8
          else:
              assert result['validation_file_count_read']==0
          print(json.dumps({
              'status':result['status'],
              'confirmation_gate':None if confirmation is None else confirmation.get('gate_passed'),
              'validation_read':result['validation_file_count_read'],
              'decision':result['decision'],
          },sort_keys=True))
          PY

      - name: Record immutable identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/hyperliquid_wallet_flow_20260726
          out=research_runs/hyperliquid_parent_order_ml_20260726
          mkdir -p "$out"
          sha256sum \
            "$root/source_selection_v2.json" \
            "$root/preregistration_parent_order_ml_v1.json" \
            "$root/PRE_OUTCOME_IMPLEMENTATION_CORRECTION_001.json" \
            "$root/parent_order_ml_source_manifest.json" \
            "$root/run_parent_order_ml.py.gz" \
            "$root/reconstruct_parent_order_ml.py" \
            "$root/test_parent_order_ml.py" \
            "$root/run_parent_order_ml.py" \
            > "$out/INPUT_SHA256SUMS.txt" || true
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyperliquid-parent-order-ml-${{ github.sha }}
          path: research_runs/hyperliquid_parent_order_ml_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
