name: YT Trinity execution realism patch

on:
  pull_request:
    branches: [main]
    paths:
      - research/yt_trinity_ml/system/execution.py
      - research/yt_trinity_ml/tests/test_execution_realism.py
      - .github/workflows/yt-trinity-execution-realism-patch.yml
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - research/yt_trinity_ml/system/execution.py
      - research/yt_trinity_ml/tests/test_execution_realism.py
      - .github/workflows/yt-trinity-execution-realism-patch.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-execution-realism-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply exact execution corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("research/yt_trinity_ml/system/execution.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'displayed = row.get("ask_size") if side > 0 else row.get("bid_size")':
                  'displayed = row.get("bid_size") if side > 0 else row.get("ask_size")',
              'self._close_quantity(account, timestamp, row, position.open_quantity, ExitReason.TARGET, True)':
                  'self._close_quantity(account, timestamp, row, position.open_quantity, ExitReason.TARGET, False)',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count == 0 and new in text:
                  continue
              if count != 1:
                  raise SystemExit(f"expected exactly one execution replacement, found {count}: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" "pandas==2.2.3" "scikit-learn==1.6.1" "pytest==8.3.5"
      - name: Run execution and system regressions
        run: |
          python -m py_compile research/yt_trinity_ml/system/execution.py
          pytest -q \
            research/yt_trinity_ml/tests/test_execution_realism.py \
            research/yt_trinity_ml/tests/test_entry_fill_guard.py \
            research/yt_trinity_ml/tests/test_yt_trinity_system.py
      - name: Persist tested execution patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/yt_trinity_ml/system/execution.py \
            research/yt_trinity_ml/tests/test_execution_realism.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct passive queue side and target execution"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
