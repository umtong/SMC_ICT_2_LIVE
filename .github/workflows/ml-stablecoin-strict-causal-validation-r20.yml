name: Validate strict stablecoin pre-entry causality

on:
  push:
    branches:
      - agent/r20-ml-stablecoin-strict-causal-001
    paths:
      - '.github/workflows/ml-stablecoin-strict-causal-validation-r20.yml'
      - 'sourcefix/ml_stablecoin_causal_guard_20260726/**'
      - 'research/ml_stablecoin_issuance_economic_20260726/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-stablecoin-strict-causal-validation-r20.yml'
      - 'sourcefix/ml_stablecoin_causal_guard_20260726/**'
      - 'research/ml_stablecoin_issuance_economic_20260726/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stablecoin-strict-causal-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fixed environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 pandas==2.2.3 requests==2.32.4 \
            scikit-learn==1.6.1 pyarrow==18.1.0 pytest==8.3.5

      - name: Reconstruct and test strict information boundary only
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_stablecoin_issuance_economic_20260726
          fix=sourcefix/ml_stablecoin_causal_guard_20260726
          out=research_runs/ml_stablecoin_strict_causal_validation_20260727
          mkdir -p "$out"
          python "$root/reconstruct.py"
          python -m py_compile \
            "$root/run.py" "$root/run_causal.py" "$root/test_run.py" \
            "$fix/strict_guard.py" "$fix/causal_guard.py" "$fix/test_causal_guard.py"
          PYTHONPATH="$root" pytest -q "$root/test_run.py" | tee "$out/ORIGINAL_TESTS.log"
          PYTHONPATH="$root:$fix" pytest -q "$fix/test_causal_guard.py" | tee "$out/STRICT_TESTS.log"
          PYTHONPATH="$root:$fix" python "$fix/causal_guard.py" self-test | tee "$out/STRICT_SELF_TEST.log"
          python -m json.tool "$fix/CORRECTION_001_ENTRY_BAR_LOOKAHEAD_AND_UNRESOLVED_PATH_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$fix/CORRECTION_002_PREENTRY_INFORMATION_BOUNDARY_BEFORE_OUTCOME.json" >/dev/null
          python - <<'PY' | tee "$out/AUTHORITY.json"
          import json
          payload={
            "claim_id":"CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001",
            "correction_id":"CORRECTION-20260727-ML-STABLECOIN-PREENTRY-INFORMATION-BOUNDARY-002",
            "status":"STRICT_CAUSAL_VALIDATION_ONLY",
            "source_pass_consumed":False,
            "market_archive_opened":False,
            "label_computed":False,
            "model_fit":False,
            "trade_or_pnl_opened":False,
            "official_2024h1_opened":False,
            "credentials_used":False,
            "orders_submitted":False,
          }
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
          set +e
          python scripts/validate_project.py 2>&1 | tee "$out/PROJECT_VALIDATION.log"
          echo ${PIPESTATUS[0]} > "$out/PROJECT_VALIDATION_EXIT_CODE.txt"
          set -e
          sha256sum \
            "$fix/strict_guard.py" "$fix/causal_guard.py" "$fix/test_causal_guard.py" \
            "$fix/CORRECTION_001_ENTRY_BAR_LOOKAHEAD_AND_UNRESOLVED_PATH_BEFORE_OUTCOME.json" \
            "$fix/CORRECTION_002_PREENTRY_INFORMATION_BOUNDARY_BEFORE_OUTCOME.json" \
            > "$out/INPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-strict-causal-validation-${{ github.sha }}
          path: research_runs/ml_stablecoin_strict_causal_validation_20260727
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
