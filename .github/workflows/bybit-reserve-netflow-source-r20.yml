name: Bybit reserve-wallet collateral-flow source gate

on:
  push:
    branches:
      - agent/r20-bybit-reserve-netflow-source-001
    paths:
      - 'research/bybit_reserve_netflow_20260726/**'
      - '.github/workflows/bybit-reserve-netflow-source-r20.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/bybit_reserve_netflow_20260726/**'
      - '.github/workflows/bybit-reserve-netflow-source-r20.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-reserve-netflow-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen source environment
        run: python -m pip install --disable-pip-version-check requests==2.32.4 pytest==8.3.5
      - name: Compile and run adversarial source tests
        run: |
          set -euo pipefail
          root=research/bybit_reserve_netflow_20260726
          out=research_runs/bybit_reserve_netflow_20260726
          mkdir -p "$out"
          python -m py_compile "$root/source_gate.py" "$root/test_source_gate.py"
          PYTHONPATH="$root" pytest -q "$root/test_source_gate.py" | tee "$out/PYTEST.log"
          PYTHONPATH="$root" python "$root/source_gate.py" --self-test | tee "$out/SELF_TEST.log"
          python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$root/preregistration.json" >/dev/null
      - name: Query January 2023 source only
        run: |
          set -euo pipefail
          root=research/bybit_reserve_netflow_20260726
          out=research_runs/bybit_reserve_netflow_20260726
          PYTHONPATH="$root" python "$root/source_gate.py" --output "$out" 2>&1 | tee "$out/RUN.log"
          test -f "$out/SOURCE_GATE_RESULT.json"
          python -m json.tool "$out/SOURCE_GATE_RESULT.json" >/dev/null
      - name: Enforce outcome seal and record decision
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research_runs/bybit_reserve_netflow_20260726/SOURCE_GATE_RESULT.json')
          r=json.loads(p.read_text())
          assert r['claim_id']=='CLM-20260726-1710-BYBIT-RESERVE-NETFLOW-001'
          assert r['market_outcome_opened'] is False
          assert r['model_fit'] is False
          assert r['trade_or_pnl_opened'] is False
          assert r['official_2024_2026_opened'] is False
          assert r['credentials_used'] is False
          assert r['orders_submitted'] is False
          assert r['status'] in {'PASS','FAIL_SOURCE_GATE','SOURCE_UNAVAILABLE'}
          print(json.dumps({
              'status': r['status'],
              'event_count': r.get('event_count'),
              'large_event_counts': r.get('large_event_counts'),
              'direction_counts': r.get('direction_counts'),
              'independent_match': r.get('independent_verification',{}).get('matched'),
              'next': 'FREEZE_ECONOMIC_CONTRACT' if r['status']=='PASS' else 'CLOSE_SOURCE_ROUTE',
          },sort_keys=True))
          PY
      - name: Validate current project without blocking source evidence
        if: always()
        run: |
          set +e
          python scripts/validate_project.py 2>&1 | tee research_runs/bybit_reserve_netflow_20260726/PROJECT_VALIDATION.log
          echo ${PIPESTATUS[0]} > research_runs/bybit_reserve_netflow_20260726/PROJECT_VALIDATION_EXIT_CODE.txt
          exit 0
      - name: Freeze hashes
        if: always()
        run: |
          set -euo pipefail
          root=research/bybit_reserve_netflow_20260726
          out=research_runs/bybit_reserve_netflow_20260726
          sha256sum "$root"/README.md "$root"/WORK_CLAIM.json "$root"/preregistration.json "$root"/source_gate.py "$root"/test_source_gate.py > "$out/INPUT_SHA256SUMS.txt"
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bybit-reserve-netflow-source-${{ github.run_id }}
          path: research_runs/bybit_reserve_netflow_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
