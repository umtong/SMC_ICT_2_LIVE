name: Execute minimal ML BitMEX liquidation relay

on:
  pull_request:
    branches:
      - main
    paths:
      - "research/ml_bitmex_liquidation_20260726/README.md"
      - "research/ml_bitmex_liquidation_20260726/preregistration.json"
      - "research/ml_bitmex_liquidation_20260726/bitmex_liq_ml.py.zlib.b64"
      - ".github/workflows/ml-bitmex-liquidation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ml-bitmex-liquidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.2.6" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "scikit-learn==1.7.1"

      - name: Restore public-data cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tardis-ml-bitmex-liquidation
          key: tardis-ml-bitmex-liquidation-v1

      - name: Reconstruct and validate frozen source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ml-bitmex-runtime" "$RUNNER_TEMP/ml-bitmex-input"
          python - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          source = pathlib.Path("research/ml_bitmex_liquidation_20260726/bitmex_liq_ml.py.zlib.b64")
          raw = zlib.decompress(base64.b64decode(source.read_text().strip()))
          expected = "89bf545c4edfbdde2743f150a9128c5e1da35854d5877723bbd3a6d785bfb606"
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f"source hash mismatch: {actual} != {expected}")
          runtime = pathlib.Path(os.environ['RUNNER_TEMP']) / "ml-bitmex-runtime" / "bitmex_liq_ml.py"
          runtime.write_bytes(raw)
          print(actual)
          PY
          python -m py_compile "$RUNNER_TEMP/ml-bitmex-runtime/bitmex_liq_ml.py"
          python "$RUNNER_TEMP/ml-bitmex-runtime/bitmex_liq_ml.py" --self-test
          python -m json.tool research/ml_bitmex_liquidation_20260726/preregistration.json >/dev/null
          python scripts/validate_project.py
          sha256sum \
            "$RUNNER_TEMP/ml-bitmex-runtime/bitmex_liq_ml.py" \
            research/ml_bitmex_liquidation_20260726/preregistration.json \
            research/ml_bitmex_liquidation_20260726/README.md \
            > "$RUNNER_TEMP/ml-bitmex-input/INPUT_SHA256SUMS.txt"

      - name: Run fixed pre-2024 point-in-time ML screen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ml-bitmex-result"
          python "$RUNNER_TEMP/ml-bitmex-runtime/bitmex_liq_ml.py" \
            --output "$RUNNER_TEMP/ml-bitmex-result" \
            --cache "$RUNNER_TEMP/tardis-ml-bitmex-liquidation" \
            2>&1 | tee "$RUNNER_TEMP/ml-bitmex-run.log"

      - name: Enforce stage, causality and authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ml-bitmex-result'
          result = json.loads((root / 'RESULT.json').read_text())
          assert result['claim_id'] == 'CLM-20260726-1735-ML-BITMEX-LIQ-001'
          assert result['rank_eligible'] is False
          assert result['2024_2026_opened'] is False
          assert result['credentials_used'] is False
          assert result['orders_submitted'] is False
          assert result['live_permission_change'] is False
          if result.get('development_opened'):
              assert result.get('gate_passed') is True
          manifest = json.loads((root / 'SOURCE_MANIFEST.json').read_text())
          assert all(int(row['day'][:4]) < 2024 for row in manifest)
          print(json.dumps({
              'economic_status': result['economic_status'],
              'gate_passed': result.get('gate_passed', False),
              'development_opened': result.get('development_opened', False),
              'source_count': len(manifest),
          }, sort_keys=True))
          PY

      - name: Record immutable output checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ml-bitmex-result"
          if [[ -d "$root" ]]; then
            find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-bitmex-liquidation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ml-bitmex-result
            ${{ runner.temp }}/ml-bitmex-input/INPUT_SHA256SUMS.txt
            ${{ runner.temp }}/ml-bitmex-run.log
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Commit decision-ready output to claim branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git fetch origin "$branch"
          git checkout -B claim "origin/$branch"
          target=research/ml_bitmex_liquidation_20260726/observed
          rm -rf "$target"
          mkdir -p "$target"
          cp -R "$RUNNER_TEMP/ml-bitmex-result" "$target/result"
          cp "$RUNNER_TEMP/ml-bitmex-input/INPUT_SHA256SUMS.txt" "$target/INPUT_SHA256SUMS.txt"
          tail -n 400 "$RUNNER_TEMP/ml-bitmex-run.log" > "$target/RUN_TAIL.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Record minimal ML BitMEX liquidation result"
            git push origin "HEAD:$branch"
          fi
