name: YT Trinity causal PD-array mitigation depths

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-pd-array-depths.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-pd-array-depths
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expand armed PD array into causal mitigation depths
        run: |
          set -euo pipefail
          test "$(git hash-object research/yt_trinity_ml/system/causal_action_candidates.py)" = "ddaccf66d9876a7f97fcbae9a635df0039835ccd"
          test "$(git hash-object research/yt_trinity_ml/tests/test_causal_action_candidates.py)" = "ab0f8537b7581ab757b8bbef1edf24db0d35f149"
          python - <<'PY'
          from pathlib import Path

          path=Path('research/yt_trinity_ml/system/causal_action_candidates.py')
          text=path.read_text()
          insertion='''    build_corpus_features,\n)\n\n\ndef _passive_event(\n'''
          replacement='''    build_corpus_features,\n)\n\n\n# Proximal, inner quartiles, consequent encroachment and distal mitigation.\n# Every action is knowable when the displacement-origin PD array is armed.\nPASSIVE_DEPTH_FRACTIONS: tuple[float, ...] = (0.0, 0.25, 0.50, 0.75, 1.0)\n\n\ndef _passive_events(\n'''
          if insertion not in text:
              raise SystemExit('passive function insertion mismatch')
          text=text.replace(insertion,replacement,1)

          start=text.index('def _passive_events(')
          end=text.index('\n\ndef _market_event',start)
          function='''def _passive_events(\n    state: _NarrativeState,\n    row: pd.Series,\n    timestamp: pd.Timestamp,\n    symbol: str,\n    pos: int,\n) -> list[EventCandidate]:\n    """Create every predeclared causal mitigation action at PD-array arming."""\n\n    if state.phase != "AWAIT_RETEST":\n        return []\n    if state.stop is None or state.zone_lower is None or state.zone_upper is None:\n        return []\n    lower = float(state.zone_lower)\n    upper = float(state.zone_upper)\n    stop = float(state.stop)\n    target = float(state.draw_target)\n    width = upper - lower\n    if not np.isfinite(width) or width <= 0:\n        return []\n    events: list[EventCandidate] = []\n    for depth in PASSIVE_DEPTH_FRACTIONS:\n        entry = (\n            upper - depth * width\n            if state.side > 0\n            else lower + depth * width\n        )\n        if (state.side > 0 and not stop < entry < target) or (\n            state.side < 0 and not target < entry < stop\n        ):\n            continue\n        features = _setup_features(row, state, pos, entry, stop)\n        features.update(\n            {\n                "action_candidate_early_passive": 1.0,\n                "action_candidate_confirmed_market": 0.0,\n                "entry_confirmation_kind": 0.0,\n                "causal_pd_array_armed": 1.0,\n                "passive_depth_fraction": float(depth),\n                "passive_is_proximal": float(depth == 0.0),\n                "passive_is_consequent_encroachment": float(depth == 0.5),\n                "passive_is_distal": float(depth == 1.0),\n            }\n        )\n        events.append(\n            EventCandidate(\n                timestamp=timestamp,\n                symbol=symbol,\n                family=state.family,\n                side=state.side,\n                decision_price=float(row["close"]),\n                entry_reference=float(entry),\n                stop_reference=stop,\n                target_reference=target,\n                structural_level=float(state.structural_level),\n                feature_row=features,\n            )\n        )\n    return events\n'''
          text=text[:start]+function+text[end:]

          old='''                passive = _passive_event(updated, row, timestamp, symbol, pos)\n                if passive is not None:\n                    events.append(passive)\n                    diagnostics["causal_passive_actions"] += 1\n'''
          new='''                passive_rows = _passive_events(updated, row, timestamp, symbol, pos)\n                events.extend(passive_rows)\n                diagnostics["causal_passive_actions"] += len(passive_rows)\n                if passive_rows:\n                    diagnostics["causal_pd_arrays_armed"] += 1\n'''
          if old not in text:
              raise SystemExit('reversal passive emission mismatch')
          text=text.replace(old,new,1)

          old='''                passive = _passive_event(continuation, row, timestamp, symbol, pos)\n                if passive is not None:\n                    events.append(passive)\n                    diagnostics["causal_passive_actions"] += 1\n'''
          new='''                passive_rows = _passive_events(continuation, row, timestamp, symbol, pos)\n                events.extend(passive_rows)\n                diagnostics["causal_passive_actions"] += len(passive_rows)\n                if passive_rows:\n                    diagnostics["causal_pd_arrays_armed"] += 1\n'''
          if old not in text:
              raise SystemExit('continuation passive emission mismatch')
          text=text.replace(old,new,1)

          old='''            "action_candidate_confirmed_market": 1.0,\n            "causal_pd_array_armed": 1.0,\n            "passive_depth_fraction": 0.0,\n'''
          new='''            "action_candidate_confirmed_market": 1.0,\n            "causal_pd_array_armed": 1.0,\n            "passive_depth_fraction": -1.0,\n            "passive_is_proximal": 0.0,\n            "passive_is_consequent_encroachment": 0.0,\n            "passive_is_distal": 0.0,\n'''
          if old not in text:
              raise SystemExit('market feature block mismatch')
          path.write_text(text.replace(old,new,1))

          test_path=Path('research/yt_trinity_ml/tests/test_causal_action_candidates.py')
          text=test_path.read_text()
          text=text.replace(
              'from system.causal_action_candidates import generate_causal_action_candidates',
              'from system.causal_action_candidates import (\n    PASSIVE_DEPTH_FRACTIONS,\n    generate_causal_action_candidates,\n)',
              1,
          )
          old='''    assert len(passive) == 1\n    assert market == []\n    assert passive[0].timestamp == frame.index[4]\n    assert passive[0].entry_reference == 102.5\n    assert passive[0].target_reference == 95.0\n    assert diagnostics["causal_passive_actions"] == 1\n'''
          new='''    assert len(passive) == 5\n    assert market == []\n    assert all(row.timestamp == frame.index[4] for row in passive)\n    assert sorted(row.entry_reference for row in passive) == [102.0, 102.25, 102.5, 102.75, 103.0]\n    assert sorted(row.feature_row["passive_depth_fraction"] for row in passive) == list(PASSIVE_DEPTH_FRACTIONS)\n    assert all(row.target_reference == 95.0 for row in passive)\n    assert diagnostics["causal_passive_actions"] == 5\n    assert diagnostics["causal_pd_arrays_armed"] == 1\n'''
          if old not in text:
              raise SystemExit('first candidate test mismatch')
          text=text.replace(old,new,1)

          old='''    assert len(passive) == 1\n    assert len(market) == 1\n    assert passive[0].timestamp < market[0].timestamp\n    assert passive[0].entry_reference != market[0].entry_reference\n    assert diagnostics["causal_passive_actions"] == 1\n    assert diagnostics["confirmed_market_actions"] == 1\n'''
          new='''    assert len(passive) == 5\n    assert len(market) == 1\n    assert all(row.timestamp < market[0].timestamp for row in passive)\n    assert all(row.entry_reference != market[0].entry_reference for row in passive)\n    assert sorted(row.feature_row["passive_depth_fraction"] for row in passive) == list(PASSIVE_DEPTH_FRACTIONS)\n    assert market[0].feature_row["passive_depth_fraction"] == -1.0\n    assert diagnostics["causal_passive_actions"] == 5\n    assert diagnostics["confirmed_market_actions"] == 1\n'''
          if old not in text:
              raise SystemExit('second candidate test mismatch')
          test_path.write_text(text.replace(old,new,1))
          PY
          python -m pip install -q \
            "numpy==2.2.6" "pandas==2.2.3" "scikit-learn==1.6.1" \
            "pyarrow==19.0.1" "pytest==8.3.5"
          python -m py_compile \
            research/yt_trinity_ml/system/causal_action_candidates.py \
            research/yt_trinity_ml/run_causal_action_fast.py
          PYTHONPATH=research/yt_trinity_ml pytest -q \
            research/yt_trinity_ml/tests/test_causal_action_candidates.py \
            research/yt_trinity_ml/tests/test_causal_action_fast.py \
            research/yt_trinity_ml/tests/test_passive_transition_cancel.py \
            research/yt_trinity_ml/tests/test_passive_supersession.py \
            research/yt_trinity_ml/tests/test_pd_array_failure_exit.py \
            research/yt_trinity_ml/tests/test_causal_action_history_model.py \
            research/yt_trinity_ml/tests/test_history_boundary_context.py \
            research/yt_trinity_ml/tests/test_execution_realism.py
          git rm .github/workflows/yt-trinity-pd-array-depths.yml
      - name: Commit tested depth actions
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/yt_trinity_ml/system/causal_action_candidates.py \
            research/yt_trinity_ml/tests/test_causal_action_candidates.py
          git commit -m 'Emit causal PD-array mitigation depth actions'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
