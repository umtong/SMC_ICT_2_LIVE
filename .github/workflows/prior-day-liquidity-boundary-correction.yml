name: Validate corrected prior-day liquidity interaction

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prior-day-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused dependencies
        run: python -m pip install "numpy==2.1.3" "pandas==2.2.3" "pyarrow==18.1.0" "pytest==8.3.5"
      - name: Compile corrected authority
        run: |
          python -m py_compile \
            research/prior_day_liquidity_interaction_fatal/run.py \
            research/prior_day_liquidity_interaction_fatal/run_boundary_corrected.py
      - name: Run boundary semantic tests
        working-directory: research/prior_day_liquidity_interaction_fatal
        run: python -m pytest -q test_boundary_corrected.py
      - name: Validate result payloads
        run: |
          python -m json.tool research/prior_day_liquidity_interaction_fatal/CONTRACT.json >/dev/null
          python -m json.tool research/prior_day_liquidity_interaction_fatal/RESULT.json >/dev/null
          test -s research/prior_day_liquidity_interaction_fatal/ACTION_YEAR_COST_GRID.csv
          test -s research/prior_day_liquidity_interaction_fatal/CONTINUOUS_PRE2024_GRID.csv
