name: YT Trinity SOL XRP pre2024 screen

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-sol-xrp-pre2024-screen.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-sol-xrp-pre2024-screen
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          payload={'schema_version':1,'run_id':int(os.environ['GITHUB_RUN_ID']),'trigger_sha':os.environ['GITHUB_SHA'],'source_sha':'d7486872efccf0b67b7209baeadfd12ff35b56d0','artifact_name':f"yt-trinity-sol-xrp-pre2024-{os.environ['GITHUB_SHA']}",'status':'in_progress'}
          Path('research/yt_trinity_ml/SOL_XRP_PRE2024_POINTER.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/SOL_XRP_PRE2024_POINTER.json
          git commit -m "Announce SOL XRP pre2024 screen ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

  evaluate:
    needs: announce
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7486872efccf0b67b7209baeadfd12ff35b56d0
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: a2bb231966a517d29495bed7673e4d08ab8e30a9
          path: canonical_repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'pyarrow==19.0.1' 'scikit-learn==1.6.1'
      - name: Download all four 2023 shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_artifact() {
            curl --fail --silent --show-error --location -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"
          }
          mkdir -p inputs/data/PRE_2024_2023/{BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT} output
          fetch_artifact 8636781702 /tmp/btc.zip
          fetch_artifact 8636761741 /tmp/eth.zip
          fetch_artifact 8636787573 /tmp/sol.zip
          fetch_artifact 8636779613 /tmp/xrp.zip
          unzip -q /tmp/btc.zip -d inputs/data/PRE_2024_2023/BTCUSDT
          unzip -q /tmp/eth.zip -d inputs/data/PRE_2024_2023/ETHUSDT
          unzip -q /tmp/sol.zip -d inputs/data/PRE_2024_2023/SOLUSDT
          unzip -q /tmp/xrp.zip -d inputs/data/PRE_2024_2023/XRPUSDT
      - name: Run fixed quality-gate scope comparison
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python - <<'PY'
          from dataclasses import asdict
          import json
          from pathlib import Path
          import pandas as pd
          from run_research import load_canonical_frames
          from run_frozen_period_v1 import FrozenQualityGate,_quality_eligible
          from system.coarse import CoarseEventReplay,CoarseExecutionConfig,coarse_closeout_price
          from system.core import FeatureConfig,RiskConfig
          from system.corpus_alpha import build_corpus_features,generate_corpus_candidates_with_diagnostics
          from system.metrics import summarize_account
          from system.model import ScoredCandidate
          from system.policy import GlobalSlotPolicy

          symbols=('BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT')
          start=pd.Timestamp('2023-01-01T00:00:00Z');end=pd.Timestamp('2024-01-01T00:00:00Z')
          decision,execution,funding=load_canonical_frames(Path('inputs/data'),Path('canonical_repo'),symbols,('PRE_2024_2023',))
          gate=FrozenQualityGate();candidates=[];diagnostics={}
          for symbol,frame in sorted(decision.items()):
              features=build_corpus_features(frame,FeatureConfig())
              rows,diag=generate_corpus_candidates_with_diagnostics(features,symbol)
              candidates.extend([c for c in rows if start<=c.timestamp<end and _quality_eligible(c,gate)]);diagnostics[symbol]=diag
          candidates.sort(key=lambda c:(c.timestamp,c.symbol,c.family.value,c.side))
          def scored(rows):
              return [ScoredCandidate(c,.5,1.,1.,1.,1.,passive_win_probability=.5,market_expected_log_growth=-1.,passive_expected_log_growth=1.,market_lower_confidence_score=-1.,passive_lower_confidence_score=1.,preferred_action='PASSIVE_RETEST') for c in rows]
          rules={'BTCUSDT':(.001,.001),'ETHUSDT':(.01,.01),'SOLUSDT':(.1,.1),'XRPUSDT':(.1,.1)}
          scopes={'BTC_ETH':('BTCUSDT','ETHUSDT'),'BTC_ETH_SOL':('BTCUSDT','ETHUSDT','SOLUSDT'),'BTC_ETH_XRP':('BTCUSDT','ETHUSDT','XRPUSDT'),'ALL':symbols,'SOL_ONLY':('SOLUSDT',),'XRP_ONLY':('XRPUSDT',)}
          result={}
          config=CoarseExecutionConfig()
          for name,scope in scopes.items():
              rows=[c for c in candidates if c.symbol in scope]
              frames={s:execution[s] for s in scope};scope_funding={k:v for k,v in funding.items() if k[0] in scope}
              result[name]={'candidate_count':len(rows),'by_symbol':{s:sum(c.symbol==s for c in rows) for s in scope},'accounts':{}}
              for label,risk,leverage in (('BASIC',.01,5.),('GROWTH',.17,20.)):
                  account=CoarseEventReplay(frames,config).run(scored(rows),GlobalSlotPolicy(),RiskConfig(risk,leverage,.001,.001),start,end,initial_nav=10000.,funding=scope_funding,instrument_rules={s:rules[s] for s in scope})
                  final_mark=0.;final_close=None
                  if account.position is not None:
                      frame=frames[account.position.candidate.symbol];eligible=frame.loc[pd.to_datetime(frame['bar_start'],utc=True)<end];row=eligible.iloc[-1]
                      final_mark=float(row.get('mark_close',row['close']));final_close=coarse_closeout_price(row,account.position.side,config)
                  else:
                      for frame in frames.values():
                          eligible=frame.loc[pd.to_datetime(frame['bar_start'],utc=True)<end]
                          if not eligible.empty:final_mark=float(eligible.iloc[-1].get('mark_close',eligible.iloc[-1]['close']))
                  metrics=summarize_account(account,start,end,final_mark,final_closeout_price=final_close,final_closeout_fee_rate=config.taker_fee_rate if final_close is not None else 0.)
                  result[name]['accounts'][label]=metrics.as_dict()
          payload={'schema_version':1,'stage':'PRE2024_SOL_XRP_FIXED_GATE_DIAGNOSTIC','quality_gate':asdict(gate),'diagnostics':diagnostics,'scopes':result,'ranking_effect':'NONE_DIAGNOSTIC_NOT_OFFICIAL'}
          Path('output/SOL_XRP_PRE2024_RESULT.json').write_text(json.dumps(payload,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps({k:v['accounts'] for k,v in result.items()},indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-sol-xrp-pre2024-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 30
      - name: Persist result pointer
        if: always()
        run: |
          set -euo pipefail
          git fetch origin agent/r22-yt-trinity-ml-001
          git checkout -B agent/r22-yt-trinity-ml-001 origin/agent/r22-yt-trinity-ml-001
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('output/SOL_XRP_PRE2024_RESULT.json');result=json.loads(path.read_text()) if path.exists() else None
          payload={'schema_version':1,'run_id':int(os.environ['GITHUB_RUN_ID']),'trigger_sha':os.environ['GITHUB_SHA'],'source_sha':'d7486872efccf0b67b7209baeadfd12ff35b56d0','artifact_name':f"yt-trinity-sol-xrp-pre2024-{os.environ['GITHUB_SHA']}",'status':'success' if result else 'execution_failure_not_economic_failure','result':result}
          Path('research/yt_trinity_ml/SOL_XRP_PRE2024_POINTER.json').write_text(json.dumps(payload,indent=2,sort_keys=True,default=str)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/SOL_XRP_PRE2024_POINTER.json
          git commit -m "Record SOL XRP pre2024 screen ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
