name: YT Trinity cloud transcript API probe

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - control/yt-trinity-ytt-api-probe-trigger.json
      - .github/workflows/yt-trinity-ytt-api-probe.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-ytt-api-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe known-positive and channel samples
        run: |
          mkdir -p artifact
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          import urllib.error
          import urllib.request

          base = "https://api.youtubetotext.com"
          videos = {
              "known_positive_control": "F6wDs1HRTSo",
              "swipalnam": "UmEPMyzjQS8",
              "chartbro": "DnGemQi1sOE",
              "indicator_sensei": "18U0aD4K21I",
          }

          def request_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "SMC-ICT-2-LIVE/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      raw = response.read()
                      return response.status, json.loads(raw), dict(response.headers)
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  try: payload = json.loads(raw)
                  except Exception: payload = {"raw": raw.decode("utf-8", "replace")[:2000]}
                  return exc.code, payload, dict(exc.headers)

          health_status, health, _ = request_json(f"{base}/health")
          rows = []
          for index, (channel, video_id) in enumerate(videos.items()):
              if index:
                  time.sleep(6.2)
              status, payload, headers = request_json(
                  f"{base}/full_transcript/{video_id}?meta=true"
              )
              transcript = payload.get("transcript") if isinstance(payload, dict) else None
              rows.append({
                  "channel": channel,
                  "video_id": video_id,
                  "status_code": status,
                  "segment_count": len(transcript) if isinstance(transcript, list) else 0,
                  "language_code": payload.get("language_code") if isinstance(payload, dict) else None,
                  "source_type": payload.get("source_type") if isinstance(payload, dict) else None,
                  "error": payload.get("error") if isinstance(payload, dict) else None,
                  "reason": payload.get("reason") if isinstance(payload, dict) else None,
                  "can_transcribe_with_ai": payload.get("canTranscribeWithAI") if isinstance(payload, dict) else None,
                  "first_segments": transcript[:3] if isinstance(transcript, list) else [],
                  "rate_headers": {key: value for key, value in headers.items() if "rate" in key.lower() or "retry" in key.lower()},
              })
          positive = next(row for row in rows if row["channel"] == "known_positive_control")
          result = {
              "schema_version": 1,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_sha": os.environ["GITHUB_SHA"],
              "health_status": health_status,
              "health": health,
              "positive_control_pass": positive["segment_count"] > 0,
              "rows": rows,
          }
          Path("artifact/result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if not result["positive_control_pass"]:
              raise SystemExit("known-positive transcript control failed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-ytt-api-probe-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          retention-days: 14
      - name: Persist result on work branch
        if: always()
        run: |
          if [[ ! -f artifact/result.json ]]; then exit 0; fi
          cp artifact/result.json research/yt_trinity_ml/CAPTION_TRANSPORT_YTT_API.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/CAPTION_TRANSPORT_YTT_API.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record cloud transcript API probe ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
