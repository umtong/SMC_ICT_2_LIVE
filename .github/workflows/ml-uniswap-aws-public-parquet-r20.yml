name: Paused Uniswap AWS public Parquet transport probe

on:
  push:
    branches:
      - agent/r20-uniswap-aws-public-transport-001
    paths:
      - '.github/workflows/ml-uniswap-aws-public-parquet-r20.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-uniswap-aws-public-transport-r20
  cancel-in-progress: true

jobs:
  paused-before-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Return execution capacity to the two active mechanisms
        run: |
          echo 'Paused before source transport outcome.'
          echo 'Canonical signed Uniswap remains semantically valid but is not active.'
          echo 'No market row, model, trade, PnL, official interval, credential or order opened.'
