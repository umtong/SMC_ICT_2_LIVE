name: Observable independent SMT-FVG audit

on:
  push:
    branches:
      - agent/r11-smt-fvg-liquidity-sweep-001
    paths:
      - ".github/workflows/smt-fvg-independent-audit-observable-r11.yml"

permissions:
  contents: write

concurrency:
  group: smt-fvg-independent-audit-observable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Recompute and persist audit state
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import traceback
          from pathlib import Path
          root = Path('research_results/smt_fvg_liquidity_sweep_20260726')
          state = {
              'attestation_id': 'VAL-20260726-SMT-FVG-SWEEP-FATAL-001',
              'status': 'FAIL',
              'later_periods_opened': False,
              'orders_submitted': False,
          }
          try:
              import numpy as np
              import pandas as pd
              candidates = pd.read_csv(root / 'candidate_results.csv')
              summary = json.loads((root / 'result_summary.json').read_text())
              manifest = json.loads((root / 'source_manifest.json').read_text())
              assert len(candidates) == int(summary['candidate_count']) == 3072
              trades = pd.to_numeric(candidates['development_trades'], errors='raise')
              m12 = pd.to_numeric(candidates['development_12bp_median_bps'], errors='coerce')
              mean18 = pd.to_numeric(candidates['development_18bp_mean_bps'], errors='coerce')
              ret24 = pd.to_numeric(candidates['development_24bp_total_return'], errors='coerce')
              rem18 = pd.to_numeric(candidates['development_18bp_top10_removed_return'], errors='coerce')
              breadth18 = pd.to_numeric(candidates['development_18bp_positive_date_fraction'], errors='coerce')
              top518 = pd.to_numeric(candidates['development_18bp_top5_positive_share'], errors='coerce')
              gate = ((trades >= 12) & (mean18 > 0) & (m12 > 0) & (ret24 > 0) & (rem18 > 0) & (breadth18 >= 2/3) & np.isfinite(top518) & (top518 <= .5))
              stored = candidates['development_gate'].astype(str).str.lower().isin(['true','1'])
              assert np.array_equal(gate.to_numpy(), stored.to_numpy())
              assert int(gate.sum()) == int(summary['development_gate_passes']) == 0
              positive = {}
              monotone_mismatches = 0
              for stage in ('fit','development'):
                  a = pd.to_numeric(candidates[f'{stage}_12bp_total_return'], errors='coerce')
                  b = pd.to_numeric(candidates[f'{stage}_18bp_total_return'], errors='coerce')
                  c = pd.to_numeric(candidates[f'{stage}_24bp_total_return'], errors='coerce')
                  finite = np.isfinite(a) & np.isfinite(b) & np.isfinite(c)
                  monotone_mismatches += int((~((a[finite] + 1e-12 >= b[finite]) & (b[finite] + 1e-12 >= c[finite]))).sum())
              assert monotone_mismatches == 0
              for cost in (12,18,24):
                  total = pd.to_numeric(candidates[f'development_{cost}bp_total_return'], errors='coerce')
                  removed = pd.to_numeric(candidates[f'development_{cost}bp_top10_removed_return'], errors='coerce')
                  positive[str(cost)] = {
                      'positive_total': int((total > 0).sum()),
                      'positive_removed': int((removed > 0).sum()),
                      'positive_total_min_10_trades': int(((total > 0) & (trades >= 10)).sum()),
                  }
              assert positive == summary['positive_counts']
              tiers = {}
              for minimum in (1,5,10,20,60):
                  subset = candidates.loc[trades >= minimum].copy()
                  score = pd.to_numeric(subset['development_18bp_total_return'], errors='coerce').fillna(-np.inf)
                  row = subset.assign(_score=score).sort_values(['_score','candidate_id'], ascending=[False,True]).iloc[0]
                  registered = summary['best_rows'][f'best_min_{minimum}']
                  assert str(row['candidate_id']) == str(registered['candidate_id'])
                  tiers[str(minimum)] = {
                      'candidate_id': str(row['candidate_id']),
                      'trades': int(row['development_trades']),
                      'mean_18bp': float(row['development_18bp_mean_bps']),
                      'total_18bp': float(row['development_18bp_total_return']),
                      'removed_18bp': float(row['development_18bp_top10_removed_return']),
                  }
              assert int(trades.max()) == int(summary['maximum_development_trades']) == 66
              assert int(manifest['raw_trade_rows']) == sum(int(x['rows']) for x in manifest['archives']) == 5_646_495
              assert sum(int(x['compressed_bytes']) for x in manifest['archives']) == 209_945_454
              state.update({
                  'claim_id': summary['claim_id'],
                  'result_id': summary['result_id'],
                  'status': 'PASS',
                  'gate_count': 0,
                  'positive_counts': positive,
                  'maximum_development_trades': int(trades.max()),
                  'tier_reproduction': tiers,
                  'cost_monotonicity_mismatches': 0,
                  'archive_count': int(manifest['archive_count']),
                  'raw_trade_rows': int(manifest['raw_trade_rows']),
                  'compressed_bytes': sum(int(x['compressed_bytes']) for x in manifest['archives']),
                  'candidate_results_sha256': hashlib.sha256((root/'candidate_results.csv').read_bytes()).hexdigest(),
                  'result_summary_sha256': hashlib.sha256((root/'result_summary.json').read_bytes()).hexdigest(),
                  'source_manifest_sha256': hashlib.sha256((root/'source_manifest.json').read_bytes()).hexdigest(),
              })
              (root / 'INDEPENDENT_AUDIT.json').write_text(json.dumps(state, sort_keys=True, indent=2) + '\n')
          except Exception as exc:
              state['error'] = f'{type(exc).__name__}: {exc}'
              state['traceback'] = traceback.format_exc()
          (root / 'INDEPENDENT_AUDIT_STATE.json').write_text(json.dumps(state, sort_keys=True, indent=2) + '\n')
          print(json.dumps(state, sort_keys=True, separators=(',',':')))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research_results/smt_fvg_liquidity_sweep_20260726/INDEPENDENT_AUDIT*.json
          git commit -m "Persist observable SMT-FVG independent audit [skip smt-fvg]"
          git push origin HEAD:agent/r11-smt-fvg-liquidity-sweep-001
