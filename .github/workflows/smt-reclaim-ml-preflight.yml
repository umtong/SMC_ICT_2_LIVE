name: SMT reclaim ML preflight

on:
  push:
    branches:
      - agent/r11-smt-reclaim-ml-meta-001
    paths:
      - "research/smt_reclaim_ml_meta_20260726/**"
      - ".github/workflows/smt-reclaim-ml-preflight.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smt-reclaim-ml-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed environment
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" "pandas==2.2.3" "requests==2.32.4" \
            "scikit-learn==1.6.1" "joblib==1.4.2"
      - name: Reconstruct dependencies and run all non-market checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime research_results/r11_smt_reclaim_ml_meta_001
          git fetch --depth=1 origin agent/r11-altlag-opportunity-001
          git show FETCH_HEAD:research/bybit_altlag_opportunity_20260726/probe.py.zlib.b64 > runtime/base_probe.py.zlib.b64
          python - <<'PY'
          import base64,hashlib,json,pathlib,zlib
          root=pathlib.Path('runtime')
          source=zlib.decompress(base64.b64decode((root/'base_probe.py.zlib.b64').read_text().strip()))
          (root/'base_probe.py').write_bytes(source)
          (root/'BASE_SOURCE.json').write_text(json.dumps({'sha256':hashlib.sha256(source).hexdigest(),'bytes':len(source)},indent=2)+'\n')
          PY
          git fetch --depth=1 origin agent/r11-smt-overreaction-reclaim-001
          git show FETCH_HEAD:research/smt_overreaction_reclaim_20260726/run.py > runtime/rule_engine.py
          cp research/smt_reclaim_ml_meta_20260726/extract.py runtime/extract.py
          cp research/smt_reclaim_ml_meta_20260726/extract_entry.py runtime/extract_entry.py
          cp research/smt_reclaim_ml_meta_20260726/train.py runtime/train.py
          cp research/smt_reclaim_ml_meta_20260726/train_entry.py runtime/train_entry.py
          python -m py_compile runtime/*.py
          PYTHONPATH=runtime python runtime/extract_entry.py --self-test
          PYTHONPATH=runtime python runtime/train_entry.py self-test
          python -m json.tool research/smt_reclaim_ml_meta_20260726/WORK_CLAIM.json >/dev/null
          python -m json.tool research/smt_reclaim_ml_meta_20260726/preregistration.json >/dev/null
          python -m json.tool research/smt_reclaim_ml_meta_20260726/PRE_OUTCOME_RUNTIME_CORRECTION_001.json >/dev/null
          python scripts/validate_project.py
          python - <<'PY'
          import hashlib,json,pathlib
          paths=[
            pathlib.Path('runtime/base_probe.py'),
            pathlib.Path('runtime/rule_engine.py'),
            pathlib.Path('runtime/extract.py'),
            pathlib.Path('runtime/extract_entry.py'),
            pathlib.Path('runtime/train.py'),
            pathlib.Path('runtime/train_entry.py'),
          ]
          result={
            'schema_version':1,
            'claim_id':'CLM-20260726-SMT-RECLAIM-ML-001',
            'status':'PASS',
            'market_data_opened':False,
            'model_fit_performed':False,
            'pnl_computed':False,
            'official_2024_2026_opened':False,
            'orders_submitted':False,
            'files':{str(p):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in paths},
          }
          pathlib.Path('research_results/r11_smt_reclaim_ml_meta_001/PREFLIGHT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit preflight attestation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/r11_smt_reclaim_ml_meta_001/PREFLIGHT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record SMT reclaim ML preflight [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
