name: YT Trinity frozen frequency gate v1

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/run_frozen_frequency_gate_v1.py
      - .github/workflows/yt-trinity-frozen-frequency-gate-v1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-frozen-frequency-gate-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: a2bb231966a517d29495bed7673e4d08ab8e30a9
          path: canonical_repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic dependencies
        run: python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'pyarrow==19.0.1' 'scikit-learn==1.6.1'
      - name: Download frozen labels and canonical market shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_artifact() {
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" \
              -o "$2"
          }
          mkdir -p inputs/labels inputs/data/PRE_2024_2023/BTCUSDT inputs/data/PRE_2024_2023/ETHUSDT inputs/data/2024_H1/BTCUSDT inputs/data/2024_H1/ETHUSDT output
          fetch_artifact 8643192491 /tmp/labels.zip
          fetch_artifact 8636781702 /tmp/btc2023.zip
          fetch_artifact 8636761741 /tmp/eth2023.zip
          fetch_artifact 8636867995 /tmp/btc2024h1.zip
          fetch_artifact 8636882043 /tmp/eth2024h1.zip
          unzip -q /tmp/labels.zip -d inputs/labels
          unzip -q /tmp/btc2023.zip -d inputs/data/PRE_2024_2023/BTCUSDT
          unzip -q /tmp/eth2023.zip -d inputs/data/PRE_2024_2023/ETHUSDT
          unzip -q /tmp/btc2024h1.zip -d inputs/data/2024_H1/BTCUSDT
          unzip -q /tmp/eth2024h1.zip -d inputs/data/2024_H1/ETHUSDT
          test -f inputs/labels/EVENT_LABELS.pkl.gz
      - name: Execute the single pre-2024-frozen 2024H1 candidate
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set +e
          python -m py_compile \
            research/yt_trinity_ml/run_frozen_frequency_gate_v1.py \
            research/yt_trinity_ml/run_frozen_period_v1.py \
            research/yt_trinity_ml/system/corpus_alpha.py \
            research/yt_trinity_ml/system/coarse.py
          compile_code=$?
          if [[ "$compile_code" != 0 ]]; then
            echo "$compile_code" > output/EXIT_CODE.txt
            exit 0
          fi
          python research/yt_trinity_ml/run_frozen_frequency_gate_v1.py \
            --repo-root canonical_repo \
            --data-root inputs/data \
            --labels inputs/labels/EVENT_LABELS.pkl.gz \
            --output output \
            --segments PRE_2024_2023 2024_H1 \
            --start 2024-01-01T00:00:00Z \
            --end-exclusive 2024-07-01T00:00:00Z \
            --initial-nav 10000 \
            --risk-fraction 0.17 \
            --maximum-leverage 20 \
            --scientific-source-sha "${GITHUB_SHA}" \
            2>&1 | tee output/STDOUT.log
          code=${PIPESTATUS[0]}
          echo "$code" > output/EXIT_CODE.txt
          exit 0
      - name: Upload immutable evidence
        if: always()
        run: |
          (cd output && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-frozen-frequency-gate-v1-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Persist compact result pointer
        if: always()
        run: |
          set -euo pipefail
          git fetch origin agent/r22-yt-trinity-ml-001
          git checkout -B agent/r22-yt-trinity-ml-001 origin/agent/r22-yt-trinity-ml-001
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path('output')
          path=out/'FROZEN_FREQUENCY_GATE_RESULT.json'
          result=json.loads(path.read_text()) if path.exists() else None
          code=int((out/'EXIT_CODE.txt').read_text().strip()) if (out/'EXIT_CODE.txt').exists() else 99
          log=(out/'STDOUT.log').read_text(errors='replace') if (out/'STDOUT.log').exists() else ''
          payload={
              'schema_version':1,
              'claim_id':'CLM-20260727-0346-YT-TRINITY-ML-001',
              'stage':'2024_H1_FROZEN_FREQUENCY_GATE_V1_COARSE_PROVISIONAL',
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'source_sha':os.environ['GITHUB_SHA'],
              'artifact_name':f"yt-trinity-frozen-frequency-gate-v1-{os.environ['GITHUB_SHA']}",
              'status':'success' if result is not None and code==0 else 'execution_failure_not_economic_failure',
              'exit_code':code,
              'result_sha256':hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None,
              'result':result,
              'stdout_tail':log[-12000:],
              'ranking_effect':'NONE_PROVISIONAL_NOT_EVENT_TAPE_VALIDATED',
          }
          Path('research/yt_trinity_ml/FROZEN_FREQUENCY_GATE_V1_POINTER.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True,default=str)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/FROZEN_FREQUENCY_GATE_V1_POINTER.json
          if ! git diff --cached --quiet; then
            git commit -m "Record frozen frequency gate ${GITHUB_RUN_ID}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin agent/r22-yt-trinity-ml-001
              if git push origin HEAD:agent/r22-yt-trinity-ml-001; then break; fi
              sleep $((attempt*3))
            done
          fi
      - name: Fail after evidence preservation
        if: always()
        run: test "$(cat output/EXIT_CODE.txt 2>/dev/null || echo 99)" = 0
