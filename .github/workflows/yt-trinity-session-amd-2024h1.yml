name: YT Trinity session AMD 2024H1 causal screen

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - research/yt_trinity_ml/evaluate_session_amd_partial.py
      - research/yt_trinity_ml/session_amd_contract.json
      - .github/workflows/yt-trinity-session-amd-2024h1.yml

permissions:
  actions: read
  contents: write

env:
  TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
  CANONICAL_RUN_ID: "30218767426"

concurrency:
  group: yt-trinity-session-amd-2024h1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen evaluation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q \
            numpy==2.2.6 \
            pandas==2.3.1 \
            scikit-learn==1.7.1 \
            pyarrow==20.0.0
          python -m pip freeze | LC_ALL=C sort > dependency-freeze.txt

      - name: Download immutable canonical Bybit 2023 shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: umtong/SMC_ICT_2_LIVE
          run-id: ${{ env.CANONICAL_RUN_ID }}
          pattern: canonical-bybit-PRE_2024_2023-*
          path: canonical-data
          merge-multiple: false

      - name: Download immutable canonical Bybit 2024H1 shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: umtong/SMC_ICT_2_LIVE
          run-id: ${{ env.CANONICAL_RUN_ID }}
          pattern: canonical-bybit-2024_H1-*
          path: canonical-data
          merge-multiple: false

      - name: Verify code, contract, and canonical shard count
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/yt_trinity_ml/evaluate_session_amd_partial.py
          python -m json.tool research/yt_trinity_ml/session_amd_contract.json >/dev/null
          python research/yt_trinity_ml/evaluate_session_amd_partial.py --self-test
          test "$(find canonical-data -name DATASET_MANIFEST.json | wc -l | tr -d ' ')" = "8"
          find canonical-data -name DATASET_MANIFEST.json -print | LC_ALL=C sort

      - name: Run frozen causal 2023-to-2024H1 evaluation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/session-amd-2024h1
          python research/yt_trinity_ml/evaluate_session_amd_partial.py \
            --data-root canonical-data \
            --contract research/yt_trinity_ml/session_amd_contract.json \
            --output artifact/session-amd-2024h1 \
            2>&1 | tee artifact/session-amd-2024h1/stdout.log
          cp dependency-freeze.txt artifact/session-amd-2024h1/dependency-freeze.txt
          (
            cd artifact/session-amd-2024h1
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-session-amd-2024h1-${{ github.sha }}
          path: artifact/session-amd-2024h1
          if-no-files-found: warn
          retention-days: 30

      - name: Persist compact decision on the continuation branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f artifact/session-amd-2024h1/result_compact.json
          cp artifact/session-amd-2024h1/result_compact.json \
            research/yt_trinity_ml/SESSION_AMD_2024H1_RESULT.json
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          result = Path('artifact/session-amd-2024h1/result_compact.json')
          pointer = {
              'schema_version': 1,
              'workflow': 'YT Trinity session AMD 2024H1 causal screen',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'source_sha': os.environ['GITHUB_SHA'],
              'artifact_name': f"yt-trinity-session-amd-2024h1-{os.environ['GITHUB_SHA']}",
              'result_sha256': hashlib.sha256(result.read_bytes()).hexdigest(),
              'canonical_run_id': int(os.environ['CANONICAL_RUN_ID']),
              'result': json.loads(result.read_text(encoding='utf-8')),
          }
          Path('research/yt_trinity_ml/SESSION_AMD_2024H1_POINTER.json').write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/yt_trinity_ml/SESSION_AMD_2024H1_RESULT.json \
            research/yt_trinity_ml/SESSION_AMD_2024H1_POINTER.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record YT Trinity session AMD 2024H1 causal screen ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
