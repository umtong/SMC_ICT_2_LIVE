name: Export pyarrow wheel for local canonical-data replay

on:
  push:
    branches: [agent/export-pyarrow-wheel-20260805]
    paths:
      - '.github/workflows/export-pyarrow-wheel-20260805.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact binary wheel
        run: |
          set -euo pipefail
          mkdir -p /tmp/wheel
          python -m pip download --only-binary=:all: --no-deps 'pyarrow==18.1.0' -d /tmp/wheel
          ls -lh /tmp/wheel
      - uses: actions/upload-artifact@v4
        with:
          name: pyarrow-wheel-${{ github.run_id }}
          path: /tmp/wheel/*.whl
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
