name: YT Trinity caption transport probe

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - control/yt-trinity-caption-probe-trigger.json
      - .github/workflows/yt-trinity-caption-transport-probe.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-caption-transport-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install current YouTube extraction stack
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --pre --upgrade "yt-dlp[default,curl-cffi]"
          python -m yt_dlp --version
          node --version
      - name: Probe public subtitle transports
        shell: bash
        run: |
          mkdir -p artifact
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          videos = {
              "swipalnam": "UmEPMyzjQS8",
              "chartbro": "DnGemQi1sOE",
              "indicator_sensei": "18U0aD4K21I",
          }
          profiles = {
              "default_no_web": "youtube:player_client=default,-web,-web_safari;player_skip=webpage,configs",
              "tv_simply": "youtube:player_client=tv_simply;player_skip=webpage,configs",
              "tv": "youtube:player_client=tv;player_skip=webpage,configs",
              "ios": "youtube:player_client=ios;player_skip=webpage,configs",
              "android_vr": "youtube:player_client=android_vr;player_skip=webpage,configs",
              "web_embedded": "youtube:player_client=web_embedded;player_skip=webpage,configs",
          }
          rows = []
          for channel, video_id in videos.items():
              for profile, extractor_args in profiles.items():
                  command = [
                      sys.executable,
                      "-m",
                      "yt_dlp",
                      "--dump-single-json",
                      "--skip-download",
                      "--ignore-no-formats-error",
                      "--no-playlist",
                      "--js-runtimes",
                      "node",
                      "--impersonate",
                      "chrome",
                      "--extractor-args",
                      extractor_args,
                      f"https://www.youtube.com/watch?v={video_id}",
                  ]
                  try:
                      completed = subprocess.run(command, text=True, capture_output=True, timeout=90)
                      stdout = completed.stdout.strip()
                      stderr = completed.stderr.strip()
                      returncode = completed.returncode
                  except subprocess.TimeoutExpired as exc:
                      stdout = (exc.stdout or "") if isinstance(exc.stdout, str) else ""
                      stderr = ((exc.stderr or "") if isinstance(exc.stderr, str) else "") + "\nTIMEOUT"
                      returncode = 124
                  payload = None
                  if stdout:
                      try:
                          payload = json.loads(stdout.splitlines()[-1])
                      except Exception:
                          payload = None
                  subtitles = (payload or {}).get("subtitles") or {}
                  automatic = (payload or {}).get("automatic_captions") or {}
                  rows.append({
                      "channel": channel,
                      "video_id": video_id,
                      "profile": profile,
                      "returncode": returncode,
                      "title": (payload or {}).get("title"),
                      "subtitles": sorted(subtitles),
                      "automatic_captions": sorted(automatic),
                      "track_count": sum(len(v or []) for v in subtitles.values()) + sum(len(v or []) for v in automatic.values()),
                      "stderr_tail": stderr[-3000:],
                      "stdout_prefix": stdout[:300],
                  })
          successful = [row for row in rows if row["track_count"] > 0]
          result = {
              "schema_version": 1,
              "runner_os": os.environ["RUNNER_OS"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_sha": os.environ["GITHUB_SHA"],
              "success_count": len(successful),
              "successful_profiles": successful,
              "rows": rows,
          }
          Path("artifact/probe.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"success_count": len(successful), "successful_profiles": successful}, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-caption-transport-probe-${{ matrix.os }}-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          retention-days: 14
      - name: Persist probe result on work branch
        if: always()
        shell: bash
        run: |
          if [[ ! -f artifact/probe.json ]]; then
            exit 0
          fi
          target="research/yt_trinity_ml/CAPTION_TRANSPORT_PROBE_${RUNNER_OS}.json"
          cp artifact/probe.json "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record ${RUNNER_OS} caption transport probe ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
