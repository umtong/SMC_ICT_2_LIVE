name: ML leverage-cascade structure continuation

on:
  pull_request:
    branches: [main]
    paths:
      - "research/ml_leverage_cascade_20260726/**"
      - ".github/workflows/ml-leverage-cascade-r11.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-leverage-cascade-r11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "scikit-learn==1.6.1" \
            "pytest==8.3.4"

      - name: Compile and run causal tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_leverage_cascade_20260726
          python "$root/reconstruct.py"
          python -m py_compile "$root/cascade.py" "$root/run.py" "$root/test_cascade.py"
          PYTHONPATH="$root" pytest -q "$root/test_cascade.py"
          PYTHONPATH="$root" python "$root/run.py" --self-test
          python scripts/validate_project.py

      - name: Run frozen fit and conditional calendar-2023 development
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_leverage_cascade_20260726
          out=research_runs/ml_leverage_cascade_20260726/r11
          cache="$RUNNER_TEMP/ml-leverage-cascade-cache"
          mkdir -p "$out"
          python - <<'PY'
          import json, platform, sys
          from pathlib import Path
          import joblib, numpy, pandas, requests, sklearn
          out = Path('research_runs/ml_leverage_cascade_20260726/r11')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'ENVIRONMENT.json').write_text(json.dumps({
              'python': sys.version,
              'platform': platform.platform(),
              'numpy': numpy.__version__,
              'pandas': pandas.__version__,
              'requests': requests.__version__,
              'scikit_learn': sklearn.__version__,
              'joblib': joblib.__version__,
              'claim_id': 'CLM-20260726-1742-ML-LEVERAGE-CASCADE-001',
              'engine_version': 'ML-LEVERAGE-CASCADE-V1',
              'orders_submitted': False,
              'paper_live_started': False,
              '2024_opened': False,
              '2025_opened': False,
              '2026_opened': False
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          PYTHONPATH="$root" python "$root/run.py" \
            --output "$out" \
            --cache "$cache" \
            2>&1 | tee "$out/RUN.log"

      - name: Record immutable checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_leverage_cascade_20260726
          out=research_runs/ml_leverage_cascade_20260726/r11
          mkdir -p "$out"
          sha256sum \
            "$root/WORK_CLAIM.json" \
            "$root/preregistration.json" \
            "$root/README.md" \
            "$root/SOURCES.md" \
            "$root/SOURCE_BUNDLE_MANIFEST.json" \
            "$root/reconstruct.py" \
            "$root"/source_bundle.tar.gz.b64.part* \
            "$root/cascade.py" \
            "$root/run.py" \
            "$root/test_cascade.py" \
            > "$out/INPUT_SHA256SUMS.txt"
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-leverage-cascade-r11-${{ github.sha }}
          path: |
            research_runs/ml_leverage_cascade_20260726/r11
            research/ml_leverage_cascade_20260726/cascade.py
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
