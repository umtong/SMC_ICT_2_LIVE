name: ML Donchian structural source materialization

on:
  push:
    branches:
      - agent/r13-ml-donchian-structural-001
    paths:
      - "research/ml_donchian_structural_20260726/**"
      - ".github/workflows/ml-donchian-structural-r13.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/ml_donchian_structural_20260726/**"
      - ".github/workflows/ml-donchian-structural-r13.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ml-donchian-structural-r13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-source-before-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-ml-donchian-structural-001
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen verification environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "scikit-learn==1.6.1" \
            "pytest==8.3.4"

      - name: Reconstruct and verify immutable source without market access
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_donchian_structural_20260726
          python "$root/reconstruct.py"
          python -m py_compile "$root/run.py" "$root/test_run.py"
          PYTHONPATH="$root" pytest -q "$root/test_run.py"
          PYTHONPATH="$root" python "$root/run.py" --self-test
          python scripts/validate_project.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/ml_donchian_structural_20260726')
          correction = json.loads((root/'CORRECTION_001_OFFICIAL_HALF_YEAR_RESEARCH_INTENT_BEFORE_OUTCOME.json').read_text())
          assert correction['recorded_before_outcome'] is True
          assert correction['market_rows_opened_before_correction'] is False
          assert correction['model_fitted_before_correction'] is False
          assert correction['official_2024_2026_opened_before_correction'] is False
          print(json.dumps({
              'status':'SOURCE_MATERIALIZED_NO_MARKET_OUTCOME',
              'run_sha256':__import__('hashlib').sha256((root/'run.py').read_bytes()).hexdigest(),
              'test_sha256':__import__('hashlib').sha256((root/'test_run.py').read_bytes()).hexdigest(),
          }, sort_keys=True))
          PY

      - name: Commit readable source for official-half-year amendment
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_donchian_structural_20260726
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$root/run.py" "$root/test_run.py"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Materialize ML Donchian source before official replay [skip ci]"
          git push origin HEAD:agent/r13-ml-donchian-structural-001

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-donchian-source-before-outcome-${{ github.sha }}
          path: |
            research/ml_donchian_structural_20260726/run.py
            research/ml_donchian_structural_20260726/test_run.py
            research/ml_donchian_structural_20260726/CORRECTION_001_OFFICIAL_HALF_YEAR_RESEARCH_INTENT_BEFORE_OUTCOME.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
