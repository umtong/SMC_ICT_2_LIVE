name: ML Donchian structural delivery

on:
  push:
    branches:
      - agent/r13-ml-donchian-structural-001
    paths:
      - "research/ml_donchian_structural_20260726/**"
      - ".github/workflows/ml-donchian-structural-r13.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/ml_donchian_structural_20260726/**"
      - ".github/workflows/ml-donchian-structural-r13.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-donchian-structural-r13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "scikit-learn==1.6.1" \
            "pytest==8.3.4"

      - name: Reconstruct and run causal tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_donchian_structural_20260726
          python "$root/reconstruct.py"
          python -m py_compile "$root/run.py" "$root/test_run.py"
          PYTHONPATH="$root" pytest -q "$root/test_run.py"
          PYTHONPATH="$root" python "$root/run.py" --self-test
          python scripts/validate_project.py

      - name: Run frozen pre-2024 model and conditional official replay
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_donchian_structural_20260726
          out=research_runs/ml_donchian_structural_20260726/r13
          cache="$RUNNER_TEMP/ml-donchian-structural-cache"
          mkdir -p "$out"
          python - <<'PY'
          import json, platform, sys
          from pathlib import Path
          import numpy, pandas, requests, sklearn
          out=Path('research_runs/ml_donchian_structural_20260726/r13')
          out.mkdir(parents=True, exist_ok=True)
          (out/'ENVIRONMENT.json').write_text(json.dumps({
              'python':sys.version,
              'platform':platform.platform(),
              'numpy':numpy.__version__,
              'pandas':pandas.__version__,
              'requests':requests.__version__,
              'scikit_learn':sklearn.__version__,
              'claim_id':'CLM-20260726-2110-ML-DONCHIAN-STRUCTURAL-001',
              'engine_version':'ML-DONCHIAN-STRUCTURAL-V1',
              'orders_submitted':False,
              '2024_opened_before_gate':False,
              '2025_opened_before_gate':False,
              '2026_opened_before_gate':False,
          }, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
          PYTHONPATH="$root" python "$root/run.py" \
            --output "$out" \
            --cache "$cache" \
            2>&1 | tee "$out/RUN.log"

      - name: Record immutable checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_donchian_structural_20260726
          out=research_runs/ml_donchian_structural_20260726/r13
          mkdir -p "$out"
          sha256sum \
            "$root/WORK_CLAIM.json" \
            "$root/preregistration.json" \
            "$root/README.md" \
            "$root/SOURCES.md" \
            "$root/SOURCE_BUNDLE_MANIFEST.json" \
            "$root/reconstruct.py" \
            "$root/source_bundle.tar.gz.b64.part00" \
            "$root/source_bundle.tar.gz.b64.part01" \
            "$root/source_bundle.tar.gz.b64.part02" \
            "$root/run.py" \
            "$root/test_run.py" \
            > "$out/INPUT_SHA256SUMS.txt"
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-donchian-structural-r13-${{ github.sha }}
          path: |
            research_runs/ml_donchian_structural_20260726/r13
            research/ml_donchian_structural_20260726/run.py
            research/ml_donchian_structural_20260726/test_run.py
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
