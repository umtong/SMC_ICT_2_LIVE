name: Canonical data PR diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - data/contracts/canonical_bybit_usdt_linear_v1.json
      - docs/canonical-market-data.md
      - research/data_foundation_20260727/**
      - scripts/market_data/**
      - tests/test_canonical_market_data.py
      - tests/test_public_trade_month.py
      - .github/workflows/canonical-bybit-halfyear-data.yml
      - .github/workflows/canonical-bybit-public-month-smoke.yml
      - .github/workflows/canonical-data-pr-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[dev]"
      - name: Validate canonical implementation
        run: |
          python scripts/validate_project.py
          python -m pytest -q
          python -m py_compile \
            scripts/market_data/build_canonical_bybit.py \
            scripts/market_data/build_public_trade_month.py \
            scripts/market_data/build_public_trade_segment.py \
            scripts/market_data/bybit_client.py \
            scripts/market_data/bybit_fetch.py \
            scripts/market_data/canonical_spec.py \
            scripts/market_data/load_canonical_bybit.py \
            scripts/market_data/verify_canonical_bybit.py
          python -m json.tool data/contracts/canonical_bybit_usdt_linear_v1.json >/dev/null
          ! grep -R --line-number --fixed-string 'PRE_2024_2020' \
            data/contracts/canonical_bybit_usdt_linear_v1.json \
            docs/canonical-market-data.md \
            scripts/market_data \
            tests \
            .github/workflows/canonical-bybit-halfyear-data.yml \
            .github/workflows/canonical-bybit-public-month-smoke.yml
