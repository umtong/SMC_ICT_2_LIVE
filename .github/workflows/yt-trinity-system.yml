name: YT Trinity causal ML system

on:
  pull_request:
    branches: [main]
    paths:
      - research/yt_trinity_ml/system/**
      - research/yt_trinity_ml/run_research.py
      - research/yt_trinity_ml/run_primary_screen.py
      - research/yt_trinity_ml/extract_rule_ontology.py
      - research/yt_trinity_ml/system_contract.json
      - research/yt_trinity_ml/SYSTEM_DESIGN.md
      - research/yt_trinity_ml/tests/**
      - .github/workflows/yt-trinity-system.yml
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/system/**
      - research/yt_trinity_ml/run_research.py
      - research/yt_trinity_ml/run_primary_screen.py
      - research/yt_trinity_ml/extract_rule_ontology.py
      - research/yt_trinity_ml/system_contract.json
      - research/yt_trinity_ml/SYSTEM_DESIGN.md
      - research/yt_trinity_ml/tests/**
      - research/yt_trinity_ml/upgrade_chunks/unified_smc_v3.*
      - .github/workflows/yt-trinity-system.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow requests pytest

      - name: Materialize unified SMC/ICT core implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import json
          from pathlib import Path

          chunk_dir = Path('research/yt_trinity_ml/upgrade_chunks')
          chunks = sorted(chunk_dir.glob('unified_smc_v3.*'))
          assert [path.suffix for path in chunks] == [f'.{index:02d}' for index in range(7)], chunks
          payload = ''.join(path.read_text(encoding='utf-8') for path in chunks)
          files = json.loads(gzip.decompress(base64.b85decode(payload.encode('ascii'))).decode('utf-8'))
          expected = {
              'research/yt_trinity_ml/system/corpus_alpha.py',
              'research/yt_trinity_ml/tests/test_corpus_alpha.py',
              'research/yt_trinity_ml/run_primary_screen.py',
              'research/yt_trinity_ml/system_contract.json',
              'research/yt_trinity_ml/SYSTEM_DESIGN.md',
              '.github/workflows/yt-trinity-system.yml',
          }
          assert set(files) == expected, sorted(files)
          for relative, content in files.items():
              if relative.startswith('.github/'):
                  continue
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          PY

      - name: Compile and test unified SMC causal invariants
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -euo pipefail
          mkdir -p artifact/system-test
          {
            python -m py_compile \
              research/yt_trinity_ml/system/*.py \
              research/yt_trinity_ml/run_research.py \
              research/yt_trinity_ml/run_primary_screen.py \
              research/yt_trinity_ml/extract_rule_ontology.py
            python research/yt_trinity_ml/extract_rule_ontology.py --self-test
            python -m json.tool research/yt_trinity_ml/system_contract.json >/dev/null
            python -m json.tool research/yt_trinity_ml/INSTRUMENT_RULES.schema.json >/dev/null
            pytest -q -x --junitxml=artifact/system-test/junit.xml \
              research/yt_trinity_ml/tests/test_corpus_alpha.py \
              research/yt_trinity_ml/tests/test_entry_fill_guard.py \
              research/yt_trinity_ml/tests/test_execution_realism.py \
              research/yt_trinity_ml/tests/test_public_archive.py \
              research/yt_trinity_ml/tests/test_regressions.py \
              research/yt_trinity_ml/tests/test_yt_trinity_system.py
          } 2>&1 | tee artifact/system-test/pytest.log

      - name: Persist tested unified core implementation
        run: |
          set -euo pipefail
          rm -f research/yt_trinity_ml/upgrade_chunks/unified_smc_v3.*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/yt_trinity_ml/system/corpus_alpha.py \
            research/yt_trinity_ml/tests/test_corpus_alpha.py \
            research/yt_trinity_ml/run_primary_screen.py \
            research/yt_trinity_ml/system_contract.json \
            research/yt_trinity_ml/SYSTEM_DESIGN.md
          git add -u research/yt_trinity_ml/upgrade_chunks
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Unify SMC narrative before implementation verdict'
          TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload causal-system diagnostics and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-system-test-${{ github.sha }}
          path: |
            artifact/system-test
            research/yt_trinity_ml
          if-no-files-found: warn
          retention-days: 30
