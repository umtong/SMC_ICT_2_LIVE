name: YT Trinity causal ML system

on:
  pull_request:
    branches: [main]
    paths:
      - research/yt_trinity_ml/system/**
      - research/yt_trinity_ml/run_research.py
      - research/yt_trinity_ml/extract_rule_ontology.py
      - research/yt_trinity_ml/apply_timestamp_unit_patch.py
      - research/yt_trinity_ml/system_contract.json
      - research/yt_trinity_ml/SYSTEM_DESIGN.md
      - research/yt_trinity_ml/INSTRUMENT_RULES.schema.json
      - research/yt_trinity_ml/tests/test_yt_trinity_system.py
      - .github/workflows/yt-trinity-system.yml
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/system/**
      - research/yt_trinity_ml/run_research.py
      - research/yt_trinity_ml/extract_rule_ontology.py
      - research/yt_trinity_ml/apply_timestamp_unit_patch.py
      - research/yt_trinity_ml/system_contract.json
      - research/yt_trinity_ml/SYSTEM_DESIGN.md
      - research/yt_trinity_ml/INSTRUMENT_RULES.schema.json
      - research/yt_trinity_ml/tests/test_yt_trinity_system.py
      - .github/workflows/yt-trinity-system.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Normalize datetime indexes to nanoseconds
        run: python research/yt_trinity_ml/apply_timestamp_unit_patch.py
      - name: Persist timestamp-unit compatibility on the work branch
        run: |
          if ! git diff --quiet -- research/yt_trinity_ml/system/coarse.py research/yt_trinity_ml/system/event_tape.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/yt_trinity_ml/system/coarse.py research/yt_trinity_ml/system/event_tape.py
            git commit -m "Normalize replay timestamps for pandas 3"
            TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow pytest
      - name: Compile and test causal invariants
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -o pipefail
          mkdir -p artifact/system-test
          {
            python -m py_compile research/yt_trinity_ml/system/*.py research/yt_trinity_ml/run_research.py research/yt_trinity_ml/extract_rule_ontology.py
            python research/yt_trinity_ml/extract_rule_ontology.py --self-test
            python -m json.tool research/yt_trinity_ml/system_contract.json >/dev/null
            python -m json.tool research/yt_trinity_ml/INSTRUMENT_RULES.schema.json >/dev/null
            pytest -q -x --junitxml=artifact/system-test/junit.xml research/yt_trinity_ml/tests/test_yt_trinity_system.py
          } 2>&1 | tee artifact/system-test/pytest.log
      - name: Upload causal-system diagnostics and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-system-test-${{ github.sha }}
          path: |
            artifact/system-test
            research/yt_trinity_ml
          if-no-files-found: warn
          retention-days: 30
