name: YT Trinity causal ML system

on:
  pull_request:
    branches: [main]
    paths:
      - research/yt_trinity_ml/system/**
      - research/yt_trinity_ml/run_research.py
      - research/yt_trinity_ml/run_primary_screen.py
      - research/yt_trinity_ml/extract_rule_ontology.py
      - research/yt_trinity_ml/system_contract.json
      - research/yt_trinity_ml/SYSTEM_DESIGN.md
      - research/yt_trinity_ml/tests/**
      - .github/workflows/yt-trinity-system.yml
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/system/**
      - research/yt_trinity_ml/run_research.py
      - research/yt_trinity_ml/run_primary_screen.py
      - research/yt_trinity_ml/extract_rule_ontology.py
      - research/yt_trinity_ml/system_contract.json
      - research/yt_trinity_ml/SYSTEM_DESIGN.md
      - research/yt_trinity_ml/tests/**
      - .github/workflows/yt-trinity-system.yml

permissions:
  contents: read

concurrency:
  group: yt-trinity-system-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 2

      - name: Check whether the head commit changes the causal system
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          printf '%s\n' "${files}"
          if printf '%s\n' "${files}" | grep -Eq '^research/yt_trinity_ml/(system/|tests/|run_research\.py$|run_primary_screen\.py$|extract_rule_ontology\.py$|system_contract\.json$|SYSTEM_DESIGN\.md$)|^\.github/workflows/yt-trinity-system\.yml$'; then
            echo 'run=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'run=false' >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow requests pytest

      - name: Compile and test unified SMC causal invariants
        if: steps.scope.outputs.run == 'true'
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -euo pipefail
          mkdir -p artifact/system-test
          {
            python -m py_compile \
              research/yt_trinity_ml/system/*.py \
              research/yt_trinity_ml/run_research.py \
              research/yt_trinity_ml/run_primary_screen.py \
              research/yt_trinity_ml/extract_rule_ontology.py
            python research/yt_trinity_ml/extract_rule_ontology.py --self-test
            python -m json.tool research/yt_trinity_ml/system_contract.json >/dev/null
            python -m json.tool research/yt_trinity_ml/INSTRUMENT_RULES.schema.json >/dev/null
            pytest -q -x --junitxml=artifact/system-test/junit.xml \
              research/yt_trinity_ml/tests/test_corpus_alpha.py \
              research/yt_trinity_ml/tests/test_entry_fill_guard.py \
              research/yt_trinity_ml/tests/test_execution_realism.py \
              research/yt_trinity_ml/tests/test_public_archive.py \
              research/yt_trinity_ml/tests/test_regressions.py \
              research/yt_trinity_ml/tests/test_yt_trinity_system.py
          } 2>&1 | tee artifact/system-test/pytest.log

      - name: Upload causal-system diagnostics and source snapshot
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-system-test-${{ github.sha }}
          path: |
            artifact/system-test
            research/yt_trinity_ml
          if-no-files-found: warn
          retention-days: 30
