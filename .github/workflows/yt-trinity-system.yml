name: YT Trinity causal ML system

on:
  pull_request:
    branches: [main]
    paths:
      - research/yt_trinity_ml/system/**
      - research/yt_trinity_ml/run_research.py
      - research/yt_trinity_ml/extract_rule_ontology.py
      - research/yt_trinity_ml/system_contract.json
      - research/yt_trinity_ml/SYSTEM_DESIGN.md
      - research/yt_trinity_ml/INSTRUMENT_RULES.schema.json
      - research/yt_trinity_ml/tests/test_yt_trinity_system.py
      - .github/workflows/yt-trinity-system.yml
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/system/**
      - research/yt_trinity_ml/run_research.py
      - research/yt_trinity_ml/extract_rule_ontology.py
      - research/yt_trinity_ml/system_contract.json
      - research/yt_trinity_ml/SYSTEM_DESIGN.md
      - research/yt_trinity_ml/INSTRUMENT_RULES.schema.json
      - research/yt_trinity_ml/tests/test_yt_trinity_system.py
      - .github/workflows/yt-trinity-system.yml

permissions:
  contents: read

concurrency:
  group: yt-trinity-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow pytest
      - name: Compile and test causal invariants
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -o pipefail
          mkdir -p artifact/system-test
          {
            python -m py_compile research/yt_trinity_ml/system/*.py research/yt_trinity_ml/run_research.py research/yt_trinity_ml/extract_rule_ontology.py
            python research/yt_trinity_ml/extract_rule_ontology.py --self-test
            python -m json.tool research/yt_trinity_ml/system_contract.json >/dev/null
            python -m json.tool research/yt_trinity_ml/INSTRUMENT_RULES.schema.json >/dev/null
            pytest -q -x --junitxml=artifact/system-test/junit.xml research/yt_trinity_ml/tests/test_yt_trinity_system.py
          } 2>&1 | tee artifact/system-test/pytest.log
      - name: Upload causal-system diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-system-test-${{ github.sha }}
          path: artifact/system-test
          if-no-files-found: warn
          retention-days: 30
