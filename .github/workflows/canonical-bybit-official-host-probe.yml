name: Canonical Bybit official host probe

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/market_data/probe_bybit_official_hosts.py
      - .github/workflows/canonical-bybit-official-host-probe.yml
  push:
    branches:
      - agent/r22-canonical-halfyear-market-data-001
    paths:
      - scripts/market_data/probe_bybit_official_hosts.py
      - .github/workflows/canonical-bybit-official-host-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "requests==2.32.4"
      - run: python scripts/market_data/probe_bybit_official_hosts.py --out artifact/official_hosts
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-bybit-official-host-probe
          path: artifact/official_hosts
          if-no-files-found: error
          retention-days: 30
