name: Validate project harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependency
        run: python -m pip install "pytest>=8"
      - name: Run one-time strict V3 stablecoin source and economic decision
        if: hashFiles('research/triggers/stablecoin_strict_v3/RUN_20260727T0030KST.txt') != ''
        run: |
          set -euo pipefail
          python -m json.tool research/triggers/stablecoin_strict_v3/EXECUTION_CORRECTION_001_VALIDATOR_HOOK_BEFORE_OUTCOME.json >/dev/null
          python scripts/stablecoin_strict_v3_validation_hook.py 2>&1 | tee "$RUNNER_TEMP/stablecoin_strict_v3_hook.log"
      - name: Validate project structure
        run: python scripts/validate_project.py
      - name: Run tests
        run: python -m pytest
      - name: Build hot context bundle
        run: python scripts/build_context_bundle.py
      - name: Upload one-time strict V3 stablecoin evidence
        if: always() && hashFiles('research/triggers/stablecoin_strict_v3/RUN_20260727T0030KST.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-strict-v3-validator-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stablecoin_strict_v3_hook.log
            ${{ runner.temp }}/stablecoin_strict_v3
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
