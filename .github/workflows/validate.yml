name: Validate project harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 360
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      RUN_ROOT: ${{ runner.temp }}/stablecoin_strict_v4_macos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install frozen stablecoin and project dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            requests==2.32.4 pytest==8.3.5 \
            numpy==2.1.3 pandas==2.2.3 scikit-learn==1.6.1 pyarrow==18.1.0 \
            jsonschema==4.25.1
      - name: Execute strict V4 stablecoin source and economic decision
        run: |
          set -euo pipefail
          python -m py_compile scripts/stablecoin_strict_v4_macos_runner.py
          python scripts/stablecoin_strict_v4_macos_runner.py self-test
          python scripts/stablecoin_strict_v4_macos_runner.py run \
            2>&1 | tee "$RUNNER_TEMP/STABLECOIN_STRICT_V4_MACOS.log"
      - name: Validate compact decision
        if: always()
        run: |
          set -euo pipefail
          test -f "$RUN_ROOT/STABLECOIN_STRICT_V4_SUMMARY.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUN_ROOT'])/'STABLECOIN_STRICT_V4_SUMMARY.json'
          x=json.loads(p.read_text())
          assert x['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert x['source_sha']=='73aac90eacdc0ddcc34f4e45f0ff8d9369e5b539'
          assert x['strict_sha']=='209a0fbe6e2f61d2c58b3eb7910b8c0c139cd46c'
          assert x['account_correction']=='CORRECTION-20260727-ML-STABLECOIN-SIMULTANEOUS-EVENT-LIQUIDATION-DISTANCE-004'
          assert x['source']['status'] in {'PASS','FAIL_BELOW_SOURCE_DENSITY_OR_COVERAGE','SOURCE_UNAVAILABLE_OR_TRANSPORT_FAILURE'}
          assert x['orders_submitted'] is False and x['official_2024h1_opened'] is False
          print('STABLECOIN_STRICT_V4_MACOS_DECISION',json.dumps(x,sort_keys=True))
          PY
      - name: Validate project structure
        run: python scripts/validate_project.py
      - name: Run tests
        run: python -m pytest
      - name: Build hot context bundle
        run: python scripts/build_context_bundle.py
      - name: Upload strict V4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-strict-v4-validator-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/STABLECOIN_STRICT_V4_MACOS.log
            ${{ runner.temp }}/stablecoin_strict_v4_macos
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
