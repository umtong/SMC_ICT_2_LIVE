name: Validate project harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependency
        run: python -m pip install "pytest>=8"
      - name: Validate project structure
        run: python scripts/validate_project.py
      - name: Run tests
        run: python -m pytest
      - name: Build hot context bundle
        run: python scripts/build_context_bundle.py
