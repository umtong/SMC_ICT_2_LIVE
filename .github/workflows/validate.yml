name: Validate project harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 390
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependency
        run: python -m pip install "pytest>=8"
      - name: Validate project structure and execute any frozen authority hook
        run: |
          python -m json.tool research/execution/stablecoin_profit_v5_20260727/EXECUTION_CORRECTION_006_STANDARD_LINUX_VISIBLE_RUNNER_BEFORE_OUTCOME.json >/dev/null
          python scripts/validate_project.py
      - name: Run tests
        run: python -m pytest
      - name: Build hot context bundle
        run: python scripts/build_context_bundle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-profit-v5-validator-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stablecoin_profit_v5_validator_result
            ${{ runner.temp }}/stablecoin_profit_v5_validator_summary.json
            ${{ runner.temp }}/stablecoin_strict_v4_validator_result
            ${{ runner.temp }}/stablecoin_strict_v4_validator_summary.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
