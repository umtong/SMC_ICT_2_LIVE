name: YTT 178 frozen structural H1 carrier

on:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ytt-178-h1-carrier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SCIENTIFIC_SOURCE: d7486872efccf0b67b7209baeadfd12ff35b56d0
  CANONICAL_SOURCE: a2bb231966a517d29495bed7673e4d08ab8e30a9

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: ${{ env.SCIENTIFIC_SOURCE }}
          path: scientific_repo
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: ${{ env.CANONICAL_SOURCE }}
          path: canonical_repo
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deterministic dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q \
            'numpy==2.2.6' \
            'pandas==2.2.3' \
            'pyarrow==19.0.1' \
            'scikit-learn==1.6.1'

      - name: Download frozen 2023 warmup and 2024H1 Bybit shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_artifact() {
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" \
              -o "$2"
          }
          mkdir -p \
            inputs/data/PRE_2024_2023/BTCUSDT \
            inputs/data/PRE_2024_2023/ETHUSDT \
            inputs/data/2024_H1/BTCUSDT \
            inputs/data/2024_H1/ETHUSDT \
            output
          fetch_artifact 8636781702 /tmp/btc2023.zip
          fetch_artifact 8636761741 /tmp/eth2023.zip
          fetch_artifact 8636867995 /tmp/btc2024h1.zip
          fetch_artifact 8636882043 /tmp/eth2024h1.zip
          unzip -q /tmp/btc2023.zip -d inputs/data/PRE_2024_2023/BTCUSDT
          unzip -q /tmp/eth2023.zip -d inputs/data/PRE_2024_2023/ETHUSDT
          unzip -q /tmp/btc2024h1.zip -d inputs/data/2024_H1/BTCUSDT
          unzip -q /tmp/eth2024h1.zip -d inputs/data/2024_H1/ETHUSDT
          test "$(find inputs/data -name DATASET_MANIFEST.json | wc -l)" -ge 4

      - name: Execute frozen 2023-selected H1 account paths
        env:
          PYTHONPATH: scientific_repo/research/yt_trinity_ml
        run: |
          set -o pipefail
          python -m py_compile research/yt_trinity_ml/experiments/run_ytt_178_frozen_h1.py
          python research/yt_trinity_ml/experiments/run_ytt_178_frozen_h1.py \
            --repo-root canonical_repo \
            --data-root inputs/data \
            --output output \
            --scientific-source-commit "${SCIENTIFIC_SOURCE}" \
            --canonical-source-commit "${CANONICAL_SOURCE}" \
            2>&1 | tee output/STDOUT.log

      - name: Hash evidence
        if: always()
        run: |
          if [[ -d output ]]; then
            (cd output && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytt-178-frozen-structural-h1-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90
