name: ML Sweep-FVG queue-aware maker

on:
  pull_request:
    branches: [main]
    paths:
      - "research/ml_sweep_fvg_maker_20260726/**"
      - ".github/workflows/ml-sweep-fvg-maker-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ml-sweep-fvg-maker-r11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: "8626087323"
      SOURCE_ARTIFACT_SHA256: "90594acc23e63e97e83347f9b07eb9ac260ba7bb1b87eb72052287a8328ad4a1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frozen environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "pyarrow==17.0.0" \
            "scikit-learn==1.6.1" \
            "pytest==8.3.4"

      - name: Restore immutable implementation and run causal tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_sweep_fvg_maker_20260726
          python "$root/reconstruct.py"
          python -m py_compile "$root/maker.py" "$root/run.py" "$root/test_maker.py"
          PYTHONPATH="$root" pytest -q "$root/test_maker.py"
          PYTHONPATH="$root" python "$root/run.py" --self-test
          python scripts/validate_project.py

      - name: Download and verify immutable upstream compact-state artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/umtong/SMC_ICT_2_LIVE/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            --output /tmp/bybit-l2-resiliency-source.zip
          echo "$SOURCE_ARTIFACT_SHA256  /tmp/bybit-l2-resiliency-source.zip" | sha256sum --check -
          rm -rf /tmp/bybit-l2-resiliency-source
          mkdir -p /tmp/bybit-l2-resiliency-source
          unzip -q /tmp/bybit-l2-resiliency-source.zip -d /tmp/bybit-l2-resiliency-source
          test -f /tmp/bybit-l2-resiliency-source/output/SOURCE_MANIFEST.json
          test -f /tmp/bybit-l2-resiliency-source/output/compact_states/2022-07-01_BTCUSDT_state.parquet
          test -f /tmp/bybit-l2-resiliency-source/output/compact_states/2023-07-01_BTCUSDT_state.parquet

      - name: Run frozen fit and conditional untouched development
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_sweep_fvg_maker_20260726
          out=research_runs/ml_sweep_fvg_maker_20260726/r11
          cache="$RUNNER_TEMP/ml-sweep-fvg-maker-cache"
          mkdir -p "$out" "$cache"
          python - <<'PY'
          import json, platform, sys
          from pathlib import Path
          import numpy, pandas, pyarrow, requests, sklearn
          out=Path('research_runs/ml_sweep_fvg_maker_20260726/r11')
          out.mkdir(parents=True, exist_ok=True)
          (out/'ENVIRONMENT.json').write_text(json.dumps({
              'python':sys.version,
              'platform':platform.platform(),
              'numpy':numpy.__version__,
              'pandas':pandas.__version__,
              'pyarrow':pyarrow.__version__,
              'requests':requests.__version__,
              'scikit_learn':sklearn.__version__,
              'claim_id':'CLM-20260726-1837-ML-SWEEP-FVG-MAKER-001',
              'engine_version':'ML-SWEEP-FVG-QUEUE-MAKER-V1',
              'orders_submitted':False,
              'paper_live_started':False,
              '2024_opened':False,
              '2025_opened':False,
              '2026_opened':False,
          },indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          PYTHONPATH="$root" python "$root/run.py" \
            --source-root /tmp/bybit-l2-resiliency-source \
            --cache "$cache" \
            --output "$out" \
            2>&1 | tee "$out/RUN.log"

      - name: Record immutable checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_sweep_fvg_maker_20260726
          out=research_runs/ml_sweep_fvg_maker_20260726/r11
          mkdir -p "$out"
          sha256sum \
            "$root/WORK_CLAIM.json" \
            "$root/preregistration.json" \
            "$root/README.md" \
            "$root/SOURCES.md" \
            "$root/SOURCE_BUNDLE_MANIFEST.json" \
            "$root/reconstruct.py" \
            "$root"/source_bundle.tar.gz.b64.part* \
            "$root/maker.py" \
            "$root/run.py" \
            "$root/test_maker.py" \
            > "$out/INPUT_SHA256SUMS.txt"
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-sweep-fvg-maker-r11-${{ github.sha }}
          path: |
            research_runs/ml_sweep_fvg_maker_20260726/r11
            research/ml_sweep_fvg_maker_20260726/maker.py
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
