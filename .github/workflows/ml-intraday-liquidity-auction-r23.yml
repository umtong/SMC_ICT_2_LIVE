name: ML intraday liquidity auction R23

on:
  pull_request:
    branches: [main]
    paths:
      - "research/ml_intraday_liquidity_auction_20260727/**"
      - ".github/workflows/ml-intraday-liquidity-auction-r23.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-intraday-liquidity-auction-r23-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  causal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen validation environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "scikit-learn==1.6.1" "pyarrow==18.1.0" "pytest==8.3.4"
      - name: Validate day-trading-only contract
        run: |
          set -euo pipefail
          root=research/ml_intraday_liquidity_auction_20260727
          python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$root/preregistration.json" >/dev/null
          python -m json.tool "$root/LOCAL_VALIDATION.json" >/dev/null
          python -m json.tool "$root/bundle_manifest.json" >/dev/null
          python "$root/reconstruct.py"
          python -m py_compile "$root/reconstruct.py" "$root/run.py" "$root/test_run.py"
          python "$root/run.py" self-test
          PYTHONPATH="$root" pytest -q "$root/test_run.py"
