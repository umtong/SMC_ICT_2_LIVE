name: Cross-margin contingent fatal-edge pilot

on:
  push:
    branches:
      - agent/r5-cross-margin-dislocation-001
    paths:
      - "research/cross_margin_dislocation_20260725/tardis_pilot.py"
      - "research/cross_margin_dislocation_20260725/preregistration_tardis_v2.json"
      - "research_results/r5_cross_margin_dislocation_001/STATUS_TARDIS_SOURCE_USABLE.txt"
      - ".github/workflows/cross-margin-tardis-pilot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r5-cross-margin-tardis-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-cross-margin-dislocation-001
          fetch-depth: 1

      - name: Enforce source preconditions
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/r5-cross-margin-dislocation-001
          git reset --hard origin/agent/r5-cross-margin-dislocation-001
          ready=false
          if [[ -f research_results/r5_cross_margin_dislocation_001/STATUS_INFRASTRUCTURE_BLOCKED.txt \
             && -f research_results/r5_cross_margin_dislocation_001/STATUS_TARDIS_SOURCE_USABLE.txt ]]; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          mkdir -p research_runs/cross_margin_dislocation_20260725/tardis_pilot
          python - "$ready" <<'PY'
          import json, pathlib, sys
          pathlib.Path('research_runs/cross_margin_dislocation_20260725/tardis_pilot/PRECONDITION.json').write_text(
              json.dumps({
                  'official_source_infrastructure_blocked':pathlib.Path('research_results/r5_cross_margin_dislocation_001/STATUS_INFRASTRUCTURE_BLOCKED.txt').exists(),
                  'tardis_source_usable':pathlib.Path('research_results/r5_cross_margin_dislocation_001/STATUS_TARDIS_SOURCE_USABLE.txt').exists(),
                  'pilot_ready':sys.argv[1]=='true',
                  'development_opened':False,
                  'selection_opened':False,
                  'confirmation_opened':False,
                  '2026_opened':False,
                  'orders_submitted':False,
              },indent=2,sort_keys=True)+'\n')
          PY

      - name: Install fixed environment
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "requests==2.32.4"

      - name: Verify preregistration and causal self-test
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_margin_dislocation_20260725
          python -m py_compile "$root/tardis_source_probe.py" "$root/tardis_pilot.py"
          sha256sum "$root/preregistration_tardis_v2.json" "$root/tardis_source_probe.py" "$root/tardis_pilot.py" > research_runs/cross_margin_dislocation_20260725/tardis_pilot/INPUT_SHA256SUMS.txt
          PYTHONPATH="$root" python "$root/tardis_pilot.py" --self-test \
            --output research_runs/cross_margin_dislocation_20260725/tardis_pilot \
            --cache "$RUNNER_TEMP/cross-margin-tardis-cache" \
            2>&1 | tee research_runs/cross_margin_dislocation_20260725/tardis_pilot/self_test.log

      - name: Run systematic four-day fatal-edge pilot
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_margin_dislocation_20260725
          PYTHONPATH="$root" python "$root/tardis_pilot.py" \
            --output research_runs/cross_margin_dislocation_20260725/tardis_pilot/result \
            --cache "$RUNNER_TEMP/cross-margin-tardis-cache" \
            2>&1 | tee research_runs/cross_margin_dislocation_20260725/tardis_pilot/pilot.log

      - name: Commit durable pilot decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_results/r5_cross_margin_dislocation_001
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('research_runs/cross_margin_dislocation_20260725/tardis_pilot')
          output=pathlib.Path('research_results/r5_cross_margin_dislocation_001')
          pre=json.loads((root/'PRECONDITION.json').read_text())
          path=root/'result'/'PILOT_RESULT.json'
          pilot=json.loads(path.read_text()) if path.exists() else None
          if not pre['pilot_ready']:
              status='TARDIS_PILOT_NOT_ACTIVATED'
          elif pilot is None:
              status='TARDIS_PILOT_INFRA_FAILURE'
          elif int(pilot.get('fatal_edge_pass_count',0))>0:
              status='TARDIS_PILOT_PASS'
          else:
              status='TARDIS_PILOT_NO_EDGE'
          result={
              'schema_version':2,
              'result_id':'RES-20260725-CROSS-MARGIN-PILOT-002',
              'claim_id':'CLM-20260725-2120-CROSS-MARGIN-001',
              'status':status,
              'precondition':pre,
              'pilot':pilot,
              'development_opened':False,
              'selection_opened':False,
              'confirmation_opened':False,
              '2026_opened':False,
              'orders_submitted':False,
              'paper_live_started':False,
              'champion_eligible':False,
          }
          durable=output/'tardis_pilot_result.json'
          durable.write_text(json.dumps(result,indent=2,sort_keys=True,default=str)+'\n')
          (output/'tardis_pilot_result.sha256').write_text(hashlib.sha256(durable.read_bytes()).hexdigest()+'  tardis_pilot_result.json\n')
          for old in output.glob('STATUS_TARDIS_PILOT_*.txt'):
              old.unlink()
          (output/f'STATUS_{status}.txt').write_text(json.dumps({'status':status,'fatal_edge_pass_count':0 if not pilot else int(pilot.get('fatal_edge_pass_count',0)),'development_opened':False,'2026_opened':False,'orders_submitted':False},indent=2,sort_keys=True)+'\n')
          PY
          find research_results/r5_cross_margin_dislocation_001 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > research_results/r5_cross_margin_dislocation_001/SHA256SUMS.txt
          git config user.name "smc-ict-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_results/r5_cross_margin_dislocation_001
          if ! git diff --cached --quiet; then
            git commit -m "Record contingent cross-margin fatal-edge pilot"
            git push origin HEAD:agent/r5-cross-margin-dislocation-001
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-margin-tardis-pilot-${{ github.sha }}
          path: research_runs/cross_margin_dislocation_20260725/tardis_pilot
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
