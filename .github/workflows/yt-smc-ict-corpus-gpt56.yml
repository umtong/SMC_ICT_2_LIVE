name: YT SMC ICT complete corpus gpt56

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Optional per-channel video limit for diagnostics (0 = all)
        required: false
        default: "0"
  push:
    branches:
      - agent/yt-smc-ict-causal-ml-gpt56-20260727
    paths:
      - research/yt_smc_ict_gpt56/collect_corpus.py
      - .github/workflows/yt-smc-ict-corpus-gpt56.yml

permissions:
  contents: write

concurrency:
  group: yt-smc-ict-corpus-gpt56-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install transcript collection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp youtube-transcript-api requests

      - name: Compile and test corpus collector
        run: |
          python -m py_compile research/yt_smc_ict_gpt56/collect_corpus.py
          python research/yt_smc_ict_gpt56/collect_corpus.py --self-test

      - name: Enumerate every public upload and collect captions
        id: collect
        shell: bash
        env:
          INPUT_LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          set +e
          rm -rf artifact/corpus
          mkdir -p artifact/corpus
          python research/yt_smc_ict_gpt56/collect_corpus.py \
            --output artifact/corpus \
            --workers 3 \
            --limit "${INPUT_LIMIT}" \
            2>&1 | tee artifact/corpus/COLLECT_STDOUT.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write recoverable corpus pointer
        if: always()
        shell: bash
        env:
          COLLECT_STATUS: ${{ steps.collect.outputs.status || '99' }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          summary_path = Path("artifact/corpus/CORPUS_SUMMARY.json")
          summary = json.loads(summary_path.read_text(encoding="utf-8")) if summary_path.exists() else {}
          index_path = Path("artifact/corpus/VIDEO_INDEX.json")
          failures_path = Path("artifact/corpus/TRANSCRIPT_FAILURES.json")
          source_sha = os.environ["GITHUB_SHA"]
          pointer = {
              "schema_version": 1,
              "system_id": "YT-SMC-ICT-GPT56-CORPUS-001",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_sha": source_sha,
              "branch": os.environ["GITHUB_REF_NAME"],
              "artifact_name": f"yt-smc-ict-complete-corpus-gpt56-{source_sha}",
              "collector_exit_status": int(os.environ["COLLECT_STATUS"]),
              "summary": summary,
              "video_index_sha256": hashlib.sha256(index_path.read_bytes()).hexdigest() if index_path.exists() else None,
              "failure_manifest_sha256": hashlib.sha256(failures_path.read_bytes()).hexdigest() if failures_path.exists() else None,
          }
          path = Path("research/yt_smc_ict_gpt56/CORPUS_POINTER.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload immutable corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-smc-ict-complete-corpus-gpt56-${{ github.sha }}
          path: artifact/corpus
          if-no-files-found: error
          compression-level: 6
          retention-days: 90

      - name: Commit corpus pointer to the research branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_smc_ict_gpt56/CORPUS_POINTER.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record complete YouTube corpus ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Enforce complete channel enumeration
        if: always()
        shell: bash
        run: |
          status="${{ steps.collect.outputs.status || '99' }}"
          if [[ "$status" != "0" ]]; then
            echo "Corpus collector exit status: $status" >&2
            exit "$status"
          fi
