name: YT Trinity tightened gate 2024H1 isolated v1

on:
  push:
    branches: [agent/yt-trinity-h1-iterative-001]
    paths:
      - research/yt_trinity_ml/run_quality_gate_ml_rank_tightened_v1.py
      - research/yt_trinity_ml/run_tightened_gate_pre2024_freeze_v1.py
      - .github/workflows/yt-trinity-tightened-gate-2024h1-v1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-tightened-gate-2024h1-isolated-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: a2bb231966a517d29495bed7673e4d08ab8e30a9
          path: canonical_repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deterministic dependencies
        run: python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'pyarrow==19.0.1' 'scikit-learn==1.6.1'
      - name: Download frozen labels and Bybit BTC/ETH shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_artifact() {
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"
          }
          mkdir -p inputs/labels \
            inputs/data/PRE_2024_2023/BTCUSDT inputs/data/PRE_2024_2023/ETHUSDT \
            inputs/data/2024_H1/BTCUSDT inputs/data/2024_H1/ETHUSDT output/pre2024 output/h1
          fetch_artifact 8643192491 /tmp/labels.zip
          fetch_artifact 8636781702 /tmp/btc2023.zip
          fetch_artifact 8636761741 /tmp/eth2023.zip
          fetch_artifact 8636867995 /tmp/btc2024h1.zip
          fetch_artifact 8636882043 /tmp/eth2024h1.zip
          unzip -q /tmp/labels.zip -d inputs/labels
          unzip -q /tmp/btc2023.zip -d inputs/data/PRE_2024_2023/BTCUSDT
          unzip -q /tmp/eth2023.zip -d inputs/data/PRE_2024_2023/ETHUSDT
          unzip -q /tmp/btc2024h1.zip -d inputs/data/2024_H1/BTCUSDT
          unzip -q /tmp/eth2024h1.zip -d inputs/data/2024_H1/ETHUSDT
          test -s inputs/labels/EVENT_LABELS.pkl.gz
      - name: Reproduce pre-2024 frozen-gate evidence
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -euo pipefail
          python -m py_compile \
            research/yt_trinity_ml/run_tightened_gate_pre2024_freeze_v1.py \
            research/yt_trinity_ml/run_quality_gate_ml_rank_tightened_v1.py \
            research/yt_trinity_ml/run_quality_gate_ml_rank_period_v1.py
          python research/yt_trinity_ml/run_tightened_gate_pre2024_freeze_v1.py \
            --labels inputs/labels/EVENT_LABELS.pkl.gz \
            --output output/pre2024 \
            --risk-fraction 0.17 \
            | tee output/pre2024/STDOUT.log
      - name: Execute frozen tightened gate on 2024H1
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -euo pipefail
          python research/yt_trinity_ml/run_quality_gate_ml_rank_tightened_v1.py \
            --repo-root canonical_repo \
            --data-root inputs/data \
            --labels inputs/labels/EVENT_LABELS.pkl.gz \
            --output output/h1 \
            --segments PRE_2024_2023 2024_H1 \
            --start 2024-01-01T00:00:00Z \
            --end-exclusive 2024-07-01T00:00:00Z \
            --initial-nav 10000 \
            --risk-fraction 0.17 \
            --maximum-leverage 20 \
            --stage 2024_H1_TIGHTENED_QUALITY_GATE_ML_RANK_COARSE_PROVISIONAL_ISOLATED \
            | tee output/h1/STDOUT.log
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-tightened-gate-2024h1-isolated-v1-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Persist result pointer on isolated branch
        if: always()
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git fetch origin agent/yt-trinity-h1-iterative-001
          git checkout -B agent/yt-trinity-h1-iterative-001 origin/agent/yt-trinity-h1-iterative-001
          SOURCE_SHA="${source_sha}" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          pre_path = Path('output/pre2024/TIGHTENED_GATE_PRE2024_FREEZE.json')
          h1_path = Path('output/h1/QUALITY_GATE_ML_RANK_RESULT.json')
          pre = json.loads(pre_path.read_text()) if pre_path.exists() else None
          h1 = json.loads(h1_path.read_text()) if h1_path.exists() else None
          pointer = {
              'schema_version': 1,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'stage': '2024_H1_TIGHTENED_QUALITY_GATE_ML_RANK_COARSE_PROVISIONAL_ISOLATED',
              'source_commit': os.environ['SOURCE_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'status': 'success' if pre is not None and h1 is not None else 'execution_failure_not_economic_failure',
              'pre2024_sha256': hashlib.sha256(pre_path.read_bytes()).hexdigest() if pre else None,
              'h1_sha256': hashlib.sha256(h1_path.read_bytes()).hexdigest() if h1 else None,
              'pre2024': pre,
              'h1': h1,
              'ranking_effect': 'PROVISIONAL_COARSE_ONLY',
          }
          Path('research/yt_trinity_ml/TIGHTENED_GATE_2024H1_ISOLATED_POINTER.json').write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True, default=str) + '\n'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/TIGHTENED_GATE_2024H1_ISOLATED_POINTER.json
          if ! git diff --cached --quiet; then
            git commit -m "Record isolated tightened-gate 2024H1 ${GITHUB_RUN_ID}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin agent/yt-trinity-h1-iterative-001
              if git push origin HEAD:agent/yt-trinity-h1-iterative-001; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
      - name: Enforce both evidence products
        if: always()
        run: |
          test -s output/pre2024/TIGHTENED_GATE_PRE2024_FREEZE.json
          test -s output/h1/QUALITY_GATE_ML_RANK_RESULT.json
