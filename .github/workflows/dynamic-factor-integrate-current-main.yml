name: Integrate verified dynamic-factor result onto current main

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/dynamic-factor-integrate.trigger'
      - '.github/workflows/dynamic-factor-integrate-current-main.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r8-dynamic-factor-merge-20260726
          fetch-depth: 0
          persist-credentials: true
      - name: Copy verified files and merge append-only registries
        shell: bash
        run: |
          set -euo pipefail
          source_ref=origin/agent/r4-dynamic-factor-residual-001
          git fetch origin main agent/r4-dynamic-factor-residual-001
          files=(
            .github/workflows/dynamic-factor-bundle-repair.yml
            .github/workflows/dynamic-factor-residual.yml
            .github/workflows/dynamic-factor-test-export.yml
            data/catalog/DS-BINANCE-USDM-4ASSET-FUNDING-MARK-2023-R1.json
            research/dynamic_factor_residual_20260725/EXTENSION_BUNDLE_MANIFEST.json
            research/dynamic_factor_residual_20260725/README.md
            research/dynamic_factor_residual_20260725/RESULT_POINTER.json
            research/dynamic_factor_residual_20260725/actual_funding_audit_fingerprints.json
            research/dynamic_factor_residual_20260725/actual_funding_audit_summary.json
            research/dynamic_factor_residual_20260725/actual_funding_evaluation_contract.json
            research/dynamic_factor_residual_20260725/audit_actual_funding.py
            research/dynamic_factor_residual_20260725/dynamic_factor_residual.py
            research/dynamic_factor_residual_20260725/evaluation_contract.json
            research/dynamic_factor_residual_20260725/extension_bundle.tar.gz.b64.part00
            research/dynamic_factor_residual_20260725/extension_bundle.tar.gz.b64.part01a
            research/dynamic_factor_residual_20260725/extension_bundle.tar.gz.b64.part01b
            research/dynamic_factor_residual_20260725/extension_bundle.tar.gz.b64.part01c
            research/dynamic_factor_residual_20260725/extension_bundle.tar.gz.b64.part02
            research/dynamic_factor_residual_20260725/preregistration.json
            research/dynamic_factor_residual_20260725/result_summary.json
            research/dynamic_factor_residual_20260725/revision5_champion_comparison.json
            research/dynamic_factor_residual_20260725/test_dynamic_factor_residual.py
            research/reports/RES-20260725-DYNAMIC-FACTOR-001.json
            research/validation/VAL-20260725-DYNAMIC-FACTOR-ACTUAL-FUNDING-001.json
          )
          git checkout "$source_ref" -- "${files[@]}"
          python - <<'PY'
          import json, pathlib, subprocess
          specs={
            'control/result-registry.jsonl':'result_id',
            'control/validation-cache.jsonl':'attestation_id',
            'data/catalog/dataset-registry.jsonl':'dataset_id',
          }
          def show(ref,path):
            p=subprocess.run(['git','show',f'{ref}:{path}'],text=True,capture_output=True)
            return p.stdout if p.returncode==0 else ''
          for path,key in specs.items():
            rows=[]; seen=set()
            for text in (show('HEAD',path),show('origin/agent/r4-dynamic-factor-residual-001',path)):
              for raw in text.splitlines():
                if not raw.strip(): continue
                obj=json.loads(raw); ident=str(obj.get(key,''))
                if ident in seen: continue
                seen.add(ident); rows.append(obj)
            pathlib.Path(path).parent.mkdir(parents=True,exist_ok=True)
            pathlib.Path(path).write_text('\n'.join(json.dumps(x,separators=(',',':'),ensure_ascii=False) for x in rows)+'\n',encoding='utf-8')
            subprocess.run(['git','add',path],check=True)
          PY
          python -m py_compile research/dynamic_factor_residual_20260725/dynamic_factor_residual.py research/dynamic_factor_residual_20260725/audit_actual_funding.py research/dynamic_factor_residual_20260725/test_dynamic_factor_residual.py
          python research/dynamic_factor_residual_20260725/dynamic_factor_residual.py --self-test
          python -m pytest -q research/dynamic_factor_residual_20260725/test_dynamic_factor_residual.py -k 'not later_periods_sealed'
          python scripts/validate_project.py
          python -m pytest -q --ignore=research/dynamic_factor_residual_20260725/test_dynamic_factor_residual.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/dynamic-factor-integrate.trigger .github/workflows/dynamic-factor-integrate-current-main.yml
          git add "${files[@]}" control/result-registry.jsonl control/validation-cache.jsonl data/catalog/dataset-registry.jsonl
          git commit -m 'Integrate verified dynamic-factor result onto current main'
          git push origin HEAD:agent/r8-dynamic-factor-merge-20260726
