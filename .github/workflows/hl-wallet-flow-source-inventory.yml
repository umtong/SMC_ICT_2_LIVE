name: Hyperliquid wallet-flow source inventory

on:
  push:
    branches:
      - agent/r11-hl-wallet-flow-001
    paths:
      - "research/hyperliquid_wallet_flow_20260726/**"
      - ".github/workflows/hl-wallet-flow-source-inventory.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/hyperliquid_wallet_flow_20260726/**"
      - ".github/workflows/hl-wallet-flow-source-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hl-wallet-flow-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          root=research/hyperliquid_wallet_flow_20260726
          python -m py_compile "$root/inventory_source.py"
          python scripts/validate_project.py
          mkdir -p research_runs/hyperliquid_wallet_flow_20260726
          sha256sum \
            "$root/preregistration_v1.json" \
            "$root/README.md" \
            "$root/inventory_source.py" \
            > research_runs/hyperliquid_wallet_flow_20260726/INPUT_SHA256SUMS.txt

      - name: Probe anonymous public Kaggle metadata and file inventory
        shell: bash
        run: |
          set -o pipefail
          root=research/hyperliquid_wallet_flow_20260726
          output=research_runs/hyperliquid_wallet_flow_20260726/inventory
          python "$root/inventory_source.py" --output "$output" \
            2>&1 | tee research_runs/hyperliquid_wallet_flow_20260726/run.log

      - name: Enforce no-outcome boundary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('research_runs/hyperliquid_wallet_flow_20260726/inventory/SOURCE_INVENTORY.json')
          result = json.loads(path.read_text())
          assert result['stage'] == 'SOURCE_INVENTORY_ONLY'
          assert result['source_probe_only'] is True
          assert result['strategy_pnl_computed'] is False
          assert result['wallet_performance_read'] is False
          assert result['forward_returns_read'] is False
          assert result['official_2024_2026_opened'] is False
          assert result['orders_submitted'] is False
          print(json.dumps({
              'file_inventory_observed': result['file_inventory_observed'],
              'file_count': result['file_count'],
              'dates_in_filenames': result['dates_in_filenames'],
              'promotion_status': result['promotion_status'],
          }, sort_keys=True))
          PY

      - name: Record immutable output hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research_runs/hyperliquid_wallet_flow_20260726
          find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hl-wallet-flow-inventory-${{ github.sha }}
          path: research_runs/hyperliquid_wallet_flow_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
