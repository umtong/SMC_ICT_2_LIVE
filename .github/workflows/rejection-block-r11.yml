name: ICT rejection-block liquidity-raid fatal screen

on:
  push:
    branches:
      - agent/r11-rejection-block-001
    paths:
      - "research/rejection_block_20260726/**"
      - ".github/workflows/rejection-block-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/rejection_block_20260726/**"
      - ".github/workflows/rejection-block-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rejection-block-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fatal-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "pyarrow==18.1.0" "pytest==8.3.4"
      - name: Download immutable causal state artifact
        uses: actions/download-artifact@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          run-id: 30183063220
          name: bybit-l2-resiliency-ce9150a0b06f4864dd8021a63ac6b3238be2b216
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reused/bybit_l2_resiliency
      - name: Verify source and implementation
        run: |
          set -euo pipefail
          (cd reused/bybit_l2_resiliency/output && sha256sum --check SHA256SUMS.txt)
          echo "da8f581e64ba6f5305c57c0d76403b262d1b0ff48ad540e19302f6bf7416c38b  reused/bybit_l2_resiliency/output/compact_states/2022-07-01_BTCUSDT_state.parquet" | sha256sum --check
          echo "8872cd2a21960666f10f3d35c788a16faefd007d02a30389079def794e90389f  reused/bybit_l2_resiliency/output/compact_states/2023-07-01_BTCUSDT_state.parquet" | sha256sum --check
          root=research/rejection_block_20260726
          python "$root/reconstruct.py"
          python -m py_compile "$root/reconstruct.py" "$root/run_screen.py" "$root/test_run_screen.py"
          python "$root/run_screen.py" self-test
          python -m pytest -q "$root/test_run_screen.py"
          python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$root/preregistration.json" >/dev/null
      - name: Run frozen objective-first screen
        run: |
          set -euo pipefail
          root=research/rejection_block_20260726
          mkdir -p research_runs/rejection_block/output
          python "$root/run_screen.py" run \
            --fit reused/bybit_l2_resiliency/output/compact_states/2022-07-01_BTCUSDT_state.parquet \
            --development reused/bybit_l2_resiliency/output/compact_states/2023-07-01_BTCUSDT_state.parquet \
            --output research_runs/rejection_block/output \
            2>&1 | tee research_runs/rejection_block/run.log
      - name: Verify result and boundary
        if: always()
        run: |
          set -euo pipefail
          result=research_runs/rejection_block/output/RESULT.json
          if test -f "$result"; then
            (cd research_runs/rejection_block/output && sha256sum --check SHA256SUMS.txt)
            python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("research_runs/rejection_block/output/RESULT.json").read_text())
          assert result["candidate_count"] == 216
          assert result["2024_opened"] is False
          assert result["2025_or_2026_opened"] is False
          assert result["orders_submitted"] is False
          assert result["rank_eligible"] is False
          print(json.dumps(result, sort_keys=True))
          PY
          fi
          python scripts/validate_project.py
      - name: Record input hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research_runs/rejection_block
          sha256sum \
            research/rejection_block_20260726/README.md \
            research/rejection_block_20260726/SOURCES.md \
            research/rejection_block_20260726/WORK_CLAIM.json \
            research/rejection_block_20260726/preregistration.json \
            research/rejection_block_20260726/reconstruct.py \
            research/rejection_block_20260726/bundle_manifest.json \
            research/rejection_block_20260726/source_bundle.tar.gz.b64 \
            .github/workflows/rejection-block-r11.yml \
            > research_runs/rejection_block/INPUT_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rejection-block-${{ github.sha }}
          path: research_runs/rejection_block
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
