name: Stablecoin issuance ML economic continuation

on:
  push:
    branches:
      - agent/r15-ml-stablecoin-economic-clean-001
    paths:
      - '.github/workflows/ml-stablecoin-economic-r15.yml'
      - 'research/ml_stablecoin_issuance_economic_20260726/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-stablecoin-economic-r15.yml'
      - 'research/ml_stablecoin_issuance_economic_20260726/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stablecoin-economic-r15-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  economic:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 pandas==2.2.3 requests==2.32.4 \
            scikit-learn==1.6.1 pyarrow==18.1.0 pytest==8.3.5
      - name: Reconstruct and validate frozen economic engine
        run: |
          set -euo pipefail
          root=research/ml_stablecoin_issuance_economic_20260726
          mkdir -p "$RUNNER_TEMP/stablecoin-validation"
          python "$root/reconstruct.py"
          python -m py_compile "$root/run.py" "$root/test_run.py" "$root/reconstruct.py"
          PYTHONPATH="$root" pytest -q "$root/test_run.py"
          PYTHONPATH="$root" python "$root/run.py" self-test
          python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$root/BUNDLE_MANIFEST.json" >/dev/null
          python -m json.tool "$root/EXECUTION_CORRECTION_001_ACCEPT_MACOS_SOURCE_ARTIFACT_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$root/EXECUTION_CORRECTION_002_NONBLOCKING_PROJECT_VALIDATOR_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$root/EXECUTION_CORRECTION_003_ACCEPT_LINUX_SOURCE_ARTIFACT_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$root/EXECUTION_CORRECTION_004_REQUIRE_CORRECTED_SOURCE_SCHEMA_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$root/EXECUTION_CORRECTION_005_REQUIRE_CURRENT_PARENT_HEAD_BEFORE_OUTCOME.json" >/dev/null
          set +e
          python scripts/validate_project.py 2>&1 | tee "$RUNNER_TEMP/stablecoin-validation/PROJECT_VALIDATION.log"
          echo ${PIPESTATUS[0]} > "$RUNNER_TEMP/stablecoin-validation/PROJECT_VALIDATION_EXIT_CODE.txt"
          set -e
      - id: source
        name: Consume current-head corrected decision-ready parent source result
        shell: bash
        run: |
          set -euo pipefail
          out=research_runs/ml_stablecoin_issuance_economic_20260726
          mkdir -p "$out/source" /tmp/source-download
          parent_branch=agent/r13-ml-stablecoin-issuance-001
          parent_head=$(git ls-remote origin "refs/heads/$parent_branch" | awk 'NR==1 {print $1}')
          test -n "$parent_head"
          printf '%s\n' "$parent_head" > "$out/source/EXPECTED_PARENT_HEAD_SHA.txt"
          selected=0
          for attempt in $(seq 1 90); do
            gh run list --repo "$GITHUB_REPOSITORY" \
              --branch "$parent_branch" --limit 100 \
              --json databaseId,name,status,conclusion,createdAt,headSha \
              > /tmp/source-runs.json
            mapfile -t runs < <(python - "$parent_head" <<'PY'
          import json
          import sys

          expected = sys.argv[1]
          allowed = {
              "ML stablecoin issuance source gate",
              "Stablecoin Blockscout source gate",
              "Stablecoin Blockscout source gate macOS",
              "Stablecoin Blockscout source gate Linux",
          }
          rows = json.load(open('/tmp/source-runs.json'))
          for row in rows:
              if (
                  row.get('name') in allowed
                  and row.get('status') == 'completed'
                  and row.get('conclusion') == 'success'
                  and row.get('headSha') == expected
              ):
                  print(row['databaseId'])
          PY
          )
            for run_id in "${runs[@]:-}"; do
              [ -n "$run_id" ] || continue
              rm -rf /tmp/source-download/*
              if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --dir /tmp/source-download >/dev/null 2>&1; then
                continue
              fi
              while IFS= read -r result; do
                if python - "$result" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          expected_schema = "STABLECOIN_SUPPLY_USDT_ISSUE_REDEEM_USDC_ZERO_TRANSFER_V1"
          expected_correction = "CORRECTION-20260726-ML-STABLECOIN-USDT-ISSUE-REDEEM-010"
          result_path = Path(sys.argv[1])
          result = json.loads(result_path.read_text())
          manifest_path = result_path.with_name("SOURCE_MANIFEST.json")
          events_path = result_path.with_name("EVENTS.jsonl")
          download_root = Path('/tmp/source-download')
          if not manifest_path.is_file() or not events_path.is_file():
              raise SystemExit(1)
          manifest = json.loads(manifest_path.read_text())
          rows = [json.loads(line) for line in events_path.read_text().splitlines() if line.strip()]
          tokens = {str(row.get('token')) for row in rows}
          directions = {str(row.get('direction')) for row in rows}
          pass_checks = result.get('pass_checks', {})
          checks = [
              result.get("status") == "PASS",
              isinstance(pass_checks, dict) and bool(pass_checks) and all(value is True for value in pass_checks.values()),
              result.get("source_schema_id") == expected_schema,
              result.get("source_correction_id") == expected_correction,
              manifest.get("source_schema_id") == expected_schema,
              manifest.get("source_correction_id") == expected_correction,
              result.get("event_semantics", {}).get("ordinary_usdt_transfer_excluded") is True,
              manifest.get("event_semantics", {}).get("ordinary_usdt_transfer_excluded") is True,
              int(result.get("event_count", 0)) >= 120,
              len(result.get("months_with_events", [])) >= 24,
              int(result.get("token_counts", {}).get("USDT", 0)) > 0,
              int(result.get("token_counts", {}).get("USDC", 0)) > 0,
              sorted(result.get("distinct_tokens", [])) == ["USDC", "USDT"],
              tokens == {"USDC", "USDT"},
              directions.issubset({"MINT", "BURN"}) and bool(directions),
              hashlib.sha256(events_path.read_bytes()).hexdigest() == manifest.get("events_sha256"),
              any(download_root.rglob("CORRECTION_010_USDT_ISSUE_REDEEM_EVENT_SCHEMA_BEFORE_OUTCOME.json")),
              any(download_root.rglob("CORRECTION_011_BLOCKSCOUT_NULL_TOPIC_PADDING_BEFORE_OUTCOME.json")),
          ]
          if not all(checks):
              raise SystemExit(1)
          print(json.dumps({
              "status": "PASS_CURRENT_HEAD_CORRECTED_SCHEMA_BOUND_SOURCE",
              "event_count": result.get("event_count"),
              "months_with_events": len(result.get("months_with_events", [])),
              "token_counts": result.get("token_counts"),
              "source_schema_id": expected_schema,
          }, sort_keys=True))
          PY
                then
                  cp -a "$(dirname "$result")/." "$out/source/"
                  echo "$run_id" > "$out/source/PARENT_RUN_ID.txt"
                  echo "$parent_head" > "$out/source/PARENT_HEAD_SHA.txt"
                  selected=1
                  break 2
                fi
                status=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status","UNKNOWN"))' "$result" 2>/dev/null || echo UNREADABLE)
                printf '%s\t%s\t%s\n' "$run_id" "$status" "$result" >> "$out/source/REJECTED_SOURCE_RESULTS.tsv"
              done < <(find /tmp/source-download -type f -name SOURCE_GATE_RESULT.json | sort)
            done
            if [ "$selected" = 1 ]; then break; fi
            echo "current-head corrected schema-bound source PASS not yet available: attempt $attempt" >&2
            sleep 60
          done
          if [ "$selected" != 1 ]; then
            python - "$parent_head" <<'PY'
          import json
          import sys
          from pathlib import Path
          out=Path('research_runs/ml_stablecoin_issuance_economic_20260726')
          payload={
            'schema_version':1,
            'claim_id':'CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001',
            'status':'NO_CURRENT_HEAD_CORRECTED_SCHEMA_BOUND_PASS_SOURCE_ARTIFACT',
            'expected_parent_head_sha':sys.argv[1],
            'market_outcome_opened':False,
            'model_fit':False,
            'official_2024h1_opened':False,
            'orders_submitted':False,
          }
          (out/'RESULT.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          else
            events=$(find "$out/source" -type f -name EVENTS.jsonl | head -n 1)
            test -n "$events"
            echo "events=$events" >> "$GITHUB_OUTPUT"
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run frozen pre-2024 model and account screen
        if: steps.source.outputs.authorized == 'true'
        shell: bash
        run: |
          set -u
          root=research/ml_stablecoin_issuance_economic_20260726
          out=research_runs/ml_stablecoin_issuance_economic_20260726
          mkdir -p "$out/economic" "$RUNNER_TEMP/stablecoin-market"
          set +e
          PYTHONPATH="$root" python "$root/run.py" run \
            --events "${{ steps.source.outputs.events }}" \
            --market-cache "$RUNNER_TEMP/stablecoin-market" \
            --output "$out/economic" 2>&1 | tee "$out/economic/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$out/economic/RUN_EXIT_CODE.txt"
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then exit "$rc"; fi
          test -f "$out/economic/RESULT.json"
          python -m json.tool "$out/economic/RESULT.json" >/dev/null
      - name: Enforce authority and sequential decision
        if: always()
        run: |
          set -euo pipefail
          out=research_runs/ml_stablecoin_issuance_economic_20260726
          if [ -f "$out/economic/RESULT.json" ]; then
            result="$out/economic/RESULT.json"
          else
            result="$out/RESULT.json"
          fi
          python - <<'PY' "$result"
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert r['orders_submitted'] is False
          assert r.get('official_2024h1_opened',False) is False
          if r['status']=='PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1':
              assert r['development_gate']['all'] is True
              assert r['risk_search']['selected'] is not None
              print('IMMEDIATE_NEXT_STAGE=OFFICIAL_2024H1')
          else:
              print('IMMEDIATE_NEXT_STAGE=CHANGE_ALPHA_OR_CLOSE_SOURCE')
          print(json.dumps({'status':r['status'],'official_2024h1_opened':r.get('official_2024h1_opened',False)},sort_keys=True))
          PY
      - name: Freeze immutable evidence
        if: always()
        run: |
          set -euo pipefail
          root=research/ml_stablecoin_issuance_economic_20260726
          out=research_runs/ml_stablecoin_issuance_economic_20260726
          mkdir -p "$out/inputs"
          cp "$root"/{WORK_CLAIM.json,README.md,BUNDLE_MANIFEST.json,reconstruct.py,run.py.gz.b64.part00,run.py.gz.b64.part01,run.py.gz.b64.part02,run.py.gz.b64.part03,test_run.py.gz.b64.part00,EXECUTION_CORRECTION_001_ACCEPT_MACOS_SOURCE_ARTIFACT_BEFORE_OUTCOME.json,EXECUTION_CORRECTION_002_NONBLOCKING_PROJECT_VALIDATOR_BEFORE_OUTCOME.json,EXECUTION_CORRECTION_003_ACCEPT_LINUX_SOURCE_ARTIFACT_BEFORE_OUTCOME.json,EXECUTION_CORRECTION_004_REQUIRE_CORRECTED_SOURCE_SCHEMA_BEFORE_OUTCOME.json,EXECUTION_CORRECTION_005_REQUIRE_CURRENT_PARENT_HEAD_BEFORE_OUTCOME.json} "$out/inputs/"
          cp "$RUNNER_TEMP/stablecoin-validation"/* "$out/inputs/" 2>/dev/null || true
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-economic-r15-${{ github.sha }}
          path: research_runs/ml_stablecoin_issuance_economic_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
