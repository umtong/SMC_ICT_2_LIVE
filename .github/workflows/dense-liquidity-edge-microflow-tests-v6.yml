name: Dense liquidity-edge microflow semantic tests v6

on:
  push:
    branches:
      - agent/r37-dense-liquidity-edge-microflow-001
    paths:
      - research/dense_liquidity_edge_microflow/RUN_TESTS_V6
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r37-dense-liquidity-edge-microflow-001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pyarrow==18.1.0 scikit-learn==1.5.2 requests==2.32.3 pytest==8.3.4
      - run: |
          python -m py_compile research/dense_liquidity_edge_microflow/*.py
          pytest -q tests/test_dense_liquidity_edge_microflow_v5.py
      - name: Commit passing marker
        run: |
          printf 'passed\n' > research/dense_liquidity_edge_microflow/TESTS_V5_PASS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dense_liquidity_edge_microflow/TESTS_V5_PASS
          git commit -m 'Record dense microflow semantic test pass'
          git push origin HEAD:agent/r37-dense-liquidity-edge-microflow-001
