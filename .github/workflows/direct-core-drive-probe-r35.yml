name: Probe canonical Drive transport r35

on:
  push:
    branches:
      - agent/r35-direct-utility-first-minute-acceptance-001
    paths:
      - research/triggers/direct-core-drive-probe-r35/**

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Download one registered canonical ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/canonical
          python -m pip install --quiet gdown==5.2.0
          gdown --id 1kzyUwgZfWNlZwIXGIgAKQhFHZmzlVHlM -O /tmp/canonical/BTC2021.zip
          echo '7b54adac09cb9aadb9208288f23167f154e40fe430da1be85794a38bf401e3ca  /tmp/canonical/BTC2021.zip' | sha256sum -c -
          unzip -tq /tmp/canonical/BTC2021.zip
          python - <<'PY'
          import json
          from pathlib import Path
          Path('research/direct_utility_first_minute_acceptance').mkdir(parents=True,exist_ok=True)
          Path('research/direct_utility_first_minute_acceptance/DRIVE_PROBE.json').write_text(json.dumps({
            'status':'PASS','dataset':'DS-BYBIT-LINEAR-BTCUSDT-PRE_2024_2021-CANONICAL-V1',
            'sha256':'7b54adac09cb9aadb9208288f23167f154e40fe430da1be85794a38bf401e3ca',
            'orders_submitted':False
          },indent=2)+'\n')
          PY
      - name: Commit probe status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/direct_utility_first_minute_acceptance/DRIVE_PROBE.json
          git commit -m 'research: record canonical Drive transport probe'
          git push origin HEAD:${GITHUB_REF_NAME}
