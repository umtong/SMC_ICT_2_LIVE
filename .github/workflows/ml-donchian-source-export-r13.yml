name: ML Donchian source-only export

on:
  push:
    branches:
      - agent/r13-ml-donchian-structural-001
    paths:
      - ".github/workflows/ml-donchian-source-export-r13.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ml-donchian-source-export-r13.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-donchian-source-export-r13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct immutable scientific source only
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_donchian_structural_20260726
          out=research_runs/ml_donchian_structural_20260726/source_only
          mkdir -p "$out"
          python "$root/reconstruct.py" | tee "$out/RECONSTRUCT.log"
          python -m py_compile "$root/run.py" "$root/test_run.py"
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          root=Path('research/ml_donchian_structural_20260726')
          out=Path('research_runs/ml_donchian_structural_20260726/source_only')
          source=(root/'run.py').read_text(encoding='utf-8')
          literals=sorted(set(re.findall(r'20(?:2[1-9]|3[0-9])(?:-[0-9]{2}(?:-[0-9]{2})?)?', source)))
          lines=[]
          for index,line in enumerate(source.splitlines(),1):
              if any(token in line for token in ('2023','2024','2025','2026','OFFICIAL','official','DEVELOP','develop')):
                  lines.append(f'{index}: {line}')
          payload={
              'claim_id':'CLM-20260726-2110-ML-DONCHIAN-STRUCTURAL-001',
              'market_rows_opened':False,
              'model_fit':False,
              'pnl_computed':False,
              'orders_submitted':False,
              'run_py_sha256':hashlib.sha256((root/'run.py').read_bytes()).hexdigest(),
              'date_literals':literals,
          }
          (out/'SOURCE_ONLY_ATTESTATION.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (out/'DATE_LITERAL_SCAN.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          cp "$root/run.py" "$root/test_run.py" "$out/"
          sha256sum "$out"/* > "$out/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ml-donchian-source-only-${{ github.sha }}
          path: research_runs/ml_donchian_structural_20260726/source_only
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
