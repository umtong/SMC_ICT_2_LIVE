name: Export aligned-continuation authority for rapid week diagnosis

on:
  push:
    branches: [agent/export-aligned-continuation-source-20260805]
    paths:
      - '.github/workflows/export-aligned-continuation-source-20260805.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct exact source
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin agent/absorption-flow-benchmark-20260725
          git archive FETCH_HEAD research/absorption_flow_benchmark_v1 | tar -x
          root=research/absorption_flow_benchmark_v1
          python "$root/reconstruct.py"
          python -m py_compile "$root/absorption_flow_benchmark.py"
          test "$(sha256sum "$root/absorption_flow_benchmark.py" | awk '{print $1}')" = e9ce4e211e060d74cfb43759bb6afb69616cc8b12fa66aa6ad317ceac01d56b8
      - uses: actions/upload-artifact@v4
        with:
          name: aligned-continuation-authority-${{ github.run_id }}
          path: |
            research/absorption_flow_benchmark_v1/absorption_flow_benchmark.py
            research/absorption_flow_benchmark_v1/PREREGISTRATION.md
            research/absorption_flow_benchmark_v1/AMENDMENT_001_CAUSAL_DOLLAR_BAR_PIVOT.md
            research/absorption_flow_benchmark_v1/DATA_MANIFEST.json
            research/absorption_flow_benchmark_v1/TRANSPORT_MANIFEST.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
