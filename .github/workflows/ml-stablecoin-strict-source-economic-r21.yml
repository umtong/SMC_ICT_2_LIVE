name: ML stablecoin strict V3 source-economic decision

on:
  push:
    branches:
      - agent/r21-stablecoin-strict-source-economic-001
    paths:
      - '.github/workflows/ml-stablecoin-strict-source-economic-r21.yml'
      - 'research/execution/stablecoin_strict_visible_20260727/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-stablecoin-strict-source-economic-r21.yml'
      - 'research/execution/stablecoin_strict_visible_20260727/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stablecoin-strict-source-economic-authority
  cancel-in-progress: true

jobs:
  source-economic-decision:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      SOURCE_SHA: 7bdf54c93607d6d71e8e9f35b66fd9c2c464e637
      SOURCE_EXEC_SHA: 05318f5337279a7d0c0e4d57ef3454555378982b
      ECONOMIC_SHA: b7f67a4e89c731b1d322a6e0ace86f41f32b7bc8
      STRICT_SHA: 209a0fbe6e2f61d2c58b3eb7910b8c0c139cd46c
      SOURCE_ROOT: research/ml_stablecoin_issuance_20260726
      SOURCE_EXEC_ROOT: research/execution/stablecoin_pinned_visible_20260727
      ECON_ROOT: research/ml_stablecoin_issuance_economic_20260726
      STRICT_ROOT: sourcefix/ml_stablecoin_causal_guard_20260726
      AUTH_ROOT: research/execution/stablecoin_strict_visible_20260727
      OUT_ROOT: research_runs/stablecoin_strict_visible_20260727
      MARKET_CACHE: ${{ runner.temp }}/stablecoin-market-strict-v3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            requests==2.32.4 pytest==8.3.5 \
            numpy==2.1.3 pandas==2.2.3 scikit-learn==1.6.1 pyarrow==18.1.0

      - name: Materialize exact source, economic base and strict guard commits
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git archive "$SOURCE_SHA" "$SOURCE_ROOT" | tar -x

          git fetch --no-tags --depth=1 origin "$SOURCE_EXEC_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_EXEC_SHA"
          git archive "$SOURCE_EXEC_SHA" "$SOURCE_EXEC_ROOT/run_source.py" | tar -x

          git fetch --no-tags --depth=1 origin "$ECONOMIC_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$ECONOMIC_SHA"
          git archive "$ECONOMIC_SHA" "$ECON_ROOT" | tar -x

          git fetch --no-tags --depth=1 origin "$STRICT_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$STRICT_SHA"
          git archive "$STRICT_SHA" "$STRICT_ROOT" | tar -x

          python -m json.tool "$AUTH_ROOT/EXECUTION_AUTHORITY.json" >/dev/null
          python -m json.tool "$STRICT_ROOT/CORRECTION_002_PREENTRY_INFORMATION_BOUNDARY_BEFORE_OUTCOME.json" >/dev/null

      - name: Validate source semantics and strict pre-entry causal invariants
        run: |
          set -euo pipefail
          mkdir -p "$OUT_ROOT/source"

          python -m py_compile \
            "$SOURCE_ROOT"/source_gate*.py \
            "$SOURCE_ROOT/test_source_gate.py" \
            "$SOURCE_EXEC_ROOT/run_source.py"
          PYTHONPATH="$SOURCE_ROOT:$SOURCE_EXEC_ROOT" \
            pytest -q "$SOURCE_ROOT/test_source_gate.py" \
            2>&1 | tee "$OUT_ROOT/source/PYTEST.log"
          PYTHONPATH="$SOURCE_ROOT:$SOURCE_EXEC_ROOT" \
            python "$SOURCE_ROOT/source_gate_blockscout_authoritative.py" --self-test \
            2>&1 | tee "$OUT_ROOT/source/AUTHORITY_SELF_TEST.log"
          PYTHONPATH="$SOURCE_ROOT:$SOURCE_EXEC_ROOT" \
            python "$SOURCE_EXEC_ROOT/run_source.py" --self-test \
            2>&1 | tee "$OUT_ROOT/source/BATCH_SELF_TEST.log"

          python "$ECON_ROOT/reconstruct.py"
          python -m py_compile \
            "$ECON_ROOT/run.py" "$ECON_ROOT/run_causal.py" \
            "$ECON_ROOT/test_run.py" "$ECON_ROOT/test_run_causal.py" \
            "$ECON_ROOT/reconstruct.py" \
            "$STRICT_ROOT/strict_guard.py" "$STRICT_ROOT/causal_guard.py" \
            "$STRICT_ROOT/test_causal_guard.py"
          PYTHONPATH="$ECON_ROOT:$STRICT_ROOT" pytest -q \
            "$ECON_ROOT/test_run.py" \
            "$ECON_ROOT/test_run_causal.py" \
            "$STRICT_ROOT/test_causal_guard.py" \
            2>&1 | tee "$OUT_ROOT/STRICT_PYTEST.log"
          PYTHONPATH="$ECON_ROOT:$STRICT_ROOT" \
            python "$STRICT_ROOT/causal_guard.py" self-test \
            2>&1 | tee "$OUT_ROOT/STRICT_SELF_TEST.log"

      - name: Run complete corrected 2021-2023 source gate
        id: source
        run: |
          set +e
          mkdir -p "$OUT_ROOT/source"
          PYTHONPATH="$SOURCE_ROOT:$SOURCE_EXEC_ROOT" \
            python "$SOURCE_EXEC_ROOT/run_source.py" \
            --output "$OUT_ROOT/source" \
            2>&1 | tee "$OUT_ROOT/source/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$OUT_ROOT/source/RUN_EXIT_CODE.txt"
          if [[ ! -f "$OUT_ROOT/source/SOURCE_GATE_RESULT.json" ]]; then
            python "$SOURCE_ROOT/write_transport_failure.py" \
              --output "$OUT_ROOT/source" \
              --transport TRANSPORT-20260727-ML-STABLECOIN-STRICT-V3-020 \
              --exit-code "$rc"
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['OUT_ROOT']) / 'source'
          result = json.loads((root / 'SOURCE_GATE_RESULT.json').read_text())
          assert result['claim_id'] == 'CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert result['status'] in {
              'PASS',
              'FAIL_BELOW_SOURCE_DENSITY_OR_COVERAGE',
              'SOURCE_UNAVAILABLE_OR_TRANSPORT_FAILURE',
          }
          assert result['market_outcome_opened'] is False
          assert result['model_fit'] is False
          assert result['trade_or_pnl_opened'] is False
          assert result['official_2024_2026_opened'] is False
          assert result['orders_submitted'] is False
          authorized = result['status'] == 'PASS'
          if authorized:
              assert int(result['event_count']) >= 120
              assert len(result['months_with_events']) >= 24
              assert sorted(result['distinct_tokens']) == ['USDC', 'USDT']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"authorized={'true' if authorized else 'false'}\n")
          print(json.dumps({
              'status': result['status'],
              'events': result.get('event_count'),
              'months': len(result.get('months_with_events', [])),
              'tokens': result.get('distinct_tokens'),
          }, sort_keys=True))
          PY

      - uses: actions/cache@v4
        if: steps.source.outputs.authorized == 'true'
        with:
          path: ${{ env.MARKET_CACHE }}
          key: stablecoin-market-2020-12-2023-12-strict-v3

      - name: Run strict causal V3 pre-2024 economic screen immediately
        if: steps.source.outputs.authorized == 'true'
        run: |
          set -u
          mkdir -p "$OUT_ROOT/economic" "$MARKET_CACHE"
          set +e
          PYTHONPATH="$ECON_ROOT:$STRICT_ROOT" \
            python "$STRICT_ROOT/causal_guard.py" run \
            --events "$OUT_ROOT/source/EVENTS.jsonl" \
            --market-cache "$MARKET_CACHE" \
            --output "$OUT_ROOT/economic" \
            2>&1 | tee "$OUT_ROOT/economic/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$OUT_ROOT/economic/RUN_EXIT_CODE.txt"
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then
            exit "$rc"
          fi
          test -f "$OUT_ROOT/economic/RESULT.json"
          test -f "$OUT_ROOT/economic/FULL_RESULT.json"

      - name: Enforce strict causal and sequential authority
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['OUT_ROOT'])
          source_path = root / 'source' / 'SOURCE_GATE_RESULT.json'
          assert source_path.is_file(), 'source gate result missing'
          source = json.loads(source_path.read_text())
          if source['status'] != 'PASS':
              print(json.dumps({
                  'source': source['status'],
                  'economic': 'NOT_OPENED',
                  'next': 'CHANGE_ALPHA_OR_REPAIR_TRANSPORT_ONLY',
              }, sort_keys=True))
              raise SystemExit(0)

          result = json.loads((root / 'economic' / 'RESULT.json').read_text())
          full = json.loads((root / 'economic' / 'FULL_RESULT.json').read_text())
          assert result['claim_id'] == 'CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert result['engine'] == 'ML_STABLECOIN_ISSUANCE_FIRST_PASSAGE_STRICT_CAUSAL_V3'
          guard = result['strict_causal_guard']
          assert guard['correction_id'] == 'CORRECTION-20260727-ML-STABLECOIN-PREENTRY-INFORMATION-BOUNDARY-002'
          assert guard['source_decision_second_respected'] is True
          assert guard['latest_completed_bar_cutoff_enforced'] is True
          assert guard['decision_reference_price_pre_entry'] is True
          assert guard['future_entry_open_used_for_model_or_action'] is False
          assert guard['entry_open_used_for_realized_execution_only'] is True
          assert guard['stage_boundary_positions_marked_not_closed'] is True
          assert guard['fatal_validity_violation'] is False
          assert guard['legacy_source_boundary_paths'] == []
          assert guard['forced_boundary_close_true_paths'] == []
          assert result['orders_submitted'] is False
          assert result['official_2024h1_opened'] is False
          assert result['official_2024_2026_opened'] is False
          assert result['status'] in {
              'PRE2024_BELOW_GATE',
              'PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1',
          }

          serialized = json.dumps(full, sort_keys=True)
          assert '"exit_reason": "SOURCE_BOUNDARY"' not in serialized
          next_stage = 'CHANGE_ALPHA'
          if result['status'] == 'PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1':
              selected = result['risk_search']['selected']
              assert result['development_gate']['all'] is True
              assert selected is not None
              assert selected['growth'] > 0
              assert selected['liquidation'] is False
              next_stage = 'OFFICIAL_2024H1_IMMEDIATELY'
          print(json.dumps({
              'source': source['status'],
              'economic': result['status'],
              'strict_guard': guard,
              'selected_risk_path': (
                  result.get('risk_search', {}).get('selected')
                  if result.get('risk_search')
                  else None
              ),
              'next': next_stage,
          }, sort_keys=True))
          PY

      - name: Freeze immutable evidence hashes
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('research_runs/stablecoin_strict_visible_20260727')
          root.mkdir(parents=True, exist_ok=True)
          rows = []
          for path in sorted(
              item for item in root.rglob('*')
              if item.is_file() and item.name != 'OUTPUT_SHA256SUMS.txt'
          ):
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.as_posix()}\n")
          (root / 'OUTPUT_SHA256SUMS.txt').write_text(''.join(rows), encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-strict-v3-visible-${{ github.run_id }}
          path: research_runs/stablecoin_strict_visible_20260727
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
