name: YT Trinity complete native-caption corpus

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - research/yt_trinity_ml/harvest_transcribeyoutube_full.py
      - .github/workflows/yt-trinity-transcribeyoutube-retry.yml
      - control/yt-trinity-transcribeyoutube-full-trigger.json

permissions:
  contents: write

concurrency:
  group: yt-trinity-complete-native-caption-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  harvest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bounded dependency and validate parser
        run: |
          python -m pip install -q --disable-pip-version-check "requests==2.32.4"
          python -m py_compile \
            research/yt_trinity_ml/harvest_transcribeyoutube_full.py \
            research/yt_trinity_ml/build_concept_index.py \
            research/yt_trinity_ml/extract_rule_ontology.py
          python research/yt_trinity_ml/harvest_transcribeyoutube_full.py --self-test
      - name: Harvest all 196 inventory items sequentially below provider rate limit
        continue-on-error: true
        run: |
          mkdir -p artifact/yt-trinity-complete-native-caption
          python research/yt_trinity_ml/harvest_transcribeyoutube_full.py \
            --inventory research/yt_trinity_ml/PUBLIC_VIDEO_INVENTORY_UNION.jsonl \
            --inventory-manifest research/yt_trinity_ml/PUBLIC_VIDEO_INVENTORY_UNION_MANIFEST.json \
            --output artifact/yt-trinity-complete-native-caption \
            --max-attempts 3 \
            --checkpoint-every 10 \
            2>&1 | tee artifact/HARVEST_STDOUT.log
      - name: Build channel-attributed concept and rule evidence
        if: always()
        run: |
          root=artifact/yt-trinity-complete-native-caption
          if [[ -f "$root/videos.jsonl" ]]; then
            python research/yt_trinity_ml/build_concept_index.py \
              --corpus "$root" \
              2>&1 | tee artifact/CONCEPT_INDEX_STDOUT.log
            python research/yt_trinity_ml/extract_rule_ontology.py \
              --corpus "$root" \
              2>&1 | tee artifact/RULE_ONTOLOGY_STDOUT.log
          fi
          python -m pip freeze | LC_ALL=C sort > "$root/DEPENDENCIES.txt"
          (
            cd "$root"
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
      - name: Upload immutable complete-corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-complete-native-caption-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
      - name: Write compact result pointer
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('artifact/yt-trinity-complete-native-caption')
          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8')) if manifest_path.exists() else None
          raw = manifest_path.read_bytes() if manifest_path.exists() else b''
          payload = {
              'schema_version': 1,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'workflow': 'YT Trinity complete native-caption corpus',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'source_sha': os.environ['GITHUB_SHA'],
              'artifact_name': f"yt-trinity-complete-native-caption-{os.environ['GITHUB_SHA']}",
              'manifest_sha256': hashlib.sha256(raw).hexdigest() if raw else None,
              'manifest': manifest,
              'concept_index_present': (root / 'concept_index.json').exists(),
              'rule_ontology_present': (root / 'rule_ontology_candidates.json').exists(),
          }
          Path('research/yt_trinity_ml/FULL_NATIVE_CAPTION_CORPUS_POINTER.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Persist corpus pointer without retrigger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/FULL_NATIVE_CAPTION_CORPUS_POINTER.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record complete YT Trinity native-caption corpus ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Enforce complete corpus gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifact/yt-trinity-complete-native-caption')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['inventory_count'] == 196, manifest
          assert manifest['completed_count'] == 196, manifest
          assert manifest['caption_classification_complete'] is True, manifest
          assert manifest['positive_control_passed'] is True, manifest
          assert manifest['decision'] == 'PASS_COMPLETE', manifest
          assert (root / 'rule_ontology_candidates.json').exists()
          print('complete native-caption corpus: PASS_COMPLETE')
          PY
