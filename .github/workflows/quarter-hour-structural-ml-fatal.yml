name: Quarter-hour structural ML fatal screen

on:
  push:
    branches:
      - agent/r19-ml-qhour-structural-001
    paths:
      - "research/quarter_hour_orderflow_20260726/**"
      - ".github/workflows/quarter-hour-structural-ml-fatal.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/quarter_hour_orderflow_20260726/**"
      - ".github/workflows/quarter-hour-structural-ml-fatal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qhour-structural-ml-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fatal-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scikit-learn==1.6.1" \
            "requests==2.32.4" \
            "pytest==8.3.4"

      - name: Verify frozen code and tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/quarter_hour_orderflow_20260726
          python -m py_compile "$root/source.py" "$root/run.py" "$root/test_run.py"
          (cd "$root" && PYTHONPATH=. pytest -q)
          PYTHONPATH="$root" python "$root/run.py" \
            --self-test \
            --output research_runs/quarter_hour_orderflow_20260726/self_test \
            --cache "$RUNNER_TEMP/qhour-cache"
          python scripts/validate_project.py
          python -m json.tool "$root/preregistration.json" >/dev/null

      - name: Execute frozen pre-2024 fatal screen
        shell: bash
        run: |
          set +e
          root=research/quarter_hour_orderflow_20260726
          out=research_runs/quarter_hour_orderflow_20260726/fatal
          mkdir -p "$out"
          PYTHONPATH="$root" python "$root/run.py" \
            --output "$out" \
            --cache "$RUNNER_TEMP/qhour-cache" \
            2>&1 | tee "$out/run.log"
          echo ${PIPESTATUS[0]} > "$out/RUN_EXIT.txt"
          exit 0

      - name: Record immutable input and output checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/quarter_hour_orderflow_20260726
          out=research_runs/quarter_hour_orderflow_20260726/fatal
          sha256sum \
            "$root/preregistration.json" \
            "$root/README.md" \
            "$root/source.py" \
            "$root/run.py" \
            "$root/test_run.py" \
            > "$out/INPUT_SHA256SUMS.txt"
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quarter-hour-structural-ml-${{ github.sha }}
          path: |
            research_runs/quarter_hour_orderflow_20260726/fatal
            research_runs/quarter_hour_orderflow_20260726/self_test
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce computation and sealing contract
        shell: bash
        run: |
          set -euo pipefail
          out=research_runs/quarter_hour_orderflow_20260726/fatal
          test "$(cat "$out/RUN_EXIT.txt")" = 0
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("research_runs/quarter_hour_orderflow_20260726/fatal/RESULT.json").read_text())
          assert result["source_manifest"]["all_checksums_match"] is True
          assert result["decision_rule"]["elapsed_time_liquidation"] is False
          assert result["decision_rule"]["one_global_slot"] is True
          assert result["opened_2022_secondary_confirmation"] is False
          assert result["opened_2023"] is False
          assert result["opened_2024"] is False
          assert result["opened_2025_2026"] is False
          assert result["credentials_used"] is False
          assert result["orders_submitted"] is False
          print(json.dumps({
              "result_id": result["result_id"],
              "fatal_gate": result["fatal_gate"],
              "confirmation_24bp": {
                  key: value for key, value in result["confirmation_account_paths"]["24"].items()
                  if key != "trades"
              },
          }, indent=2, sort_keys=True))
          PY
