name: Export ALDS canonical core tables

on:
  push:
    branches:
      - agent/r56-scld-core-export-001
    paths:
      - research/alds_csd_delivery_gpt56/export_core_tables.py
      - .github/workflows/alds-core-export-gpt56.yml
  pull_request:
    branches:
      - agent/r56-alds-csd-delivery-001
    paths:
      - research/alds_csd_delivery_gpt56/export_core_tables.py
      - .github/workflows/alds-core-export-gpt56.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: alds-core-export-gpt56-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/alds_csd_delivery_gpt56/requirements.txt

      - name: Install deterministic runtime
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r research/alds_csd_delivery_gpt56/requirements.txt

      - name: Reconstruct verified materializer
        shell: bash
        run: |
          set -euo pipefail
          cd research/alds_csd_delivery_gpt56
          cat materializer_v2_small.b64.part* | base64 -d | gzip -dc > materialize_canonical.py
          python -m py_compile materialize_canonical.py export_core_tables.py

      - name: Restore immutable canonical archive cache
        uses: actions/cache@v4
        with:
          path: artifact/canonical-downloads
          key: alds-csd-btceth-2021-2026-canonical-v1

      - name: Materialize verified canonical shards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python research/alds_csd_delivery_gpt56/materialize_canonical.py \
            --cache artifact/canonical-downloads \
            --root artifact/canonical

      - name: Export compact pandas research cache
        run: |
          python research/alds_csd_delivery_gpt56/export_core_tables.py \
            --root artifact/canonical \
            --out artifact/alds-core-tables

      - name: Upload immutable export
        uses: actions/upload-artifact@v4
        with:
          name: alds-core-tables-gpt56-${{ github.sha }}
          path: artifact/alds-core-tables
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
