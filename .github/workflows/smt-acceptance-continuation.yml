name: SMT acceptance FVG continuation fatal screen

on:
  pull_request:
    branches: [main]
    paths:
      - "research/smt_acceptance_continuation_20260726/**"
      - ".github/workflows/smt-acceptance-continuation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smt-acceptance-continuation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  TZ: UTC
  CACHE: /tmp/smt-acceptance-continuation
  OUT: ${{ github.workspace }}/research_runs/smt_acceptance_continuation_20260726

jobs:
  fatal-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fixed environment
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 requests==2.32.4
      - name: Execute frozen study
        run: bash research/smt_acceptance_continuation_20260726/run_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smt-acceptance-continuation-${{ github.sha }}
          path: research_runs/smt_acceptance_continuation_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
