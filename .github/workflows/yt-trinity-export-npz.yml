name: YT Trinity canonical NPZ export

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-yt-trinity-profit-run-001
    paths:
      - control/yt-trinity-export-npz-trigger.json
      - research/yt_trinity_ml/export_canonical_npz.py
      - .github/workflows/yt-trinity-export-npz.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-export-npz-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CANONICAL_RUN_ID: "30218767426"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install parquet export dependency
        run: python -m pip install -q --disable-pip-version-check "numpy==2.3.5" "pandas==2.2.3" "pyarrow==25.0.0"
      - uses: actions/download-artifact@v4
        with:
          name: canonical-bybit-PRE_2024_2023-BTCUSDT
          path: downloads/PRE_2024_2023/BTCUSDT
          repository: umtong/SMC_ICT_2_LIVE
          run-id: ${{ env.CANONICAL_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: canonical-bybit-PRE_2024_2023-ETHUSDT
          path: downloads/PRE_2024_2023/ETHUSDT
          repository: umtong/SMC_ICT_2_LIVE
          run-id: ${{ env.CANONICAL_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: canonical-bybit-PRE_2024_2023-SOLUSDT
          path: downloads/PRE_2024_2023/SOLUSDT
          repository: umtong/SMC_ICT_2_LIVE
          run-id: ${{ env.CANONICAL_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: canonical-bybit-PRE_2024_2023-XRPUSDT
          path: downloads/PRE_2024_2023/XRPUSDT
          repository: umtong/SMC_ICT_2_LIVE
          run-id: ${{ env.CANONICAL_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: canonical-bybit-2024_H1-BTCUSDT
          path: downloads/2024_H1/BTCUSDT
          repository: umtong/SMC_ICT_2_LIVE
          run-id: ${{ env.CANONICAL_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: canonical-bybit-2024_H1-ETHUSDT
          path: downloads/2024_H1/ETHUSDT
          repository: umtong/SMC_ICT_2_LIVE
          run-id: ${{ env.CANONICAL_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: canonical-bybit-2024_H1-SOLUSDT
          path: downloads/2024_H1/SOLUSDT
          repository: umtong/SMC_ICT_2_LIVE
          run-id: ${{ env.CANONICAL_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: canonical-bybit-2024_H1-XRPUSDT
          path: downloads/2024_H1/XRPUSDT
          repository: umtong/SMC_ICT_2_LIVE
          run-id: ${{ env.CANONICAL_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Materialize portable causal arrays
        run: |
          python research/yt_trinity_ml/export_canonical_npz.py \
            --source downloads \
            --output artifact/canonical-npz
          (
            cd artifact/canonical-npz
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-canonical-npz-${{ github.sha }}
          path: artifact/canonical-npz
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
      - name: Persist compact export pointer
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('artifact/canonical-npz')
          manifest=json.loads((root/'MANIFEST.json').read_text())
          pointer={
            'schema_version': 1,
            'workflow': 'YT Trinity canonical NPZ export',
            'run_id': int(os.environ['GITHUB_RUN_ID']),
            'source_sha': os.environ['GITHUB_SHA'],
            'artifact_name': f"yt-trinity-canonical-npz-{os.environ['GITHUB_SHA']}",
            'manifest': manifest,
          }
          raw=(json.dumps(pointer,ensure_ascii=False,indent=2,sort_keys=True)+'\n').encode()
          pointer['pointer_sha256_before_field']=hashlib.sha256(raw).hexdigest()
          Path('research/yt_trinity_ml/CANONICAL_NPZ_POINTER.json').write_text(json.dumps(pointer,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/yt_trinity_ml/CANONICAL_NPZ_POINTER.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record canonical NPZ export ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
