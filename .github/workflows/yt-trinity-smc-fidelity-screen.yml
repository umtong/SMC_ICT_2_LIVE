name: YT Trinity SMC fidelity economic screen

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - .github/workflows/yt-trinity-smc-fidelity-screen.yml
      - research/yt_trinity_ml/system/corpus_alpha.py
      - research/yt_trinity_ml/run_primary_screen.py
      - research/yt_trinity_ml/INSTRUMENT_RULES.json
      - research/yt_trinity_ml/tests/test_corpus_alpha.py

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-smc-fidelity-screen
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact SMC implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout canonical Bybit loader
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: a2bb231966a517d29495bed7673e4d08ab8e30a9
          path: canonical_repo
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic research dependencies
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q \
            "numpy==2.2.6" "pandas==2.2.3" "scikit-learn==1.6.1" \
            "pyarrow==19.0.1" "requests==2.32.4" "pytest==8.3.5"

      - name: Download immutable corpus and canonical 2023 BTC/ETH shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/corpus inputs/data/PRE_2024_2023/BTCUSDT inputs/data/PRE_2024_2023/ETHUSDT
          fetch_artifact() {
            local id="$1" target="$2"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "${target}"
          }
          fetch_artifact 8637502720 /tmp/corpus.zip
          fetch_artifact 8636781702 /tmp/btc.zip
          fetch_artifact 8636761741 /tmp/eth.zip
          echo "a3f4b69287940536a174e8514ee13392245e8404c9405aa8a8a3be27daf1f41b  /tmp/corpus.zip" | sha256sum --check --strict
          echo "88ac7a4da817746dd165fc46b5be86ada65ecd1273270a3f90ddfaf3ae0df860  /tmp/btc.zip" | sha256sum --check --strict
          echo "7e916dac17e66ea43067fa324d471ed20f1dafed9e19b64e02bebdd19d4cf2b8  /tmp/eth.zip" | sha256sum --check --strict
          unzip -q /tmp/corpus.zip -d inputs/corpus
          unzip -q /tmp/btc.zip -d inputs/data/PRE_2024_2023/BTCUSDT
          unzip -q /tmp/eth.zip -d inputs/data/PRE_2024_2023/ETHUSDT

      - name: Verify corpus, market shards, actual instrument rules and regressions
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          corpus = json.loads(Path('inputs/corpus/yt-trinity-complete-corpus/manifest.json').read_text())
          assert corpus['decision'] == 'PASS_COMPLETE'
          assert corpus['unique_public_video_count'] == 186
          assert corpus['caption_status_counts'] == {'ok': 186}
          rules = json.loads(Path('research/yt_trinity_ml/INSTRUMENT_RULES.json').read_text())
          for symbol in ('BTCUSDT', 'ETHUSDT'):
              row = rules[symbol]
              assert float(row['quantity_step']) > 0
              assert float(row['minimum_quantity']) > 0
              manifest = json.loads(Path(f'inputs/data/PRE_2024_2023/{symbol}/DATASET_MANIFEST.json').read_text())
              assert manifest['status'] == 'PASS_COMPLETE'
              assert manifest['segment'] == 'PRE_2024_2023'
          PY
          python -m py_compile \
            research/yt_trinity_ml/system/corpus_alpha.py \
            research/yt_trinity_ml/run_primary_screen.py
          pytest -q research/yt_trinity_ml/tests \
            --ignore=research/yt_trinity_ml/tests/test_harvest_ytt_api.py

      - name: Execute causal 2023H2 unified SMC account screen
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set +e
          mkdir -p output
          python research/yt_trinity_ml/run_primary_screen.py \
            --repo-root canonical_repo \
            --data-root inputs/data \
            --corpus inputs/corpus/yt-trinity-complete-corpus \
            --instrument-rules research/yt_trinity_ml/INSTRUMENT_RULES.json \
            --output output \
            --segments PRE_2024_2023 \
            --validation-start 2023-07-01T00:00:00Z \
            --validation-end-exclusive 2024-01-01T00:00:00Z \
            2>&1 | tee output/STDOUT.log
          code=${PIPESTATUS[0]}
          echo "$code" > output/EXIT_CODE.txt
          exit 0

      - name: Bind result identity and persist compact pointer
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path
          output = Path('output')
          output.mkdir(exist_ok=True)
          exit_code = int((output / 'EXIT_CODE.txt').read_text().strip()) if (output / 'EXIT_CODE.txt').exists() else 99
          summary_path = output / 'PRIMARY_SCREEN_SUMMARY.json'
          summary = json.loads(summary_path.read_text()) if summary_path.exists() else None
          log = (output / 'STDOUT.log').read_text(errors='replace') if (output / 'STDOUT.log').exists() else ''
          pointer = {
              'schema_version': 2,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'stage': 'PRE2024_UNIFIED_SMC_COARSE_1M_NOT_RANKABLE',
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'exit_code': exit_code,
              'job_status': 'success' if exit_code == 0 else 'execution_failure_not_economic_failure',
              'summary': summary,
              'summary_sha256': hashlib.sha256(summary_path.read_bytes()).hexdigest() if summary_path.exists() else None,
              'stdout_tail': log[-8000:],
              'python': sys.version,
              'platform': platform.platform(),
              'ranking_effect': 'NONE_COARSE_SCREEN_NOT_RANKABLE',
          }
          pointer_path = output / 'SMC_FIDELITY_SCREEN_POINTER.json'
          pointer_path.write_text(json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n')
          destination = Path('research/yt_trinity_ml/SMC_FIDELITY_SCREEN_POINTER.json')
          destination.write_bytes(pointer_path.read_bytes())
          PY
          (
            cd output
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/SMC_FIDELITY_SCREEN_POINTER.json
          if ! git diff --cached --quiet; then
            git commit -m "Record unified SMC implementation-fidelity screen ${GITHUB_RUN_ID}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin agent/r22-yt-trinity-ml-001
              if git push origin HEAD:agent/r22-yt-trinity-ml-001; then break; fi
              sleep $((attempt * 3))
            done
          fi

      - name: Upload immutable screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-smc-fidelity-screen-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Fail only after preserving execution evidence
        if: always()
        run: test "$(cat output/EXIT_CODE.txt 2>/dev/null || echo 99)" = 0
