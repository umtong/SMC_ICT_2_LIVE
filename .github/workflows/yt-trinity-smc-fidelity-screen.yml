name: YT Trinity unified SMC v4 bootstrap and screen

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/yt-trinity-smc-fidelity-screen.yml
      - research/yt_trinity_ml/upgrade_chunks/unified_smc_v4.*
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-smc-fidelity-screen.yml
      - control/yt-trinity-smc-v4-bootstrap-trigger.json

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-unified-smc-v4-bootstrap-screen-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout exact bootstrap source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Decode and verify unified SMC v4 source
        run: |
          set -euo pipefail
          mkdir -p artifact/bootstrap output
          python - <<'PY' 2>&1 | tee artifact/bootstrap/materialize.log
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          chunk_dir = Path('research/yt_trinity_ml/upgrade_chunks')
          chunks = sorted(chunk_dir.glob('unified_smc_v4.*'))
          expected_names = [f'unified_smc_v4.{index:02d}' for index in range(6)]
          assert [path.name for path in chunks] == expected_names, [path.name for path in chunks]
          encoded = ''.join(path.read_text(encoding='utf-8') for path in chunks)
          assert len(encoded) == 42180, len(encoded)
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest() == '337d9fed927d27832b621ac9f19f072cae46d4828242313971a98dcfb28d951e'
          raw = gzip.decompress(base64.b85decode(encoded.encode('ascii')))
          assert hashlib.sha256(raw).hexdigest() == '0e37a5101d112abd1652ffbac4c647c3f902b3d19f46de7a10713c36dce8bccd'
          files = json.loads(raw.decode('utf-8'))
          expected_hashes = {
              'research/yt_trinity_ml/system/corpus_alpha.py': '5bd7f343906672d02fcd792508fe4b9b219388fdf961efea61296c699872c929',
              'research/yt_trinity_ml/system/research_pipeline.py': 'b11942b34067e263c1096e76bdb8f70d8828fc60dc914392dbc27c39499819b7',
              'research/yt_trinity_ml/run_primary_screen.py': 'c4bd76dc24725ef3232fcd8468181593c0032d719074be2aa32e124acc29fc85',
              'research/yt_trinity_ml/tests/test_corpus_alpha.py': '91c184c290b2ce6c5381cfc866c639df699354be791901c70a3c7fd97fafa3d8',
              'research/yt_trinity_ml/SYSTEM_DESIGN.md': '29e4bc00c53c83c47decc255f8723fda3faa5d75c29f539e44bbdd6736a1f716',
              'research/yt_trinity_ml/system_contract.json': '0fbe374c91e8f8d1d987f2035d5b608fe88629dfc6435d1be5cda1c365495d53',
              '.github/workflows/yt-trinity-smc-fidelity-screen.yml': '55d6cc31eb3069aa7191bc44258e074447a85bfd9881624f0a3ef2a04f6762f0',
              '.github/workflows/yt-trinity-source-snapshot.yml': '20e7700694ff9204761379f779e8e347f91d957c5c941cc88117ee26d0e17e2f',
          }
          assert set(files) == set(expected_hashes), sorted(files)
          for relative, content in files.items():
              data = content.encode('utf-8')
              actual = hashlib.sha256(data).hexdigest()
              assert actual == expected_hashes[relative], (relative, actual)
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          print(json.dumps({'materialized_files': sorted(files), 'payload_sha256': hashlib.sha256(raw).hexdigest()}, indent=2))
          PY

      - name: Apply audited instrument-rule checkpoint repair
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('research/yt_trinity_ml/run_primary_screen.py')
          source = path.read_text(encoding='utf-8')
          old = '        symbols=sorted(rules),\n'
          new = '        symbols=sorted(rule.symbol for rule in rules),\n'
          assert source.count(old) == 1, source.count(old)
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          assert actual == '6f0310eedaa6d731fc0da7523e97569aac99c686b41d1c27c96f3644c4cbda83', actual
          print({'run_primary_screen_sha256': actual})
          PY

      - name: Install deterministic research dependencies
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q \
            "numpy==2.2.6" "pandas==2.2.3" "scikit-learn==1.6.1" \
            "pyarrow==19.0.1" "requests==2.32.4" "pytest==8.3.5" "PyYAML==6.0.2"

      - name: Compile and test causal SMC v4 invariants
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -euo pipefail
          {
            python -m py_compile \
              research/yt_trinity_ml/system/*.py \
              research/yt_trinity_ml/run_primary_screen.py \
              research/yt_trinity_ml/run_research.py
            python -m json.tool research/yt_trinity_ml/system_contract.json >/dev/null
            python - <<'PY'
          import yaml
          for path in (
              '.github/workflows/yt-trinity-smc-fidelity-screen.yml',
              '.github/workflows/yt-trinity-source-snapshot.yml',
          ):
              with open(path, encoding='utf-8') as handle:
                  assert isinstance(yaml.safe_load(handle), dict), path
          PY
            pytest -q research/yt_trinity_ml/tests \
              --ignore=research/yt_trinity_ml/tests/test_harvest_ytt_api.py
          } 2>&1 | tee artifact/bootstrap/test.log

      - name: Persist tested unified SMC v4 source
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          rm -f research/yt_trinity_ml/upgrade_chunks/unified_smc_v4.*
          rm -f control/yt-trinity-unified-smc-v4-materialize-trigger.json
          rm -f control/yt-trinity-smc-v4-bootstrap-trigger.json
          rm -f .github/workflows/yt-trinity-unified-smc-v4-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/yt_trinity_ml/system/corpus_alpha.py \
            research/yt_trinity_ml/system/research_pipeline.py \
            research/yt_trinity_ml/run_primary_screen.py \
            research/yt_trinity_ml/tests/test_corpus_alpha.py \
            research/yt_trinity_ml/SYSTEM_DESIGN.md \
            research/yt_trinity_ml/system_contract.json \
            .github/workflows/yt-trinity-smc-fidelity-screen.yml \
            .github/workflows/yt-trinity-source-snapshot.yml
          git add -u research/yt_trinity_ml/upgrade_chunks .github/workflows/yt-trinity-unified-smc-v4-materialize.yml || true
          git add -u control/yt-trinity-unified-smc-v4-materialize-trigger.json control/yt-trinity-smc-v4-bootstrap-trigger.json || true
          git commit -m 'Add causal liquidity generations and checkpointed SMC screen'
          TARGET_BRANCH='agent/r22-yt-trinity-ml-001'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin "${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              break
            fi
            if [[ "${attempt}" == 6 ]]; then exit 1; fi
            sleep $((attempt * 3))
          done
          git rev-parse HEAD | tee artifact/bootstrap/materialized_commit.txt

      - name: Checkout canonical Bybit loader
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: a2bb231966a517d29495bed7673e4d08ab8e30a9
          path: canonical_repo
          fetch-depth: 1

      - name: Download immutable corpus and canonical 2023 BTC/ETH shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/corpus inputs/data/PRE_2024_2023/BTCUSDT inputs/data/PRE_2024_2023/ETHUSDT
          fetch_artifact() {
            local id="$1" expected="$2" target="$3"
            local actual
            actual="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" \
              | python -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
            [[ "${actual}" == "${expected}" ]]
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "${target}"
          }
          fetch_artifact 8637502720 sha256:a3f4b69287940536a174e8514ee13392245e8404c9405aa8a8a3be27daf1f41b /tmp/corpus.zip
          fetch_artifact 8636781702 sha256:88ac7a4da817746dd165fc46b5be86ada65ecd1273270a3f90ddfaf3ae0df860 /tmp/btc.zip
          fetch_artifact 8636761741 sha256:7e916dac17e66ea43067fa324d471ed20f1dafed9e19b64e02bebdd19d4cf2b8 /tmp/eth.zip
          unzip -q /tmp/corpus.zip -d inputs/corpus
          unzip -q /tmp/btc.zip -d inputs/data/PRE_2024_2023/BTCUSDT
          unzip -q /tmp/eth.zip -d inputs/data/PRE_2024_2023/ETHUSDT

      - name: Verify bound corpus, data and instrument rules
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee artifact/bootstrap/input_verify.log
          import json
          from pathlib import Path
          corpus = json.loads(Path('inputs/corpus/yt-trinity-complete-corpus/manifest.json').read_text())
          assert corpus['decision'] == 'PASS_COMPLETE'
          assert corpus['inventory_count'] == 186
          assert corpus['transcript_video_count'] == 186
          assert corpus['status_counts'] == {'ok': 186}
          rules = json.loads(Path('research/yt_trinity_ml/INSTRUMENT_RULES.json').read_text())
          for symbol in ('BTCUSDT', 'ETHUSDT'):
              assert float(rules[symbol]['quantity_step']) > 0
              assert float(rules[symbol]['minimum_quantity']) > 0
              manifest = json.loads(Path(f'inputs/data/PRE_2024_2023/{symbol}/DATASET_MANIFEST.json').read_text())
              assert manifest['physical_segment'] == 'PRE_2024_2023'
              assert manifest['start'] == '2023-01-01T00:00:00Z'
              assert manifest['end_exclusive'] == '2024-01-01T00:00:00Z'
              for name in ('trade_price_1m','mark_price_1m','index_price_1m','premium_index_1m','open_interest_5m','account_ratio_5m'):
                  assert int(manifest['coverage'][name]['missing_rows']) == 0, (symbol, name)
          PY

      - name: Execute checkpointed causal 2023H2 unified SMC account screen
        env:
          PYTHONPATH: research/yt_trinity_ml
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 150m \
            python -u research/yt_trinity_ml/run_primary_screen.py \
              --repo-root canonical_repo \
              --data-root inputs/data \
              --corpus inputs/corpus/yt-trinity-complete-corpus \
              --instrument-rules research/yt_trinity_ml/INSTRUMENT_RULES.json \
              --output output \
              --segments PRE_2024_2023 \
              --validation-start 2023-07-01T00:00:00Z \
              --validation-end-exclusive 2024-01-01T00:00:00Z \
              2>&1 | tee output/STDOUT.log
          code=${PIPESTATUS[0]}
          echo "${code}" > output/EXIT_CODE.txt
          exit 0

      - name: Bind evidence and persist v4 screen pointer
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path
          output = Path('output')
          output.mkdir(exist_ok=True)
          exit_code = int((output / 'EXIT_CODE.txt').read_text().strip()) if (output / 'EXIT_CODE.txt').exists() else 99
          def load(name):
              path = output / name
              return json.loads(path.read_text()) if path.exists() else None
          summary_path = output / 'PRIMARY_SCREEN_SUMMARY.json'
          log_path = output / 'STDOUT.log'
          pointer = {
              'schema_version': 4,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'stage': 'PRE2024_UNIFIED_SMC_V4_COARSE_1M_NOT_RANKABLE',
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'exit_code': exit_code,
              'job_status': 'success' if exit_code == 0 and summary_path.exists() else 'execution_incomplete_not_economic_failure',
              'summary': load('PRIMARY_SCREEN_SUMMARY.json'),
              'summary_sha256': hashlib.sha256(summary_path.read_bytes()).hexdigest() if summary_path.exists() else None,
              'latest_checkpoint': load('IMPLEMENTATION_CHECKPOINT.json'),
              'failure': load('SCREEN_FAILURE.json'),
              'stdout_tail': log_path.read_text(errors='replace')[-12000:] if log_path.exists() else None,
              'payload_sha256': '0e37a5101d112abd1652ffbac4c647c3f902b3d19f46de7a10713c36dce8bccd',
              'test_count': 68,
              'unrelated_alpha_switch_authorized': False,
              'ranking_effect': 'NONE_COARSE_SCREEN_NOT_RANKABLE',
              'python': sys.version,
              'platform': platform.platform(),
          }
          destination = Path('research/yt_trinity_ml/SMC_FIDELITY_SCREEN_POINTER.json')
          destination.write_text(json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n')
          (output / 'SMC_FIDELITY_SCREEN_POINTER.json').write_bytes(destination.read_bytes())
          PY
          (
            cd output
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          if [[ "${GITHUB_EVENT_NAME}" == 'push' ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/yt_trinity_ml/SMC_FIDELITY_SCREEN_POINTER.json
            if ! git diff --cached --quiet; then
              git commit -m "Record unified SMC v4 screen ${GITHUB_RUN_ID}"
              TARGET_BRANCH='agent/r22-yt-trinity-ml-001'
              for attempt in 1 2 3 4 5 6; do
                git pull --rebase origin "${TARGET_BRANCH}"
                if git push origin "HEAD:${TARGET_BRANCH}"; then break; fi
                if [[ "${attempt}" == 6 ]]; then exit 1; fi
                sleep $((attempt * 3))
              done
            fi
          fi

      - name: Upload immutable bootstrap and screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-unified-smc-v4-screen-${{ github.sha }}
          path: |
            artifact/bootstrap
            output
          if-no-files-found: error
          retention-days: 90

      - name: Fail only after preserving evidence
        if: always()
        run: test "$(cat output/EXIT_CODE.txt 2>/dev/null || echo 99)" = 0
