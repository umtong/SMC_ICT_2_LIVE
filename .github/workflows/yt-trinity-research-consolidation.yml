name: YT Trinity final research source consolidation

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/consolidate_research_source.py
      - control/yt-trinity-research-consolidation-trigger.json
      - .github/workflows/yt-trinity-research-consolidation.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-final-research-source-consolidation
  cancel-in-progress: false

jobs:
  consolidate-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Pull every completed concurrent fix before consolidation
        run: git pull --rebase origin agent/r22-yt-trinity-ml-001
      - name: Consolidate missing source invariants and remove materializers
        run: python research/yt_trinity_ml/consolidate_research_source.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile all research code and execute every invariant
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -o pipefail
          mkdir -p artifact/consolidation
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow requests curl-cffi pytest playwright
          {
            python -m py_compile research/yt_trinity_ml/system/*.py
            python -m py_compile research/yt_trinity_ml/*.py
            pytest -q --junitxml=artifact/consolidation/junit.xml research/yt_trinity_ml/tests
          } 2>&1 | tee artifact/consolidation/pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-consolidated-research-${{ github.sha }}
          path: artifact/consolidation
          if-no-files-found: error
          retention-days: 30
      - name: Commit one consolidated research source transition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f research/yt_trinity_ml/consolidate_research_source.py .github/workflows/yt-trinity-research-consolidation.yml
          git commit -m "Consolidate YT Trinity causal research source"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
