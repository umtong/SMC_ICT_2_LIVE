name: OI-flow bundle diagnostic

on:
  push:
    branches:
      - agent/r11-oi-flow-decomposition-001
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Recover missing bundle boundary characters
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/research/oi_flow_decomposition_20260726"
          mkdir -p /tmp/oi
          for name in run_screen.py implementation.b64.part00 implementation.b64.part01 implementation.b64.part02 test_run_screen.py; do
            curl --fail --location --silent --show-error "$base/$name" --output "/tmp/oi/$name"
          done
          wc -c /tmp/oi/*
          sha256sum /tmp/oi/*
          python3 - <<'PY'
          import base64, hashlib, itertools
          from pathlib import Path
          root = Path('/tmp/oi')
          p0 = (root / 'implementation.b64.part00').read_text().strip()
          p1 = (root / 'implementation.b64.part01').read_text().strip()
          p2 = (root / 'implementation.b64.part02').read_text().strip()
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          expected = '24a9b559368326a9b35348a946c6b7c6569c8f42738403794cdecef8a760fee7'
          matches = []
          for x, y in itertools.product(alphabet, repeat=2):
              encoded = p0 + x + p1 + y + p2
              try:
                  payload = base64.b64decode(encoded, validate=True)
              except Exception:
                  continue
              if hashlib.sha256(payload).hexdigest() == expected:
                  matches.append((x, y))
          print('recovered=' + repr(matches))
          assert len(matches) == 1
          PY
