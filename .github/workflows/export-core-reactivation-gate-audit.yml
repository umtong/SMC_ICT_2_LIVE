name: Export exact Core reactivation authority for gate audit

on:
  push:
    branches: [agent/core-reactivation-gate-audit-001]
    paths:
      - '.github/workflows/export-core-reactivation-gate-audit.yml'
      - 'research/core_reactivation_gate_audit/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/export-core-reactivation-gate-audit.yml'
      - 'research/core_reactivation_gate_audit/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Audit and materialize PR676 source bundle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/core_reactivation_authority"
          mkdir -p "$out/carrier" "$out/materialized"
          authority=aa13e82b51c5587ebf6c5d308406d4ff64cf3ed6
          src=research/core_then_protected_reactivation
          git fetch --depth=1 origin "$authority"
          for f in SOURCE_BUNDLE.tar.gz.b64 SOURCE_MANIFEST.json CONTRACT.json RESULT.json RESULT_FULL.json.gz.b64 REPORT.md VALIDATION_ATTESTATION.json; do
            git show "$authority:$src/$f" > "$out/carrier/$f"
          done
          python - <<'PY'
          import base64, gzip, hashlib, json, re, tarfile
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'core_reactivation_authority'
          carrier=root/'carrier'
          manifest=json.loads((carrier/'SOURCE_MANIFEST.json').read_text())
          raw_file=(carrier/'SOURCE_BUNDLE.tar.gz.b64').read_bytes()
          text=raw_file.decode('utf-8-sig',errors='replace')
          compact=''.join(text.split())
          clean=''.join(re.findall(r'[A-Za-z0-9+/=]',compact))
          candidates=[]
          for name,value in [('compact',compact),('clean',clean),('clean_strip_equals',clean.rstrip('='))]:
              for padded_name,padded in [(name,value),(name+'_padded',value+('='*((-len(value))%4)))]:
                  if not padded or any(padded==v for _,v in candidates):
                      continue
                  candidates.append((padded_name,padded))
          attempts=[]; selected=None
          for name,value in candidates:
              attempt={'candidate':name,'chars':len(value),'mod4':len(value)%4}
              try:
                  decoded=base64.b64decode(value,validate=False)
                  attempt['decoded_bytes']=len(decoded)
                  attempt['gzip_sha256']=hashlib.sha256(decoded).hexdigest()
                  attempt['gzip_match']=attempt['gzip_sha256']==manifest['source_bundle_gzip_sha256']
                  if attempt['gzip_match']:
                      selected=(name,decoded)
              except Exception as exc:
                  attempt['error']=f'{type(exc).__name__}: {exc}'
              attempts.append(attempt)
              if selected:
                  break
          audit={
              'authority_commit':'aa13e82b51c5587ebf6c5d308406d4ff64cf3ed6',
              'raw_file_bytes':len(raw_file),
              'raw_file_sha256':hashlib.sha256(raw_file).hexdigest(),
              'manifest_b64_file_sha256':manifest['source_bundle_b64_file_sha256'],
              'compact_chars':len(compact),
              'clean_chars':len(clean),
              'replacement_character_count':text.count('\ufffd'),
              'non_base64_sample':sorted(set(ch for ch in compact if ch not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='))[:50],
              'attempts':attempts,
              'selected':selected[0] if selected else None,
          }
          (root/'CARRIER_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          print(json.dumps(audit,indent=2,sort_keys=True))
          if not selected:
              raise RuntimeError('No carrier candidate matches the declared source bundle gzip SHA')
          gz=selected[1]
          assert len(gz)==manifest['source_bundle_gzip_bytes'],(len(gz),manifest['source_bundle_gzip_bytes'])
          archive=root/'SOURCE_BUNDLE.tar.gz'; archive.write_bytes(gz)
          with tarfile.open(archive,'r:gz') as tf:
              tf.extractall(root/'materialized')
          observed={}
          for p in sorted((root/'materialized').rglob('*')):
              if p.is_file():
                  observed[str(p.relative_to(root/'materialized'))]=hashlib.sha256(p.read_bytes()).hexdigest()
          for filename,expected in manifest['source_files'].items():
              assert observed[filename]==expected,(filename,observed.get(filename),expected)
          rbtext=(carrier/'RESULT_FULL.json.gz.b64').read_text(encoding='utf-8-sig')
          rb64=''.join(re.findall(r'[A-Za-z0-9+/=]',''.join(rbtext.split())))
          rb64 += '='*((-len(rb64))%4)
          full=gzip.decompress(base64.b64decode(rb64,validate=False))
          assert hashlib.sha256(full).hexdigest()==manifest['result_full_raw_sha256']
          (root/'RESULT_FULL.json').write_bytes(full)
          att={
              'authority_commit':'aa13e82b51c5587ebf6c5d308406d4ff64cf3ed6',
              'carrier_candidate':selected[0],
              'source_bundle_sha256':hashlib.sha256(gz).hexdigest(),
              'source_files':observed,
              'result_full_sha256':hashlib.sha256(full).hexdigest(),
              'official_2024_2026_opened':False,
              'orders_submitted':False,
          }
          (root/'EXPORT_ATTESTATION.json').write_text(json.dumps(att,indent=2,sort_keys=True)+'\n')
          PY
          python -m py_compile "$out/materialized/core_then_protected_reactivation.py"
          pytest -q "$out/materialized/test_core_then_protected_reactivation.py"
          find "$out" -maxdepth 3 -type f -printf '%P\n' | sort
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-reactivation-authority-${{ github.run_id }}
          path: ${{ runner.temp }}/core_reactivation_authority
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
