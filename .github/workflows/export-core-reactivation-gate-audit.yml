name: Export exact Core reactivation authority for gate audit

on:
  push:
    branches: [agent/core-reactivation-gate-audit-001]
    paths:
      - '.github/workflows/export-core-reactivation-gate-audit.yml'
      - 'research/core_reactivation_gate_audit/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Materialize exact PR676 source bundle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/core_reactivation_authority"
          mkdir -p "$out/carrier" "$out/materialized"
          authority=aa13e82b51c5587ebf6c5d308406d4ff64cf3ed6
          src=research/core_then_protected_reactivation
          git fetch --depth=1 origin "$authority"
          for f in SOURCE_BUNDLE.tar.gz.b64 SOURCE_MANIFEST.json CONTRACT.json RESULT.json RESULT_FULL.json.gz.b64 REPORT.md VALIDATION_ATTESTATION.json; do
            git show "$authority:$src/$f" > "$out/carrier/$f"
          done
          python - <<'PY'
          import base64, gzip, hashlib, json, tarfile
          from pathlib import Path
          root=Path(__import__('os').environ['RUNNER_TEMP'])/'core_reactivation_authority'
          carrier=root/'carrier'
          manifest=json.loads((carrier/'SOURCE_MANIFEST.json').read_text())
          b64=''.join((carrier/'SOURCE_BUNDLE.tar.gz.b64').read_text(encoding='utf-8-sig').split())
          gz=base64.b64decode(b64,validate=True)
          assert len(gz)==manifest['source_bundle_gzip_bytes'], (len(gz),manifest['source_bundle_gzip_bytes'])
          assert hashlib.sha256(gz).hexdigest()==manifest['source_bundle_gzip_sha256']
          archive=root/'SOURCE_BUNDLE.tar.gz'; archive.write_bytes(gz)
          with tarfile.open(archive,'r:gz') as tf:
              tf.extractall(root/'materialized')
          observed={}
          for p in sorted((root/'materialized').rglob('*')):
              if p.is_file():
                  observed[str(p.relative_to(root/'materialized'))]=hashlib.sha256(p.read_bytes()).hexdigest()
          for name,expected in manifest['source_files'].items():
              assert observed[name]==expected,(name,observed.get(name),expected)
          rb64=''.join((carrier/'RESULT_FULL.json.gz.b64').read_text(encoding='utf-8-sig').split())
          full=gzip.decompress(base64.b64decode(rb64,validate=True))
          assert hashlib.sha256(full).hexdigest()==manifest['result_full_raw_sha256']
          (root/'RESULT_FULL.json').write_bytes(full)
          att={
              'authority_commit':'aa13e82b51c5587ebf6c5d308406d4ff64cf3ed6',
              'source_bundle_sha256':hashlib.sha256(gz).hexdigest(),
              'source_files':observed,
              'result_full_sha256':hashlib.sha256(full).hexdigest(),
              'official_2024_2026_opened':False,
              'orders_submitted':False,
          }
          (root/'EXPORT_ATTESTATION.json').write_text(json.dumps(att,indent=2,sort_keys=True)+'\n')
          PY
          python -m py_compile "$out/materialized/core_then_protected_reactivation.py"
          pytest -q "$out/materialized/test_core_then_protected_reactivation.py"
          find "$out" -maxdepth 3 -type f -printf '%P\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: core-reactivation-authority-${{ github.run_id }}
          path: ${{ runner.temp }}/core_reactivation_authority
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
