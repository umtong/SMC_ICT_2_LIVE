name: Value-reentry passive audit source export

on:
  push:
    branches: [agent/value-reentry-passive-audit-001]
    paths:
      - '.github/workflows/value-reentry-passive-source-export.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/value-reentry-passive-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Recover exact parent source carrier
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 89dc4c3466b6bbc45f427c8743dfe26bd9a0034e
          mkdir -p parent
          git archive 89dc4c3466b6bbc45f427c8743dfe26bd9a0034e research/value_reentry_core | tar -x -C parent
          cd parent/research/value_reentry_core
          python materialize.py
          python -m py_compile materialized/*.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          manifest=json.loads((root/'SOURCE_MANIFEST.json').read_text())
          for item in manifest['files']:
              path=root/'materialized'/item['path']
              assert path.stat().st_size==item['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256']
          print('source verified', len(manifest['files']))
          PY
      - name: Collect immutable source
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp -a parent/research/value_reentry_core/materialized artifact/
          cp parent/research/value_reentry_core/{SOURCE_MANIFEST.json,CONTRACT.json,RESULT.json,REPORT.md} artifact/
          (cd artifact && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: value-reentry-parent-source
          path: artifact
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
