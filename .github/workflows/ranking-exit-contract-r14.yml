name: Ranking state reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - 'control/ranking.json'
      - 'control/current-state.md'
      - 'schemas/ranking.schema.json'
      - 'research/ml_hourweek_pre2024_20260726/**'
      - 'research/results/RES-20260726-ML-HOURWEEK-PRE2024-2024H1-001.json'
      - 'research/execution/stablecoin_pinned_visible_20260727/**'
      - '.github/workflows/ranking-exit-contract-r14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1' 'pytest==8.3.4'
      - name: Validate current ranking state and evidence boundaries
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from jsonschema import validate

          ranking = json.loads(Path('control/ranking.json').read_text())
          schema = json.loads(Path('schemas/ranking.schema.json').read_text())
          state = Path('control/current-state.md').read_text()

          validate(ranking, schema)
          match = re.search(r'(?m)^- revision:\s*(\d+)\s*$', state)
          assert match is not None
          assert ranking['revision'] == int(match.group(1))
          assert 'Rank does not determine research priority.' in state
          assert ranking['ranking_rule']['rank_does_not_determine_work_priority'] is True

          if ranking['status'] == 'ACTIVE':
              first = ranking['first_place']
              rows = ranking['ranked_candidates']
              assert first is not None and first['rank'] == 1
              assert rows and rows[0]['rank'] == 1
              assert first['source_result_id'] == rows[0]['source_result_id']
              metrics = first['metrics']
              assert metrics['target_geometric_daily_growth'] == 0.01
              assert abs(metrics['target_gap'] - (0.01 - metrics['geometric_daily_growth'])) < 1e-12
              assert abs(rows[0]['geometric_daily_growth'] - metrics['geometric_daily_growth']) < 1e-15
              assert abs(rows[0]['target_gap'] - metrics['target_gap']) < 1e-15
              assert [row['rank'] for row in rows] == list(range(1, len(rows) + 1))
              assert [row['target_gap'] for row in rows] == sorted(row['target_gap'] for row in rows)
          else:
              assert ranking['first_place'] is None
              assert ranking['ranked_candidates'] == []

          hourweek = Path('research/results/RES-20260726-ML-HOURWEEK-PRE2024-2024H1-001.json')
          if hourweek.exists():
              result = json.loads(hourweek.read_text())
              assert result['system_frozen_at'] == '2023-12-31T23:59:59Z'
              assert result['official_2024H1']['24bps']['geometric_daily_growth'] < 0
              assert result['official_2024H1']['24bps']['exact_winner_removal']['total_return'] < 0
              assert result['decision'] == 'RETIRE_HOURWEEK_FILTER_AND_SWITCH_ALPHA'
              assert result['2024H2_2026_opened'] is False
              assert result['orders_submitted'] is False

          print(f"RANKING_STATE_RECONCILIATION_PASS revision={ranking['revision']} first={ranking['first_place']['source_result_id'] if ranking['first_place'] else 'none'}")
          PY
      - name: Validate project and repository tests
        run: |
          python scripts/validate_project.py
          python -m pytest -q

  stablecoin-source-economic:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      SOURCE_SHA: 7bdf54c93607d6d71e8e9f35b66fd9c2c464e637
      STRICT_ECONOMIC_SHA: 209a0fbe6e2f61d2c58b3eb7910b8c0c139cd46c
      SOURCE_ROOT: research/ml_stablecoin_issuance_20260726
      ECON_ROOT: research/ml_stablecoin_issuance_economic_20260726
      STRICT_ROOT: sourcefix/ml_stablecoin_causal_guard_20260726
      EXEC_ROOT: research/execution/stablecoin_pinned_visible_20260727
      OUT_ROOT: research_runs/stablecoin_strict_causal_visible_20260727
      SOURCE_OUT: research_runs/stablecoin_strict_causal_visible_20260727/source
      ECON_OUT: research_runs/stablecoin_strict_causal_visible_20260727/economic
      MARKET_CACHE: ${{ runner.temp }}/stablecoin-market

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            requests==2.32.4 pytest==8.3.5 \
            numpy==2.1.3 pandas==2.2.3 scikit-learn==1.6.1 pyarrow==18.1.0

      - name: Materialize exact source and strict causal economic commits
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          rm -rf "$SOURCE_ROOT"
          git archive "$SOURCE_SHA" "$SOURCE_ROOT" | tar -x

          git fetch --no-tags --depth=1 origin "$STRICT_ECONOMIC_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$STRICT_ECONOMIC_SHA"
          rm -rf "$ECON_ROOT" "$STRICT_ROOT"
          git archive "$STRICT_ECONOMIC_SHA" "$ECON_ROOT" "$STRICT_ROOT" | tar -x

          python -m json.tool "$EXEC_ROOT/STRICT_CAUSAL_EXECUTION_CORRECTION.json" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/execution/stablecoin_pinned_visible_20260727/STRICT_CAUSAL_EXECUTION_CORRECTION.json')
          x=json.loads(p.read_text())
          assert x['source_commit']=='7bdf54c93607d6d71e8e9f35b66fd9c2c464e637'
          assert x['strict_economic_commit']=='209a0fbe6e2f61d2c58b3eb7910b8c0c139cd46c'
          assert x['engine']=='ML_STABLECOIN_ISSUANCE_FIRST_PASSAGE_STRICT_CAUSAL_V3'
          assert x['recorded_before_source_decision'] is True
          assert x['recorded_before_market_outcome'] is True
          PY

      - name: Validate corrected source and strict causal economic engines
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_OUT" "$ECON_OUT"
          python -m py_compile \
            "$SOURCE_ROOT"/source_gate*.py \
            "$SOURCE_ROOT/test_source_gate.py" \
            "$EXEC_ROOT/run_source.py"
          PYTHONPATH="$SOURCE_ROOT:$EXEC_ROOT" pytest -q "$SOURCE_ROOT/test_source_gate.py" 2>&1 | tee "$SOURCE_OUT/PYTEST.log"
          PYTHONPATH="$SOURCE_ROOT:$EXEC_ROOT" python "$SOURCE_ROOT/source_gate_blockscout_authoritative.py" --self-test 2>&1 | tee "$SOURCE_OUT/AUTHORITY_SELF_TEST.log"
          PYTHONPATH="$SOURCE_ROOT:$EXEC_ROOT" python "$EXEC_ROOT/run_source.py" --self-test 2>&1 | tee "$SOURCE_OUT/BATCH_SELF_TEST.log"

          python "$ECON_ROOT/reconstruct.py"
          python -m py_compile \
            "$ECON_ROOT/run.py" "$ECON_ROOT/run_causal.py" \
            "$ECON_ROOT/test_run.py" "$ECON_ROOT/test_run_causal.py" \
            "$ECON_ROOT/reconstruct.py" \
            "$STRICT_ROOT/causal_guard.py" "$STRICT_ROOT/strict_guard.py" \
            "$STRICT_ROOT/test_causal_guard.py"
          PYTHONPATH="$ECON_ROOT:$STRICT_ROOT" pytest -q \
            "$ECON_ROOT/test_run.py" "$ECON_ROOT/test_run_causal.py" \
            "$STRICT_ROOT/test_causal_guard.py" 2>&1 | tee "$ECON_OUT/PYTEST.log"
          PYTHONPATH="$ECON_ROOT:$STRICT_ROOT" python "$ECON_ROOT/run.py" self-test 2>&1 | tee "$ECON_OUT/BASE_SELF_TEST.log"
          PYTHONPATH="$ECON_ROOT:$STRICT_ROOT" python "$ECON_ROOT/run_causal.py" self-test 2>&1 | tee "$ECON_OUT/CAUSAL_V2_SELF_TEST.log"
          PYTHONPATH="$ECON_ROOT:$STRICT_ROOT" python "$STRICT_ROOT/strict_guard.py" self-test 2>&1 | tee "$ECON_OUT/STRICT_V3_SELF_TEST.log"

      - name: Run complete corrected 2021-2023 source gate
        id: source
        run: |
          set +e
          rm -rf "$SOURCE_OUT/run"
          mkdir -p "$SOURCE_OUT/run"
          PYTHONPATH="$SOURCE_ROOT:$EXEC_ROOT" python "$EXEC_ROOT/run_source.py" \
            --output "$SOURCE_OUT/run" 2>&1 | tee "$SOURCE_OUT/run/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$SOURCE_OUT/run/RUN_EXIT_CODE.txt"
          if [[ ! -f "$SOURCE_OUT/run/SOURCE_GATE_RESULT.json" ]]; then
            python "$SOURCE_ROOT/write_transport_failure.py" \
              --output "$SOURCE_OUT/run" \
              --transport TRANSPORT-20260727-ML-STABLECOIN-STRICT-VISIBLE-020 \
              --exit-code "$rc"
          fi
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['SOURCE_OUT'])/'run'
          r=json.loads((root/'SOURCE_GATE_RESULT.json').read_text())
          assert r['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert r['status'] in {'PASS','FAIL_BELOW_SOURCE_DENSITY_OR_COVERAGE','SOURCE_UNAVAILABLE_OR_TRANSPORT_FAILURE'}
          assert r['market_outcome_opened'] is False
          assert r['model_fit'] is False
          assert r['trade_or_pnl_opened'] is False
          assert r['official_2024_2026_opened'] is False
          assert r['orders_submitted'] is False
          authorized=r['status']=='PASS'
          if authorized:
              expected_schema='STABLECOIN_SUPPLY_USDT_ISSUE_REDEEM_USDC_ZERO_TRANSFER_V1'
              expected_correction='CORRECTION-20260726-ML-STABLECOIN-USDT-ISSUE-REDEEM-010'
              m=json.loads((root/'SOURCE_MANIFEST.json').read_text())
              events=root/'EVENTS.jsonl'
              rows=[json.loads(line) for line in events.read_text().splitlines() if line.strip()]
              checks=r.get('pass_checks',{})
              assert checks and all(v is True for v in checks.values())
              assert r.get('source_schema_id')==expected_schema
              assert r.get('source_correction_id')==expected_correction
              assert m.get('source_schema_id')==expected_schema
              assert m.get('source_correction_id')==expected_correction
              assert r.get('event_semantics',{}).get('ordinary_usdt_transfer_excluded') is True
              assert int(r['event_count'])>=120
              assert len(r['months_with_events'])>=24
              assert sorted(r['distinct_tokens'])==['USDC','USDT']
              assert {row['token'] for row in rows}=={'USDC','USDT'}
              assert {row['direction'] for row in rows}.issubset({'MINT','BURN'})
              assert all(int(row['block_timestamp'])<1704067200 for row in rows)
              assert all(int(row['available_timestamp_12'])<1704067200 for row in rows)
              assert all(int(row['available_timestamp_64'])<1704067200 for row in rows)
              assert hashlib.sha256(events.read_bytes()).hexdigest()==m['events_sha256']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f"authorized={'true' if authorized else 'false'}\n")
              if authorized:
                  handle.write(f"events={root/'EVENTS.jsonl'}\n")
          print(json.dumps({'status':r['status'],'events':r.get('event_count'),'months':len(r.get('months_with_events',[])),'tokens':r.get('distinct_tokens'),'authorized':authorized},sort_keys=True))
          PY

      - uses: actions/cache@v4
        if: steps.source.outputs.authorized == 'true'
        with:
          path: ${{ env.MARKET_CACHE }}
          key: stablecoin-market-2020-12-2023-12-strict-causal-v3

      - name: Run strict causal pre-2024 economic screen immediately
        if: steps.source.outputs.authorized == 'true'
        run: |
          set -u
          rm -rf "$ECON_OUT/run"
          mkdir -p "$ECON_OUT/run" "$MARKET_CACHE"
          set +e
          PYTHONPATH="$ECON_ROOT:$STRICT_ROOT" python "$STRICT_ROOT/strict_guard.py" run \
            --events "${{ steps.source.outputs.events }}" \
            --market-cache "$MARKET_CACHE" \
            --output "$ECON_OUT/run" 2>&1 | tee "$ECON_OUT/run/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$ECON_OUT/run/RUN_EXIT_CODE.txt"
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then exit "$rc"; fi
          test -f "$ECON_OUT/run/RESULT.json"
          test -f "$ECON_OUT/run/FULL_RESULT.json"

      - name: Enforce strict causal account and sequential boundaries
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          sroot=Path(os.environ['SOURCE_OUT'])/'run'
          s=json.loads((sroot/'SOURCE_GATE_RESULT.json').read_text())
          assert s['orders_submitted'] is False
          if s['status']!='PASS':
              print(json.dumps({'source_status':s['status'],'economic_status':'NOT_OPENED','next_stage':'CLOSE_SOURCE_OR_REPAIR_TRANSPORT_ONLY'},sort_keys=True))
              raise SystemExit(0)

          eroot=Path(os.environ['ECON_OUT'])/'run'
          result=json.loads((eroot/'RESULT.json').read_text())
          full=json.loads((eroot/'FULL_RESULT.json').read_text())
          assert result['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert result['engine']=='ML_STABLECOIN_ISSUANCE_FIRST_PASSAGE_STRICT_CAUSAL_V3'
          assert result['orders_submitted'] is False
          assert result['official_2024h1_opened'] is False
          assert result['official_2024_2026_opened'] is False
          assert result['status'] in {
              'PRE2024_BELOW_GATE',
              'PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1',
              'PRE2024_INVALID_STRICT_CAUSAL_GUARD',
          }
          guard=result['strict_causal_guard']
          assert guard['source_decision_second_respected'] is True
          assert guard['latest_completed_bar_cutoff_enforced'] is True
          assert guard['future_entry_open_used_for_model_or_action'] is False
          assert guard['entry_open_used_for_realized_execution_only'] is True
          assert guard['stage_boundary_positions_marked_not_closed'] is True
          assert guard['legacy_source_boundary_paths']==[]
          assert guard['forced_boundary_close_true_paths']==[]
          assert guard['fatal_validity_violation'] is False
          serialized=json.dumps(full,sort_keys=True)
          assert '"exit_reason": "SOURCE_BOUNDARY"' not in serialized

          next_stage='CHANGE_ALPHA'
          if result['status']=='PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1':
              assert result['development_gate']['all'] is True
              selected=result['risk_search']['selected']
              assert selected is not None
              assert selected['growth']>0
              assert selected['liquidation'] is False
              next_stage='OFFICIAL_2024H1_IMMEDIATELY'
          print(json.dumps({
              'source_status':s['status'],
              'economic_status':result['status'],
              'development_gate':result.get('development_gate',{}).get('all'),
              'selected_risk_path':result.get('risk_search',{}).get('selected') if result.get('risk_search') else None,
              'boundary_mark_count':guard['boundary_mark_count'],
              'entry_gap_cost_only_count':guard['entry_gap_cost_only_count'],
              'next_stage':next_stage,
          },sort_keys=True))
          PY

      - name: Freeze immutable evidence hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT_ROOT/inputs"
          cp "$EXEC_ROOT/STRICT_CAUSAL_EXECUTION_CORRECTION.json" "$OUT_ROOT/inputs/"
          cp "$STRICT_ROOT/CORRECTION_002_PREENTRY_INFORMATION_BOUNDARY_BEFORE_OUTCOME.json" "$OUT_ROOT/inputs/" 2>/dev/null || true
          cp "$STRICT_ROOT/strict_guard.py" "$STRICT_ROOT/test_causal_guard.py" "$OUT_ROOT/inputs/" 2>/dev/null || true
          printf '%s\n' "$SOURCE_SHA" > "$OUT_ROOT/inputs/PINNED_SOURCE_SHA.txt"
          printf '%s\n' "$STRICT_ECONOMIC_SHA" > "$OUT_ROOT/inputs/PINNED_STRICT_ECONOMIC_SHA.txt"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('research_runs/stablecoin_strict_causal_visible_20260727')
          root.mkdir(parents=True,exist_ok=True)
          rows=[]
          for path in sorted(item for item in root.rglob('*') if item.is_file() and item.name!='OUTPUT_SHA256SUMS.txt'):
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.as_posix()}\n")
          (root/'OUTPUT_SHA256SUMS.txt').write_text(''.join(rows),encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-strict-causal-visible-${{ github.run_id }}
          path: research_runs/stablecoin_strict_causal_visible_20260727
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
