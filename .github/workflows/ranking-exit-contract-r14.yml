name: Ranking state reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - 'control/ranking.json'
      - 'control/current-state.md'
      - 'schemas/ranking.schema.json'
      - 'research/ml_hourweek_pre2024_20260726/**'
      - 'research/results/RES-20260726-ML-HOURWEEK-PRE2024-2024H1-001.json'
      - 'research/execution/stablecoin_causal_visible_20260727/**'
      - 'research/execution/stablecoin_strict_visible_20260727/**'
      - '.github/workflows/ranking-exit-contract-r14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1' 'pytest==8.3.4'
      - name: Validate current ranking state and evidence boundaries
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from jsonschema import validate
          ranking=json.loads(Path('control/ranking.json').read_text())
          schema=json.loads(Path('schemas/ranking.schema.json').read_text())
          state=Path('control/current-state.md').read_text()
          validate(ranking,schema)
          match=re.search(r'(?m)^- revision:\s*(\d+)\s*$',state)
          assert match is not None and ranking['revision']==int(match.group(1))
          assert 'Rank does not determine research priority.' in state
          assert ranking['ranking_rule']['rank_does_not_determine_work_priority'] is True
          if ranking['status']=='ACTIVE':
              first=ranking['first_place']; rows=ranking['ranked_candidates']
              assert first is not None and first['rank']==1 and rows and rows[0]['rank']==1
              assert first['source_result_id']==rows[0]['source_result_id']
              metrics=first['metrics']
              assert metrics['target_geometric_daily_growth']==0.01
              assert abs(metrics['target_gap']-(0.01-metrics['geometric_daily_growth']))<1e-12
              assert [row['rank'] for row in rows]==list(range(1,len(rows)+1))
              assert [row['target_gap'] for row in rows]==sorted(row['target_gap'] for row in rows)
          else:
              assert ranking['first_place'] is None and ranking['ranked_candidates']==[]
          hourweek=Path('research/results/RES-20260726-ML-HOURWEEK-PRE2024-2024H1-001.json')
          if hourweek.exists():
              result=json.loads(hourweek.read_text())
              assert result['system_frozen_at']=='2023-12-31T23:59:59Z'
              assert result['official_2024H1']['24bps']['geometric_daily_growth']<0
              assert result['official_2024H1']['24bps']['exact_winner_removal']['total_return']<0
              assert result['decision']=='RETIRE_HOURWEEK_FILTER_AND_SWITCH_ALPHA'
              assert result['2024H2_2026_opened'] is False
              assert result['orders_submitted'] is False
          print(f"RANKING_STATE_RECONCILIATION_PASS revision={ranking['revision']} first={ranking['first_place']['source_result_id'] if ranking['first_place'] else 'none'}")
          PY
      - name: Validate project and repository tests
        run: |
          python scripts/validate_project.py
          python -m pytest -q

  stablecoin-source-economic:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      SOURCE_SHA: 7bdf54c93607d6d71e8e9f35b66fd9c2c464e637
      STRICT_SHA: 209a0fbe6e2f61d2c58b3eb7910b8c0c139cd46c
      SOURCE_ROOT: research/ml_stablecoin_issuance_20260726
      ECON_ROOT: research/ml_stablecoin_issuance_economic_20260726
      FIX_ROOT: sourcefix/ml_stablecoin_causal_guard_20260726
      SOURCE_EXEC_ROOT: research/execution/stablecoin_causal_visible_20260727
      STRICT_EXEC_ROOT: research/execution/stablecoin_strict_visible_20260727
      OUT_ROOT: research_runs/stablecoin_strict_visible_20260727
      MARKET_CACHE: ${{ runner.temp }}/stablecoin-market
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            requests==2.32.4 pytest==8.3.5 \
            numpy==2.1.3 pandas==2.2.3 scikit-learn==1.6.1 pyarrow==18.1.0
      - name: Materialize exact corrected source and strict causal engine
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_ROOT" "$ECON_ROOT" "$FIX_ROOT"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          git archive "$SOURCE_SHA" "$SOURCE_ROOT" | tar -x
          git fetch --no-tags --depth=1 origin "$STRICT_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$STRICT_SHA"
          git archive "$STRICT_SHA" "$ECON_ROOT" "$FIX_ROOT" | tar -x
          python -m json.tool "$SOURCE_EXEC_ROOT/EXECUTION_CORRECTION.json" >/dev/null
          python -m json.tool "$STRICT_EXEC_ROOT/EXECUTION_CORRECTION.json" >/dev/null
          python -m json.tool "$SOURCE_ROOT/CORRECTION_010_USDT_ISSUE_REDEEM_EVENT_SCHEMA_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$SOURCE_ROOT/CORRECTION_011_BLOCKSCOUT_NULL_TOPIC_PADDING_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$FIX_ROOT/CORRECTION_002_PREENTRY_INFORMATION_BOUNDARY_BEFORE_OUTCOME.json" >/dev/null
      - name: Validate source and strict economic engines
        run: |
          set -euo pipefail
          mkdir -p "$OUT_ROOT/source"
          python -m py_compile "$SOURCE_ROOT"/source_gate*.py "$SOURCE_ROOT/test_source_gate.py" "$SOURCE_EXEC_ROOT/run_source.py"
          PYTHONPATH="$SOURCE_ROOT:$SOURCE_EXEC_ROOT" pytest -q "$SOURCE_ROOT/test_source_gate.py" 2>&1 | tee "$OUT_ROOT/source/PYTEST.log"
          PYTHONPATH="$SOURCE_ROOT:$SOURCE_EXEC_ROOT" python "$SOURCE_ROOT/source_gate_blockscout_authoritative.py" --self-test 2>&1 | tee "$OUT_ROOT/source/AUTHORITY_SELF_TEST.log"
          PYTHONPATH="$SOURCE_ROOT:$SOURCE_EXEC_ROOT" python "$SOURCE_EXEC_ROOT/run_source.py" --self-test 2>&1 | tee "$OUT_ROOT/source/BATCH_SELF_TEST.log"
          python "$ECON_ROOT/reconstruct.py"
          python -m py_compile \
            "$ECON_ROOT/run.py" "$ECON_ROOT/run_causal.py" \
            "$ECON_ROOT/test_run.py" "$ECON_ROOT/test_run_causal.py" \
            "$FIX_ROOT/strict_guard.py" "$FIX_ROOT/causal_guard.py" "$FIX_ROOT/test_causal_guard.py"
          PYTHONPATH="$ECON_ROOT" pytest -q "$ECON_ROOT/test_run.py" "$ECON_ROOT/test_run_causal.py" 2>&1 | tee "$OUT_ROOT/ECON_PYTEST.log"
          PYTHONPATH="$ECON_ROOT:$FIX_ROOT" pytest -q "$FIX_ROOT/test_causal_guard.py" 2>&1 | tee "$OUT_ROOT/STRICT_PYTEST.log"
          PYTHONPATH="$ECON_ROOT:$FIX_ROOT" python "$FIX_ROOT/causal_guard.py" self-test 2>&1 | tee "$OUT_ROOT/STRICT_SELF_TEST.log"
      - name: Run complete corrected 2021-2023 source gate
        id: source
        run: |
          set +e
          mkdir -p "$OUT_ROOT/source"
          PYTHONPATH="$SOURCE_ROOT:$SOURCE_EXEC_ROOT" python "$SOURCE_EXEC_ROOT/run_source.py" --output "$OUT_ROOT/source" 2>&1 | tee "$OUT_ROOT/source/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$OUT_ROOT/source/RUN_EXIT_CODE.txt"
          if [[ ! -f "$OUT_ROOT/source/SOURCE_GATE_RESULT.json" ]]; then
            python "$SOURCE_ROOT/write_transport_failure.py" --output "$OUT_ROOT/source" --transport TRANSPORT-20260727-ML-STABLECOIN-STRICT-VISIBLE-020 --exit-code "$rc"
          fi
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT_ROOT'])/'source'
          r=json.loads((root/'SOURCE_GATE_RESULT.json').read_text())
          assert r['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert r['status'] in {'PASS','FAIL_BELOW_SOURCE_DENSITY_OR_COVERAGE','SOURCE_UNAVAILABLE_OR_TRANSPORT_FAILURE'}
          assert r['market_outcome_opened'] is False and r['model_fit'] is False and r['trade_or_pnl_opened'] is False
          assert r['official_2024_2026_opened'] is False and r['orders_submitted'] is False
          authorized=r['status']=='PASS'
          if authorized:
              m=json.loads((root/'SOURCE_MANIFEST.json').read_text()); events=root/'EVENTS.jsonl'
              rows=[json.loads(line) for line in events.read_text().splitlines() if line.strip()]
              assert r['source_schema_id']=='STABLECOIN_SUPPLY_USDT_ISSUE_REDEEM_USDC_ZERO_TRANSFER_V1'
              assert r['source_correction_id']=='CORRECTION-20260726-ML-STABLECOIN-USDT-ISSUE-REDEEM-010'
              assert m['source_schema_id']==r['source_schema_id'] and m['source_correction_id']==r['source_correction_id']
              assert r['event_semantics']['ordinary_usdt_transfer_excluded'] is True
              assert int(r['event_count'])>=120 and len(r['months_with_events'])>=24
              assert sorted(r['distinct_tokens'])==['USDC','USDT'] and {x['token'] for x in rows}=={'USDC','USDT'}
              assert all(int(x['available_timestamp_12'])<1704067200 for x in rows)
              assert all(int(x['available_timestamp_64'])<1704067200 for x in rows)
              assert hashlib.sha256(events.read_bytes()).hexdigest()==m['events_sha256']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"authorized={'true' if authorized else 'false'}\n")
          print(json.dumps({'status':r['status'],'events':r.get('event_count'),'months':len(r.get('months_with_events',[])),'tokens':r.get('distinct_tokens')},sort_keys=True))
          PY
      - uses: actions/cache@v4
        if: steps.source.outputs.authorized == 'true'
        with:
          path: ${{ env.MARKET_CACHE }}
          key: stablecoin-market-2020-12-2023-12-strict-v3
      - name: Run strict causal pre-2024 economic screen immediately
        if: steps.source.outputs.authorized == 'true'
        run: |
          set -u
          mkdir -p "$OUT_ROOT/economic" "$MARKET_CACHE"
          set +e
          PYTHONPATH="$ECON_ROOT:$FIX_ROOT" python "$FIX_ROOT/causal_guard.py" run \
            --events "$OUT_ROOT/source/EVENTS.jsonl" \
            --market-cache "$MARKET_CACHE" \
            --output "$OUT_ROOT/economic" 2>&1 | tee "$OUT_ROOT/economic/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$OUT_ROOT/economic/RUN_EXIT_CODE.txt"
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then exit "$rc"; fi
          test -f "$OUT_ROOT/economic/RESULT.json" && test -f "$OUT_ROOT/economic/FULL_RESULT.json"
      - name: Enforce strict causal account and sequential boundaries
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT_ROOT']); s=json.loads((root/'source/SOURCE_GATE_RESULT.json').read_text())
          if s['status']=='PASS':
              r=json.loads((root/'economic/RESULT.json').read_text()); full=json.loads((root/'economic/FULL_RESULT.json').read_text())
              assert r['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
              assert r['engine']=='ML_STABLECOIN_ISSUANCE_FIRST_PASSAGE_STRICT_CAUSAL_V3'
              guard=r['strict_causal_guard']
              assert guard['correction_id']=='CORRECTION-20260727-ML-STABLECOIN-PREENTRY-INFORMATION-BOUNDARY-002'
              assert guard['source_decision_second_respected'] is True
              assert guard['latest_completed_bar_cutoff_enforced'] is True
              assert guard['decision_reference_price_pre_entry'] is True
              assert guard['future_entry_open_used_for_model_or_action'] is False
              assert guard['entry_open_used_for_realized_execution_only'] is True
              assert guard['stage_boundary_positions_marked_not_closed'] is True
              assert guard['fatal_validity_violation'] is False
              assert guard['legacy_source_boundary_paths']==[]
              assert guard['forced_boundary_close_true_paths']==[]
              assert r['orders_submitted'] is False and r['official_2024h1_opened'] is False and r['official_2024_2026_opened'] is False
              assert r['status'] in {'PRE2024_BELOW_GATE','PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1'}
              serialized=json.dumps(full,sort_keys=True)
              assert '"exit_reason": "SOURCE_BOUNDARY"' not in serialized
              def walk(v):
                  if isinstance(v,dict):
                      if 'forced_boundary_close' in v: assert v['forced_boundary_close'] is False
                      for child in v.values(): walk(child)
                  elif isinstance(v,list):
                      for child in v: walk(child)
              walk(full)
              nxt='CHANGE_ALPHA'
              if r['status']=='PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1':
                  assert r['development_gate']['all'] is True and r['risk_search']['selected'] is not None
                  assert r['risk_search']['selected']['growth']>0 and r['risk_search']['selected']['liquidation'] is False
                  nxt='OFFICIAL_2024H1_IMMEDIATELY'
              print(json.dumps({'source':s['status'],'economic':r['status'],'strict_guard':guard,'selected':r.get('risk_search',{}).get('selected') if r.get('risk_search') else None,'next':nxt},sort_keys=True))
          else:
              print(json.dumps({'source':s['status'],'economic':'NOT_OPENED','next':'CLOSE_SOURCE_OR_TRANSPORT_ONLY'},sort_keys=True))
          PY
      - name: Freeze immutable evidence hashes
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('research_runs/stablecoin_strict_visible_20260727'); root.mkdir(parents=True,exist_ok=True)
          rows=[]
          for path in sorted(item for item in root.rglob('*') if item.is_file() and item.name!='OUTPUT_SHA256SUMS.txt'):
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.as_posix()}\n")
          (root/'OUTPUT_SHA256SUMS.txt').write_text(''.join(rows),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-strict-visible-${{ github.run_id }}
          path: research_runs/stablecoin_strict_visible_20260727
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
