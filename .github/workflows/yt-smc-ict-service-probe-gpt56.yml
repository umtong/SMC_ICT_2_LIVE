name: YT SMC ICT transcript service probe gpt56

on:
  workflow_dispatch:
  push:
    branches:
      - agent/yt-smc-ict-causal-ml-gpt56-20260727
    paths:
      - research/yt_smc_ict_gpt56/probe_transcript_services.py
      - .github/workflows/yt-smc-ict-service-probe-gpt56.yml

permissions:
  contents: write

concurrency:
  group: yt-smc-ict-service-probe-gpt56-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install probe dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Discover and test public transcript endpoints
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact/transcript_service_probe
          mkdir -p artifact/transcript_service_probe
          python research/yt_smc_ict_gpt56/probe_transcript_services.py \
            --output artifact/transcript_service_probe/TRANSCRIPT_SERVICE_PROBE.json \
            2>&1 | tee artifact/transcript_service_probe/PROBE_STDOUT.log

      - name: Write compact probe pointer
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path('artifact/transcript_service_probe/TRANSCRIPT_SERVICE_PROBE.json')
          payload = json.loads(source.read_text(encoding='utf-8'))
          compact = {
              'schema_version': 1,
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'source_sha': os.environ['GITHUB_SHA'],
              'observed_at': payload['observed_at'],
              'services': {},
          }
          for name, item in payload['services'].items():
              working = item.get('working_endpoint')
              successful = []
              for endpoint, attempts in item.get('attempts', {}).items():
                  for attempt in attempts:
                      if attempt.get('looks_like_transcript'):
                          successful.append({
                              'endpoint': endpoint,
                              'method': attempt.get('method'),
                              'payload_keys': attempt.get('payload_keys'),
                              'status': attempt.get('status'),
                              'characters': attempt.get('characters'),
                              'preview': attempt.get('preview'),
                          })
              compact['services'][name] = {
                  'working_endpoint': working,
                  'successful_attempts': successful,
                  'discovered_endpoint_count': len(item.get('discovered_endpoints', [])),
                  'page': item.get('page'),
              }
          path = Path('research/yt_smc_ict_gpt56/TRANSCRIPT_SERVICE_POINTER.json')
          path.write_text(json.dumps(compact, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload full probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: yt-smc-ict-transcript-service-probe-gpt56-${{ github.sha }}
          path: artifact/transcript_service_probe
          if-no-files-found: error
          retention-days: 30

      - name: Commit probe pointer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_smc_ict_gpt56/TRANSCRIPT_SERVICE_POINTER.json
          git commit -m "Record transcript service probe ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
