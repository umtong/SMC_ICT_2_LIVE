name: SMT overreaction MSS reclaim fatal screen

on:
  pull_request:
    branches: [main]
    paths:
      - "research/smt_overreaction_reclaim_20260726/**"
      - ".github/workflows/smt-overreaction-reclaim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smt-overreaction-reclaim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  TZ: UTC
  CACHE: /tmp/smt-overreaction-reclaim
  OUT: ${{ github.workspace }}/research_runs/smt_overreaction_reclaim_20260726

jobs:
  fatal-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic research environment
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 requests==2.32.4

      - name: Reconstruct and validate frozen scientific sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime "$OUT/self_test"
          git fetch --depth=1 origin agent/r11-altlag-opportunity-001
          git show FETCH_HEAD:research/bybit_altlag_opportunity_20260726/probe.py.zlib.b64 > runtime/base_probe.py.zlib.b64
          python - <<'PY'
          import base64, hashlib, pathlib, zlib
          root = pathlib.Path("runtime")
          source = zlib.decompress(base64.b64decode((root / "base_probe.py.zlib.b64").read_text().strip()))
          observed = hashlib.sha256(source).hexdigest()
          expected = "5ecbfddf8443fd37b76514e30ab91028dda68e16a5e51eb63f7f76f0c073ad0f"
          assert observed == expected, (observed, expected)
          (root / "base_probe.py").write_bytes(source)
          print("base_probe_sha256", observed)
          PY
          python research/smt_overreaction_reclaim_20260726/reconstruct.py
          cp research/smt_overreaction_reclaim_20260726/run.py runtime/smt_reclaim.py
          python -m py_compile runtime/base_probe.py runtime/smt_reclaim.py
          PYTHONPATH=runtime python runtime/smt_reclaim.py self-test --output "$OUT/self_test"
          python scripts/validate_project.py
          sha256sum \
            runtime/base_probe.py \
            runtime/smt_reclaim.py \
            research/smt_overreaction_reclaim_20260726/WORK_CLAIM.json \
            research/smt_overreaction_reclaim_20260726/preregistration.json \
            research/smt_overreaction_reclaim_20260726/reconstruct.py \
            > "$OUT/INPUT_SHA256SUMS.txt"

      - uses: actions/cache@v4
        with:
          path: /tmp/smt-overreaction-reclaim
          key: smt-overreaction-reclaim-${{ runner.os }}-${{ hashFiles('research/smt_overreaction_reclaim_20260726/preregistration.json') }}
          restore-keys: |
            smt-overreaction-reclaim-${{ runner.os }}-

      - name: Run frozen four-date causal PnL screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/result"
          PYTHONPATH=runtime python runtime/smt_reclaim.py run \
            --output "$OUT/result" \
            --cache "$CACHE" \
            2>&1 | tee "$OUT/run.log"

      - name: Enforce sealed state and decision-ready output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["OUT"])
          result = json.loads((root / "result" / "RESULT.json").read_text())
          assert result["claim_id"] == "CLM-20260726-1530-SMT-OVERREACTION-RECLAIM-001"
          assert result["candidate_count"] == 6
          assert result["2024_opened"] is False
          assert result["2025_opened"] is False
          assert result["2026_opened"] is False
          assert result["orders_submitted"] is False
          assert result["paper_live_enabled"] is False
          assert result["ranking_role"] == "NOT_RANK_ELIGIBLE_TRADE_PRINT_FATAL_SCREEN"
          assert (root / "result" / "EVENTS.csv").exists()
          assert (root / "result" / "LEDGER.csv").exists()
          print("SEALED_DECISION_READY_RESULT=" + json.dumps({
              "status": result["status"],
              "unique_physical_event_count": result["unique_physical_event_count"],
              "gate_pass_count": result["gate_pass_count"],
              "best_candidate_id": result["best_candidate"]["candidate_id"] if result["best_candidate"] else None,
          }, sort_keys=True))
          PY

      - name: Record immutable output hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find "$OUT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$OUT/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smt-overreaction-reclaim-${{ github.sha }}
          path: research_runs/smt_overreaction_reclaim_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
