name: YT Trinity 2022 unified SMC checkpoint

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - control/yt-trinity-pre2024-2022-checkpoint-trigger.json

permissions:
  contents: write

concurrency:
  group: yt-trinity-pre2024-2022-checkpoint
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout frozen SMC source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout canonical loader
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: a2bb231966a517d29495bed7673e4d08ab8e30a9
          path: canonical_repo
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deterministic dependencies
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q \
            'numpy==2.2.6' 'pandas==2.2.3' 'pyarrow==19.0.1' \
            'scikit-learn==1.6.1' 'gdown==5.2.0'

      - name: Download and verify canonical 2022 BTC ETH inputs
        run: |
          set -euo pipefail
          mkdir -p inputs/data/PRE_2024_2022/BTCUSDT inputs/data/PRE_2024_2022/ETHUSDT
          python -m gdown --id 1lEZQCE-T4OXcGVaLN9HFAekCnXaUmeQ6 -O /tmp/btc2022.zip
          python -m gdown --id 1bP0MizmZhSwhEOkf6YodfuCxbMZZYYu7 -O /tmp/eth2022.zip
          echo '273995bf7efd905c147237ff14978b92ef65f4703b290986ba6fab5fe5e3e42c  /tmp/btc2022.zip' | sha256sum -c -
          echo '681cb5c21826f05a12e40b25818c40d1be46cf4b394676998d8a6856180271da  /tmp/eth2022.zip' | sha256sum -c -
          unzip -q /tmp/btc2022.zip -d inputs/data/PRE_2024_2022/BTCUSDT
          unzip -q /tmp/eth2022.zip -d inputs/data/PRE_2024_2022/ETHUSDT
          test -f inputs/data/PRE_2024_2022/BTCUSDT/trade_bars/1m.parquet
          test -f inputs/data/PRE_2024_2022/ETHUSDT/trade_bars/1m.parquet

      - name: Materialize causal candidates labels and execution checkpoint
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import gzip
          import hashlib
          import json
          import pickle
          from collections import Counter
          from pathlib import Path

          from run_research import load_canonical_frames
          from system.coarse import CoarseExecutionConfig
          from system.core import FeatureConfig
          from system.corpus_alpha import build_corpus_features, generate_corpus_candidates_with_diagnostics
          from system.research_pipeline import label_event_dataset

          symbols = ('BTCUSDT', 'ETHUSDT')
          decision, execution, funding = load_canonical_frames(
              Path('inputs/data'), Path('canonical_repo'), symbols, ('PRE_2024_2022',)
          )
          candidates = []
          diagnostics = {}
          feature_shapes = {}
          for symbol in symbols:
              features = build_corpus_features(decision[symbol], FeatureConfig())
              rows, diag = generate_corpus_candidates_with_diagnostics(features, symbol)
              candidates.extend(rows)
              diagnostics[symbol] = diag
              feature_shapes[symbol] = {
                  'rows': int(len(features)),
                  'columns': int(len(features.columns)),
                  'first': features.index.min().isoformat(),
                  'last': features.index.max().isoformat(),
              }
          candidates.sort(key=lambda row: (row.timestamp, row.symbol, row.family.value, row.side))
          labels = label_event_dataset(candidates, execution, CoarseExecutionConfig())
          labels.to_parquet('output/EVENT_LABELS.parquet', index=False)
          labels.to_pickle('output/EVENT_LABELS.pkl.gz', compression='gzip')
          with gzip.open('output/CANDIDATES.pkl.gz', 'wb') as handle:
              pickle.dump(candidates, handle, protocol=pickle.HIGHEST_PROTOCOL)
          with gzip.open('output/EXECUTION_FRAMES.pkl.gz', 'wb') as handle:
              pickle.dump(execution, handle, protocol=pickle.HIGHEST_PROTOCOL)
          with gzip.open('output/FUNDING.pkl.gz', 'wb') as handle:
              pickle.dump(funding, handle, protocol=pickle.HIGHEST_PROTOCOL)

          family_counts = Counter(row.family.value for row in candidates)
          manifest = {
              'schema_version': 1,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'source_sha': '${{ github.sha }}',
              'period': '2022-01-01T00:00:00Z/2023-01-01T00:00:00Z',
              'symbols': list(symbols),
              'candidate_count': len(candidates),
              'candidate_family_counts': dict(sorted(family_counts.items())),
              'resolved_label_count': int(len(labels)),
              'feature_shapes': feature_shapes,
              'narrative_diagnostics': diagnostics,
              'input_sha256': {
                  'BTCUSDT': '273995bf7efd905c147237ff14978b92ef65f4703b290986ba6fab5fe5e3e42c',
                  'ETHUSDT': '681cb5c21826f05a12e40b25818c40d1be46cf4b394676998d8a6856180271da',
              },
          }
          Path('output/MANIFEST.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          for path in Path('output').iterdir():
              if path.is_file():
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  print(digest, path.name)
          print(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True))
          PY
          (cd output && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload immutable 2022 checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-pre2024-2022-checkpoint-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 30

      - name: Persist compact checkpoint pointer
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          manifest_path = Path('output/MANIFEST.json')
          pointer = {
              'schema_version': 1,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'workflow': 'YT Trinity 2022 unified SMC checkpoint',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'source_sha': os.environ['GITHUB_SHA'],
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'job_status': os.environ['JOB_STATUS'],
              'artifact_name': f"yt-trinity-pre2024-2022-checkpoint-{os.environ['GITHUB_SHA']}",
              'manifest': json.loads(manifest_path.read_text()) if manifest_path.exists() else None,
          }
          Path('/tmp/PRE2024_2022_CHECKPOINT_POINTER.json').write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git fetch origin agent/r22-yt-trinity-ml-001
          git checkout -B agent/r22-yt-trinity-ml-001 origin/agent/r22-yt-trinity-ml-001
          cp /tmp/PRE2024_2022_CHECKPOINT_POINTER.json research/yt_trinity_ml/PRE2024_2022_CHECKPOINT_POINTER.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/PRE2024_2022_CHECKPOINT_POINTER.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record 2022 unified SMC checkpoint ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
