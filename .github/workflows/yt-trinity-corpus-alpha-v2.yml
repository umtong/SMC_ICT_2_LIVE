name: YT Trinity transcript alpha v2

on:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - research/yt_trinity_ml/system/corpus_alpha.py
      - research/yt_trinity_ml/tests/test_corpus_alpha.py
      - research/yt_trinity_ml/tests/test_execution_realism.py
      - research/yt_trinity_ml/apply_corpus_alpha_v2.py
      - .github/workflows/yt-trinity-corpus-alpha-v2.yml
      - control/yt-trinity-corpus-alpha-v2-trigger.json
  pull_request:
    branches: [main]
    paths:
      - research/yt_trinity_ml/system/corpus_alpha.py
      - research/yt_trinity_ml/tests/test_corpus_alpha.py
      - research/yt_trinity_ml/tests/test_execution_realism.py
      - research/yt_trinity_ml/apply_corpus_alpha_v2.py
      - .github/workflows/yt-trinity-corpus-alpha-v2.yml
      - control/yt-trinity-corpus-alpha-v2-trigger.json

permissions:
  contents: write

concurrency:
  group: yt-trinity-corpus-alpha-v2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  integrate-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply exact source integration
        run: python research/yt_trinity_ml/apply_corpus_alpha_v2.py
      - name: Install deterministic test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" "pandas==2.2.3" "scikit-learn==1.6.1" "pytest==8.3.5"
      - name: Compile causal setup and execution modules
        run: |
          python -m py_compile \
            research/yt_trinity_ml/system/corpus_alpha.py \
            research/yt_trinity_ml/system/research_pipeline.py \
            research/yt_trinity_ml/system/execution.py
      - name: Run causal and execution regression suite
        run: |
          pytest -q \
            research/yt_trinity_ml/tests/test_corpus_alpha.py \
            research/yt_trinity_ml/tests/test_execution_realism.py \
            research/yt_trinity_ml/tests/test_entry_fill_guard.py \
            research/yt_trinity_ml/tests/test_yt_trinity_system.py
      - name: Persist tested integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/yt_trinity_ml/system/research_pipeline.py \
            research/yt_trinity_ml/system/execution.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate confirmed-retest alpha and realistic exits"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${TARGET_BRANCH}"
            if git push origin "HEAD:${TARGET_BRANCH}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
