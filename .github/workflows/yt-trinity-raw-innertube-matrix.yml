name: YT Trinity raw Innertube caption matrix

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/probe_raw_innertube_matrix.py
      - control/yt-trinity-raw-innertube-trigger.json
      - .github/workflows/yt-trinity-raw-innertube-matrix.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-raw-innertube-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            key: Linux
          - os: macos-14
            key: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current raw player stack
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --pre --upgrade "yt-dlp[default,curl-cffi]"
      - name: Probe client matrix
        continue-on-error: true
        run: |
          mkdir -p artifact
          python research/yt_trinity_ml/probe_raw_innertube_matrix.py \
            --runner-key "${{ matrix.key }}" \
            --output "artifact/RAW_INNERTUBE_MATRIX_${{ matrix.key }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-raw-innertube-${{ matrix.key }}-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          retention-days: 30
      - name: Persist exact result
        if: always()
        run: |
          source="artifact/RAW_INNERTUBE_MATRIX_${{ matrix.key }}.json"
          if [[ ! -f "$source" ]]; then exit 0; fi
          target="research/yt_trinity_ml/RAW_INNERTUBE_MATRIX_${{ matrix.key }}.json"
          cp "$source" "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record ${{ matrix.key }} raw Innertube caption matrix ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
