name: Bybit L2 cancellation-replenishment taker fatal screen

on:
  push:
    branches:
      - agent/r11-l2-cancel-refill-taker-001
    paths:
      - "research/l2_cancel_refill_taker_20260726/**"
      - ".github/workflows/l2-cancel-refill-taker-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/l2_cancel_refill_taker_20260726/**"
      - ".github/workflows/l2-cancel-refill-taker-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: l2-cancel-refill-taker-r11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  TZ: UTC
  CACHE: /tmp/l2-cancel-refill-taker-r11
  OUT: ${{ github.workspace }}/research_runs/l2_cancel_refill_taker_20260726

jobs:
  fatal-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen research environment
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 requests==2.32.4
      - name: Validate project and causal engine
        run: |
          python scripts/validate_project.py
          python research/l2_cancel_refill_taker_20260726/reconstruct.py
          python -m py_compile research/l2_cancel_refill_taker_20260726/run.py
          python research/l2_cancel_refill_taker_20260726/run.py self-test
          python -m json.tool research/l2_cancel_refill_taker_20260726/WORK_CLAIM.json >/dev/null
          python -m json.tool research/l2_cancel_refill_taker_20260726/preregistration.json >/dev/null
      - uses: actions/cache@v4
        with:
          path: /tmp/l2-cancel-refill-taker-r11
          key: l2-cancel-refill-taker-r11-${{ runner.os }}-${{ hashFiles('research/l2_cancel_refill_taker_20260726/preregistration.json') }}
          restore-keys: |
            l2-cancel-refill-taker-r11-${{ runner.os }}-
      - name: Run frozen pre-2024 fatal screen
        run: |
          mkdir -p "$OUT"
          python research/l2_cancel_refill_taker_20260726/run.py run --cache "$CACHE" --output "$OUT" | tee "$OUT/run.log"
      - name: Assert sealed periods and research-only authority
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["OUT"])
          p = root / "summary.json"
          if not p.exists():
              (root / "wrapper_status.json").write_text(json.dumps({
                  "hard_validity": "INCOMPLETE",
                  "orders_submitted": False,
                  "2024_opened": False,
                  "reason": "missing summary.json"
              }, indent=2, sort_keys=True) + "\n")
              raise SystemExit("missing summary.json")
          s = json.loads(p.read_text())
          assert s["hard_validity"] == "PASS"
          assert s["engine_version"] == "L2_CANCEL_REFILL_TAKER_V1"
          assert s["candidate_count"] == 432
          assert s["2024_opened"] is False and s["2025_opened"] is False and s["2026_opened"] is False
          assert s["orders_submitted"] is False and s["paper_live_enabled"] is False
          (root / "wrapper_status.json").write_text(json.dumps({
              "hard_validity": "PASS",
              "economic_status": s["economic_status"],
              "fit_survivor_count": s["fit_survivor_count"],
              "development_opened": s["development_opened"],
              "development_survivor_count": s["development_survivor_count"],
              "orders_submitted": False,
              "2024_opened": False
          }, indent=2, sort_keys=True) + "\n")
          print("SEALED_RESEARCH_STATE_PASS")
          PY
      - name: Record immutable output hashes
        if: always()
        run: |
          mkdir -p "$OUT"
          find "$OUT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2-cancel-refill-taker-r11-${{ github.sha }}
          path: research_runs/l2_cancel_refill_taker_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
