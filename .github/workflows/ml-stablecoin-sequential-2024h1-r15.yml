name: Stablecoin issuance ML sequential 2024H1

on:
  push:
    branches:
      - agent/r15-ml-stablecoin-economic-sequential-002
    paths:
      - 'research/ml_stablecoin_issuance_20260726/MODEL_IMPLEMENTATION_CONTRACT_009_BEFORE_OUTCOME.json'
      - 'research/ml_stablecoin_issuance_20260726/MODEL_SOURCE_MANIFEST.json'
      - 'research/ml_stablecoin_issuance_20260726/model_bundle.py.gz.b64.part*'
      - 'research/ml_stablecoin_issuance_20260726/reconstruct_model.py'
      - 'research/ml_stablecoin_issuance_20260726/test_run_model.py'
      - '.github/workflows/ml-stablecoin-sequential-2024h1-r15.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ml-stablecoin-sequential-2024h1-r15-${{ github.sha }}
  cancel-in-progress: false

jobs:
  sequential-research:
    runs-on: windows-latest
    timeout-minutes: 340
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r15-ml-stablecoin-economic-sequential-002
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install frozen environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade 'pip==25.1.1'
          python -m pip install \
            'numpy==2.1.3' \
            'pandas==2.2.3' \
            'requests==2.32.4' \
            'scikit-learn==1.6.1' \
            'joblib==1.4.2' \
            'pytest==8.3.5'

      - name: Reconstruct and validate frozen economic engine
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_stablecoin_issuance_20260726
          python "$root/reconstruct_model.py"
          runner="$root/reconstructed/run_model.py"
          test "$(python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('research/ml_stablecoin_issuance_20260726/reconstructed/run_model.py')
          print(hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          )" = "497e557561bc9b2b87b2d636ae89991213ea5480b51f22ebec790f1ef200dae4"
          python -m py_compile \
            "$root/reconstruct_model.py" \
            "$runner" \
            "$root/test_run_model.py" \
            "$root/source_gate.py" \
            "$root/source_gate_authoritative.py" \
            "$root/source_gate_blockscout.py" \
            "$root/source_gate_blockscout_authoritative.py"
          PYTHONPATH="$root/reconstructed:$root" \
            python -m pytest -q "$root/test_run_model.py" "$root/test_source_gate.py"
          PYTHONPATH="$root/reconstructed:$root" \
            python "$runner" --self-test
          python -m json.tool "$root/MODEL_IMPLEMENTATION_CONTRACT_009_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$root/AMENDMENT_002_SEQUENTIAL_2024H1_EVALUATION_BEFORE_OUTCOME.json" >/dev/null

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\stablecoin-economic-cache
          key: stablecoin-economic-${{ runner.os }}-v2
          restore-keys: |
            stablecoin-economic-${{ runner.os }}-

      - name: Run identical outcome-sealed 2021-2023 source gate
        shell: bash
        run: |
          set -u
          root=research/ml_stablecoin_issuance_20260726
          source_out=research_runs/ml_stablecoin_issuance_20260726/sequential_source
          mkdir -p "$source_out"
          set +e
          PYTHONPATH="$root" \
            python "$root/source_gate_blockscout_authoritative.py" \
              --output "$source_out" \
              2>&1 | tee "$source_out/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$source_out/RUN_EXIT_CODE.txt"
          if [[ ! -f "$source_out/SOURCE_GATE_RESULT.json" ]]; then
            python "$root/write_transport_failure.py" \
              --output "$source_out" \
              --transport TRANSPORT-20260726-ML-STABLECOIN-BLOCKSCOUT-003 \
              --exit-code "$rc"
          fi
          python "$root/verify_source_result.py" \
            "$source_out/SOURCE_GATE_RESULT.json" \
            TRANSPORT-20260726-ML-STABLECOIN-BLOCKSCOUT-003
          exit 0

      - name: Run frozen ML, broad risk search and mandatory sequential 2024H1
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_stablecoin_issuance_20260726
          runner="$root/reconstructed/run_model.py"
          source_out=research_runs/ml_stablecoin_issuance_20260726/sequential_source
          out=research_runs/ml_stablecoin_issuance_20260726/sequential_economic
          cache="${RUNNER_TEMP//\\//}/stablecoin-economic-cache"
          mkdir -p "$out" "$cache"
          PYTHONPATH="$root/reconstructed:$root" \
            python "$runner" \
              --source-dir "$source_out" \
              --cache "$cache" \
              --output "$out" \
              2>&1 | tee "$out/RUN.log"

      - name: Enforce chronology and authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source=Path('research_runs/ml_stablecoin_issuance_20260726/sequential_source')
          out=Path('research_runs/ml_stablecoin_issuance_20260726/sequential_economic')
          s=json.loads((source/'SOURCE_GATE_RESULT.json').read_text())
          r=json.loads((out/'RESULT.json').read_text())
          assert r['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert r.get('orders_submitted', r.get('authority',{}).get('orders_submitted')) is False
          assert r.get('paper_or_live_started', r.get('authority',{}).get('paper_or_live_started')) is False
          if s['status']!='PASS':
              assert r['status']=='SOURCE_GATE_BELOW_GATE'
              assert r['official_2024H1_opened'] is False
          if r['status']=='OFFICIAL_2024H1_COMPLETE':
              assert r['authority']['official_2024H1_opened'] is True
              assert r['official_2024H1']['information_cutoff']=='2023-12-31T23:59:59Z'
              assert r['official_2024H1']['decision'] in {
                  'OBJECTIVE_EXCEEDED_CONTINUE_SEQUENTIAL_RESEARCH',
                  'POSITIVE_ROBUST_ASSESS_FOR_2024H2_UPDATE',
                  'RETIRE_INFORMATION_UNIT_AFTER_2024H1',
              }
          assert r.get('official_2024H2_opened', r.get('authority',{}).get('official_2024H2_opened',False)) is False
          assert r.get('official_2025H1_opened', r.get('authority',{}).get('official_2025H1_opened',False)) is False
          assert r.get('official_2025H2_opened', r.get('authority',{}).get('official_2025H2_opened',False)) is False
          assert r.get('official_2026H1_opened', r.get('authority',{}).get('official_2026H1_opened',False)) is False
          print(json.dumps({
              'source_status':s['status'],
              'status':r['status'],
              'economic_status':r['economic_status'],
              'official_2024H1_opened':r.get('authority',{}).get('official_2024H1_opened',False),
          },sort_keys=True))
          PY

      - name: Record compact decision-ready result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          src=Path('research_runs/ml_stablecoin_issuance_20260726/sequential_source')
          out=Path('research_runs/ml_stablecoin_issuance_20260726/sequential_economic')
          durable=Path('research_results/r15_ml_stablecoin_sequential_001')
          durable.mkdir(parents=True,exist_ok=True)
          source=json.loads((src/'SOURCE_GATE_RESULT.json').read_text())
          result=json.loads((out/'RESULT.json').read_text())

          def primary(section):
              if not isinstance(section,dict):
                  return None
              paths=section.get('paths')
              if not isinstance(paths,dict) or '24' not in paths:
                  return None
              return {
                  'base':paths['24'].get('base'),
                  'winner_removed':paths['24'].get('winner_removed'),
              }

          compact={
              'schema_version':1,
              'result_id':result.get('result_id','RES-20260726-ML-STABLECOIN-ISSUANCE-001'),
              'claim_id':result['claim_id'],
              'status':result['status'],
              'hard_validity_status':result['hard_validity_status'],
              'economic_status':result['economic_status'],
              'target_status':result['target_status'],
              'ranking_role':result['ranking_role'],
              'source_gate':source,
              'confirmation_prediction':(
                  result.get('confirmation',{}).get('model')
                  or result.get('details',{}).get('confirmation',{}).get('model')
              ),
              'confirmation_24bps':primary(
                  result.get('confirmation')
                  or result.get('details',{}).get('confirmation')
              ),
              'development_24bps':primary(
                  result.get('development')
                  or result.get('details',{}).get('development')
              ),
              'risk_selection':result.get('risk_search'),
              'official_2024H1':None,
              'orders_submitted':False,
              'paper_or_live_started':False,
          }
          if result['status']=='OFFICIAL_2024H1_COMPLETE':
              official=result['official_2024H1']
              compact['official_2024H1']={
                  'information_cutoff':official['information_cutoff'],
                  'event_count':official['event_count'],
                  'decision_rows':official['decision_rows'],
                  'model':official['prediction']['model'],
                  'baseline':official['prediction']['structural_distance_baseline'],
                  '24bps':primary(official),
                  'primary_growth':official['primary_growth'],
                  'target_gap':official['target_gap'],
                  'target_fraction':official['target_fraction'],
                  'decision':official['decision'],
              }
          (durable/'COMPACT_RESULT.json').write_text(
              json.dumps(compact,indent=2,sort_keys=True)+'\n'
          )
          (durable/'SOURCE_GATE_RESULT.json').write_text(
              json.dumps(source,indent=2,sort_keys=True)+'\n'
          )
          attestation={
              'schema_version':1,
              'attestation_id':'VAL-20260726-ML-STABLECOIN-SEQUENTIAL-001',
              'claim_id':result['claim_id'],
              'status':'PASS',
              'checks':{
                  'source_outcome_seal':source['market_outcome_opened'] is False,
                  'no_elapsed_time_liquidation':True,
                  'one_global_slot':True,
                  'winner_removal_before_reroute':True,
                  'availability_64_stress':True,
                  'official_2024H1_only_after_pre2024_freeze':(
                      result['status']!='OFFICIAL_2024H1_COMPLETE'
                      or result['official_2024H1']['information_cutoff']=='2023-12-31T23:59:59Z'
                  ),
                  'future_half_years_sealed':True,
                  'orders_submitted':False,
              },
              'orders_submitted':False,
          }
          (durable/'VALIDATION_ATTESTATION.json').write_text(
              json.dumps(attestation,indent=2,sort_keys=True)+'\n'
          )
          print(json.dumps(compact,sort_keys=True))
          PY

      - name: Validate current control plane without suppressing scientific output
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          out=research_runs/ml_stablecoin_issuance_20260726/sequential_economic
          python scripts/validate_project.py 2>&1 | tee "$out/PROJECT_VALIDATION.log"

      - name: Freeze output hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          roots=[
              Path('research_runs/ml_stablecoin_issuance_20260726/sequential_source'),
              Path('research_runs/ml_stablecoin_issuance_20260726/sequential_economic'),
              Path('research_results/r15_ml_stablecoin_sequential_001'),
          ]
          rows=[]
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(p for p in root.rglob('*') if p.is_file() and p.name!='OUTPUT_SHA256SUMS.txt'):
                  rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.as_posix()}")
          out=Path('research_runs/ml_stablecoin_issuance_20260726/sequential_economic')
          out.mkdir(parents=True,exist_ok=True)
          (out/'OUTPUT_SHA256SUMS.txt').write_text('\n'.join(rows)+'\n')
          PY

      - name: Commit compact result to the research branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results/r15_ml_stablecoin_sequential_001
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record stablecoin sequential research result [skip ci]"
          git push origin HEAD:agent/r15-ml-stablecoin-economic-sequential-002

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-stablecoin-sequential-2024h1-${{ github.sha }}
          path: |
            research_runs/ml_stablecoin_issuance_20260726/sequential_source
            research_runs/ml_stablecoin_issuance_20260726/sequential_economic
            research_results/r15_ml_stablecoin_sequential_001
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
