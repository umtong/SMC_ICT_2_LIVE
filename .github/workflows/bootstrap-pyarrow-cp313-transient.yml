name: Transient natural-destination local bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/bootstrap-pyarrow-cp313-transient.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize exact parent source and download matching parquet reader
        run: |
          set -euo pipefail
          root=research/smc_core_expansion_single_policy_20260730
          python "$root/materialize.py"
          python -m py_compile "$root"/materialized/*.py
          python -m pip download --only-binary=:all: --no-deps 'pyarrow==25.0.0' -d wheel
          sha256sum wheel/* > wheel/SHA256SUMS
          find "$root/materialized" -maxdepth 1 -type f -print -exec sha256sum {} \;
          ls -lah wheel
      - uses: actions/upload-artifact@v4
        with:
          name: natural-destination-local-bootstrap
          path: |
            wheel
            research/smc_core_expansion_single_policy_20260730/materialized
            research/smc_core_expansion_single_policy_20260730/SOURCE_MANIFEST.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
