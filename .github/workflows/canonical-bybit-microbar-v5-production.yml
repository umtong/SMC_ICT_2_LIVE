name: Canonical Bybit V5 microbar production

on:
  pull_request:
    branches:
      - agent/r22-canonical-halfyear-market-data-001
    paths:
      - .github/workflows/canonical-bybit-microbar-v5-production.yml
  workflow_dispatch:

concurrency:
  group: canonical-bybit-v5-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pre-2024:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
        month:
          - "2021-01"
          - "2021-02"
          - "2021-03"
          - "2021-04"
          - "2021-05"
          - "2021-06"
          - "2021-07"
          - "2021-08"
          - "2021-09"
          - "2021-10"
          - "2021-11"
          - "2021-12"
          - "2022-01"
          - "2022-02"
          - "2022-03"
          - "2022-04"
          - "2022-05"
          - "2022-06"
          - "2022-07"
          - "2022-08"
          - "2022-09"
          - "2022-10"
          - "2022-11"
          - "2022-12"
          - "2023-01"
          - "2023-02"
          - "2023-03"
          - "2023-04"
          - "2023-05"
          - "2023-06"
          - "2023-07"
          - "2023-08"
          - "2023-09"
          - "2023-10"
          - "2023-11"
          - "2023-12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - id: build
        name: Build and verify monthly V5 shard
        shell: bash
        run: |
          set -euo pipefail
          python scripts/market_data/build_public_trade_compact.py \
            --symbol "${{ matrix.symbol }}" \
            --month "${{ matrix.month }}" \
            --out artifact
          shard="artifact/PRE_2024/${{ matrix.symbol }}/${{ matrix.month }}"
          python scripts/market_data/repack_public_trade_compact_v5.py "$shard"
          python scripts/market_data/verify_public_trade_compact_v5.py "$shard" \
            | tee "$shard/VERIFICATION.json"
          find "$shard" -type f -printf '%P\t%s\n' | sort \
            | tee "$shard/FILE_SIZES.tsv"
          parquet="$shard/micro_bars/500ms_observed_v5.parquet"
          if [[ -f "$parquet" ]] && [[ "$(stat -c %s "$parquet")" -ge 104857600 ]]; then
            echo "V5 parquet exceeds Drive transfer limit: $parquet" >&2
            exit 1
          fi
          echo "shard=$shard" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-bybit-sparse500-v5-${{ matrix.symbol }}-${{ matrix.month }}
          path: ${{ steps.build.outputs.shard }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
        month:
          - "2024-01"
          - "2024-02"
          - "2024-03"
          - "2024-04"
          - "2024-05"
          - "2024-06"
          - "2024-07"
          - "2024-08"
          - "2024-09"
          - "2024-10"
          - "2024-11"
          - "2024-12"
          - "2025-01"
          - "2025-02"
          - "2025-03"
          - "2025-04"
          - "2025-05"
          - "2025-06"
          - "2025-07"
          - "2025-08"
          - "2025-09"
          - "2025-10"
          - "2025-11"
          - "2025-12"
          - "2026-01"
          - "2026-02"
          - "2026-03"
          - "2026-04"
          - "2026-05"
          - "2026-06"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - id: build
        name: Build and verify monthly V5 shard
        shell: bash
        run: |
          set -euo pipefail
          month="${{ matrix.month }}"
          year="${month%%-*}"
          number="${month##*-}"
          if [[ "$year" == "2024" && "$number" -le 6 ]]; then
            segment="2024_H1"
          elif [[ "$year" == "2024" ]]; then
            segment="2024_H2"
          elif [[ "$year" == "2025" && "$number" -le 6 ]]; then
            segment="2025_H1"
          elif [[ "$year" == "2025" ]]; then
            segment="2025_H2"
          else
            segment="2026_H1"
          fi
          python scripts/market_data/build_public_trade_compact.py \
            --symbol "${{ matrix.symbol }}" \
            --month "$month" \
            --out artifact
          shard="artifact/$segment/${{ matrix.symbol }}/$month"
          python scripts/market_data/repack_public_trade_compact_v5.py "$shard"
          python scripts/market_data/verify_public_trade_compact_v5.py "$shard" \
            | tee "$shard/VERIFICATION.json"
          find "$shard" -type f -printf '%P\t%s\n' | sort \
            | tee "$shard/FILE_SIZES.tsv"
          parquet="$shard/micro_bars/500ms_observed_v5.parquet"
          if [[ -f "$parquet" ]] && [[ "$(stat -c %s "$parquet")" -ge 104857600 ]]; then
            echo "V5 parquet exceeds Drive transfer limit: $parquet" >&2
            exit 1
          fi
          echo "shard=$shard" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-bybit-sparse500-v5-${{ matrix.symbol }}-${{ matrix.month }}
          path: ${{ steps.build.outputs.shard }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
