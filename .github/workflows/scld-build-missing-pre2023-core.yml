name: SCLD build missing pre-2023 canonical core

on:
  workflow_dispatch:
  push:
    branches: [agent/independent-scld-live-001]
    paths:
      - .github/workflows/scld-build-missing-pre2023-core.yml
  pull_request:
    branches: [agent/r22-canonical-halfyear-market-data-001]
    paths:
      - .github/workflows/scld-build-missing-pre2023-core.yml

permissions:
  contents: read

concurrency:
  group: scld-build-missing-pre2023-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  BYBIT_PUBLIC_BASE_URL: https://api.manepa.jp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        segment: [PRE_2024_2021, PRE_2024_2022]
        symbol: [BTCUSDT, ETHUSDT]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install canonical data runtime
        run: python -m pip install .
      - name: Build only the verified-missing shard
        run: |
          python scripts/market_data/build_canonical_bybit.py \
            --segment "${{ matrix.segment }}" \
            --symbol "${{ matrix.symbol }}" \
            --base-url "$BYBIT_PUBLIC_BASE_URL" \
            --timeout 30 \
            --max-attempts 8 \
            --min-request-interval 0.10 \
            --out artifact
      - name: Verify immutable shard
        run: |
          python scripts/market_data/verify_canonical_bybit.py \
            "artifact/${{ matrix.segment }}/${{ matrix.symbol }}" \
            | tee "artifact/${{ matrix.segment }}/${{ matrix.symbol }}/VERIFICATION.json"
      - name: Upload canonical shard
        uses: actions/upload-artifact@v4
        with:
          name: scld-canonical-${{ matrix.segment }}-${{ matrix.symbol }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifact/${{ matrix.segment }}/${{ matrix.symbol }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
