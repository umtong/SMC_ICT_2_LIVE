name: ML intermarket SMT first passage

on:
  pull_request:
    branches: [main]
    paths:
      - "research/ml_intermarket_smt_20260726/**"
      - ".github/workflows/ml-intermarket-smt-r11.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-intermarket-smt-r11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frozen environments
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "scikit-learn==1.6.1" \
            "pytest==8.3.4"
          mkdir -p "$RUNNER_TEMP/dukascopy-node"
          npm install \
            --prefix "$RUNNER_TEMP/dukascopy-node" \
            --no-audit \
            --no-fund \
            "dukascopy-node@1.46.4"
          echo "NODE_PATH=$RUNNER_TEMP/dukascopy-node/node_modules" >> "$GITHUB_ENV"

      - name: Reconstruct, apply attested pre-outcome fix, compile and run causal tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_intermarket_smt_20260726
          python "$root/reconstruct.py"
          python "$root/apply_pre_outcome_fix.py"
          python -m py_compile "$root/run.py" "$root/test_run.py" "$root/apply_pre_outcome_fix.py"
          PYTHONPATH="$root" pytest -q "$root/test_run.py"
          PYTHONPATH="$root" python "$root/run.py" --self-test
          python scripts/validate_project.py

      - name: Record frozen Dukascopy runtime probe
        shell: bash
        run: |
          set -euo pipefail
          out=research_runs/ml_intermarket_smt_20260726/r11
          mkdir -p "$out"
          {
            node --version
            node -e 'const m=require("dukascopy-node"); const needed=["getHistoricalRates","instrumentMetaData"]; for (const k of needed) { if (!(k in m)) throw new Error(`missing export ${k}`); } console.log(JSON.stringify({resolved:require.resolve("dukascopy-node"),exports:Object.keys(m),authoritative_source_validation:"frozen annual run"}))'
            echo 'The redundant one-day network probe is diagnostic-only under CORRECTION_002; the frozen annual run remains fail-closed and validates every required market source before model fitting.'
          } 2>&1 | tee "$out/DUKASCOPY_PROBE.log"

      - name: Run frozen 2022 fit and conditional untouched 2023 development
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_intermarket_smt_20260726
          out=research_runs/ml_intermarket_smt_20260726/r11
          cache="$RUNNER_TEMP/ml-intermarket-smt-cache"
          mkdir -p "$out"
          python - <<'PY'
          import json, platform, subprocess, sys
          from pathlib import Path
          import numpy, pandas, requests, sklearn
          out=Path('research_runs/ml_intermarket_smt_20260726/r11')
          out.mkdir(parents=True, exist_ok=True)
          node_version=subprocess.check_output(['node','--version'],text=True).strip()
          (out/'ENVIRONMENT.json').write_text(json.dumps({
              'python':sys.version,
              'node':node_version,
              'platform':platform.platform(),
              'numpy':numpy.__version__,
              'pandas':pandas.__version__,
              'requests':requests.__version__,
              'scikit_learn':sklearn.__version__,
              'dukascopy_node':'1.46.4',
              'claim_id':'CLM-20260726-1740-ML-INTERMARKET-SMT-001',
              'engine_version':'ML-INTERMARKET-SMT-FIRST-PASSAGE-V1',
              'orders_submitted':False,
              'paper_live_started':False,
              '2024_opened':False,
              '2025_opened':False,
              '2026_opened':False
          },indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          PYTHONPATH="$root" python "$root/run.py" \
            --output "$out" \
            --cache "$cache" \
            2>&1 | tee "$out/RUN.log"

      - name: Record immutable checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_intermarket_smt_20260726
          out=research_runs/ml_intermarket_smt_20260726/r11
          mkdir -p "$out"
          sha256sum \
            "$root/WORK_CLAIM.json" \
            "$root/preregistration.json" \
            "$root/CORRECTION_001_COOLDOWN_SENTINEL_BEFORE_OUTCOME.json" \
            "$root/CORRECTION_002_REDUNDANT_PROBE_NONBLOCKING_BEFORE_OUTCOME.json" \
            "$root/README.md" \
            "$root/SOURCES.md" \
            "$root/download_dukascopy.js" \
            "$root/reconstruct.py" \
            "$root/apply_pre_outcome_fix.py" \
            "$root/run_py.gz.b64.part00" \
            "$root/run_py.gz.b64.part01" \
            "$root/run.py" \
            "$root/test_run.py" \
            > "$out/INPUT_SHA256SUMS.txt"
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-intermarket-smt-r11-${{ github.sha }}
          path: research_runs/ml_intermarket_smt_20260726/r11
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
