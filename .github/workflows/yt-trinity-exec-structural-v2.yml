name: YT Trinity exact-account structural runner v2

on:
  push:
    branches: [agent/r22-yt-trinity-ml-exec-001]
    paths:
      - .github/workflows/yt-trinity-exec-structural-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-exec-structural-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deterministic stack
        run: python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'pyarrow==19.0.1'
      - name: Download immutable inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_artifact() { curl --fail --silent --show-error --location -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"; }
          mkdir -p input/{labels,btc2023,eth2023,btc2024,eth2024,official} output
          fetch_artifact 8643192491 /tmp/labels.zip; fetch_artifact 8636781702 /tmp/btc2023.zip; fetch_artifact 8636761741 /tmp/eth2023.zip; fetch_artifact 8636867995 /tmp/btc2024.zip; fetch_artifact 8636882043 /tmp/eth2024.zip; fetch_artifact 8644460717 /tmp/official.zip
          unzip -q /tmp/labels.zip -d input/labels; unzip -q /tmp/btc2023.zip -d input/btc2023; unzip -q /tmp/eth2023.zip -d input/eth2023; unzip -q /tmp/btc2024.zip -d input/btc2024; unzip -q /tmp/eth2024.zip -d input/eth2024; unzip -q /tmp/official.zip -d input/official
          find input -type f | sort > output/INPUT_FILES.txt
      - name: Resolve exact paths
        run: |
          set -euo pipefail
          find input/labels -name EVENT_LABELS.pkl.gz -print -quit > /tmp/labels; find input/official -name FROZEN_PERIOD_RESULT.json -print -quit > /tmp/official
          for pair in 'btc2023 btc_2023' 'eth2023 eth_2023' 'btc2024 btc_2024h1' 'eth2024 eth_2024h1'; do set -- $pair; root=$1; key=$2; find input/$root -path '*/trade_bars/1m.parquet' -print -quit > /tmp/${key}_bars; find input/$root -path '*/streams/mark_price_1m.parquet' -print -quit > /tmp/${key}_marks; find input/$root -path '*/streams/funding_events.parquet' -print -quit > /tmp/${key}_funding; test -s /tmp/${key}_bars && test -s /tmp/${key}_marks && test -s /tmp/${key}_funding; done
          test -s /tmp/labels && test -s /tmp/official
      - name: Execute exact-account H1/H2/frozen path
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set +e
          python -m py_compile research/yt_trinity_ml/run_quality_structural_runner_v1.py research/yt_trinity_ml/run_quality_structural_runner_v2.py
          compile=$?; if [[ $compile != 0 ]]; then echo $compile > output/EXIT_CODE.txt; exit 0; fi
          python research/yt_trinity_ml/run_quality_structural_runner_v2.py --labels "$(cat /tmp/labels)" --frozen-pointer research/yt_trinity_ml/FROZEN_2024H1_V2_POINTER.json --official-result "$(cat /tmp/official)" --output output \
            --btc-2023-bars "$(cat /tmp/btc_2023_bars)" --btc-2023-marks "$(cat /tmp/btc_2023_marks)" --btc-2023-funding "$(cat /tmp/btc_2023_funding)" --eth-2023-bars "$(cat /tmp/eth_2023_bars)" --eth-2023-marks "$(cat /tmp/eth_2023_marks)" --eth-2023-funding "$(cat /tmp/eth_2023_funding)" \
            --btc-2024h1-bars "$(cat /tmp/btc_2024h1_bars)" --btc-2024h1-marks "$(cat /tmp/btc_2024h1_marks)" --btc-2024h1-funding "$(cat /tmp/btc_2024h1_funding)" --eth-2024h1-bars "$(cat /tmp/eth_2024h1_bars)" --eth-2024h1-marks "$(cat /tmp/eth_2024h1_marks)" --eth-2024h1-funding "$(cat /tmp/eth_2024h1_funding)" 2>&1 | tee output/RUN_STDOUT.log
          echo ${PIPESTATUS[0]} > output/EXIT_CODE.txt
          exit 0
      - name: Persist isolated pointer
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('output'); p=root/'QUALITY_STRUCTURAL_RUNNER_V2_RESULT.json'; result=json.loads(p.read_text()) if p.exists() else None; code=int((root/'EXIT_CODE.txt').read_text()) if (root/'EXIT_CODE.txt').exists() else 99; log=(root/'RUN_STDOUT.log').read_text(errors='replace') if (root/'RUN_STDOUT.log').exists() else ''
          valid=bool(result and result.get('baseline_crosscheck',{}).get('valid'))
          payload={'schema_version':2,'run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'exit_code':code,'status':'valid' if valid and code==0 else 'invalid_or_execution_failure','result':result,'result_sha256':hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None,'stdout_tail':log[-16000:]}
          Path('research/yt_trinity_ml/EXEC_STRUCTURAL_V2_POINTER.json').write_text(json.dumps(payload,indent=2,sort_keys=True,default=str)+'\n')
          PY
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com; git add research/yt_trinity_ml/EXEC_STRUCTURAL_V2_POINTER.json
          if ! git diff --cached --quiet; then git commit -m "Record exact structural v2 ${GITHUB_RUN_ID}"; for i in 1 2 3 4 5; do git pull --rebase origin agent/r22-yt-trinity-ml-exec-001 && git push origin HEAD:agent/r22-yt-trinity-ml-exec-001 && break || sleep $((i*3)); done; fi
      - name: Upload evidence
        if: always()
        run: (cd output && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-exec-structural-v2-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Enforce exact baseline
        if: always()
        run: test "$(cat output/EXIT_CODE.txt 2>/dev/null || echo 99)" = 0
