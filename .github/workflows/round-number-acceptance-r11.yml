name: Round-number acceptance fatal screen

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r11-round-number-acceptance-001
    paths:
      - "research/round_number_acceptance_20260726/**"
      - ".github/workflows/round-number-acceptance-r11.yml"
  pull_request:
    paths:
      - "research/round_number_acceptance_20260726/**"
      - ".github/workflows/round-number-acceptance-r11.yml"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  NUMEXPR_NUM_THREADS: "2"

jobs:
  fatal-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 pandas==2.2.3 requests==2.32.4

      - name: Compile and run causal self-tests
        run: |
          python -m py_compile \
            research/round_number_acceptance_20260726/run_screen.py \
            research/round_number_acceptance_20260726/run_screen_v2.py
          python research/round_number_acceptance_20260726/run_screen_v2.py self-test

      - name: Cache immutable public Bybit archives
        uses: actions/cache@v4
        with:
          path: research_runs/round_number_acceptance/cache
          key: round-number-bybit-trades-v2-raw-gzip-btceth-20230115-20231119

      - name: Prefetch exact raw gzip bytes and verify transport encoding
        run: |
          set -euo pipefail
          dates=(2023-01-15 2023-03-19 2023-05-21 2023-07-16 2023-09-17 2023-11-19)
          symbols=(BTCUSDT ETHUSDT)
          for symbol in "${symbols[@]}"; do
            mkdir -p "research_runs/round_number_acceptance/cache/${symbol}"
            for date in "${dates[@]}"; do
              file="${symbol}${date}.csv.gz"
              path="research_runs/round_number_acceptance/cache/${symbol}/${file}"
              magic=""
              if [[ -s "${path}" ]]; then
                magic="$(od -An -tx1 -N2 "${path}" | tr -d ' \n')"
              fi
              if [[ "${magic}" == "1f8b" ]]; then
                continue
              fi
              rm -f "${path}" "${path}.part"
              curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 600 --raw \
                "https://public.bybit.com/trading/${symbol}/${file}" \
                --output "${path}.part"
              magic="$(od -An -tx1 -N2 "${path}.part" | tr -d ' \n')"
              test "${magic}" = "1f8b"
              mv "${path}.part" "${path}"
            done
          done

      - name: Run frozen 576-candidate fatal screen
        run: |
          rm -rf research_runs/round_number_acceptance/output
          mkdir -p research_runs/round_number_acceptance/output
          python research/round_number_acceptance_20260726/run_screen_v2.py run \
            --cache research_runs/round_number_acceptance/cache \
            --output research_runs/round_number_acceptance/output \
            2>&1 | tee research_runs/round_number_acceptance/run.log

      - name: Attach exact source and preregistration to evidence bundle
        run: |
          cp research/round_number_acceptance_20260726/run_screen.py research_runs/round_number_acceptance/output/RUN_SCREEN.py
          cp research/round_number_acceptance_20260726/run_screen_v2.py research_runs/round_number_acceptance/output/RUN_SCREEN_V2.py
          cp research/round_number_acceptance_20260726/preregistration.json research_runs/round_number_acceptance/output/PREREGISTRATION.json
          cp research/round_number_acceptance_20260726/WORK_CLAIM.json research_runs/round_number_acceptance/output/WORK_CLAIM.json
          cp research/round_number_acceptance_20260726/README.md research_runs/round_number_acceptance/output/README.md
          cd research_runs/round_number_acceptance/output
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: round-number-acceptance-${{ github.sha }}
          path: research_runs/round_number_acceptance
          if-no-files-found: error
          retention-days: 30
