name: YT Trinity corpus-bound system contract

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/SELECTED_CONTENT_CORPUS_POINTER.json
      - research/yt_trinity_ml/CISD_BPR_IFVG_RUN_POINTER.json
      - research/yt_trinity_ml/COMPRESSION_BPR_RUN_POINTER.json
      - research/yt_trinity_ml/SMT_CISD_RUN_POINTER.json
      - research/yt_trinity_ml/IFVG_FAILURE_RUN_POINTER.json
      - research/yt_trinity_ml/HTF_OTE_RUN_POINTER.json
      - research/yt_trinity_ml/synthesize_corpus_system_contract.py
      - .github/workflows/yt-trinity-corpus-system-contract.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-corpus-system-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      run_id: ${{ steps.gate.outputs.run_id }}
      artifact_name: ${{ steps.gate.outputs.artifact_name }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('research/yt_trinity_ml/SELECTED_CONTENT_CORPUS_POINTER.json')
          authorized = False
          run_id = ''
          artifact_name = ''
          reason = 'content authority pointer missing'
          if path.exists():
              payload = json.loads(path.read_text(encoding='utf-8'))
              selected = payload.get('selected')
              if payload.get('decision') == 'COMPLETE_CONTENT_AUTHORITY_SELECTED' and isinstance(selected, dict):
                  run_id = str(selected.get('run_id') or '')
                  artifact_name = str(selected.get('artifact_name') or '')
                  authorized = bool(run_id and artifact_name)
                  reason = 'authorized' if authorized else 'selected authority lacks run/artifact identifiers'
              else:
                  reason = str(payload.get('decision') or 'no selected content authority')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"authorized={'true' if authorized else 'false'}\n")
              handle.write(f"run_id={run_id}\n")
              handle.write(f"artifact_name={artifact_name}\n")
              handle.write(f"reason={reason}\n")
          print(json.dumps({'authorized': authorized, 'run_id': run_id, 'artifact_name': artifact_name, 'reason': reason}, indent=2))
          PY

  freeze:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download exact complete content authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact/content-authority
          gh run download "${{ needs.authorize.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ needs.authorize.outputs.artifact_name }}" \
            --dir artifact/content-authority
          find artifact/content-authority -type f -maxdepth 8 -print | head -200
      - name: Ensure timestamp-addressable ontology exists
        run: |
          root="$(find artifact/content-authority -type f -name videos.jsonl -printf '%h\n' | while read -r dir; do if [[ -f "$dir/manifest.json" ]]; then echo "$dir"; fi; done | head -1)"
          if [[ -z "$root" ]]; then echo 'complete corpus root not found' >&2; exit 1; fi
          if [[ ! -f "$root/rule_ontology_candidates.json" || ! -f "$root/rule_evidence_windows.jsonl" ]]; then
            python research/yt_trinity_ml/build_concept_index.py --corpus "$root"
            python research/yt_trinity_ml/extract_rule_ontology.py --corpus "$root"
          fi
      - name: Synthesize corpus support and pre-2024-only contract
        run: |
          mkdir -p artifact/contract
          python research/yt_trinity_ml/synthesize_corpus_system_contract.py \
            --corpus-download artifact/content-authority \
            --content-pointer research/yt_trinity_ml/SELECTED_CONTENT_CORPUS_POINTER.json \
            --route-pointer-root research/yt_trinity_ml \
            --output artifact/contract/CORPUS_BOUND_SYSTEM_CONTRACT.json
      - uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-corpus-system-contract-${{ github.sha }}
          path: artifact/contract
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
      - name: Persist frozen or waiting contract
        run: |
          cp artifact/contract/CORPUS_BOUND_SYSTEM_CONTRACT.json research/yt_trinity_ml/CORPUS_BOUND_SYSTEM_CONTRACT.json
          cp artifact/contract/CORPUS_BOUND_SYSTEM_CONTRACT.json.sha256 research/yt_trinity_ml/CORPUS_BOUND_SYSTEM_CONTRACT.json.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/yt_trinity_ml/CORPUS_BOUND_SYSTEM_CONTRACT.json \
            research/yt_trinity_ml/CORPUS_BOUND_SYSTEM_CONTRACT.json.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Freeze YT Trinity corpus-bound pre-2024 contract ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

  skip:
    needs: authorize
    if: needs.authorize.outputs.authorized != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Corpus-bound contract not authorized: ${{ needs.authorize.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
