name: Liquidation refill causal screen

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/liquidation-refill-v1.yml"
      - "research/liquidation_refill_v1/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquidation-refill-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  OUT: ${{ github.workspace }}/research_runs/liquidation_refill_v1
  CACHE: ${{ github.workspace }}/research_cache/liquidation_refill_v1

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pytest==8.3.4
      - name: Run causal and account invariants
        working-directory: research/liquidation_refill_v1
        run: python -m pytest -q

  source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify one public liquidation sample and official price archive
        run: |
          set -euo pipefail
          mkdir -p "$OUT/source_probe"
          cd "$OUT/source_probe"
          liq_url="https://datasets.tardis.dev/v1/binance-futures/liquidations/2021/09/01/PERPETUALS.csv.gz"
          curl -L --fail --silent --show-error --retry 4 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            --user-agent 'SMC-ICT-2-LIVE-liquidation-research/1.0' \
            -o PERPETUALS.csv.gz "$liq_url"
          gzip -t PERPETUALS.csv.gz
          gzip -cd PERPETUALS.csv.gz | sed -n '1,12p' > liquidations_head.csv
          gzip -cd PERPETUALS.csv.gz | awk -F, 'NR==1 || $2=="BTCUSDT" || $2=="ETHUSDT" || $2=="SOLUSDT" || $2=="XRPUSDT"' | sed -n '1,25p' > target_assets_head.csv
          sha256sum PERPETUALS.csv.gz > SOURCE_SHA256SUMS.txt

          file="BTCUSDT-1m-2021-09-01.zip"
          price_url="https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/1m/$file"
          curl -L --fail --silent --show-error --retry 4 --retry-all-errors \
            --connect-timeout 30 --max-time 600 -o "$file" "$price_url"
          curl -L --fail --silent --show-error --retry 4 --retry-all-errors \
            --connect-timeout 30 --max-time 120 -o "$file.CHECKSUM" "$price_url.CHECKSUM"
          sha256sum -c "$file.CHECKSUM"
          unzip -p "$file" | sed -n '1,6p' > btcusdt_1m_head.csv
          sha256sum "$file" >> SOURCE_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquidation-refill-source-probe-${{ github.sha }}
          path: research_runs/liquidation_refill_v1/source_probe
          if-no-files-found: error
          retention-days: 30

  screen:
    needs: [unit, source-probe]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pytest==8.3.4
      - uses: actions/cache@v4
        with:
          path: research_cache/liquidation_refill_v1
          key: liquidation-refill-v1-${{ runner.os }}-${{ hashFiles('research/liquidation_refill_v1/preregistration.json') }}
          restore-keys: |
            liquidation-refill-v1-${{ runner.os }}-
      - name: Run preregistered fit and development screen
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$CACHE"
          python research/liquidation_refill_v1/run.py \
            --preregistration research/liquidation_refill_v1/preregistration.json \
            --output "$OUT" \
            --cache "$CACHE" | tee "$OUT/run.log"
      - name: Assert research-only and sealed-period state
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ["OUT"])
          out.mkdir(parents=True, exist_ok=True)
          summary_path = out / "summary.json"
          if not summary_path.exists():
              status = {
                  "hard_validity": "INCOMPLETE",
                  "orders_submitted": False,
                  "paper_live_enabled": False,
                  "final_2026_opened": False,
                  "reason": "screen did not produce summary.json",
              }
              (out / "wrapper_status.json").write_text(json.dumps(status, indent=2, sort_keys=True))
              raise SystemExit("missing summary.json")
          summary = json.loads(summary_path.read_text())
          assert summary["orders_submitted"] is False
          assert summary["paper_live_enabled"] is False
          assert summary["confirmation_2025_opened"] is False
          assert summary["final_2026_opened"] is False
          assert summary["official_target_met"] is False
          status = {
              "hard_validity": summary["hard_validity"],
              "status": summary["status"],
              "orders_submitted": False,
              "paper_live_enabled": False,
              "final_2026_opened": False,
          }
          (out / "wrapper_status.json").write_text(json.dumps(status, indent=2, sort_keys=True))
          PY
      - name: Record immutable output hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          find "$OUT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquidation-refill-screen-${{ github.sha }}
          path: research_runs/liquidation_refill_v1
          if-no-files-found: error
          retention-days: 30
