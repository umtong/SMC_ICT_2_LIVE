name: Recover exact sponsored-delivery Core source

on:
  push:
    branches: [agent/r37-sponsored-core-source-recovery-001]
    paths:
      - '.github/workflows/recover-sponsored-core-source-r37.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-sponsored-core-r37-${{ github.sha }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r37-sponsored-core-source-recovery-001
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover exact SHA-bound source using original materializer
        shell: bash
        run: |
          set -euo pipefail
          commit=56c7baf4fa7d809d0ee9e471267c6ed5cbf1b543
          src=research/xvenue_sponsorship_core_expansion_20260730
          tmp="$RUNNER_TEMP/sponsored_source"
          dst=research/sponsored_delivery_core_official/recovered_source
          git fetch --depth=1 origin "$commit"
          rm -rf "$tmp" "$dst"
          mkdir -p "$tmp" "$dst"
          for f in SOURCE_BUNDLE.tar.gz.b64 SOURCE_MANIFEST.json CONTRACT.json RESULT.json RESULT_FULL.json.gz.b64 REPORT.md VALIDATION_ATTESTATION.json materialize.py; do
            git show "$commit:$src/$f" > "$tmp/$f"
          done
          (cd "$tmp" && python materialize.py)
          python -m py_compile "$tmp"/materialized/*.py
          cp "$tmp"/materialized/*.py "$dst"/
          cp "$tmp"/SOURCE_MANIFEST.json "$tmp"/CONTRACT.json "$tmp"/RESULT.json "$tmp"/REPORT.md "$tmp"/VALIDATION_ATTESTATION.json "$dst"/
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('research/sponsored_delivery_core_official/recovered_source')
          files={}
          for p in sorted(root.iterdir()):
              if p.is_file():
                  files[p.name]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          out={
              'source_commit':'56c7baf4fa7d809d0ee9e471267c6ed5cbf1b543',
              'archive_sha256':'0ea2750a9e089a2b4d9e994deb3f5903da4ae589a57522fcd13a7c023b5d8131',
              'files':files,
              'scientific_change':False,
          }
          (root/'RECOVERY_MANIFEST.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Commit recovered audit dependency
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/sponsored_delivery_core_official/recovered_source
          if git diff --cached --quiet; then
            echo 'Recovered source unchanged'
          else
            git commit -m 'Recover exact sponsored-delivery Core source'
            git push origin HEAD:agent/r37-sponsored-core-source-recovery-001
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sponsored-delivery-core-recovered-source-${{ github.run_id }}
          path: research/sponsored_delivery_core_official/recovered_source
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
