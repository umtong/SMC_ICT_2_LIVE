name: Recover sponsored-delivery Core authority

on:
  push:
    branches: [agent/r37-sponsored-core-source-recovery-001]
    paths:
      - '.github/workflows/recover-sponsored-core-source-r37.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/recover-sponsored-core-source-r37.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-sponsored-core-r37-${{ github.sha }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r37-sponsored-core-source-recovery-001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit result and source carriers
        shell: bash
        run: |
          set -euo pipefail
          commit=56c7baf4fa7d809d0ee9e471267c6ed5cbf1b543
          src=research/xvenue_sponsorship_core_expansion_20260730
          tmp="$RUNNER_TEMP/sponsored_authority"
          dst=research/sponsored_delivery_core_official/recovered_authority
          git fetch --depth=1 origin "$commit"
          rm -rf "$tmp" "$dst"
          mkdir -p "$tmp" "$dst"
          for f in SOURCE_BUNDLE.tar.gz.b64 SOURCE_MANIFEST.json CONTRACT.json RESULT.json RESULT_FULL.json.gz.b64 REPORT.md VALIDATION_ATTESTATION.json materialize.py; do
            git show "$commit:$src/$f" > "$tmp/$f"
          done
          cp "$tmp"/SOURCE_MANIFEST.json "$tmp"/CONTRACT.json "$tmp"/RESULT.json "$tmp"/REPORT.md "$tmp"/VALIDATION_ATTESTATION.json "$dst"/
          python - <<'PY'
          import base64, gzip, hashlib, json, os, re
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])/'sponsored_authority'
          dst=Path('research/sponsored_delivery_core_official/recovered_authority')
          manifest=json.loads((tmp/'SOURCE_MANIFEST.json').read_text())
          audit={'source_commit':'56c7baf4fa7d809d0ee9e471267c6ed5cbf1b543','scientific_change':False}

          def valid_chars(path):
              text=path.read_text(encoding='utf-8-sig')
              return ''.join(re.findall(r'[A-Za-z0-9+/=]',text)), len(text.encode())

          # Audit and opportunistically recover the full result.
          rv, rbytes=valid_chars(tmp/'RESULT_FULL.json.gz.b64')
          audit['result_carrier_file_bytes']=rbytes
          audit['result_valid_base64_chars']=len(rv)
          audit['result_declared_base64_bytes']=int(manifest['result_hashes']['RESULT_FULL.json.gz.b64']['base64_bytes'])
          try:
              rgz=base64.b64decode(rv + '='*((-len(rv))%4))
              audit['result_gzip_bytes']=len(rgz)
              audit['result_gzip_sha256']=hashlib.sha256(rgz).hexdigest()
              raw=gzip.decompress(rgz)
              json.loads(raw)
              audit['result_uncompressed_bytes']=len(raw)
              audit['result_uncompressed_sha256']=hashlib.sha256(raw).hexdigest()
              audit['full_result_recovered']=True
              (dst/'RESULT_FULL.json').write_bytes(raw)
          except Exception as exc:
              audit['full_result_recovered']=False
              audit['result_error']=repr(exc)

          sv, sbytes=valid_chars(tmp/'SOURCE_BUNDLE.tar.gz.b64')
          declared=int(manifest['source_bundle']['base64_bytes'])
          audit.update({
              'source_carrier_file_bytes':sbytes,
              'declared_source_base64_bytes':declared,
              'observed_valid_source_base64_chars':len(sv),
              'missing_source_base64_chars':declared-len(sv),
              'source_materializable':False,
              'source_reason':'stored source carrier is truncated; exact source cannot be reconstructed from this file',
          })
          (dst/'CARRIER_AUTHORITY_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          print(json.dumps(audit,indent=2,sort_keys=True))
          PY

      - name: Commit recovered authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/sponsored_delivery_core_official/recovered_authority
          if git diff --cached --quiet; then
            echo 'Recovered authority unchanged'
          else
            git commit -m 'Audit sponsored Core carriers and recover available authority'
            git push origin HEAD:agent/r37-sponsored-core-source-recovery-001
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sponsored-delivery-core-recovered-authority-${{ github.run_id }}
          path: research/sponsored_delivery_core_official/recovered_authority
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
