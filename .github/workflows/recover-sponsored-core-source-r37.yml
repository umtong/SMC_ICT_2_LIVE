name: Recover sponsored-delivery Core authority

on:
  push:
    branches: [agent/r37-sponsored-core-source-recovery-001]
    paths:
      - '.github/workflows/recover-sponsored-core-source-r37.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/recover-sponsored-core-source-r37.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-sponsored-core-r37-${{ github.sha }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r37-sponsored-core-source-recovery-001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover exact full result and audit source carrier
        shell: bash
        run: |
          set -euo pipefail
          commit=56c7baf4fa7d809d0ee9e471267c6ed5cbf1b543
          src=research/xvenue_sponsorship_core_expansion_20260730
          tmp="$RUNNER_TEMP/sponsored_authority"
          dst=research/sponsored_delivery_core_official/recovered_authority
          git fetch --depth=1 origin "$commit"
          rm -rf "$tmp" "$dst"
          mkdir -p "$tmp" "$dst"
          for f in SOURCE_BUNDLE.tar.gz.b64 SOURCE_MANIFEST.json CONTRACT.json RESULT.json RESULT_FULL.json.gz.b64 REPORT.md VALIDATION_ATTESTATION.json materialize.py; do
            git show "$commit:$src/$f" > "$tmp/$f"
          done
          cp "$tmp"/SOURCE_MANIFEST.json "$tmp"/CONTRACT.json "$tmp"/RESULT.json "$tmp"/REPORT.md "$tmp"/VALIDATION_ATTESTATION.json "$dst"/
          python - <<'PY'
          import base64, gzip, hashlib, json, re
          from pathlib import Path
          tmp=Path(__import__('os').environ['RUNNER_TEMP'])/'sponsored_authority'
          dst=Path('research/sponsored_delivery_core_official/recovered_authority')
          manifest=json.loads((tmp/'SOURCE_MANIFEST.json').read_text())

          # RESULT_FULL carrier is independently complete and authoritative.
          rb64=''.join((tmp/'RESULT_FULL.json.gz.b64').read_text(encoding='utf-8-sig').split())
          rgz=base64.b64decode(rb64)
          assert hashlib.sha256(rgz).hexdigest()==manifest['result_hashes']['RESULT_FULL.json.gz.b64']['archive_sha256']
          raw=gzip.decompress(rgz)
          assert len(raw)==manifest['result_hashes']['RESULT_FULL.json.gz.b64']['uncompressed_bytes']
          assert hashlib.sha256(raw).hexdigest()==manifest['result_hashes']['RESULT_FULL.json.gz.b64']['uncompressed_sha256']
          (dst/'RESULT_FULL.json').write_bytes(raw)

          # The source carrier itself is truncated in Git; record rather than hide it.
          text=(tmp/'SOURCE_BUNDLE.tar.gz.b64').read_text(encoding='utf-8-sig')
          valid=''.join(re.findall(r'[A-Za-z0-9+/=]',text))
          declared=int(manifest['source_bundle']['base64_bytes'])
          audit={
            'source_commit':'56c7baf4fa7d809d0ee9e471267c6ed5cbf1b543',
            'declared_source_base64_bytes':declared,
            'observed_valid_source_base64_chars':len(valid),
            'missing_source_base64_chars':declared-len(valid),
            'source_materializable':False,
            'reason':'stored source carrier is truncated; exact source cannot be reconstructed from this file',
            'full_result_recovered':True,
            'full_result_sha256':hashlib.sha256(raw).hexdigest(),
            'scientific_change':False,
          }
          assert audit['missing_source_base64_chars']>0
          (dst/'SOURCE_AUTHORITY_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          print(json.dumps(audit,indent=2,sort_keys=True))
          PY

      - name: Commit recovered authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/sponsored_delivery_core_official/recovered_authority
          if git diff --cached --quiet; then
            echo 'Recovered authority unchanged'
          else
            git commit -m 'Recover sponsored Core full result authority'
            git push origin HEAD:agent/r37-sponsored-core-source-recovery-001
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sponsored-delivery-core-recovered-authority-${{ github.run_id }}
          path: research/sponsored_delivery_core_official/recovered_authority
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
