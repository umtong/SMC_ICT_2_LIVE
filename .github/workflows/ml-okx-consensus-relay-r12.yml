name: Minimal ML OKX spot-swap consensus relay

on:
  push:
    branches:
      - agent/r12-ml-okx-consensus-relay-001
    paths:
      - "research/ml_okx_consensus_relay_20260726/**"
      - ".github/workflows/ml-okx-consensus-relay-r12.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/ml_okx_consensus_relay_20260726/**"
      - ".github/workflows/ml-okx-consensus-relay-r12.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-okx-consensus-relay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scikit-learn==1.6.1" \
            "pytest==8.3.4"

      - name: Reconstruct immutable scientific source
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_okx_consensus_relay_20260726
          python "$root/reconstruct.py"

      - name: Compile frozen source
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_okx_consensus_relay_20260726
          python -m py_compile "$root/reconstruct.py" "$root/run.py" "$root/test_run.py"

      - name: Run adversarial causal and account tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_okx_consensus_relay_20260726
          PYTHONPATH="$root" pytest -q "$root/test_run.py"

      - name: Run deterministic engine self-test
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_okx_consensus_relay_20260726
          PYTHONPATH="$root" python "$root/run.py" self-test

      - name: Validate frozen contracts and current project state
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_okx_consensus_relay_20260726
          python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$root/preregistration.json" >/dev/null
          python -m json.tool "$root/bundle_manifest.json" >/dev/null
          python scripts/validate_project.py

      - name: Download only frozen fit sources
        shell: bash
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/okx_consensus_fit"
          mkdir -p "$data"
          manifest=research_runs/ml_okx_consensus_relay_20260726/SOURCE_MANIFEST_FIT.tsv
          mkdir -p "$(dirname "$manifest")"
          : > "$manifest"
          download() {
            local url="$1" out="$2"
            curl -fL --retry 7 --retry-delay 3 --retry-all-errors "$url" -o "$out"
            gzip -t "$out"
            test -s "$out"
            printf '%s\t%s\t%s\t%s\n' "$url" "$(stat -c%s "$out")" "$(sha256sum "$out" | cut -d' ' -f1)" "$out" >> "$manifest"
          }
          for date in 2022-01-01 2022-03-01 2022-05-01 2022-07-01 2022-09-01 2022-11-01; do
            y=${date:0:4}; m=${date:5:2}; d=${date:8:2}
            dir="$data/$date"
            mkdir -p "$dir"
            download "https://datasets.tardis.dev/v1/okex/trades/$y/$m/$d/BTC-USDT.csv.gz" "$dir/okx_spot_BTCUSDT_trades.csv.gz"
            download "https://datasets.tardis.dev/v1/okex/quotes/$y/$m/$d/BTC-USDT.csv.gz" "$dir/okx_spot_BTCUSDT_quotes.csv.gz"
            download "https://datasets.tardis.dev/v1/okex-swap/trades/$y/$m/$d/BTC-USDT-SWAP.csv.gz" "$dir/okx_swap_BTCUSDT_trades.csv.gz"
            download "https://datasets.tardis.dev/v1/okex-swap/quotes/$y/$m/$d/BTC-USDT-SWAP.csv.gz" "$dir/okx_swap_BTCUSDT_quotes.csv.gz"
            download "https://datasets.tardis.dev/v1/okex-swap/derivative_ticker/$y/$m/$d/BTC-USDT-SWAP.csv.gz" "$dir/okx_swap_BTCUSDT_derivative_ticker.csv.gz"
            download "https://datasets.tardis.dev/v1/bybit/quotes/$y/$m/$d/BTCUSDT.csv.gz" "$dir/bybit_BTCUSDT_quotes.csv.gz"
          done

      - name: Run frozen fit and untouched confirmation
        id: fit
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_okx_consensus_relay_20260726
          out=research_runs/ml_okx_consensus_relay_20260726/r12
          mkdir -p "$out"
          PYTHONPATH="$root" python "$root/run.py" run \
            --data-root "$RUNNER_TEMP/okx_consensus_fit" \
            --output "$out" \
            2>&1 | tee "$out/RUN_FIT.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads(Path("research_runs/ml_okx_consensus_relay_20260726/r12/RESULT.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"open_development={'true' if result['fit_gate_passed'] else 'false'}\n")
          print(json.dumps({"status":result["status"],"fit_gate_passed":result["fit_gate_passed"]},sort_keys=True))
          PY

      - name: Download conditional development only after every fit gate
        if: steps.fit.outputs.open_development == 'true'
        shell: bash
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/okx_consensus_development"
          mkdir -p "$data"
          manifest=research_runs/ml_okx_consensus_relay_20260726/SOURCE_MANIFEST_DEVELOPMENT.tsv
          : > "$manifest"
          download() {
            local url="$1" out="$2"
            curl -fL --retry 7 --retry-delay 3 --retry-all-errors "$url" -o "$out"
            gzip -t "$out"
            test -s "$out"
            printf '%s\t%s\t%s\t%s\n' "$url" "$(stat -c%s "$out")" "$(sha256sum "$out" | cut -d' ' -f1)" "$out" >> "$manifest"
          }
          for date in 2023-01-01 2023-03-01 2023-05-01; do
            y=${date:0:4}; m=${date:5:2}; d=${date:8:2}
            dir="$data/$date"
            mkdir -p "$dir"
            download "https://datasets.tardis.dev/v1/okex/trades/$y/$m/$d/BTC-USDT.csv.gz" "$dir/okx_spot_BTCUSDT_trades.csv.gz"
            download "https://datasets.tardis.dev/v1/okex/quotes/$y/$m/$d/BTC-USDT.csv.gz" "$dir/okx_spot_BTCUSDT_quotes.csv.gz"
            download "https://datasets.tardis.dev/v1/okex-swap/trades/$y/$m/$d/BTC-USDT-SWAP.csv.gz" "$dir/okx_swap_BTCUSDT_trades.csv.gz"
            download "https://datasets.tardis.dev/v1/okex-swap/quotes/$y/$m/$d/BTC-USDT-SWAP.csv.gz" "$dir/okx_swap_BTCUSDT_quotes.csv.gz"
            download "https://datasets.tardis.dev/v1/okex-swap/derivative_ticker/$y/$m/$d/BTC-USDT-SWAP.csv.gz" "$dir/okx_swap_BTCUSDT_derivative_ticker.csv.gz"
            download "https://datasets.tardis.dev/v1/bybit/quotes/$y/$m/$d/BTCUSDT.csv.gz" "$dir/bybit_BTCUSDT_quotes.csv.gz"
          done

      - name: Run unchanged conditional development
        if: steps.fit.outputs.open_development == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_okx_consensus_relay_20260726
          out=research_runs/ml_okx_consensus_relay_20260726/r12
          PYTHONPATH="$root" python "$root/run.py" run \
            --data-root "$RUNNER_TEMP/okx_consensus_fit" \
            --development-root "$RUNNER_TEMP/okx_consensus_development" \
            --output "$out" \
            2>&1 | tee "$out/RUN_DEVELOPMENT.log"

      - name: Enforce boundaries and hash evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_okx_consensus_relay_20260726
          out=research_runs/ml_okx_consensus_relay_20260726/r12
          if test -f "$out/RESULT.json"; then
            # RUN_FIT.log is written by tee after the scientific runner emits its internal checksum file.
            # Recompute a post-run evidence inventory; this correction changes no market result.
            find "$out" -maxdepth 1 -type f ! -name SHA256SUMS.txt ! -name OUTPUT_SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"
            python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("research_runs/ml_okx_consensus_relay_20260726/r12/RESULT.json").read_text())
          assert result["claim_id"]=="CLM-20260726-2012-ML-OKX-CONSENSUS-001"
          assert result["prohibited_years_opened"]==[]
          assert result["orders_submitted"] is False
          assert result["paper_live_started"] is False
          assert result["ranking_role"]=="NONE_PRE2024_FATAL_SCREEN"
          assert result["development_opened"]==(result["fit_gate_passed"] and result["development"] is not None)
          print(json.dumps({"status":result["status"],"economic_status":result["economic_status"],"fit_gate":result["fit_gate_passed"]},sort_keys=True))
          PY
          fi
          mkdir -p research_runs/ml_okx_consensus_relay_20260726/input
          sha256sum \
            "$root/WORK_CLAIM.json" \
            "$root/preregistration.json" \
            "$root/README.md" \
            "$root/SOURCES.md" \
            "$root/bundle_manifest.json" \
            "$root/reconstruct.py" \
            "$root"/source_bundle.tar.gz.b64.part* \
            "$root/run.py" \
            "$root/test_run.py" \
            .github/workflows/ml-okx-consensus-relay-r12.yml \
            > research_runs/ml_okx_consensus_relay_20260726/input/INPUT_SHA256SUMS.txt
          python scripts/validate_project.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-okx-consensus-relay-${{ github.sha }}
          path: research_runs/ml_okx_consensus_relay_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
