name: Minimal ML OKX spot-swap consensus relay

on:
  push:
    branches:
      - agent/r12-ml-okx-consensus-relay-001
    paths:
      - '.github/workflows/ml-okx-consensus-relay-r12.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-okx-consensus-relay-r12.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-okx-consensus-relay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archived-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preserve completed decision and cancel duplicate replay
        run: |
          echo 'RES-20260726-ML-OKX-CONSENSUS-001 already recorded'
          echo 'scientific workflow 30201078983; artifact 8631746976'
          echo 'no additional market data or outcome is opened'
