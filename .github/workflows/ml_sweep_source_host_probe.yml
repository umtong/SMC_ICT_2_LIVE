name: ML sweep Bybit source host probe

on:
  push:
    branches:
      - agent/r22-ml-sweep-crowding-001
    paths:
      - research/triggers/ml_sweep_source_probe/**

permissions:
  contents: write

concurrency:
  group: ml-sweep-source-host-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install transport dependency
        run: python -m pip install requests==2.32.3
      - name: Probe all documented official public hosts
        run: python research/ml_sweep_crowding/probe_bybit_hosts_v2.py
      - name: Publish immutable probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/ml_sweep_crowding/source_host_probe_v2.json
          git commit -m "research: publish expanded Bybit official host probe"
          git push origin HEAD:${GITHUB_REF_NAME}
