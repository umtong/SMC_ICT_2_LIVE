name: Transcript alpha hypotheses and official 5m screen

on:
  push:
    branches:
      - agent/alpha-hypothesis-screen-20260725
    paths:
      - "research/alpha_hypothesis_screen_20260725/**"
      - ".github/workflows/alpha-hypothesis-full-5m.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/alpha_hypothesis_screen_20260725/**"
      - ".github/workflows/alpha-hypothesis-full-5m.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-hypothesis-full-5m-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PART00_SHA256: f393811a320cc6c71774eb1fa74cc6475bd28ccd2f3249b80eeab6858c7ea110
  PART01_SHA256: 42c34b85cbc9ac40c7cdd264ff83421ad01b61caebf7d920002518ec7af0231b
  PART02_SHA256: 30fdc2664347afebfed937f4ad8cabea9cf84a8d37e4efa91e8f6672f5e378b4
  PART03_SHA256: c363f7dd173cc88e7d5644096249105edc5f388b5e138f129addab7c5662642a
  COMBINED_B64_SHA256: 846da9aef976f43d1a42d3639ce3de7f0c5ca95b65b1f4cf88dc671b1147f81e
  BUNDLE_GZ_SHA256: 0be627c4161af1940b41ec660b27d09b6b7f642199cb5f02b36f073de39585ad
  HYPOTHESES_SHA256: 592cee51cfc404074d94c78b353111b1742e6c932e01302d8550f058c4c50b7c
  PRELIM_SUMMARY_SHA256: 1bca1b19ca0bf0ee2caf5592ab9def83497e2578d263c619b88940aaea4e971b
  FULL_5M_SOURCE_SHA256: a50075e4b6b236ae7b70002952c234e233b12f22dd05177cd589dc6639b0fe65
  FULL_5M_TEST_SHA256: 61786d423b7807feddddeff89a9bf3770089a9bd728bc4f170dc226f52d4bdc1
  COUNT_ALIAS_PATCH_SHA256: a58586d055cff4e58f68318bf7c85ab9126ebd37b000503b00ff61bcc0f5e341
  COUNT_ALIAS_TEST_SHA256: 105c3a885f52efb41b24aa10addaaa0768526c81d89c001826fc32c0465125a7
  PATCHED_5M_SOURCE_SHA256: 97a3d04b39b657e38a90f7687e6b2cfff89d74b3cb61e5d21e9c9eeb1390bba7

jobs:
  screen:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alpha-hypothesis-screen-20260725
          fetch-depth: 1

      - name: Reconstruct and verify immutable research bundle
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/research_runs/alpha_hypothesis_screen_20260725"
          mkdir -p "$root"
          pfx=research/alpha_hypothesis_screen_20260725/bundle.tar.gz.b64.part
          printf '%s  %s\n' "$PART00_SHA256" "${pfx}00" | sha256sum --check --strict
          printf '%s  %s\n' "$PART01_SHA256" "${pfx}01" | sha256sum --check --strict
          printf '%s  %s\n' "$PART02_SHA256" "${pfx}02" | sha256sum --check --strict
          printf '%s  %s\n' "$PART03_SHA256" "${pfx}03" | sha256sum --check --strict
          cat "${pfx}00" "${pfx}01" "${pfx}02" "${pfx}03" > /tmp/alpha_hypothesis_screen.tar.gz.b64
          printf '%s  %s\n' "$COMBINED_B64_SHA256" /tmp/alpha_hypothesis_screen.tar.gz.b64 | sha256sum --check --strict
          base64 --decode /tmp/alpha_hypothesis_screen.tar.gz.b64 > /tmp/alpha_hypothesis_screen.tar.gz
          printf '%s  %s\n' "$BUNDLE_GZ_SHA256" /tmp/alpha_hypothesis_screen.tar.gz | sha256sum --check --strict
          tar -xzf /tmp/alpha_hypothesis_screen.tar.gz -C "$root"
          src="$root/alpha_hypothesis_screen_20260725"
          printf '%s  %s\n' "$HYPOTHESES_SHA256" "$src/artifacts/transcript_hypotheses.jsonl" | sha256sum --check --strict
          printf '%s  %s\n' "$PRELIM_SUMMARY_SHA256" "$src/artifacts/run_summary.json" | sha256sum --check --strict
          printf '%s  %s\n' "$FULL_5M_SOURCE_SHA256" "$src/src/liquidity_state_5m.py" | sha256sum --check --strict
          printf '%s  %s\n' "$FULL_5M_TEST_SHA256" "$src/tests/test_liquidity_state_5m.py" | sha256sum --check --strict
          printf '%s  %s\n' "$COUNT_ALIAS_PATCH_SHA256" research/alpha_hypothesis_screen_20260725/patch_count_alias.py | sha256sum --check --strict
          printf '%s  %s\n' "$COUNT_ALIAS_TEST_SHA256" research/alpha_hypothesis_screen_20260725/test_binance_count_alias.py | sha256sum --check --strict
          python research/alpha_hypothesis_screen_20260725/patch_count_alias.py "$src/src/liquidity_state_5m.py"
          printf '%s  %s\n' "$PATCHED_5M_SOURCE_SHA256" "$src/src/liquidity_state_5m.py" | sha256sum --check --strict
          python -m py_compile "$src/src"/*.py "$src/tests"/*.py research/alpha_hypothesis_screen_20260725/test_binance_count_alias.py
          sha256sum "${pfx}00" "${pfx}01" "${pfx}02" "${pfx}03" research/alpha_hypothesis_screen_20260725/patch_count_alias.py research/alpha_hypothesis_screen_20260725/test_binance_count_alias.py > "$root/input_part_sha256.txt"

      - name: Install fixed research environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "pytest==8.3.4"
          python - <<'PY'
          import json, platform, sys, numpy, pandas, requests, pytest
          from pathlib import Path
          root=Path('research_runs/alpha_hypothesis_screen_20260725')
          payload={
              'python':sys.version,
              'platform':platform.platform(),
              'machine':platform.machine(),
              'numpy':numpy.__version__,
              'pandas':pandas.__version__,
              'requests':requests.__version__,
              'pytest':pytest.__version__,
              'credentials_used':False,
              'orders_submitted':False,
              'paper_or_live_started':False,
              '2025_opened':False,
              '2026_opened':False,
              'champion_eligible':False,
          }
          (root/'environment.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Run causal, schema and stage-boundary tests
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/research_runs/alpha_hypothesis_screen_20260725"
          src="$root/alpha_hypothesis_screen_20260725"
          PYTHONPATH="$src/src" pytest -q --import-mode=importlib \
            "$src/tests/test_transcript_alpha_screen.py" \
            "$src/tests/test_liquidity_state_5m.py" \
            research/alpha_hypothesis_screen_20260725/test_binance_count_alias.py \
            2>&1 | tee "$root/unit_tests.log"

      - name: Run checksum-verified official Binance USD-M 5m sequential screen
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/research_runs/alpha_hypothesis_screen_20260725"
          src="$root/alpha_hypothesis_screen_20260725"
          python "$src/src/liquidity_state_5m.py" \
            --cache "$root/cache" \
            --output "$root/full_5m" \
            2>&1 | tee "$root/full_5m_console.log"
          python - "$root/full_5m/run_manifest.json" "$root/run_status.json" <<'PY'
          import json, sys
          manifest=json.load(open(sys.argv[1],encoding='utf-8'))
          assert manifest['2025_opened'] is False
          assert manifest['2026_opened'] is False
          assert manifest['orders_submitted'] is False
          assert manifest['champion_eligible'] is False
          out={
              'development_gate_pass':manifest['development_gate_pass'],
              'selection_gate_pass':manifest['selection_gate_pass'],
              'confirmation_opened':manifest['confirmation_opened'],
              'confirmation_gate_pass':manifest['confirmation_gate_pass'],
              '2025_opened':False,
              '2026_opened':False,
              'orders_submitted':False,
              'paper_or_live_started':False,
              'champion_eligible':False,
          }
          open(sys.argv[2],'w',encoding='utf-8').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Record immutable output checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/research_runs/alpha_hypothesis_screen_20260725"
          if [[ -d "$root" ]]; then
            find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-hypothesis-full-5m-${{ github.sha }}
          path: research_runs/alpha_hypothesis_screen_20260725
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
