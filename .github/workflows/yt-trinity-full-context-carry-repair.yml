name: YT Trinity full-period causal context carry repair

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-full-context-carry-repair.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-full-context-carry-repair
  cancel-in-progress: false

jobs:
  repair-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Repair full-period state carry
        run: |
          set -euo pipefail
          test "$(git hash-object research/yt_trinity_ml/run_causal_action_history_full.py)" = "8b9bba0150ad3076b63177265c2148e8c64faac6"
          python - <<'PY'
          from pathlib import Path
          path=Path('research/yt_trinity_ml/run_causal_action_history_full.py')
          text=path.read_text()
          old='''    decision_eval, execution_eval, funding_eval = load_canonical_frames(\n        args.data_root,\n        args.repo_root,\n        PRIMARY,\n        EVALUATION_SEGMENTS,\n    )\n    _, candidates_eval, diagnostics_eval = generate_causal_action_candidates_by_symbol(\n        decision_eval,\n        FeatureConfig(),\n    )\n    rows_eval = _rows_fast(\n        candidates_eval,\n        execution_eval,\n        funding_eval,\n        EVALUATION_END,\n        (variant,),\n        screen,\n    )\n'''
          new='''    # Reconstruct the continuous state that exists at 2024-01-01 instead of\n    # resetting indicators, liquidity provenance and active SMC narratives at the\n    # evaluation boundary. Pre-2024 rows are context only; the account starts flat at\n    # 10,000 USDT and only post-2024 action activations may trade.\n    evaluation_context_segments = (*PRE2024_SEGMENTS, *EVALUATION_SEGMENTS)\n    decision_context, execution_context, funding_context = load_canonical_frames(\n        args.data_root,\n        args.repo_root,\n        PRIMARY,\n        evaluation_context_segments,\n    )\n    _, candidates_context, diagnostics_context = generate_causal_action_candidates_by_symbol(\n        decision_context,\n        FeatureConfig(),\n    )\n    candidates_eval = [\n        candidate for candidate in candidates_context\n        if EVALUATION_START <= pd.Timestamp(candidate.timestamp) < EVALUATION_END\n    ]\n    rows_eval = _rows_fast(\n        candidates_eval,\n        execution_context,\n        funding_context,\n        EVALUATION_END,\n        (variant,),\n        screen,\n    )\n    diagnostics_eval = {\n        "context_segments": list(evaluation_context_segments),\n        "full_context_candidate_count": len(candidates_context),\n        "evaluation_candidate_count": len(candidates_eval),\n        "by_symbol": diagnostics_context,\n    }\n'''
          if old not in text:
              raise SystemExit('full evaluation context block mismatch')
          path.write_text(text.replace(old,new,1))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run compile and boundary regressions
        run: |
          set -euo pipefail
          python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'scikit-learn==1.6.1' 'pytest==8.3.5'
          export PYTHONPATH=research/yt_trinity_ml
          python -m py_compile research/yt_trinity_ml/run_causal_action_history_full.py
          pytest -q \
            research/yt_trinity_ml/tests/test_history_boundary_context.py \
            research/yt_trinity_ml/tests/test_causal_action_history_model.py \
            research/yt_trinity_ml/tests/test_causal_action_fast.py \
            research/yt_trinity_ml/tests/test_passive_transition_cancel.py \
            research/yt_trinity_ml/tests/test_pd_array_failure_exit.py \
            research/yt_trinity_ml/tests/test_execution_realism.py
      - name: Commit tested full-period repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/run_causal_action_history_full.py
          git rm .github/workflows/yt-trinity-full-context-carry-repair.yml
          git commit -m 'Carry pre-2024 causal state into continuous evaluation'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
