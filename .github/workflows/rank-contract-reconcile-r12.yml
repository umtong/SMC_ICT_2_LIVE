name: Rank contract reconciliation audit

on:
  push:
    branches:
      - agent/r12-rank-contract-reconcile-001
      - agent/r13-rank-allbreakout-consistency-001
    paths:
      - "research/rank_contract_reconcile_20260726/**"
      - ".github/workflows/rank-contract-reconcile-r12.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/rank_contract_reconcile_20260726/**"
      - ".github/workflows/rank-contract-reconcile-r12.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rank-contract-reconcile-r12-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize immutable Donchian result without opening market data
        shell: bash
        run: |
          set -euo pipefail
          root=research/rank_contract_reconcile_20260726
          python -m json.tool "$root/CORRECTION_001_FETCH_DONCHIAN_RESULT_NO_MARKET.json" >/dev/null
          donchian_commit=53434193d5612fe40c998618b6f74e5368ecaedf
          donchian_path=research/donchian_trade_dependence_20260726/results/result.json
          git fetch --no-tags --depth=1 origin "$donchian_commit"
          mkdir -p "$(dirname "$donchian_path")"
          git show "$donchian_commit:$donchian_path" > "$donchian_path"
          test "$(git hash-object "$donchian_path")" = "31453a4b313412549f9d78a505d1329d4528436a"
          python -m json.tool "$donchian_path" >/dev/null

      - name: Validate the applicable ranking revision
        shell: bash
        run: |
          set -euo pipefail
          revision=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('control/ranking.json').read_text())['revision'])
          PY
          )

          if test "$revision" -le 13; then
            python research/rank_contract_reconcile_20260726/audit.py \
              2>&1 | tee /tmp/rank-contract-audit.log
            python -m json.tool \
              research_results/rank_contract_reconcile_20260726/AUDIT.json >/dev/null
            python - <<'PY'
            import json
            from pathlib import Path
            r=json.loads(Path('research_results/rank_contract_reconcile_20260726/AUDIT.json').read_text())
            assert r['authority']['market_data_opened'] is False
            assert r['authority']['strategy_replayed'] is False
            assert r['authority']['orders_submitted'] is False
            assert r['state_exit_source_audit']['contains_maximum_hold_bars'] is True
            assert r['higher_recorded_growth_challenger']['growth_delta_vs_current_first_base_cost'] > 0
            print(json.dumps({
              'mode':'REVISION_13_SOURCE_AUDIT',
              'current_first':r['current_first_place']['first_place_id'],
              'challenger_growth_delta':r['higher_recorded_growth_challenger']['growth_delta_vs_current_first_base_cost'],
            },sort_keys=True))
            PY
          else
            python research/rank_contract_reconcile_20260726/validate_canonical_ranking.py \
              2>&1 | tee /tmp/rank-contract-audit.log
            python - <<'PY'
            import json
            from pathlib import Path
            ranking=json.loads(Path('control/ranking.json').read_text())
            result=json.loads(Path('research_results/rank_contract_reconcile_20260726/RESULT.json').read_text())
            decision=json.loads(Path('research_results/rank_contract_reconcile_20260726/DECISION.json').read_text())
            first='FIRST-20260726-DONCHIAN-ALL-A70626D9E484'
            assert ranking['revision'] >= 14
            assert ranking['first_place']['first_place_id'] == first
            assert result['new_current_first_place']['first_place_id'] == first
            assert decision['new_first']['first_place_id'] == first
            print(json.dumps({'mode':'REVISION_14_CANONICAL_CONSISTENCY','current_first':first},sort_keys=True))
            PY
          fi

          python scripts/validate_project.py

      - name: Commit immutable revision-13 audit evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/r12-rank-contract-reconcile-001'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research_results/rank_contract_reconcile_20260726 \
            research/rank_contract_reconcile_20260726/CORRECTION_001_FETCH_DONCHIAN_RESULT_NO_MARKET.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record ranking-contract audit [skip ci]"
          git push origin HEAD:agent/r12-rank-contract-reconcile-001

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rank-contract-reconcile-r12-${{ github.sha }}
          path: |
            research_results/rank_contract_reconcile_20260726
            /tmp/rank-contract-audit.log
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
