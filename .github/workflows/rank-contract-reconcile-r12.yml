name: Rank contract reconciliation compatibility check

on:
  push:
    branches:
      - agent/r12-rank-contract-reconcile-001
      - agent/r14-donchian-all-ranking-001
    paths:
      - "research/rank_contract_reconcile_20260726/**"
      - "research_results/rank_contract_reconcile_20260726/**"
      - "control/ranking.json"
      - "control/current-state.md"
      - ".github/workflows/rank-contract-reconcile-r12.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/rank_contract_reconcile_20260726/**"
      - "research_results/rank_contract_reconcile_20260726/**"
      - "control/ranking.json"
      - "control/current-state.md"
      - ".github/workflows/rank-contract-reconcile-r12.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rank-contract-reconcile-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable reconciliation evidence and active state
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool control/ranking.json >/dev/null
          python -m json.tool research_results/rank_contract_reconcile_20260726/RESULT.json >/dev/null
          python -m json.tool research_results/rank_contract_reconcile_20260726/DECISION.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          ranking=json.loads(Path('control/ranking.json').read_text())
          result=json.loads(Path('research_results/rank_contract_reconcile_20260726/RESULT.json').read_text())
          decision=json.loads(Path('research_results/rank_contract_reconcile_20260726/DECISION.json').read_text())
          state=Path('control/current-state.md').read_text()

          assert ranking['revision'] >= 13
          assert result['authority']['market_data_opened'] is False
          assert result['authority']['strategy_replayed'] is False
          assert result['authority']['orders_submitted'] is False
          assert result['historical_first_place_audit']['current_contract_status']=='HARD_INVALID_FOR_ACTIVE_RANKING'
          assert decision['former_first']['invalidation']=='PROHIBITED_ELAPSED_TIME_LIQUIDATION'
          assert 'Rank does not determine research priority' in state

          if ranking['revision'] >= 14:
              repro=Path('research_results/rank_contract_reconcile_20260726/INDEPENDENT_REPRODUCTION_ALL_BREAKOUT.json')
              correction=Path('research_results/rank_contract_reconcile_20260726/RANKING_CORRECTION_002.json')
              assert repro.exists() and correction.exists()
              reproduced=json.loads(repro.read_text())
              assert ranking['first_place']['first_place_id']=='FIRST-20260726-DONCHIAN-ALL-A70626D9'
              assert abs(ranking['first_place']['metrics']['geometric_daily_growth']-reproduced['paths']['24bps']['geometric_daily_growth'])<1e-15
              assert ranking['ranked_candidates'][1]['rank']==2
          else:
              assert ranking['first_place']['source_result_id']=='RES-20260726-DONCHIAN-DEPENDENCE-001'

          print(json.dumps({
              'revision':ranking['revision'],
              'first_place':ranking['first_place']['first_place_id'],
              'market_data_opened':result['authority']['market_data_opened'],
              'orders_submitted':result['authority']['orders_submitted'],
          },sort_keys=True))
          PY
          python scripts/validate_project.py
