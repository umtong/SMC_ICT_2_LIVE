name: Bybit L2 cancellation-replenishment parallel fit screen

on:
  push:
    branches:
      - agent/r11-l2-cancel-refill-parallel-001
    paths:
      - "research/l2_cancel_refill_taker_20260726/**"
      - ".github/workflows/l2-cancel-refill-parallel-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/l2_cancel_refill_taker_20260726/**"
      - ".github/workflows/l2-cancel-refill-parallel-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: l2-cancel-refill-parallel-r11
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  TZ: UTC

jobs:
  unit:
    name: unit-${{ matrix.key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {date: "2023-03-01", symbol: "BTCUSDT", key: "20230301-BTC"}
          - {date: "2023-03-01", symbol: "ETHUSDT", key: "20230301-ETH"}
          - {date: "2023-05-01", symbol: "BTCUSDT", key: "20230501-BTC"}
          - {date: "2023-05-01", symbol: "ETHUSDT", key: "20230501-ETH"}
          - {date: "2023-07-01", symbol: "BTCUSDT", key: "20230701-BTC"}
          - {date: "2023-07-01", symbol: "ETHUSDT", key: "20230701-ETH"}
    env:
      DATE: ${{ matrix.date }}
      SYMBOL: ${{ matrix.symbol }}
      KEY: ${{ matrix.key }}
      CACHE: /tmp/l2-cancel-refill-parallel/${{ matrix.key }}
      UNIT_OUT: ${{ github.workspace }}/research_runs/l2_cancel_refill_parallel/units/${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 requests==2.32.4
      - name: Reconstruct and validate unchanged engine
        run: |
          python research/l2_cancel_refill_taker_20260726/reconstruct.py
          python -m py_compile research/l2_cancel_refill_taker_20260726/run.py
          python research/l2_cancel_refill_taker_20260726/run.py self-test
          python -m json.tool research/l2_cancel_refill_taker_20260726/PARALLEL_EXECUTION_AMENDMENT_002.json >/dev/null
      - uses: actions/cache@v4
        with:
          path: ${{ env.CACHE }}
          key: l2-cancel-refill-parallel-r11-${{ matrix.key }}-${{ hashFiles('research/l2_cancel_refill_taker_20260726/PREREGISTRATION_AMENDMENT_001.json') }}
      - name: Build one immutable date-symbol event unit
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from dataclasses import asdict
          from pathlib import Path
          import requests

          root = Path.cwd() / "research/l2_cancel_refill_taker_20260726"
          spec = importlib.util.spec_from_file_location("l2screen", root / "run.py")
          m = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(m)

          date = os.environ["DATE"]
          symbol = os.environ["SYMBOL"]
          cache = Path(os.environ["CACHE"])
          out = Path(os.environ["UNIT_OUT"])
          out.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          paths = {}
          records = []
          for data_type in ("quotes", "trades", "book_snapshot_5"):
              url = m.dataset_url(data_type, date, symbol)
              path = cache / m.EXCHANGE / data_type / date / f"{symbol}.csv.gz"
              cache_hit = m.download_file(url, path, session)
              rows = m.count_rows(path)
              if rows <= 0:
                  raise RuntimeError(f"empty source {url}")
              record = m.SourceRecord(date, symbol, data_type, url, path.stat().st_size, m.sha256_file(path), rows, cache_hit)
              records.append(asdict(record))
              paths[data_type] = path
              print(json.dumps({"event": "source", **asdict(record)}), flush=True)

          frame = m.build_event_frame(date, symbol, paths["quotes"], paths["trades"], paths["book_snapshot_5"])
          if frame.empty:
              raise RuntimeError(f"no events for {date} {symbol}")
          frame.to_pickle(out / f"events__{date}__{symbol}.pkl.gz", compression="gzip")
          (out / f"sources__{date}__{symbol}.json").write_text(json.dumps(records, indent=2, sort_keys=True) + "\n")
          (out / f"unit__{date}__{symbol}.json").write_text(json.dumps({
              "engine_version": m.ENGINE_VERSION,
              "date": date,
              "symbol": symbol,
              "event_rows": int(len(frame)),
              "2024_opened": False,
              "orders_submitted": False
          }, indent=2, sort_keys=True) + "\n")
          print(json.dumps({"event": "unit_complete", "date": date, "symbol": symbol, "event_rows": int(len(frame))}), flush=True)
          PY
      - name: Hash unit outputs
        if: always()
        run: |
          mkdir -p "$UNIT_OUT"
          find "$UNIT_OUT" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$UNIT_OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2-cancel-refill-unit-${{ matrix.key }}-${{ github.sha }}
          path: ${{ env.UNIT_OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  aggregate:
    name: aggregate-six-units
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OUT: ${{ github.workspace }}/research_runs/l2_cancel_refill_parallel/aggregate
      UNIT_ROOT: ${{ github.workspace }}/research_runs/l2_cancel_refill_parallel/downloaded
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 requests==2.32.4
      - name: Reconstruct unchanged engine
        run: |
          python research/l2_cancel_refill_taker_20260726/reconstruct.py
          python -m py_compile research/l2_cancel_refill_taker_20260726/run.py
      - uses: actions/download-artifact@v4
        with:
          pattern: l2-cancel-refill-unit-*-${{ github.sha }}
          path: ${{ env.UNIT_ROOT }}
          merge-multiple: true
      - name: Aggregate chronologically and run unchanged 432-policy fit gate
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import pandas as pd

          root = Path.cwd() / "research/l2_cancel_refill_taker_20260726"
          spec = importlib.util.spec_from_file_location("l2screen", root / "run.py")
          m = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(m)

          unit_root = Path(os.environ["UNIT_ROOT"])
          out = Path(os.environ["OUT"])
          out.mkdir(parents=True, exist_ok=True)
          event_files = sorted(unit_root.glob("events__*.pkl.gz"))
          source_files = sorted(unit_root.glob("sources__*.json"))
          if len(event_files) != 6 or len(source_files) != 6:
              raise RuntimeError({"event_files": len(event_files), "source_files": len(source_files)})

          fit = pd.concat([pd.read_pickle(p, compression="gzip") for p in event_files], ignore_index=True)
          fit = fit.sort_values(["decision_us", "symbol", "side"]).reset_index(drop=True)
          configs = m.freeze_configs(fit)
          if len(configs) != 432:
              raise AssertionError(len(configs))
          results = [m.evaluate(fit, c) for c in configs]
          results.sort(key=lambda r: ((r["cost_24"]["mean_bps"] if r["cost_24"]["mean_bps"] is not None else -1e9), r["n"]), reverse=True)
          survivors = [r for r in results if m.fit_gate(r)]
          sources = []
          for p in source_files:
              sources.extend(json.loads(p.read_text()))

          fit.to_pickle(out / "fit_events.pkl.gz", compression="gzip")
          (out / "fit_candidate_results.json").write_text(json.dumps(results, indent=2, sort_keys=True) + "\n")
          status = "FIT_SURVIVOR_REQUIRES_SEQUENTIAL_DEVELOPMENT" if survivors else "FIT_BELOW_GATE"
          summary = {
              "schema_version": 1,
              "result_id": m.RESULT_ID,
              "engine_version": m.ENGINE_VERSION,
              "execution_mode": "SIX_UNIT_PARALLEL_THEN_CHRONOLOGICAL_GLOBAL_SLOT_AGGREGATION",
              "hard_validity": "PASS",
              "economic_status": status,
              "qualification": "FATAL_ALPHA_SCREEN_ONLY_NOT_RANK_ELIGIBLE",
              "symbols": list(m.SYMBOLS),
              "fit_dates": list(m.FIT_DATES),
              "development_dates": list(m.DEVELOPMENT_DATES),
              "candidate_count": len(configs),
              "fit_event_rows": int(len(fit)),
              "fit_survivor_count": len(survivors),
              "development_opened": False,
              "development_survivor_count": 0,
              "best_fit": results[0] if results else None,
              "fit_survivors": survivors,
              "source_records": sources,
              "2024_opened": False,
              "2025_opened": False,
              "2026_opened": False,
              "official_target_met": False,
              "orders_submitted": False,
              "paper_live_enabled": False
          }
          (out / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          (out / "source_manifest.json").write_text(json.dumps({"sources": sources, "2024_opened": False, "2025_opened": False, "2026_opened": False}, indent=2, sort_keys=True) + "\n")
          print(json.dumps({"event": "aggregate_complete", "fit_event_rows": len(fit), "fit_survivor_count": len(survivors), "best_24bp": results[0]["cost_24"] if results else None}), flush=True)
          PY
      - name: Verify sealed fit-only result
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s = json.loads((Path(os.environ["OUT"]) / "summary.json").read_text())
          assert s["hard_validity"] == "PASS"
          assert s["engine_version"] == "L2_CANCEL_REFILL_TAKER_V1B_MEMORY_BOUNDED"
          assert s["candidate_count"] == 432
          assert s["development_opened"] is False
          assert s["2024_opened"] is False and s["2025_opened"] is False and s["2026_opened"] is False
          assert s["orders_submitted"] is False and s["paper_live_enabled"] is False
          print("PARALLEL_FIT_SEAL_PASS")
          PY
      - name: Hash aggregate outputs
        if: always()
        run: |
          mkdir -p "$OUT"
          find "$OUT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2-cancel-refill-parallel-fit-${{ github.sha }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
