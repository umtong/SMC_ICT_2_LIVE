name: Export dynamic-factor residual authority for rapid week diagnosis

on:
  push:
    branches: [agent/export-dynamic-factor-source-20260805]
    paths:
      - '.github/workflows/export-dynamic-factor-source-20260805.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate source
        run: |
          set -euo pipefail
          root=research/dynamic_factor_residual_20260725
          python -m py_compile "$root/dynamic_factor_residual.py" "$root/audit_actual_funding.py"
          sha256sum "$root/dynamic_factor_residual.py" "$root/evaluation_contract.json" "$root/RESULT_POINTER.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-factor-authority-${{ github.run_id }}
          path: research/dynamic_factor_residual_20260725
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
