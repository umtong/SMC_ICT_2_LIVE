name: Absorption flow benchmark R7 verification

on:
  push:
    branches: [agent/absorption-flow-benchmark-r7-final-20260725]
    paths:
      - 'research/absorption_flow_benchmark_r7/**'
      - '.github/workflows/absorption-flow-benchmark-r7.yml'
      - 'control/result-registry.jsonl'
      - 'control/validation-cache.jsonl'
      - 'control/ranking.json'
      - 'control/current-state.md'
      - 'schemas/ranking.schema.json'
  pull_request:
    branches: [main]
    paths:
      - 'research/absorption_flow_benchmark_r7/**'
      - 'research/donchian_2024h1_20260726/**'
      - '.github/workflows/absorption-flow-benchmark-r7.yml'
      - 'control/result-registry.jsonl'
      - 'control/validation-cache.jsonl'
      - 'control/ranking.json'
      - 'control/current-state.md'
      - 'schemas/ranking.schema.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref != 'agent/r15-donchian-visible-harness-004'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed verification dependencies
        run: |
          python -m pip install --upgrade 'pip==25.1.1'
          python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'pyarrow==25.0.0' 'pytest==8.3.4' 'jsonschema==4.25.1'
      - name: Reconstruct dollar-clock source package and prior baseline source
        run: |
          set -euo pipefail
          root=research/absorption_flow_benchmark_r7
          python "$root/reconstruct.py"
          git fetch origin agent/absorption-flow-benchmark-20260725
          mkdir -p /tmp/abs-base
          git archive origin/agent/absorption-flow-benchmark-20260725 research/absorption_flow_benchmark_v1 | tar -x -C /tmp/abs-base
          python /tmp/abs-base/research/absorption_flow_benchmark_v1/reconstruct.py
          base=/tmp/abs-base/research/absorption_flow_benchmark_v1/absorption_flow_benchmark.py
          echo 'e9ce4e211e060d74cfb43759bb6afb69616cc8b12fa66aa6ad317ceac01d56b8  '"$base" | sha256sum -c -
          cp "$base" "$root/reconstructed/research/absorption_flow_benchmark.py"
      - name: Compile and run causal and exact-executor checks
        run: |
          set -euo pipefail
          root=research/absorption_flow_benchmark_r7/reconstructed
          python -m py_compile "$root"/research/*.py "$root"/tests/*.py
          pytest -q "$root/tests/test_dollar_bar_absorption_v2.py" "$root/tests/test_dollar_bar_fast_equivalence.py"
          python - <<'PY'
          import json
          import pathlib
          import jsonschema
          root=pathlib.Path('research/absorption_flow_benchmark_r7')
          result=json.loads((root/'RESULT.json').read_text())
          validation=json.loads((root/'VALIDATION_ATTESTATION.json').read_text())
          ranking=json.loads(pathlib.Path('control/ranking.json').read_text())
          schema=json.loads(pathlib.Path('schemas/ranking.schema.json').read_text())
          jsonschema.Draft202012Validator.check_schema(schema)
          jsonschema.validate(ranking, schema)
          assert result['status']=='VALID'
          assert result['baseline_screen']['candidate_count']==216
          assert result['dollar_bar_screen']['candidate_count']==324
          assert result['ranking_candidate']['base']['trades']==184
          assert result['ranking_candidate']['stress_2x']['trades']==183
          assert result['ranking_decision']['rank']==2
          assert ranking['revision']>=14
          assert ranking['first_place']['source_result_id']=='RES-20260726-DONCHIAN-DEPENDENCE-001'
          assert all(row['source_result_id']!='RES-20260725-ABS-FLOW-001' for row in ranking['ranked_candidates'])
          assert any(row.get('source_result_id')=='RES-20260725-ABS-FLOW-001' for row in ranking['unranked_results'])
          assert validation['status']=='PASS'
          assert not result['orders_submitted'] and not result['paper_or_live_started']
          print('registered absorption result and current exit-contract ranking checks passed')
          PY
      - name: Validate repository contracts
        run: |
          set -euo pipefail
          python scripts/validate_project.py
          python -m pytest -q
          python scripts/build_context_bundle.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: absorption-flow-r7-verification-${{ github.run_id }}
          path: |
            research/absorption_flow_benchmark_r7/RESULT.json
            research/absorption_flow_benchmark_r7/VALIDATION_ATTESTATION.json
            research/absorption_flow_benchmark_r7/RUN_REPORT.md
          if-no-files-found: error
          retention-days: 30

  donchian-2024h1:
    if: github.head_ref == 'agent/r15-donchian-visible-harness-004'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ROOT: research/donchian_2024h1_20260726
      OUT: research_runs/donchian_2024h1_20260726/r14
      DATA: ${{ runner.temp }}/donchian_2024h1
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade 'pip==25.1.1'
          python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'requests==2.32.4' 'pytest==8.3.4'
      - name: Reconstruct and test frozen evaluator
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$ROOT/preregistration.json" >/dev/null
          python -m json.tool "$ROOT/EXECUTION_CORRECTION_001_SLIM_SHA_SCOPED_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$ROOT/EXECUTION_TRIGGER_002_PR_VISIBLE_SAME_CONTRACT.json" >/dev/null
          python "$ROOT/reconstruct.py"
          python -m py_compile "$ROOT/reconstruct.py" "$ROOT/run.py" "$ROOT/test_run.py" "$ROOT/download_bars.py" "$ROOT/download_funding.py"
          PYTHONPATH="$ROOT" pytest -q "$ROOT/test_run.py"
          PYTHONPATH="$ROOT" python "$ROOT/run.py" self-test
          python scripts/validate_project.py
      - name: Download official warm-up and 2024H1 Bybit bars
        run: |
          set -euo pipefail
          rm -rf "$DATA"
          mkdir -p "$DATA"
          python "$ROOT/download_bars.py" --output "$DATA" 2>&1 | tee "$DATA/BAR_DOWNLOAD.log"
      - name: Download official funding or use frozen adverse fallback
        run: |
          set -euo pipefail
          python "$ROOT/download_funding.py" --output "$DATA" 2>&1 | tee "$DATA/FUNDING_DOWNLOAD.log"
      - name: Replay unchanged official 2024H1 account
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          PYTHONPATH="$ROOT" python "$ROOT/run.py" run --data-root "$DATA" --output "$OUT" 2>&1 | tee "$OUT/RUN.log"
      - name: Verify authority and period seals
        if: always()
        run: |
          set -euo pipefail
          test -f "$OUT/RESULT.json"
          (cd "$OUT" && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('research_runs/donchian_2024h1_20260726/r14/RESULT.json').read_text())
          assert result['claim_id']=='CLM-20260726-2139-DONCHIAN-2024H1-001'
          assert result['opened_periods']==['2024H1']
          assert result['unopened_periods']==['2024H2','2025H1','2025H2','2026H1']
          assert result['evaluation']['elapsed_time_liquidation'] is False
          assert result['evaluation']['forced_boundary_close'] is False
          assert result['orders_submitted'] is False
          assert result['paper_live_started'] is False
          print(json.dumps({'status':result['status'],'gdg_12bps':result['paths']['12bps']['geometric_daily_growth'],'gdg_24bps':result['paths']['24bps']['geometric_daily_growth']},sort_keys=True))
          PY
      - name: Freeze evidence hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research_runs/donchian_2024h1_20260726/input
          sha256sum \
            "$ROOT/WORK_CLAIM.json" "$ROOT/preregistration.json" "$ROOT/README.md" "$ROOT/SOURCES.md" \
            "$ROOT/EXECUTION_CORRECTION_001_SLIM_SHA_SCOPED_BEFORE_OUTCOME.json" \
            "$ROOT/EXECUTION_TRIGGER_002_PR_VISIBLE_SAME_CONTRACT.json" \
            "$ROOT/bundle_manifest.json" "$ROOT/reconstruct.py" "$ROOT"/source_bundle.tar.gz.b64.part* \
            "$ROOT/run.py" "$ROOT/test_run.py" "$ROOT/download_bars.py" "$ROOT/download_funding.py" \
            > research_runs/donchian_2024h1_20260726/input/INPUT_SHA256SUMS.txt
          find "$DATA" -type f -print0 | sort -z | xargs -0 sha256sum > research_runs/donchian_2024h1_20260726/input/DATA_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: donchian-2024h1-visible-${{ github.run_id }}
          path: research_runs/donchian_2024h1_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
