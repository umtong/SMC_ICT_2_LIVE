name: YT Trinity official Bybit archive smoke

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - research/yt_trinity_ml/run_public_archive_smoke.py
      - research/yt_trinity_ml/system/public_archive.py
      - .github/workflows/yt-trinity-public-archive-smoke.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-public-archive-smoke-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install causal research dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow requests pytest
          python -m pip freeze | sort > dependency-freeze.txt
      - name: Compile archive runner and regression suite
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python -m py_compile \
            research/yt_trinity_ml/run_public_archive_smoke.py \
            research/yt_trinity_ml/system/*.py
          pytest -q \
            research/yt_trinity_ml/tests/test_public_archive.py \
            research/yt_trinity_ml/tests/test_regressions.py \
            research/yt_trinity_ml/tests/test_entry_fill_guard.py
      - name: Run 2022H2 training and 2023H1 causal economic smoke
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -o pipefail
          mkdir -p artifact/public-archive-smoke/cache artifact/public-archive-smoke/result
          python research/yt_trinity_ml/run_public_archive_smoke.py \
            --cache-root artifact/public-archive-smoke/cache \
            --output artifact/public-archive-smoke/result \
            --symbols BTCUSDT ETHUSDT \
            --data-start 2022-07-01T00:00:00Z \
            --evaluation-start 2023-01-01T00:00:00Z \
            --evaluation-end-exclusive 2023-07-01T00:00:00Z \
            --update-cadence-days 28 \
            --training-completion-lag-minutes 15 \
            2>&1 | tee artifact/public-archive-smoke/RUN_STDOUT.log
          cp dependency-freeze.txt artifact/public-archive-smoke/
      - name: Upload immutable non-rankable smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-public-archive-smoke-${{ github.sha }}
          path: artifact/public-archive-smoke
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
      - name: Persist compact smoke pointer
        if: always()
        run: |
          if [[ ! -f artifact/public-archive-smoke/result/RUN_SUMMARY.json ]]; then exit 0; fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path('artifact/public-archive-smoke/result/RUN_SUMMARY.json').read_text(encoding='utf-8'))
          pointer = {
              'schema_version': 1,
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'source_sha': os.environ['GITHUB_SHA'],
              'artifact_name': f"yt-trinity-public-archive-smoke-{os.environ['GITHUB_SHA']}",
              'stage': summary.get('stage'),
              'candidate_count': summary.get('candidate_count'),
              'resolved_label_count': summary.get('resolved_label_count'),
              'configuration_sha256': summary.get('configuration_sha256'),
              'result': summary.get('result'),
              'timings': summary.get('timings'),
              'known_limitations': summary.get('known_limitations'),
          }
          destination = Path('research/yt_trinity_ml/PUBLIC_ARCHIVE_SMOKE_POINTER.json')
          destination.write_text(json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/PUBLIC_ARCHIVE_SMOKE_POINTER.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record official archive smoke ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
