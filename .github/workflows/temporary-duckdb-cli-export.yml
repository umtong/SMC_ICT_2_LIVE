name: Temporary DuckDB CLI export

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-oi-continuation-003]
    paths: [.github/workflows/temporary-duckdb-cli-export.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/temporary-duckdb-cli-export.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned DuckDB CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip \
            --output artifact/duckdb_cli-linux-amd64.zip
          sha256sum artifact/duckdb_cli-linux-amd64.zip > artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-duckdb-cli-linux-amd64
          path: artifact
          if-no-files-found: error
          retention-days: 1
