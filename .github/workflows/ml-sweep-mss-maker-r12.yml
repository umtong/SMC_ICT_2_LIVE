name: Minimal ML sweep-MSS consequent-encroachment maker

on:
  push:
    branches:
      - agent/r12-ml-sweep-mss-maker-001
    paths:
      - "research/ml_sweep_mss_maker_20260726/**"
      - ".github/workflows/ml-sweep-mss-maker-r12.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/ml_sweep_mss_maker_20260726/**"
      - ".github/workflows/ml-sweep-mss-maker-r12.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ml-sweep-mss-maker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  NUMEXPR_NUM_THREADS: "2"
  ROOT: research/ml_sweep_mss_maker_20260726
  RUNNER: research/ml_sweep_mss_maker_20260726/reconstructed/run.py
  TESTS: research/ml_sweep_mss_maker_20260726/reconstructed/test_run.py
  OUT: ${{ github.workspace }}/research_runs/ml_sweep_mss_maker_20260726
  CACHE: /tmp/ml-sweep-mss-maker-r12

jobs:
  causal-fatal-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scikit-learn==1.6.1" \
            "pyarrow==18.1.0" \
            "pytest==8.3.4"

      - name: Validate one-model contract and causal engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          rm -rf "$ROOT/reconstructed"
          python "$ROOT/reconstruct.py"
          python -m py_compile "$ROOT/reconstruct.py" "$RUNNER" "$TESTS"
          PYTHONPATH="$ROOT/reconstructed" python "$RUNNER" self-test | tee "$OUT/self_test.log"
          PYTHONPATH="$ROOT/reconstructed" pytest -q "$TESTS" 2>&1 | tee "$OUT/tests.log"
          python -m json.tool "$ROOT/preregistration.json" >/dev/null
          python -m json.tool "$ROOT/bundle_manifest.json" >/dev/null
          python -m json.tool "$ROOT/IMPLEMENTATION_CORRECTION_001.json" >/dev/null
          test "$(sha256sum "$RUNNER" | cut -d' ' -f1)" = "659a5a64c8acbd87a89d8f576c49d9ccfecc82191829599f971859c55306ce7c"
          test "$(sha256sum "$TESTS" | cut -d' ' -f1)" = "79f66f7ba4f2c0a701f299300651f497beef78d288657501301bf22d78e84051"
          python scripts/validate_project.py

      - name: Download immutable parent L2 states
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT/parent"
          curl --fail-with-body --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/umtong/SMC_ICT_2_LIVE/actions/artifacts/8626087323/zip" \
            --output "$OUT/parent_artifact.zip"
          test "$(sha256sum "$OUT/parent_artifact.zip" | cut -d' ' -f1)" = "90594acc23e63e97e83347f9b07eb9ac260ba7bb1b87eb72052287a8328ad4a1"
          unzip -q "$OUT/parent_artifact.zip" -d "$OUT/parent"
          test "$(sha256sum "$OUT/parent/output/compact_states/2022-07-01_BTCUSDT_state.parquet" | cut -d' ' -f1)" = "da8f581e64ba6f5305c57c0d76403b262d1b0ff48ad540e19302f6bf7416c38b"
          test "$(sha256sum "$OUT/parent/output/compact_states/2023-07-01_BTCUSDT_state.parquet" | cut -d' ' -f1)" = "8872cd2a21960666f10f3d35c788a16faefd007d02a30389079def794e90389f"

      - name: Run frozen queue-aware ML screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/result"
          PYTHONPATH="$ROOT/reconstructed" python "$RUNNER" run \
            --parent-artifact-dir "$OUT/parent" \
            --cache "$CACHE" \
            --output "$OUT/result" \
            2>&1 | tee "$OUT/run.log"

      - name: Enforce stage, minimalism and authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("research_runs/ml_sweep_mss_maker_20260726/result/RESULT.json").read_text())
          assert result["result_id"] == "RES-20260726-ML-SWEEP-MSS-MAKER-001"
          assert result["2024_opened"] is False
          assert result["2025_opened"] is False
          assert result["2026_opened"] is False
          assert result["orders_submitted"] is False
          if result.get("model_fitted", True):
              assert result["model"]["type"] == "STANDARDIZED_MULTINOMIAL_LOGISTIC"
              assert len(result["model"]["feature_columns"]) == 12
          print(json.dumps({
              "status": result["status"],
              "survivor": result["survivor"],
              "fit_event_count": result.get("fit_event_count"),
              "development_event_count": result.get("development_event_count"),
              "authorized_development_events": result.get("authorized_development_events"),
          }, sort_keys=True))
          PY

      - name: Record immutable hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find "$OUT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$OUT/OUTPUT_SHA256SUMS.txt"
          sha256sum \
            "$ROOT/README.md" \
            "$ROOT/preregistration.json" \
            "$ROOT/IMPLEMENTATION_CORRECTION_001.json" \
            "$ROOT/reconstruct.py" \
            "$ROOT/bundle_manifest.json" \
            "$ROOT"/source_bundle.tar.gz.b64.part* \
            .github/workflows/ml-sweep-mss-maker-r12.yml \
            > "$OUT/INPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-sweep-mss-maker-${{ github.sha }}
          path: research_runs/ml_sweep_mss_maker_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Commit decision-ready result to claim branch
        if: success() && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          target=research_results/r12_ml_sweep_mss_maker_001
          rm -rf "$target"
          mkdir -p "$target"
          cp "$OUT/result/RESULT.json" "$target/result.json"
          cp "$OUT/INPUT_SHA256SUMS.txt" "$target/INPUT_SHA256SUMS.txt"
          cp "$OUT/OUTPUT_SHA256SUMS.txt" "$target/OUTPUT_SHA256SUMS.txt"
          tail -n 300 "$OUT/run.log" > "$target/RUN_TAIL.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Record minimal ML sweep-MSS maker result"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
