name: Fixed portfolio takeover exact source export

on:
  push:
    branches: [agent/r11-fixed-portfolio-takeover-001]
    paths:
      - .github/workflows/fixed-portfolio-takeover-source-export.yml
      - research/fixed_strategy_portfolio_20260726/WORK_CLAIM_TAKEOVER.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse registered component-source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_runs/fixed_portfolio_takeover/sources
          gh run download 30165375409 \
            --repo "$GITHUB_REPOSITORY" \
            --name fixed-strategy-component-sources \
            --dir research_runs/fixed_portfolio_takeover/sources/base_artifact
          (cd research_runs/fixed_portfolio_takeover/sources/base_artifact && sha256sum --check SHA256SUMS.txt)
      - name: Recover exact original aligned-continuation source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin dccf6dbd47c1beac54f4bc514f8a129c334c3813
          git --work-tree="$RUNNER_TEMP/absorption" checkout FETCH_HEAD -- research/absorption_flow_benchmark_v1
          root="$RUNNER_TEMP/absorption/research/absorption_flow_benchmark_v1"
          python "$root/reconstruct.py"
          source="$root/absorption_flow_benchmark.py"
          test -f "$source"
          echo "e9ce4e211e060d74cfb43759bb6afb69616cc8b12fa66aa6ad317ceac01d56b8  $source" | sha256sum --check
          cp "$source" research_runs/fixed_portfolio_takeover/sources/absorption_flow_benchmark.py
          cp "$root/PREREGISTRATION.json" research_runs/fixed_portfolio_takeover/sources/ABSORPTION_PREREGISTRATION.json
          cp "$root/RESULT_SUMMARY.json" research_runs/fixed_portfolio_takeover/sources/ABSORPTION_RESULT_SUMMARY.json
      - name: Record immutable source identities
        shell: bash
        run: |
          set -euo pipefail
          out=research_runs/fixed_portfolio_takeover/sources
          find "$out" -type f ! -name SOURCE_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/SOURCE_SHA256SUMS.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('research_runs/fixed_portfolio_takeover/sources')
          payload={
            'claim_id':'CLM-20260726-1955-FIXED-PORTFOLIO-TAKEOVER-001',
            'source_artifact_run':30165375409,
            'source_artifact_id':8621396535,
            'source_artifact_digest':'sha256:492286857a92b36d52d584a80c92fc9f9d99a902228f4c171170e5343b6c9886',
            'dynamic_source_ref':'agent/r4-dynamic-factor-residual-001@4a36ca54115517e77955d2d6ce1e4cb58c1fe691',
            'absorption_source_ref':'agent/absorption-flow-benchmark-r7-final-20260725@dccf6dbd47c1beac54f4bc514f8a129c334c3813',
            'absorption_source_sha256':'e9ce4e211e060d74cfb43759bb6afb69616cc8b12fa66aa6ad317ceac01d56b8',
            'market_data_opened':False,
            'component_outcomes_opened':False,
            'portfolio_outcome_opened':False,
            '2025_or_2026_opened':False,
            'orders_submitted':False,
          }
          (out/'SOURCE_ATTESTATION.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-portfolio-takeover-sources-${{ github.sha }}
          path: research_runs/fixed_portfolio_takeover/sources
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
