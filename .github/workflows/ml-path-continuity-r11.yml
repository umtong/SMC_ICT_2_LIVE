name: ML path-continuity structural first-passage screen

on:
  push:
    branches:
      - agent/r11-ml-path-continuity-router-001
    paths:
      - "research/ml_path_continuity_20260726/**"
      - ".github/workflows/ml-path-continuity-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/ml_path_continuity_20260726/**"
      - ".github/workflows/ml-path-continuity-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ml-path-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen research environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "scikit-learn==1.6.1" \
            "pytest==8.3.4"

      - name: Compile, test and run causal self-test
        run: |
          set -euo pipefail
          root=research/ml_path_continuity_20260726
          python -m py_compile "$root/run_screen.py" "$root/test_run_screen.py"
          PYTHONPATH="$root" python -m pytest -q "$root/test_run_screen.py"
          mkdir -p research_runs/ml_path_continuity/self_test
          PYTHONPATH="$root" python "$root/run_screen.py" \
            --self-test \
            --output research_runs/ml_path_continuity/self_test \
            --cache "$RUNNER_TEMP/ml-path-continuity-cache"
          (cd research_runs/ml_path_continuity/self_test && sha256sum --check SHA256SUMS.txt)

      - name: Run frozen official Bybit pre-2024 screen
        run: |
          set +e
          root=research/ml_path_continuity_20260726
          mkdir -p research_runs/ml_path_continuity/output research_runs/ml_path_continuity/diagnostics
          PYTHONPATH="$root" python "$root/run_screen.py" \
            --output research_runs/ml_path_continuity/output \
            --cache "$RUNNER_TEMP/ml-path-continuity-cache" \
            > research_runs/ml_path_continuity/diagnostics/screen.log 2>&1
          status=$?
          echo "$status" > research_runs/ml_path_continuity/diagnostics/SCREEN_EXIT.txt
          cat research_runs/ml_path_continuity/diagnostics/screen.log
          exit 0

      - name: Verify result safety and project integrity
        run: |
          set -euo pipefail
          test "$(cat research_runs/ml_path_continuity/diagnostics/SCREEN_EXIT.txt)" = "0"
          (cd research_runs/ml_path_continuity/output && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("research_runs/ml_path_continuity/output/RESULT.json").read_text())
          assert result["source_count"] == 12
          assert result["event_count"] > 0
          assert result["hard_validity_status"] == "PASS_INITIAL"
          assert result["2024_opened"] is False
          assert result["2025_or_2026_opened"] is False
          assert result["orders_submitted"] is False
          assert result["status"] in {"TESTED_BELOW_GATE", "PROMISING_PRE2024_SURVIVOR"}
          print(json.dumps({
              "status": result["status"],
              "event_count": result["event_count"],
              "resolved_rows": result["partition_resolved_rows"],
              "confirmation": result["confirmation_model_metrics"],
              "development_18bps": result["development_account"]["18.0"],
              "gate": result["pre2024_gate"],
          }, sort_keys=True, default=str))
          PY
          python scripts/validate_project.py

      - name: Record immutable input hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research_runs/ml_path_continuity
          sha256sum \
            research/ml_path_continuity_20260726/preregistration.json \
            research/ml_path_continuity_20260726/README.md \
            research/ml_path_continuity_20260726/run_screen.py \
            research/ml_path_continuity_20260726/implementation.sha256 \
            research/ml_path_continuity_20260726/implementation.b64.part00 \
            research/ml_path_continuity_20260726/implementation.b64.part01 \
            research/ml_path_continuity_20260726/implementation.b64.part02 \
            research/ml_path_continuity_20260726/test_run_screen.py \
            .github/workflows/ml-path-continuity-r11.yml \
            > research_runs/ml_path_continuity/INPUT_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-path-continuity-${{ github.sha }}
          path: research_runs/ml_path_continuity
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
