name: YT Trinity conditional SOL XRP 2021-2022 history

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - .github/workflows/yt-trinity-conditional-alt-history-build.yml
      - research/yt_trinity_ml/CAUSAL_ACTION_HISTORY_POINTER.json

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-conditional-alt-history
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/r22-yt-trinity-ml-001
  CANONICAL_COMMIT: a2bb231966a517d29495bed7673e4d08ab8e30a9
  BYBIT_PUBLIC_BASE_URL: https://api.manepa.jp

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.resolve.outputs.authorized }}
      source_result_sha: ${{ steps.resolve.outputs.source_result_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - id: resolve
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('research/yt_trinity_ml/CAUSAL_ACTION_HISTORY_POINTER.json')
          authorized = False
          source_result_sha = ''
          if path.exists():
              pointer = json.loads(path.read_text())
              result = pointer.get('result') or {}
              completed = (
                  pointer.get('job_status') == 'success'
                  and int(pointer.get('exit_code', 99)) == 0
              )
              authorized = completed and not bool(result.get('target_exceeded_coarse'))
              source_result_sha = str(pointer.get('result_sha256') or '')
          with Path('/tmp/authorized').open('w') as fh:
              fh.write('true' if authorized else 'false')
          Path('/tmp/source-result-sha').write_text(source_result_sha)
          PY
          echo "authorized=$(cat /tmp/authorized)" >> "$GITHUB_OUTPUT"
          echo "source_result_sha=$(cat /tmp/source-result-sha)" >> "$GITHUB_OUTPUT"

  build-alt-history:
    needs: route
    if: needs.route.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        segment: [PRE_2024_2021, PRE_2024_2022]
        symbol: [SOLUSDT, XRPUSDT]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: ${{ env.CANONICAL_COMMIT }}
          path: canonical_repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install canonical builder
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q ./canonical_repo
      - name: Build and verify immutable alt shard
        env:
          PYTHONPATH: canonical_repo
        run: |
          set -euo pipefail
          python canonical_repo/scripts/market_data/build_canonical_bybit.py \
            --segment "${{ matrix.segment }}" \
            --symbol "${{ matrix.symbol }}" \
            --base-url "$BYBIT_PUBLIC_BASE_URL" \
            --timeout 30 \
            --max-attempts 8 \
            --min-request-interval 0.12 \
            --out artifact
          python canonical_repo/scripts/market_data/verify_canonical_bybit.py \
            "artifact/${{ matrix.segment }}/${{ matrix.symbol }}" \
            | tee "artifact/${{ matrix.segment }}/${{ matrix.symbol }}/VERIFICATION.json"
          test -f "artifact/${{ matrix.segment }}/${{ matrix.symbol }}/trade_bars/1m.parquet"
          test -f "artifact/${{ matrix.segment }}/${{ matrix.symbol }}/trade_bars/5m.parquet"
          (
            cd "artifact/${{ matrix.segment }}/${{ matrix.symbol }}"
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-bybit-${{ matrix.segment }}-${{ matrix.symbol }}
          path: artifact/${{ matrix.segment }}/${{ matrix.symbol }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish-alt-ready:
    needs: [route, build-alt-history]
    if: needs.route.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Persist exact conditional history pointer
        env:
          SOURCE_RESULT_SHA: ${{ needs.route.outputs.source_result_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          segments = ['PRE_2024_2021', 'PRE_2024_2022']
          symbols = ['SOLUSDT', 'XRPUSDT']
          payload = {
              'schema_version': 1,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'stage': 'CONDITIONAL_ALT_HISTORY_READY',
              'status': 'PASS_COMPLETE',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'trigger_source_commit': os.environ['GITHUB_SHA'],
              'canonical_builder_commit': os.environ['CANONICAL_COMMIT'],
              'source_btc_eth_result_sha256': os.environ['SOURCE_RESULT_SHA'],
              'built_at_utc': datetime.now(timezone.utc).isoformat(),
              'segments': segments,
              'symbols': symbols,
              'artifact_names': [
                  f'canonical-bybit-{segment}-{symbol}'
                  for segment in segments
                  for symbol in symbols
              ],
              'purpose': 'test whether SOL or XRP materially improves one-slot after-cost growth',
              'ranking_effect': 'NONE_DATA_ONLY',
          }
          target = Path('research/yt_trinity_ml/CONDITIONAL_ALT_HISTORY_READY.json')
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/CONDITIONAL_ALT_HISTORY_READY.json
          if ! git diff --cached --quiet; then
            git commit -m "Record conditional SOL XRP history readiness ${GITHUB_RUN_ID}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin "$TARGET_BRANCH"
              if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
