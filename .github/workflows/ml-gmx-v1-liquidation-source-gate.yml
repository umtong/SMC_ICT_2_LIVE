name: GMX V1 finalized liquidation source gate takeover

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ml_gmx_v1_liquidation_20260726/**'
      - '.github/workflows/ml-gmx-v1-liquidation-source-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmx-v1-source-gate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      ROOT: research/ml_gmx_v1_liquidation_20260726
      OUT: research_runs/gmx_v1_liquidation_takeover/source_gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned source environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'requests==2.32.4' 'pytest==8.3.5'

      - name: Validate source semantics before network access
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          {
            python -m py_compile \
              "$ROOT/probe_gmx_v1_liquidations.py" \
              "$ROOT/probe_gmx_v1_liquidations_semantic.py" \
              "$ROOT/test_probe_gmx_v1_liquidations.py" \
              "$ROOT/test_probe_gmx_v1_liquidations_semantic.py"
            PYTHONPATH="$ROOT" python -m pytest -vv \
              "$ROOT/test_probe_gmx_v1_liquidations.py" \
              "$ROOT/test_probe_gmx_v1_liquidations_semantic.py"
            PYTHONPATH="$ROOT" python "$ROOT/probe_gmx_v1_liquidations_semantic.py" --self-test
            python -m json.tool "$ROOT/WORK_CLAIM.json" >/dev/null
            python -m json.tool "$ROOT/CORRECTION_001_POOL_ACCOUNTING_NOT_CLOB_FLOW_BEFORE_OUTCOME.json" >/dev/null
          } 2>&1 | tee "$OUT/PRECHECK.log"

      - name: Run outcome-sealed source gate
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT" python "$ROOT/probe_gmx_v1_liquidations_semantic.py" \
            --output "$OUT" 2>&1 | tee "$OUT/RUN.log"

      - name: Enforce source-only authority
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          root=Path('research_runs/gmx_v1_liquidation_takeover/source_gate')
          result_path=root/'SOURCE_GATE_RESULT.json'
          if not result_path.is_file():
              raise SystemExit('SOURCE_GATE_RESULT.json missing')
          result=json.loads(result_path.read_text())
          assert result['claim_id']=='CLM-20260726-2324-ML-GMX-V1-LIQUIDATION-001'
          assert result['chain_id']==42161
          assert result['information_delay_seconds']==120
          assert isinstance(result['source_gate_pass'], bool)
          raw=root/'RAW_GMX_V1_LIQUIDATIONS.jsonl.gz'
          rows=[]
          if raw.is_file():
              with gzip.open(raw,'rt',encoding='utf-8') as h:
                  rows=[json.loads(line) for line in h if line.strip()]
              for row in rows:
                  assert row['external_market_order_direction_asserted'] is False
                  assert row['source_censoring']=='LIQUIDATION_STATE_1_ONLY'
                  assert 'forced_flow_direction' not in row
          decision={
              'takeover_claim_id':'CLM-20260730-GMX-V1-LIQUIDATION-TAKEOVER-001',
              'parent_claim_id':result['claim_id'],
              'source_gate_pass':result['source_gate_pass'],
              'scientific_decision':result['scientific_decision'],
              'events':result.get('totals',{}).get('btc_eth_liquidations',0),
              'orders_submitted':False,
              'market_outcomes_opened':False,
          }
          (root/'TAKEOVER_SOURCE_DECISION.json').write_text(json.dumps(decision,indent=2,sort_keys=True)+'\n')
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          files=sorted(p for p in root.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt')
          (root/'SHA256SUMS.txt').write_text(''.join(f'{digest(p)}  {p.as_posix()}\n' for p in files))
          print(json.dumps(decision,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gmx-v1-source-gate-takeover-${{ github.run_id }}
          path: research_runs/gmx_v1_liquidation_takeover/source_gate
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
