name: ML GMX V1 liquidation source gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'research/ml_gmx_v1_liquidation_20260726/**'
      - '.github/workflows/ml-gmx-v1-liquidation-source-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-gmx-v1-liquidation-source-gate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fixed source-gate environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'requests==2.32.4' \
            'pytest==8.3.5'

      - name: Compile and run adversarial source tests
        run: |
          set -euo pipefail
          root=research/ml_gmx_v1_liquidation_20260726
          out=research_runs/ml_gmx_v1_liquidation_20260726/source-gate
          mkdir -p "$out"
          {
            python -m py_compile \
              "$root/probe_gmx_v1_liquidations.py" \
              "$root/probe_gmx_v1_liquidations_semantic.py" \
              "$root/test_probe_gmx_v1_liquidations.py" \
              "$root/test_probe_gmx_v1_liquidations_semantic.py"
            PYTHONPATH="$root" python -m pytest -vv \
              "$root/test_probe_gmx_v1_liquidations.py" \
              "$root/test_probe_gmx_v1_liquidations_semantic.py"
            PYTHONPATH="$root" python "$root/probe_gmx_v1_liquidations_semantic.py" --self-test
            python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
            python -m json.tool "$root/CORRECTION_001_POOL_ACCOUNTING_NOT_CLOB_FLOW_BEFORE_OUTCOME.json" >/dev/null
          } 2>&1 | tee "$out/PRECHECK.log"

      - name: Run outcome-sealed Arbitrum source gate
        run: |
          set -euo pipefail
          root=research/ml_gmx_v1_liquidation_20260726
          out=research_runs/ml_gmx_v1_liquidation_20260726/source-gate
          mkdir -p "$out"
          PYTHONPATH="$root" python "$root/probe_gmx_v1_liquidations_semantic.py" \
            --output "$out" \
            2>&1 | tee "$out/RUN.log"

      - name: Enforce source-only decision contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          root = Path('research_runs/ml_gmx_v1_liquidation_20260726/source-gate')
          result = json.loads((root / 'SOURCE_GATE_RESULT.json').read_text())
          assert result['claim_id'] == 'CLM-20260726-2324-ML-GMX-V1-LIQUIDATION-001'
          assert result['chain_id'] == 42161
          assert result['vault'].lower() == '0x489ee077994b6658eafa855c308275ead8097c4a'
          assert result['event_topic0'].lower() == (
              '0x2e1f85a64a2f22cf2f0c42584e7c919ed4abe8d53675cff0f62bf1e95a1c676f'
          )
          assert all(
              int(item['end_exclusive_utc'][:4]) <= 2023
              for item in result['probe_windows']
          )
          assert result['information_delay_seconds'] == 120
          assert isinstance(result['source_gate_pass'], bool)
          if result['source_gate_pass']:
              assert result['scientific_decision'] == (
                  'OPEN_FROZEN_PRE2024_HISTORY_AND_MODEL_STAGE'
              )
              assert all(result['source_gate_checks'].values())
          else:
              assert result['scientific_decision'] == (
                  'CLOSE_SOURCE_ROUTE_BEFORE_MARKET_OUTCOMES'
              )

          rows = []
          with gzip.open(root / 'RAW_GMX_V1_LIQUIDATIONS.jsonl.gz', 'rt', encoding='utf-8') as handle:
              for line in handle:
                  line = line.strip()
                  if line:
                      rows.append(json.loads(line))
          for row in rows:
              assert row['source_semantic_correction'] == (
                  'CORRECTION-20260727-ML-GMX-V1-POOL-ACCOUNTING-NOT-CLOB-FLOW-001'
              )
              assert row['external_market_order_direction_asserted'] is False
              assert row['source_censoring'] == 'LIQUIDATION_STATE_1_ONLY'
              assert 'forced_flow_direction' not in row
              assert row['removed_trader_exposure'] in {'LONG_REMOVED', 'SHORT_REMOVED'}
              assert row['mark_price_semantics'].endswith('NOT_EXTERNAL_EXECUTABLE_FILL')

          serialized = json.dumps(result, sort_keys=True).lower()
          for forbidden_key in (
              'future_return_value',
              'first_passage_label_value',
              'model_auc',
              'trade_return',
              'account_nav_value',
              'official_2024_opened',
              'orders_submitted',
          ):
              assert forbidden_key not in serialized
          print(json.dumps({
              'selected_endpoint': result.get('endpoint_probe', {}).get('selected'),
              'source_gate_pass': result['source_gate_pass'],
              'decision': result['scientific_decision'],
              'btc_eth_liquidations': result.get('totals', {}).get(
                  'btc_eth_liquidations', 0
              ),
              'assets': result.get('totals', {}).get('assets', {}),
              'sides_btc_eth': result.get('totals', {}).get('sides_btc_eth', {}),
              'decode_errors': result.get('totals', {}).get(
                  'decode_error_count', 0
              ),
              'fatal_error': result.get('fatal_error'),
          }, sort_keys=True))
          PY

      - name: Record current project validation
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          out=research_runs/ml_gmx_v1_liquidation_20260726/source-gate
          python scripts/validate_project.py 2>&1 | tee "$out/PROJECT_VALIDATION.log"

      - name: Freeze evidence hashes
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('research/ml_gmx_v1_liquidation_20260726')
          out = Path('research_runs/ml_gmx_v1_liquidation_20260726/source-gate')
          out.mkdir(parents=True, exist_ok=True)
          inputs = [
              root / 'WORK_CLAIM.json',
              root / 'PREREGISTRATION.md',
              root / 'CORRECTION_001_POOL_ACCOUNTING_NOT_CLOB_FLOW_BEFORE_OUTCOME.json',
              root / 'probe_gmx_v1_liquidations.py',
              root / 'probe_gmx_v1_liquidations_semantic.py',
              root / 'test_probe_gmx_v1_liquidations.py',
              root / 'test_probe_gmx_v1_liquidations_semantic.py',
              Path('.github/workflows/ml-gmx-v1-liquidation-source-gate.yml'),
          ]

          def digest(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          (out / 'INPUT_SHA256SUMS.txt').write_text(
              ''.join(f'{digest(path)}  {path.as_posix()}\n' for path in inputs)
          )
          outputs = sorted(
              path for path in out.rglob('*')
              if path.is_file() and path.name != 'OUTPUT_SHA256SUMS.txt'
          )
          (out / 'OUTPUT_SHA256SUMS.txt').write_text(
              ''.join(f'{digest(path)}  {path.as_posix()}\n' for path in outputs)
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-gmx-v1-liquidation-source-gate-${{ github.run_id }}
          path: research_runs/ml_gmx_v1_liquidation_20260726/source-gate
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
