name: ML GMX V1 liquidation source and pre-2024 decision

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ml_gmx_v1_liquidation_20260726/**'
      - '.github/workflows/ml-gmx-v1-liquidation-source-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-gmx-v1-liquidation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      ROOT: research/ml_gmx_v1_liquidation_20260726
      OUT: research_runs/ml_gmx_v1_liquidation_20260726
      MARKET: ${{ runner.temp }}/gmx-v1-pre2024-market
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fixed environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'requests==2.32.4' \
            'numpy==2.1.3' \
            'pandas==2.2.3' \
            'scikit-learn==1.5.2' \
            'pytest==8.3.5'

      - name: Compile and run adversarial tests
        run: |
          set -euo pipefail
          mkdir -p "$OUT/source-gate"
          {
            python -m py_compile \
              "$ROOT/probe_gmx_v1_liquidations.py" \
              "$ROOT/probe_gmx_v1_liquidations_semantic.py" \
              "$ROOT/acquire_gmx_v1_history.py" \
              "$ROOT/run_gmx_v1_model.py" \
              "$ROOT/test_probe_gmx_v1_liquidations.py" \
              "$ROOT/test_probe_gmx_v1_liquidations_semantic.py"
            PYTHONPATH="$ROOT" python -m pytest -vv \
              "$ROOT/test_probe_gmx_v1_liquidations.py" \
              "$ROOT/test_probe_gmx_v1_liquidations_semantic.py"
            PYTHONPATH="$ROOT" python "$ROOT/probe_gmx_v1_liquidations_semantic.py" --self-test
            PYTHONPATH="$ROOT" python "$ROOT/acquire_gmx_v1_history.py" --self-test
            PYTHONPATH="$ROOT" python "$ROOT/run_gmx_v1_model.py" self-test
            python -m json.tool "$ROOT/WORK_CLAIM.json" >/dev/null
            python -m json.tool "$ROOT/CORRECTION_001_POOL_ACCOUNTING_NOT_CLOB_FLOW_BEFORE_OUTCOME.json" >/dev/null
          } 2>&1 | tee "$OUT/source-gate/PRECHECK.log"

      - name: Run outcome-sealed source gate
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT" python "$ROOT/probe_gmx_v1_liquidations_semantic.py" \
            --output "$OUT/source-gate" 2>&1 | tee "$OUT/source-gate/RUN.log"

      - name: Enforce source-only decision and expose passage
        id: source
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json, os
          from pathlib import Path
          root=Path('research_runs/ml_gmx_v1_liquidation_20260726/source-gate')
          result=json.loads((root/'SOURCE_GATE_RESULT.json').read_text())
          assert result['claim_id']=='CLM-20260726-2324-ML-GMX-V1-LIQUIDATION-001'
          assert result['chain_id']==42161
          assert result['information_delay_seconds']==120
          assert isinstance(result['source_gate_pass'], bool)
          with gzip.open(root/'RAW_GMX_V1_LIQUIDATIONS.jsonl.gz','rt',encoding='utf-8') as handle:
              rows=[json.loads(line) for line in handle if line.strip()]
          for row in rows:
              assert row['external_market_order_direction_asserted'] is False
              assert row['source_censoring']=='LIQUIDATION_STATE_1_ONLY'
              assert 'forced_flow_direction' not in row
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"pass={'true' if result['source_gate_pass'] else 'false'}\n")
          print(json.dumps({'source_gate_pass':result['source_gate_pass'],'decision':result['scientific_decision'],'events':result.get('totals',{}).get('btc_eth_liquidations',0)},sort_keys=True))
          PY

      - name: Materialize full pre-2024 finalized source
        if: steps.source.outputs.pass == 'true'
        id: history
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$OUT/history"
          set +e
          PYTHONPATH="$ROOT" python "$ROOT/acquire_gmx_v1_history.py" \
            --output "$OUT/history" 2>&1 | tee "$OUT/history/RUN.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('research_runs/ml_gmx_v1_liquidation_20260726/history/HISTORY_RESULT.json')
          passed=False
          if path.is_file():
              passed=bool(json.loads(path.read_text()).get('history_pass'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"pass={'true' if passed else 'false'}\n")
          PY

      - name: Download checksum-verified pre-2024 Binance proxy
        if: steps.history.outputs.pass == 'true'
        run: |
          set -euo pipefail
          PYTHONPATH="$ROOT" python "$ROOT/run_gmx_v1_model.py" download-market \
            --market-root "$MARKET" 2>&1 | tee "$OUT/MARKET_DOWNLOAD.log"

      - name: Run frozen pre-2024 HGBT and account screen
        if: steps.history.outputs.pass == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$OUT/model"
          PYTHONPATH="$ROOT" python "$ROOT/run_gmx_v1_model.py" run \
            --source "$OUT/history/GMX_V1_LIQUIDATIONS_202109_202312.jsonl.gz" \
            --market-root "$MARKET" \
            --output "$OUT/model" 2>&1 | tee "$OUT/model/RUN.log"

      - name: Write single decision summary
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_runs/ml_gmx_v1_liquidation_20260726')
          source=json.loads((root/'source-gate/SOURCE_GATE_RESULT.json').read_text())
          history_path=root/'history/HISTORY_RESULT.json'
          model_path=root/'model/RESULT.json'
          if not source.get('source_gate_pass'):
              decision='CLOSE_SOURCE_ROUTE_BEFORE_MARKET_OUTCOMES'
              payload={'decision':decision,'source':source}
          elif not history_path.is_file() or not json.loads(history_path.read_text()).get('history_pass'):
              decision='CLOSE_FULL_HISTORY_DEPENDENCY_BEFORE_MARKET_OUTCOMES'
              payload={'decision':decision,'source':source,'history':json.loads(history_path.read_text()) if history_path.is_file() else None}
          elif not model_path.is_file():
              decision='ECONOMIC_EXECUTION_ERROR_NO_RESULT'
              payload={'decision':decision,'source':source,'history':json.loads(history_path.read_text())}
          else:
              model=json.loads(model_path.read_text())
              decision=model['status']
              payload={'decision':decision,'source':source,'history':json.loads(history_path.read_text()),'model':model}
          payload.update({'claim_id':'CLM-20260726-2324-ML-GMX-V1-LIQUIDATION-001','orders_submitted':False,'official_2024_2026_opened':False})
          (root/'FINAL_DECISION.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'decision':decision},sort_keys=True))
          PY
          python scripts/validate_project.py 2>&1 | tee "$OUT/PROJECT_VALIDATION.log" || true

      - name: Freeze evidence hashes
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('research/ml_gmx_v1_liquidation_20260726')
          out=Path('research_runs/ml_gmx_v1_liquidation_20260726')
          inputs=[
              root/'WORK_CLAIM.json', root/'PREREGISTRATION.md',
              root/'CORRECTION_001_POOL_ACCOUNTING_NOT_CLOB_FLOW_BEFORE_OUTCOME.json',
              root/'CONDITIONAL_MODEL_PREREGISTRATION.md',
              root/'probe_gmx_v1_liquidations.py', root/'probe_gmx_v1_liquidations_semantic.py',
              root/'acquire_gmx_v1_history.py', root/'run_gmx_v1_model.py',
              root/'test_probe_gmx_v1_liquidations.py', root/'test_probe_gmx_v1_liquidations_semantic.py',
              Path('.github/workflows/ml-gmx-v1-liquidation-source-gate.yml'),
          ]
          def digest(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          (out/'INPUT_SHA256SUMS.txt').write_text(''.join(f'{digest(path)}  {path.as_posix()}\n' for path in inputs))
          files=sorted(path for path in out.rglob('*') if path.is_file() and path.name!='OUTPUT_SHA256SUMS.txt')
          (out/'OUTPUT_SHA256SUMS.txt').write_text(''.join(f'{digest(path)}  {path.as_posix()}\n' for path in files))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-gmx-v1-liquidation-${{ github.run_id }}
          path: research_runs/ml_gmx_v1_liquidation_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
