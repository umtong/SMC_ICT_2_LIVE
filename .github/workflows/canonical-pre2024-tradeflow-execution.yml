name: Canonical pre-2024 trade-flow execution

on:
  pull_request:
    branches:
      - agent/r22-canonical-halfyear-market-data-001
    paths:
      - .github/workflows/canonical-pre2024-tradeflow-execution.yml

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        segment: [PRE_2024_2020, PRE_2024_2021, PRE_2024_2022]
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install "pandas==2.2.3" "pyarrow==25.0.0" "requests==2.32.4"
      - name: Build streamed official trade-flow segment
        run: |
          python scripts/market_data/build_public_trade_segment.py \
            --segment "${{ matrix.segment }}" \
            --symbol "${{ matrix.symbol }}" \
            --out artifact \
            --timeout 300 \
            --max-attempts 8 \
            --chunksize 750000 \
            --min-coverage 0.990
      - name: Upload immutable annual trade-flow shard
        uses: actions/upload-artifact@v4
        with:
          name: canonical-bybit-tradeflow-${{ matrix.segment }}-${{ matrix.symbol }}
          path: artifact/${{ matrix.segment }}/${{ matrix.symbol }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
