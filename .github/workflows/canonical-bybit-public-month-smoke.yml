name: Canonical Bybit monthly microbar smoke

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/market_data/build_public_trade_month.py
      - scripts/market_data/load_canonical_bybit.py
      - scripts/market_data/verify_canonical_bybit.py
      - tests/test_public_trade_month.py
      - .github/workflows/canonical-bybit-public-month-smoke.yml
  workflow_dispatch:
    inputs:
      symbol:
        description: Symbol
        required: true
        default: BTCUSDT
        type: choice
        options: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
      month:
        description: YYYY-MM
        required: true
        default: "2024-01"
        type: string

concurrency:
  group: canonical-bybit-microbar-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}
      MONTH: ${{ inputs.month || '2024-01' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q tests/test_public_trade_month.py
      - name: Build official monthly 500ms/1s/5s/15s shard
        run: |
          python scripts/market_data/build_public_trade_month.py \
            --symbol "$SYMBOL" \
            --month "$MONTH" \
            --out artifact
      - name: Verify and report file sizes
        shell: bash
        run: |
          shard="$(find artifact -name DATASET_MANIFEST.json -printf '%h\n' | head -n1)"
          test -n "$shard"
          python scripts/market_data/verify_canonical_bybit.py "$shard" | tee "$shard/VERIFICATION.json"
          find "$shard" -type f -printf '%P\t%s\n' | sort > "$shard/FILE_SIZES.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-bybit-microbar-smoke-${{ env.SYMBOL }}-${{ env.MONTH }}
          path: artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
