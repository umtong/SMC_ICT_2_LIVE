name: Canonical Bybit public monthly smoke

on:
  push:
    branches:
      - agent/r22-canonical-halfyear-market-data-001
    paths:
      - scripts/market_data/build_public_trade_month.py
      - scripts/market_data/verify_canonical_bybit.py
      - tests/test_public_trade_month.py
      - .github/workflows/canonical-bybit-public-month-smoke.yml
  workflow_dispatch:
    inputs:
      symbol:
        description: Symbol
        required: true
        default: XRPUSDT
        type: choice
        options: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT]
      month:
        description: YYYY-MM
        required: true
        default: "2024-01"
        type: string

permissions:
  contents: read

concurrency:
  group: canonical-bybit-public-month-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SYMBOL: ${{ inputs.symbol || 'XRPUSDT' }}
      MONTH: ${{ inputs.month || '2024-01' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install "pandas==2.2.3" "pyarrow==25.0.0" "requests==2.32.4" "pytest==8.3.4"
      - name: Unit tests
        run: python -m pytest -q tests/test_public_trade_month.py
      - name: Build official monthly trade-flow shard
        run: |
          python scripts/market_data/build_public_trade_month.py \
            --symbol "$SYMBOL" \
            --month "$MONTH" \
            --out artifact
      - name: Resolve output path and verify
        shell: bash
        run: |
          set -euo pipefail
          shard="$(find artifact -name DATASET_MANIFEST.json -printf '%h\n' | head -n1)"
          test -n "$shard"
          python scripts/market_data/verify_canonical_bybit.py "$shard" \
            | tee "$shard/VERIFICATION.json"
          printf '%s\n' "$shard" > artifact/SHARD_PATH.txt
      - name: Upload immutable smoke shard
        uses: actions/upload-artifact@v4
        with:
          name: canonical-bybit-month-smoke-${{ env.SYMBOL }}-${{ env.MONTH }}
          path: artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
