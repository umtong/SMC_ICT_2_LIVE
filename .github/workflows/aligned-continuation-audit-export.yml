name: Recover and audit aligned-continuation source

on:
  push:
    branches: [agent/ml-aligned-continuation-audit-001]
    paths:
      - '.github/workflows/aligned-continuation-audit-export.yml'
      - 'research/aligned_continuation_audit/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aligned-continuation-audit-export.yml'
      - 'research/aligned_continuation_audit/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct registered R7 source bundle
        run: |
          set -euo pipefail
          python research/absorption_flow_benchmark_r7/reconstruct.py
          mkdir -p artifact/recovered artifact/evidence
          cp -a research/absorption_flow_benchmark_r7/reconstructed artifact/recovered/r7_bundle
          cp research/absorption_flow_benchmark_r7/{RESULT.json,EVALUATION_CONTRACT.json,selected_candidate_annual_metrics.csv,SOURCE_HASHES.json,BUNDLE_MANIFEST.json} artifact/evidence/
      - name: Search all retained pull-request refs for exact baseline source
        shell: bash
        run: |
          set -euo pipefail
          expected='e9ce4e211e060d74cfb43759bb6afb69616cc8b12fa66aa6ad317ceac01d56b8'
          git fetch --quiet --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*' || true
          git rev-list --objects --all | grep -E '(absorption|flow).*\.py$' | sort -u > artifact/evidence/path_candidates.txt || true
          : > artifact/evidence/blob_audit.tsv
          found=0
          while read -r oid path; do
            [ -n "${oid:-}" ] || continue
            if git cat-file -e "$oid^{blob}" 2>/dev/null; then
              git cat-file blob "$oid" > /tmp/candidate.py
              sha=$(sha256sum /tmp/candidate.py | awk '{print $1}')
              printf '%s\t%s\t%s\n' "$sha" "$oid" "$path" >> artifact/evidence/blob_audit.tsv
              if [ "$sha" = "$expected" ]; then
                cp /tmp/candidate.py artifact/recovered/absorption_flow_benchmark.py
                printf '%s\t%s\n' "$oid" "$path" > artifact/evidence/BASELINE_SOURCE_FOUND.tsv
                found=1
                break
              fi
            fi
          done < artifact/evidence/path_candidates.txt
          if [ "$found" -eq 0 ]; then
            printf 'expected_sha256\t%s\nstatus\tNOT_FOUND_IN_RETAINED_PR_REFS\n' "$expected" > artifact/evidence/BASELINE_SOURCE_NOT_FOUND.tsv
          fi
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS
      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: aligned-continuation-audit-source-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==2.3.3' 'pandas==2.3.3' 'pyarrow==21.0.0' 'scikit-learn==1.7.2'
      - name: Recover exact registered baseline source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aligned-source"
          git fetch --quiet --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*' || true
          blob='2eb432b03b7126d0feda365c4af44669c58336a0'
          git cat-file blob "$blob" > "$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py"
          echo 'e9ce4e211e060d74cfb43759bb6afb69616cc8b12fa66aa6ad317ceac01d56b8  '"$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py" | sha256sum -c -
          python -m py_compile \
            "$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py" \
            research/aligned_continuation_audit/download_registered_source.py \
            research/aligned_continuation_audit/current_contract_audit.py \
            research/aligned_continuation_audit/policy_refinement.py
      - name: Restore official source cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/aligned-data/raw
          key: aligned-continuation-binance-usdm-202203-202312-v1
      - name: Download and verify registered Binance source
        run: |
          set -euo pipefail
          python research/aligned_continuation_audit/download_registered_source.py \
            --root "$RUNNER_TEMP/aligned-data" \
            --workers 16
      - name: Run registered, latency-corrected, no-time and protected-flow paths
        run: |
          set -euo pipefail
          mkdir -p artifact/aligned-continuation-current-contract
          python research/aligned_continuation_audit/current_contract_audit.py \
            --original-source "$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py" \
            --prepared-root "$RUNNER_TEMP/aligned-data/prepared" \
            --output artifact/aligned-continuation-current-contract
      - name: Run exact-rerouting and causal ML policy refinement
        run: |
          set -euo pipefail
          python research/aligned_continuation_audit/policy_refinement.py \
            --original-source "$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py" \
            --audit-source research/aligned_continuation_audit/current_contract_audit.py \
            --prepared-root "$RUNNER_TEMP/aligned-data/prepared" \
            --output artifact/aligned-continuation-current-contract
          cp "$RUNNER_TEMP/aligned-data/SOURCE_MANIFEST.json" \
            artifact/aligned-continuation-current-contract/SOURCE_MANIFEST.json
          cp "$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py" \
            artifact/aligned-continuation-current-contract/REGISTERED_SOURCE.py
      - name: Verify result contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifact/aligned-continuation-current-contract')
          result=json.loads((root/'RESULT.json').read_text())
          policy=json.loads((root/'POLICY_RESULT.json').read_text())
          expected='aligned_continuation|h48|z3-inf|t3|f0.1|e0.45|hold0.7|buf0.5|rr4|life720|xidiosyncratic'
          assert result['candidate_id']==expected and policy['candidate_id']==expected
          assert {row['mode'] for row in result['paths']}=={
              'registered_horizon','corrected_horizon','stop_target_only','protected_flow'
          }
          assert {row['cost'] for row in result['paths']}=={'15bp','18bp','24bp','30bp'}
          assert policy['winner_deletion_semantics'].startswith('remove selected event')
          assert result['orders_submitted'] is False and policy['orders_submitted'] is False
          print(json.dumps({'lifecycle':result['decision'],'policy':policy['decision']},sort_keys=True))
          PY
      - name: Hash compact evidence
        run: |
          find artifact/aligned-continuation-current-contract -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > artifact/aligned-continuation-current-contract/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aligned-continuation-current-contract-${{ github.sha }}
          path: artifact/aligned-continuation-current-contract
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  official_2024h1_events:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.3' 'pandas==2.3.3' 'pyarrow==21.0.0'
      - name: Recover exact registered source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aligned-source"
          git fetch --quiet --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*' || true
          blob='2eb432b03b7126d0feda365c4af44669c58336a0'
          git cat-file blob "$blob" > "$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py"
          echo 'e9ce4e211e060d74cfb43759bb6afb69616cc8b12fa66aa6ad317ceac01d56b8  '"$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py" | sha256sum -c -
          python -m py_compile research/aligned_continuation_audit/generate_official_2024h1_events.py
      - name: Restore official Binance warmup and H1 cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/aligned-2024h1/raw
          key: aligned-continuation-binance-usdm-202312-202406-v1
      - name: Generate frozen event tape
        run: |
          mkdir -p artifact/aligned-continuation-2024h1-events
          python research/aligned_continuation_audit/generate_official_2024h1_events.py \
            --original-source "$RUNNER_TEMP/aligned-source/absorption_flow_benchmark.py" \
            --work-root "$RUNNER_TEMP/aligned-2024h1" \
            --output artifact/aligned-continuation-2024h1-events \
            --workers 12
          find artifact/aligned-continuation-2024h1-events -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > artifact/aligned-continuation-2024h1-events/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aligned-continuation-2024h1-events-${{ github.sha }}
          path: artifact/aligned-continuation-2024h1-events
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
