name: ML Coinbase outcome-sealed source debug export

on:
  push:
    branches:
      - agent/r11-ml-coinbase-spot-leader-001
    paths:
      - ".github/workflows/ml-coinbase-debug-export.yml"
      - "research/ml_coinbase_spot_leader_20260726/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ml-coinbase-debug-export.yml"
      - "research/ml_coinbase_spot_leader_20260726/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-coinbase-debug-export-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scikit-learn==1.6.1" \
            "pytest==8.3.4"

      - name: Reconstruct original exact source and capture all pre-market evidence
        shell: bash
        run: |
          set -u
          root=research/ml_coinbase_spot_leader_20260726
          out=research_runs/ml_coinbase_debug_export
          mkdir -p "$out"

          python "$root/reconstruct.py" >"$out/reconstruct.stdout" 2>"$out/reconstruct.stderr"
          echo "$?" >"$out/reconstruct.status"

          for file in run.py test_run.py bundle_manifest.json reconstruct.py preregistration.json; do
            if test -f "$root/$file"; then
              cp "$root/$file" "$out/$file"
            fi
          done
          sha256sum "$out"/* >"$out/EXPORTED_SHA256SUMS.txt" 2>/dev/null || true

          python -m py_compile "$root/reconstruct.py" "$root/run.py" "$root/test_run.py" \
            >"$out/compile.stdout" 2>"$out/compile.stderr"
          echo "$?" >"$out/compile.status"

          PYTHONPATH="$root" pytest -q "$root/test_run.py" \
            >"$out/pytest.stdout" 2>"$out/pytest.stderr"
          echo "$?" >"$out/pytest.status"

          PYTHONPATH="$root" python "$root/run.py" self-test \
            >"$out/self_test.stdout" 2>"$out/self_test.stderr"
          echo "$?" >"$out/self_test.status"

          python scripts/validate_project.py \
            >"$out/project_validation.stdout" 2>"$out/project_validation.stderr"
          echo "$?" >"$out/project_validation.status"

          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('research_runs/ml_coinbase_debug_export')
          payload={
              'claim_id':'CLM-20260726-1935-ML-COINBASE-SPOT-001',
              'stage':'ORIGINAL_SOURCE_AND_TEST_DEBUG_ONLY_NO_MARKET_DATA_NO_MODEL_NO_PNL',
              'market_rows_parsed':False,
              'model_fit':False,
              'pnl_computed':False,
              'orders_submitted':False,
              'statuses':{
                  name:int(out.joinpath(f'{name}.status').read_text().strip())
                  for name in ('reconstruct','compile','pytest','self_test','project_validation')
                  if out.joinpath(f'{name}.status').exists()
              },
          }
          out.joinpath('ATTESTATION.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(payload,sort_keys=True))
          PY

          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-coinbase-debug-export-${{ github.sha }}
          path: research_runs/ml_coinbase_debug_export
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
