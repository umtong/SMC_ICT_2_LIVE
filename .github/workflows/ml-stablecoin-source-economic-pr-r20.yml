name: Stablecoin pinned source and economic PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-stablecoin-source-economic-pr-r20.yml'
      - 'research/ml_stablecoin_issuance_20260726/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stablecoin-pinned-pr-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-economic:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      SOURCE_ROOT: research/ml_stablecoin_issuance_20260726
      SOURCE_OUT: research_runs/ml_stablecoin_pinned_pr/source
      ECON_ROOT: research/ml_stablecoin_issuance_economic_20260726
      ECON_OUT: research_runs/ml_stablecoin_pinned_pr/economic
      MARKET_CACHE: ${{ runner.temp }}/stablecoin-market
      ECONOMIC_SHA: 6cbff14ed8dd5ebba3b6b47bf6854bf090e4db2c

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            requests==2.32.4 pytest==8.3.5 \
            numpy==2.1.3 pandas==2.2.3 scikit-learn==1.6.1 pyarrow==18.1.0

      - name: Validate pinned source contract
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_OUT"
          python -m json.tool "$SOURCE_ROOT/EXECUTION_CORRECTION_017_PINNED_SOURCE_ECONOMIC_SNAPSHOT_BEFORE_OUTCOME.json" >/dev/null
          python -m py_compile "$SOURCE_ROOT"/source_gate*.py "$SOURCE_ROOT/test_source_gate.py" "$SOURCE_ROOT/run_pinned_snapshot_source.py"
          PYTHONPATH="$SOURCE_ROOT" pytest -q "$SOURCE_ROOT/test_source_gate.py" 2>&1 | tee "$SOURCE_OUT/PYTEST.log"
          PYTHONPATH="$SOURCE_ROOT" python "$SOURCE_ROOT/source_gate_blockscout_authoritative.py" --self-test 2>&1 | tee "$SOURCE_OUT/AUTHORITY_SELF_TEST.log"
          PYTHONPATH="$SOURCE_ROOT" python "$SOURCE_ROOT/run_pinned_snapshot_source.py" --self-test 2>&1 | tee "$SOURCE_OUT/BATCH_SELF_TEST.log"

      - name: Run corrected complete pre-2024 source gate
        run: |
          set +e
          PYTHONPATH="$SOURCE_ROOT" python "$SOURCE_ROOT/run_pinned_snapshot_source.py" \
            --output "$SOURCE_OUT" 2>&1 | tee "$SOURCE_OUT/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$SOURCE_OUT/RUN_EXIT_CODE.txt"
          if [[ ! -f "$SOURCE_OUT/SOURCE_GATE_RESULT.json" ]]; then
            python "$SOURCE_ROOT/write_transport_failure.py" \
              --output "$SOURCE_OUT" \
              --transport TRANSPORT-20260726-ML-STABLECOIN-PINNED-BATCH-017 \
              --exit-code "$rc"
          fi

      - name: Verify source decision and seal
        id: source
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['SOURCE_OUT'])/'SOURCE_GATE_RESULT.json').read_text())
          assert r['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert r['status'] in {'PASS','FAIL_BELOW_SOURCE_DENSITY_OR_COVERAGE','SOURCE_UNAVAILABLE_OR_TRANSPORT_FAILURE'}
          assert r['market_outcome_opened'] is False
          assert r['model_fit'] is False
          assert r['trade_or_pnl_opened'] is False
          assert r['official_2024_2026_opened'] is False
          assert r['orders_submitted'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"authorized={'true' if r['status']=='PASS' else 'false'}\n")
          print(json.dumps({'status':r['status'],'events':r.get('event_count'),'months':len(r.get('months_with_events',[])),'tokens':r.get('distinct_tokens')},sort_keys=True))
          PY

      - uses: actions/cache@v4
        if: steps.source.outputs.authorized == 'true'
        with:
          path: ${{ env.MARKET_CACHE }}
          key: stablecoin-market-2020-12-2023-12-v1

      - name: Materialize pinned economic engine
        if: steps.source.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$ECONOMIC_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$ECONOMIC_SHA"
          rm -rf "$ECON_ROOT"
          git archive "$ECONOMIC_SHA" "$ECON_ROOT" | tar -x
          python "$ECON_ROOT/reconstruct.py"
          python -m py_compile "$ECON_ROOT/run.py" "$ECON_ROOT/test_run.py" "$ECON_ROOT/reconstruct.py"
          PYTHONPATH="$ECON_ROOT" pytest -q "$ECON_ROOT/test_run.py"
          PYTHONPATH="$ECON_ROOT" python "$ECON_ROOT/run.py" self-test

      - name: Run frozen pre-2024 economic screen
        if: steps.source.outputs.authorized == 'true'
        run: |
          set -u
          mkdir -p "$ECON_OUT" "$MARKET_CACHE"
          set +e
          PYTHONPATH="$ECON_ROOT" python "$ECON_ROOT/run.py" run \
            --events "$SOURCE_OUT/EVENTS.jsonl" \
            --market-cache "$MARKET_CACHE" \
            --output "$ECON_OUT" 2>&1 | tee "$ECON_OUT/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$ECON_OUT/RUN_EXIT_CODE.txt"
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then exit "$rc"; fi
          test -f "$ECON_OUT/RESULT.json"

      - name: Enforce scientific and sequential boundaries
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['SOURCE_OUT'])/'SOURCE_GATE_RESULT.json').read_text())
          if s['status']=='PASS':
              r=json.loads((Path(os.environ['ECON_OUT'])/'RESULT.json').read_text())
              assert r['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
              assert r['orders_submitted'] is False
              assert r['official_2024h1_opened'] is False
              assert r['official_2024_2026_opened'] is False
              assert r['status'] in {'PRE2024_BELOW_GATE','PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1'}
              print(json.dumps({'source':s['status'],'economic':r['status'],'confirmation_gate':r['confirmation_gate'].get('all'),'development_opened':r['development_opened'],'next':'OFFICIAL_2024H1' if r['status'].endswith('READY_FOR_SEQUENTIAL_2024H1') else 'CHANGE_ALPHA'},sort_keys=True))
          else:
              print(json.dumps({'source':s['status'],'economic':'NOT_OPENED','next':'CLOSE_SOURCE_OR_TRANSPORT_ONLY'},sort_keys=True))
          PY

      - name: Freeze evidence hashes
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('research_runs/ml_stablecoin_pinned_pr'); root.mkdir(parents=True,exist_ok=True)
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='OUTPUT_SHA256SUMS.txt'):
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n")
          (root/'OUTPUT_SHA256SUMS.txt').write_text(''.join(rows),encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-pinned-pr-${{ github.run_id }}
          path: research_runs/ml_stablecoin_pinned_pr
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
