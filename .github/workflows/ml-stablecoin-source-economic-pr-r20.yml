name: Stablecoin corrected source and causal economic decision

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-stablecoin-source-economic-pr-r20.yml'
      - 'research/ml_stablecoin_issuance_20260726/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stablecoin-causal-pr-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-economic:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      SOURCE_ROOT: research/ml_stablecoin_issuance_20260726
      SOURCE_OUT: research_runs/ml_stablecoin_causal_pr/source
      ECON_ROOT: research/ml_stablecoin_issuance_economic_20260726
      ECON_OUT: research_runs/ml_stablecoin_causal_pr/economic
      MARKET_CACHE: ${{ runner.temp }}/stablecoin-market
      ECONOMIC_SHA: b7f67a4e89c731b1d322a6e0ace86f41f32b7bc8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen source and economic environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            requests==2.32.4 pytest==8.3.5 \
            numpy==2.1.3 pandas==2.2.3 scikit-learn==1.6.1 pyarrow==18.1.0

      - name: Validate corrected source identity before network access
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_OUT"
          python -m json.tool "$SOURCE_ROOT/CORRECTION_010_USDT_ISSUE_REDEEM_EVENT_SCHEMA_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$SOURCE_ROOT/CORRECTION_011_BLOCKSCOUT_NULL_TOPIC_PADDING_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$SOURCE_ROOT/CORRECTION_013_BIND_CORRECTED_SOURCE_SCHEMA_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$SOURCE_ROOT/EXECUTION_CORRECTION_018_PIN_CAUSAL_V2_AND_BOUNDARY_MARK_BEFORE_OUTCOME.json" >/dev/null
          python -m py_compile \
            "$SOURCE_ROOT"/source_gate*.py \
            "$SOURCE_ROOT/run_pinned_snapshot_source.py" \
            "$SOURCE_ROOT/test_source_gate.py"
          PYTHONPATH="$SOURCE_ROOT" pytest -q "$SOURCE_ROOT/test_source_gate.py" 2>&1 | tee "$SOURCE_OUT/PYTEST.log"
          PYTHONPATH="$SOURCE_ROOT" python "$SOURCE_ROOT/run_pinned_snapshot_source.py" --self-test 2>&1 | tee "$SOURCE_OUT/SELF_TEST.log"

      - name: Run corrected complete 2021-2023 source gate
        run: |
          set -u
          rm -rf "$SOURCE_OUT/run"
          mkdir -p "$SOURCE_OUT/run"
          set +e
          PYTHONPATH="$SOURCE_ROOT" python "$SOURCE_ROOT/run_pinned_snapshot_source.py" \
            --output "$SOURCE_OUT/run" 2>&1 | tee "$SOURCE_OUT/run/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$SOURCE_OUT/run/RUN_EXIT_CODE.txt"
          if [[ ! -f "$SOURCE_OUT/run/SOURCE_GATE_RESULT.json" ]]; then
            python "$SOURCE_ROOT/write_transport_failure.py" \
              --output "$SOURCE_OUT/run" \
              --transport TRANSPORT-20260727-ML-STABLECOIN-PINNED-CAUSAL-018 \
              --exit-code "$rc"
          fi
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then
            echo "source transport returned unexpected exit $rc; durable sealed result retained" >&2
          fi

      - id: source
        name: Verify corrected source decision and outcome seal
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['SOURCE_OUT'])/'run'
          r=json.loads((root/'SOURCE_GATE_RESULT.json').read_text())
          assert r['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert r['status'] in {'PASS','FAIL_BELOW_SOURCE_DENSITY_OR_COVERAGE','SOURCE_UNAVAILABLE_OR_TRANSPORT_FAILURE'}
          assert r['market_outcome_opened'] is False
          assert r['model_fit'] is False
          assert r['trade_or_pnl_opened'] is False
          assert r['official_2024_2026_opened'] is False
          assert r['orders_submitted'] is False
          authorized=r['status']=='PASS'
          if authorized:
              expected_schema='STABLECOIN_SUPPLY_USDT_ISSUE_REDEEM_USDC_ZERO_TRANSFER_V1'
              expected_correction='CORRECTION-20260726-ML-STABLECOIN-USDT-ISSUE-REDEEM-010'
              m=json.loads((root/'SOURCE_MANIFEST.json').read_text())
              events=root/'EVENTS.jsonl'
              rows=[json.loads(x) for x in events.read_text().splitlines() if x.strip()]
              checks=r.get('pass_checks',{})
              assert checks and all(v is True for v in checks.values())
              assert r.get('source_schema_id')==expected_schema
              assert r.get('source_correction_id')==expected_correction
              assert m.get('source_schema_id')==expected_schema
              assert m.get('source_correction_id')==expected_correction
              assert r.get('event_semantics',{}).get('ordinary_usdt_transfer_excluded') is True
              assert int(r['event_count'])>=120
              assert len(r['months_with_events'])>=24
              assert sorted(r['distinct_tokens'])==['USDC','USDT']
              assert {x['token'] for x in rows}=={'USDC','USDT'}
              assert {x['direction'] for x in rows}.issubset({'MINT','BURN'})
              assert all(int(x['block_timestamp'])<1704067200 for x in rows)
              assert all(int(x['available_timestamp_12'])<1704067200 for x in rows)
              assert all(int(x['available_timestamp_64'])<1704067200 for x in rows)
              assert hashlib.sha256(events.read_bytes()).hexdigest()==m['events_sha256']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"authorized={'true' if authorized else 'false'}\n")
              if authorized:
                  f.write(f"events={root/'EVENTS.jsonl'}\n")
          print(json.dumps({'status':r['status'],'events':r.get('event_count'),'months':len(r.get('months_with_events',[])),'tokens':r.get('distinct_tokens'),'authorized':authorized},sort_keys=True))
          PY

      - uses: actions/cache@v4
        if: steps.source.outputs.authorized == 'true'
        with:
          path: ${{ env.MARKET_CACHE }}
          key: stablecoin-market-2020-12-2023-12-causal-v2

      - name: Materialize exact causal economic engine
        if: steps.source.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$ECONOMIC_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$ECONOMIC_SHA"
          rm -rf "$ECON_ROOT"
          git archive "$ECONOMIC_SHA" "$ECON_ROOT" | tar -x
          python "$ECON_ROOT/reconstruct.py"
          python -m py_compile \
            "$ECON_ROOT/run.py" "$ECON_ROOT/run_causal.py" \
            "$ECON_ROOT/test_run.py" "$ECON_ROOT/test_run_causal.py" \
            "$ECON_ROOT/reconstruct.py"
          PYTHONPATH="$ECON_ROOT" pytest -q "$ECON_ROOT/test_run.py" "$ECON_ROOT/test_run_causal.py"
          PYTHONPATH="$ECON_ROOT" python "$ECON_ROOT/run.py" self-test
          PYTHONPATH="$ECON_ROOT" python "$ECON_ROOT/run_causal.py" self-test
          printf '%s\n' "$ECONOMIC_SHA" > "$SOURCE_OUT/PINNED_ECONOMIC_SHA.txt"

      - name: Run causal pre-2024 economic screen immediately
        if: steps.source.outputs.authorized == 'true'
        run: |
          set -u
          rm -rf "$ECON_OUT"
          mkdir -p "$ECON_OUT" "$MARKET_CACHE"
          set +e
          PYTHONPATH="$ECON_ROOT" python "$ECON_ROOT/run_causal.py" run \
            --events "${{ steps.source.outputs.events }}" \
            --market-cache "$MARKET_CACHE" \
            --output "$ECON_OUT" 2>&1 | tee "$ECON_OUT/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$ECON_OUT/RUN_EXIT_CODE.txt"
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then exit "$rc"; fi
          test -f "$ECON_OUT/RESULT.json"
          test -f "$ECON_OUT/FULL_RESULT.json"

      - name: Enforce causal account and sequential boundaries
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          sroot=Path(os.environ['SOURCE_OUT'])/'run'
          s=json.loads((sroot/'SOURCE_GATE_RESULT.json').read_text())
          assert s['orders_submitted'] is False
          if s['status']!='PASS':
              print(json.dumps({'source_status':s['status'],'economic_status':'NOT_OPENED','next_stage':'CLOSE_SOURCE_OR_REPAIR_TRANSPORT_ONLY'},sort_keys=True))
              raise SystemExit(0)
          eroot=Path(os.environ['ECON_OUT'])
          r=json.loads((eroot/'RESULT.json').read_text())
          full=json.loads((eroot/'FULL_RESULT.json').read_text())
          assert r['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert r['engine']=='ML_STABLECOIN_ISSUANCE_FIRST_PASSAGE_CAUSAL_V2'
          assert r['hard_validity_correction']=='CORRECTION-20260726-ML-STABLECOIN-CAUSAL-FEATURE-BOUNDARY-MARK-006'
          assert r['orders_submitted'] is False
          assert r['official_2024h1_opened'] is False
          assert r['official_2024_2026_opened'] is False
          assert r['status'] in {'PRE2024_BELOW_GATE','PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1'}
          serialized=json.dumps(full,sort_keys=True)
          assert '"exit_reason": "SOURCE_BOUNDARY"' not in serialized
          assert '"exit_reason": "MARK_TO_MARKET_STAGE_BOUNDARY"' in serialized or '"boundary_mark_count": 0' in serialized
          def walk(v):
              if isinstance(v,dict):
                  if 'forced_boundary_close' in v: assert v['forced_boundary_close'] is False
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(full)
          nxt='CHANGE_ALPHA'
          if r['status']=='PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1':
              assert r['development_gate']['all'] is True
              assert r['risk_search']['selected'] is not None
              assert r['risk_search']['selected']['growth']>0
              assert r['risk_search']['selected']['liquidation'] is False
              nxt='OFFICIAL_2024H1_IMMEDIATELY'
          print(json.dumps({'source_status':s['status'],'economic_status':r['status'],'development_gate':r['development_gate'].get('all'),'selected_risk_path':r.get('risk_search',{}).get('selected') if r.get('risk_search') else None,'next_stage':nxt},sort_keys=True))
          PY

      - name: Freeze immutable evidence hashes
        if: always()
        run: |
          set -euo pipefail
          root=research_runs/ml_stablecoin_causal_pr
          mkdir -p "$root/inputs"
          cp "$SOURCE_ROOT/EXECUTION_CORRECTION_018_PIN_CAUSAL_V2_AND_BOUNDARY_MARK_BEFORE_OUTCOME.json" "$root/inputs/"
          if [ -d "$ECON_ROOT" ]; then
            cp "$ECON_ROOT/CORRECTION_006_CAUSAL_FEATURE_AND_BOUNDARY_MARK_BEFORE_OUTCOME.json" "$root/inputs/" 2>/dev/null || true
            cp "$ECON_ROOT/run_causal.py" "$ECON_ROOT/test_run_causal.py" "$root/inputs/" 2>/dev/null || true
          fi
          find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-causal-pr-${{ github.run_id }}
          path: research_runs/ml_stablecoin_causal_pr
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
