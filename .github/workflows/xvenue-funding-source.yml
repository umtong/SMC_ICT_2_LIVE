name: Cross-venue funding source export

on:
  push:
    branches: [agent/ml-xvenue-funding-inventory-001]
    paths:
      - 'research/ml_xvenue_funding_inventory/download_binance_funding.py'
      - '.github/workflows/xvenue-funding-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas==2.3.3 pyarrow==21.0.0 requests==2.32.5
      - name: Download official Binance funding history
        run: |
          python research/ml_xvenue_funding_inventory/download_binance_funding.py --output artifact/binance_funding
          find artifact/binance_funding -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: xvenue-funding-source-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
