name: Minimal ML mark-index acceptance router

on:
  push:
    branches:
      - agent/r11-ml-mark-acceptance-001
    paths:
      - "research/ml_mark_acceptance_20260726/**"
      - ".github/workflows/ml-mark-acceptance-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/ml_mark_acceptance_20260726/**"
      - ".github/workflows/ml-mark-acceptance-r11.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-mark-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==2.1.3 \
            pandas==2.2.3 \
            requests==2.32.4 \
            scikit-learn==1.6.1 \
            pytest==8.3.4

      - name: Compile and run causal tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_mark_acceptance_20260726
          out=research_runs/ml_mark_acceptance_20260726/r11
          mkdir -p "$out"
          python "$root/reconstruct.py" 2>&1 | tee "$out/RECONSTRUCT.log"
          python -m py_compile "$root/reconstruct.py" "$root/run.py" "$root/test_run.py"
          PYTHONPATH="$root" pytest -q "$root/test_run.py" 2>&1 | tee "$out/PYTEST.log"
          PYTHONPATH="$root" python "$root/run.py" self-test 2>&1 | tee "$out/SELF_TEST.log"
          python scripts/validate_project.py 2>&1 | tee "$out/PROJECT_VALIDATION.log"

      - name: Validate frozen public source and schema
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_mark_acceptance_20260726
          out=research_runs/ml_mark_acceptance_20260726/r11
          cache="$RUNNER_TEMP/ml-mark-acceptance"
          PYTHONPATH="$root" python "$root/run.py" probe \
            --cache "$cache" \
            --output "$out" \
            2>&1 | tee "$out/SOURCE_PROBE.log"

      - name: Run frozen fit and conditional development
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_mark_acceptance_20260726
          out=research_runs/ml_mark_acceptance_20260726/r11
          cache="$RUNNER_TEMP/ml-mark-acceptance"
          PYTHONPATH="$root" python "$root/run.py" run \
            --cache "$cache" \
            --output "$out" \
            2>&1 | tee "$out/RUN.log"

      - name: Enforce authority, chronology and cost monotonicity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('research_runs/ml_mark_acceptance_20260726/r11')
          result=json.loads((out/'RESULT.json').read_text())
          att=json.loads((out/'AUTHORITY_ATTESTATION.json').read_text())
          correction=json.loads(Path('research/ml_mark_acceptance_20260726/RESULT_HANDLING_CORRECTION_001.json').read_text())
          assert result['claim_id']=='CLM-20260726-1940-ML-MARK-ACCEPTANCE-001'
          assert result['2024_opened'] is False
          assert result['2025_opened'] is False
          assert result['2026_opened'] is False
          assert result['orders_submitted'] is False
          assert result['paper_live_started'] is False
          assert att['orders_submitted'] is False
          assert correction['scientific_changes'] is False
          confirmation=result.get('confirmation')
          if confirmation is not None:
              paths=confirmation['replays']
              assert paths['12']['final_nav'] >= paths['18']['final_nav'] >= paths['24']['final_nav']
              assert paths['18']['liquidated'] is False or result['fit_gate_passed'] is False
          if result.get('fit_gate_passed') is not True:
              assert result['2023_opened'] is False
          print(json.dumps({
              'status':result['status'],
              'fit_gate_passed':result.get('fit_gate_passed'),
              '2023_opened':result['2023_opened'],
              'ranking_role':result['ranking_role'],
          },sort_keys=True))
          PY
          (
            cd research_runs/ml_mark_acceptance_20260726/r11
            grep -v '  RUN.log$' SHA256SUMS.txt > SHA256SUMS.verify
            sha256sum --check SHA256SUMS.verify
            rm SHA256SUMS.verify
          )

      - name: Record immutable input hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_mark_acceptance_20260726
          out=research_runs/ml_mark_acceptance_20260726/r11
          mkdir -p "$out"
          sha256sum \
            "$root/WORK_CLAIM.json" \
            "$root/preregistration.json" \
            "$root/RESULT_HANDLING_CORRECTION_001.json" \
            "$root/README.md" \
            "$root/SOURCES.md" \
            "$root/reconstruct.py" \
            "$root"/run_py.gz.b64.part* \
            "$root"/test_py.gz.b64.part* \
            "$root/run.py" \
            "$root/test_run.py" \
            .github/workflows/ml-mark-acceptance-r11.yml \
            > "$out/INPUT_SHA256SUMS.txt"
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-mark-acceptance-r11-${{ github.sha }}
          path: research_runs/ml_mark_acceptance_20260726/r11
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
