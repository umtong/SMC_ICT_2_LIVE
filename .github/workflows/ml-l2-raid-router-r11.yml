name: ML L2 external-liquidity raid acceptance

on:
  push:
    branches:
      - agent/r11-ml-l2-raid-router-001
    paths:
      - "research/ml_l2_raid_router_20260726/**"
      - ".github/workflows/ml-l2-raid-router-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/ml_l2_raid_router_20260726/**"
      - ".github/workflows/ml-l2-raid-router-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ml-l2-raid-router-r11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fatal-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "pyarrow==18.1.0" \
            "scikit-learn==1.6.1" \
            "pytest==8.3.4"

      - name: Reconstruct and test the frozen scientific source
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_l2_raid_router_20260726
          python "$root/reconstruct.py"
          python -m py_compile "$root/reconstruct.py" "$root/run.py" "$root/test_run.py"
          PYTHONPATH="$root" pytest -q "$root/test_run.py"
          PYTHONPATH="$root" python "$root/run.py" --self-test
          python scripts/validate_project.py

      - name: Download the immutable parent L2 artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency
          gh run download 30182786091 \
            --repo umtong/SMC_ICT_2_LIVE \
            --name bybit-l2-resiliency-efa714dfee803544a26ba3609b0c1a14d7693831 \
            --dir dependency
          test "$(sha256sum dependency/output/compact_states/2022-07-01_BTCUSDT_state.parquet | cut -d' ' -f1)" = "da8f581e64ba6f5305c57c0d76403b262d1b0ff48ad540e19302f6bf7416c38b"
          test "$(sha256sum dependency/output/compact_states/2023-07-01_BTCUSDT_state.parquet | cut -d' ' -f1)" = "8872cd2a21960666f10f3d35c788a16faefd007d02a30389079def794e90389f"

      - name: Run frozen fit and conditional untouched development
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_l2_raid_router_20260726
          out=research_runs/ml_l2_raid_router_20260726/r11
          mkdir -p "$out"
          set +e
          PYTHONPATH="$root" python "$root/run.py" \
            --dependency-root dependency \
            --output "$out" \
            2>&1 | tee "$out/RUN.log"
          status=${PIPESTATUS[0]}
          set -e
          if test "$status" -ne 0; then
            python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          out = Path("research_runs/ml_l2_raid_router_20260726/r11")
          log = (out / "RUN.log").read_text(encoding="utf-8")
          pattern = r"RuntimeError: insufficient model rows train=(\d+) calibration=(\d+)"
          match = re.search(pattern, log)
          if match is None:
              raise SystemExit("scientific workflow failed for a reason other than frozen event scarcity")
          train, calibration = map(int, match.groups())
          # Counts were already exposed by the first immutable execution of this exact source:
          # fit event rows 22: train=14 calibration=4 confirmation=4.
          # This post-outcome change only converts that terminal condition into a durable result.
          total, confirmation = 22, 4
          if (train, calibration) != (14, 4):
              raise SystemExit("frozen event-scarcity counts changed unexpectedly")
          result = {
              "claim_id": "CLM-20260726-1740-ML-L2-RAID-001",
              "result_id": "RES-20260726-ML-L2-RAID-EVENT-SCARCITY-001",
              "engine_version": "ML-L2-RAID-ACCEPTANCE-V1",
              "status": "FIT_EVENT_SCARCITY",
              "hard_validity": "PASS_INITIAL_CAUSAL_EVENT_SCARCITY",
              "economic_status": "BELOW_GATE_EVENT_SCARCITY",
              "ranking_role": "NONE_INITIAL_PRE2024_SCREEN",
              "fit": {
                  "event_rows": total,
                  "partition_rows": {
                      "training": train,
                      "calibration": calibration,
                      "confirmation": confirmation,
                  },
                  "model_fitted": False,
                  "reason": "Frozen exact previous-five-minute first-raid event produced too few chronological rows to fit and calibrate the single preregistered model.",
                  "gate_checks": {
                      "resolved_confirmation_rows_at_least_40": confirmation >= 40,
                      "model_auc_at_least_0_55": False,
                      "auc_lift_over_distance_baseline_at_least_0_02": False,
                      "positive_brier_skill_over_distance_baseline": False,
                      "trade_count_at_18bps_at_least_20": False,
                      "positive_total_return_at_18bps": False,
                      "positive_total_return_at_24bps": False,
                      "positive_median_trade_at_12bps": False,
                      "positive_winner_removed_return_at_12bps": False,
                      "both_confirmation_halves_positive_at_18bps": False,
                      "winner_removed_sample_day_growth_at_24bps_at_least_1pct": False,
                  },
              },
              "development": None,
              "development_opened": False,
              "development_source_economically_read": False,
              "prohibited_years_opened": [],
              "orders_submitted": False,
              "live_permission_changed": False,
              "source": {
                  "parent_artifact_id": 8626087323,
                  "parent_workflow_run": 30182786091,
                  "parent_artifact_digest": "sha256:90594acc23e63e97e83347f9b07eb9ac260ba7bb1b87eb72052287a8328ad4a1",
                  "fit_state_sha256": "da8f581e64ba6f5305c57c0d76403b262d1b0ff48ad540e19302f6bf7416c38b",
                  "conditional_state_sha256": "8872cd2a21960666f10f3d35c788a16faefd007d02a30389079def794e90389f",
              },
              "decision": "Retire this exact event definition without loosening the raid, decision delay, structural destinations, features, partitions, probability gate, cost, risk or leverage. Reopen only with a materially denser information unit or payoff.",
              "limitations": [
                  "No model or account path is economically interpretable because the frozen event population is below the minimum ML sample.",
                  "The conditional 2023 frame remains unopened by the scientific evaluator.",
                  "This result cannot enter the strategy ranking or change live permission.",
              ],
          }
          (out / "RESULT.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
            (cd "$out" && sha256sum RESULT.json RUN.log > SHA256SUMS.txt)
          fi

      - name: Verify boundaries and record immutable inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_l2_raid_router_20260726
          out=research_runs/ml_l2_raid_router_20260726/r11
          mkdir -p "$out"
          if test -f "$out/RESULT.json"; then
            (cd "$out" && sha256sum --check SHA256SUMS.txt)
            python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('research_runs/ml_l2_raid_router_20260726/r11/RESULT.json').read_text())
          assert result['prohibited_years_opened'] == []
          assert result['orders_submitted'] is False
          assert result['ranking_role'] == 'NONE_INITIAL_PRE2024_SCREEN'
          print(json.dumps(result, sort_keys=True))
          PY
          fi
          sha256sum \
            "$root/WORK_CLAIM.json" \
            "$root/preregistration.json" \
            "$root/README.md" \
            "$root/SOURCES.md" \
            "$root/bundle_manifest.json" \
            "$root/reconstruct.py" \
            "$root/source_bundle.tar.gz.b64.part00" \
            "$root/source_bundle.tar.gz.b64.part01" \
            "$root/run.py" \
            "$root/test_run.py" \
            > "$out/INPUT_SHA256SUMS.txt"
          python scripts/validate_project.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-l2-raid-router-r11-${{ github.sha }}
          path: research_runs/ml_l2_raid_router_20260726/r11
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
