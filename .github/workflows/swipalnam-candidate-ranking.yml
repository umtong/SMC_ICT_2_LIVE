name: Swipalnam candidate ranking

on:
  push:
    branches: [agent/r23-swipalnam-liquidity-delivery-ml-001]
    paths:
      - research/swipalnam_smc_ml/RUN_POINTER*.json
      - .github/workflows/swipalnam-candidate-ranking.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swipalnam-candidate-ranking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Build normalized provisional ranking
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('research/swipalnam_smc_ml')
          candidates = []
          for path in sorted(root.glob('RUN_POINTER*.json')):
              try:
                  payload = json.loads(path.read_text())
              except Exception:
                  continue
              if 'full_period_metrics' in payload:
                  metrics = payload.get('full_period_metrics') or {}
                  period = '2024-01-01_to_2026-06-30'
                  stage = payload.get('validation_stage') or 'continuous_full_period_preliminary'
              else:
                  metrics = payload.get('provisional_2024h1_metrics') or {}
                  period = '2024_H1'
                  stage = payload.get('validation_stage') or 'causal_2024H1_preliminary'
              growth = metrics.get('geometric_daily_growth')
              multiple = metrics.get('account_multiple')
              if growth is None or multiple is None:
                  continue
              liquidations = int(metrics.get('liquidation_events') or 0)
              exact_nav = 'V5_NAV' in path.name or 'exact_daily' in str(payload.get('variant', ''))
              valid_path = float(metrics.get('final_nav') or 0) > 0 and liquidations == 0
              result_id = payload.get('result_id') or f"R-{path.stem.replace('RUN_POINTER_', '')}"
              confidence = (
                  'higher_provisional_exact_midnight_NAV' if exact_nav
                  else 'lower_provisional_realized_state_daily_NAV'
              )
              candidates.append({
                  'result_id': result_id,
                  'source_pointer': str(path),
                  'system_id': payload.get('system_id'),
                  'period': period,
                  'validation_stage': stage,
                  'comparison_confidence': confidence,
                  'valid_path': valid_path,
                  'geometric_daily_growth': float(growth),
                  'target_gap': float(growth) - 0.01,
                  'account_multiple': float(multiple),
                  'final_nav': metrics.get('final_nav'),
                  'max_drawdown': metrics.get('max_drawdown'),
                  'completed_trades': metrics.get('completed_trades'),
                  'profit_factor': metrics.get('profit_factor'),
                  'top_5_pnl_share': metrics.get('top_5_pnl_share'),
                  'liquidation_events': liquidations,
                  'target_hit': float(growth) >= 0.01,
                  'selected_structural_configuration': payload.get('selected_structural_configuration'),
                  'selected_retraining_policy': payload.get('selected_retraining_policy'),
                  'selected_account_configuration': payload.get('selected_account_configuration'),
                  'workflow_run_id': payload.get('workflow_run_id'),
                  'artifact_name': payload.get('artifact_name'),
              })

          # Invalid account paths are always last.  Growth and account multiple
          # are the primary quantitative axes; exact-NAV status is retained as
          # confidence metadata rather than silently changing the result.
          candidates.sort(
              key=lambda item: (
                  bool(item['valid_path']),
                  float(item['geometric_daily_growth']),
                  float(item['account_multiple']),
                  int(item['completed_trades'] or 0),
              ),
              reverse=True,
          )
          for rank, item in enumerate(candidates, 1):
              item['rank'] = rank
          ranking = {
              'schema_version': 1,
              'scope': 'swipalnam_transcript_grounded_claim_candidates',
              'target_geometric_daily_growth': 0.01,
              'ranking_rule': 'valid path, then cost-adjusted geometric daily growth, account multiple, completed trades',
              'warning': 'H1 and full-period or realized-state and exact-midnight-NAV results are marked with different comparison confidence; this file does not conceal that mismatch.',
              'candidates': candidates,
          }
          (root / 'CANDIDATE_RANKING.json').write_text(json.dumps(ranking, ensure_ascii=False, indent=2, sort_keys=True)+'\n')
          current = candidates[0] if candidates else {
              'result_id': None,
              'validation_stage': 'no_completed_result',
              'geometric_daily_growth': None,
              'account_multiple': None,
              'selection_reason': 'no completed numerical pointer exists',
          }
          current = dict(current)
          current['selection_reason'] = (
              'highest valid cost-adjusted geometric daily growth among completed claim candidates; confidence limitations remain explicit'
              if candidates else current['selection_reason']
          )
          (root / 'CURRENT_BEST.json').write_text(json.dumps(current, ensure_ascii=False, indent=2, sort_keys=True)+'\n')
          PY
      - name: Commit ranking update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/swipalnam_smc_ml/CANDIDATE_RANKING.json research/swipalnam_smc_ml/CURRENT_BEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Swipalnam candidate ranking"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
