name: YT Trinity capture history optimization states

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-optimization-state-capture.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Capture latest optimization runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          names=[
            'yt-trinity-cancel-index.yml',
            'yt-trinity-history-single-context.yml',
            'yt-trinity-pd-array-depths.yml',
            'yt-trinity-history-fingerprint-repair.yml',
          ]
          result={}
          for name in names:
              url=f'https://api.github.com/repos/{repo}/actions/workflows/{name}/runs?branch=agent/r22-yt-trinity-ml-001&per_page=20'
              req=urllib.request.Request(url,headers={
                'Accept':'application/vnd.github+json',
                'Authorization':f'Bearer {token}',
                'X-GitHub-Api-Version':'2022-11-28',
                'User-Agent':'github-actions',
              })
              try:
                  with urllib.request.urlopen(req) as response:
                      data=json.load(response)
              except Exception as exc:
                  result[name]={'error':repr(exc)}
                  continue
              result[name]=[
                {k:r.get(k) for k in ('id','head_sha','status','conclusion','created_at','updated_at','run_attempt')}
                for r in data.get('workflow_runs',[])[:8]
              ]
          Path('research/yt_trinity_ml/OPTIMIZATION_RUN_STATES.json').write_text(
              json.dumps(result,indent=2,sort_keys=True)+'\n'
          )
          PY
      - name: Persist and remove carrier
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/OPTIMIZATION_RUN_STATES.json
          git rm .github/workflows/yt-trinity-optimization-state-capture.yml
          git commit -m 'Capture causal history optimization run states'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
