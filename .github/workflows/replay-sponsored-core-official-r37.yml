name: Replay sponsored accepted-delivery Core official path

on:
  push:
    branches: [agent/r37-sponsored-core-source-recovery-001]
    paths:
      - '.github/workflows/replay-sponsored-core-official-r37.yml'
      - 'research/sponsored_delivery_core_official/portable/PORTABLE_BUNDLE.b64.part00'
      - 'research/sponsored_delivery_core_official/portable/PORTABLE_BUNDLE.b64.part01'
      - 'research/sponsored_delivery_core_official/portable/PORTABLE_BUNDLE_MANIFEST.json'
      - 'research/sponsored_delivery_core_official/portable/materialize.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/replay-sponsored-core-official-r37.yml'
      - 'research/sponsored_delivery_core_official/portable/PORTABLE_BUNDLE.b64.part00'
      - 'research/sponsored_delivery_core_official/portable/PORTABLE_BUNDLE.b64.part01'
      - 'research/sponsored_delivery_core_official/portable/PORTABLE_BUNDLE_MANIFEST.json'
      - 'research/sponsored_delivery_core_official/portable/materialize.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: replay-sponsored-core-official-r37-${{ github.sha }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r37-sponsored-core-source-recovery-001
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen runtime and run semantic tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade 'pip==25.1.1'
          python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'pytest==8.3.4'
          root=research/sponsored_delivery_core_official/portable
          python "$root/materialize.py"
          src="$root/materialized"
          python -m py_compile "$src/core_engine.py" "$src/run.py" "$src/test_semantics.py"
          (cd "$src" && python -m pytest -q test_semantics.py)
          python -m json.tool "$src/CONTRACT.json" >/dev/null
          python -m json.tool "$src/SOURCE_MANIFEST.json" >/dev/null

      - name: Download and verify canonical Bybit pandas artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=research/sponsored_delivery_core_official/portable/materialized
          data="$RUNNER_TEMP/core_tables_py"
          zip="$RUNNER_TEMP/canonical.zip"
          mkdir -p "$data"
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/8712672241/zip > "$zip"
          test "$(sha256sum "$zip" | cut -d' ' -f1)" = '950ad2ee0f5d6df729c11a15b817e30e19ead754a35385e5535233d0af8e6c02'
          unzip -q "$zip" -d "$data"
          test "$(sha256sum "$data/EXPORT_MANIFEST.json" | cut -d' ' -f1)" = '8de81d791c9ad177c6fd2046675adda759dc7373aa1d31e01b32d9b7058e8c6d'
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('research/sponsored_delivery_core_official/portable/materialized')
          data=Path(os.environ['RUNNER_TEMP'])/'core_tables_py'
          expected=json.loads((root/'CANONICAL_EXPORT_MANIFEST.json').read_text())
          for item in expected['tables']:
              p=data/item['symbol']/f"{item['table']}.pkl.gz"
              assert p.stat().st_size==item['bytes'], (p,p.stat().st_size,item['bytes'])
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256'], p
          print(json.dumps({'verified_tables':len(expected['tables'])},sort_keys=True))
          PY

      - name: Replay twice and enforce exact scientific identity
        shell: bash
        run: |
          set -euo pipefail
          root=research/sponsored_delivery_core_official/portable/materialized
          data="$RUNNER_TEMP/core_tables_py"
          out1="$RUNNER_TEMP/out1"
          out2="$RUNNER_TEMP/out2"
          (cd "$root" && python run.py --data-root "$data" --output "$out1")
          (cd "$root" && python run.py --data-root "$data" --output "$out2")
          diff -qr "$out1" "$out2"
          test "$(sha256sum "$out1/RESULT.json" | cut -d' ' -f1)" = 'e30db98b7b35575b67958a74ab630b45532ecb1702ea64775e244ab3f6b1c3be'
          (cd "$out1" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'out1/RESULT.json').read_text())
          assert r['parity']['2022']['ordinary_multiple']==1.087189149841832
          assert r['parity']['2023']['ordinary_multiple']==1.0429540636420631
          p=r['costs']['24bp']
          assert p['multiple']==1.197939298951365
          assert p['completed_trades']==213
          assert p['median_return']>0 and p['profit_factor']>1
          assert p['exact_top10pct_all_trade_deletion_reroute']['multiple']>1
          assert r['decision']['target_met_any_cost'] is False
          print(json.dumps({'status':r['decision']['economic_classification'],'24bp_multiple':p['multiple']},sort_keys=True))
          PY
          evidence=research/sponsored_delivery_core_official/portable/evidence
          rm -rf "$evidence"
          mkdir -p "$evidence"
          cp "$out1/RESULT.json" "$out1/SHA256SUMS.json" "$out1/SHA256SUMS.txt" "$evidence/"

      - name: Commit compact remote evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/sponsored_delivery_core_official/portable/materialized research/sponsored_delivery_core_official/portable/evidence
          if git diff --cached --quiet; then
            echo 'Evidence unchanged'
          else
            git commit -m 'Record portable sponsored Core official replay'
            git push origin HEAD:agent/r37-sponsored-core-source-recovery-001
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sponsored-core-official-r37-${{ github.run_id }}
          path: ${{ runner.temp }}/out1
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
