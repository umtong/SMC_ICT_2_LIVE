name: ML sweep crowding decision

on:
  push:
    branches:
      - agent/r22-ml-sweep-crowding-001
    paths:
      - research/triggers/ml_sweep_crowding/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ml-sweep-crowding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - name: Check out frozen branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore immutable public-data cache
        uses: actions/cache@v4
        with:
          path: .cache/ml_sweep_crowding
          key: ml-sweep-crowding-v4-${{ hashFiles('research/ml_sweep_crowding/contract.json') }}

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 \
            pandas==2.2.3 \
            pyarrow==18.1.0 \
            requests==2.32.3 \
            scikit-learn==1.5.2 \
            pytest==8.3.4

      - name: Verify deterministic accounting and source invariants
        run: |
          python -m py_compile research/ml_sweep_crowding/*.py
          pytest -q \
            research/ml_sweep_crowding/test_run.py \
            research/ml_sweep_crowding/test_source_hf_pinned.py

      - name: Execute the sealed source-to-account sequence
        run: |
          python -m research.ml_sweep_crowding.run_hf_pinned \
            --contract research/ml_sweep_crowding/contract.json \
            --cache-dir .cache/ml_sweep_crowding \
            --output-dir research/results/ml_sweep_crowding

      - name: Publish decision-ready artifacts to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/ml_sweep_crowding
          if git diff --cached --quiet; then
            echo "No result changes to publish."
          else
            git commit -m "research: publish complete pinned-mirror sweep result"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-sweep-crowding-result-v4
          path: research/results/ml_sweep_crowding
          if-no-files-found: warn
          retention-days: 30
