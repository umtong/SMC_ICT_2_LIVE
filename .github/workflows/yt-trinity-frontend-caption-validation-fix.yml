name: YT Trinity frontend caption validation fix

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/apply_frontend_caption_validation_fix.py
      - .github/workflows/yt-trinity-frontend-caption-validation-fix.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-frontend-caption-validation-fix
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Apply strict caption validation
        run: python research/yt_trinity_ml/apply_frontend_caption_validation_fix.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile probe
        run: |
          python -m pip install -q --upgrade requests
          python -m py_compile research/yt_trinity_ml/probe_public_frontend_fleet.py
      - name: Commit fix and remove materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/probe_public_frontend_fleet.py
          git rm -f research/yt_trinity_ml/apply_frontend_caption_validation_fix.py .github/workflows/yt-trinity-frontend-caption-validation-fix.yml
          git commit -m "Require real caption syntax in frontend fleet probe"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
