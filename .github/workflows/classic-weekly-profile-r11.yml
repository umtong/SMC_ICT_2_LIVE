name: Bybit classic ICT weekly profile

on:
  pull_request:
    branches: [main]
    paths:
      - "research/classic_weekly_profile_20260726/**"
      - ".github/workflows/classic-weekly-profile-r11.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classic-weekly-profile-r11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "requests==2.32.4" "pytest==8.3.4"
      - name: Reconstruct, compile and test
        shell: bash
        run: |
          set -euo pipefail
          root=research/classic_weekly_profile_20260726
          python "$root/reconstruct.py"
          code="$root/reconstructed"
          python -m py_compile "$code/run.py" "$root/test_run.py"
          PYTHONPATH="$code" pytest -q "$root/test_run.py"
          PYTHONPATH="$code" python "$code/run.py" --self-test
          python scripts/validate_project.py
      - name: Run frozen fit and conditional development
        shell: bash
        run: |
          set -euo pipefail
          root=research/classic_weekly_profile_20260726
          code="$root/reconstructed"
          out=research_runs/classic_weekly_profile_20260726/r11
          cache="$RUNNER_TEMP/classic-weekly-profile-cache"
          mkdir -p "$out"
          python - <<'PY'
          import json, platform, sys
          from pathlib import Path
          import numpy, pandas, requests
          out=Path('research_runs/classic_weekly_profile_20260726/r11')
          out.mkdir(parents=True, exist_ok=True)
          (out/'ENVIRONMENT.json').write_text(json.dumps({
              'python':sys.version,
              'platform':platform.platform(),
              'numpy':numpy.__version__,
              'pandas':pandas.__version__,
              'requests':requests.__version__,
              'claim_id':'CLM-20260726-1734-WEEKLY-PROFILE-001',
              'engine_version':'ICT-CLASSIC-WEEKLY-PROFILE-V1',
              'orders_submitted':False,
              'paper_live_started':False,
              '2024_opened':False,
              '2025_opened':False,
              '2026_opened':False,
          },indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          PYTHONPATH="$code" python "$code/run.py" --output "$out" --cache "$cache" 2>&1 | tee "$out/RUN.log"
      - name: Record immutable checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/classic_weekly_profile_20260726
          out=research_runs/classic_weekly_profile_20260726/r11
          mkdir -p "$out"
          sha256sum \
            "$root/preregistration.json" \
            "$root/README.md" \
            "$root/SOURCES.md" \
            "$root/reconstruct.py" \
            "$root/source_manifest.json" \
            "$root/run_py.gz.b64.part00" \
            "$root/run_py.gz.b64.part01" \
            "$root/run_py.gz.b64.part02" \
            "$root/run_py.gz.b64.part03" \
            "$root/run_py.gz.b64.part04" \
            "$root/run_py.gz.b64.part05" \
            "$root/test_run.py" \
            "$root/reconstructed/run.py" \
            > "$out/INPUT_SHA256SUMS.txt"
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-weekly-profile-r11-${{ github.sha }}
          path: research_runs/classic_weekly_profile_20260726/r11
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
