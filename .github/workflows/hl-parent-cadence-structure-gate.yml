name: Hyperliquid parent cadence structural gate

on:
  push:
    branches:
      - agent/r11-hl-wallet-flow-001
    paths:
      - "research/hyperliquid_wallet_flow_20260726/preregistration_parent_cadence_structure_v1.json"
      - "research/hyperliquid_wallet_flow_20260726/probe_parent_cadence_structure.py"
      - "research/hyperliquid_wallet_flow_20260726/probe_parent_cadence_structure_v2.py"
      - ".github/workflows/hl-parent-cadence-structure-gate.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/hyperliquid_wallet_flow_20260726/preregistration_parent_cadence_structure_v1.json"
      - "research/hyperliquid_wallet_flow_20260726/probe_parent_cadence_structure.py"
      - "research/hyperliquid_wallet_flow_20260726/probe_parent_cadence_structure_v2.py"
      - ".github/workflows/hl-parent-cadence-structure-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hl-parent-cadence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structural-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            orjson==3.10.18 \
            pyarrow==20.0.0 \
            requests==2.32.4

      - name: Verify code, UTC censoring, and project harness
        shell: bash
        run: |
          set -euo pipefail
          root=research/hyperliquid_wallet_flow_20260726
          python -m py_compile \
            "$root/probe_parent_cadence_structure.py" \
            "$root/probe_parent_cadence_structure_v2.py"
          python "$root/probe_parent_cadence_structure_v2.py" --self-test
          python scripts/validate_project.py

      - name: Freeze input hashes
        shell: bash
        run: |
          set -euo pipefail
          root=research/hyperliquid_wallet_flow_20260726
          output=research_runs/hyperliquid_parent_cadence_structure_20260726
          mkdir -p "$output"
          sha256sum \
            "$root/preregistration_parent_cadence_structure_v1.json" \
            "$root/probe_parent_cadence_structure.py" \
            "$root/probe_parent_cadence_structure_v2.py" \
            > "$output/INPUT_SHA256SUMS.txt"

      - name: Run exact warmup structural gate without price or size access
        shell: bash
        run: |
          set -o pipefail
          root=research/hyperliquid_wallet_flow_20260726
          output=research_runs/hyperliquid_parent_cadence_structure_20260726
          python "$root/probe_parent_cadence_structure_v2.py" \
            --preregistration "$root/preregistration_parent_cadence_structure_v1.json" \
            --work-dir /tmp/hyperliquid_parent_cadence_structure \
            --output "$output" \
            2>&1 | tee "$output/run.log"

      - name: Enforce structural-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('research_runs/hyperliquid_parent_cadence_structure_20260726/PARENT_CADENCE_STRUCTURE_REPORT.json').read_text())
          cadence = report['cadence_sequence_test']
          assert report['stage'] == 'PRE_2026_PARENT_ORDER_CADENCE_STRUCTURE_GATE'
          assert report['download']['bytes'] == 31076403
          assert report['download']['sha256'] == '88fbe8b2868631d6ce4c655e0e40e04c96a83c8f5e0fa62156898dc5d0c801ee'
          assert cadence['file_end_epoch_ms'] == 1753621199999
          assert cadence['right_censor_cutoff_epoch_ms'] == 1753621159999
          assert report['price_values_accessed'] is False
          assert report['size_values_accessed'] is False
          assert report['price_or_size_values_serialized'] is False
          assert report['return_or_markout_computed'] is False
          assert report['strategy_pnl_computed'] is False
          assert report['bybit_execution_opened'] is False
          assert report['official_2024_2026_opened'] is False
          assert report['orders_submitted'] is False
          print(json.dumps({
              'normalized_child_orders': report['parse']['normalized_child_order_count'],
              'cloid_candidate_groups': report['cloid_parent_test']['candidate_parent_groups'],
              'detectable_runs': cadence['detectable_runs'],
              'continued_runs': cadence['continued_runs'],
              'continuation_rate': cadence['continuation_rate'],
              'conditional_control_rate': cadence['conditional_control_rate'],
              'absolute_lift_over_control': cadence['absolute_lift_over_control'],
              'rate_ratio_over_control': cadence['rate_ratio_over_control'],
              'promotion_gate_passed': report['promotion_gate_passed'],
              'decision': report['decision'],
          }, sort_keys=True))
          PY

      - name: Record output hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          output=research_runs/hyperliquid_parent_cadence_structure_20260726
          find "$output" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$output/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyperliquid-parent-cadence-structure-${{ github.sha }}
          path: research_runs/hyperliquid_parent_cadence_structure_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
