name: CME opening-gap five-feature ML screen

on:
  pull_request:
    branches:
      - main
    paths:
      - research/cme_opening_gap_20260726/**
      - .github/workflows/cme-opening-gap-ml-r11.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cme-opening-gap-five-feature-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ml-fatal-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen ML environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "numpy==2.1.3" "pandas==2.2.3" "requests==2.32.4" "scikit-learn==1.5.2"

      - name: Validate one-model five-feature contract
        run: |
          set -euo pipefail
          python scripts/validate_project.py
          python -m py_compile \
            research/cme_opening_gap_20260726/probe.py \
            research/cme_opening_gap_20260726/run_screen.py \
            research/cme_opening_gap_20260726/run_ml_screen.py \
            research/cme_opening_gap_20260726/run_ml_screen_v4.py \
            research/cme_opening_gap_20260726/run_ml_screen_v5.py \
            research/cme_opening_gap_20260726/run_ml_screen_v6.py \
            research/cme_opening_gap_20260726/canonical_fingerprint.py
          python research/cme_opening_gap_20260726/probe.py self-test
          python research/cme_opening_gap_20260726/run_ml_screen_v6.py self-test
          python research/cme_opening_gap_20260726/canonical_fingerprint.py self-test
          python -m json.tool research/cme_opening_gap_20260726/preregistration.json >/dev/null
          python -m json.tool research/cme_opening_gap_20260726/amendment_001_ml_core.json >/dev/null
          python -m json.tool research/cme_opening_gap_20260726/amendment_002_purged_training_cutoff.json >/dev/null
          python -m json.tool research/cme_opening_gap_20260726/amendment_003_positive_winner_count.json >/dev/null
          python -m json.tool research/cme_opening_gap_20260726/amendment_004_five_feature_annual_oos.json >/dev/null
          python -m json.tool research/cme_opening_gap_20260726/amendment_005_cache_timestamp_normalization.json >/dev/null
          python -m json.tool research/cme_opening_gap_20260726/amendment_006_canonical_reproduction.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          core = json.loads(Path("research/cme_opening_gap_20260726/amendment_001_ml_core.json").read_text())
          purge = json.loads(Path("research/cme_opening_gap_20260726/amendment_002_purged_training_cutoff.json").read_text())
          winner = json.loads(Path("research/cme_opening_gap_20260726/amendment_003_positive_winner_count.json").read_text())
          five = json.loads(Path("research/cme_opening_gap_20260726/amendment_004_five_feature_annual_oos.json").read_text())
          cache_fix = json.loads(Path("research/cme_opening_gap_20260726/amendment_005_cache_timestamp_normalization.json").read_text())
          canonical = json.loads(Path("research/cme_opening_gap_20260726/amendment_006_canonical_reproduction.json").read_text())
          assert core["active_model_contract"]["policy_count"] == 1
          assert core["superseded_unopened_contract"]["legacy_grid_executed"] is False
          assert purge["market_outcomes_opened_before_amendment"] is False
          assert winner["market_outcomes_opened_before_amendment"] is False
          assert five["trigger"]["strategy_metrics_opened"] is False
          assert five["model_contract"]["policy_count"] == 1
          assert five["model_contract"]["model_selection"] == "NONE"
          assert five["model_contract"]["hyperparameter_grid"] == "NONE"
          assert five["model_contract"]["probability_threshold_grid"] == "NONE"
          assert five["simplification"]["feature_count"] == 5
          assert len(five["simplification"]["retained_features"]) == 5
          assert cache_fix["correction"]["economic_logic_changed"] is False
          assert cache_fix["correction"]["features_changed"] is False
          assert cache_fix["correction"]["model_changed"] is False
          assert cache_fix["correction"]["cost_or_funding_values_changed"] is False
          assert canonical["trigger"]["scientific_result_summary_exact_match"] is True
          assert all(canonical["scientific_contract_unchanged"].values())
          assert len(canonical["canonical_contract"]["canonical_sha256"]) == 6
          print("CME_GAP_FIVE_FEATURE_CANONICAL_CONTRACT_PASS")
          PY

      - name: Reconfirm source-only gate
        run: |
          set -euo pipefail
          rm -rf artifacts/cme_opening_gap_source_probe
          python research/cme_opening_gap_20260726/probe.py run \
            --output artifacts/cme_opening_gap_source_probe
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("artifacts/cme_opening_gap_source_probe/SOURCE_PROBE.json").read_text())
          assert result["probe_pass"] is True
          assert result["strategy_pnl_opened"] is False
          assert result["candidate_metrics_opened"] is False
          assert result["official_2024_opened"] is False
          assert result["orders_submitted"] is False
          print("CME_GAP_SOURCE_GATE_PASS")
          PY

      - name: Cache immutable pre-2024 proxy sources
        uses: actions/cache@v4
        with:
          path: /tmp/cme-opening-gap-ml
          key: cme-opening-gap-five-v1-${{ hashFiles('research/cme_opening_gap_20260726/preregistration.json', 'research/cme_opening_gap_20260726/amendment_001_ml_core.json', 'research/cme_opening_gap_20260726/amendment_002_purged_training_cutoff.json', 'research/cme_opening_gap_20260726/amendment_003_positive_winner_count.json', 'research/cme_opening_gap_20260726/amendment_004_five_feature_annual_oos.json') }}

      - name: Run one-policy annual-OOS ML screen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/cme_opening_gap_ml
          mkdir -p artifacts/cme_opening_gap_ml
          set -o pipefail
          python research/cme_opening_gap_20260726/run_ml_screen_v6.py run \
            --cache /tmp/cme-opening-gap-ml \
            --output artifacts/cme_opening_gap_ml \
            2>&1 | tee artifacts/cme_opening_gap_ml/run.log

      - name: Verify causal ML, stage and canonical reproduction boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          root = Path("artifacts/cme_opening_gap_ml")
          result = json.loads((root / "result_summary.json").read_text())
          manifest = json.loads((root / "source_manifest.json").read_text())
          five = json.loads(Path("research/cme_opening_gap_20260726/amendment_004_five_feature_annual_oos.json").read_text())
          winner = json.loads(Path("research/cme_opening_gap_20260726/amendment_003_positive_winner_count.json").read_text())
          model = json.loads((root / "training_model.json").read_text())

          assert result["claim_id"] == five["claim_id"]
          assert result["scientific_contract"] == five["amendment_id"]
          assert result["winner_removal_amendment"] == winner["amendment_id"]
          assert result["policy_count"] == 1
          assert result["feature_count"] == 5
          assert result["feature_names"] == five["simplification"]["retained_features"]
          assert result["model_id"] == five["model_contract"]["model_id"]
          assert result["legacy_432_rule_grid_executed"] is False
          assert result["training_pnl_computed"] is False
          assert result["qualification"] == "FATAL_PROXY_ML_SCREEN_NOT_RANK_ELIGIBLE"
          assert result["official_periods_opened"] == {"2024": False, "2025": False, "2026": False}
          assert result["orders_submitted"] is False
          assert result["paper_or_testnet_started"] is False
          assert model["feature_names"] == five["simplification"]["retained_features"]
          assert model["training_labeled_count"] >= five["simplification"]["minimum_training_labeled_events"]
          assert pd.Timestamp(model["training_max_entry_ts"]) <= pd.Timestamp("2021-12-31T23:59:59Z")
          assert pd.Timestamp(model["training_max_resolution_ts"]) <= pd.Timestamp("2021-12-31T23:59:59Z")
          assert model["active_amendment_id"] == five["amendment_id"]
          assert manifest["stages_opened"]["training_2021"] is True
          assert manifest["stages_opened"]["development_2022"] is True
          assert manifest["stages_opened"]["official_2024"] is False
          assert manifest["stages_opened"]["official_2025"] is False
          assert manifest["stages_opened"]["official_2026"] is False
          assert manifest["orders_submitted"] is False

          stages = result["stage_results"]
          assert "development" in stages
          if not result["development_pass"]:
              assert result["confirmation_opened"] is False
              assert "confirmation" not in stages
          for stage in stages.values():
              metrics = stage["metrics"]
              counts = [metrics[str(cost)]["trade_count"] for cost in (12, 18, 24)]
              unresolved = [metrics[str(cost)]["unresolved_positions"] for cost in (12, 18, 24)]
              totals = [metrics[str(cost)]["total_return"] for cost in (12, 18, 24)]
              assert counts[0] == counts[1] == counts[2]
              assert unresolved[0] == unresolved[1] == unresolved[2]
              assert totals[0] >= totals[1] >= totals[2]
          print("CME_GAP_FIVE_FEATURE_CAUSAL_STAGE_PASS")
          PY
          python research/cme_opening_gap_20260726/canonical_fingerprint.py verify \
            --directory artifacts/cme_opening_gap_ml

      - name: Build immutable output inventory
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/cme_opening_gap_source_probe artifacts/cme_opening_gap_ml
          find artifacts/cme_opening_gap_source_probe artifacts/cme_opening_gap_ml \
            -type f ! -name CI_SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 -r sha256sum \
            > artifacts/cme_opening_gap_ml/CI_SHA256SUMS.txt
          sha256sum artifacts/cme_opening_gap_ml/CI_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cme-opening-gap-five-feature-ml-${{ github.sha }}
          path: |
            artifacts/cme_opening_gap_source_probe
            artifacts/cme_opening_gap_ml
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
