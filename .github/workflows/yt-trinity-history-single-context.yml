name: YT Trinity single-pass explicit-history evaluation

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-history-single-context.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-history-single-context
  cancel-in-progress: false

jobs:
  optimize-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact single-context optimization
        run: |
          set -euo pipefail
          test "$(git hash-object research/yt_trinity_ml/run_causal_action_history.py)" = "7fa24eacbce8e2c501a41950aa741b7725f57f0f"
          python research/yt_trinity_ml/_apply_single_context_history.py
          test "$(git hash-object research/yt_trinity_ml/run_causal_action_history.py)" = "a77ebd17e78dc5204eb80b0233b87f24baea0819"
      - name: Run boundary and causal regressions
        run: |
          set -euo pipefail
          python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'scikit-learn==1.6.1' 'pytest==8.3.5'
          export PYTHONPATH=research/yt_trinity_ml
          python -m py_compile research/yt_trinity_ml/run_causal_action_history.py
          pytest -q \
            research/yt_trinity_ml/tests/test_history_boundary_context.py \
            research/yt_trinity_ml/tests/test_causal_action_candidates.py \
            research/yt_trinity_ml/tests/test_causal_action_history_model.py \
            research/yt_trinity_ml/tests/test_causal_action_fast.py \
            research/yt_trinity_ml/tests/test_passive_transition_cancel.py \
            research/yt_trinity_ml/tests/test_pd_array_failure_exit.py
      - name: Commit tested optimization and remove carriers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/run_causal_action_history.py
          git rm \
            research/yt_trinity_ml/_apply_single_context_history.py \
            .github/workflows/yt-trinity-history-single-context.yml
          git commit -m 'Generate pre-2024 and H1 causal state in one pass'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
