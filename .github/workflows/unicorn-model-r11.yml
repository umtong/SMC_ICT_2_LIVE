name: ICT Unicorn breaker-FVG fatal screen

on:
  push:
    branches:
      - agent/r11-unicorn-model-001
    paths:
      - "research/unicorn_model_20260726/**"
      - ".github/workflows/unicorn-model-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/unicorn_model_20260726/**"
      - ".github/workflows/unicorn-model-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: unicorn-model-r11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen research environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "pytest==8.3.4"

      - name: Compile, test and run deterministic causal self-test
        run: |
          set -euo pipefail
          root=research/unicorn_model_20260726
          python "$root/reconstruct.py"
          python -m py_compile "$root/run_screen.py" "$root/test_run_screen.py"
          PYTHONPATH="$root" python -m pytest -q "$root/test_run_screen.py"
          mkdir -p research_runs/unicorn_model/self_test
          python "$root/run_screen.py" \
            --self-test \
            --output research_runs/unicorn_model/self_test \
            --cache "$RUNNER_TEMP/unicorn-cache"
          (cd research_runs/unicorn_model/self_test && sha256sum --check SHA256SUMS.txt)

      - name: Run frozen 2022-2023 official-archive screen
        run: |
          set -euo pipefail
          root=research/unicorn_model_20260726
          mkdir -p research_runs/unicorn_model/output
          python "$root/run_screen.py" \
            --output research_runs/unicorn_model/output \
            --cache "$RUNNER_TEMP/unicorn-cache" \
            2>&1 | tee research_runs/unicorn_model/screen.log

      - name: Verify result safety and project integrity
        run: |
          set -euo pipefail
          (cd research_runs/unicorn_model/output && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("research_runs/unicorn_model/output/RESULT.json").read_text())
          assert result["candidate_count"] == 1152
          assert result["base_definition_count"] == 16
          assert result["orders_submitted"] is False
          assert result["2024_downloaded"] is False
          assert result["2025_or_2026_opened"] is False
          assert result["ranking_role"] == "NOT_RANK_ELIGIBLE_BINANCE_PROXY_PRE_2024"
          print(json.dumps({
              "status": result["status"],
              "hard_validity": result["hard_validity_status"],
              "events": result["event_count"],
              "survivors": result["gate_pass_count"],
              "2024_downloaded": result["2024_downloaded"],
          }, sort_keys=True))
          PY
          python scripts/validate_project.py

      - name: Record immutable input hashes
        if: always()
        run: |
          set -euo pipefail
          sha256sum \
            research/unicorn_model_20260726/preregistration.json \
            research/unicorn_model_20260726/README.md \
            research/unicorn_model_20260726/reconstruct.py \
            research/unicorn_model_20260726/source.part01 \
            research/unicorn_model_20260726/source.part02 \
            research/unicorn_model_20260726/source.part03 \
            research/unicorn_model_20260726/source.part04 \
            research/unicorn_model_20260726/source.part05 \
            research/unicorn_model_20260726/source.part06 \
            .github/workflows/unicorn-model-r11.yml \
            > research_runs/unicorn_model/INPUT_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unicorn-model-${{ github.sha }}
          path: research_runs/unicorn_model
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
