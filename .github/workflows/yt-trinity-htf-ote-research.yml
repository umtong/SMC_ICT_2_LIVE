name: YT Trinity HTF OTE FVG continuation screen

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/IFVG_FAILURE_RUN_POINTER.json
      - research/yt_trinity_ml/run_htf_ote_continuation.py
      - .github/workflows/yt-trinity-htf-ote-research.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: yt-trinity-htf-ote-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      parent_decision: ${{ steps.gate.outputs.parent_decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('research/yt_trinity_ml/IFVG_FAILURE_RUN_POINTER.json')
          decision = 'MISSING_PARENT_POINTER'
          authorized = False
          if path.exists():
              payload = json.loads(path.read_text(encoding='utf-8'))
              decision = str(payload.get('decision') or 'MISSING_PARENT_DECISION')
              authorized = decision in {
                  'ECONOMIC_FAIL_SWITCH_ALPHA',
                  'POSITIVE_PRE2024_OPENED_2024H1_COARSE',
              }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"authorized={'true' if authorized else 'false'}\n")
              handle.write(f"parent_decision={decision}\n")
          print(json.dumps({'authorized': authorized, 'parent_decision': decision}, indent=2))
          PY

  screen:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test causal stack
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow requests pytest playwright
          python -m py_compile \
            research/yt_trinity_ml/run_cisd_bpr_ifvg_research.py \
            research/yt_trinity_ml/run_htf_ote_continuation.py \
            research/yt_trinity_ml/system/*.py
          pytest -q research/yt_trinity_ml/tests
      - uses: actions/cache@v4
        with:
          path: artifact/bybit-cache
          key: yt-trinity-bybit-linear-1m-20220101-20240701-v1
      - name: Run fixed HTF OTE pre-2024 screen
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -o pipefail
          mkdir -p artifact/bybit-cache artifact/htf-ote-run
          python research/yt_trinity_ml/run_htf_ote_continuation.py \
            --cache-dir artifact/bybit-cache \
            --output artifact/htf-ote-run \
            --data-start 2022-01-01T00:00:00Z \
            --pre2024-start 2023-01-01T00:00:00Z \
            --official-start 2024-01-01T00:00:00Z \
            --official-end-exclusive 2024-07-01T00:00:00Z \
            2>&1 | tee artifact/htf-ote-run/STDOUT.log
      - name: Hash run evidence
        if: always()
        run: |
          if [[ -d artifact/htf-ote-run ]]; then
            (
              cd artifact/htf-ote-run
              find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            )
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-htf-ote-${{ github.sha }}
          path: artifact/htf-ote-run
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
      - name: Persist compact route pointer
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          summary_path = Path('artifact/htf-ote-run/RUN_SUMMARY.json')
          summary = json.loads(summary_path.read_text(encoding='utf-8')) if summary_path.exists() else None
          pointer = {
              'schema_version': 1,
              'workflow': 'YT Trinity HTF OTE FVG continuation screen',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'source_sha': os.environ['GITHUB_SHA'],
              'artifact_name': f"yt-trinity-htf-ote-{os.environ['GITHUB_SHA']}",
              'summary_sha256': hashlib.sha256(summary_path.read_bytes()).hexdigest() if summary_path.exists() else None,
              'decision': summary.get('decision') if isinstance(summary, dict) else 'EXECUTION_FAILED_NO_SUMMARY',
              'candidate_count': summary.get('candidate_count') if isinstance(summary, dict) else None,
              'action_label_count': summary.get('action_label_count') if isinstance(summary, dict) else None,
              'selected_basic': summary.get('selected_basic') if isinstance(summary, dict) else None,
              'selected_risk': summary.get('selected_risk') if isinstance(summary, dict) else None,
              'official_2024h1': summary.get('official_2024h1') if isinstance(summary, dict) else None,
              'rankable': False,
          }
          Path('research/yt_trinity_ml/HTF_OTE_RUN_POINTER.json').write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/HTF_OTE_RUN_POINTER.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record HTF OTE continuation screen ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

  skip:
    needs: authorize
    if: needs.authorize.outputs.authorized != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "HTF OTE route not opened: ${{ needs.authorize.outputs.parent_decision }}" >> "$GITHUB_STEP_SUMMARY"
