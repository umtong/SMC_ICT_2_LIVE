name: YT Trinity AI content authority integration

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/apply_ai_content_authority_integration.py
      - .github/workflows/yt-trinity-ai-content-authority-integration.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-ai-content-authority-integration
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Apply AI corpus authority integration
        run: python research/yt_trinity_ml/apply_ai_content_authority_integration.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile and test authority selection
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade pytest
          python -m py_compile research/yt_trinity_ml/select_complete_content_corpus.py
          pytest -q research/yt_trinity_ml/tests/test_content_authority.py
      - name: Commit integration and remove materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/yt_trinity_ml/select_complete_content_corpus.py \
            research/yt_trinity_ml/tests/test_content_authority.py \
            .github/workflows/yt-trinity-content-authority.yml \
            .github/workflows/yt-trinity-execution-state.yml
          git rm -f \
            research/yt_trinity_ml/apply_ai_content_authority_integration.py \
            .github/workflows/yt-trinity-ai-content-authority-integration.yml
          git commit -m "Include AI transcript corpus in content authority"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
