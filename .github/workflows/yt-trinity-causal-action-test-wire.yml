name: YT Trinity causal action regression wire

on:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - .github/workflows/yt-trinity-causal-action-test-wire.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-causal-action-test-wire
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Repair synthetic path and wire regression
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('research/yt_trinity_ml/tests/test_causal_action_fast.py')
          text=path.read_text()
          start=text.index('def _bars(')
          end=text.index('\n\ndef test_early_passive',start)
          replacement='''def _bars(low_at_fill: float = 99.9, simultaneous_stop: bool = False) -> pd.DataFrame:\n    starts = pd.date_range("2023-01-01T00:05:00Z", periods=20, freq="1min")\n    available = starts + pd.Timedelta(minutes=1)\n    open_ = np.full(20, 101.5)\n    high = np.full(20, 102.0)\n    low = np.full(20, 101.0)\n    close = np.full(20, 101.5)\n    low[2] = low_at_fill\n    close[2] = 100.0\n    high[6] = 108.5\n    close[6] = 108.0\n    high[14] = 108.5\n    close[14] = 108.0\n    if simultaneous_stop:\n        low[2] = 97.5\n        high[2] = 101.0\n    return pd.DataFrame(\n        {\n            "bar_start": starts,\n            "available_at": available,\n            "open": open_,\n            "high": high,\n            "low": low,\n            "close": close,\n        },\n        index=available,\n    )\n'''
          path.write_text(text[:start]+replacement+text[end:])

          workflow=Path('.github/workflows/yt-trinity-causal-action-v1.yml')
          text=workflow.read_text()
          if 'research/yt_trinity_ml/tests/test_causal_action_fast.py' not in text.split('permissions:')[0]:
              anchor='      - research/yt_trinity_ml/tests/test_action_value_model.py\n'
              text=text.replace(anchor,anchor+'      - research/yt_trinity_ml/tests/test_causal_action_fast.py\n',1)
          test_anchor='            research/yt_trinity_ml/tests/test_action_value_model.py \\\n'
          if 'test_causal_action_fast.py' not in text[text.index('pytest -q'):]:
              text=text.replace(test_anchor,test_anchor+'            research/yt_trinity_ml/tests/test_causal_action_fast.py \\\n',1)
          workflow.write_text(text)
          PY
          python -m py_compile \
            research/yt_trinity_ml/run_causal_action_v1.py \
            research/yt_trinity_ml/run_causal_action_fast.py \
            research/yt_trinity_ml/tests/test_causal_action_fast.py
          PYTHONPATH=research/yt_trinity_ml pytest -q research/yt_trinity_ml/tests/test_causal_action_fast.py
          git rm .github/workflows/yt-trinity-causal-action-test-wire.yml
      - name: Commit tested regression wire
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/yt-trinity-causal-action-v1.yml \
            research/yt_trinity_ml/tests/test_causal_action_fast.py
          git commit -m 'Require causal PD-array action regressions'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
