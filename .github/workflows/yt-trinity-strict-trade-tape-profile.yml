name: YT Trinity strict same-size trade-tape profile integration

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/apply_strict_trade_tape_profile.py
      - .github/workflows/yt-trinity-strict-trade-tape-profile.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-strict-trade-tape-profile-integration
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Apply strict execution profile
        run: python research/yt_trinity_ml/apply_strict_trade_tape_profile.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile and test strict profile
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow requests pytest playwright
          python -m py_compile research/yt_trinity_ml/run_public_trade_tape_validation.py
          pytest -q research/yt_trinity_ml/tests/test_public_trade_tape.py
          pytest -q research/yt_trinity_ml/tests
      - name: Commit integration and remove materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/yt_trinity_ml/run_public_trade_tape_validation.py \
            research/yt_trinity_ml/tests/test_public_trade_tape.py
          git rm -f \
            research/yt_trinity_ml/apply_strict_trade_tape_profile.py \
            .github/workflows/yt-trinity-strict-trade-tape-profile.yml
          git commit -m "Add strict same-size public trade-tape stress"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
