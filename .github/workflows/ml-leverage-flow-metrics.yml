name: ML leverage-flow pre-2024 metrics snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-ml-xasset-spillover-001
    paths:
      - research/ml_xasset_spillover_20260727/build_pre2024_metrics.py
      - .github/workflows/ml-leverage-flow-metrics.yml
  pull_request:
    branches:
      - main
    paths:
      - research/ml_xasset_spillover_20260727/build_pre2024_metrics.py
      - .github/workflows/ml-leverage-flow-metrics.yml

permissions:
  contents: read

concurrency:
  group: ml-leverage-flow-metrics-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-pre2024-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned builder dependencies
        run: python -m pip install "numpy==2.3.1" "requests==2.32.4"
      - name: Build strict 2023 USD-M metrics snapshot
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifact
          python research/ml_xasset_spillover_20260727/build_pre2024_metrics.py \
            --start 2023-01-01 \
            --end 2023-12-31 \
            --workers 12 \
            --out artifact/pre2024_metrics \
            2>&1 | tee artifact/pre2024_metrics_build.log
      - name: Upload immutable metrics snapshot or exact failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-leverage-flow-pre2024-metrics
          path: |
            artifact/pre2024_metrics
            artifact/pre2024_metrics_build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
