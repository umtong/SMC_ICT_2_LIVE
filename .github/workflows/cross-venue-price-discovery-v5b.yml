name: Cross-venue price-discovery exact-arrival V5D

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-venue-exact-arrival-v5d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authoritative-v5d:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "requests==2.32.4" "pytest==8.3.4"

      - name: Run authoritative V5D contract
        shell: bash
        run: |
          set -euo pipefail
          bash research/cross_venue_price_discovery_20260725/run_v5d_ci.sh

      - name: Record immutable output checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5d
          mkdir -p "$root"
          find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-venue-price-discovery-exact-arrival-v5d-${{ github.sha }}
          path: research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5d
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
