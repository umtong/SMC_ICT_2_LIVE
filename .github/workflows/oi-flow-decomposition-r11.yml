name: Bybit OI-flow decomposition fatal screen

on:
  push:
    branches:
      - agent/r11-oi-flow-decomposition-001
    paths:
      - "research/oi_flow_decomposition_20260726/**"
      - ".github/workflows/oi-flow-decomposition-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/oi_flow_decomposition_20260726/**"
      - ".github/workflows/oi-flow-decomposition-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: oi-flow-decomposition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen research environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "pytest==8.3.4"

      - name: Compile, test and run causal self-test
        run: |
          set -euo pipefail
          root=research/oi_flow_decomposition_20260726
          python -m py_compile "$root/run_screen.py" "$root/test_run_screen.py"
          python -m pytest -q "$root/test_run_screen.py"
          mkdir -p research_runs/oi_flow_decomposition/self_test
          python "$root/run_screen.py" \
            --self-test \
            --output research_runs/oi_flow_decomposition/self_test \
            --cache "$RUNNER_TEMP/oi-flow-cache"
          (cd research_runs/oi_flow_decomposition/self_test && sha256sum --check SHA256SUMS.txt)

      - name: Run frozen pre-2024 official-source fatal screen
        run: |
          set -euo pipefail
          root=research/oi_flow_decomposition_20260726
          mkdir -p research_runs/oi_flow_decomposition/output
          python "$root/run_screen.py" \
            --output research_runs/oi_flow_decomposition/output \
            --cache "$RUNNER_TEMP/oi-flow-cache" \
            2>&1 | tee research_runs/oi_flow_decomposition/screen.log

      - name: Verify result safety and integrity
        run: |
          set -euo pipefail
          (cd research_runs/oi_flow_decomposition/output && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("research_runs/oi_flow_decomposition/output/RESULT.json").read_text())
          assert result["candidate_count"] == 1152
          assert result["source_count"] == 36
          assert result["2024_opened"] is False
          assert result["2025_or_2026_opened"] is False
          assert result["orders_submitted"] is False
          assert result["hard_validity_status"] == "PASS_INITIAL"
          assert result["status"] in {"TESTED_BELOW_GATE", "PROMISING_PRE2024_SURVIVOR"}
          print(json.dumps({
              "status": result["status"],
              "gate_pass_count": result["gate_pass_count"],
              "positive_candidate_counts": result["positive_candidate_counts"],
              "best_candidate": result["best_candidate"],
          }, sort_keys=True, default=str))
          PY
          python scripts/validate_project.py

      - name: Record immutable input hashes
        if: always()
        run: |
          set -euo pipefail
          sha256sum \
            research/oi_flow_decomposition_20260726/preregistration.json \
            research/oi_flow_decomposition_20260726/README.md \
            research/oi_flow_decomposition_20260726/run_screen.py \
            research/oi_flow_decomposition_20260726/implementation.b64.part00 \
            research/oi_flow_decomposition_20260726/implementation.b64.part01 \
            research/oi_flow_decomposition_20260726/implementation.b64.part02 \
            research/oi_flow_decomposition_20260726/test_run_screen.py \
            .github/workflows/oi-flow-decomposition-r11.yml \
            > research_runs/oi_flow_decomposition/INPUT_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oi-flow-decomposition-${{ github.sha }}
          path: research_runs/oi_flow_decomposition
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
