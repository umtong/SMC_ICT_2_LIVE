name: Cross-venue price-discovery authoritative V4B

on:
  push:
    branches:
      - agent/r5-cross-venue-price-discovery-001
    paths:
      - "research/cross_venue_price_discovery_20260725/preregistration_v2.json"
      - "research/cross_venue_price_discovery_20260725/source_probe_v2.py"
      - "research/cross_venue_price_discovery_20260725/cross_venue_pilot.py"
      - "research/cross_venue_price_discovery_20260725/cross_venue_pilot_v2.py"
      - "research/cross_venue_price_discovery_20260725/cross_venue_development_v2.py"
      - "research/cross_venue_price_discovery_20260725/cross_venue_development_v3.py"
      - "research/cross_venue_price_discovery_20260725/cross_venue_development_v4.py"
      - "research/cross_venue_price_discovery_20260725/cross_venue_development_v4b.py"
      - "research/cross_venue_price_discovery_20260725/test_cross_venue_pilot_v2b.py"
      - "research/cross_venue_price_discovery_20260725/test_cross_venue_development_v4b.py"
      - "research/cross_venue_price_discovery_20260725/EXECUTION_CORRECTION_V3.md"
      - ".github/workflows/cross-venue-price-discovery-authoritative-v4b.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r5-cross-venue-authoritative-v4b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authoritative:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-cross-venue-price-discovery-001
          fetch-depth: 1

      - name: Install fixed environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "requests==2.32.4" "pytest==8.3.4"
          mkdir -p research_runs/cross_venue_price_discovery_20260725/authoritative_v4b
          python - <<'PY'
          import json, numpy, pandas, platform, requests, sys
          from pathlib import Path
          Path('research_runs/cross_venue_price_discovery_20260725/authoritative_v4b/environment.json').write_text(
              json.dumps({
                  'python':sys.version,
                  'platform':platform.platform(),
                  'numpy':numpy.__version__,
                  'pandas':pandas.__version__,
                  'requests':requests.__version__,
                  'credentials_used':False,
                  'orders_submitted':False,
                  'paper_live_started':False,
                  'selection_opened':False,
                  'confirmation_opened':False,
                  '2026_opened':False,
              },indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Verify immutable inputs and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_venue_price_discovery_20260725
          python -m py_compile \
            "$root/source_probe.py" "$root/source_probe_v2.py" \
            "$root/cross_venue_pilot.py" "$root/cross_venue_pilot_v2.py" \
            "$root/cross_venue_development_v2.py" "$root/cross_venue_development_v3.py" \
            "$root/cross_venue_development_v4.py" "$root/cross_venue_development_v4b.py" \
            "$root/test_cross_venue_pilot_v2b.py" "$root/test_cross_venue_development_v4b.py"
          sha256sum \
            "$root/preregistration_v2.json" "$root/CAUSAL_CORRECTION_V2.md" "$root/EXECUTION_CORRECTION_V3.md" \
            "$root/source_probe_v2.py" "$root/cross_venue_pilot.py" "$root/cross_venue_pilot_v2.py" \
            "$root/cross_venue_development_v2.py" "$root/cross_venue_development_v3.py" \
            "$root/cross_venue_development_v4.py" "$root/cross_venue_development_v4b.py" \
            "$root/test_cross_venue_pilot_v2b.py" "$root/test_cross_venue_development_v4b.py" \
            > research_runs/cross_venue_price_discovery_20260725/authoritative_v4b/INPUT_SHA256SUMS.txt
          PYTHONPATH="$root" pytest -q \
            "$root/test_cross_venue_pilot_v2b.py" \
            "$root/test_cross_venue_development_v4b.py" \
            2>&1 | tee research_runs/cross_venue_price_discovery_20260725/authoritative_v4b/tests.log
          PYTHONPATH="$root" python "$root/source_probe_v2.py" --self-test \
            --output research_runs/cross_venue_price_discovery_20260725/authoritative_v4b \
            2>&1 | tee research_runs/cross_venue_price_discovery_20260725/authoritative_v4b/probe_self_test.log
          PYTHONPATH="$root" python "$root/cross_venue_development_v4b.py" --self-test \
            --pilot-dir research_runs/cross_venue_price_discovery_20260725/authoritative_v4b \
            --output research_runs/cross_venue_price_discovery_20260725/authoritative_v4b \
            --cache "$RUNNER_TEMP/xvenue-v4b-cache" \
            2>&1 | tee research_runs/cross_venue_price_discovery_20260725/authoritative_v4b/engine_self_test.log

      - name: Probe public local-arrival schemas
        shell: bash
        run: |
          set +e
          root=research/cross_venue_price_discovery_20260725
          PYTHONPATH="$root" python "$root/source_probe_v2.py" \
            --date 2023-07-01 \
            --output research_runs/cross_venue_price_discovery_20260725/authoritative_v4b/probe \
            2>&1 | tee research_runs/cross_venue_price_discovery_20260725/authoritative_v4b/probe.log
          exit 0

      - name: Run causal pilot and authoritative conditional development
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_venue_price_discovery_20260725
          runroot=research_runs/cross_venue_price_discovery_20260725/authoritative_v4b
          usable=$(python - <<'PY'
          import json, pathlib
          p=pathlib.Path('research_runs/cross_venue_price_discovery_20260725/authoritative_v4b/probe/SOURCE_PROBE_V2.json')
          print('true' if p.exists() and json.loads(p.read_text())['all_required_sources_usable'] else 'false')
          PY
          )
          if [[ "$usable" != "true" ]]; then
            python - <<'PY'
          import json, pathlib
          root=pathlib.Path('research_runs/cross_venue_price_discovery_20260725/authoritative_v4b')
          payload={
              'schema_version':1,
              'claim_id':'CLM-20260725-1850-XVENUE-001',
              'stage':'SOURCE_UNAVAILABLE',
              'causal_version':2,
              'account_engine_version':'4B',
              'strategy_or_pnl_computed':False,
              'development_opened':False,
              'selection_opened':False,
              'confirmation_opened':False,
              '2026_opened':False,
              'orders_submitted':False,
              'paper_live_started':False,
              'champion_eligible':False,
          }
          (root/'AUTHORITATIVE_RESULT.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
            exit 0
          fi
          PYTHONPATH="$root" python "$root/cross_venue_pilot_v2.py" \
            --output "$runroot/pilot" \
            --cache "$RUNNER_TEMP/xvenue-v4b-cache" \
            2>&1 | tee "$runroot/pilot.log"
          PYTHONPATH="$root" python "$root/cross_venue_development_v4b.py" \
            --pilot-dir "$runroot/pilot" \
            --output "$runroot/development" \
            --cache "$RUNNER_TEMP/xvenue-v4b-cache" \
            2>&1 | tee "$runroot/development.log"
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('research_runs/cross_venue_price_discovery_20260725/authoritative_v4b')
          item=json.loads((root/'development'/'DEVELOPMENT_RESULT.json').read_text())
          payload={
              'schema_version':1,
              'claim_id':'CLM-20260725-1850-XVENUE-001',
              'stage':item['stage'],
              'causal_version':2,
              'account_engine_version':'4B',
              'development_opened':bool(item.get('development_opened',False)),
              'development_gate_pass_count':int(item.get('development_gate_pass_count',0)),
              'selection_opened':False,
              'confirmation_opened':False,
              '2026_opened':False,
              'orders_submitted':False,
              'paper_live_started':False,
              'champion_eligible':False,
          }
          (root/'AUTHORITATIVE_RESULT.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Record immutable checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research_runs/cross_venue_price_discovery_20260725/authoritative_v4b
          find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-venue-price-discovery-authoritative-v4b-${{ github.sha }}
          path: research_runs/cross_venue_price_discovery_20260725/authoritative_v4b
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
