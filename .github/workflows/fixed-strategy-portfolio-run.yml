name: Fixed two-strategy one-slot 2024 portfolio

on:
  push:
    branches: [agent/r8-fixed-strategy-portfolio-v2]
    paths:
      - "research/fixed_strategy_portfolio_20260726/**"
      - ".github/workflows/fixed-strategy-portfolio-run.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fixed-two-strategy-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stop-before-market-outcome:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record current-contract invalidation without opening 2024 outcome
        shell: bash
        run: |
          set -euo pipefail
          dest=research_results/fixed_strategy_portfolio_20260726
          rm -rf "$dest"
          mkdir -p "$dest"
          cat > "$dest/RESULT.json" <<'JSON'
          {
            "schema_version": 1,
            "active_claim_id": "CLM-20260726-1955-FIXED-PORTFOLIO-TAKEOVER-001",
            "scientific_claim_id": "CLM-20260726-0100-FIXED-PORTFOLIO-001",
            "result_id": "RES-20260726-FIXED-PORTFOLIO-STOPPED-001",
            "status": "STOPPED_INVALID_COMPONENT_BEFORE_ADMISSIBLE_2024_OUTCOME",
            "hard_validity": "NOT_RUN_COMPONENT_INELIGIBLE_CURRENT_EXIT_CONTRACT",
            "economic_status": "NOT_TESTED",
            "ranking_role": "NONE",
            "reason": "Dynamic component 021fbab613517a31ad98 stores maximum_hold_bars and closes surviving positions at entry plus that fixed horizon. Revision-13 Project State removed it from the current-contract ranking because elapsed-time liquidation is prohibited. A portfolio containing that component cannot produce ranking-eligible evidence.",
            "official_2024_opened": false,
            "admissible_2024_outcome_created": false,
            "2025_opened": false,
            "2026_opened": false,
            "orders_submitted": false,
            "next_action": "Do not repair or replace the invalid component inside this preregistration. Continue strategy-defined-exit ML paths and compare any survivor with current first place FIRST-20260726-DONCHIAN-AFTER-LOSER-A70626D9."
          }
          JSON
          cat > "$dest/CI_ATTESTATION.json" <<JSON
          {
            "schema_version": 1,
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_sha": "${GITHUB_SHA}",
            "status": "STOPPED_INVALID_COMPONENT_BEFORE_ADMISSIBLE_2024_OUTCOME",
            "orders_submitted": false
          }
          JSON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Stop invalid fixed portfolio before admissible 2024 outcome"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
