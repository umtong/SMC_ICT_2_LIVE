name: YT Trinity independent transcript service probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - research/yt_trinity_ml/probe_transcript_services.py
      - .github/workflows/yt-trinity-transcript-service-probe.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-transcript-service-probe-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        provider:
          - youtube_to_text
          - youtube2text
          - get_video_transcript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install transport dependency
        run: |
          python -m pip install -q --upgrade pip requests
          python -m py_compile research/yt_trinity_ml/probe_transcript_services.py
      - name: Probe provider with positive control
        run: |
          out="artifact/${{ matrix.provider }}"
          mkdir -p "$out"
          python research/yt_trinity_ml/probe_transcript_services.py \
            --provider "${{ matrix.provider }}" \
            --delay-seconds 7 \
            --output "$out" \
            2>&1 | tee "$out/stdout.log"
          (
            cd "$out"
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-service-${{ matrix.provider }}-${{ github.sha }}
          path: artifact/${{ matrix.provider }}
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: transcript-service-*-${{ github.sha }}
          path: artifact/downloads
          merge-multiple: false
      - name: Build provider decision pointer
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          rows = []
          winners = []
          for path in sorted(Path('artifact/downloads').rglob('probe.json')):
              payload = json.loads(path.read_text(encoding='utf-8'))
              summary = {
                  'provider': payload.get('provider'),
                  'positive_control_passed': bool(payload.get('positive_control_passed')),
                  'failed_sample_recovered_count': int(payload.get('failed_sample_recovered_count') or 0),
                  'successful_video_count': int(payload.get('successful_video_count') or 0),
                  'result_sha256_before_field': payload.get('result_sha256_before_field'),
                  'run_id': payload.get('run_id'),
              }
              rows.append(summary)
              if summary['positive_control_passed'] and summary['failed_sample_recovered_count'] > 0:
                  winners.append(summary)
          pointer = {
              'schema_version': 1,
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'source_sha': os.environ['GITHUB_SHA'],
              'providers': rows,
              'winning_providers': winners,
              'decision': 'TIMESTAMPED_PROVIDER_RECOVERED' if winners else 'NO_VALIDATED_PROVIDER',
              'artifact_pattern': f"transcript-service-*-{os.environ['GITHUB_SHA']}",
          }
          raw = (json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n').encode('utf-8')
          pointer['pointer_sha256_before_field'] = hashlib.sha256(raw).hexdigest()
          destination = Path('research/yt_trinity_ml/TRANSCRIPT_SERVICE_PROBE_POINTER.json')
          destination.write_text(json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Persist decision pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/TRANSCRIPT_SERVICE_PROBE_POINTER.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record independent transcript service probe ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
