name: Fixed portfolio recover exact absorption source

on:
  push:
    branches:
      - agent/r8-fixed-strategy-portfolio-v2
    paths:
      - ".github/workflows/fixed-strategy-portfolio-recover-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen baseline absorption branch
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: agent/absorption-flow-benchmark-20260725
          path: absorption-base
          fetch-depth: 1

      - name: Reconstruct and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          root=absorption-base/research/absorption_flow_benchmark_v1
          python "$root/reconstruct.py"
          source="$root/absorption_flow_benchmark.py"
          test -f "$source"
          echo "e9ce4e211e060d74cfb43759bb6afb69616cc8b12fa66aa6ad317ceac01d56b8  $source" | sha256sum -c -
          mkdir -p recovered
          cp "$source" recovered/absorption_flow_benchmark.py
          git -C absorption-base rev-parse HEAD > recovered/SOURCE_GIT_COMMIT.txt
          sha256sum recovered/absorption_flow_benchmark.py > recovered/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fixed-portfolio-exact-absorption-source-${{ github.sha }}
          path: recovered
          if-no-files-found: error
          retention-days: 14
