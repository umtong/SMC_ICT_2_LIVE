name: Stablecoin pinned source and causal economic snapshot

on:
  push:
    branches: [agent/r20-stablecoin-source-economic-snapshot-001]
    paths:
      - '.github/workflows/ml-stablecoin-source-economic-snapshot-r20.yml'
      - 'research/ml_stablecoin_issuance_20260726/EXECUTION_CORRECTION_018_PIN_CAUSAL_V2_AND_BOUNDARY_MARK_BEFORE_OUTCOME.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stablecoin-pinned-causal-snapshot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-economic:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      SOURCE_ROOT: research/ml_stablecoin_issuance_20260726
      SOURCE_OUT: research_runs/ml_stablecoin_pinned_causal/source
      ECON_ROOT: research/ml_stablecoin_issuance_economic_20260726
      ECON_OUT: research_runs/ml_stablecoin_pinned_causal/economic
      MARKET_CACHE: ${{ runner.temp }}/stablecoin-market
      ECONOMIC_SHA: b7f67a4e89c731b1d322a6e0ace86f41f32b7bc8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen source and economic environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            requests==2.32.4 pytest==8.3.5 \
            numpy==2.1.3 pandas==2.2.3 scikit-learn==1.6.1 pyarrow==18.1.0

      - name: Validate corrected pinned source identity before network access
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_OUT"
          python -m json.tool "$SOURCE_ROOT/CORRECTION_010_USDT_ISSUE_REDEEM_EVENT_SCHEMA_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$SOURCE_ROOT/CORRECTION_011_BLOCKSCOUT_NULL_TOPIC_PADDING_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$SOURCE_ROOT/CORRECTION_013_BIND_CORRECTED_SOURCE_SCHEMA_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$SOURCE_ROOT/EXECUTION_CORRECTION_017_PINNED_SOURCE_ECONOMIC_SNAPSHOT_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$SOURCE_ROOT/EXECUTION_CORRECTION_018_PIN_CAUSAL_V2_AND_BOUNDARY_MARK_BEFORE_OUTCOME.json" >/dev/null
          python -m py_compile \
            "$SOURCE_ROOT"/source_gate*.py \
            "$SOURCE_ROOT/run_pinned_snapshot_source.py" \
            "$SOURCE_ROOT/test_source_gate.py"
          PYTHONPATH="$SOURCE_ROOT" pytest -q "$SOURCE_ROOT/test_source_gate.py" 2>&1 | tee "$SOURCE_OUT/PYTEST.log"
          PYTHONPATH="$SOURCE_ROOT" python "$SOURCE_ROOT/run_pinned_snapshot_source.py" --self-test 2>&1 | tee "$SOURCE_OUT/SELF_TEST.log"

      - name: Run corrected complete pre-2024 source gate
        run: |
          set -u
          rm -rf "$SOURCE_OUT/run"
          mkdir -p "$SOURCE_OUT/run"
          set +e
          PYTHONPATH="$SOURCE_ROOT" python "$SOURCE_ROOT/run_pinned_snapshot_source.py" \
            --output "$SOURCE_OUT/run" 2>&1 | tee "$SOURCE_OUT/run/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$SOURCE_OUT/run/RUN_EXIT_CODE.txt"
          if [[ ! -f "$SOURCE_OUT/run/SOURCE_GATE_RESULT.json" ]]; then
            python "$SOURCE_ROOT/write_transport_failure.py" \
              --output "$SOURCE_OUT/run" \
              --transport TRANSPORT-20260727-ML-STABLECOIN-PINNED-CAUSAL-018 \
              --exit-code "$rc"
          fi
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then
            echo "source transport returned unexpected exit $rc; durable sealed result retained" >&2
          fi

      - id: source
        name: Verify corrected source decision and outcome seal
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['SOURCE_OUT']) / 'run'
          result = json.loads((root / 'SOURCE_GATE_RESULT.json').read_text())
          assert result['claim_id'] == 'CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert result['status'] in {
              'PASS',
              'FAIL_BELOW_SOURCE_DENSITY_OR_COVERAGE',
              'SOURCE_UNAVAILABLE_OR_TRANSPORT_FAILURE',
          }
          assert result['market_outcome_opened'] is False
          assert result['model_fit'] is False
          assert result['trade_or_pnl_opened'] is False
          assert result['official_2024_2026_opened'] is False
          assert result['orders_submitted'] is False

          authorized = result['status'] == 'PASS'
          if authorized:
              expected_schema = 'STABLECOIN_SUPPLY_USDT_ISSUE_REDEEM_USDC_ZERO_TRANSFER_V1'
              expected_correction = 'CORRECTION-20260726-ML-STABLECOIN-USDT-ISSUE-REDEEM-010'
              manifest = json.loads((root / 'SOURCE_MANIFEST.json').read_text())
              events_path = root / 'EVENTS.jsonl'
              rows = [json.loads(line) for line in events_path.read_text().splitlines() if line.strip()]
              checks = result.get('pass_checks', {})
              assert isinstance(checks, dict) and checks and all(value is True for value in checks.values())
              assert result.get('source_schema_id') == expected_schema
              assert result.get('source_correction_id') == expected_correction
              assert manifest.get('source_schema_id') == expected_schema
              assert manifest.get('source_correction_id') == expected_correction
              assert result.get('event_semantics', {}).get('ordinary_usdt_transfer_excluded') is True
              assert manifest.get('event_semantics', {}).get('ordinary_usdt_transfer_excluded') is True
              assert int(result['event_count']) >= 120
              assert len(result['months_with_events']) >= 24
              assert sorted(result['distinct_tokens']) == ['USDC', 'USDT']
              assert int(result['token_counts']['USDT']) > 0
              assert int(result['token_counts']['USDC']) > 0
              assert {row['token'] for row in rows} == {'USDC', 'USDT'}
              assert {row['direction'] for row in rows}.issubset({'MINT', 'BURN'})
              assert all(int(row['block_timestamp']) < 1704067200 for row in rows)
              assert all(int(row['available_timestamp_12']) < 1704067200 for row in rows)
              assert all(int(row['available_timestamp_64']) < 1704067200 for row in rows)
              assert hashlib.sha256(events_path.read_bytes()).hexdigest() == manifest['events_sha256']

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"authorized={'true' if authorized else 'false'}\n")
              if authorized:
                  handle.write(f"events={root / 'EVENTS.jsonl'}\n")
          print(json.dumps({
              'status': result['status'],
              'event_count': result.get('event_count'),
              'months': len(result.get('months_with_events', [])),
              'tokens': result.get('distinct_tokens'),
              'authorized': authorized,
          }, sort_keys=True))
          PY

      - uses: actions/cache@v4
        if: steps.source.outputs.authorized == 'true'
        with:
          path: ${{ env.MARKET_CACHE }}
          key: stablecoin-market-2020-12-2023-12-causal-v2

      - name: Materialize exact causal economic engine
        if: steps.source.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$ECONOMIC_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$ECONOMIC_SHA"
          rm -rf "$ECON_ROOT"
          git archive "$ECONOMIC_SHA" "$ECON_ROOT" | tar -x
          python "$ECON_ROOT/reconstruct.py"
          python -m py_compile \
            "$ECON_ROOT/run.py" "$ECON_ROOT/run_causal.py" \
            "$ECON_ROOT/test_run.py" "$ECON_ROOT/test_run_causal.py" \
            "$ECON_ROOT/reconstruct.py"
          PYTHONPATH="$ECON_ROOT" pytest -q \
            "$ECON_ROOT/test_run.py" "$ECON_ROOT/test_run_causal.py"
          PYTHONPATH="$ECON_ROOT" python "$ECON_ROOT/run.py" self-test
          PYTHONPATH="$ECON_ROOT" python "$ECON_ROOT/run_causal.py" self-test
          printf '%s\n' "$ECONOMIC_SHA" > "$SOURCE_OUT/PINNED_ECONOMIC_SHA.txt"

      - name: Run causal pre-2024 economic screen immediately
        if: steps.source.outputs.authorized == 'true'
        run: |
          set -u
          rm -rf "$ECON_OUT"
          mkdir -p "$ECON_OUT" "$MARKET_CACHE"
          set +e
          PYTHONPATH="$ECON_ROOT" python "$ECON_ROOT/run_causal.py" run \
            --events "${{ steps.source.outputs.events }}" \
            --market-cache "$MARKET_CACHE" \
            --output "$ECON_OUT" 2>&1 | tee "$ECON_OUT/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$ECON_OUT/RUN_EXIT_CODE.txt"
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then exit "$rc"; fi
          test -f "$ECON_OUT/RESULT.json"
          test -f "$ECON_OUT/FULL_RESULT.json"

      - name: Enforce causal account and sequential boundaries
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source_root = Path(os.environ['SOURCE_OUT']) / 'run'
          source = json.loads((source_root / 'SOURCE_GATE_RESULT.json').read_text())
          assert source['orders_submitted'] is False
          if source['status'] != 'PASS':
              print(json.dumps({
                  'source_status': source['status'],
                  'economic_status': 'NOT_OPENED',
                  'next_stage': 'CLOSE_SOURCE_OR_REPAIR_TRANSPORT_ONLY',
              }, sort_keys=True))
              raise SystemExit(0)

          economic_root = Path(os.environ['ECON_OUT'])
          result = json.loads((economic_root / 'RESULT.json').read_text())
          full = json.loads((economic_root / 'FULL_RESULT.json').read_text())
          assert result['claim_id'] == 'CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert result['engine'] == 'ML_STABLECOIN_ISSUANCE_FIRST_PASSAGE_CAUSAL_V2'
          assert result['hard_validity_correction'] == 'CORRECTION-20260726-ML-STABLECOIN-CAUSAL-FEATURE-BOUNDARY-MARK-006'
          assert result['orders_submitted'] is False
          assert result['official_2024h1_opened'] is False
          assert result['official_2024_2026_opened'] is False
          assert result['status'] in {
              'PRE2024_BELOW_GATE',
              'PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1',
          }

          serialized = json.dumps(full, sort_keys=True)
          assert '"exit_reason": "SOURCE_BOUNDARY"' not in serialized
          assert '"exit_reason": "MARK_TO_MARKET_STAGE_BOUNDARY"' in serialized or '"boundary_mark_count": 0' in serialized

          def walk(value):
              if isinstance(value, dict):
                  if 'forced_boundary_close' in value:
                      assert value['forced_boundary_close'] is False
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(full)

          next_stage = 'CHANGE_ALPHA'
          if result['status'] == 'PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1':
              assert result['development_gate']['all'] is True
              assert result['risk_search']['selected'] is not None
              assert result['risk_search']['selected']['growth'] > 0
              assert result['risk_search']['selected']['liquidation'] is False
              next_stage = 'OFFICIAL_2024H1_IMMEDIATELY'
          print(json.dumps({
              'source_status': source['status'],
              'economic_status': result['status'],
              'development_gate': result['development_gate'].get('all'),
              'selected_risk_path': result.get('risk_search', {}).get('selected') if result.get('risk_search') else None,
              'next_stage': next_stage,
          }, sort_keys=True))
          PY

      - name: Freeze immutable evidence hashes
        if: always()
        run: |
          set -euo pipefail
          root=research_runs/ml_stablecoin_pinned_causal
          mkdir -p "$root/inputs"
          cp "$SOURCE_ROOT/EXECUTION_CORRECTION_018_PIN_CAUSAL_V2_AND_BOUNDARY_MARK_BEFORE_OUTCOME.json" "$root/inputs/"
          if [ -d "$ECON_ROOT" ]; then
            cp "$ECON_ROOT/CORRECTION_006_CAUSAL_FEATURE_AND_BOUNDARY_MARK_BEFORE_OUTCOME.json" "$root/inputs/" 2>/dev/null || true
            cp "$ECON_ROOT/run_causal.py" "$ECON_ROOT/test_run_causal.py" "$root/inputs/" 2>/dev/null || true
          fi
          find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-pinned-causal-${{ github.run_id }}
          path: research_runs/ml_stablecoin_pinned_causal
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
