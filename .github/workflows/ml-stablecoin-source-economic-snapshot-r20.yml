name: Stablecoin pinned source and economic snapshot

on:
  push:
    branches: [agent/r20-stablecoin-source-economic-snapshot-001]
    paths:
      - '.github/workflows/ml-stablecoin-source-economic-snapshot-r20.yml'
      - 'research/ml_stablecoin_issuance_20260726/EXECUTION_CORRECTION_017_PINNED_SOURCE_ECONOMIC_SNAPSHOT_BEFORE_OUTCOME.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stablecoin-pinned-snapshot-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-economic:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      SOURCE_ROOT: research/ml_stablecoin_issuance_20260726
      SOURCE_OUT: research_runs/ml_stablecoin_pinned_snapshot/source
      ECON_ROOT: research/ml_stablecoin_issuance_economic_20260726
      ECON_OUT: research_runs/ml_stablecoin_pinned_snapshot/economic
      MARKET_CACHE: ${{ runner.temp }}/stablecoin-market
      ECONOMIC_SHA: 6cbff14ed8dd5ebba3b6b47bf6854bf090e4db2c

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen source and economic environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            requests==2.32.4 pytest==8.3.5 \
            numpy==2.1.3 pandas==2.2.3 scikit-learn==1.6.1 pyarrow==18.1.0

      - name: Validate pinned source identity before network access
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_OUT"
          python -m json.tool "$SOURCE_ROOT/EXECUTION_CORRECTION_017_PINNED_SOURCE_ECONOMIC_SNAPSHOT_BEFORE_OUTCOME.json" >/dev/null
          python -m py_compile "$SOURCE_ROOT"/source_gate*.py "$SOURCE_ROOT/test_source_gate.py"
          PYTHONPATH="$SOURCE_ROOT" pytest -q "$SOURCE_ROOT/test_source_gate.py" 2>&1 | tee "$SOURCE_OUT/PYTEST.log"
          PYTHONPATH="$SOURCE_ROOT" python "$SOURCE_ROOT/source_gate_blockscout_authoritative.py" --self-test 2>&1 | tee "$SOURCE_OUT/SELF_TEST.log"

      - name: Run corrected pre-2024 source gate with exact batched timestamps
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_OUT"
          cat > "$RUNNER_TEMP/stablecoin_batch_source.py" <<'PY'
          from __future__ import annotations

          import argparse
          import json
          import time
          from pathlib import Path
          from typing import Any, Iterable

          import source_gate_blockscout as source
          import source_gate_blockscout_authoritative as authority

          RPC_ENDPOINT = "https://eth.blockscout.com/api/eth-rpc"
          BATCH_SIZE = 40
          REQUEST_INTERVAL_SECONDS = 0.40
          BaseClient = source.BlockscoutClient


          class ExactBatchClient(BaseClient):
              def _post_batch(self, block_numbers: Iterable[int]) -> dict[int, int]:
                  numbers = tuple(dict.fromkeys(int(value) for value in block_numbers))
                  payload = []
                  id_to_block: dict[int, int] = {}
                  for request_id, block_number in enumerate(numbers, start=1):
                      id_to_block[request_id] = block_number
                      payload.append({
                          "jsonrpc": "2.0",
                          "id": request_id,
                          "method": "eth_getBlockByNumber",
                          "params": [hex(block_number), False],
                      })
                  last: Exception | None = None
                  for attempt in range(7):
                      try:
                          elapsed = time.monotonic() - self.last_request_at
                          if elapsed < REQUEST_INTERVAL_SECONDS:
                              time.sleep(REQUEST_INTERVAL_SECONDS - elapsed)
                          response = self.session.post(
                              RPC_ENDPOINT,
                              json=payload,
                              timeout=(15, 120),
                          )
                          self.last_request_at = time.monotonic()
                          self.request_count += 1
                          if response.status_code == 429 or response.status_code >= 500:
                              raise source.BlockscoutError(
                                  f"HTTP {response.status_code}: {response.text[:300]}"
                              )
                          response.raise_for_status()
                          body = response.json()
                          if not isinstance(body, list):
                              raise source.BlockscoutError(
                                  f"batch response must be list, got {type(body)!r}"
                              )
                          by_id = {
                              int(item["id"]): item
                              for item in body
                              if isinstance(item, dict) and "id" in item
                          }
                          result: dict[int, int] = {}
                          for request_id, block_number in id_to_block.items():
                              item = by_id.get(request_id)
                              if item is None:
                                  raise source.BlockscoutError(
                                      f"missing batch response for block {block_number}"
                                  )
                              if item.get("error") is not None:
                                  raise source.BlockscoutError(
                                      json.dumps(item["error"], sort_keys=True)
                                  )
                              block = item.get("result")
                              if block is None:
                                  raise source.BlockscoutError(
                                      f"missing block result {block_number}"
                                  )
                              result[block_number] = source.parse_int(block["timestamp"])
                          return result
                      except Exception as exc:
                          last = exc
                          self.errors.append(
                              f"{RPC_ENDPOINT}: {type(exc).__name__}: {exc}"
                          )
                          if attempt + 1 < 7:
                              time.sleep(min(30.0, 1.5 * (2 ** attempt)))
                  raise source.BlockscoutError(
                      f"exact block timestamp batch failed: {last!r}"
                  )

              def block_timestamp(self, block_number: int) -> int:
                  number = int(block_number)
                  cached = self.block_timestamp_cache.get(number)
                  if cached is not None:
                      return cached
                  start = max(0, number - 8)
                  candidates = range(start, start + BATCH_SIZE)
                  try:
                      self.block_timestamp_cache.update(self._post_batch(candidates))
                  except Exception:
                      return super().block_timestamp(number)
                  if number not in self.block_timestamp_cache:
                      raise source.BlockscoutError(
                          f"batch did not contain requested block {number}"
                      )
                  return self.block_timestamp_cache[number]


          def self_test() -> None:
              client = object.__new__(ExactBatchClient)
              client.block_timestamp_cache = {}
              client.request_count = 0
              client.errors = []
              observed: list[tuple[int, ...]] = []

              def fake_batch(blocks: Iterable[int]) -> dict[int, int]:
                  values = tuple(int(value) for value in blocks)
                  observed.append(values)
                  return {value: value * 12 for value in values}

              client._post_batch = fake_batch  # type: ignore[method-assign]
              assert client.block_timestamp(100) == 1200
              assert client.block_timestamp(101) == 1212
              assert len(observed) == 1
              assert authority.base.decode_log(
                  "USDT",
                  "MINT",
                  {
                      "address": authority.base.CONTRACTS["USDT"]["address"],
                      "topics": [authority.base.ISSUE_TOPIC, None, "", "0x"],
                      "data": hex(1_000_000 * 10**6),
                      "blockNumber": "0x10",
                      "transactionHash": "0x" + "ab" * 32,
                      "logIndex": "0x0",
                  },
              )["amount_usd"] == 1_000_000


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--output", type=Path, required=True)
              args = parser.parse_args()
              self_test()
              source.BlockscoutClient = ExactBatchClient
              result = source.source_gate(args.output)
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["status"] == "PASS" else 2


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          set +e
          PYTHONPATH="$SOURCE_ROOT" python "$RUNNER_TEMP/stablecoin_batch_source.py" \
            --output "$SOURCE_OUT" 2>&1 | tee "$SOURCE_OUT/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$SOURCE_OUT/RUN_EXIT_CODE.txt"
          if [[ ! -f "$SOURCE_OUT/SOURCE_GATE_RESULT.json" ]]; then
            python "$SOURCE_ROOT/write_transport_failure.py" \
              --output "$SOURCE_OUT" \
              --transport TRANSPORT-20260726-ML-STABLECOIN-PINNED-BATCH-017 \
              --exit-code "$rc"
          fi

      - name: Verify source decision and outcome seal
        id: source
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['SOURCE_OUT']) / 'SOURCE_GATE_RESULT.json'
          result = json.loads(path.read_text())
          assert result['claim_id'] == 'CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert result['status'] in {
              'PASS',
              'FAIL_BELOW_SOURCE_DENSITY_OR_COVERAGE',
              'SOURCE_UNAVAILABLE_OR_TRANSPORT_FAILURE',
          }
          assert result['market_outcome_opened'] is False
          assert result['model_fit'] is False
          assert result['trade_or_pnl_opened'] is False
          assert result['official_2024_2026_opened'] is False
          assert result['orders_submitted'] is False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"authorized={'true' if result['status'] == 'PASS' else 'false'}\n")
          print(json.dumps({
              'status': result['status'],
              'event_count': result.get('event_count'),
              'months': len(result.get('months_with_events', [])),
              'tokens': result.get('distinct_tokens'),
              'authorized': result.get('conditional_model_screen_authorized', False),
          }, sort_keys=True))
          PY

      - uses: actions/cache@v4
        if: steps.source.outputs.authorized == 'true'
        with:
          path: ${{ env.MARKET_CACHE }}
          key: stablecoin-market-2020-12-2023-12-v1

      - name: Materialize pinned frozen economic engine
        if: steps.source.outputs.authorized == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$ECONOMIC_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$ECONOMIC_SHA"
          rm -rf "$ECON_ROOT"
          git archive "$ECONOMIC_SHA" "$ECON_ROOT" | tar -x
          python "$ECON_ROOT/reconstruct.py"
          python -m py_compile "$ECON_ROOT/run.py" "$ECON_ROOT/test_run.py" "$ECON_ROOT/reconstruct.py"
          PYTHONPATH="$ECON_ROOT" pytest -q "$ECON_ROOT/test_run.py"
          PYTHONPATH="$ECON_ROOT" python "$ECON_ROOT/run.py" self-test

      - name: Run frozen pre-2024 economic screen immediately
        if: steps.source.outputs.authorized == 'true'
        run: |
          set -u
          mkdir -p "$ECON_OUT" "$MARKET_CACHE"
          set +e
          PYTHONPATH="$ECON_ROOT" python "$ECON_ROOT/run.py" run \
            --events "$SOURCE_OUT/EVENTS.jsonl" \
            --market-cache "$MARKET_CACHE" \
            --output "$ECON_OUT" 2>&1 | tee "$ECON_OUT/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$ECON_OUT/RUN_EXIT_CODE.txt"
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then exit "$rc"; fi
          test -f "$ECON_OUT/RESULT.json"

      - name: Enforce fixed scientific and sequential boundaries
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads((Path(os.environ['SOURCE_OUT']) / 'SOURCE_GATE_RESULT.json').read_text())
          assert source['orders_submitted'] is False
          if source['status'] == 'PASS':
              result = json.loads((Path(os.environ['ECON_OUT']) / 'RESULT.json').read_text())
              assert result['claim_id'] == 'CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
              assert result['orders_submitted'] is False
              assert result['official_2024h1_opened'] is False
              assert result['official_2024_2026_opened'] is False
              assert result['status'] in {
                  'PRE2024_BELOW_GATE',
                  'PRE2024_SURVIVOR_READY_FOR_SEQUENTIAL_2024H1',
              }
              print(json.dumps({
                  'source_status': source['status'],
                  'economic_status': result['status'],
                  'confirmation_gate': result['confirmation_gate'].get('all'),
                  'development_opened': result['development_opened'],
                  'next_stage': 'OFFICIAL_2024H1' if result['status'].endswith('READY_FOR_SEQUENTIAL_2024H1') else 'CHANGE_ALPHA',
              }, sort_keys=True))
          else:
              print(json.dumps({
                  'source_status': source['status'],
                  'economic_status': 'NOT_OPENED',
                  'next_stage': 'CLOSE_SOURCE_OR_REPAIR_TRANSPORT_ONLY',
              }, sort_keys=True))
          PY

      - name: Freeze immutable evidence hashes
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('research_runs/ml_stablecoin_pinned_snapshot')
          root.mkdir(parents=True, exist_ok=True)
          rows = []
          for path in sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'OUTPUT_SHA256SUMS.txt'):
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.as_posix()}\n")
          (root / 'OUTPUT_SHA256SUMS.txt').write_text(''.join(rows), encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-pinned-source-economic-${{ github.run_id }}
          path: research_runs/ml_stablecoin_pinned_snapshot
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
