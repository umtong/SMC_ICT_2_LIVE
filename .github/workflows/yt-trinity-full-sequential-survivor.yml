name: YT Trinity full 2024-2026 sequential survivor

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/COARSE_SURVIVOR_POINTER.json
      - research/yt_trinity_ml/run_full_sequential_survivor.py
      - .github/workflows/yt-trinity-full-sequential-survivor.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: yt-trinity-full-sequential-survivor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      survivor_decision: ${{ steps.gate.outputs.survivor_decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('research/yt_trinity_ml/COARSE_SURVIVOR_POINTER.json')
          decision = 'MISSING_SURVIVOR_POINTER'
          authorized = False
          if path.exists():
              payload = json.loads(path.read_text(encoding='utf-8'))
              decision = str(payload.get('decision') or 'MISSING_SURVIVOR_DECISION')
              authorized = decision == 'POSITIVE_H1_FULL_SEQUENTIAL_REQUIRED' and bool(payload.get('selected'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"authorized={'true' if authorized else 'false'}\n")
              handle.write(f"survivor_decision={decision}\n")
          print(json.dumps({'authorized': authorized, 'decision': decision}, indent=2))
          PY

  full-replay:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install full sequential dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow requests pytest
      - name: Compile and run every causal invariant
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python -m py_compile \
            research/yt_trinity_ml/run_cisd_bpr_ifvg_research.py \
            research/yt_trinity_ml/run_compression_bpr_continuation.py \
            research/yt_trinity_ml/run_smt_cisd_research.py \
            research/yt_trinity_ml/run_full_sequential_survivor.py \
            research/yt_trinity_ml/system/*.py
          pytest -q research/yt_trinity_ml/tests
      - uses: actions/cache@v4
        with:
          path: artifact/bybit-cache
          key: yt-trinity-bybit-linear-1m-20220101-20260701-v1
      - name: Replay one continuous official NAV path
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -o pipefail
          mkdir -p artifact/bybit-cache artifact/full-sequential-run
          python research/yt_trinity_ml/run_full_sequential_survivor.py \
            --survivor research/yt_trinity_ml/COARSE_SURVIVOR_POINTER.json \
            --cache-dir artifact/bybit-cache \
            --output artifact/full-sequential-run \
            2>&1 | tee artifact/full-sequential-run/STDOUT.log
      - name: Hash immutable full-period evidence
        if: always()
        run: |
          if [[ -d artifact/full-sequential-run ]]; then
            (
              cd artifact/full-sequential-run
              find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            )
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-full-sequential-${{ github.sha }}
          path: artifact/full-sequential-run
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
      - name: Persist compact full-period decision pointer
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          summary_path = Path('artifact/full-sequential-run/RUN_SUMMARY.json')
          summary = json.loads(summary_path.read_text(encoding='utf-8')) if summary_path.exists() else None
          pointer = {
              'schema_version': 1,
              'workflow': 'YT Trinity full 2024-2026 sequential survivor',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'source_sha': os.environ['GITHUB_SHA'],
              'artifact_name': f"yt-trinity-full-sequential-{os.environ['GITHUB_SHA']}",
              'summary_sha256': hashlib.sha256(summary_path.read_bytes()).hexdigest() if summary_path.exists() else None,
              'decision': summary.get('decision') if isinstance(summary, dict) else 'EXECUTION_FAILED_NO_SUMMARY',
              'strategy_id': summary.get('strategy_id') if isinstance(summary, dict) else None,
              'route_key': summary.get('route_key') if isinstance(summary, dict) else None,
              'realistic_metrics': summary.get('realistic_metrics') if isinstance(summary, dict) else None,
              'zero_friction_metrics_same_signals': summary.get('zero_friction_metrics_same_signals') if isinstance(summary, dict) else None,
              'stressed_metrics_same_signals': summary.get('stressed_metrics_same_signals') if isinstance(summary, dict) else None,
              'half_years': summary.get('half_years') if isinstance(summary, dict) else None,
              'evidence': summary.get('evidence') if isinstance(summary, dict) else None,
              'rankable': False,
          }
          Path('research/yt_trinity_ml/FULL_SEQUENTIAL_COARSE_POINTER.json').write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/FULL_SEQUENTIAL_COARSE_POINTER.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record full 2024-2026 YT Trinity coarse decision ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

  skip:
    needs: authorize
    if: needs.authorize.outputs.authorized != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Full replay not authorized: ${{ needs.authorize.outputs.survivor_decision }}" >> "$GITHUB_STEP_SUMMARY"
