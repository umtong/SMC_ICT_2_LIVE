name: Validate minimal repeated-level Core result

on:
  push:
    branches: [agent/ml-minimal-repeated-level-core-001]
    paths:
      - 'research/minimal_repeated_level_core/**'
      - '.github/workflows/minimal-repeated-level-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/minimal_repeated_level_core/**'
      - '.github/workflows/minimal-repeated-level-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.3 scipy==1.16.2 scikit-learn==1.7.1
      - name: Compile and validate compact evidence
        run: |
          python -m py_compile research/minimal_repeated_level_core/run.py research/minimal_repeated_level_core/validate.py
          python research/minimal_repeated_level_core/validate.py
