name: Materialize protected-boundary source for Core audit

on:
  push:
    branches: [agent/r34-protected-boundary-core-realization-001]
    paths:
      - '.github/workflows/protected-boundary-source-r34.yml'
      - 'research/protected_boundary_core_realization/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/protected-boundary-source-r34.yml'
      - 'research/protected_boundary_core_realization/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-boundary-source-r34-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r34-protected-boundary-core-realization-001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch, verify and extract exact PR 531 source bundle
        run: |
          set -euo pipefail
          out=research_runs/protected_boundary_source_r34
          mkdir -p "$out"
          git fetch --no-tags --depth=1 origin agent/r24-volume-protected-boundary-001
          git show FETCH_HEAD:research/volume_protected_boundary_20260730/SOURCE_BUNDLE.tar.gz.b64 \
            > "$out/SOURCE_BUNDLE.tar.gz.b64"
          base64 -d "$out/SOURCE_BUNDLE.tar.gz.b64" > "$out/SOURCE_BUNDLE.tar.gz"
          observed=$(sha256sum "$out/SOURCE_BUNDLE.tar.gz" | awk '{print $1}')
          test "$observed" = 3855e2e76482f75b63a53543d275a940bdd5175a6b1fddb2ad7155f868ab5298
          tar -xzf "$out/SOURCE_BUNDLE.tar.gz" -C "$out"
          python -m py_compile "$out"/*.py
          sha256sum "$out"/* > "$out/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: protected-boundary-source-r34-${{ github.run_id }}
          path: research_runs/protected_boundary_source_r34
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
