name: YT Trinity contextual PD-array entry-exit ML v2

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/LABEL_EXPORT_POINTER.json
      - research/yt_trinity_ml/run_entry_exit_action_ml_v2.py
      - research/yt_trinity_ml/run_exit_geometry_v1.py
      - .github/workflows/yt-trinity-entry-exit-action-ml-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-entry-exit-action-ml-v2-${{ github.sha }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deterministic dependencies
        run: python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'pyarrow==19.0.1' 'scikit-learn==1.6.1'
      - name: Resolve frozen pre-2024 label export and canonical bars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/labels input/btc input/eth output
          python - <<'PY' > /tmp/label_run_id
          import json
          from pathlib import Path
          payload = json.loads(Path('research/yt_trinity_ml/LABEL_EXPORT_POINTER.json').read_text())
          assert payload['row_count'] == 3036, payload
          assert payload['column_count'] >= 117, payload
          print(payload['run_id'])
          PY
          label_run_id="$(cat /tmp/label_run_id)"
          label_artifact_id="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${label_run_id}/artifacts" \
            | python -c 'import json,sys; a=json.load(sys.stdin)["artifacts"]; print(next(x["id"] for x in a if x["name"].startswith("yt-trinity-label-export-")))')"
          fetch_artifact() {
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"
          }
          fetch_artifact "${label_artifact_id}" /tmp/labels.zip
          fetch_artifact 8636781702 /tmp/btc.zip
          fetch_artifact 8636761741 /tmp/eth.zip
          unzip -q /tmp/labels.zip -d input/labels
          unzip -q /tmp/btc.zip -d input/btc
          unzip -q /tmp/eth.zip -d input/eth
          find input/labels -name EVENT_LABELS.pkl.gz -print -quit > /tmp/labels_path
          find input/btc -path '*/trade_bars/1m.parquet' -print -quit > /tmp/btc_path
          find input/eth -path '*/trade_bars/1m.parquet' -print -quit > /tmp/eth_path
          test -s /tmp/labels_path && test -s /tmp/btc_path && test -s /tmp/eth_path
      - name: Verify reconstructable geometry and normalize execution spread
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from run_exit_geometry_v1 import reconstruct_candidates

          labels_path = Path(Path('/tmp/labels_path').read_text().strip())
          labels = pd.read_pickle(labels_path, compression='gzip').reset_index(drop=True)
          candidates = reconstruct_candidates(labels)
          if len(candidates) != len(labels):
              raise SystemExit(f'candidate reconstruction mismatch: {len(candidates)} != {len(labels)}')
          for candidate in candidates:
              if candidate.side * (candidate.entry_reference - candidate.stop_reference) <= 0:
                  raise SystemExit(f'invalid stop geometry at row {candidate.row_id}')
              if candidate.side * (candidate.target_reference - candidate.entry_reference) <= 0:
                  raise SystemExit(f'invalid target geometry at row {candidate.row_id}')

          bar_rows = {}
          for key, pointer in [('BTCUSDT', '/tmp/btc_path'), ('ETHUSDT', '/tmp/eth_path')]:
              path = Path(Path(pointer).read_text().strip())
              frame = pd.read_parquet(path)
              if 'spread_bps' not in frame.columns:
                  frame['spread_bps'] = 0.5
              else:
                  frame['spread_bps'] = pd.to_numeric(frame['spread_bps'], errors='coerce').fillna(0.5)
              frame.to_parquet(path, index=False)
              bar_rows[key] = int(len(frame))
          preflight = {
              'label_rows': int(len(labels)),
              'candidate_rows': int(len(candidates)),
              'bar_rows': bar_rows,
              'latest_label_end': str(pd.to_datetime(labels['event_end'], utc=True).max()),
              'information_cutoff_ok': bool(pd.to_datetime(labels['event_end'], utc=True).max() < pd.Timestamp('2024-01-01', tz='UTC')),
          }
          if not preflight['information_cutoff_ok']:
              raise SystemExit(preflight)
          Path('output/PREFLIGHT.json').write_text(json.dumps(preflight, indent=2, sort_keys=True) + '\n')
          print(json.dumps(preflight, indent=2, sort_keys=True))
          PY
      - name: Execute H1-trained H2-sealed contextual action policy
        run: |
          set +e
          python research/yt_trinity_ml/run_entry_exit_action_ml_v2.py \
            --labels "$(cat /tmp/labels_path)" \
            --btc-bars "$(cat /tmp/btc_path)" \
            --eth-bars "$(cat /tmp/eth_path)" \
            --output output \
            2>&1 | tee output/STDOUT.log
          code=${PIPESTATUS[0]}
          echo "$code" > output/EXIT_CODE.txt
          exit 0
      - name: Persist exact action-policy result
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path('output')
          result_path = out / 'ENTRY_EXIT_ACTION_ML_RESULT.json'
          code = int((out / 'EXIT_CODE.txt').read_text().strip()) if (out / 'EXIT_CODE.txt').exists() else 99
          result = json.loads(result_path.read_text()) if result_path.exists() else None
          preflight = json.loads((out / 'PREFLIGHT.json').read_text()) if (out / 'PREFLIGHT.json').exists() else None
          log = (out / 'STDOUT.log').read_text(errors='replace') if (out / 'STDOUT.log').exists() else ''
          pointer = {
              'schema_version': 2,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'stage': 'PRE2024_CONTEXTUAL_PD_ARRAY_ENTRY_EXIT_ML_H1_H2_NOT_RANKABLE',
              'source_commit': os.environ['GITHUB_SHA'],
              'label_export_run_id': int(Path('/tmp/label_run_id').read_text().strip()),
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'exit_code': code,
              'job_status': 'success' if code == 0 else 'execution_failure_not_economic_failure',
              'preflight': preflight,
              'result': result,
              'result_sha256': hashlib.sha256(result_path.read_bytes()).hexdigest() if result_path.exists() else None,
              'stdout_tail': log[-12000:],
              'ranking_effect': 'NONE_PRE2024_NOT_RANKABLE',
          }
          Path('research/yt_trinity_ml/ENTRY_EXIT_ACTION_ML_V2_POINTER.json').write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/ENTRY_EXIT_ACTION_ML_V2_POINTER.json
          if ! git diff --cached --quiet; then
            git commit -m "Record repaired contextual entry-exit ML ${GITHUB_RUN_ID}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin agent/r22-yt-trinity-ml-001
              if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
      - name: Hash and upload evidence
        if: always()
        run: (cd output && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-entry-exit-action-ml-v2-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Fail after evidence preservation
        if: always()
        run: test "$(cat output/EXIT_CODE.txt 2>/dev/null || echo 99)" = 0
