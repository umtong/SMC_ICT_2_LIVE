name: YT Trinity pooled pre2024-positive logical system

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/CISD_BPR_IFVG_RUN_POINTER.json
      - research/yt_trinity_ml/COMPRESSION_BPR_RUN_POINTER.json
      - research/yt_trinity_ml/SMT_CISD_RUN_POINTER.json
      - research/yt_trinity_ml/run_pooled_trinity_system.py
      - .github/workflows/yt-trinity-pooled-system.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: yt-trinity-pooled-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          names = [
              'CISD_BPR_IFVG_RUN_POINTER.json',
              'COMPRESSION_BPR_RUN_POINTER.json',
              'SMT_CISD_RUN_POINTER.json',
          ]
          allowed = {'ECONOMIC_FAIL_SWITCH_ALPHA', 'POSITIVE_PRE2024_OPENED_2024H1_COARSE'}
          decisions = {}
          authorized = True
          for name in names:
              path = Path('research/yt_trinity_ml') / name
              if not path.exists():
                  decisions[name] = 'MISSING'
                  authorized = False
                  continue
              payload = json.loads(path.read_text(encoding='utf-8'))
              decision = str(payload.get('decision') or 'MISSING_DECISION')
              decisions[name] = decision
              if decision not in allowed:
                  authorized = False
          reason = json.dumps(decisions, sort_keys=True, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"authorized={'true' if authorized else 'false'}\n")
              handle.write(f"reason={reason}\n")
          print(json.dumps({'authorized': authorized, 'decisions': decisions}, indent=2))
          PY

  run-pooled:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pooled causal dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow requests pytest
      - name: Compile and run every causal invariant
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python -m py_compile \
            research/yt_trinity_ml/run_cisd_bpr_ifvg_research.py \
            research/yt_trinity_ml/run_compression_bpr_continuation.py \
            research/yt_trinity_ml/run_smt_cisd_research.py \
            research/yt_trinity_ml/run_full_sequential_survivor.py \
            research/yt_trinity_ml/run_pooled_trinity_system.py \
            research/yt_trinity_ml/system/*.py
          pytest -q research/yt_trinity_ml/tests
      - uses: actions/cache@v4
        with:
          path: artifact/bybit-cache
          key: yt-trinity-bybit-linear-1m-20220101-20260701-v1
      - name: Run pre-2024 family inclusion and one-slot pooled system
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -o pipefail
          mkdir -p artifact/bybit-cache artifact/pooled-trinity-run
          python research/yt_trinity_ml/run_pooled_trinity_system.py \
            --pointer-root research/yt_trinity_ml \
            --cache-dir artifact/bybit-cache \
            --output artifact/pooled-trinity-run \
            2>&1 | tee artifact/pooled-trinity-run/STDOUT.log
      - name: Hash immutable pooled evidence
        if: always()
        run: |
          if [[ -d artifact/pooled-trinity-run ]]; then
            (
              cd artifact/pooled-trinity-run
              find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            )
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-pooled-system-${{ github.sha }}
          path: artifact/pooled-trinity-run
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
      - name: Persist compact pooled-system pointer
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          summary_path = Path('artifact/pooled-trinity-run/RUN_SUMMARY.json')
          summary = json.loads(summary_path.read_text(encoding='utf-8')) if summary_path.exists() else None
          full_result = summary.get('official_full_period') if isinstance(summary, dict) else None
          pointer = {
              'schema_version': 1,
              'workflow': 'YT Trinity pooled pre2024-positive logical system',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'source_sha': os.environ['GITHUB_SHA'],
              'artifact_name': f"yt-trinity-pooled-system-{os.environ['GITHUB_SHA']}",
              'summary_sha256': hashlib.sha256(summary_path.read_bytes()).hexdigest() if summary_path.exists() else None,
              'decision': summary.get('decision') if isinstance(summary, dict) else 'EXECUTION_FAILED_NO_SUMMARY',
              'strategy_id': summary.get('strategy_id') if isinstance(summary, dict) else None,
              'included_routes': summary.get('included_routes') if isinstance(summary, dict) else None,
              'selected_basic': summary.get('selected_basic') if isinstance(summary, dict) else None,
              'selected_risk': summary.get('selected_risk') if isinstance(summary, dict) else None,
              'official_2024h1': summary.get('official_2024h1') if isinstance(summary, dict) else None,
              'official_full_period': full_result,
              'rankable': False,
          }
          Path('research/yt_trinity_ml/POOLED_TRINITY_RUN_POINTER.json').write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/POOLED_TRINITY_RUN_POINTER.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record pooled YT Trinity causal system ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

  skip:
    needs: authorize
    if: needs.authorize.outputs.authorized != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Pooled system waiting for three economically resolved routes.' >> "$GITHUB_STEP_SUMMARY"
