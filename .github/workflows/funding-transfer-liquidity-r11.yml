name: Bybit exact funding-transfer liquidity fatal screen

on:
  push:
    branches:
      - agent/r11-funding-transfer-liquidity-001
    paths:
      - "research/funding_transfer_liquidity_20260726/**"
      - ".github/workflows/funding-transfer-liquidity-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/funding_transfer_liquidity_20260726/**"
      - ".github/workflows/funding-transfer-liquidity-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: funding-transfer-liquidity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen research environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "pytest==8.3.4"

      - name: Compile, test and run causal self-test
        run: |
          set -euo pipefail
          root=research/funding_transfer_liquidity_20260726
          python -m py_compile "$root/run_screen.py" "$root/test_run_screen.py" "$root/probe_tardis_derivative_ticker.py"
          python -m pytest -q "$root/test_run_screen.py"
          mkdir -p research_runs/funding_transfer_liquidity/self_test
          python "$root/run_screen.py" \
            --self-test \
            --output research_runs/funding_transfer_liquidity/self_test \
            --cache "$RUNNER_TEMP/funding-transfer-cache"
          (cd research_runs/funding_transfer_liquidity/self_test && sha256sum --check SHA256SUMS.txt)

      - name: Run outcome-free Tardis derivative-ticker schema probe
        run: |
          set -euo pipefail
          root=research/funding_transfer_liquidity_20260726
          mkdir -p research_runs/funding_transfer_liquidity/tardis_probe
          python "$root/probe_tardis_derivative_ticker.py" \
            --output research_runs/funding_transfer_liquidity/tardis_probe
          (cd research_runs/funding_transfer_liquidity/tardis_probe && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          probe = json.loads(Path("research_runs/funding_transfer_liquidity/tardis_probe/PROBE.json").read_text())
          assert probe["status"] == "SOURCE_SCHEMA_PROBE_PASS"
          assert probe["strategy_outcomes_read"] is False
          assert probe["candidate_pnl_computed"] is False
          assert probe["orders_submitted"] is False
          assert probe["2024_opened"] is False
          assert probe["2025_or_2026_opened"] is False
          assert probe["row_count"] > 0
          print(json.dumps(probe["field_summary"], sort_keys=True))
          PY

      - name: Run frozen official pre-2024 API screen
        run: |
          set -euo pipefail
          root=research/funding_transfer_liquidity_20260726
          mkdir -p research_runs/funding_transfer_liquidity/output
          python "$root/run_screen.py" \
            --output research_runs/funding_transfer_liquidity/output \
            --cache "$RUNNER_TEMP/funding-transfer-cache" \
            2>&1 | tee research_runs/funding_transfer_liquidity/screen.log

      - name: Verify result safety and integrity
        run: |
          set -euo pipefail
          (cd research_runs/funding_transfer_liquidity/output && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("research_runs/funding_transfer_liquidity/output/RESULT.json").read_text())
          assert result["candidate_count"] == 720
          assert result["2024_opened"] is False
          assert result["2025_or_2026_opened"] is False
          assert result["orders_submitted"] is False
          assert result["status"] in {
              "TESTED_BELOW_GATE",
              "PROMISING_PRE2024_SURVIVOR",
              "DATA_UNAVAILABLE",
          }
          if result["status"] != "DATA_UNAVAILABLE":
              assert result["hard_validity_status"] == "PASS_INITIAL"
              assert result["source_count"] == 12
          print(json.dumps({
              "status": result["status"],
              "gate_pass_count": result.get("gate_pass_count"),
              "positive_candidate_counts": result.get("positive_candidate_counts"),
              "best_candidate": result.get("best_candidate"),
              "error": result.get("error"),
          }, sort_keys=True, default=str))
          PY
          python scripts/validate_project.py

      - name: Record immutable input hashes
        if: always()
        run: |
          set -euo pipefail
          sha256sum \
            research/funding_transfer_liquidity_20260726/preregistration.json \
            research/funding_transfer_liquidity_20260726/AMENDMENT-001-SOURCE-TRANSPORT.json \
            research/funding_transfer_liquidity_20260726/AMENDMENT-002-TARDIS-SOURCE-PROBE.json \
            research/funding_transfer_liquidity_20260726/README.md \
            research/funding_transfer_liquidity_20260726/run_screen.py \
            research/funding_transfer_liquidity_20260726/implementation.b64.part00 \
            research/funding_transfer_liquidity_20260726/implementation.b64.part01 \
            research/funding_transfer_liquidity_20260726/test_run_screen.py \
            research/funding_transfer_liquidity_20260726/probe_tardis_derivative_ticker.py \
            .github/workflows/funding-transfer-liquidity-r11.yml \
            > research_runs/funding_transfer_liquidity/INPUT_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funding-transfer-liquidity-${{ github.sha }}
          path: research_runs/funding_transfer_liquidity
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
