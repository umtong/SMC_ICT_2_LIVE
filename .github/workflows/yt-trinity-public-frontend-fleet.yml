name: YT Trinity public frontend fleet probe

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/probe_public_frontend_fleet.py
      - control/yt-trinity-public-frontend-fleet-trigger.json
      - .github/workflows/yt-trinity-public-frontend-fleet.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-public-frontend-fleet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            key: Linux
          - os: macos-14
            key: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependency
        run: python -m pip install -q --upgrade requests
      - name: Probe live Piped and Invidious fleets
        continue-on-error: true
        run: |
          mkdir -p artifact
          python research/yt_trinity_ml/probe_public_frontend_fleet.py \
            --runner-key "${{ matrix.key }}" \
            --maximum-instances 180 \
            --output "artifact/PUBLIC_FRONTEND_FLEET_${{ matrix.key }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-public-frontend-fleet-${{ matrix.key }}-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          retention-days: 30
      - name: Persist result and any validated winner
        if: always()
        run: |
          source="artifact/PUBLIC_FRONTEND_FLEET_${{ matrix.key }}.json"
          if [[ ! -f "$source" ]]; then exit 0; fi
          result="research/yt_trinity_ml/PUBLIC_FRONTEND_FLEET_${{ matrix.key }}.json"
          cp "$source" "$result"
          python - <<'PY'
          import json
          from pathlib import Path
          key = "${{ matrix.key }}"
          source = Path(f"artifact/PUBLIC_FRONTEND_FLEET_{key}.json")
          payload = json.loads(source.read_text(encoding="utf-8"))
          winners = payload.get("winners") or []
          target = Path(f"research/yt_trinity_ml/PUBLIC_FRONTEND_WINNER_{key}.json")
          if winners:
              winner = {
                  "schema_version": 1,
                  "runner_key": key,
                  "source_run_id": payload.get("runner", {}).get("github_run_id"),
                  "source_sha": payload.get("runner", {}).get("github_sha"),
                  "winner": winners[0],
              }
              target.write_text(json.dumps(winner, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          elif target.exists():
              target.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$result"
          if [[ -f "research/yt_trinity_ml/PUBLIC_FRONTEND_WINNER_${{ matrix.key }}.json" ]]; then
            git add "research/yt_trinity_ml/PUBLIC_FRONTEND_WINNER_${{ matrix.key }}.json"
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record ${{ matrix.key }} public frontend fleet probe ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
