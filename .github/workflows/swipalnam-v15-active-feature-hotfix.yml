name: Swipalnam V15 active-feature causal hotfix

on:
  push:
    branches: [agent/r23-swipalnam-liquidity-delivery-ml-001]
    paths:
      - .github/workflows/swipalnam-v15-active-feature-hotfix.yml

permissions:
  contents: write

concurrency:
  group: swipalnam-v15-active-feature-hotfix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q "numpy>=1.26" "pandas>=2.2" "pyarrow>=16" "scikit-learn>=1.5" "requests>=2.32"
      - name: Select only causally informative columns inside each training window
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$GITHUB_REF_NAME"
          python - <<'PY'
          from pathlib import Path

          path = Path("research/swipalnam_smc_ml/experiments/liquidity_delivery_ml_v15_dual_auction.py")
          text = path.read_text(encoding="utf-8")

          old = '''        seed = 7 + int(cutoff // v1.DAY_MS) % 997\n        outcome_classifier, outcome_regressor = causal_model_pair(seed)\n        outcome_classifier.fit(x.loc[outcome_train], binary)\n        outcome_regressor.fit(x.loc[outcome_train], y)\n        win_probability = outcome_classifier.predict_proba(x.loc[predict])[:, 1]\n        conditional_r = outcome_regressor.predict(x.loc[predict])\n\n        if fill_y.nunique() >= 2:\n'''
          new = '''        # Feature availability is resolved from information that existed at\n        # this cutoff only.  All-NaN and constant columns are excluded rather\n        # than filled from the future evaluation distribution.\n        training_block = x.loc[resolved]\n        active_columns = [\n            name\n            for name in x.columns\n            if training_block[name].dropna().nunique() >= 2\n        ]\n        if not active_columns:\n            continue\n        x_active = x[active_columns]\n\n        seed = 7 + int(cutoff // v1.DAY_MS) % 997\n        outcome_classifier, outcome_regressor = causal_model_pair(seed)\n        outcome_classifier.fit(x_active.loc[outcome_train], binary)\n        outcome_regressor.fit(x_active.loc[outcome_train], y)\n        win_probability = outcome_classifier.predict_proba(x_active.loc[predict])[:, 1]\n        conditional_r = outcome_regressor.predict(x_active.loc[predict])\n\n        if fill_y.nunique() >= 2:\n'''
          if old not in text:
              if new not in text:
                  raise SystemExit("prequential active-feature insertion target missing")
          else:
              text = text.replace(old, new, 1)

          text = text.replace(
              '            fill_classifier.fit(x.loc[resolved], fill_y)\n            fill_probability = fill_classifier.predict_proba(x.loc[predict])[:, 1]\n',
              '            fill_classifier.fit(x_active.loc[resolved], fill_y)\n            fill_probability = fill_classifier.predict_proba(x_active.loc[predict])[:, 1]\n',
              1,
          )

          old_test = '''    classifier, regressor = causal_model_pair(31)\n    classifier.fit(x, pd.Series(np.arange(100) % 2))\n    regressor.fit(x, pd.Series(np.sin(np.arange(100) / 8)))\n    assert np.isfinite(classifier.predict_proba(x.iloc[:3])).all()\n    assert np.isfinite(regressor.predict(x.iloc[:3])).all()\n'''
          new_test = '''    active_columns = [\n        name for name in x.columns if x[name].dropna().nunique() >= 2\n    ]\n    assert active_columns\n    x_active = x[active_columns]\n    classifier, regressor = causal_model_pair(31)\n    classifier.fit(x_active, pd.Series(np.arange(100) % 2))\n    regressor.fit(x_active, pd.Series(np.sin(np.arange(100) / 8)))\n    assert np.isfinite(classifier.predict_proba(x_active.iloc[:3])).all()\n    assert np.isfinite(regressor.predict(x_active.iloc[:3])).all()\n'''
          if old_test not in text:
              if new_test not in text:
                  raise SystemExit("self-test active-feature target missing")
          else:
              text = text.replace(old_test, new_test, 1)

          # Python's salted hash is not a durable model feature.  Distance and\n          # target family remain informative; the unstable code is neutralized.\n          old_dual = '''    continuation = continuation_candidates(symbol, frame)\n    parts = [\n'''
          new_dual = '''    continuation = continuation_candidates(symbol, frame)\n    if not sweep_reversal.empty and "target_reference_code" in sweep_reversal:\n        sweep_reversal = sweep_reversal.copy()\n        sweep_reversal["target_reference_code"] = 0.0\n    parts = [\n'''
          if old_dual in text:
              text = text.replace(old_dual, new_dual, 1)
          elif new_dual not in text:
              raise SystemExit("stable target feature target missing")

          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile research/swipalnam_smc_ml/experiments/liquidity_delivery_ml*.py
          python research/swipalnam_smc_ml/experiments/liquidity_delivery_ml_v15_dual_auction.py --self-test
      - name: Persist tested hotfix and remove one-shot diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/swipalnam_smc_ml/experiments/liquidity_delivery_ml_v15_dual_auction.py
          git rm -f \
            .github/workflows/swipalnam-v15-active-feature-hotfix.yml \
            .github/workflows/swipalnam-v15-selftest-diagnostic.yml
          git commit -m "Fix causal active-feature selection in V15"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
