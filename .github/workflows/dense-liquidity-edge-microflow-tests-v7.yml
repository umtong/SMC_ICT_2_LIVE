name: Dense liquidity-edge microflow semantic tests v7

on:
  push:
    branches:
      - agent/r37-dense-liquidity-edge-microflow-001
    paths:
      - research/dense_liquidity_edge_microflow/RUN_TESTS_V7

permissions:
  contents: write
  issues: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r37-dense-liquidity-edge-microflow-001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pyarrow==18.1.0 scikit-learn==1.5.2 requests==2.32.3 pytest==8.3.4
      - id: check
        run: |
          python -m py_compile research/dense_liquidity_edge_microflow/*.py
          pytest -q tests/test_dense_liquidity_edge_microflow_v5.py | tee test-output.txt
      - name: Commit pass marker
        if: success()
        run: |
          printf 'passed\n' > research/dense_liquidity_edge_microflow/TESTS_V5_PASS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dense_liquidity_edge_microflow/TESTS_V5_PASS
          git diff --cached --quiet || git commit -m 'Record dense microflow semantic test pass'
          git pull --rebase origin agent/r37-dense-liquidity-edge-microflow-001
          git push origin HEAD:agent/r37-dense-liquidity-edge-microflow-001
      - name: Comment test status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '## V5 semantic test workflow\n\nStatus: `%s`\n\n' "$JOB_STATUS" > comment.md
          if test -f test-output.txt; then printf '```text\n' >> comment.md; tail -80 test-output.txt >> comment.md; printf '\n```\n' >> comment.md; fi
          gh issue comment 581 --repo umtong/SMC_ICT_2_LIVE --body-file comment.md
