name: Cross-venue price-discovery exact-arrival V5

on:
  push:
    branches:
      - agent/r5-cross-venue-exact-arrival-v5
    paths:
      - "research/cross_venue_price_discovery_20260725/CAUSAL_EXECUTION_CORRECTION_V5.md"
      - "research/cross_venue_price_discovery_20260725/cross_venue_execution_v5.py"
      - "research/cross_venue_price_discovery_20260725/cross_venue_pilot_v5.py"
      - "research/cross_venue_price_discovery_20260725/cross_venue_development_v5.py"
      - "research/cross_venue_price_discovery_20260725/test_cross_venue_execution_v5.py"
      - ".github/workflows/cross-venue-price-discovery-v5.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/cross_venue_price_discovery_20260725/CAUSAL_EXECUTION_CORRECTION_V5.md"
      - "research/cross_venue_price_discovery_20260725/cross_venue_execution_v5.py"
      - "research/cross_venue_price_discovery_20260725/cross_venue_pilot_v5.py"
      - "research/cross_venue_price_discovery_20260725/cross_venue_development_v5.py"
      - "research/cross_venue_price_discovery_20260725/test_cross_venue_execution_v5.py"
      - ".github/workflows/cross-venue-price-discovery-v5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-venue-exact-arrival-v5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "requests==2.32.4" "pytest==8.3.4"
          mkdir -p research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5
          python - <<'PY'
          import json, numpy, pandas, platform, requests, sys
          from pathlib import Path
          root=Path('research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5')
          (root/'environment.json').write_text(json.dumps({
              'python':sys.version,
              'platform':platform.platform(),
              'numpy':numpy.__version__,
              'pandas':pandas.__version__,
              'requests':requests.__version__,
              'credentials_used':False,
              'orders_submitted':False,
              'paper_live_started':False,
              'selection_opened':False,
              'confirmation_opened':False,
              '2026_opened':False,
          },indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Compile and run causal adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_venue_price_discovery_20260725
          python -m py_compile \
            "$root/cross_venue_pilot.py" \
            "$root/cross_venue_pilot_v2.py" \
            "$root/cross_venue_development_v2.py" \
            "$root/source_probe.py" \
            "$root/source_probe_v2.py" \
            "$root/cross_venue_execution_v5.py" \
            "$root/cross_venue_pilot_v5.py" \
            "$root/cross_venue_development_v5.py" \
            "$root/test_cross_venue_execution_v5.py"
          PYTHONPATH="$root" pytest -q "$root/test_cross_venue_execution_v5.py" \
            2>&1 | tee research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5/tests.log
          PYTHONPATH="$root" python "$root/source_probe_v2.py" --self-test \
            --output research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5 \
            2>&1 | tee research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5/probe_self_test.log
          sha256sum \
            "$root/CAUSAL_EXECUTION_CORRECTION_V5.md" \
            "$root/cross_venue_execution_v5.py" \
            "$root/cross_venue_pilot_v5.py" \
            "$root/cross_venue_development_v5.py" \
            "$root/test_cross_venue_execution_v5.py" \
            > research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5/INPUT_SHA256SUMS.txt

      - name: Validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_project.py

      - name: Probe public local-arrival sources
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set +e
          root=research/cross_venue_price_discovery_20260725
          PYTHONPATH="$root" python "$root/source_probe_v2.py" \
            --date 2023-07-01 \
            --output research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5/probe \
            2>&1 | tee research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5/probe.log
          exit 0

      - name: Run V5 fatal pilot and conditional development
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_venue_price_discovery_20260725
          runroot=research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5
          usable=$(python - <<'PY'
          import json, pathlib
          p=pathlib.Path('research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5/probe/SOURCE_PROBE_V2.json')
          print('true' if p.exists() and json.loads(p.read_text())['all_required_sources_usable'] else 'false')
          PY
          )
          if [[ "$usable" != "true" ]]; then
            python - <<'PY'
          import json, pathlib
          root=pathlib.Path('research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5')
          payload={
              'schema_version':1,
              'claim_id':'CLM-20260725-1850-XVENUE-001',
              'stage':'SOURCE_UNAVAILABLE_V5',
              'causal_version':5,
              'strategy_or_pnl_computed':False,
              'development_opened':False,
              'selection_opened':False,
              'confirmation_opened':False,
              '2026_opened':False,
              'orders_submitted':False,
              'paper_live_started':False,
              'ranking_eligible':False,
          }
          (root/'V5_SEQUENTIAL_RESULT.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
            exit 0
          fi
          PYTHONPATH="$root" python "$root/cross_venue_pilot_v5.py" \
            --output "$runroot/pilot" \
            --cache "$RUNNER_TEMP/xvenue-v5-cache" \
            2>&1 | tee "$runroot/pilot.log"
          PYTHONPATH="$root" python "$root/cross_venue_development_v5.py" \
            --pilot-dir "$runroot/pilot" \
            --output "$runroot/development" \
            --cache "$RUNNER_TEMP/xvenue-v5-cache" \
            2>&1 | tee "$runroot/development.log"
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5')
          pilot=json.loads((root/'pilot'/'PILOT_RESULT.json').read_text())
          development=json.loads((root/'development'/'DEVELOPMENT_RESULT.json').read_text())
          payload={
              'schema_version':1,
              'claim_id':'CLM-20260725-1850-XVENUE-001',
              'stage':development['stage'],
              'causal_version':5,
              'pilot_fatal_edge_pass_count':int(pilot.get('fatal_edge_pass_count',0)),
              'development_opened':bool(development.get('development_opened',False)),
              'development_gate_pass_count':int(development.get('development_gate_pass_count',0)),
              'selection_opened':False,
              'confirmation_opened':False,
              '2026_opened':False,
              'orders_submitted':False,
              'paper_live_started':False,
              'ranking_eligible':False,
              'earlier_engine_outputs_admissible':False,
          }
          (root/'V5_SEQUENTIAL_RESULT.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY

      - name: Record immutable output checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5
          find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-venue-price-discovery-exact-arrival-v5-${{ github.sha }}
          path: research_runs/cross_venue_price_discovery_20260725/exact_arrival_v5
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
