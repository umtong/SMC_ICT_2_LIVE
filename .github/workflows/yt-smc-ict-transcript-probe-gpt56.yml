name: YT SMC ICT transcript relay probe gpt56

on:
  workflow_dispatch:
  push:
    branches:
      - agent/yt-smc-ict-causal-ml-gpt56-20260727
    paths:
      - .github/workflows/yt-smc-ict-transcript-probe-gpt56.yml

permissions:
  contents: write

concurrency:
  group: yt-smc-ict-transcript-probe-gpt56-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Probe public transcript relays
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          videos = [
              ('chartbro', 'wsDsSIvaKKQ'),
              ('easy_chart_man', '0h9lpMUBSlE'),
              ('indicator_sensei', '4bL9Gj5fz4c'),
          ]

          def request_json(url, headers=None, timeout=90):
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
                      'Accept': 'application/json,text/plain,*/*',
                      **(headers or {}),
                  },
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  raw = response.read()
                  return response.status, dict(response.headers), json.loads(raw.decode('utf-8', errors='replace'))

          out = {
              'schema_version': 1,
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'services': {},
          }

          # youtube2text public demo key and relay.
          service = {'key': None, 'videos': []}
          try:
              _, _, key_payload = request_json('https://youtube2text.org/api/demo-key')
              key = key_payload.get('apiKey')
              service['key'] = {'success': bool(key), 'key_id': key_payload.get('keyId')}
              for channel, video_id in videos:
                  url = 'https://youtube2text.org/api/transcribe?' + urllib.parse.urlencode({
                      'url': f'https://www.youtube.com/watch?v={video_id}',
                      'maxChars': 250000,
                  })
                  try:
                      status, response_headers, payload = request_json(url, headers={'x-api-key': key}, timeout=120)
                      serialized = json.dumps(payload, ensure_ascii=False)
                      service['videos'].append({
                          'channel': channel,
                          'video_id': video_id,
                          'status': status,
                          'success': payload.get('success'),
                          'keys': sorted(payload.keys()),
                          'characters': len(serialized),
                          'payload_preview': serialized[:2000],
                          'rate_headers': {k: v for k, v in response_headers.items() if 'rate' in k.lower() or 'limit' in k.lower()},
                      })
                  except Exception as exc:
                      service['videos'].append({
                          'channel': channel,
                          'video_id': video_id,
                          'error': f'{type(exc).__name__}: {exc}',
                      })
          except Exception as exc:
              service['key'] = {'success': False, 'error': f'{type(exc).__name__}: {exc}'}
          out['services']['youtube2text'] = service

          # TranscriptAPI public live-demo endpoint, which may permit unauthenticated preview calls.
          service = {'videos': []}
          for channel, video_id in videos:
              endpoints = [
                  'https://api.transcriptapi.io/transcript?' + urllib.parse.urlencode({'video_id': video_id}),
                  'https://api.transcriptapi.io/transcript?' + urllib.parse.urlencode({'video_url': f'https://www.youtube.com/watch?v={video_id}'}),
              ]
              attempts = []
              for url in endpoints:
                  try:
                      status, response_headers, payload = request_json(url, timeout=120)
                      serialized = json.dumps(payload, ensure_ascii=False)
                      attempts.append({
                          'url_shape': urllib.parse.urlparse(url).path + '?' + urllib.parse.urlparse(url).query.split('=')[0],
                          'status': status,
                          'keys': sorted(payload.keys()) if isinstance(payload, dict) else [],
                          'characters': len(serialized),
                          'payload_preview': serialized[:2000],
                      })
                  except Exception as exc:
                      attempts.append({'error': f'{type(exc).__name__}: {exc}'})
              service['videos'].append({'channel': channel, 'video_id': video_id, 'attempts': attempts})
          out['services']['transcriptapi_live'] = service

          path = Path('research/yt_smc_ict_gpt56/TRANSCRIPT_PROBE.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_smc_ict_gpt56/TRANSCRIPT_PROBE.json
          git commit -m "Record transcript relay probe ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
