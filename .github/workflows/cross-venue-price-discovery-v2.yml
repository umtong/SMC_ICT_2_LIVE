name: Cross-venue price-discovery causal V2

on:
  push:
    branches:
      - agent/r5-cross-venue-price-discovery-001
    paths:
      - "research/cross_venue_price_discovery_20260725/preregistration_v2.json"
      - "research/cross_venue_price_discovery_20260725/source_probe_v2.py"
      - "research/cross_venue_price_discovery_20260725/cross_venue_pilot_v2.py"
      - "research/cross_venue_price_discovery_20260725/test_cross_venue_pilot_v2.py"
      - "research/cross_venue_price_discovery_20260725/CAUSAL_CORRECTION_V2.md"
      - ".github/workflows/cross-venue-price-discovery-v2.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/cross_venue_price_discovery_20260725/**"
      - ".github/workflows/cross-venue-price-discovery-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r5-cross-venue-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      usable: ${{ steps.status.outputs.usable }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-cross-venue-price-discovery-001
          fetch-depth: 1

      - name: Install fixed source environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "requests==2.32.4"
          mkdir -p research_runs/cross_venue_price_discovery_20260725/v2_probe

      - name: Verify V2 identities and synthetic availability test
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_venue_price_discovery_20260725
          python -m py_compile "$root/source_probe.py" "$root/source_probe_v2.py"
          sha256sum "$root/preregistration_v2.json" "$root/source_probe.py" "$root/source_probe_v2.py" "$root/CAUSAL_CORRECTION_V2.md" > research_runs/cross_venue_price_discovery_20260725/v2_probe/INPUT_SHA256SUMS.txt
          PYTHONPATH="$root" python "$root/source_probe_v2.py" --self-test --output research_runs/cross_venue_price_discovery_20260725/v2_probe 2>&1 | tee research_runs/cross_venue_price_discovery_20260725/v2_probe/self_test.log

      - name: Probe local-arrival schemas
        id: status
        shell: bash
        run: |
          set +e
          root=research/cross_venue_price_discovery_20260725
          PYTHONPATH="$root" python "$root/source_probe_v2.py" \
            --date 2023-07-01 \
            --output research_runs/cross_venue_price_discovery_20260725/v2_probe/results \
            2>&1 | tee research_runs/cross_venue_price_discovery_20260725/v2_probe/probe.log
          rc=${PIPESTATUS[0]}
          python - "$rc" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path('research_runs/cross_venue_price_discovery_20260725/v2_probe')
          result=root/'results'/'SOURCE_PROBE_V2.json'
          usable=False
          payload={
              'probe_rc':int(sys.argv[1]),
              'result_present':result.exists(),
              'strategy_or_pnl_computed':False,
              'selection_opened':False,
              'confirmation_opened':False,
              '2026_opened':False,
              'orders_submitted':False,
          }
          if result.exists():
              item=json.loads(result.read_text())
              usable=bool(item['all_required_sources_usable'])
              payload['all_required_sources_usable']=usable
              payload['record_count']=len(item['records'])
          (root/'RUN_STATUS.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          with open(sys.argv[2],'a',encoding='utf-8') as handle:
              handle.write(f"usable={'true' if usable else 'false'}\n")
          print(json.dumps(payload,sort_keys=True))
          PY
          exit 0

      - name: Record probe checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research_runs/cross_venue_price_discovery_20260725/v2_probe
          find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-venue-v2-probe-${{ github.sha }}
          path: research_runs/cross_venue_price_discovery_20260725/v2_probe
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  pilot:
    needs: probe
    if: needs.probe.outputs.usable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-cross-venue-price-discovery-001
          fetch-depth: 1

      - name: Install fixed pilot environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "requests==2.32.4" "pytest==8.3.4"
          mkdir -p research_runs/cross_venue_price_discovery_20260725/v2_pilot

      - name: Run adversarial causal tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_venue_price_discovery_20260725
          python -m py_compile "$root/cross_venue_pilot.py" "$root/cross_venue_pilot_v2.py" "$root/test_cross_venue_pilot_v2.py"
          sha256sum "$root/preregistration_v2.json" "$root/cross_venue_pilot.py" "$root/cross_venue_pilot_v2.py" "$root/test_cross_venue_pilot_v2.py" > research_runs/cross_venue_price_discovery_20260725/v2_pilot/INPUT_SHA256SUMS.txt
          PYTHONPATH="$root" pytest -q "$root/test_cross_venue_pilot_v2.py" 2>&1 | tee research_runs/cross_venue_price_discovery_20260725/v2_pilot/tests.log

      - name: Run four-day local-arrival fatal-edge pilot
        shell: bash
        run: |
          set +e
          root=research/cross_venue_price_discovery_20260725
          PYTHONPATH="$root" python "$root/cross_venue_pilot_v2.py" \
            --output research_runs/cross_venue_price_discovery_20260725/v2_pilot/results \
            --cache "$RUNNER_TEMP/xvenue-v2-cache" \
            2>&1 | tee research_runs/cross_venue_price_discovery_20260725/v2_pilot/pilot.log
          rc=${PIPESTATUS[0]}
          python - "$rc" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path('research_runs/cross_venue_price_discovery_20260725/v2_pilot')
          result=root/'results'/'PILOT_RESULT.json'
          payload={
              'experiment_rc':int(sys.argv[1]),
              'result_present':result.exists(),
              'causal_version':2,
              'v1_result_admissible':False,
              'full_development_opened':False,
              'selection_opened':False,
              'confirmation_opened':False,
              '2026_opened':False,
              'orders_submitted':False,
              'paper_live_started':False,
              'champion_eligible':False,
          }
          if result.exists():
              item=json.loads(result.read_text())
              payload['fatal_edge_pass_count']=int(item['fatal_edge_pass_count'])
              payload['best']=item['best']
          (root/'RUN_STATUS.json').write_text(json.dumps(payload,indent=2,sort_keys=True,default=str)+'\n')
          print(json.dumps(payload,sort_keys=True,default=str))
          PY
          exit 0

      - name: Record pilot checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research_runs/cross_venue_price_discovery_20260725/v2_pilot
          find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-venue-v2-pilot-${{ github.sha }}
          path: research_runs/cross_venue_price_discovery_20260725/v2_pilot
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
