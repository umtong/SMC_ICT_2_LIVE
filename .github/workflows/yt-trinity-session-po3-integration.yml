name: YT Trinity session PO3 route integration

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/apply_session_po3_integration.py
      - .github/workflows/yt-trinity-session-po3-integration.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-session-po3-integration
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Apply PO3 integration
        run: python research/yt_trinity_ml/apply_session_po3_integration.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile and test all integrated paths
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow requests pytest playwright
          python -m py_compile \
            research/yt_trinity_ml/run_session_po3_research.py \
            research/yt_trinity_ml/select_coarse_survivor.py \
            research/yt_trinity_ml/run_full_sequential_survivor.py \
            research/yt_trinity_ml/synthesize_corpus_system_contract.py \
            research/yt_trinity_ml/run_corpus_bound_system.py
          pytest -q research/yt_trinity_ml/tests
      - name: Commit integration and remove materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/yt_trinity_ml/select_coarse_survivor.py \
            research/yt_trinity_ml/run_full_sequential_survivor.py \
            research/yt_trinity_ml/synthesize_corpus_system_contract.py \
            research/yt_trinity_ml/run_corpus_bound_system.py \
            research/yt_trinity_ml/tests/test_new_alpha_runners.py \
            .github/workflows/yt-trinity-coarse-survivor-selection.yml \
            .github/workflows/yt-trinity-full-sequential-survivor.yml \
            .github/workflows/yt-trinity-corpus-system-contract.yml \
            .github/workflows/yt-trinity-corpus-bound-system.yml \
            .github/workflows/yt-trinity-execution-state.yml
          git rm -f \
            research/yt_trinity_ml/apply_session_po3_integration.py \
            .github/workflows/yt-trinity-session-po3-integration.yml
          git commit -m "Integrate ICT session PO3 route"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
