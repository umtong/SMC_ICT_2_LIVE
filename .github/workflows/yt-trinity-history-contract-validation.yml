name: YT Trinity explicit-history contract validation

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - .github/workflows/yt-trinity-history-contract-validation.yml
      - research/yt_trinity_ml/system/causal_action_history_model.py
      - research/yt_trinity_ml/run_causal_action_history.py
      - research/yt_trinity_ml/run_causal_action_history_full.py
      - research/yt_trinity_ml/tests/test_causal_action_history_model.py

permissions:
  contents: read

concurrency:
  group: yt-trinity-history-contract-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deterministic dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q \
            "numpy==2.2.6" "pandas==2.2.3" "scikit-learn==1.6.1" \
            "pyarrow==19.0.1" "pytest==8.3.5"
      - name: Compile explicit-history path
        run: |
          python -m py_compile \
            research/yt_trinity_ml/system/causal_action_history_model.py \
            research/yt_trinity_ml/run_causal_action_history.py \
            research/yt_trinity_ml/run_causal_action_history_full.py
      - name: Run explicit boundary and identity regressions
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          pytest -q \
            research/yt_trinity_ml/tests/test_causal_action_history_model.py
