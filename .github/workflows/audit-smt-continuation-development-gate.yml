name: Audit SMT continuation development gate

on:
  pull_request:
    branches:
      - agent/r11-smt-continuation-ml-meta-001
    paths:
      - ".github/workflows/audit-smt-continuation-development-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen import environment
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.1.3" "pandas==2.2.3" "scikit-learn==1.6.1" "joblib==1.4.2"
      - name: Reconstruct and audit actual transported source
        shell: bash
        run: |
          set -euo pipefail
          root=research/smt_continuation_ml_meta_20260726
          out=research_runs/smt_continuation_development_gate_audit
          mkdir -p "$out"
          python "$root/reconstruct.py"
          PYTHONPATH="$root" python - <<'PY' 2>&1 | tee "$out/audit.log"
          import ast
          import inspect
          import json
          from pathlib import Path
          import train

          fn = train.development_gate
          source = inspect.getsource(fn)
          signature = str(inspect.signature(fn))
          print("SIGNATURE", signature)
          print("SOURCE_BEGIN")
          print(source)
          print("SOURCE_END")

          tree = ast.parse(source)
          function = next(node for node in ast.walk(tree) if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)))
          arguments = {arg.arg for arg in function.args.args + function.args.kwonlyargs}
          locals_defined = set(arguments)
          loaded = set()
          for node in ast.walk(function):
              if isinstance(node, ast.Name):
                  if isinstance(node.ctx, (ast.Store, ast.Param)):
                      locals_defined.add(node.id)
                  elif isinstance(node.ctx, ast.Load):
                      loaded.add(node.id)
          module_globals = set(vars(train))
          builtins = set(__builtins__) if isinstance(__builtins__, dict) else set(dir(__builtins__))
          unresolved = sorted(loaded - locals_defined - module_globals - builtins)
          suspicious_path = "path" in loaded and "path" not in locals_defined and "path" not in module_globals
          result = {
              "schema_version": 1,
              "function": "development_gate",
              "signature": signature,
              "loaded_names": sorted(loaded),
              "locally_defined_names": sorted(locals_defined),
              "unresolved_names": unresolved,
              "suspicious_undefined_path": suspicious_path,
              "market_data_opened": False,
              "model_fit": False,
              "pnl_computed": False,
              "orders_submitted": False,
          }
          Path("research_runs/smt_continuation_development_gate_audit/audit.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(result, sort_keys=True))
          if suspicious_path:
              raise SystemExit("undefined local name path detected in development_gate")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smt-continuation-development-gate-audit-${{ github.sha }}
          path: research_runs/smt_continuation_development_gate_audit
          if-no-files-found: error
          retention-days: 14
