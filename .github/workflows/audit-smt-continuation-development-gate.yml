name: Audit SMT continuation development gate

on:
  pull_request:
    branches:
      - agent/r11-smt-continuation-ml-meta-001
    paths:
      - ".github/workflows/audit-smt-continuation-development-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen import and lint environment
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.1.3" "pandas==2.2.3" "scikit-learn==1.6.1" \
            "joblib==1.4.2" "pyflakes==3.2.0"
      - name: Reconstruct and audit actual transported source
        shell: bash
        run: |
          set -euo pipefail
          root=research/smt_continuation_ml_meta_20260726
          out=research_runs/smt_continuation_development_gate_audit
          mkdir -p "$out"
          python "$root/reconstruct.py"
          python -m py_compile "$root/train.py"
          python -m pyflakes "$root/train.py" 2>&1 | tee "$out/pyflakes.log"
          PYTHONPATH="$root" python - <<'PY' 2>&1 | tee "$out/audit.log"
          import inspect
          import json
          from pathlib import Path
          import train

          functions = []
          for name, value in sorted(vars(train).items()):
              if not inspect.isfunction(value) or value.__module__ != train.__name__:
                  continue
              if not any(token in name.lower() for token in ("gate", "develop", "evaluate", "metric", "result")):
                  continue
              source = inspect.getsource(value)
              functions.append({
                  "name": name,
                  "signature": str(inspect.signature(value)),
                  "source": source,
              })
              print(f"FUNCTION {name}{inspect.signature(value)}")
              print(source)

          full_source = Path(train.__file__).read_text()
          suspicious = []
          for token in (
              'path["authorization_diagnostics"]',
              "path['authorization_diagnostics']",
              'path["metrics"]',
              "path['metrics']",
          ):
              if token in full_source:
                  suspicious.append(token)

          result = {
              "schema_version": 2,
              "train_file": str(train.__file__),
              "candidate_functions": functions,
              "suspicious_path_subscripts": suspicious,
              "market_data_opened": False,
              "model_fit": False,
              "pnl_computed": False,
              "orders_submitted": False,
          }
          Path("research_runs/smt_continuation_development_gate_audit/audit.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps({
              "function_names": [item["name"] for item in functions],
              "suspicious_path_subscripts": suspicious,
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smt-continuation-development-gate-audit-${{ github.sha }}
          path: research_runs/smt_continuation_development_gate_audit
          if-no-files-found: error
          retention-days: 14
