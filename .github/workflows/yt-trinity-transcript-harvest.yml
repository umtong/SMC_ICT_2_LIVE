name: YT Trinity public transcript corpus

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - research/yt_trinity_ml/channels.json
      - research/yt_trinity_ml/harvest_transcripts.py
      - research/yt_trinity_ml/build_concept_index.py
      - research/yt_trinity_ml/tests/test_harvest_transcripts.py
      - research/yt_trinity_ml/WORK_CLAIM.md
      - .github/workflows/yt-trinity-transcript-harvest.yml

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: yt-trinity-transcript-corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install current YouTube transports and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade \
            yt-dlp \
            youtube-transcript-api \
            requests \
            scrapetube \
            pytest
          python -m pip freeze | sort > dependency-freeze.txt

      - name: Compile and run deterministic parser tests
        run: |
          python -m py_compile \
            research/yt_trinity_ml/harvest_transcripts.py \
            research/yt_trinity_ml/build_concept_index.py
          python research/yt_trinity_ml/harvest_transcripts.py --self-test
          python research/yt_trinity_ml/build_concept_index.py --self-test
          pytest -q research/yt_trinity_ml/tests/test_harvest_transcripts.py
          python -m json.tool research/yt_trinity_ml/channels.json >/dev/null

      - name: Harvest every public uploads-playlist item and available caption
        run: |
          mkdir -p artifact/yt-trinity-corpus
          python research/yt_trinity_ml/harvest_transcripts.py \
            --config research/yt_trinity_ml/channels.json \
            --output artifact/yt-trinity-corpus \
            --retries 3 \
            --sleep-seconds 0.35 \
            | tee artifact/HARVEST_STDOUT.json

      - name: Build timestamp-addressable concept evidence
        if: always()
        run: |
          if [[ -f artifact/yt-trinity-corpus/videos.jsonl ]]; then
            python research/yt_trinity_ml/build_concept_index.py \
              --corpus artifact/yt-trinity-corpus \
              | tee artifact/CONCEPT_INDEX_STDOUT.json
          fi
          cp dependency-freeze.txt artifact/yt-trinity-corpus/DEPENDENCIES.txt || true
          if [[ -d artifact/yt-trinity-corpus ]]; then
            (
              cd artifact/yt-trinity-corpus
              find . -type f ! -name SHA256SUMS -print0 \
                | LC_ALL=C sort -z \
                | xargs -0 sha256sum > SHA256SUMS
            )
          fi

      - name: Publish summary
        if: always()
        run: |
          if [[ -f artifact/yt-trinity-corpus/manifest.json ]]; then
            {
              echo '## YT Trinity corpus manifest'
              echo '```json'
              cat artifact/yt-trinity-corpus/manifest.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable corpus for Drive ingestion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-corpus-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          compression-level: 6
          retention-days: 90

      - name: Enforce complete inventory and resolved caption attempts
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifact/yt-trinity-corpus/manifest.json')
          if not path.exists():
              raise SystemExit('manifest missing')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          if not manifest.get('inventory_complete'):
              raise SystemExit('public uploads-playlist inventory is incomplete')
          if not manifest.get('caption_attempt_complete'):
              raise SystemExit('one or more listed videos has an unresolved caption fetch')
          if manifest.get('decision') != 'PASS_COMPLETE':
              raise SystemExit(f"unexpected decision: {manifest.get('decision')}")
          print('corpus gate: PASS_COMPLETE')
          PY
