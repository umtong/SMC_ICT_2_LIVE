name: YT Trinity frozen corpus-bound full system

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/CORPUS_BOUND_SYSTEM_CONTRACT.json
      - research/yt_trinity_ml/run_corpus_bound_system.py
      - .github/workflows/yt-trinity-corpus-bound-system.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: yt-trinity-corpus-bound-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('research/yt_trinity_ml/CORPUS_BOUND_SYSTEM_CONTRACT.json')
          authorized = False
          reason = 'contract missing'
          if path.exists():
              payload = json.loads(path.read_text(encoding='utf-8'))
              authorized = (
                  payload.get('status') == 'FROZEN'
                  and payload.get('decision') == 'CORPUS_BOUND_PRE2024_SELECTION_READY'
                  and bool(payload.get('eligible_family_keys'))
                  and payload.get('corpus_binding', {}).get('manifest_decision') in {
                      'PASS_COMPLETE', 'PASS_NATIVE_CAPTION_CLASSIFICATION'
                  }
              )
              reason = 'authorized' if authorized else str(payload.get('decision') or 'contract not frozen')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"authorized={'true' if authorized else 'false'}\n")
              handle.write(f"reason={reason}\n")
          print(json.dumps({'authorized': authorized, 'reason': reason}, indent=2))
          PY

  run-system:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install causal research stack
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow requests pytest playwright
      - name: Compile and run all causal invariants
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python -m py_compile \
            research/yt_trinity_ml/run_cisd_bpr_ifvg_research.py \
            research/yt_trinity_ml/run_compression_bpr_continuation.py \
            research/yt_trinity_ml/run_smt_cisd_research.py \
            research/yt_trinity_ml/run_ifvg_failure_research.py \
            research/yt_trinity_ml/run_htf_ote_continuation.py \
            research/yt_trinity_ml/run_full_sequential_survivor.py \
            research/yt_trinity_ml/run_corpus_bound_system.py \
            research/yt_trinity_ml/system/*.py
          pytest -q research/yt_trinity_ml/tests
      - uses: actions/cache@v4
        with:
          path: artifact/bybit-cache
          key: yt-trinity-corpus-bound-bybit-linear-1m-20220101-20260701-v1
          restore-keys: |
            yt-trinity-bybit-linear-1m-20220101-20260701-v1
            yt-trinity-bybit-linear-1m-
      - name: Select pre-2024, freeze, and replay full official account
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -o pipefail
          mkdir -p artifact/bybit-cache artifact/corpus-bound-run
          python research/yt_trinity_ml/run_corpus_bound_system.py \
            --contract research/yt_trinity_ml/CORPUS_BOUND_SYSTEM_CONTRACT.json \
            --cache-dir artifact/bybit-cache \
            --output artifact/corpus-bound-run \
            2>&1 | tee artifact/corpus-bound-run/STDOUT.log
      - name: Hash immutable full-period evidence
        if: always()
        run: |
          if [[ -d artifact/corpus-bound-run ]]; then
            (
              cd artifact/corpus-bound-run
              find . -type f ! -name SHA256SUMS -print0 \
                | LC_ALL=C sort -z \
                | xargs -0 sha256sum > SHA256SUMS
            )
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-corpus-bound-full-${{ github.sha }}
          path: artifact/corpus-bound-run
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
      - name: Persist compact corpus-bound result pointer
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          summary_path = Path('artifact/corpus-bound-run/RUN_SUMMARY.json')
          frozen_path = Path('artifact/corpus-bound-run/FROZEN_CONFIG.json')
          summary = json.loads(summary_path.read_text(encoding='utf-8')) if summary_path.exists() else None
          pointer = {
              'schema_version': 1,
              'workflow': 'YT Trinity frozen corpus-bound full system',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'source_sha': os.environ['GITHUB_SHA'],
              'artifact_name': f"yt-trinity-corpus-bound-full-{os.environ['GITHUB_SHA']}",
              'summary_sha256': hashlib.sha256(summary_path.read_bytes()).hexdigest() if summary_path.exists() else None,
              'frozen_config_sha256': hashlib.sha256(frozen_path.read_bytes()).hexdigest() if frozen_path.exists() else None,
              'decision': summary.get('decision') if isinstance(summary, dict) else 'EXECUTION_FAILED_NO_SUMMARY',
              'strategy_id': summary.get('strategy_id') if isinstance(summary, dict) else None,
              'corpus_binding': summary.get('corpus_binding') if isinstance(summary, dict) else None,
              'eligible_family_keys': summary.get('eligible_family_keys') if isinstance(summary, dict) else None,
              'selected_basic': summary.get('selected_basic') if isinstance(summary, dict) else None,
              'selected_risk': summary.get('selected_risk') if isinstance(summary, dict) else None,
              'realistic_metrics': summary.get('realistic_metrics') if isinstance(summary, dict) else None,
              'zero_friction_metrics_same_signals': summary.get('zero_friction_metrics_same_signals') if isinstance(summary, dict) else None,
              'stressed_metrics_same_signals': summary.get('stressed_metrics_same_signals') if isinstance(summary, dict) else None,
              'half_years': summary.get('half_years') if isinstance(summary, dict) else None,
              'evidence': summary.get('evidence') if isinstance(summary, dict) else None,
              'rankable': False,
          }
          Path('research/yt_trinity_ml/CORPUS_BOUND_RUN_POINTER.json').write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/CORPUS_BOUND_RUN_POINTER.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record corpus-bound full YT Trinity system ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

  skip:
    needs: authorize
    if: needs.authorize.outputs.authorized != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Corpus-bound full system not authorized: ${{ needs.authorize.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
