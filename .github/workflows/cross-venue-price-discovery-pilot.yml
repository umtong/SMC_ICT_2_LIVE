name: Cross-venue price-discovery fatal-edge pilot

on:
  push:
    branches:
      - agent/r5-cross-venue-price-discovery-001
    paths:
      - "research/cross_venue_price_discovery_20260725/cross_venue_pilot.py"
      - "research/cross_venue_price_discovery_20260725/preregistration.json"
      - ".github/workflows/cross-venue-price-discovery-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r5-cross-venue-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-cross-venue-price-discovery-001
          fetch-depth: 1

      - name: Install fixed research environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "requests==2.32.4"
          mkdir -p research_runs/cross_venue_price_discovery_20260725/pilot
          python - <<'PY'
          import json, numpy, pandas, platform, requests, sys
          from pathlib import Path
          Path('research_runs/cross_venue_price_discovery_20260725/pilot/environment.json').write_text(
              json.dumps({
                  'python': sys.version,
                  'platform': platform.platform(),
                  'numpy': numpy.__version__,
                  'pandas': pandas.__version__,
                  'requests': requests.__version__,
                  'credentials_used': False,
                  'orders_submitted': False,
                  'paper_live_started': False,
                  'full_development_opened': False,
                  'selection_opened': False,
                  'confirmation_opened': False,
                  '2026_opened': False,
              }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Verify preregistration and causal self-test
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_venue_price_discovery_20260725
          python -m py_compile "$root/source_probe.py" "$root/cross_venue_pilot.py"
          sha256sum "$root/preregistration.json" "$root/source_probe.py" "$root/cross_venue_pilot.py" > research_runs/cross_venue_price_discovery_20260725/pilot/INPUT_SHA256SUMS.txt
          python "$root/cross_venue_pilot.py" \
            --self-test \
            --output research_runs/cross_venue_price_discovery_20260725/pilot \
            --cache "$RUNNER_TEMP/xvenue-cache" \
            2>&1 | tee research_runs/cross_venue_price_discovery_20260725/pilot/self_test.log

      - name: Run systematic four-day fatal-edge pilot
        shell: bash
        run: |
          set +e
          root=research/cross_venue_price_discovery_20260725
          python "$root/cross_venue_pilot.py" \
            --output research_runs/cross_venue_price_discovery_20260725/pilot/results \
            --cache "$RUNNER_TEMP/xvenue-cache" \
            2>&1 | tee research_runs/cross_venue_price_discovery_20260725/pilot/pilot.log
          rc=${PIPESTATUS[0]}
          python - "$rc" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path('research_runs/cross_venue_price_discovery_20260725/pilot')
          result=root/'results'/'PILOT_RESULT.json'
          payload={
              'experiment_rc': int(sys.argv[1]),
              'result_present': result.exists(),
              'full_development_opened': False,
              'selection_opened': False,
              'confirmation_opened': False,
              '2026_opened': False,
              'orders_submitted': False,
              'paper_live_started': False,
              'champion_eligible': False,
          }
          if result.exists():
              item=json.loads(result.read_text())
              payload['fatal_edge_pass_count']=int(item['fatal_edge_pass_count'])
              payload['best']=item['best']
          (root/'RUN_STATUS.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,sort_keys=True,default=str))
          PY
          exit 0

      - name: Record immutable output checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research_runs/cross_venue_price_discovery_20260725/pilot
          find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-venue-price-discovery-pilot-${{ github.sha }}
          path: research_runs/cross_venue_price_discovery_20260725/pilot
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
