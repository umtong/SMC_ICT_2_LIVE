name: ML cross-venue fair-value maker screen

on:
  push:
    branches:
      - agent/r13-ml-xvenue-maker-fairvalue-001
    paths:
      - "research/ml_xvenue_maker_fairvalue_20260726/**"
      - ".github/workflows/ml-xvenue-maker-fairvalue-r13.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/ml_xvenue_maker_fairvalue_20260726/**"
      - ".github/workflows/ml-xvenue-maker-fairvalue-r13.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ml-xvenue-maker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fatal-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen scientific environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scikit-learn==1.6.1" \
            "pytest==8.3.4"

      - name: Compile, test, and validate frozen source
        run: |
          set -euo pipefail
          root=research/ml_xvenue_maker_fairvalue_20260726
          python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$root/preregistration.json" >/dev/null
          python -m json.tool "$root/bundle_manifest.json" >/dev/null
          python "$root/reconstruct.py"
          python -m py_compile "$root/reconstruct.py" "$root/run.py" "$root/test_run.py" "$root/combine.py" "$root/audit.py"
          PYTHONPATH="$root" pytest -q "$root/test_run.py"
          PYTHONPATH="$root" python "$root/run.py" self-test
          python scripts/validate_project.py

      - name: Download only frozen pre-2024 public sources
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/xvenue_maker_data"
          mkdir -p "$data"
          for date in 2022-07-01 2023-03-01 2023-07-01; do
            y=${date:0:4}; m=${date:5:2}; d=${date:8:2}
            mkdir -p "$data/$date"
            for spec in \
              "binance-futures quotes binance-futures_BTCUSDT_quotes.csv.gz" \
              "binance-futures trades binance-futures_BTCUSDT_trades.csv.gz" \
              "bybit quotes bybit_BTCUSDT_quotes.csv.gz" \
              "bybit trades bybit_BTCUSDT_trades.csv.gz"; do
              read -r exchange dtype filename <<<"$spec"
              curl -fL --retry 8 --retry-delay 4 --retry-all-errors \
                "https://datasets.tardis.dev/v1/$exchange/$dtype/$y/$m/$d/BTCUSDT.csv.gz" \
                -o "$data/$date/$filename"
              gzip -t "$data/$date/$filename"
            done
          done
          test "$(find "$data" -type f -name '*.csv.gz' | wc -l)" = "12"
          test -z "$(find "$data" -type f | grep -E '/2024-|/2025-|/2026-' || true)"

      - name: Run frozen 100ms placement path
        run: |
          set -euo pipefail
          root=research/ml_xvenue_maker_fairvalue_20260726
          out=research_runs/ml_xvenue_maker_fairvalue_20260726/100ms
          mkdir -p "$out"
          PYTHONPATH="$root" python "$root/run.py" run \
            --data-root "$RUNNER_TEMP/xvenue_maker_data" \
            --output "$out" \
            --train-date 2022-07-01 \
            --calibration-date 2023-03-01 \
            --confirmation-date 2023-07-01 \
            --latency-ms 100 \
            2>&1 | tee "$out/RUN.log"

      - name: Run unchanged 300ms placement stress
        run: |
          set -euo pipefail
          root=research/ml_xvenue_maker_fairvalue_20260726
          out=research_runs/ml_xvenue_maker_fairvalue_20260726/300ms
          mkdir -p "$out"
          PYTHONPATH="$root" python "$root/run.py" run \
            --data-root "$RUNNER_TEMP/xvenue_maker_data" \
            --output "$out" \
            --train-date 2022-07-01 \
            --calibration-date 2023-03-01 \
            --confirmation-date 2023-07-01 \
            --latency-ms 300 \
            2>&1 | tee "$out/RUN.log"

      - name: Combine latency decisions and independently audit
        run: |
          set -euo pipefail
          root=research/ml_xvenue_maker_fairvalue_20260726
          out=research_runs/ml_xvenue_maker_fairvalue_20260726
          PYTHONPATH="$root" python "$root/combine.py" \
            --latency100 "$out/100ms" \
            --latency300 "$out/300ms" \
            --output "$out/COMBINED_RESULT.json" \
            | tee "$out/COMBINE.log"
          PYTHONPATH="$root" python "$root/audit.py" \
            --latency100 "$out/100ms" \
            --latency300 "$out/300ms" \
            --combined "$out/COMBINED_RESULT.json" \
            --output "$out/AUDIT.json" \
            | tee "$out/AUDIT.log"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_runs/ml_xvenue_maker_fairvalue_20260726')
          result=json.loads((root/'COMBINED_RESULT.json').read_text())
          audit=json.loads((root/'AUDIT.json').read_text())
          assert result['official_2024_2026_opened'] is False
          assert result['orders_submitted'] is False
          assert result['ranking_role']=='NONE_NOT_RANK_ELIGIBLE_PRE2024_FATAL_SCREEN'
          assert audit['status']=='PASS'
          print(json.dumps({
              'status':result['status'],
              'economic_status':result['economic_status'],
              'both_latency_gates_pass':result['both_latency_gates_pass'],
              'audit':audit['status'],
          },sort_keys=True))
          PY
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/ALL_SHA256SUMS.txt"
          sha256sum \
            "$root/WORK_CLAIM.json" \
            "$root/preregistration.json" \
            "$root/README.md" \
            "$root/SOURCES.md" \
            "$root/bundle_manifest.json" \
            "$root/reconstruct.py" \
            "$root/run.py.gz.b64.part00" \
            "$root/run.py.gz.b64.part01" \
            "$root/run.py.gz.b64.part02" \
            "$root/run.py.gz.b64.part03" \
            "$root/run.py" \
            "$root/test_run.py" \
            "$root/combine.py" \
            "$root/audit.py" \
            .github/workflows/ml-xvenue-maker-fairvalue-r13.yml \
            > "$out/INPUT_SHA256SUMS.txt"
          python scripts/validate_project.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-xvenue-maker-fairvalue-${{ github.sha }}
          path: research_runs/ml_xvenue_maker_fairvalue_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
