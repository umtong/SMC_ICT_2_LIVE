name: Dense liquidity-edge microflow evaluate v5

on:
  push:
    branches:
      - agent/r37-dense-liquidity-edge-microflow-001
    paths:
      - 'research/dense_liquidity_edge_microflow/RUN_EVALUATE_V5*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: dense-liquidity-edge-microflow-evaluate-v5
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r37-dense-liquidity-edge-microflow-001
          fetch-depth: 0
      - name: Wait for exact V4 source authority
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            git fetch origin agent/r37-dense-liquidity-edge-microflow-001
            git reset --hard origin/agent/r37-dense-liquidity-edge-microflow-001
            if test -s research/dense_liquidity_edge_microflow/generated_v4/dense_edge_microflow_2023_features.csv.gz; then
              exit 0
            fi
            echo "waiting for source authority ($i/180)"
            sleep 60
          done
          echo 'source authority did not arrive' >&2
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evaluator dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pyarrow==18.1.0 scikit-learn==1.5.2 gdown==5.2.0
      - name: Download and hash-verify canonical Bybit 2022-2023 shards
        run: |
          set -euo pipefail
          mkdir -p downloads canonical/BTCUSDT/2022 canonical/BTCUSDT/2023 canonical/ETHUSDT/2022 canonical/ETHUSDT/2023
          python -m gdown --id 1lEZQCE-T4OXcGVaLN9HFAekCnXaUmeQ6 -O downloads/BTCUSDT_2022.zip
          python -m gdown --id 1HIJ4ARuF99IujRC6fzNiXo2d4tItkVMt -O downloads/BTCUSDT_2023.zip
          python -m gdown --id 1bP0MizmZhSwhEOkf6YodfuCxbMZZYYu7 -O downloads/ETHUSDT_2022.zip
          python -m gdown --id 1F8lghO2sG_b2PeHkvr3UQE5nGdCUGoIR -O downloads/ETHUSDT_2023.zip
          echo '273995bf7efd905c147237ff14978b92ef65f4703b290986ba6fab5fe5e3e42c  downloads/BTCUSDT_2022.zip' | sha256sum -c -
          echo 'ee145ba1dd51fe24357940a4a6a9ffe99f52a45f983c7e191ff38dece6ec3a46  downloads/BTCUSDT_2023.zip' | sha256sum -c -
          echo '681cb5c21826f05a12e40b25818c40d1be46cf4b394676998d8a6856180271da  downloads/ETHUSDT_2022.zip' | sha256sum -c -
          echo '87dbd84278f76108f3c841e2312429915aa3a4877e931abf77650ae5d3506f322  downloads/ETHUSDT_2023.zip' | sha256sum -c -
          unzip -q downloads/BTCUSDT_2022.zip -d canonical/BTCUSDT/2022
          unzip -q downloads/BTCUSDT_2023.zip -d canonical/BTCUSDT/2023
          unzip -q downloads/ETHUSDT_2022.zip -d canonical/ETHUSDT/2022
          unzip -q downloads/ETHUSDT_2023.zip -d canonical/ETHUSDT/2023
      - name: Run deterministic pre-2024 authority twice
        run: |
          set -euo pipefail
          FEATURES=research/dense_liquidity_edge_microflow/generated_v4/dense_edge_microflow_2023_features.csv.gz
          rm -rf out1 out2
          python research/dense_liquidity_edge_microflow/evaluate_dense_edge_v5.py --features "$FEATURES" --canonical canonical --out out1
          python research/dense_liquidity_edge_microflow/evaluate_dense_edge_v5.py --features "$FEATURES" --canonical canonical --out out2
          cmp out1/RESULT.json out2/RESULT.json
          cmp out1/REPORT.md out2/REPORT.md
          cmp out1/actions.csv.gz out2/actions.csv.gz
          cmp out1/selected_candidates.csv.gz out2/selected_candidates.csv.gz
          cmp out1/ledger_24bp.csv.gz out2/ledger_24bp.csv.gz
      - name: Publish result and status marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf research/dense_liquidity_edge_microflow/result_v5
          cp -a out1 research/dense_liquidity_edge_microflow/result_v5
          STATUS=$(python - <<'PY'
          import json
          print(json.load(open('out1/RESULT.json'))['status'])
          PY
          )
          rm -f research/dense_liquidity_edge_microflow/result_v5/STATUS_*
          printf '%s\n' "$STATUS" > "research/dense_liquidity_edge_microflow/result_v5/STATUS_${STATUS}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/dense_liquidity_edge_microflow/result_v5
          git commit -m "Record dense microflow pre-2024 decision: $STATUS"
          git push origin HEAD:agent/r37-dense-liquidity-edge-microflow-001
          {
            echo '## V5 decision-ready result'
            echo
            cat out1/REPORT.md
            echo
            echo 'The full action ledger, selected candidates, 24-bp account ledger, result JSON and SHA manifest are committed under `research/dense_liquidity_edge_microflow/result_v5/`. No credentials or orders were used.'
          } > issue_comment.md
          gh issue comment 581 --repo umtong/SMC_ICT_2_LIVE --body-file issue_comment.md
          if test "$STATUS" != 'PRE2024_GATE_PASS_OFFICIAL_AUTHORIZED'; then
            gh issue close 581 --repo umtong/SMC_ICT_2_LIVE --reason completed
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dense-liquidity-edge-microflow-v5-result
          path: out1/*
          if-no-files-found: error
          retention-days: 90
