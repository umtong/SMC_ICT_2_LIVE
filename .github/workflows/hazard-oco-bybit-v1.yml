name: Bybit movement-hazard OCO V1

on:
  pull_request:
    branches: [main]
    paths:
      - "research/hazard_oco_20260726/**"
      - ".github/workflows/hazard-oco-bybit-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hazard-oco-bybit-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scipy==1.14.1" \
            "scikit-learn==1.5.2" \
            "pytest==8.3.4"

      - name: Compile and run adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/hazard_oco_20260726
          python "$root/reconstruct.py"
          code="$root/reconstructed"
          python -m py_compile "$code/run.py" "$code/test_run.py"
          PYTHONPATH="$code" pytest -q "$code/test_run.py"
          PYTHONPATH="$code" python "$code/run.py" --self-test
          python scripts/validate_project.py

      - name: Run frozen Bybit fit and development screen
        shell: bash
        run: |
          set -euo pipefail
          root=research/hazard_oco_20260726
          code="$root/reconstructed"
          out=research_runs/hazard_oco_20260726/bybit_v1
          mkdir -p "$out"
          PYTHONPATH="$code" python "$code/run.py" \
            --output "$out" \
            --cache "$RUNNER_TEMP/hazard-oco-bybit-cache" \
            2>&1 | tee "$out/run.log"

      - name: Record immutable checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/hazard_oco_20260726
          out=research_runs/hazard_oco_20260726/bybit_v1
          mkdir -p "$out"
          sha256sum \
            "$root/preregistration.json" \
            "$root/AMENDMENT_001_BEFORE_OUTCOME.json" \
            "$root/AMENDMENT_002_BYBIT_EXECUTION_AND_STATE_EXIT.json" \
            "$root/SOURCE_REUSE.json" \
            "$root/README.md" \
            "$root/reconstruct.py" \
            "$root/source_manifest.json" \
            "$root/run_py.gz.b64.part00" \
            "$root/run_py.gz.b64.part01" \
            "$root/run_py.gz.b64.part02" \
            "$root/test_run_py.gz.b64.part00" \
            "$root/reconstructed/run.py" \
            "$root/reconstructed/test_run.py" \
            > "$out/INPUT_SHA256SUMS.txt"
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hazard-oco-bybit-v1-${{ github.sha }}
          path: research_runs/hazard_oco_20260726/bybit_v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
