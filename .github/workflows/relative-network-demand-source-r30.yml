name: Extract pinned relative network-demand source

on:
  push:
    branches: [agent/r30-relative-network-demand-core-001]
    paths:
      - '.github/workflows/relative-network-demand-source-r30.yml'
      - 'research/relative_network_demand/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/relative-network-demand-source-r30.yml'
      - 'research/relative_network_demand/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relative-network-demand-source-r30-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r30-relative-network-demand-core-001
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and extract pre-2024 source only
        run: |
          set -euo pipefail
          out=research_runs/relative_network_demand_source_r30
          python research/relative_network_demand/source_extract.py --output-dir "$out"
          python -m json.tool "$out/SOURCE_MANIFEST.json" >/dev/null
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: relative-network-demand-source-r30-${{ github.run_id }}
          path: research_runs/relative_network_demand_source_r30
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
