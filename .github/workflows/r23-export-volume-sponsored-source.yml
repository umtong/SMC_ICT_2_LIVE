name: R23 export volume-sponsored source

on:
  push:
    branches: [agent/r23-smc-action-value-001]
    paths:
      - .github/workflows/r23-export-volume-sponsored-source.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/r23-export-volume-sponsored-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch immutable PR 472 source carrier
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 1a76e354476af06b822e81318fb8d9a2242fbf7d
          mkdir -p payload/research/volume_sponsored_channel
          for f in SOURCE_MANIFEST.json SOURCE_BUNDLE.tar.gz.b64 materialize.py; do
            git show "1a76e354476af06b822e81318fb8d9a2242fbf7d:research/volume_sponsored_channel/$f" > "payload/research/volume_sponsored_channel/$f"
          done

      - name: Independently decode and verify every source file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, tarfile
          from pathlib import Path

          root = Path('payload/research/volume_sponsored_channel')
          manifest = json.loads((root / 'SOURCE_MANIFEST.json').read_text())
          raw = base64.b64decode((root / 'SOURCE_BUNDLE.tar.gz.b64').read_text().strip())
          diagnostics = {
              'pinned_commit': '1a76e354476af06b822e81318fb8d9a2242fbf7d',
              'declared_archive_bytes': manifest['archive_bytes'],
              'actual_archive_bytes': len(raw),
              'declared_archive_sha256': manifest['archive_sha256'],
              'actual_archive_sha256': hashlib.sha256(raw).hexdigest(),
          }
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if root.resolve() not in target.parents:
                      raise RuntimeError(f'unsafe archive path: {member.name}')
              archive.extractall(root, filter='data')
          rows = []
          all_files_match = True
          for item in manifest['files']:
              p = root / item['path']
              row = {
                  'path': item['path'],
                  'declared_bytes': item['bytes'],
                  'actual_bytes': p.stat().st_size,
                  'declared_sha256': item['sha256'],
                  'actual_sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
              }
              row['match'] = (
                  row['declared_bytes'] == row['actual_bytes']
                  and row['declared_sha256'] == row['actual_sha256']
              )
              all_files_match &= row['match']
              rows.append(row)
          diagnostics['all_individual_files_match'] = all_files_match
          diagnostics['files'] = rows
          (root / 'EXPORTED_SOURCE_INDEX.json').write_text(json.dumps(diagnostics, indent=2) + '\n')
          if not all_files_match:
              raise SystemExit('individual source-file verification failed')
          print(json.dumps(diagnostics, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r23-volume-sponsored-materialized-source
          path: payload/research/volume_sponsored_channel
          if-no-files-found: error
          retention-days: 30
