name: COIN-M collateral stress research

on:
  push:
    branches:
      - agent/r8-coinm-collateral-stress-001-r3
    paths:
      - 'research/coinm_collateral_stress/**'
      - '.github/workflows/coinm-collateral-stress.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coinm-collateral-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixed runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            pandas==2.2.3 numpy==2.1.3 requests==2.32.4 pytest==8.3.4

      - name: Reconstruct and verify immutable source bundle
        shell: bash
        run: |
          set -euo pipefail
          root=research/coinm_collateral_stress
          b64="$root/source_bundle.tar.gz.b64"
          tarball="$RUNNER_TEMP/coinm_source_bundle.tar.gz"
          test "$(sha256sum "$b64" | awk '{print $1}')" = "58602f476bce121ac5ce9998dac0598346b475d981bc6e844eaca012e84c5d43"
          base64 -d "$b64" > "$tarball"
          test "$(sha256sum "$tarball" | awk '{print $1}')" = "38eb8efab74429d887d2a5e6d3470890ffaa3fb6a4adbbd00fba8c4824b7552d"
          tar -xzf "$tarball" -C .
          test "$(sha256sum "$root/coinm_collateral_stress.py" | awk '{print $1}')" = "66145dfbcd44c6dc994acee36a2668d203880e787f60e411914662567798f46d"
          test "$(sha256sum "$root/test_coinm_collateral_stress.py" | awk '{print $1}')" = "9bd27bea8de0bd021d44a0fc5963293da52f26a2f2579a920cb054621f29bd8f"

      - name: Compile and causal tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/coinm_collateral_stress
          python -m py_compile "$root/coinm_collateral_stress.py"
          PYTHONPATH="$root" pytest -q "$root/test_coinm_collateral_stress.py"

      - name: Run stage-sealed checksum-verified official research
        shell: bash
        run: |
          set -euo pipefail
          root=research/coinm_collateral_stress
          mkdir -p "$root/results"
          python "$root/coinm_collateral_stress.py" \
            --download \
            --data-root "$RUNNER_TEMP/coinm_collateral" \
            --output "$root/results" \
            2>&1 | tee "$root/results/run.log"

      - name: Build compact development decision extract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/coinm_collateral_stress/results
          if [[ -f "$root/development_results.json" ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/coinm_collateral_stress/results')
          rows=json.loads((root/'development_results.json').read_text())
          def score(r):
              a=r['development_a']['base']; b=r['development_b']['base']
              return (
                  min(a.get('geo_daily') or -1, b.get('geo_daily') or -1),
                  (a.get('total_return') or -1)+(b.get('total_return') or -1),
                  min(a.get('n') or 0,b.get('n') or 0),
              )
          ordered=sorted(rows,key=score,reverse=True)
          payload={
              'schema_version':1,
              'policy_count':len(rows),
              'development_gate_count':sum(bool(x.get('development_gate')) for x in rows),
              'top10':ordered[:10],
              'selection_values_included':False,
              'validation_values_included':False,
          }
          (root/'development_top10.json').write_text(json.dumps(payload,indent=2,sort_keys=True,default=str)+'\n')
          PY
          fi

      - name: Print decision summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/coinm_collateral_stress/results
          if [[ -f "$root/summary.json" ]]; then
            echo '--- summary.json ---'
            cat "$root/summary.json"
          fi
          if [[ -f "$root/development_top10.json" ]]; then
            echo '--- development_top10.json ---'
            cat "$root/development_top10.json"
          fi

      - name: Inventory results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/coinm_collateral_stress
          mkdir -p "$root/results"
          find "$root" -maxdepth 3 -type f ! -path '*/.pytest_cache/*' -print0 \
            | sort -z | xargs -0 sha256sum \
            > "$root/results/FILE_SHA256SUMS.txt"
          cat "$root/results/FILE_SHA256SUMS.txt"

      - name: Commit compact decision result to research branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/coinm_collateral_stress/results
          files=()
          [[ -f "$root/summary.json" ]] && files+=("$root/summary.json")
          [[ -f "$root/development_top10.json" ]] && files+=("$root/development_top10.json")
          [[ -f "$root/source_manifest_development.json" ]] && files+=("$root/source_manifest_development.json")
          [[ -f "$root/FILE_SHA256SUMS.txt" ]] && files+=("$root/FILE_SHA256SUMS.txt")
          if [[ ${#files[@]} -eq 0 ]]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[skip ci] Record COIN-M collateral-stress decision result'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coinm-collateral-stress-${{ github.run_id }}
          path: |
            research/coinm_collateral_stress/results
            research/coinm_collateral_stress/preregistration.json
            research/coinm_collateral_stress/amendment_001_preoutcome_execution_and_stage.json
            research/coinm_collateral_stress/README.md
            research/coinm_collateral_stress/SOURCE_BUNDLE_MANIFEST.json
            research/coinm_collateral_stress/coinm_collateral_stress.py
            research/coinm_collateral_stress/test_coinm_collateral_stress.py
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
