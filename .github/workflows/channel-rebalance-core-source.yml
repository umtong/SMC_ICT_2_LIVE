name: Channel first-rebalance Core source recovery

on:
  push:
    branches: [agent/ml-channel-rebalance-core-001]
    paths:
      - '.github/workflows/channel-rebalance-core-source.yml'
      - 'research/channel_rebalance_core/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/channel-rebalance-core-source.yml'
      - 'research/channel_rebalance_core/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed scientific dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.3 pandas==2.3.3 pyarrow==21.0.0 scikit-learn==1.7.1
      - name: Recover exact upstream all-breakout source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin agent/r24-bybit-channel-allbreakout-core-001
          mkdir -p /tmp/upstream artifact/upstream artifact/materialized
          git archive FETCH_HEAD research/bybit_channel_allbreakout_core | tar -x -C /tmp/upstream
          root=/tmp/upstream/research/bybit_channel_allbreakout_core
          python "$root/materialize.py" --out "$GITHUB_WORKSPACE/artifact/materialized"
          cp "$root"/{CONTRACT.json,RESULT.json,REPORT.md,SOURCE_BUNDLE_MANIFEST.json} artifact/upstream/
          cp research/channel_rebalance_core/CONTRACT.json artifact/
          python -m py_compile artifact/materialized/*.py
          (
            cd artifact/materialized
            python -m unittest -v test_semantics.py
          )
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: channel-rebalance-core-source-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
