name: Minimal ML PO3 causal state router integrated

on:
  push:
    branches:
      - agent/r11-ml-po3-state-router-integrated-001
    paths:
      - "research/ml_po3_state_router_20260726/**"
      - ".github/workflows/ml-po3-state-integrated-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/ml_po3_state_router_20260726/**"
      - ".github/workflows/ml-po3-state-integrated-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ml-po3-state-integrated-r11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  TZ: UTC
  CACHE: /tmp/ml-po3-state-r11
  OUT: ${{ github.workspace }}/research_runs/ml_po3_state_router_20260726
  RUNNER: research/ml_po3_state_router_20260726/reconstructed/run.py

jobs:
  causal-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen environment
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 scikit-learn==1.5.2
      - name: Validate project and causal engine
        run: |
          python scripts/validate_project.py
          python research/ml_po3_state_router_20260726/reconstruct_integrated.py
          python -m py_compile "$RUNNER"
          python "$RUNNER" self-test
          python -m json.tool research/ml_po3_state_router_20260726/WORK_CLAIM.json >/dev/null
          python -m json.tool research/ml_po3_state_router_20260726/preregistration.json >/dev/null
          python -m json.tool research/ml_po3_state_router_20260726/source_transport_integrated.json >/dev/null
          test "$(sha256sum "$RUNNER" | cut -d' ' -f1)" = "26c9d2f349f9af0d52cd8056cd1fc0c694b357f01f5e19af44ff6daad37e027c"
      - uses: actions/cache@v4
        with:
          path: /tmp/ml-po3-state-r11
          key: ml-po3-state-integrated-r11-${{ runner.os }}-${{ hashFiles('research/ml_po3_state_router_20260726/preregistration.json', 'research/ml_po3_state_router_20260726/source_transport_integrated.json') }}
          restore-keys: |
            ml-po3-state-integrated-r11-${{ runner.os }}-
      - name: Run frozen staged screen
        run: |
          mkdir -p "$OUT"
          python "$RUNNER" run --root "$CACHE" --output "$OUT" | tee "$OUT/run.log"
      - name: Assert seals and research authority
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["OUT"])
          summary_path = root / "summary.json"
          if not summary_path.exists():
              (root / "wrapper_status.json").write_text(json.dumps({
                  "hard_validity": "INCOMPLETE",
                  "orders_submitted": False,
                  "2024_opened": False,
                  "reason": "missing summary.json"
              }, indent=2, sort_keys=True) + "\n")
              raise SystemExit("missing summary.json")
          summary = json.loads(summary_path.read_text())
          assert summary["hard_validity"] == "PASS"
          assert summary["engine_version"] == "SHARED_3STATE_GAUSSIAN_MARKOV_PO3_V1"
          assert summary["model_count"] == 1
          assert summary["state_count"] == 3
          assert summary["feature_count"] == 5
          assert summary["strategy_route_count"] == 1
          assert summary["threshold_candidates"] == [0.45, 0.6, 0.75]
          assert summary["2024_opened"] is False
          assert summary["2025_opened"] is False
          assert summary["2026_opened"] is False
          assert summary["orders_submitted"] is False
          assert summary["paper_live_enabled"] is False
          (root / "wrapper_status.json").write_text(json.dumps({
              "hard_validity": "PASS",
              "economic_status": summary["economic_status"],
              "calibration_survivor_count": summary["calibration_survivor_count"],
              "selected_threshold": summary["selected_threshold"],
              "development_opened": summary["development_opened"],
              "2024_opened": False,
              "orders_submitted": False
          }, indent=2, sort_keys=True) + "\n")
          print("SEALED_RESEARCH_STATE_PASS")
          PY
      - name: Record immutable output hashes
        if: always()
        run: |
          mkdir -p "$OUT"
          find "$OUT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-po3-state-integrated-r11-${{ github.sha }}
          path: research_runs/ml_po3_state_router_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
