name: Validate 2023-only UTC-state SOL official 2024H1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-hourweek-pre2024-sol-r16.yml'
      - 'research/ml_hourweek_pre2024_sol_20260726/**'
      - 'research/results/RES-20260726-ML-HOURWEEK-PRE2024-SOL-001.json'
  push:
    branches:
      - agent/r16-ml-hourweek-pre2024-sol-001
    paths:
      - '.github/workflows/ml-hourweek-pre2024-sol-r16.yml'
      - 'research/ml_hourweek_pre2024_sol_20260726/**'
      - 'research/results/RES-20260726-ML-HOURWEEK-PRE2024-SOL-001.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ml-hourweek-pre2024-sol-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen environment
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 \
            scikit-learn==1.8.0 pytest==8.3.5
      - name: Fetch immutable source artifact
        run: |
          mkdir -p /tmp/hourweek-source
          gh api -H 'Accept: application/vnd.github+json' \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/8616632878/zip \
            > /tmp/hourweek-source/source.zip
          echo 'fd3c20704cf4b8b1dc80023298920456d4ec7cf2dfe9986237d94ea8cbd51f4c  /tmp/hourweek-source/source.zip' | sha256sum -c -
      - name: Compile and execute frozen evaluation
        run: |
          set -euo pipefail
          root=research/ml_hourweek_pre2024_sol_20260726
          out=research_runs/ml_hourweek_pre2024_sol_20260726/r16
          python -m py_compile "$root/evaluate.py"
          python "$root/evaluate.py" \
            --artifact /tmp/hourweek-source/source.zip \
            --work /tmp/hourweek-pre2024-work \
            --output "$out"
          diff -u "$root/Q3_Q4_SELECTION.json" "$out/Q3_Q4_SELECTION.json"
      - name: Validate scientific invariants with explicit numerical tolerance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          committed=json.loads(Path('research/results/RES-20260726-ML-HOURWEEK-PRE2024-SOL-001.json').read_text())
          reproduced=json.loads(Path('research_runs/ml_hourweek_pre2024_sol_20260726/r16/RESULT.json').read_text())
          assert reproduced['status']=='OFFICIAL_2024H1_ZERO_ACTION'
          assert reproduced['hard_validity_status']=='PASS_CAUSAL_PRE2024_SELECTION_BINANCE_PROXY'
          assert reproduced['selected_route']==committed['selected_route']=={
              'multiplier':0.75,'session':'UTC00_11','side_filter':'SHORT','symbol':'SOLUSDT'}
          assert reproduced['q3_survivor_count']==committed['q3_survivor_count']==50
          assert reproduced['q4_confirmed_count']==committed['q4_confirmed_count']==1
          assert abs(reproduced['base_threshold']-committed['base_threshold']) < 1e-4
          assert abs(reproduced['absolute_entry_threshold']-committed['absolute_entry_threshold']) < 1e-4
          assert reproduced['official_2024h1']['eligible_entry_count']==committed['official_2024h1']['eligible_entry_count']==0
          assert reproduced['official_2024h1']['minimum_session_prediction'] > reproduced['official_2024h1']['entry_threshold']
          for cost in ('12bps','18bps','24bps'):
              for route in ('ordinary','winner_removed'):
                  path=reproduced['official_2024h1']['paths'][cost][route]
                  assert path['completed_trade_count']==0
                  assert path['final_nav']==1.0
                  assert path['total_return']==0.0
                  assert path['geometric_daily_growth']==0.0
          assert reproduced['opened_periods']==['2024H1']
          assert reproduced['unopened_periods']==['2024H2','2025H1','2025H2','2026H1']
          assert reproduced['orders_submitted'] is False
          assert reproduced['ranking_role']=='NONE'
          print(json.dumps({
              'status':reproduced['status'],
              'selected_route':reproduced['selected_route'],
              'threshold_abs_diff':abs(reproduced['base_threshold']-committed['base_threshold']),
              'eligible_entries':0,
              'growth_24bps':0.0,
              'ranking_role':'NONE'
          },sort_keys=True))
          PY
      - name: Record immutable identities
        run: |
          out=research_runs/ml_hourweek_pre2024_sol_20260726/r16
          sha256sum \
            research/ml_hourweek_pre2024_sol_20260726/evaluate_source.py.gz.b64 \
            research/ml_hourweek_pre2024_sol_20260726/evaluate_source_manifest.json \
            research/ml_hourweek_pre2024_sol_20260726/preregistration_2024h1.json \
            research/results/RES-20260726-ML-HOURWEEK-PRE2024-SOL-001.json \
            "$out/RESULT.json" "$out/Q3_Q4_SELECTION.json" \
            > "$out/IDENTITIES.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-hourweek-pre2024-sol-r16-${{ github.sha }}
          path: research_runs/ml_hourweek_pre2024_sol_20260726/r16
          if-no-files-found: warn
          retention-days: 30
