name: YT Trinity event-tape source discovery

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/discover_event_tape_sources.py
      - control/yt-trinity-event-tape-source-trigger.json
      - .github/workflows/yt-trinity-event-tape-source-discovery.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-event-tape-source-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fetch latest main without merging strategy work
        run: git fetch origin main --depth=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install discovery dependency
        run: python -m pip install -q --upgrade requests
      - name: Scan only strategy-agnostic data paths and public Bybit archives
        run: |
          mkdir -p artifact
          python research/yt_trinity_ml/discover_event_tape_sources.py \
            --repo . \
            --ref origin/main \
            --output artifact/EVENT_TAPE_SOURCE_DISCOVERY.json
      - uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-event-tape-source-discovery-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          retention-days: 30
      - name: Persist discovery pointer
        run: |
          cp artifact/EVENT_TAPE_SOURCE_DISCOVERY.json research/yt_trinity_ml/EVENT_TAPE_SOURCE_DISCOVERY.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/EVENT_TAPE_SOURCE_DISCOVERY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record strategy-agnostic event-tape source discovery ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
