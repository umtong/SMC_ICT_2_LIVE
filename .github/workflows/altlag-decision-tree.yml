name: Execute precommitted Bybit altlag decision tree

on:
  pull_request:
    branches:
      - main
    paths:
      - "research/bybit_altlag_decision_tree_20260726/**"
      - "!research/bybit_altlag_decision_tree_20260726/observed/**"
      - ".github/workflows/altlag-decision-tree.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: altlag-decision-tree-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.2.6" "pandas==2.2.3" "requests==2.32.4"

      - name: Reconstruct registered base dependency
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin agent/r11-altlag-opportunity-001
          mkdir -p runtime research_runs/bybit_altlag_decision_tree_20260726
          git show FETCH_HEAD:research/bybit_altlag_opportunity_20260726/probe.py.zlib.b64 > runtime/base_probe.py.zlib.b64
          python - <<'PY'
          import base64,hashlib,pathlib,zlib
          root=pathlib.Path('runtime')
          source=zlib.decompress(base64.b64decode((root/'base_probe.py.zlib.b64').read_text().strip()))
          (root/'base_probe.py').write_bytes(source)
          print('base source sha256',hashlib.sha256(source).hexdigest())
          PY
          cp research/bybit_altlag_decision_tree_20260726/decision_tree.py runtime/decision_tree.py
          python - <<'PY'
          from pathlib import Path
          p=Path('runtime/decision_tree.py')
          text=p.read_text()

          old="                    'follower_return':float(f['follower_return'][i]),'under':float(f['under'][i]),\n"
          new="                    'under':float(f['under'][i]),\n"
          if old not in text:
              raise SystemExit('expected unused follower_return serialization line not found')
          text=text.replace(old,new,1)

          old_acquire="""        status,payload,error=base._download(session,url,target)
          if status!=200: raise RuntimeError(f'source unavailable {url}: {status} {error}')
          rec=base.inspect_source(target,symbol,date,url,payload)
          if not rec.timestamp_monotonic: raise RuntimeError(f'nonmonotonic {url}')
          arrays[symbol]=base.aggregate(target,date); records.append(rec)
          """
          new_acquire="""        base._download(session,url,target)
          day,rec=base.aggregate(target,symbol,date)
          if not rec.timestamp_monotonic: raise RuntimeError(f'nonmonotonic {url}')
          arrays[symbol]=day; records.append(rec)
          """
          if old_acquire not in text:
              raise SystemExit('expected registered-base acquire interface mismatch not found')
          text=text.replace(old_acquire,new_acquire,1)

          replacements={
              "leader['mark']":"leader.mark",
              "leader['trade_count']":"leader.trade_count",
              "follower['mark']":"follower.mark",
              "follower['trade_count']":"follower.trade_count",
              "base.utc_start(date)":"datetime.strptime(date,'%Y-%m-%d').replace(tzinfo=timezone.utc).timestamp()",
          }
          for old_value,new_value in replacements.items():
              if old_value not in text:
                  raise SystemExit(f'expected adapter token not found: {old_value}')
              text=text.replace(old_value,new_value)

          old_features="            f=base.continuous_features(leader,follower,h); tr,vr=attention(leader,follower,h)\n"
          new_features="            f=base.continuous_features(leader,follower,h); f['under']=f['underreaction']; f['leader_mark']=leader.mark; tr,vr=attention(leader,follower,h)\n"
          if old_features not in text:
              raise SystemExit('expected feature-interface line not found')
          text=text.replace(old_features,new_features,1)

          p.write_text(text)
          PY
          python -m py_compile runtime/base_probe.py runtime/decision_tree.py
          python scripts/validate_project.py
          sha256sum runtime/base_probe.py runtime/decision_tree.py research/bybit_altlag_decision_tree_20260726/preregistration.json research/bybit_altlag_decision_tree_20260726/RUNTIME_INTERFACE_CORRECTION_001.json research/bybit_altlag_decision_tree_20260726/RUNTIME_INTERFACE_CORRECTION_002.json > research_runs/bybit_altlag_decision_tree_20260726/INPUT_SHA256SUMS.txt

      - name: Run fixed causal decision tree after registered interface correction
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=runtime python runtime/decision_tree.py \
            --output research_runs/bybit_altlag_decision_tree_20260726/result \
            --cache "$RUNNER_TEMP/bybit-altlag-decision-cache" \
            2>&1 | tee research_runs/bybit_altlag_decision_tree_20260726/run.log

      - name: Enforce stage and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_runs/bybit_altlag_decision_tree_20260726/result')
          decision=json.loads((root/'decision.json').read_text())
          stage1=json.loads((root/'stage1/result.json').read_text())
          assert len(stage1['sources'])==9
          assert stage1['pnl_computed'] is False
          assert stage1['2024_2026_opened'] is False
          assert stage1['orders_submitted'] is False
          result=json.loads(Path(decision['result_path']).read_text())
          assert len(result['sources'])==12
          assert result['2024_2026_opened'] is False
          assert result['orders_submitted'] is False
          if decision['selected_mode']=='UNDERREACTION_PNL_CONFIRMATION':
              assert decision['stage1_passed'] is True
              assert result['pnl_computed'] is True
              assert result['funding_approximated'] is False
          else:
              assert decision['stage1_passed'] is False
              assert decision['selected_mode']=='OVERREACTION_OPPORTUNITY'
              assert result['pnl_computed'] is False
          print(json.dumps(decision,sort_keys=True))
          PY

      - name: Record immutable output checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research_runs/bybit_altlag_decision_tree_20260726
          find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bybit-altlag-decision-tree-${{ github.sha }}
          path: research_runs/bybit_altlag_decision_tree_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Commit decision-ready output to claim branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          target=research/bybit_altlag_decision_tree_20260726/observed
          rm -rf "$target"
          mkdir -p "$target"
          cp -R research_runs/bybit_altlag_decision_tree_20260726/result "$target/result"
          cp research_runs/bybit_altlag_decision_tree_20260726/INPUT_SHA256SUMS.txt "$target/INPUT_SHA256SUMS.txt"
          cp research_runs/bybit_altlag_decision_tree_20260726/OUTPUT_SHA256SUMS.txt "$target/OUTPUT_SHA256SUMS.txt"
          tail -n 300 research_runs/bybit_altlag_decision_tree_20260726/run.log > "$target/RUN_TAIL.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Record precommitted altlag decision result"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
