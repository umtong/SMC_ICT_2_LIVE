name: YT Trinity SMC fidelity atomic materialization

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/yt-trinity-smc-fidelity-materialize.yml
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - .github/workflows/yt-trinity-smc-fidelity-materialize.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-smc-fidelity-materialize
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0

      - name: Verify exact concurrent scientific base
        run: |
          set -euo pipefail
          check_blob() {
            local expected="$1" path="$2"
            local actual
            actual="$(git hash-object "$path")"
            [[ "$actual" == "$expected" ]] || {
              echo "blob mismatch $path expected=$expected actual=$actual" >&2
              exit 1
            }
          }
          check_blob 020322b90cdd81af82d018eb30a3c0a369f52cbf research/yt_trinity_ml/system/corpus_alpha.py
          check_blob 642599950faeb816837a92b59dba3c38002ad5f7 research/yt_trinity_ml/tests/test_corpus_alpha.py
          check_blob 7a4ca25e339bb082e8189e5e52996f12488164cb research/yt_trinity_ml/run_primary_screen.py
          echo "c722970a362852cdb2d4c8110f8f51b2b0187a6b19d3289bb98c38c58d1396dd  research/yt_trinity_ml/apply_smc_fidelity_v2.py.gz" | sha256sum --check --strict

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic dependencies
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q \
            "numpy==2.2.6" "pandas==2.2.3" "scikit-learn==1.6.1" \
            "pyarrow==19.0.1" "requests==2.32.4" "pytest==8.3.5"

      - name: Freeze current Bybit linear quantity rules
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import hashlib
          import json
          from pathlib import Path
          import requests

          endpoint = 'https://api.manepa.jp/v5/market/instruments-info'
          symbols = ('BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XRPUSDT')
          rules = {
              'snapshot_id': 'BYBIT_LINEAR_RULES_SMC_FIDELITY_20260727',
              'effective_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
              'source_endpoint': endpoint,
          }
          raw = {}
          for symbol in symbols:
              response = requests.get(endpoint, params={'category': 'linear', 'symbol': symbol}, timeout=30)
              response.raise_for_status()
              payload = response.json()
              assert payload.get('retCode') == 0, payload
              rows = payload.get('result', {}).get('list', [])
              assert len(rows) == 1 and rows[0].get('symbol') == symbol, (symbol, rows)
              instrument = rows[0]
              lot = instrument['lotSizeFilter']
              rules[symbol] = {
                  'quantity_step': lot['qtyStep'],
                  'minimum_quantity': lot['minOrderQty'],
                  'minimum_notional_value': lot.get('minNotionalValue'),
                  'tick_size': instrument['priceFilter']['tickSize'],
                  'maximum_leverage': instrument['leverageFilter']['maxLeverage'],
                  'status': instrument['status'],
              }
              assert float(lot['qtyStep']) > 0 and float(lot['minOrderQty']) > 0
              raw[symbol] = payload
          canonical = json.dumps(raw, sort_keys=True, separators=(',', ':')).encode()
          rules['source_response_sha256'] = hashlib.sha256(canonical).hexdigest()
          Path('research/yt_trinity_ml/INSTRUMENT_RULES.json').write_text(
              json.dumps(rules, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Apply lossless SMC fidelity patch
        run: |
          set -euo pipefail
          gzip --decompress --stdout research/yt_trinity_ml/apply_smc_fidelity_v2.py.gz > /tmp/apply_smc_fidelity_v2.py
          echo "d4485c5aa70e42bcfa9d864f34865a2c79eb04bd4b7bfd4c222045795554a34e  /tmp/apply_smc_fidelity_v2.py" | sha256sum --check --strict
          python /tmp/apply_smc_fidelity_v2.py

      - name: Run full causal and execution regression suite
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -euo pipefail
          python -m py_compile \
            research/yt_trinity_ml/system/corpus_alpha.py \
            research/yt_trinity_ml/run_primary_screen.py
          python -m json.tool research/yt_trinity_ml/INSTRUMENT_RULES.json >/dev/null
          pytest -q research/yt_trinity_ml/tests \
            --ignore=research/yt_trinity_ml/tests/test_harvest_ytt_api.py

      - name: Remove temporary transfer machinery
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/yt-trinity-smc-fidelity-materialize.yml \
            .github/workflows/yt-trinity-current-source-export.yml \
            .github/workflows/yt-trinity-current-source-chunk-capture.yml \
            research/yt_trinity_ml/apply_smc_fidelity_v2.py.gz \
            research/yt_trinity_ml/apply_smc_fidelity_v2.py.gz.b64
          git rm -rf --ignore-unmatch research/yt_trinity_ml/current_snapshot_chunks
          git rm -f --ignore-unmatch research/yt_trinity_ml/upgrade_chunks/smc_fidelity_payload.*

      - name: Commit one tested SMC scientific transition
        run: |
          set -euo pipefail
          git add \
            research/yt_trinity_ml/system/corpus_alpha.py \
            research/yt_trinity_ml/tests/test_corpus_alpha.py \
            research/yt_trinity_ml/INSTRUMENT_RULES.json \
            .github/workflows/yt-trinity-smc-fidelity-screen.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Deepen unified SMC narrative fidelity'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
