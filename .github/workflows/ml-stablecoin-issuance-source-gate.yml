name: ML stablecoin issuance source gate

on:
  push:
    branches:
      - agent/r13-ml-stablecoin-issuance-001
    paths:
      - '.github/workflows/ml-stablecoin-issuance-source-gate.yml'
      - 'research/ml_stablecoin_issuance_20260726/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-stablecoin-issuance-source-gate.yml'
      - 'research/ml_stablecoin_issuance_20260726/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-stablecoin-issuance-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed source environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests==2.32.4 pytest==8.3.5
      - name: Validate causal decoding and seals
        run: |
          set -euo pipefail
          root=research/ml_stablecoin_issuance_20260726
          out=research_runs/ml_stablecoin_issuance_20260726/source_gate
          mkdir -p "$out"
          python -m py_compile "$root/source_gate.py" "$root/test_source_gate.py" 2>&1 | tee "$out/COMPILE.log"
          PYTHONPATH="$root" pytest -q "$root/test_source_gate.py" 2>&1 | tee "$out/PYTEST.log"
          PYTHONPATH="$root" python "$root/source_gate.py" --self-test 2>&1 | tee "$out/SELF_TEST.log"
          python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$root/preregistration.json" >/dev/null
          python -m json.tool "$root/AMENDMENT_001_FULL_PERIOD_SOURCE_BEFORE_OUTCOME.json" >/dev/null
          python scripts/validate_project.py 2>&1 | tee "$out/PROJECT_VALIDATION.log"
      - name: Run outcome-sealed source gate
        run: |
          set -u
          root=research/ml_stablecoin_issuance_20260726
          out=research_runs/ml_stablecoin_issuance_20260726/source_gate
          mkdir -p "$out"
          set +e
          PYTHONPATH="$root" python "$root/source_gate.py" --output "$out" 2>&1 | tee "$out/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$out/RUN_EXIT_CODE.txt"
          if [[ ! -f "$out/SOURCE_GATE_RESULT.json" ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          out=Path('research_runs/ml_stablecoin_issuance_20260726/source_gate')
          rc=int((out/'RUN_EXIT_CODE.txt').read_text().strip())
          payload={
            'schema_version':1,
            'claim_id':'CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001',
            'status':'SOURCE_UNAVAILABLE_OR_TRANSPORT_FAILURE',
            'run_exit_code':rc,
            'conditional_model_screen_authorized':False,
            'market_outcome_opened':False,
            'model_fit':False,
            'trade_or_pnl_opened':False,
            'official_2024_2026_opened':False,
            'orders_submitted':False,
          }
          (out/'SOURCE_GATE_RESULT.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          fi
          if [[ "$rc" != "0" && "$rc" != "2" ]]; then
            echo "source transport failed; durable sealed failure result recorded"
          fi
      - name: Enforce outcome seal and route decision
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('research_runs/ml_stablecoin_issuance_20260726/source_gate')
          result=json.loads((out/'SOURCE_GATE_RESULT.json').read_text())
          assert result['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert result['market_outcome_opened'] is False
          assert result['model_fit'] is False
          assert result['trade_or_pnl_opened'] is False
          assert result['official_2024_2026_opened'] is False
          assert result['orders_submitted'] is False
          assert result['status'] in {'PASS','FAIL_BELOW_SOURCE_DENSITY_OR_COVERAGE','SOURCE_UNAVAILABLE_OR_TRANSPORT_FAILURE'}
          print(json.dumps({
            'status':result['status'],
            'events':result.get('event_count'),
            'model_authorized':result['conditional_model_screen_authorized'],
          },sort_keys=True))
          PY
      - name: Freeze source evidence hashes
        if: always()
        run: |
          set -euo pipefail
          root=research/ml_stablecoin_issuance_20260726
          out=research_runs/ml_stablecoin_issuance_20260726/source_gate
          mkdir -p "$out/source"
          cp "$root"/{WORK_CLAIM.json,preregistration.json,AMENDMENT_001_FULL_PERIOD_SOURCE_BEFORE_OUTCOME.json,README.md,SOURCES.md,source_gate.py,test_source_gate.py} "$out/source/"
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-stablecoin-issuance-source-${{ github.run_id }}
          path: research_runs/ml_stablecoin_issuance_20260726/source_gate
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
