name: YT SMC ICT causal Bybit data v2 gpt56

on:
  workflow_dispatch:
  push:
    branches:
      - agent/yt-smc-ict-causal-ml-gpt56-20260727
    paths:
      - research/yt_smc_ict_gpt56/download_bybit_v2.py
      - .github/workflows/yt-smc-ict-data-v2-gpt56.yml

permissions:
  contents: write

concurrency:
  group: yt-smc-ict-data-v2-gpt56-${{ github.ref }}
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pandas pyarrow requests

      - name: Compile and test downloader
        run: |
          python -m py_compile research/yt_smc_ict_gpt56/download_bybit_v2.py
          python research/yt_smc_ict_gpt56/download_bybit_v2.py --self-test

      - name: Restore exact causal data cache
        id: cache
        uses: actions/cache@v4
        with:
          path: artifact/bybit_data_v2
          key: yt-smc-ict-gpt56-bybit-linear-5m-btceth-20210101-20260701-v2

      - name: Probe official endpoints and download complete window
        id: download
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set +e
          rm -rf artifact/bybit_data_v2
          mkdir -p artifact/bybit_data_v2
          python research/yt_smc_ict_gpt56/download_bybit_v2.py \
            --output artifact/bybit_data_v2 \
            --start 2021-01-01T00:00:00Z \
            --end-exclusive 2026-07-01T00:00:00Z \
            --symbols BTCUSDT ETHUSDT \
            --interval 5 \
            2>&1 | tee artifact/bybit_data_v2/DOWNLOAD_STDOUT.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate data or retain exact failure
        id: validate
        if: always()
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifact/bybit_data_v2')
          failure = root / 'DATA_FAILURE.json'
          manifest_path = root / 'DATA_MANIFEST.json'
          if failure.exists():
              payload = json.loads(failure.read_text(encoding='utf-8'))
              print(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True))
              raise SystemExit(2)
          if not manifest_path.exists():
              raise SystemExit('Neither DATA_MANIFEST.json nor DATA_FAILURE.json exists')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if set(manifest['symbols']) != {'BTCUSDT', 'ETHUSDT'}:
              raise SystemExit(f"symbol mismatch: {set(manifest['symbols'])}")
          for symbol, item in manifest['symbols'].items():
              bars = item['bars']
              funding = item['funding']
              if bars['rows'] < 550_000:
                  raise SystemExit(f"{symbol}: insufficient bars {bars['rows']}")
              if bars['missing_count'] > 100:
                  raise SystemExit(f"{symbol}: excessive missing bars {bars['missing_count']}")
              if funding['rows'] < 4_500:
                  raise SystemExit(f"{symbol}: insufficient funding observations {funding['rows']}")
          print(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True))
          PY
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write recoverable data-v2 pointer
        if: always()
        env:
          DOWNLOAD_STATUS: ${{ steps.download.outputs.status || '0' }}
          VALIDATE_STATUS: ${{ steps.validate.outputs.status || '99' }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit || 'false' }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('artifact/bybit_data_v2')
          manifest_path = root / 'DATA_MANIFEST.json'
          failure_path = root / 'DATA_FAILURE.json'
          probe_path = root / 'ENDPOINT_PROBE.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8')) if manifest_path.exists() else None
          failure = json.loads(failure_path.read_text(encoding='utf-8')) if failure_path.exists() else None
          probe = json.loads(probe_path.read_text(encoding='utf-8')) if probe_path.exists() else None
          source_sha = os.environ['GITHUB_SHA']
          pointer = {
              'schema_version': 2,
              'data_id': 'BYBIT-LINEAR-5M-BTCETH-20210101-20260630-GPT56-V2',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'source_sha': source_sha,
              'branch': os.environ['GITHUB_REF_NAME'],
              'artifact_name': f'yt-smc-ict-bybit-data-v2-gpt56-{source_sha}',
              'cache_key': 'yt-smc-ict-gpt56-bybit-linear-5m-btceth-20210101-20260701-v2',
              'cache_hit': os.environ['CACHE_HIT'],
              'download_status': int(os.environ['DOWNLOAD_STATUS']),
              'validate_status': int(os.environ['VALIDATE_STATUS']),
              'manifest_sha256': hashlib.sha256(manifest_path.read_bytes()).hexdigest() if manifest_path.exists() else None,
              'failure_sha256': hashlib.sha256(failure_path.read_bytes()).hexdigest() if failure_path.exists() else None,
              'probe': probe,
              'manifest': manifest,
              'failure': failure,
          }
          path = Path('research/yt_smc_ict_gpt56/DATA_V2_POINTER.json')
          path.write_text(json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload immutable data-v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-smc-ict-bybit-data-v2-gpt56-${{ github.sha }}
          path: artifact/bybit_data_v2
          if-no-files-found: error
          compression-level: 3
          retention-days: 30

      - name: Commit data-v2 pointer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_smc_ict_gpt56/DATA_V2_POINTER.json
          git commit -m "Record causal Bybit data v2 ${GITHUB_RUN_ID}" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Enforce valid dataset
        if: always()
        shell: bash
        run: |
          status="${{ steps.validate.outputs.status || '99' }}"
          if [[ "$status" != "0" ]]; then
            echo "Data-v2 validation status: $status" >&2
            exit "$status"
          fi
