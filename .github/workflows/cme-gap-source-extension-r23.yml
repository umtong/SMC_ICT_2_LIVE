name: CME gap source extension current contract

on:
  pull_request:
    branches: [main]
    paths:
      - research/cme_gap_current_contract/fetch_cme_source.py
      - .github/workflows/cme-gap-source-extension-r23.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cme-gap-source-extension-r23-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fetch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source fetcher
        run: python -m py_compile research/cme_gap_current_contract/fetch_cme_source.py
      - name: Fetch immutable 2024-2026 CME source extension
        run: |
          python research/cme_gap_current_contract/fetch_cme_source.py \
            --out artifact/cme-gap-source-extension
      - uses: actions/upload-artifact@v4
        with:
          name: cme-gap-source-extension-${{ github.sha }}
          path: artifact/cme-gap-source-extension
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
