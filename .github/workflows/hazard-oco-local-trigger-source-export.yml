name: ML hazard local-trigger source export

on:
  push:
    branches: [agent/r11-hazard-oco-v2]
    paths:
      - research/hazard_oco_20260726/local_trigger_runner.py.gz.b64.part*
      - research/hazard_oco_20260726/test_local_trigger_runner.py.gz.b64
      - research/hazard_oco_20260726/local_trigger_bundle_manifest.json
      - research/hazard_oco_20260726/reconstruct_local_trigger.py
      - .github/workflows/hazard-oco-local-trigger-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct exact local-trigger source
        shell: bash
        run: |
          set -euo pipefail
          root=research/hazard_oco_20260726
          out=research_runs/hazard_local_trigger_source
          mkdir -p "$out"
          python "$root/reconstruct_local_trigger.py"
          python -m py_compile "$root/local_trigger_runner.py" "$root/test_local_trigger_runner.py"
          cp "$root/local_trigger_runner.py" "$out/"
          cp "$root/test_local_trigger_runner.py" "$out/"
          cp "$root/local_trigger_bundle_manifest.json" "$out/"
          sha256sum "$out"/* > "$out/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: hazard-local-trigger-source-${{ github.sha }}
          path: research_runs/hazard_local_trigger_source
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
