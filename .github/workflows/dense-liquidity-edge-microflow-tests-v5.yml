name: Dense liquidity-edge microflow semantic tests v5

on:
  push:
    branches:
      - agent/r37-dense-liquidity-edge-microflow-001
    paths:
      - research/dense_liquidity_edge_microflow/RUN_TESTS_V5
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 pyarrow==18.1.0 scikit-learn==1.5.2 requests==2.32.3 pytest==8.3.4
      - run: |
          python -m py_compile \
            research/dense_liquidity_edge_microflow/extract_edge_microflow_v3.py \
            research/dense_liquidity_edge_microflow/extract_edge_microflow_v4.py \
            research/dense_liquidity_edge_microflow/combine_edge_microflow_v3.py \
            research/dense_liquidity_edge_microflow/evaluate_dense_edge_v4.py \
            research/dense_liquidity_edge_microflow/evaluate_dense_edge_v5.py
          pytest -q tests/test_dense_liquidity_edge_microflow_v5.py
