name: L2 maker V4 causal correction

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r11-l2-maker-causal-correction-001
    paths:
      - "research/l2_maker_causal_correction_20260726/**"
      - ".github/workflows/l2-maker-causal-correction-r11.yml"
  pull_request:
    paths:
      - "research/l2_maker_causal_correction_20260726/**"
      - ".github/workflows/l2-maker-causal-correction-r11.yml"

permissions:
  contents: read
  actions: read

jobs:
  corrected-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 pandas==2.2.3 scikit-learn==1.6.1

      - name: Download immutable original V4 artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research_runs/l2_maker_causal_correction
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8621485991/zip" \
            --output research_runs/l2_maker_causal_correction/original_v4.zip
          echo "ebd885b469c0391a5d164c8a6e540f5958ac34b39ee03a1e5a54748a7e6a1b46  research_runs/l2_maker_causal_correction/original_v4.zip" | sha256sum --check

      - name: Compile and run deterministic correction
        run: |
          python -m py_compile research/l2_maker_causal_correction_20260726/run_correction.py
          python research/l2_maker_causal_correction_20260726/run_correction.py \
            --artifact-zip research_runs/l2_maker_causal_correction/original_v4.zip \
            --output research_runs/l2_maker_causal_correction/output \
            2>&1 | tee research_runs/l2_maker_causal_correction/correction.log

      - name: Verify corrected output inventory
        run: |
          cd research_runs/l2_maker_causal_correction/output
          sha256sum --check SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: l2-maker-causal-correction-${{ github.sha }}
          path: research_runs/l2_maker_causal_correction
          if-no-files-found: error
          retention-days: 30
