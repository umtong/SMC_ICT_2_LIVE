name: SMT reclaim ML exact calibration fast path

on:
  push:
    branches:
      - agent/r11-smt-reclaim-ml-meta-001
    paths:
      - ".github/workflows/smt-reclaim-ml-calibration-fast.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/smt-reclaim-ml-calibration-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smt-reclaim-ml-calibration-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  TZ: UTC

jobs:
  chronological-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen extraction and model environment
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy==2.2.6" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "scikit-learn==1.6.1" \
            "joblib==1.4.2"

      - name: Enforce parent zero-survivor authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin agent/r11-smt-overreaction-reclaim-001
          git show FETCH_HEAD:research_results/r11_smt_overreaction_reclaim_001/result.json > /tmp/parent.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/parent.json'))
          assert r['hard_validity']=='PASS'
          assert int(r['main_mss_survivor_count'])==0
          assert r['official_2024_opened'] is False
          assert r['orders_submitted'] is False
          print('PARENT_ZERO_SURVIVOR_AUTHORITY_PASS')
          PY

      - name: Reconstruct exact frozen engines once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          git fetch --depth=1 origin agent/r11-altlag-opportunity-001
          git show FETCH_HEAD:research/bybit_altlag_opportunity_20260726/probe.py.zlib.b64 \
            > runtime/base_probe.py.zlib.b64
          python - <<'PY'
          import base64,pathlib,zlib
          root=pathlib.Path('runtime')
          root.joinpath('base_probe.py').write_bytes(
              zlib.decompress(base64.b64decode(root.joinpath('base_probe.py.zlib.b64').read_text().strip()))
          )
          PY
          git fetch --depth=1 origin agent/r11-smt-overreaction-reclaim-001
          git show FETCH_HEAD:research/smt_overreaction_reclaim_20260726/run.py > runtime/rule_engine.py
          cp research/smt_reclaim_ml_meta_20260726/extract.py runtime/extract.py
          cp research/smt_reclaim_ml_meta_20260726/extract_entry.py runtime/extract_entry.py
          cp research/smt_reclaim_ml_meta_20260726/train.py runtime/train.py
          cp research/smt_reclaim_ml_meta_20260726/train_entry.py runtime/train_entry.py
          python -m py_compile runtime/*.py
          PYTHONPATH=runtime python runtime/extract_entry.py --self-test
          PYTHONPATH=runtime python runtime/train_entry.py self-test

      - uses: actions/cache@v4
        with:
          path: /tmp/smt-reclaim-ml-sequential-cache
          key: smt-reclaim-ml-sequential-${{ runner.os }}-v1
          restore-keys: |
            smt-reclaim-ml-sequential-${{ runner.os }}-

      - name: Replay all frozen 2022 dates and calibrate immediately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p matrices calibration
          dates=(
            2022-01-09 2022-02-13 2022-03-13 2022-04-10
            2022-05-08 2022-06-12 2022-07-10 2022-08-14
            2022-09-11 2022-10-09 2022-11-13 2022-12-11
          )
          for date in "${dates[@]}"; do
            out="matrices/${date}"
            mkdir -p "$out"
            echo "=== EXTRACT ${date} ===" | tee "$out/driver.log"
            PYTHONPATH=runtime python runtime/extract_entry.py \
              --date "$date" \
              --cache /tmp/smt-reclaim-ml-sequential-cache \
              --output "$out" \
              2>&1 | tee "$out/run.log"
          done
          PYTHONPATH=runtime python runtime/train_entry.py calibrate \
            --input matrices \
            --output calibration \
            2>&1 | tee calibration/run.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('calibration/CALIBRATION_RESULT.json'))
          assert r['official_2024_opened'] is False
          assert r['official_2025_opened'] is False
          assert r['official_2026_opened'] is False
          assert r['orders_submitted'] is False
          summaries=[]
          for p in sorted(Path('matrices').rglob('summary_*.json')):
              summaries.append(json.loads(p.read_text()))
          compact={
              'claim_id':'CLM-20260726-SMT-RECLAIM-ML-001',
              'matrix_dates':len(summaries),
              'matrix_rows':sum(int(x['row_count']) for x in summaries),
              'raw_overreaction_events':sum(int(x['diagnostics']['raw_overreaction_events']) for x in summaries),
              'mss_confirmed_events':sum(int(x['diagnostics']['mss_confirmed_events']) for x in summaries),
              'pair_survivor_count':int(r['pair_survivor_count']),
              'official_2024_2026_opened':False,
              'orders_submitted':False,
          }
          Path('calibration/COMPACT_RESULT.json').write_text(json.dumps(compact,indent=2,sort_keys=True)+'\n')
          print(json.dumps(compact,sort_keys=True))
          PY

      - name: Record immutable output hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find matrices calibration -type f -print0 | sort -z | xargs -0 sha256sum > OUTPUT_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smt-reclaim-ml-sequential-calibration-${{ github.sha }}
          path: |
            matrices
            calibration
            OUTPUT_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
