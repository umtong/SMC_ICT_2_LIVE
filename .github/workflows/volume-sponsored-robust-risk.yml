name: Volume-sponsored robust-risk audit

on:
  push:
    branches:
      - agent/r30-volume-sponsored-robust-risk-001
    paths:
      - "research/volume_sponsored_channel/**"
      - "research/volume_sponsored_robust_risk/**"
      - ".github/workflows/volume-sponsored-robust-risk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/volume_sponsored_channel/**"
      - "research/volume_sponsored_robust_risk/**"
      - ".github/workflows/volume-sponsored-robust-risk.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: volume-sponsored-robust-risk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0
      - name: Verify source carrier and exclude only the known corrupted selector
        run: |
          set -euo pipefail
          python research/volume_sponsored_robust_risk/source_carrier_probe.py
          python -m py_compile research_runs/volume_sponsored_robust_risk/source/*.py
          cp research/volume_sponsored_channel/CONTRACT.json research_runs/volume_sponsored_robust_risk/source/
          cp research/volume_sponsored_channel/RESULT.json research_runs/volume_sponsored_robust_risk/source/BASE_RESULT.json
          cp research/volume_sponsored_channel/SOURCE_MANIFEST.json research_runs/volume_sponsored_robust_risk/source/
      - name: Download and verify immutable canonical pandas export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/data
          sudo chown -R "$USER":"$USER" /mnt/data
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/umtong/SMC_ICT_2_LIVE/actions/artifacts/8712672241/zip \
            --output /mnt/data/canonical-pandas-export.zip
          echo "950ad2ee0f5d6df729c11a15b817e30e19ead754a35385e5535233d0af8e6c02  /mnt/data/canonical-pandas-export.zip" | sha256sum --check
          mkdir -p /mnt/data/core_tables_py
          unzip -q /mnt/data/canonical-pandas-export.zip -d /mnt/data/core_tables_py
          cp research_runs/volume_sponsored_robust_risk/source/channel_independent_audit.py /mnt/data/channel_independent_audit.py
      - name: Run focused selector tests
        run: |
          set -euo pipefail
          cd research/volume_sponsored_robust_risk
          PYTHONPATH="$PWD:/mnt/data" python -m unittest -v test_audit.py
      - name: Run full audit twice and require byte identity
        run: |
          set -euo pipefail
          rm -rf research_runs/volume_sponsored_robust_risk/result-a research_runs/volume_sponsored_robust_risk/result-b
          PYTHONPATH="${GITHUB_WORKSPACE}/research/volume_sponsored_robust_risk:/mnt/data" \
            python research/volume_sponsored_robust_risk/audit.py \
            --output research_runs/volume_sponsored_robust_risk/result-a \
            2>&1 | tee research_runs/volume_sponsored_robust_risk/run-a.log
          PYTHONPATH="${GITHUB_WORKSPACE}/research/volume_sponsored_robust_risk:/mnt/data" \
            python research/volume_sponsored_robust_risk/audit.py \
            --output research_runs/volume_sponsored_robust_risk/result-b \
            2>&1 | tee research_runs/volume_sponsored_robust_risk/run-b.log
          cmp research_runs/volume_sponsored_robust_risk/result-a/RESULT.json \
              research_runs/volume_sponsored_robust_risk/result-b/RESULT.json
          cp research_runs/volume_sponsored_robust_risk/result-a/RESULT.json \
             research_runs/volume_sponsored_robust_risk/RESULT.json
          {
            sha256sum research_runs/volume_sponsored_robust_risk/RESULT.json
            sha256sum research/volume_sponsored_robust_risk/audit.py
            find research_runs/volume_sponsored_robust_risk/source -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum
          } > research_runs/volume_sponsored_robust_risk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volume-sponsored-robust-risk-result-${{ github.sha }}
          path: research_runs/volume_sponsored_robust_risk
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
