name: Stablecoin economic execution blocked pending source PASS

on:
  push:
    branches:
      - agent/r20-ml-stablecoin-strict-causal-001
    paths:
      - '.github/workflows/ml-stablecoin-economic-causal-r20.yml'
      - 'sourcefix/ml_stablecoin_causal_guard_20260726/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-stablecoin-economic-causal-r20.yml'
      - 'sourcefix/ml_stablecoin_causal_guard_20260726/**'
  workflow_dispatch:

permissions:
  contents: read

# Deliberately shares the old economic concurrency group. This cancels any
# inherited polling/economic run before source PASS, market data, labels or PnL.
concurrency:
  group: stablecoin-economic-r15-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  blocked-before-outcome:
    runs-on: ubuntu-24.04
    steps:
      - name: Seal no-outcome state
        run: |
          set -euo pipefail
          echo 'SOURCE_PASS_CONSUMED=false'
          echo 'MARKET_ARCHIVE_OPENED=false'
          echo 'LABEL_COMPUTED=false'
          echo 'MODEL_FIT=false'
          echo 'TRADE_OR_PNL_OPENED=false'
          echo 'OFFICIAL_2024H1_OPENED=false'
          echo 'ORDERS_SUBMITTED=false'
          echo 'Execution remains blocked until PR #189 has a SHA-identified corrected source PASS and strict validation passes.'
