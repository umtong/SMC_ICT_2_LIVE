name: Salvage signed Uniswap source and run profit-first account

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-uniswap-signed-salvage-r31.yml'
      - 'research/ml_uniswap_signed_salvage_r31/**'
      - 'research/triggers/uniswap_signed_salvage_r31/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ml-uniswap-signed-salvage-r31-${{ github.sha }}
  cancel-in-progress: false

jobs:
  salvage-and-decide:
    runs-on: macos-14
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PRIOR_RUN_ID: '30204103060'
      PRIOR_ARTIFACT: 'ml-uniswap-source-gate-r14-30204103060'
      ECONOMIC_COMMIT: 'f0c5e9b4afffc878524cbcf307c2162c6e7b4215'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r31-ml-uniswap-signed-reopen-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize unchanged frozen economic engine
        run: |
          set -euo pipefail
          git fetch origin "$ECONOMIC_COMMIT" --depth=1
          git archive "$ECONOMIC_COMMIT" research/ml_uniswap_hedge_transfer_economic_20260726 | tar -x
      - name: Install fixed runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            requests==2.32.4 pytest==8.3.5 numpy==2.1.3 pandas==2.2.3 \
            scikit-learn==1.6.1 pyarrow==18.1.0
      - name: Validate transport salvage and account correction
        run: |
          set -euo pipefail
          source_root=research/ml_uniswap_hedge_transfer_20260726
          salvage_root=research/ml_uniswap_signed_salvage_r31
          economic_root=research/ml_uniswap_hedge_transfer_economic_20260726
          python -m py_compile \
            "$salvage_root/salvage_source_gate.py" \
            "$salvage_root/apply_profit_first_patch.py"
          PYTHONPATH="$source_root:$salvage_root" python -m pytest -q \
            "$salvage_root/test_salvage_source_gate.py"
          PYTHONPATH="$economic_root:$salvage_root" python -m pytest -q \
            "$salvage_root/test_apply_profit_first_patch.py"
          python "$economic_root/reconstruct.py"
          PYTHONPATH="$economic_root" python "$economic_root/run.py" self-test
          python "$salvage_root/apply_profit_first_patch.py" \
            --source "$economic_root/run.py" \
            --output "$salvage_root/run_profit_first.py"
          python -m py_compile "$salvage_root/run_profit_first.py"
          PYTHONPATH="$salvage_root" python "$salvage_root/run_profit_first.py" self-test
      - name: Restore immutable partial signed-source evidence
        run: |
          set -euo pipefail
          out=research_runs/ml_uniswap_signed_salvage_r31
          mkdir -p "$out/prior"
          gh run download "$PRIOR_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$PRIOR_ARTIFACT" \
            --dir "$out/prior"
          test -f "$out/prior/PROBE_RESULT.json"
          test -f "$out/prior/RAW_SWAP_LOGS.jsonl.gz"
          python -m json.tool "$out/prior/PROBE_RESULT.json" >/dev/null
          sha256sum "$out/prior/PROBE_RESULT.json" "$out/prior/RAW_SWAP_LOGS.jsonl.gz" \
            > "$out/PRIOR_INPUT_SHA256SUMS.txt"
      - id: source
        name: Recover transport-only decode failures and missing sixth window
        shell: bash
        run: |
          set -u
          source_root=research/ml_uniswap_hedge_transfer_20260726
          salvage_root=research/ml_uniswap_signed_salvage_r31
          out=research_runs/ml_uniswap_signed_salvage_r31
          mkdir -p "$out/source"
          set +e
          PYTHONPATH="$source_root:$salvage_root" \
            python "$salvage_root/salvage_source_gate.py" \
              --prior "$out/prior" \
              --output "$out/source" 2>&1 | tee "$out/source/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$out/source/RUN_EXIT_CODE.txt"
          test -f "$out/source/PROBE_RESULT.json"
          authorized=$(python -c "import json; print(str(bool(json.load(open('$out/source/PROBE_RESULT.json'))['source_gate_pass'])).lower())")
          echo "authorized=$authorized" >> "$GITHUB_OUTPUT"
          if [[ "$rc" != 0 && "$authorized" == true ]]; then exit "$rc"; fi
      - name: Run original frozen pre-2024 decision for defect comparison
        if: steps.source.outputs.authorized == 'true'
        shell: bash
        run: |
          set -u
          root=research/ml_uniswap_hedge_transfer_economic_20260726
          out=research_runs/ml_uniswap_signed_salvage_r31
          mkdir -p "$out/original" "$out/cache"
          set +e
          PYTHONPATH="$root" python "$root/run.py" run \
            --parent-probe "$out/source/PROBE_RESULT.json" \
            --cache "$out/cache" \
            --output "$out/original" 2>&1 | tee "$out/original/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$out/original/RUN_EXIT_CODE.txt"
          test -f "$out/original/RESULT.json"
          python -m json.tool "$out/original/RESULT.json" >/dev/null
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then exit "$rc"; fi
      - name: Run corrected profit-first pre-2024 decision on identical cache
        if: steps.source.outputs.authorized == 'true'
        shell: bash
        run: |
          set -u
          root=research/ml_uniswap_signed_salvage_r31
          out=research_runs/ml_uniswap_signed_salvage_r31
          mkdir -p "$out/profit_first"
          set +e
          PYTHONPATH="$root" python "$root/run_profit_first.py" run \
            --parent-probe "$out/source/PROBE_RESULT.json" \
            --cache "$out/cache" \
            --output "$out/profit_first" 2>&1 | tee "$out/profit_first/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$out/profit_first/RUN_EXIT_CODE.txt"
          test -f "$out/profit_first/RESULT.json"
          python -m json.tool "$out/profit_first/RESULT.json" >/dev/null
          if [[ "$rc" != 0 && "$rc" != 2 ]]; then exit "$rc"; fi
      - name: Publish compact comparison and immutable hashes
        if: always()
        run: |
          set -euo pipefail
          out=research_runs/ml_uniswap_signed_salvage_r31
          mkdir -p "$out"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('research_runs/ml_uniswap_signed_salvage_r31')
          def read(path):
              return json.loads(path.read_text()) if path.exists() else None
          payload={
              'schema_version':1,
              'claim_id':'CLM-20260726-2110-ML-UNISWAP-HEDGE-TRANSFER-001',
              'source':read(root/'source/PROBE_RESULT.json'),
              'original':read(root/'original/RESULT.json'),
              'profit_first':read(root/'profit_first/RESULT.json'),
              'orders_submitted':False,
              'official_2024h1_opened':False,
          }
          (root/'DECISION_COMPARISON.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          files=sorted(p for p in root.rglob('*') if p.is_file() and p.name!='OUTPUT_SHA256SUMS.txt')
          (root/'OUTPUT_SHA256SUMS.txt').write_text(''.join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n" for p in files
          ))
          print(json.dumps({
              'source_pass':bool(payload['source'] and payload['source'].get('source_gate_pass')),
              'original_status':None if payload['original'] is None else payload['original'].get('status'),
              'profit_first_status':None if payload['profit_first'] is None else payload['profit_first'].get('status'),
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-uniswap-signed-salvage-r31-${{ github.run_id }}
          path: research_runs/ml_uniswap_signed_salvage_r31
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
