name: YT Trinity repaired entry-exit ML rerun

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-entry-exit-action-ml-v2-rerun.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yt-trinity-entry-exit-action-ml-v2-rerun
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Verify hotfix and add nonfunctional rerun marker
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('research/yt_trinity_ml/run_entry_exit_action_ml_v2.py')
          text = path.read_text(encoding='utf-8')
          if 'action_counts[row.action]' in text:
              raise SystemExit('stale row.action reference remains')
          if 'action_counts[row.identifier]' not in text:
              raise SystemExit('corrected row.identifier reference missing')
          marker = '# causal-rerun-marker: repaired-label-export-and-action-identifier-v1\n'
          if marker not in text:
              text += '\n' + marker
              path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile research/yt_trinity_ml/run_entry_exit_action_ml_v2.py
      - name: Commit rerun marker
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/run_entry_exit_action_ml_v2.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rerun repaired contextual entry-exit ML'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
