name: Cross-asset cross-impact fatal screen

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r11-cross-asset-crossimpact-001
    paths:
      - "research/cross_asset_crossimpact_20260726/**"
      - ".github/workflows/cross-asset-crossimpact-r11.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/cross_asset_crossimpact_20260726/**"
      - ".github/workflows/cross-asset-crossimpact-r11.yml"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  NUMEXPR_NUM_THREADS: "2"

jobs:
  fatal-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 pandas==2.2.3 requests==2.32.4

      - name: Reconstruct immutable source bundle
        run: |
          python research/cross_asset_crossimpact_20260726/reconstruct.py

      - name: Compile and run causal self-tests
        run: |
          python scripts/validate_project.py
          python -m py_compile research/cross_asset_crossimpact_20260726/run_screen.py
          python research/cross_asset_crossimpact_20260726/run_screen.py self-test
          python -m json.tool research/cross_asset_crossimpact_20260726/preregistration.json >/dev/null

      - name: Cache immutable public Bybit archives
        uses: actions/cache@v4
        with:
          path: /tmp/bybit-crossimpact
          key: bybit-crossimpact-v1-btc-sol-xrp-20230205-20231210

      - name: Run frozen 576-candidate fatal screen
        run: |
          rm -rf artifacts/cross_asset_crossimpact
          mkdir -p artifacts/cross_asset_crossimpact
          set -o pipefail
          python research/cross_asset_crossimpact_20260726/run_screen.py run \
            --cache /tmp/bybit-crossimpact \
            --output artifacts/cross_asset_crossimpact \
            2>&1 | tee artifacts/cross_asset_crossimpact/run.log

      - name: Verify frozen contract and causal boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root = Path("artifacts/cross_asset_crossimpact")
          result = json.loads((root / "result_summary.json").read_text())
          manifest = json.loads((root / "source_manifest.json").read_text())
          prereg = json.loads(Path("research/cross_asset_crossimpact_20260726/preregistration.json").read_text())
          candidates = pd.read_csv(root / "candidate_results.csv")
          events = pd.read_csv(root / "development_events.csv.gz")

          assert result["result_id"] == prereg["provisional_result_id"]
          assert result["candidate_count"] == prereg["frozen_candidate_grid"]["candidate_count"] == 576
          assert len(candidates) == 576
          assert result["2024_opened"] is False
          assert result["2025_opened"] is False
          assert result["2026_opened"] is False
          assert result["orders_submitted"] is False
          assert result["paper_or_live_started"] is False
          assert manifest["later_periods_opened"] is False
          assert manifest["orders_submitted"] is False
          assert tuple(manifest["symbols"]) == ("BTCUSDT", "SOLUSDT", "XRPUSDT")
          assert len(manifest["archives"]) == 18
          assert all(str(row["date"]).startswith("2023-") for row in manifest["archives"])
          assert all(int(row["compressed_bytes"]) > 0 and int(row["rows"]) > 0 for row in manifest["archives"])
          assert all(len(str(row["sha256"])) == 64 for row in manifest["archives"])
          assert len(events) == int(result["development_event_rows"])
          assert (events["entry_time"] + 1e-9 >= events["decision_time"] + 0.1).all()
          assert set(events["target"]) <= {"SOLUSDT", "XRPUSDT"}
          assert set(events["stage"]) == {"development"}
          assert set(events["date"]) <= {"2023-08-13", "2023-10-15", "2023-12-10"}
          totals12 = pd.to_numeric(candidates["12bp_total_return"], errors="coerce")
          totals18 = pd.to_numeric(candidates["18bp_total_return"], errors="coerce")
          totals24 = pd.to_numeric(candidates["24bp_total_return"], errors="coerce")
          finite = np.isfinite(totals12) & np.isfinite(totals18) & np.isfinite(totals24)
          assert (totals12[finite] + 1e-12 >= totals18[finite]).all()
          assert (totals18[finite] + 1e-12 >= totals24[finite]).all()
          print("FROZEN_CONTRACT_PASS")
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY

      - name: Attach exact source and build evidence checksums
        if: always()
        run: |
          cp research/cross_asset_crossimpact_20260726/run_screen.py artifacts/cross_asset_crossimpact/RUN_SCREEN.py
          cp research/cross_asset_crossimpact_20260726/preregistration.json artifacts/cross_asset_crossimpact/PREREGISTRATION.json
          cp research/cross_asset_crossimpact_20260726/WORK_CLAIM.json artifacts/cross_asset_crossimpact/WORK_CLAIM.json
          cp research/cross_asset_crossimpact_20260726/README.md artifacts/cross_asset_crossimpact/README.md
          cp research/cross_asset_crossimpact_20260726/SOURCES.md artifacts/cross_asset_crossimpact/SOURCES.md
          cd artifacts/cross_asset_crossimpact
          find . -maxdepth 1 -type f ! -name CI_SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > CI_SHA256SUMS.txt
          sha256sum --check CI_SHA256SUMS.txt
          sha256sum CI_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-asset-crossimpact-${{ github.sha }}
          path: artifacts/cross_asset_crossimpact
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
