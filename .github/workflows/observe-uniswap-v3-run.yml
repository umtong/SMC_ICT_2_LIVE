name: Observe corrected Uniswap workflow

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/observe-uniswap-v3-run.yml"
      - ".github/workflows/uniswap-signed-flow-sqd-economic-v3.yml"
      - "research/uniswap_signed_flow_sqd/PATCH_003_FUNDING_MARK_VALUE.patch"
      - "research/uniswap_signed_flow_sqd/ECONOMIC_MANIFEST.json"
      - "research/uniswap_signed_flow_sqd/AMENDMENT_003_FUNDING_MARK_VALUE.json"

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: List corrected workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/uniswap-signed-flow-sqd-economic-v3.yml/runs?branch=agent%2Fr34-uniswap-signed-flow-sqd-takeover-001&per_page=10" \
            -o runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('runs.json').read_text())
          compact=[{
            'id':r['id'],
            'status':r['status'],
            'conclusion':r['conclusion'],
            'event':r['event'],
            'head_sha':r['head_sha'],
            'run_number':r['run_number'],
            'created_at':r['created_at'],
            'updated_at':r['updated_at'],
          } for r in data.get('workflow_runs',[])]
          print(json.dumps(compact,indent=2,sort_keys=True))
          PY
