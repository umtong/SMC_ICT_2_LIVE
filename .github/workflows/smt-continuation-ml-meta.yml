name: SMT continuation ML meta-label

on:
  pull_request:
    branches: [main]
    paths:
      - "research/smt_continuation_ml_meta_20260726/**"
      - ".github/workflows/smt-continuation-ml-meta.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smt-continuation-ml-meta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  TZ: UTC

jobs:
  chronological-2022:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen extraction and ML environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "scikit-learn==1.6.1" \
            "joblib==1.4.2" \
            "pytest==8.3.4"

      - name: Reconstruct and validate immutable scientific sources once
        shell: bash
        run: |
          set -euo pipefail
          root=research/smt_continuation_ml_meta_20260726
          python "$root/reconstruct.py"
          python "$root/apply_termination_fix.py"
          chmod +x "$root/prepare_parent_sources.sh"
          "$root/prepare_parent_sources.sh" "$PWD" "$RUNNER_TEMP/smt-cont-parent"
          python -m py_compile "$root/extract.py" "$root/train.py" "$root/apply_termination_fix.py"
          PYTHONPATH="$root:$RUNNER_TEMP/smt-cont-parent/acceptance:$RUNNER_TEMP/smt-cont-parent/base" \
            python "$root/extract.py" --self-test
          PYTHONPATH="$root" python "$root/train.py" self-test
          python -m json.tool "$root/preregistration.json" >/dev/null
          python -m json.tool "$root/AMENDMENT_001_CLEAN_SCORE_CALIBRATION_AND_CONFIRMATION_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$root/AMENDMENT_002_ALL_SUNDAYS_SAMPLE_BREADTH_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$root/CORRECTION_003_MISSING_FIT_STAGE_TERMINATION_ONLY.json" >/dev/null
          test -s "$root/TERMINATION_PATCH_SHA256.txt"
          python scripts/validate_project.py

      - uses: actions/cache@v4
        with:
          path: /tmp/smt-continuation-sequential-cache
          key: smt-continuation-sequential-${{ runner.os }}-2022-v1
          restore-keys: |
            smt-continuation-sequential-${{ runner.os }}-

      - name: Replay every frozen 2022 Sunday in chronological order
        shell: bash
        run: |
          set -euo pipefail
          root=research/smt_continuation_ml_meta_20260726
          matrix_root=research_runs/smt_continuation_ml_meta_20260726/matrix_2022
          mkdir -p "$matrix_root"
          dates=(
            2022-01-02 2022-01-09 2022-01-16 2022-01-23 2022-01-30
            2022-02-06 2022-02-13 2022-02-20 2022-02-27
            2022-03-06 2022-03-13 2022-03-20 2022-03-27
            2022-04-03 2022-04-10 2022-04-17 2022-04-24
            2022-05-01 2022-05-08 2022-05-15 2022-05-22 2022-05-29
            2022-06-05 2022-06-12 2022-06-19 2022-06-26
            2022-07-03 2022-07-10 2022-07-17 2022-07-24 2022-07-31
            2022-08-07 2022-08-14 2022-08-21 2022-08-28
            2022-09-04 2022-09-11 2022-09-18 2022-09-25
            2022-10-02 2022-10-09 2022-10-16 2022-10-23 2022-10-30
            2022-11-06 2022-11-13 2022-11-20 2022-11-27
            2022-12-04 2022-12-11 2022-12-18 2022-12-25
          )
          for date in "${dates[@]}"; do
            out="$matrix_root/$date"
            mkdir -p "$out"
            echo "=== EXTRACT $date ===" | tee "$out/DRIVER.log"
            PYTHONPATH="$root:$RUNNER_TEMP/smt-cont-parent/acceptance:$RUNNER_TEMP/smt-cont-parent/base" \
              python "$root/extract.py" \
                --date "$date" \
                --cache /tmp/smt-continuation-sequential-cache \
                --output "$out" \
                2>&1 | tee "$out/RUN.log"
          done

      - name: Fit, calibrate and test untouched 2022 confirmation immediately
        shell: bash
        run: |
          set -euo pipefail
          root=research/smt_continuation_ml_meta_20260726
          input=research_runs/smt_continuation_ml_meta_20260726/matrix_2022
          out=research_runs/smt_continuation_ml_meta_20260726/train_2022
          mkdir -p "$out"
          PYTHONPATH="$root" python "$root/train.py" train \
            --input "$input" \
            --output "$out" \
            2>&1 | tee "$out/RUN.log"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_runs/smt_continuation_ml_meta_20260726')
          freeze=json.loads((root/'train_2022'/'FREEZE.json').read_text())
          result_path=root/'train_2022'/'RESULT.json'
          result=json.loads(result_path.read_text()) if result_path.exists() else {}
          summaries=[]
          for p in sorted((root/'matrix_2022').rglob('summary_*.json')):
              summaries.append(json.loads(p.read_text()))
          compact={
              'claim_id':'CLM-20260726-1906-SMT-CONTINUATION-ML-001',
              'dates_attempted':len(summaries),
              'source_files_verified':sum(int(x.get('source_count',0)) for x in summaries),
              'rows':sum(int(x.get('row_count',0)) for x in summaries),
              'fit_rows':result.get('fit_rows'),
              'score_calibration_rows':result.get('score_calibration_rows'),
              'fit_confirmation_rows':result.get('fit_confirmation_rows'),
              'confirmation_survivor':freeze.get('confirmation_survivor') is True,
              'result_status':result.get('status'),
              'development_opened':result.get('development_opened',False),
              'official_2024_2026_opened':False,
              'orders_submitted':False,
          }
          (root/'train_2022'/'COMPACT_RESULT.json').write_text(json.dumps(compact,indent=2,sort_keys=True)+'\n')
          print(json.dumps(compact,sort_keys=True))
          PY

      - name: Record immutable output hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=research_runs/smt_continuation_ml_meta_20260726
          mkdir -p "$out"
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smt-continuation-ml-chronological-2022-${{ github.sha }}
          path: research_runs/smt_continuation_ml_meta_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
