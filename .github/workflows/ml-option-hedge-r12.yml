name: ML option hedge to Bybit liquidity draw

on:
  pull_request:
    branches: [main]
    paths:
      - "research/ml_option_hedge_20260726/**"
      - ".github/workflows/ml-option-hedge-r12.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-option-hedge-r12-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scipy==1.14.1" \
            "scikit-learn==1.5.2" \
            "requests==2.32.4" \
            "pytest==8.3.4"
      - name: Reconstruct and validate the single model
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_option_hedge_20260726
          out=research_runs/ml_option_hedge_20260726/r12
          mkdir -p "$out"
          ROOT="$root" python - <<'PY' | tee "$out/TRANSPORT_DIAGNOSTIC.json"
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          manifest=json.loads((root/'source_manifest.json').read_text())
          record={'schema_version':1,'parts':{},'combined':{},'market_outcomes_read':False}
          pieces=[]
          for name in sorted(manifest['parts']):
              payload=b''.join((root/name).read_bytes().split())
              expected=manifest['parts'][name]
              actual={'bytes':len(payload),'sha256':hashlib.sha256(payload).hexdigest()}
              actual['matches_expected']=(actual['bytes']==expected['bytes'] and actual['sha256']==expected['sha256'])
              record['parts'][name]={'expected':expected,'actual':actual}
              pieces.append(payload)
          encoded=b''.join(pieces)
          record['combined']['base64_bytes']=len(encoded)
          record['combined']['base64_sha256']=hashlib.sha256(encoded).hexdigest()
          record['combined']['base64_matches_expected']=(len(encoded)==manifest['base64_bytes'] and hashlib.sha256(encoded).hexdigest()==manifest['base64_sha256'])
          try:
              compressed=base64.b64decode(encoded,validate=True)
              record['combined']['gzip_bytes']=len(compressed)
              record['combined']['gzip_sha256']=hashlib.sha256(compressed).hexdigest()
              record['combined']['gzip_matches_expected']=(len(compressed)==manifest['gzip_bytes'] and hashlib.sha256(compressed).hexdigest()==manifest['gzip_sha256'])
              raw=gzip.decompress(compressed)
              record['combined']['raw_bytes']=len(raw)
              record['combined']['raw_sha256']=hashlib.sha256(raw).hexdigest()
              record['combined']['raw_matches_expected']=(len(raw)==manifest['raw_bytes'] and hashlib.sha256(raw).hexdigest()==manifest['raw_sha256'])
              compile(raw,str(root/'run.py'),'exec')
              record['combined']['compile_pass']=True
          except Exception as exc:
              record['combined']['error']=f'{type(exc).__name__}: {exc}'
          print(json.dumps(record,indent=2,sort_keys=True))
          PY
          python "$root/reconstruct.py" 2>&1 | tee "$out/RECONSTRUCT.log"
          python "$root/apply_correction.py" 2>&1 | tee "$out/PREMODEL_CORRECTION.log"
          python -m py_compile "$root/run.py" "$root/test_run.py" 2>&1 | tee "$out/COMPILE.log"
          PYTHONPATH="$root" pytest -q "$root/test_run.py" 2>&1 | tee "$out/PYTEST.log"
          PYTHONPATH="$root" python "$root/run.py" self-test 2>&1 | tee "$out/SELF_TEST.log"
          python scripts/validate_project.py 2>&1 | tee "$out/PROJECT_VALIDATION.log"
          python -m json.tool "$root/preregistration.json" >/dev/null
          python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$root/PREMODEL_FEASIBILITY_CORRECTION_001.json" >/dev/null
      - uses: actions/cache@v4
        with:
          path: /tmp/ml-option-hedge-r12
          key: ml-option-hedge-r12-${{ hashFiles('research/ml_option_hedge_20260726/preregistration.json', 'research/ml_option_hedge_20260726/PREMODEL_FEASIBILITY_CORRECTION_001.json') }}
      - name: Run frozen 2022 and conditional 2023 screen
        shell: bash
        run: |
          set -euo pipefail
          root=research/ml_option_hedge_20260726
          out=research_runs/ml_option_hedge_20260726/r12
          cache=/tmp/ml-option-hedge-r12
          find "$out" -mindepth 1 -maxdepth 1 -type f ! -name 'TRANSPORT_DIAGNOSTIC.json' ! -name 'RECONSTRUCT.log' ! -name 'PREMODEL_CORRECTION.log' ! -name 'COMPILE.log' ! -name 'PYTEST.log' ! -name 'SELF_TEST.log' ! -name 'PROJECT_VALIDATION.log' -delete
          ROOT="$root" OUT="$out" CACHE="$cache" PYTHONPATH="$root" python - <<'PY' 2>&1 | tee "$out/RUN.log"
          import inspect, json, os
          from pathlib import Path
          import pandas as pd
          import run

          out=Path(os.environ['OUT'])
          cache=Path(os.environ['CACHE'])
          original=run.fit_model
          audit={
              'schema_version':1,
              'claim_id':'CLM-20260726-1732-ML-OPTION-HEDGE-001',
              'reconstructed_source_sha256':'cfd0d7c72ebd71d0dc479341fab10fb427033535590260a9016bd85ed438bb4a',
              'executed_source_sha256':'122c2f8e1d49d77a8aa9fa3fe9b074232b6c6af04b66efe6f9f83bf94f85c4d6',
              'premodel_correction_id':'COR-20260726-ML-OPTION-PREMODEL-FEASIBILITY-001',
              'fit_model_source':inspect.getsource(original),
              'model_or_economic_gate_changed':False,
              'premodel_feasibility_changed':True,
              'orders_submitted':False,
              'prohibited_years_opened':[],
          }

          def summarize(frame: pd.DataFrame) -> dict:
              record={'rows':int(len(frame)),'columns':list(frame.columns)}
              small={}
              for name in frame.columns:
                  series=frame[name]
                  try:
                      unique=series.nunique(dropna=False)
                  except Exception:
                      continue
                  if unique <= 12:
                      counts=series.astype(str).value_counts(dropna=False).to_dict()
                      small[name]={str(k):int(v) for k,v in counts.items()}
              record['small_cardinality_counts']=small
              record['null_counts']={name:int(frame[name].isna().sum()) for name in frame.columns}
              return record

          def audited_fit(train: pd.DataFrame, calibration: pd.DataFrame):
              audit['train']=summarize(train)
              audit['calibration']=summarize(calibration)
              (out/'MODEL_FIT_INPUT_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
              try:
                  return original(train,calibration)
              except Exception as exc:
                  audit['exception_type']=type(exc).__name__
                  audit['exception_message']=str(exc)
                  (out/'MODEL_FIT_INPUT_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
                  raise

          run.fit_model=audited_fit
          try:
              run.run(out,cache)
          except RuntimeError as exc:
              if not str(exc).startswith('insufficient resolved rows for one-model fit:'):
                  raise
              audit.setdefault('exception_type',type(exc).__name__)
              audit.setdefault('exception_message',str(exc))
              audit['status']='SOURCE_SAMPLE_INSUFFICIENT_BEFORE_MODEL_FIT'
              audit['development_source_file_count']=0
              (out/'MODEL_FIT_INPUT_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
              print(json.dumps({'status':audit['status'],'train_rows':audit.get('train',{}).get('rows'),'calibration_rows':audit.get('calibration',{}).get('rows')},sort_keys=True))
          PY
      - name: Enforce stage and minimal-system boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_runs/ml_option_hedge_20260726/r12')
          if (root/'RESULT.json').exists():
              result=json.loads((root/'RESULT.json').read_text())
              contract=json.loads((root/'MODEL_CONTRACT.json').read_text())
              environment=json.loads((root/'ENVIRONMENT.json').read_text())
              assert result['claim_id']=='CLM-20260726-1732-ML-OPTION-HEDGE-001'
              assert contract['one_model_family'] is True
              assert contract['hyperparameter_grid'] is False
              assert contract['one_economic_decision_rule'] is True
              assert environment['2024_opened'] is False
              assert environment['2025_opened'] is False
              assert environment['2026_opened'] is False
              assert result['orders_submitted'] is False
              assert result['prohibited_years_opened']==[]
              if not result['fit']['gate_passed']:
                  assert result['development'] is None
                  assert result['development_source_file_count']==0
              for cost in ('12','18','24'):
                  assert result['fit']['paths'][cost]['trade_count'] >= 0
              print(json.dumps({'status':result['status'],'fit_gate':result['fit']['gate_passed']},sort_keys=True))
          else:
              audit=json.loads((root/'MODEL_FIT_INPUT_AUDIT.json').read_text())
              assert audit['status']=='SOURCE_SAMPLE_INSUFFICIENT_BEFORE_MODEL_FIT'
              assert audit['model_or_economic_gate_changed'] is False
              assert audit['premodel_feasibility_changed'] is True
              assert audit['orders_submitted'] is False
              assert audit['prohibited_years_opened']==[]
              assert audit['development_source_file_count']==0
              print(json.dumps({'status':audit['status'],'train_rows':audit['train']['rows'],'calibration_rows':audit['calibration']['rows']},sort_keys=True))
          PY
      - name: Record immutable checksums
        if: always()
        run: |
          root=research/ml_option_hedge_20260726
          out=research_runs/ml_option_hedge_20260726/r12
          mkdir -p "$out"
          sha256sum \
            "$root/preregistration.json" \
            "$root/WORK_CLAIM.json" \
            "$root/AUDIT_TRANSPORT_001.json" \
            "$root/PREMODEL_FEASIBILITY_CORRECTION_001.json" \
            "$root/source_manifest.json" \
            "$root/reconstruct.py" \
            "$root/apply_correction.py" \
            "$root/test_run.py" \
            "$root/run.py" \
            > "$out/INPUT_SHA256SUMS.txt" || true
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-option-hedge-r12-${{ github.sha }}
          path: research_runs/ml_option_hedge_20260726/r12
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
