name: ML option hedge to Bybit liquidity draw

on:
  pull_request:
    branches: [main]
    paths:
      - "research/ml_option_hedge_20260726/**"
      - ".github/workflows/ml-option-hedge-r12.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-option-hedge-r12-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scipy==1.14.1" \
            "scikit-learn==1.5.2" \
            "requests==2.32.4" \
            "pytest==8.3.4"
      - name: Reconstruct and validate the single model
        run: |
          root=research/ml_option_hedge_20260726
          python "$root/reconstruct.py"
          python -m py_compile "$root/run.py" "$root/test_run.py"
          PYTHONPATH="$root" pytest -q "$root/test_run.py"
          PYTHONPATH="$root" python "$root/run.py" self-test
          python scripts/validate_project.py
          python -m json.tool "$root/preregistration.json" >/dev/null
          python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
      - uses: actions/cache@v4
        with:
          path: /tmp/ml-option-hedge-r12
          key: ml-option-hedge-r12-${{ hashFiles('research/ml_option_hedge_20260726/preregistration.json') }}
      - name: Run frozen 2022 and conditional 2023 screen
        run: |
          root=research/ml_option_hedge_20260726
          out=research_runs/ml_option_hedge_20260726/r12
          rm -rf "$out"
          mkdir -p "$out"
          PYTHONPATH="$root" python "$root/run.py" run \
            --output "$out" \
            --cache /tmp/ml-option-hedge-r12 \
            2>&1 | tee "$out/RUN.log"
      - name: Enforce stage and minimal-system boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_runs/ml_option_hedge_20260726/r12')
          result=json.loads((root/'RESULT.json').read_text())
          contract=json.loads((root/'MODEL_CONTRACT.json').read_text())
          environment=json.loads((root/'ENVIRONMENT.json').read_text())
          assert result['claim_id']=='CLM-20260726-1732-ML-OPTION-HEDGE-001'
          assert contract['one_model_family'] is True
          assert contract['hyperparameter_grid'] is False
          assert contract['one_economic_decision_rule'] is True
          assert environment['2024_opened'] is False
          assert environment['2025_opened'] is False
          assert environment['2026_opened'] is False
          assert result['orders_submitted'] is False
          assert result['prohibited_years_opened']==[]
          if not result['fit']['gate_passed']:
              assert result['development'] is None
              assert result['development_source_file_count']==0
          for cost in ('12','18','24'):
              assert result['fit']['paths'][cost]['trade_count'] >= 0
          print(json.dumps({'status':result['status'],'fit_gate':result['fit']['gate_passed']},sort_keys=True))
          PY
      - name: Record immutable checksums
        if: always()
        run: |
          root=research/ml_option_hedge_20260726
          out=research_runs/ml_option_hedge_20260726/r12
          mkdir -p "$out"
          sha256sum \
            "$root/preregistration.json" \
            "$root/WORK_CLAIM.json" \
            "$root/source_manifest.json" \
            "$root/reconstruct.py" \
            "$root/test_run.py" \
            "$root/run.py" \
            > "$out/INPUT_SHA256SUMS.txt" || true
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-option-hedge-r12-${{ github.sha }}
          path: research_runs/ml_option_hedge_20260726/r12
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
