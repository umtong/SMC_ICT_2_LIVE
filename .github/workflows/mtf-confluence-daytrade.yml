name: MTF confluence day-trading semantic tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/mtf_confluence_daytrade/**'
      - '.github/workflows/mtf-confluence-daytrade.yml'
  push:
    branches: [agent/r23-mtf-confluence-daytrade-001]
    paths:
      - 'research/mtf_confluence_daytrade/**'
      - '.github/workflows/mtf-confluence-daytrade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'numba==0.61.0' 'pytest==8.3.4'
      - name: Materialize hash-bound evaluator
        run: python research/mtf_confluence_daytrade/materialize.py
      - name: Compile and test semantic invariants
        run: |
          python -m py_compile research/mtf_confluence_daytrade/run.py research/mtf_confluence_daytrade/evaluate.py
          python research/mtf_confluence_daytrade/run.py --self-test
          pytest -q research/mtf_confluence_daytrade/test_run.py
