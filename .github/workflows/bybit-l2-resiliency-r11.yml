name: Bybit L2 cancellation-replenishment aggressive alpha

on:
  push:
    branches:
      - agent/r11-l2-resiliency-alpha-001
    paths:
      - "research/bybit_l2_resiliency_20260726/**"
      - ".github/workflows/bybit-l2-resiliency-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/bybit_l2_resiliency_20260726/**"
      - ".github/workflows/bybit-l2-resiliency-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bybit-l2-resiliency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fatal-alpha-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen research environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scikit-learn==1.6.1" \
            "requests==2.32.4" \
            "pyarrow==18.1.0" \
            "pytest==8.3.4"

      - name: Compile and run causal execution tests
        run: |
          set -euo pipefail
          root=research/bybit_l2_resiliency_20260726
          python "$root/reconstruct.py"
          python -m py_compile "$root/reconstruct.py" "$root/run_screen.py" "$root/test_run_screen.py"
          python "$root/run_screen.py" self-test
          python -m pytest -q "$root/test_run_screen.py"
          python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$root/preregistration.json" >/dev/null

      - name: Run frozen Bybit-native fatal alpha screen
        run: |
          set -euo pipefail
          root=research/bybit_l2_resiliency_20260726
          mkdir -p research_runs/bybit_l2_resiliency
          python "$root/run_screen.py" run \
            --cache "$RUNNER_TEMP/bybit-l2-resiliency-cache" \
            --output research_runs/bybit_l2_resiliency/output \
            2>&1 | tee research_runs/bybit_l2_resiliency/run.log

      - name: Verify boundary and evidence
        if: always()
        run: |
          set -euo pipefail
          root=research_runs/bybit_l2_resiliency/output
          if test -f "$root/RESULT.json"; then
            (cd "$root" && sha256sum --check SHA256SUMS.txt)
            python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("research_runs/bybit_l2_resiliency/output/RESULT.json").read_text())
          assert result["2024_opened"] is False
          assert result["2025_or_2026_opened"] is False
          assert result["orders_submitted"] is False
          assert result["rank_eligible"] is False
          assert result["candidate_count"] == 324
          print(json.dumps(result, sort_keys=True))
          PY
          fi
          python scripts/validate_project.py

      - name: Record immutable inputs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research_runs/bybit_l2_resiliency
          sha256sum \
            research/bybit_l2_resiliency_20260726/WORK_CLAIM.json \
            research/bybit_l2_resiliency_20260726/preregistration.json \
            research/bybit_l2_resiliency_20260726/README.md \
            research/bybit_l2_resiliency_20260726/SOURCES.md \
            research/bybit_l2_resiliency_20260726/reconstruct.py \
            research/bybit_l2_resiliency_20260726/bundle_manifest.json \
            research/bybit_l2_resiliency_20260726/source_bundle.tar.gz.b64 \
            .github/workflows/bybit-l2-resiliency-r11.yml \
            > research_runs/bybit_l2_resiliency/INPUT_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bybit-l2-resiliency-${{ github.sha }}
          path: research_runs/bybit_l2_resiliency
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
