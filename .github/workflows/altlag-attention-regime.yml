name: Bybit attention-conditioned SOL XRP residual replication

on:
  push:
    branches:
      - agent/r11-altlag-attention-regime-001
    paths:
      - "research/bybit_altlag_attention_regime_20260726/**"
      - ".github/workflows/altlag-attention-regime.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/bybit_altlag_attention_regime_20260726/**"
      - ".github/workflows/altlag-attention-regime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: altlag-attention-regime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fixed environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.2.6" "pandas==2.2.3" "requests==2.32.4"

      - name: Reconstruct and verify frozen source
        shell: bash
        run: |
          set -euo pipefail
          root=research/bybit_altlag_attention_regime_20260726
          python - <<'PY'
          import base64, hashlib, pathlib, zlib
          root=pathlib.Path('research/bybit_altlag_attention_regime_20260726')
          encoded=(root/'probe.py.zlib.b64').read_text().strip()
          source=zlib.decompress(base64.b64decode(encoded))
          observed=hashlib.sha256(source).hexdigest()
          expected='807e0a0f6b894d2373935ef560e68af9a8f0865574dc6ae75c4b91ead04dad17'
          assert observed == expected, (observed, expected)
          (root/'probe.py').write_bytes(source)
          print('probe source sha256', observed)
          PY
          python -m py_compile "$root/probe.py"
          python scripts/validate_project.py
          mkdir -p research_runs/bybit_altlag_attention_regime_20260726
          sha256sum "$root/preregistration.json" "$root/probe.py.zlib.b64" "$root/probe.py" > research_runs/bybit_altlag_attention_regime_20260726/INPUT_SHA256SUMS.txt

      - name: Reproduce prior dependency then open unseen dates
        shell: bash
        run: |
          set -euo pipefail
          root=research/bybit_altlag_attention_regime_20260726
          PYTHONPATH="$root" python "$root/probe.py" \
            --output research_runs/bybit_altlag_attention_regime_20260726/result \
            --cache "$RUNNER_TEMP/bybit-altlag-regime-cache" \
            2>&1 | tee research_runs/bybit_altlag_attention_regime_20260726/probe.log

      - name: Enforce causal and no-PnL boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_runs/bybit_altlag_attention_regime_20260726/result')
          reproduction=json.loads((root/'reproduction/result.json').read_text())
          result=json.loads((root/'replication/result.json').read_text())
          assert reproduction['status'] == 'PASS'
          assert result['status'] in {'REGIME_OPPORTUNITY_GATE_PASS','REGIME_OPPORTUNITY_GATE_FAIL'}
          assert result['dependency_reproduction_passed'] is True
          assert result['pnl_computed'] is False
          assert result['entry_exit_strategy_frozen'] is False
          assert result['funding_opened'] is False
          assert result['2024_2026_opened'] is False
          assert result['orders_submitted'] is False
          assert len(result['sources']) == 9
          assert all(x['timestamp_monotonic'] for x in result['sources'])
          print(json.dumps({'status':result['status'],'aggregate':result['aggregate'],'gate_checks':result['gate_checks']},sort_keys=True))
          PY

      - name: Record immutable output checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research_runs/bybit_altlag_attention_regime_20260726
          find "$root" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$root/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bybit-altlag-attention-regime-${{ github.sha }}
          path: research_runs/bybit_altlag_attention_regime_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
