name: USD-M dated-futures curve-state screen

on:
  push:
    branches:
      - agent/r11-usdm-curve-state-001
    paths:
      - "research/usdm_curve_state_20260726/**"
      - ".github/workflows/usdm-curve-state-r11.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/usdm_curve_state_20260726/**"
      - ".github/workflows/usdm-curve-state-r11.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: usdm-curve-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen research environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "requests==2.32.4" \
            "pytest==8.3.4"

      - name: Compile and run deterministic tests
        run: |
          set -euo pipefail
          root=research/usdm_curve_state_20260726
          python -m py_compile "$root/run_screen.py" "$root/test_run_screen.py"
          python -m pytest -q "$root/test_run_screen.py"
          mkdir -p research_runs/usdm_curve_state/self_test
          python "$root/run_screen.py" \
            --self-test \
            --output research_runs/usdm_curve_state/self_test \
            --cache "$RUNNER_TEMP/usdm-curve-cache"
          (cd research_runs/usdm_curve_state/self_test && sha256sum --check SHA256SUMS.txt)

      - name: Run frozen 2021-2023 source and economic screen
        run: |
          set -euo pipefail
          root=research/usdm_curve_state_20260726
          mkdir -p research_runs/usdm_curve_state/output
          python "$root/run_screen.py" \
            --output research_runs/usdm_curve_state/output \
            --cache "$RUNNER_TEMP/usdm-curve-cache" \
            2>&1 | tee research_runs/usdm_curve_state/screen.log

      - name: Verify result safety and project integrity
        run: |
          set -euo pipefail
          (cd research_runs/usdm_curve_state/output && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("research_runs/usdm_curve_state/output/RESULT.json").read_text())
          assert result["orders_submitted"] is False
          assert result["2025_or_2026_opened"] is False
          if result.get("development", {}).get("gate_pass_count") == 0:
              assert result["2024_downloaded"] is False
          print(json.dumps({
              "status": result["status"],
              "hard_validity": result["hard_validity_status"],
              "economic": result["economic_status"],
              "2024_downloaded": result["2024_downloaded"],
          }, sort_keys=True))
          PY
          python scripts/validate_project.py

      - name: Record immutable input hashes
        if: always()
        run: |
          set -euo pipefail
          sha256sum \
            research/usdm_curve_state_20260726/preregistration.json \
            research/usdm_curve_state_20260726/README.md \
            research/usdm_curve_state_20260726/run_screen.py \
            research/usdm_curve_state_20260726/test_run_screen.py \
            .github/workflows/usdm-curve-state-r11.yml \
            > research_runs/usdm_curve_state/INPUT_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usdm-curve-state-${{ github.sha }}
          path: research_runs/usdm_curve_state
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
