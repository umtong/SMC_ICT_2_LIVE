name: Cross-margin contingent frozen selection

on:
  push:
    branches:
      - agent/r5-cross-margin-dislocation-001
    paths:
      - "research/cross_margin_dislocation_20260725/tardis_selection_v2.py"
      - "research_results/r5_cross_margin_dislocation_001/STATUS_DEVELOPMENT_PASS.txt"
      - ".github/workflows/cross-margin-tardis-selection.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r5-cross-margin-tardis-selection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-cross-margin-dislocation-001
          fetch-depth: 1

      - name: Enforce development pass precondition
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/r5-cross-margin-dislocation-001
          git reset --hard origin/agent/r5-cross-margin-dislocation-001
          ready=false
          if [[ -f research_results/r5_cross_margin_dislocation_001/STATUS_DEVELOPMENT_PASS.txt \
             && -f research_results/r5_cross_margin_dislocation_001/tardis_development_result.json ]]; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          mkdir -p research_runs/cross_margin_dislocation_20260725/tardis_selection
          python - "$ready" <<'PY'
          import json, pathlib, sys
          pathlib.Path('research_runs/cross_margin_dislocation_20260725/tardis_selection/PRECONDITION.json').write_text(
              json.dumps({
                  'development_pass':sys.argv[1]=='true',
                  'selection_opened':False,
                  'confirmation_opened':False,
                  '2026_opened':False,
                  'orders_submitted':False,
              },indent=2,sort_keys=True)+'\n')
          PY

      - name: Install fixed environment
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "requests==2.32.4"

      - name: Verify and run frozen 2024 selection
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_margin_dislocation_20260725
          runroot=research_runs/cross_margin_dislocation_20260725/tardis_selection
          python -m py_compile "$root/tardis_pilot.py" "$root/tardis_development_v2.py" "$root/tardis_selection_v2.py"
          sha256sum "$root/preregistration_tardis_v2.json" "$root/tardis_pilot.py" "$root/tardis_development_v2.py" "$root/tardis_selection_v2.py" > "$runroot/INPUT_SHA256SUMS.txt"
          PYTHONPATH="$root" python "$root/tardis_selection_v2.py" \
            --predecessor research_results/r5_cross_margin_dislocation_001/tardis_development_result.json \
            --output "$runroot/result" \
            --cache "$RUNNER_TEMP/cross-margin-selection-cache" \
            2>&1 | tee "$runroot/selection.log"

      - name: Commit durable selection decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_results/r5_cross_margin_dislocation_001
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('research_runs/cross_margin_dislocation_20260725/tardis_selection')
          output=pathlib.Path('research_results/r5_cross_margin_dislocation_001')
          pre=json.loads((root/'PRECONDITION.json').read_text())
          path=root/'result'/'SELECTION_RESULT.json'
          selection=json.loads(path.read_text()) if path.exists() else None
          if not pre['development_pass']:
              status='SELECTION_NOT_ACTIVATED_DEVELOPMENT_NOT_PASSED'
          elif selection is None:
              status='SELECTION_INFRA_FAILURE'
          elif int(selection.get('selection_gate_pass_count',0))>0:
              status='SELECTION_PASS'
          else:
              status='SELECTION_NO_EDGE'
          result={
              'schema_version':2,
              'result_id':'RES-20260725-CROSS-MARGIN-SELECTION-002',
              'claim_id':'CLM-20260725-2120-CROSS-MARGIN-001',
              'status':status,
              'precondition':pre,
              'selection':selection,
              'confirmation_opened':False,
              '2026_opened':False,
              'orders_submitted':False,
              'paper_live_started':False,
              'champion_eligible':False,
              'target_1pct_daily_test_admissible':False,
          }
          durable=output/'tardis_selection_result.json'
          durable.write_text(json.dumps(result,indent=2,sort_keys=True,default=str)+'\n')
          (output/'tardis_selection_result.sha256').write_text(hashlib.sha256(durable.read_bytes()).hexdigest()+'  tardis_selection_result.json\n')
          for old in output.glob('STATUS_SELECTION_*.txt'):
              old.unlink()
          (output/f'STATUS_{status}.txt').write_text(json.dumps({'status':status,'selection_gate_pass_count':0 if not selection else int(selection.get('selection_gate_pass_count',0)),'confirmation_opened':False,'2026_opened':False,'orders_submitted':False},indent=2,sort_keys=True)+'\n')
          PY
          find research_results/r5_cross_margin_dislocation_001 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > research_results/r5_cross_margin_dislocation_001/SHA256SUMS.txt
          git config user.name "smc-ict-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_results/r5_cross_margin_dislocation_001
          if ! git diff --cached --quiet; then
            git commit -m "Record contingent cross-margin selection decision"
            git push origin HEAD:agent/r5-cross-margin-dislocation-001
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-margin-tardis-selection-${{ github.sha }}
          path: research_runs/cross_margin_dislocation_20260725/tardis_selection
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
