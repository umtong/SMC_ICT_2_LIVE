name: YT Trinity grouped causal action-value model wire

on:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - .github/workflows/yt-trinity-grouped-action-model-wire.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-grouped-action-model-wire
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wire grouped model into frozen selection and evaluation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('research/yt_trinity_ml/run_causal_action_v1.py')
          text=p.read_text()
          import_marker='from system.research_pipeline import generate_candidates_by_symbol\n'
          # The candidate import may already have been replaced by the causal universe.
          if 'from system.causal_action_model import GroupedCausalActionValueModel' not in text:
              anchor='from system.core import EventCandidate, FeatureConfig\n'
              if anchor not in text:
                  raise SystemExit('v1 import anchor missing')
              text=text.replace(anchor,anchor+'from system.causal_action_model import GroupedCausalActionValueModel\n',1)
          start=text.index('def _fit(')
          end=text.index('\n\ndef _account(',start)
          replacement='''def _fit(rows: pd.DataFrame, features: Sequence[str]) -> GroupedCausalActionValueModel:\n    return GroupedCausalActionValueModel().fit(rows, features)\n\n\ndef _score_rows(\n    model: GroupedCausalActionValueModel,\n    rows: pd.DataFrame,\n    features: Sequence[str],\n) -> pd.DataFrame:\n    scored = rows.copy()\n    predictions = model.predict(scored)\n    if len(predictions) != len(scored):\n        raise RuntimeError("grouped action model did not score every row")\n    for name in predictions.columns:\n        if name == "action":\n            continue\n        scored[name] = predictions.loc[scored.index, name]\n    scored["score"] = scored["lower_confidence_net_r"]\n    return scored\n'''
          text=text[:start]+replacement+text[end:]
          text=text.replace(
              '        validation_variant["score"] = model.predict(validation_variant[features])\n',
              '        validation_variant = _score_rows(model, validation_variant, features)\n',
              1,
          )
          text=text.replace(
              '    all_pre["score"] = model.predict(all_pre[features])\n',
              '    all_pre = _score_rows(model, all_pre, features)\n',
              1,
          )
          text=text.replace(
              '    rows_2024["score"] = model.predict(rows_2024[features])\n',
              '    rows_2024 = _score_rows(model, rows_2024, features)\n',
              1,
          )
          text=text.replace(
              '        "feature_count": len(features),\n',
              '        "feature_count": len(features),\n        "grouped_action_model_fingerprint": model.fingerprint(),\n        "grouped_action_model_diagnostics": model.diagnostics(),\n',
              1,
          )
          p.write_text(text)

          full=Path('research/yt_trinity_ml/run_causal_action_full.py')
          text=full.read_text()
          text=text.replace(
              '    _fit,\n',
              '    _fit,\n    _score_rows,\n',
              1,
          )
          text=text.replace(
              '    training["score"] = model.predict(training[features])\n',
              '    training = _score_rows(model, training, features)\n',
              1,
          )
          text=text.replace(
              '    rows["score"] = model.predict(rows[features])\n',
              '    rows = _score_rows(model, rows, features)\n',
              1,
          )
          text=text.replace(
              '            "feature_count": len(features),\n',
              '            "feature_count": len(features),\n            "grouped_action_model_fingerprint": model.fingerprint(),\n            "grouped_action_model_diagnostics": model.diagnostics(),\n',
              1,
          )
          full.write_text(text)
          PY
          python -m pip install -q \
            "numpy==2.2.6" "pandas==2.2.3" "scikit-learn==1.6.1" \
            "pyarrow==19.0.1" "pytest==8.3.5"
          python -m py_compile \
            research/yt_trinity_ml/system/causal_action_model.py \
            research/yt_trinity_ml/run_causal_action_v1.py \
            research/yt_trinity_ml/run_causal_action_full.py
          git rm .github/workflows/yt-trinity-grouped-action-model-wire.yml
      - name: Commit grouped action model integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            research/yt_trinity_ml/system/causal_action_model.py \
            research/yt_trinity_ml/run_causal_action_v1.py \
            research/yt_trinity_ml/run_causal_action_full.py
          git commit -m 'Use grouped causal action-value heads'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
