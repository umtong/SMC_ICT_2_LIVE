name: Rejection Block exact 100ms takeover

on:
  push:
    branches:
      - agent/r24-rejection-block-100ms-takeover-001
    paths:
      - "research/rejection_block_100ms_takeover/**"
      - ".github/workflows/rejection-block-100ms-takeover.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/rejection_block_100ms_takeover/**"
      - ".github/workflows/rejection-block-100ms-takeover.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rejection-block-100ms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corrected-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "pyarrow==18.1.0" "pytest==8.3.4"
      - name: Download immutable causal state artifact
        uses: actions/download-artifact@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          run-id: 30183063220
          name: bybit-l2-resiliency-ce9150a0b06f4864dd8021a63ac6b3238be2b216
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reused/bybit_l2_resiliency
      - name: Verify source and reconstruct archived evaluator
        run: |
          set -euo pipefail
          (cd reused/bybit_l2_resiliency/output && sha256sum --check SHA256SUMS.txt)
          echo "da8f581e64ba6f5305c57c0d76403b262d1b0ff48ad540e19302f6bf7416c38b  reused/bybit_l2_resiliency/output/compact_states/2022-07-01_BTCUSDT_state.parquet" | sha256sum --check
          echo "8872cd2a21960666f10f3d35c788a16faefd007d02a30389079def794e90389f  reused/bybit_l2_resiliency/output/compact_states/2023-07-01_BTCUSDT_state.parquet" | sha256sum --check
          old=research/rejection_block_20260726
          python "$old/reconstruct.py"
          python -m py_compile \
            "$old/run_screen.py" \
            "$old/test_run_screen.py" \
            research/rejection_block_100ms_takeover/probe_frequency.py \
            research/rejection_block_100ms_takeover/patch_frequency.py \
            research/rejection_block_100ms_takeover/finalize_result.py
      - name: Probe and patch exactly two source-frequency assumptions
        run: |
          set -euo pipefail
          root=research/rejection_block_100ms_takeover
          old=research/rejection_block_20260726
          mkdir -p research_runs/rejection_block_100ms/patch
          python "$root/probe_frequency.py" \
            --source-dir "$old" \
            --output research_runs/rejection_block_100ms/patch/PROBE.json
          python "$root/patch_frequency.py" \
            --source "$old/run_screen.py" \
            --diff research_runs/rejection_block_100ms/patch/SOURCE_FREQUENCY.patch \
            --result research_runs/rejection_block_100ms/patch/PATCH_RESULT.json
          cat research_runs/rejection_block_100ms/patch/SOURCE_FREQUENCY.patch
          python -m py_compile "$old/run_screen.py" "$old/test_run_screen.py"
          python "$old/run_screen.py" self-test
          python -m pytest -q "$old/test_run_screen.py"
      - name: Run frozen corrected fit and conditional development screen
        run: |
          set -euo pipefail
          old=research/rejection_block_20260726
          out=research_runs/rejection_block_100ms/screen
          mkdir -p "$out"
          python "$old/run_screen.py" run \
            --fit reused/bybit_l2_resiliency/output/compact_states/2022-07-01_BTCUSDT_state.parquet \
            --development reused/bybit_l2_resiliency/output/compact_states/2023-07-01_BTCUSDT_state.parquet \
            --output "$out" \
            2>&1 | tee research_runs/rejection_block_100ms/run.log
      - name: Finalize corrected decision
        run: |
          set -euo pipefail
          root=research/rejection_block_100ms_takeover
          python "$root/finalize_result.py" \
            --screen-output research_runs/rejection_block_100ms/screen \
            --patch-result research_runs/rejection_block_100ms/patch/PATCH_RESULT.json \
            --patch-diff research_runs/rejection_block_100ms/patch/SOURCE_FREQUENCY.patch \
            --output research_runs/rejection_block_100ms/final
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('research_runs/rejection_block_100ms/final/RESULT.json').read_text())
          assert result['result_id']=='RES-20260730-REJECTION-BLOCK-100MS-CORRECTED-001'
          assert result['official_2024_2026_opened'] is False
          assert result['orders_submitted'] is False
          assert result['scarcity']['candidate_count']==216
          assert result['patch']['replacement_count']==2
          print(json.dumps(result, sort_keys=True))
          PY
          sha256sum \
            research_runs/rejection_block_100ms/patch/* \
            research_runs/rejection_block_100ms/screen/* \
            research_runs/rejection_block_100ms/final/* \
            > research_runs/rejection_block_100ms/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rejection-block-100ms-result-${{ github.sha }}
          path: research_runs/rejection_block_100ms
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
