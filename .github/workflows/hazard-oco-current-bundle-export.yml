name: ML hazard OCO current bundle byte audit

on:
  push:
    branches:
      - agent/r11-hazard-oco-v2
    paths:
      - research/hazard_oco_20260726/run_v2.py.gz.b64.part*
      - research/hazard_oco_20260726/test_run_v2.py.gz.b64
      - research/hazard_oco_20260726/v2_bundle_manifest.json
      - research/hazard_oco_20260726/reconstruct_v2.py
      - .github/workflows/hazard-oco-current-bundle-export.yml
  pull_request:
    branches: [main]
    paths:
      - research/hazard_oco_20260726/run_v2.py.gz.b64.part*
      - research/hazard_oco_20260726/test_run_v2.py.gz.b64
      - research/hazard_oco_20260726/v2_bundle_manifest.json
      - research/hazard_oco_20260726/reconstruct_v2.py
      - .github/workflows/hazard-oco-current-bundle-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy exact tracked bytes and require exact reconstruction
        shell: bash
        run: |
          set -euo pipefail
          root=research/hazard_oco_20260726
          out=research_runs/hazard_oco_current_bundle
          mkdir -p "$out/tracked"
          cp "$root"/run_v2.py.gz.b64.part* "$out/tracked/"
          cp "$root/test_run_v2.py.gz.b64" "$out/tracked/"
          cp "$root/v2_bundle_manifest.json" "$out/tracked/"
          cp "$root/reconstruct_v2.py" "$out/tracked/"
          sha256sum "$out"/tracked/* > "$out/TRACKED_SHA256SUMS.txt"
          python "$root/reconstruct_v2.py" | tee "$out/reconstruction.stdout"
          echo 0 > "$out/reconstruction.status"
          cp "$root/run_v2.py" "$out/"
          cp "$root/test_run_v2.py" "$out/"
          sha256sum "$root/run_v2.py" "$root/test_run_v2.py" > "$out/RECONSTRUCTED_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: hazard-oco-current-bundle-${{ github.sha }}
          path: research_runs/hazard_oco_current_bundle
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
