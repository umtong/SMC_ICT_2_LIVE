name: Stablecoin Blockscout source gate

on:
  push:
    branches: [agent/r13-ml-stablecoin-issuance-001]
    paths:
      - '.github/workflows/ml-stablecoin-blockscout-batch-source.yml'
      - 'research/ml_stablecoin_issuance_20260726/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ml-stablecoin-blockscout-batch-source.yml'
      - 'research/ml_stablecoin_issuance_20260726/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stablecoin-blockscout-batch-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: macos-14
    timeout-minutes: 240
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
      ROOT: research/ml_stablecoin_issuance_20260726
      OUT: research_runs/ml_stablecoin_issuance_20260726/blockscout_batch_source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-ml-stablecoin-issuance-001
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate corrected source identity before network access
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests==2.32.4 pytest==8.3.5
          mkdir -p "$OUT/source"
          python -m py_compile "$ROOT"/source_gate*.py "$ROOT"/test_source_gate.py
          PYTHONPATH="$ROOT" pytest -q "$ROOT/test_source_gate.py" | tee "$OUT/PYTEST.log"
          PYTHONPATH="$ROOT" python "$ROOT/source_gate_blockscout_authoritative.py" --self-test | tee "$OUT/AUTHORITY_SELF_TEST.log"
          PYTHONPATH="$ROOT" python "$ROOT/source_gate_blockscout_batch_authoritative.py" --self-test | tee "$OUT/BATCH_SELF_TEST.log"
          python -m json.tool "$ROOT/CORRECTION_010_USDT_ISSUE_REDEEM_EVENT_SCHEMA_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$ROOT/CORRECTION_011_BLOCKSCOUT_NULL_TOPIC_PADDING_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$ROOT/EXECUTION_CORRECTION_017_SCHEMA_BOUND_BATCH_ARTIFACT_BEFORE_OUTCOME.json" >/dev/null

      - name: Query complete pre-2024 issuance source only
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH="$ROOT" python "$ROOT/source_gate_blockscout_batch_authoritative.py" \
            --output "$OUT" 2>&1 | tee "$OUT/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$OUT/RUN_EXIT_CODE.txt"
          if [[ ! -f "$OUT/SOURCE_GATE_RESULT.json" ]]; then
            python "$ROOT/write_transport_failure.py" \
              --output "$OUT" \
              --transport TRANSPORT-20260726-ML-STABLECOIN-SCHEMA-BOUND-BATCH-005 \
              --exit-code "$rc"
          fi
          exit 0

      - name: Verify source decision, schema binding and outcome seal
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['OUT'])
          result = json.loads((out / 'SOURCE_GATE_RESULT.json').read_text())
          assert result['claim_id'] == 'CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert result['status'] in {
              'PASS',
              'FAIL_BELOW_SOURCE_DENSITY_OR_COVERAGE',
              'SOURCE_UNAVAILABLE_OR_TRANSPORT_FAILURE',
          }
          assert result['market_outcome_opened'] is False
          assert result['model_fit'] is False
          assert result['trade_or_pnl_opened'] is False
          assert result['official_2024_2026_opened'] is False
          assert result['orders_submitted'] is False

          if result['status'] == 'PASS':
              manifest = json.loads((out / 'SOURCE_MANIFEST.json').read_text())
              events = out / 'EVENTS.jsonl'
              expected_schema = 'STABLECOIN_SUPPLY_USDT_ISSUE_REDEEM_USDC_ZERO_TRANSFER_V1'
              expected_correction = 'CORRECTION-20260726-ML-STABLECOIN-USDT-ISSUE-REDEEM-010'
              assert result['source_schema_id'] == expected_schema
              assert result['source_correction_id'] == expected_correction
              assert manifest['source_schema_id'] == expected_schema
              assert manifest['source_correction_id'] == expected_correction
              assert result['event_semantics']['ordinary_usdt_transfer_excluded'] is True
              assert manifest['event_semantics']['ordinary_usdt_transfer_excluded'] is True
              assert hashlib.sha256(events.read_bytes()).hexdigest() == manifest['events_sha256']
              assert result['conditional_model_screen_authorized'] is True

          print(json.dumps({
              'status': result['status'],
              'events': result.get('event_count'),
              'months': len(result.get('months_with_events', [])),
              'tokens': result.get('distinct_tokens'),
              'schema': result.get('source_schema_id'),
              'authorized': result.get('conditional_model_screen_authorized', False),
          }, sort_keys=True))
          PY

      - name: Preserve complete current-head source evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT/source"
          cp "$ROOT"/*.json "$ROOT"/*.md "$ROOT"/source_gate*.py \
             "$ROOT"/test_source_gate.py "$ROOT"/verify_source_result.py \
             "$ROOT"/write_transport_failure.py "$OUT/source/"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          out=Path(os.environ['OUT'])
          rows=[]
          for path in sorted(p for p in out.rglob('*') if p.is_file() and p.name!='OUTPUT_SHA256SUMS.txt'):
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.as_posix()}\n")
          (out/'OUTPUT_SHA256SUMS.txt').write_text(''.join(rows),encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-blockscout-batch-source-${{ github.run_id }}
          path: research_runs/ml_stablecoin_issuance_20260726/blockscout_batch_source
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
