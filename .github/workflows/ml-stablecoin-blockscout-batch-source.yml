name: Stablecoin Blockscout source gate

on:
  push:
    branches: [agent/r13-ml-stablecoin-issuance-001]
    paths:
      - '.github/workflows/ml-stablecoin-blockscout-batch-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stablecoin-blockscout-batch-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-ml-stablecoin-issuance-001
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fixed source environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests==2.32.4 pytest==8.3.5

      - name: Validate frozen corrected event identity
        run: |
          set -euo pipefail
          root=research/ml_stablecoin_issuance_20260726
          out=research_runs/ml_stablecoin_issuance_20260726/blockscout_batch_source
          mkdir -p "$out"
          python -m py_compile "$root"/source_gate*.py "$root/test_source_gate.py"
          PYTHONPATH="$root" pytest -q "$root/test_source_gate.py" 2>&1 | tee "$out/PYTEST.log"
          PYTHONPATH="$root" python "$root/source_gate_blockscout_authoritative.py" --self-test 2>&1 | tee "$out/SELF_TEST.log"

      - name: Run identical source contract with batched exact block timestamps
        run: |
          set -euo pipefail
          root=research/ml_stablecoin_issuance_20260726
          out=research_runs/ml_stablecoin_issuance_20260726/blockscout_batch_source
          cat > "$RUNNER_TEMP/stablecoin_batch_source.py" <<'PY'
          from __future__ import annotations

          import argparse
          import json
          import time
          from pathlib import Path
          from typing import Any, Iterable

          import source_gate_blockscout as source
          import source_gate_blockscout_authoritative as authority

          RPC_ENDPOINT = "https://eth.blockscout.com/api/eth-rpc"
          BATCH_SIZE = 40
          REQUEST_INTERVAL_SECONDS = 0.36
          BaseClient = source.BlockscoutClient


          class ExactBatchClient(BaseClient):
              """Same Blockscout source identity with exact JSON-RPC block batches."""

              def _post_batch(self, block_numbers: Iterable[int]) -> dict[int, int]:
                  numbers = tuple(dict.fromkeys(int(value) for value in block_numbers))
                  payload = []
                  id_to_block: dict[int, int] = {}
                  for request_id, block_number in enumerate(numbers, start=1):
                      id_to_block[request_id] = block_number
                      payload.append({
                          "jsonrpc": "2.0",
                          "id": request_id,
                          "method": "eth_getBlockByNumber",
                          "params": [hex(block_number), False],
                      })

                  last: Exception | None = None
                  for attempt in range(6):
                      try:
                          elapsed = time.monotonic() - self.last_request_at
                          if elapsed < REQUEST_INTERVAL_SECONDS:
                              time.sleep(REQUEST_INTERVAL_SECONDS - elapsed)
                          response = self.session.post(
                              RPC_ENDPOINT,
                              json=payload,
                              timeout=(15, 90),
                          )
                          self.last_request_at = time.monotonic()
                          self.request_count += 1
                          if response.status_code == 429 or response.status_code >= 500:
                              raise source.BlockscoutError(
                                  f"HTTP {response.status_code}: {response.text[:300]}"
                              )
                          response.raise_for_status()
                          body = response.json()
                          if not isinstance(body, list):
                              raise source.BlockscoutError(
                                  f"batch response must be list, got {type(body)!r}"
                              )
                          by_id = {
                              int(item["id"]): item
                              for item in body
                              if isinstance(item, dict) and "id" in item
                          }
                          result: dict[int, int] = {}
                          for request_id, block_number in id_to_block.items():
                              item = by_id.get(request_id)
                              if item is None:
                                  raise source.BlockscoutError(
                                      f"missing batch response for block {block_number}"
                                  )
                              if item.get("error") is not None:
                                  raise source.BlockscoutError(
                                      json.dumps(item["error"], sort_keys=True)
                                  )
                              block = item.get("result")
                              if block is None:
                                  raise source.BlockscoutError(
                                      f"missing block result {block_number}"
                                  )
                              result[block_number] = source.parse_int(block["timestamp"])
                          return result
                      except Exception as exc:
                          last = exc
                          self.errors.append(
                              f"{RPC_ENDPOINT}: {type(exc).__name__}: {exc}"
                          )
                          if attempt + 1 < 6:
                              time.sleep(min(20.0, 1.5 * (2 ** attempt)))
                  raise source.BlockscoutError(
                      f"exact block timestamp batch failed: {last!r}"
                  )

              def block_timestamp(self, block_number: int) -> int:
                  number = int(block_number)
                  cached = self.block_timestamp_cache.get(number)
                  if cached is not None:
                      return cached
                  start = max(0, number - 8)
                  candidates = range(start, start + BATCH_SIZE)
                  try:
                      self.block_timestamp_cache.update(self._post_batch(candidates))
                  except Exception:
                      # Fail closed to the original exact REST lookup. No timestamp
                      # is approximated or imputed when batch transport is rejected.
                      return super().block_timestamp(number)
                  if number not in self.block_timestamp_cache:
                      raise source.BlockscoutError(
                          f"batch did not contain requested block {number}"
                      )
                  return self.block_timestamp_cache[number]


          def self_test() -> None:
              client = object.__new__(ExactBatchClient)
              client.block_timestamp_cache = {}
              client.request_count = 0
              client.errors = []
              observed: list[tuple[int, ...]] = []

              def fake_batch(blocks: Iterable[int]) -> dict[int, int]:
                  values = tuple(int(value) for value in blocks)
                  observed.append(values)
                  return {value: value * 12 for value in values}

              client._post_batch = fake_batch  # type: ignore[method-assign]
              assert client.block_timestamp(100) == 1200
              assert client.block_timestamp(101) == 1212
              assert len(observed) == 1
              assert observed[0][0] == 92
              assert observed[0][-1] == 131
              assert authority.base.decode_log(
                  "USDT",
                  "MINT",
                  {
                      "address": authority.base.CONTRACTS["USDT"]["address"],
                      "topics": [authority.base.ISSUE_TOPIC, None, "", "0x"],
                      "data": hex(1_000_000 * 10**6),
                      "blockNumber": "0x10",
                      "transactionHash": "0x" + "ab" * 32,
                      "logIndex": "0x0",
                  },
              )["amount_usd"] == 1_000_000


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--output", type=Path, required=True)
              args = parser.parse_args()
              self_test()
              source.BlockscoutClient = ExactBatchClient
              result = source.source_gate(args.output)
              print(json.dumps(result, indent=2, sort_keys=True))
              return 0 if result["status"] == "PASS" else 2


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          cat > "$out/TRANSPORT_CORRECTION.json" <<'JSON'
          {
            "claim_id": "CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001",
            "correction": "Exact eth_getBlockByNumber timestamps are prefetched in JSON-RPC batches of at most 40, with exact REST fallback. Event identities, periods, availability delays, density gates, ML and account rules are unchanged.",
            "market_outcome_opened_before_correction": false,
            "model_fit_before_correction": false,
            "orders_submitted": false,
            "recorded_before_source_decision": true,
            "transport_id": "TRANSPORT-20260726-ML-STABLECOIN-BLOCKSCOUT-BATCH-004"
          }
          JSON

          set +e
          PYTHONPATH="$root" python "$RUNNER_TEMP/stablecoin_batch_source.py" \
            --output "$out" 2>&1 | tee "$out/RUN.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > "$out/RUN_EXIT_CODE.txt"
          if [[ ! -f "$out/SOURCE_GATE_RESULT.json" ]]; then
            python "$root/write_transport_failure.py" \
              --output "$out" \
              --transport TRANSPORT-20260726-ML-STABLECOIN-BLOCKSCOUT-BATCH-004 \
              --exit-code "$rc"
          fi
          exit 0

      - name: Verify source decision and outcome seal
        run: |
          set -euo pipefail
          root=research/ml_stablecoin_issuance_20260726
          out=research_runs/ml_stablecoin_issuance_20260726/blockscout_batch_source
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('research_runs/ml_stablecoin_issuance_20260726/blockscout_batch_source/SOURCE_GATE_RESULT.json')
          result=json.loads(path.read_text())
          assert result['claim_id']=='CLM-20260726-2110-ML-STABLECOIN-ISSUANCE-001'
          assert result['status'] in {
              'PASS',
              'FAIL_BELOW_SOURCE_DENSITY_OR_COVERAGE',
              'SOURCE_UNAVAILABLE_OR_TRANSPORT_FAILURE',
          }
          assert result['market_outcome_opened'] is False
          assert result['model_fit'] is False
          assert result['trade_or_pnl_opened'] is False
          assert result['official_2024_2026_opened'] is False
          assert result['orders_submitted'] is False
          print(json.dumps({
              'status': result['status'],
              'events': result.get('event_count'),
              'months': len(result.get('months_with_events', [])),
              'tokens': result.get('distinct_tokens'),
              'authorized': result.get('conditional_model_screen_authorized', False),
          }, sort_keys=True))
          PY

      - name: Freeze evidence hashes
        if: always()
        run: |
          set -euo pipefail
          out=research_runs/ml_stablecoin_issuance_20260726/blockscout_batch_source
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stablecoin-blockscout-batch-source-${{ github.run_id }}
          path: research_runs/ml_stablecoin_issuance_20260726/blockscout_batch_source
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
