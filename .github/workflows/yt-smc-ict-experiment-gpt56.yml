name: YT SMC ICT causal ML experiment gpt56

on:
  workflow_dispatch:
  push:
    branches:
      - agent/yt-smc-ict-causal-ml-gpt56-20260727
    paths:
      - research/yt_smc_ict_gpt56/materialize_core.py
      - research/yt_smc_ict_gpt56/materialize_backtest.py
      - research/yt_smc_ict_gpt56/materialize_run.py
      - .github/workflows/yt-smc-ict-experiment-gpt56.yml

permissions:
  contents: write

concurrency:
  group: yt-smc-ict-experiment-gpt56-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install causal research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade numpy pandas pyarrow scikit-learn requests

      - name: Materialize exact reviewed strategy sources
        shell: bash
        run: |
          set -euo pipefail
          python research/yt_smc_ict_gpt56/materialize_core.py
          python research/yt_smc_ict_gpt56/materialize_backtest.py
          python research/yt_smc_ict_gpt56/materialize_run.py
          sha256sum \
            research/yt_smc_ict_gpt56/smc_core.py \
            research/yt_smc_ict_gpt56/smc_backtest.py \
            research/yt_smc_ict_gpt56/run_experiment.py

      - name: Compile and enforce causal invariants
        env:
          PYTHONPATH: research/yt_smc_ict_gpt56
        run: |
          python -m py_compile \
            research/yt_smc_ict_gpt56/smc_core.py \
            research/yt_smc_ict_gpt56/smc_backtest.py \
            research/yt_smc_ict_gpt56/run_experiment.py
          python research/yt_smc_ict_gpt56/smc_core.py
          python research/yt_smc_ict_gpt56/smc_backtest.py
          python research/yt_smc_ict_gpt56/run_experiment.py --self-test

      - name: Restore immutable Bybit causal data cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: artifact/bybit_data
          key: yt-smc-ict-gpt56-bybit-linear-5m-btc-eth-20210101-20260701-v1

      - name: Materialize Bybit data when cache is absent
        if: steps.data-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact/bybit_data
          python research/yt_smc_ict_gpt56/download_bybit.py \
            --output artifact/bybit_data \
            --start 2021-01-01T00:00:00Z \
            --end-exclusive 2026-07-01T00:00:00Z \
            --symbols BTCUSDT ETHUSDT \
            --interval 5 \
            2>&1 | tee artifact/BYBIT_DATA_STDOUT.log
          cp artifact/BYBIT_DATA_STDOUT.log artifact/bybit_data/BYBIT_DATA_STDOUT.log

      - name: Validate data fingerprint and continuity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifact/bybit_data/DATA_MANIFEST.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          if set(manifest['symbols']) != {'BTCUSDT', 'ETHUSDT'}:
              raise SystemExit(f"unexpected symbols: {set(manifest['symbols'])}")
          for symbol, item in manifest['symbols'].items():
              bars = item['bars']
              if bars['rows'] < 550_000:
                  raise SystemExit(f"{symbol}: insufficient bars {bars['rows']}")
              if bars['missing_count'] > 100:
                  raise SystemExit(f"{symbol}: excessive missing bars {bars['missing_count']}")
          print(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Run pre-2024 selection and continuous 2024-2026 evaluation
        id: run
        env:
          PYTHONPATH: research/yt_smc_ict_gpt56
        shell: bash
        run: |
          set +e
          rm -rf artifact/smc_ml_run
          mkdir -p artifact/smc_ml_run
          python research/yt_smc_ict_gpt56/run_experiment.py \
            --data-root artifact/bybit_data \
            --output artifact/smc_ml_run \
            --swing-radius 6 \
            --max-sweep-age-bars 12 \
            2>&1 | tee artifact/smc_ml_run/RUN_STDOUT.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish compact run summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('artifact/smc_ml_run/RUN_SUMMARY.json')
          lines = ['## Causal ML SMC/ICT experiment']
          if not path.exists():
              lines.append('- RUN_SUMMARY.json: missing')
          else:
              summary = json.loads(path.read_text(encoding='utf-8'))
              validation = summary.get('validation') or {}
              h1 = summary.get('evaluation_2024h1') or {}
              full = summary.get('evaluation_full') or {}
              selected = summary.get('selected_configuration') or {}
              lines.extend([
                  f"- decision: `{summary.get('decision')}`",
                  f"- candidates: `{summary.get('candidate_count')}`",
                  f"- selected: `{selected}`",
                  f"- 2023 validation geometric daily growth: `{validation.get('geometric_daily_growth')}`",
                  f"- 2024H1 geometric daily growth: `{h1.get('geometric_daily_growth')}`",
                  f"- 2024H1 account multiple: `{h1.get('account_multiple')}`",
                  f"- full geometric daily growth: `{full.get('geometric_daily_growth')}`",
                  f"- full account multiple: `{full.get('account_multiple')}`",
                  f"- full max drawdown: `{full.get('max_drawdown')}`",
                  f"- full trades: `{full.get('completed_trades')}`",
              ])
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY

      - name: Write recoverable experiment pointer
        if: always()
        env:
          RUN_STATUS: ${{ steps.run.outputs.status || '99' }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          summary_path = Path('artifact/smc_ml_run/RUN_SUMMARY.json')
          summary = json.loads(summary_path.read_text(encoding='utf-8')) if summary_path.exists() else None
          compact = None
          if summary is not None:
              compact = {
                  'system_id': summary.get('system_id'),
                  'decision': summary.get('decision'),
                  'candidate_count': summary.get('candidate_count'),
                  'selected_configuration': summary.get('selected_configuration'),
                  'validation': summary.get('validation'),
                  'evaluation_2024h1': summary.get('evaluation_2024h1'),
                  'evaluation_full': summary.get('evaluation_full'),
                  'half_years': summary.get('half_years'),
                  'implementation_diagnosis': summary.get('implementation_diagnosis'),
              }
          source_sha = os.environ['GITHUB_SHA']
          pointer = {
              'schema_version': 1,
              'claim_id': 'YT-SMC-ICT-GPT56-CAUSAL-ML-001',
              'system_id': 'YT-SMC-ICT-GPT56-LIQUIDITY-DELIVERY-001',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'source_sha': source_sha,
              'branch': os.environ['GITHUB_REF_NAME'],
              'artifact_name': f'yt-smc-ict-ml-run-gpt56-{source_sha}',
              'run_exit_status': int(os.environ['RUN_STATUS']),
              'summary_sha256': hashlib.sha256(summary_path.read_bytes()).hexdigest() if summary_path.exists() else None,
              'summary': compact,
              'source_hashes': {
                  name: hashlib.sha256(Path('research/yt_smc_ict_gpt56', name).read_bytes()).hexdigest()
                  for name in ('smc_core.py', 'smc_backtest.py', 'run_experiment.py')
              },
          }
          path = Path('research/yt_smc_ict_gpt56/RUN_POINTER.json')
          path.write_text(json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload immutable experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-smc-ict-ml-run-gpt56-${{ github.sha }}
          path: artifact/smc_ml_run
          if-no-files-found: error
          compression-level: 6
          retention-days: 90

      - name: Commit exact system sources and run pointer
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/yt_smc_ict_gpt56/smc_core.py \
            research/yt_smc_ict_gpt56/smc_backtest.py \
            research/yt_smc_ict_gpt56/run_experiment.py \
            research/yt_smc_ict_gpt56/RUN_POINTER.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record causal ML SMC ICT experiment ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Enforce experiment completion
        if: always()
        shell: bash
        run: |
          status="${{ steps.run.outputs.status || '99' }}"
          if [[ "$status" != "0" ]]; then
            echo "Experiment exit status: $status" >&2
            exit "$status"
          fi
