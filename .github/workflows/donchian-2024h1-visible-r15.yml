name: Official Donchian 2024H1 sequential evaluation

on:
  push:
    branches:
      - main
      - agent/r15-donchian-2024h1-visible-002
    paths:
      - '.github/workflows/donchian-2024h1-visible-r15.yml'
      - 'research/donchian_2024h1_20260726/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/donchian-2024h1-visible-r15.yml'
      - 'research/donchian_2024h1_20260726/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: donchian-2024h1-r15-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ROOT: research/donchian_2024h1_20260726
      OUT: research_runs/donchian_2024h1_20260726/r15
      DATA: ${{ runner.temp }}/donchian_2024h1
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade 'pip==25.1.1'
          python -m pip install \
            'numpy==2.1.3' \
            'pandas==2.2.3' \
            'requests==2.32.4' \
            'pytest==8.3.4'

      - name: Reconstruct and validate unchanged evaluator
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$ROOT/preregistration.json" >/dev/null
          python -m json.tool "$ROOT/EXECUTION_CORRECTION_001_SLIM_SHA_SCOPED_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$ROOT/EXECUTION_CORRECTION_002_STANDARD_RUNNER_BEFORE_OUTCOME.json" >/dev/null
          python -m json.tool "$ROOT/EXECUTION_TRIGGER_004_DEDICATED_VISIBLE_WORKFLOW.json" >/dev/null
          python "$ROOT/reconstruct.py"
          python -m py_compile \
            "$ROOT/reconstruct.py" \
            "$ROOT/run.py" \
            "$ROOT/test_run.py" \
            "$ROOT/download_bars.py" \
            "$ROOT/download_funding.py"
          PYTHONPATH="$ROOT" pytest -q "$ROOT/test_run.py"
          PYTHONPATH="$ROOT" python "$ROOT/run.py" self-test
          python scripts/validate_project.py

      - name: Download official warm-up and 2024H1 Bybit bars
        run: |
          set -euo pipefail
          rm -rf "$DATA"
          mkdir -p "$DATA"
          python "$ROOT/download_bars.py" --output "$DATA" 2>&1 | tee "$DATA/BAR_DOWNLOAD.log"

      - name: Download official funding or use frozen adverse fallback
        run: |
          set -euo pipefail
          python "$ROOT/download_funding.py" --output "$DATA" 2>&1 | tee "$DATA/FUNDING_DOWNLOAD.log"

      - name: Replay unchanged official 2024H1 account
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          PYTHONPATH="$ROOT" python "$ROOT/run.py" run \
            --data-root "$DATA" \
            --output "$OUT" \
            2>&1 | tee "$OUT/RUN.log"

      - name: Verify authority and period seals
        if: always()
        run: |
          set -euo pipefail
          test -f "$OUT/RESULT.json"
          (cd "$OUT" && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('research_runs/donchian_2024h1_20260726/r15/RESULT.json').read_text())
          assert result['claim_id']=='CLM-20260726-2139-DONCHIAN-2024H1-001'
          assert result['opened_periods']==['2024H1']
          assert result['unopened_periods']==['2024H2','2025H1','2025H2','2026H1']
          assert result['evaluation']['elapsed_time_liquidation'] is False
          assert result['evaluation']['forced_boundary_close'] is False
          assert result['orders_submitted'] is False
          assert result['paper_live_started'] is False
          print(json.dumps({
              'status':result['status'],
              'gdg_12bps':result['paths']['12bps']['geometric_daily_growth'],
              'gdg_18bps':result['paths']['18bps']['geometric_daily_growth'],
              'gdg_24bps':result['paths']['24bps']['geometric_daily_growth'],
          },sort_keys=True))
          PY

      - name: Freeze evidence hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p research_runs/donchian_2024h1_20260726/input
          sha256sum \
            "$ROOT/WORK_CLAIM.json" \
            "$ROOT/preregistration.json" \
            "$ROOT/README.md" \
            "$ROOT/SOURCES.md" \
            "$ROOT/EXECUTION_CORRECTION_001_SLIM_SHA_SCOPED_BEFORE_OUTCOME.json" \
            "$ROOT/EXECUTION_CORRECTION_002_STANDARD_RUNNER_BEFORE_OUTCOME.json" \
            "$ROOT/EXECUTION_TRIGGER_004_DEDICATED_VISIBLE_WORKFLOW.json" \
            "$ROOT/bundle_manifest.json" \
            "$ROOT/reconstruct.py" \
            "$ROOT"/source_bundle.tar.gz.b64.part* \
            "$ROOT/run.py" \
            "$ROOT/test_run.py" \
            "$ROOT/download_bars.py" \
            "$ROOT/download_funding.py" \
            .github/workflows/donchian-2024h1-visible-r15.yml \
            > research_runs/donchian_2024h1_20260726/input/INPUT_SHA256SUMS.txt
          find "$DATA" -type f -print0 | sort -z | xargs -0 sha256sum \
            > research_runs/donchian_2024h1_20260726/input/DATA_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: donchian-2024h1-r15-${{ github.run_id }}
          path: research_runs/donchian_2024h1_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
