name: YT Trinity actionable failure diagnostics

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/CURRENT_EXECUTION_STATE.json
      - .github/workflows/yt-trinity-failure-diagnostics.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-actionable-failure-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Capture latest actionable failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          listing = subprocess.run(
              [
                  'gh', 'run', 'list', '--repo', os.environ['GITHUB_REPOSITORY'],
                  '--branch', os.environ['GITHUB_REF_NAME'], '--limit', '150',
                  '--json', 'databaseId,workflowName,name,status,conclusion,headSha,createdAt,updatedAt,url',
              ],
              text=True,
              capture_output=True,
              check=True,
          )
          rows = json.loads(listing.stdout)
          latest = {}
          for row in rows:
              workflow = str(row.get('workflowName') or row.get('name') or '')
              if not workflow.startswith('YT Trinity'):
                  continue
              if row.get('status') != 'completed':
                  continue
              if row.get('conclusion') not in {'failure', 'timed_out', 'action_required'}:
                  continue
              latest.setdefault(workflow, row)
          diagnostics = []
          for workflow, row in list(latest.items())[:30]:
              run_id = str(row['databaseId'])
              command = [
                  'gh', 'run', 'view', run_id,
                  '--repo', os.environ['GITHUB_REPOSITORY'], '--log-failed',
              ]
              completed = subprocess.run(command, text=True, capture_output=True)
              log = completed.stdout + '\n' + completed.stderr
              log = log[-30000:]
              patterns = {
                  'python_traceback': r'Traceback \(most recent call last\):[\s\S]*',
                  'pytest_failure': r'=+ FAILURES =+[\s\S]*',
                  'syntax_error': r'(SyntaxError|IndentationError):[^\n]*',
                  'assertion_error': r'AssertionError[^\n]*',
                  'missing_file': r'(No such file or directory|not found|Not Found)[^\n]*',
                  'timeout': r'(timed out|timeout|TimeoutError)[^\n]*',
                  'api_error': r'(HTTPError|429|403|401|502|503|504)[^\n]*',
                  'git_error': r'(CONFLICT|rejected|non-fast-forward|pathspec)[^\n]*',
              }
              classifications = {}
              for key, pattern in patterns.items():
                  matches = re.findall(pattern, log, flags=re.I)
                  if matches:
                      value = matches[-1]
                      if isinstance(value, tuple):
                          value = ' '.join(value)
                      classifications[key] = str(value)[-4000:]
              diagnostics.append({
                  **row,
                  'workflow': workflow,
                  'log_sha256': hashlib.sha256(log.encode('utf-8', 'replace')).hexdigest(),
                  'log_tail': log[-12000:],
                  'classifications': classifications,
              })
          payload = {
              'schema_version': 1,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'built_at_utc': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'branch': os.environ['GITHUB_REF_NAME'],
              'head_sha': subprocess.run(['git', 'rev-parse', 'HEAD'], text=True, capture_output=True, check=True).stdout.strip(),
              'actionable_failure_count': len(diagnostics),
              'diagnostics': diagnostics,
              'cancelled_runs_excluded': True,
          }
          raw = json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          Path('research/yt_trinity_ml/CURRENT_FAILURE_DIAGNOSTICS.json').write_text(raw, encoding='utf-8')
          Path('research/yt_trinity_ml/CURRENT_FAILURE_DIAGNOSTICS.sha256').write_text(
              f"{hashlib.sha256(raw.encode('utf-8')).hexdigest()}  CURRENT_FAILURE_DIAGNOSTICS.json\n",
              encoding='utf-8',
          )
          print(json.dumps({'actionable_failure_count': len(diagnostics), 'workflows': [row['workflow'] for row in diagnostics]}, indent=2))
          PY
      - name: Persist diagnostics without retriggering state aggregation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/yt_trinity_ml/CURRENT_FAILURE_DIAGNOSTICS.json \
            research/yt_trinity_ml/CURRENT_FAILURE_DIAGNOSTICS.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record actionable YT Trinity failures ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
