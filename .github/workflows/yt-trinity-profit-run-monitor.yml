name: YT Trinity profit run monitor

on:
  push:
    branches:
      - agent/r22-yt-trinity-profit-run-001
    paths:
      - control/yt-trinity-profit-run-monitor-trigger.json

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Read current deterministic profit workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --get \
            --data-urlencode "branch=${GITHUB_REF_NAME}" \
            --data-urlencode "per_page=10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/yt-trinity-profit-run-v3.yml/runs" \
            > /tmp/runs.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          payload = json.loads(Path('/tmp/runs.json').read_text())
          rows = []
          for run in payload.get('workflow_runs', []):
              rows.append({
                  'id': run.get('id'),
                  'run_number': run.get('run_number'),
                  'run_attempt': run.get('run_attempt'),
                  'event': run.get('event'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'head_sha': run.get('head_sha'),
                  'created_at': run.get('created_at'),
                  'run_started_at': run.get('run_started_at'),
                  'updated_at': run.get('updated_at'),
                  'jobs_url': run.get('jobs_url'),
                  'artifacts_url': run.get('artifacts_url'),
              })
          result = {'schema_version': 1, 'workflow_runs': rows}
          raw = json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          result['sha256_before_field'] = hashlib.sha256(raw.encode()).hexdigest()
          Path('research/yt_trinity_ml/PROFIT_RUN_MONITOR.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - name: Persist monitor pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/PROFIT_RUN_MONITOR.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record current YT Trinity profit run status"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
