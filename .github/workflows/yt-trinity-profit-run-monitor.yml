name: YT Trinity active alpha run monitor

on:
  push:
    branches:
      - agent/r22-yt-trinity-profit-run-001
    paths:
      - control/yt-trinity-profit-run-monitor-trigger.json

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Read current alpha workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          workflows = (
              'yt-trinity-compression-alpha.yml',
              'yt-trinity-opening-range-alpha.yml',
              'yt-trinity-export-npz.yml',
          )
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
          }
          result = {'schema_version': 2, 'workflows': {}}
          for workflow in workflows:
              query = urllib.parse.urlencode({
                  'branch': os.environ['GITHUB_REF_NAME'],
                  'per_page': 10,
              })
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/{workflow}/runs?{query}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=45) as response:
                  payload = json.load(response)
              rows = []
              for run in payload.get('workflow_runs', []):
                  rows.append({
                      'id': run.get('id'),
                      'run_number': run.get('run_number'),
                      'run_attempt': run.get('run_attempt'),
                      'event': run.get('event'),
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'head_sha': run.get('head_sha'),
                      'created_at': run.get('created_at'),
                      'run_started_at': run.get('run_started_at'),
                      'updated_at': run.get('updated_at'),
                      'jobs_url': run.get('jobs_url'),
                      'artifacts_url': run.get('artifacts_url'),
                  })
              result['workflows'][workflow] = rows
          raw = json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          result['sha256_before_field'] = hashlib.sha256(raw.encode()).hexdigest()
          destination = Path('research/yt_trinity_ml/ALPHA_RUN_MONITOR.json')
          destination.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(destination.read_text(encoding='utf-8'))
          PY
      - name: Persist current run identities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/ALPHA_RUN_MONITOR.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record active transcript alpha run identities"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
