name: YT Trinity managed 2outube transcript probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - research/yt_trinity_ml/probe_2outube.py
      - .github/workflows/yt-trinity-2outube-probe.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-2outube-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependency
        run: |
          python -m pip install -q --upgrade pip requests
          python -m py_compile research/yt_trinity_ml/probe_2outube.py
      - name: Probe known-positive and target videos
        run: |
          mkdir -p artifact/2outube
          python research/yt_trinity_ml/probe_2outube.py \
            --output artifact/2outube \
            --delay-seconds 5 \
            2>&1 | tee artifact/2outube/stdout.log
          (
            cd artifact/2outube
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-2outube-${{ github.sha }}
          path: artifact/2outube
          if-no-files-found: error
          retention-days: 30
      - name: Persist compact transport decision
        if: always()
        run: |
          test -f artifact/2outube/probe.json
          cp artifact/2outube/probe.json research/yt_trinity_ml/CAPTION_TRANSPORT_2OUTUBE.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_trinity_ml/CAPTION_TRANSPORT_2OUTUBE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record managed 2outube transcript probe ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
