name: Observable SMT-FVG liquidity sweep fatal screen

on:
  push:
    branches:
      - agent/r11-smt-fvg-liquidity-sweep-001
    paths:
      - ".github/workflows/smt-fvg-liquidity-sweep-observable-r11.yml"

permissions:
  contents: write

concurrency:
  group: smt-fvg-liquidity-sweep-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  NUMEXPR_NUM_THREADS: "2"

jobs:
  fatal-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 pandas==2.2.3 requests==2.32.4

      - name: Reconstruct and validate frozen implementation
        run: |
          python research/smt_fvg_liquidity_sweep_20260726/reconstruct.py
          python scripts/validate_project.py
          python -m py_compile research/smt_fvg_liquidity_sweep_20260726/run_screen.py
          python research/smt_fvg_liquidity_sweep_20260726/run_screen.py self-test
          python -m json.tool research/smt_fvg_liquidity_sweep_20260726/preregistration.json >/dev/null
          python -m json.tool research/smt_fvg_liquidity_sweep_20260726/WORK_CLAIM.json >/dev/null

      - name: Cache immutable official Bybit archives
        uses: actions/cache@v4
        with:
          path: /tmp/bybit-smt-fvg
          key: bybit-smt-fvg-v1-btceth-20230115-20231119

      - name: Run frozen 3072-candidate fatal screen
        shell: bash
        run: |
          rm -rf artifacts/smt_fvg_liquidity_sweep
          mkdir -p artifacts/smt_fvg_liquidity_sweep
          set -o pipefail
          python research/smt_fvg_liquidity_sweep_20260726/run_screen.py run \
            --cache /tmp/bybit-smt-fvg \
            --output artifacts/smt_fvg_liquidity_sweep \
            2>&1 | tee artifacts/smt_fvg_liquidity_sweep/run.log

      - name: Verify and package compact evidence
        if: always()
        shell: bash
        run: |
          ROOT=artifacts/smt_fvg_liquidity_sweep
          mkdir -p "$ROOT"
          cp research/smt_fvg_liquidity_sweep_20260726/run_screen.py "$ROOT/RUN_SCREEN.py"
          cp research/smt_fvg_liquidity_sweep_20260726/run_screen.py.gz "$ROOT/RUN_SCREEN.py.gz"
          cp research/smt_fvg_liquidity_sweep_20260726/reconstruct.py "$ROOT/RECONSTRUCT.py"
          cp research/smt_fvg_liquidity_sweep_20260726/preregistration.json "$ROOT/PREREGISTRATION.json"
          cp research/smt_fvg_liquidity_sweep_20260726/WORK_CLAIM.json "$ROOT/WORK_CLAIM.json"
          cp research/smt_fvg_liquidity_sweep_20260726/README.md "$ROOT/README.md"
          cp research/smt_fvg_liquidity_sweep_20260726/SOURCES.md "$ROOT/SOURCES.md"
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          root = Path('artifacts/smt_fvg_liquidity_sweep')
          state = {'claim_id': 'CLM-20260726-1539-SMT-FVG-SWEEP-001', 'later_periods_opened': False, 'orders_submitted': False}
          try:
              result = json.loads((root / 'result_summary.json').read_text())
              manifest = json.loads((root / 'source_manifest.json').read_text())
              prereg = json.loads(Path('research/smt_fvg_liquidity_sweep_20260726/preregistration.json').read_text())
              candidates = pd.read_csv(root / 'candidate_results.csv')
              events = pd.read_csv(root / 'smt_events.csv.gz')
              ledgers = pd.read_csv(root / 'survivor_ledgers.csv')
              assert result['result_id'] == prereg['provisional_result_id']
              assert result['candidate_count'] == len(candidates) == 3072
              assert not result['2024_opened'] and not result['2025_opened'] and not result['2026_opened']
              assert not result['orders_submitted'] and not result['paper_or_live_started']
              assert manifest['archive_count'] == 12 and tuple(manifest['symbols']) == ('BTCUSDT', 'ETHUSDT')
              assert all(str(x['date']).startswith('2023-') and len(str(x['sha256'])) == 64 for x in manifest['archives'])
              assert set(events['stage']) <= {'fit', 'development'}
              assert (pd.to_numeric(events['decision_time']) >= pd.to_numeric(events['sweep_sec']) + pd.to_numeric(events['confirm_seconds']) - 1e-12).all()
              for stage in ('fit', 'development'):
                  a = pd.to_numeric(candidates[f'{stage}_12bp_total_return'], errors='coerce')
                  b = pd.to_numeric(candidates[f'{stage}_18bp_total_return'], errors='coerce')
                  c = pd.to_numeric(candidates[f'{stage}_24bp_total_return'], errors='coerce')
                  finite = np.isfinite(a) & np.isfinite(b) & np.isfinite(c)
                  assert (a[finite] + 1e-12 >= b[finite]).all() and (b[finite] + 1e-12 >= c[finite]).all()
              if len(ledgers):
                  assert (pd.to_numeric(ledgers['entry_time']) + 1e-9 >= pd.to_numeric(ledgers['decision_time']) + 0.1).all()
                  assert not ledgers.duplicated(['candidate_id', 'event_id']).any()
              state['contract_check'] = 'PASS'
          except Exception as exc:
              state['contract_check'] = 'FAIL'
              state['error'] = f'{type(exc).__name__}: {exc}'
          (root / 'RUN_STATE.json').write_text(json.dumps(state, sort_keys=True, indent=2) + '\n')
          PY
          cd "$ROOT"
          find . -maxdepth 1 -type f ! -name CI_SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > CI_SHA256SUMS.txt
          sha256sum --check CI_SHA256SUMS.txt

      - name: Persist compact result on research branch
        if: always()
        shell: bash
        run: |
          SRC=artifacts/smt_fvg_liquidity_sweep
          DEST=research_results/smt_fvg_liquidity_sweep_20260726
          mkdir -p "$DEST"
          for f in result_summary.json source_manifest.json candidate_results.csv fit_survivors.csv survivor_ledgers.csv run.log RUN_STATE.json CI_SHA256SUMS.txt; do
            if [ -f "$SRC/$f" ]; then
              cp "$SRC/$f" "$DEST/$f"
            fi
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Persist SMT-FVG execution evidence [skip smt-fvg]"
          git push origin HEAD:agent/r11-smt-fvg-liquidity-sweep-001
