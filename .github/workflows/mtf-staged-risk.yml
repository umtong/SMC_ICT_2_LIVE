name: MTF staged-risk semantic tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/mtf_staged_risk/**'
      - '.github/workflows/mtf-staged-risk.yml'
  push:
    branches: [agent/r23-mtf-staged-risk-001]
    paths:
      - 'research/mtf_staged_risk/**'
      - '.github/workflows/mtf-staged-risk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'numba==0.61.0' 'pytest==8.3.4'
      - name: Materialize and verify source
        run: python research/mtf_staged_risk/materialize.py
      - name: Compile and run semantic invariants
        run: |
          python -m py_compile research/mtf_staged_risk/*.py
          python research/mtf_staged_risk/run.py --self-test
          pytest -q research/mtf_staged_risk/test_run.py
