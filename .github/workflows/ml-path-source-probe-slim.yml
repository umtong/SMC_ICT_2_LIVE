name: ML path-continuity source-route probe

on:
  push:
    branches:
      - agent/r11-ml-path-continuity-router-001
    paths:
      - ".github/workflows/ml-path-source-probe-slim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Probe public API and archive routes without market outcomes
        shell: bash
        run: |
          set -u
          mkdir -p research_runs/ml_path_continuity_source_probe
          out=research_runs/ml_path_continuity_source_probe/PROBE.tsv
          printf 'kind\turl\thttp_code\tbytes\n' > "$out"

          probe() {
            kind="$1"
            url="$2"
            tmp=$(mktemp)
            code=$(curl --location --silent --show-error --max-time 25 \
              --range 0-4095 --output "$tmp" --write-out '%{http_code}' "$url" || true)
            bytes=$(wc -c < "$tmp" | tr -d ' ')
            printf '%s\t%s\t%s\t%s\n' "$kind" "$url" "$code" "$bytes" >> "$out"
            rm -f "$tmp"
          }

          for base in \
            https://api.bybit.com \
            https://api.bytick.com \
            https://api.bybit.nl \
            https://api.bybit.kz; do
            probe api_kline "$base/v5/market/kline?category=linear&symbol=BTCUSDT&interval=15&start=1672531200000&end=1672534800000&limit=10"
            probe api_funding "$base/v5/market/funding/history?category=linear&symbol=BTCUSDT&endTime=1672534800000&limit=2"
          done

          for symbol in BTCUSDT ETHUSDT SOLUSDT XRPUSDT; do
            probe archive_2021 "https://public.bybit.com/kline_for_metatrader4/${symbol}/2021/${symbol}_15_2021-12-01_2021-12-31.csv.gz"
            probe archive_2022 "https://public.bybit.com/kline_for_metatrader4/${symbol}/2022/${symbol}_15_2022-01-01_2022-01-31.csv.gz"
            probe archive_2023 "https://public.bybit.com/kline_for_metatrader4/${symbol}/2023/${symbol}_15_2023-12-01_2023-12-31.csv.gz"
          done

          cat "$out"
          test "$(awk -F '\t' 'NR>1 && $1 ~ /^api_/ && $3==200 {n++} END {print n+0}' "$out")" -gt 0 || true
          test "$(awk -F '\t' 'NR>1 && $1 ~ /^archive_/ && ($3==200 || $3==206) {n++} END {print n+0}' "$out")" -gt 0 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-path-source-probe-${{ github.sha }}
          path: research_runs/ml_path_continuity_source_probe
          if-no-files-found: error
          retention-days: 7
