name: Event-time ML fair-value raid router

on:
  pull_request:
    branches: [main]
    paths:
      - "research/ml_fair_value_raid_20260726/**"
      - ".github/workflows/ml-fair-value-raid-r11.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ml-fair-value-raid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  NUMEXPR_NUM_THREADS: "2"
  ROOT: research/ml_fair_value_raid_20260726
  OUT: ${{ github.workspace }}/research_runs/ml_fair_value_raid_20260726
  CACHE: /tmp/ml-fair-value-raid-cache

jobs:
  causal-ml-fatal-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scikit-learn==1.6.1" \
            "requests==2.32.4" \
            "pytest==8.3.4"

      - name: Reconstruct, compile and prove causal invariants
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python "$ROOT/reconstruct.py" 2>&1 | tee "$OUT/reconstruct.log"
          python -m py_compile "$ROOT/reconstruct.py" "$ROOT/run.py" "$ROOT/test_run.py"
          pytest -q "$ROOT/test_run.py" 2>&1 | tee "$OUT/tests.log"
          python "$ROOT/run.py" self-test 2>&1 | tee "$OUT/self_test.log"
          python -m json.tool "$ROOT/preregistration.json" >/dev/null
          python -m json.tool "$ROOT/WORK_CLAIM.json" >/dev/null
          python scripts/validate_project.py

      - name: Run frozen pre-2024 event-time screen
        run: |
          set -euo pipefail
          mkdir -p "$OUT/result"
          python "$ROOT/run.py" run \
            --cache "$CACHE" \
            --output "$OUT/result" \
            2>&1 | tee "$OUT/run.log"

      - name: Enforce stage and authority boundaries
        run: |
          set -euo pipefail
          (cd "$OUT/result" && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("research_runs/ml_fair_value_raid_20260726/result/RESULT.json").read_text())
          assert result["result_id"] == "RES-20260726-ML-FAIR-VALUE-RAID-001"
          assert result["2024_opened"] is False
          assert result["2025_opened"] is False
          assert result["2026_opened"] is False
          assert result["orders_submitted"] is False
          assert result["ranking_role"].startswith("NOT_RANK_ELIGIBLE")
          assert result["status"] in {"TESTED_BELOW_GATE", "PROMISING_PRE2024_SURVIVOR"}
          print(json.dumps({
              "status": result["status"],
              "eligible_symbols": result.get("eligible_symbols"),
              "fit_events": result.get("fit_event_count"),
              "confirmation_gate": result.get("confirmation_gate_pass"),
              "development_opened": result.get("development_opened"),
          }, sort_keys=True))
          PY
          python scripts/validate_project.py

      - name: Record immutable input and output hashes
        if: always()
        run: |
          set -euo pipefail
          sha256sum \
            "$ROOT/README.md" \
            "$ROOT/WORK_CLAIM.json" \
            "$ROOT/preregistration.json" \
            "$ROOT/reconstruct.py" \
            "$ROOT"/run.py.gz.b64.part* \
            "$ROOT/test_run.py" \
            .github/workflows/ml-fair-value-raid-r11.yml \
            > "$OUT/INPUT_SHA256SUMS.txt"
          find "$OUT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$OUT/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-fair-value-raid-${{ github.sha }}
          path: research_runs/ml_fair_value_raid_20260726
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Commit decision-ready result to claim branch
        if: success() && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          target=research_results/r11_ml_fair_value_raid_001
          rm -rf "$target"
          mkdir -p "$target"
          cp "$OUT/result/RESULT.json" "$target/result.json"
          cp "$OUT/result/SOURCE_MANIFEST.json" "$target/SOURCE_MANIFEST.json"
          cp "$OUT/result/MODEL_CONTRACT.json" "$target/MODEL_CONTRACT.json"
          cp "$OUT/INPUT_SHA256SUMS.txt" "$target/INPUT_SHA256SUMS.txt"
          cp "$OUT/OUTPUT_SHA256SUMS.txt" "$target/OUTPUT_SHA256SUMS.txt"
          tail -n 300 "$OUT/run.log" > "$target/RUN_TAIL.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "Record event-time ML fair-value raid result"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
