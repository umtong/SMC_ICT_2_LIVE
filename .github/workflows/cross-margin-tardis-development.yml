name: Cross-margin contingent risk-based development

on:
  push:
    branches:
      - agent/r5-cross-margin-dislocation-001
    paths:
      - "research/cross_margin_dislocation_20260725/tardis_pilot.py"
      - "research/cross_margin_dislocation_20260725/tardis_development_v2.py"
      - "research/cross_margin_dislocation_20260725/test_tardis_development_v2.py"
      - "research_results/r5_cross_margin_dislocation_001/STATUS_TARDIS_PILOT_PASS.txt"
      - ".github/workflows/cross-margin-tardis-development.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r5-cross-margin-tardis-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r5-cross-margin-dislocation-001
          fetch-depth: 1

      - name: Enforce pilot pass precondition
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/r5-cross-margin-dislocation-001
          git reset --hard origin/agent/r5-cross-margin-dislocation-001
          ready=false
          if [[ -f research_results/r5_cross_margin_dislocation_001/STATUS_TARDIS_PILOT_PASS.txt ]]; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          mkdir -p research_runs/cross_margin_dislocation_20260725/tardis_development
          python - "$ready" <<'PY'
          import json, pathlib, sys
          pathlib.Path('research_runs/cross_margin_dislocation_20260725/tardis_development/PRECONDITION.json').write_text(
              json.dumps({
                  'pilot_pass':sys.argv[1]=='true',
                  'selection_opened':False,
                  'confirmation_opened':False,
                  '2026_opened':False,
                  'orders_submitted':False,
              },indent=2,sort_keys=True)+'\n')
          PY

      - name: Install fixed environment
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "requests==2.32.4" "pytest==8.3.4"

      - name: Verify source identities and account-engine tests
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_margin_dislocation_20260725
          python -m py_compile "$root/tardis_source_probe.py" "$root/tardis_pilot.py" "$root/tardis_development_v2.py" "$root/test_tardis_development_v2.py"
          sha256sum "$root/preregistration_tardis_v2.json" "$root/tardis_pilot.py" "$root/tardis_development_v2.py" "$root/test_tardis_development_v2.py" > research_runs/cross_margin_dislocation_20260725/tardis_development/INPUT_SHA256SUMS.txt
          PYTHONPATH="$root" pytest -q "$root/test_tardis_development_v2.py" 2>&1 | tee research_runs/cross_margin_dislocation_20260725/tardis_development/tests.log
          PYTHONPATH="$root" python "$root/tardis_pilot.py" --self-test \
            --output research_runs/cross_margin_dislocation_20260725/tardis_development \
            --cache "$RUNNER_TEMP/cross-margin-development-cache" \
            2>&1 | tee research_runs/cross_margin_dislocation_20260725/tardis_development/pilot_self_test.log
          PYTHONPATH="$root" python "$root/tardis_development_v2.py" --self-test \
            --pilot-dir research_runs/cross_margin_dislocation_20260725/tardis_development \
            --output research_runs/cross_margin_dislocation_20260725/tardis_development \
            --cache "$RUNNER_TEMP/cross-margin-development-cache" \
            2>&1 | tee research_runs/cross_margin_dislocation_20260725/tardis_development/development_self_test.log

      - name: Reproduce fatal pilot and conditionally open remaining development days
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root=research/cross_margin_dislocation_20260725
          runroot=research_runs/cross_margin_dislocation_20260725/tardis_development
          PYTHONPATH="$root" python "$root/tardis_pilot.py" \
            --output "$runroot/pilot" \
            --cache "$RUNNER_TEMP/cross-margin-development-cache" \
            2>&1 | tee "$runroot/pilot.log"
          PYTHONPATH="$root" python "$root/tardis_development_v2.py" \
            --pilot-dir "$runroot/pilot" \
            --output "$runroot/result" \
            --cache "$RUNNER_TEMP/cross-margin-development-cache" \
            2>&1 | tee "$runroot/development.log"

      - name: Commit durable development decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_results/r5_cross_margin_dislocation_001
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('research_runs/cross_margin_dislocation_20260725/tardis_development')
          output=pathlib.Path('research_results/r5_cross_margin_dislocation_001')
          pre=json.loads((root/'PRECONDITION.json').read_text())
          path=root/'result'/'DEVELOPMENT_RESULT.json'
          development=json.loads(path.read_text()) if path.exists() else None
          if not pre['pilot_pass']:
              status='DEVELOPMENT_NOT_ACTIVATED_PILOT_NOT_PASSED'
          elif development is None:
              status='DEVELOPMENT_INFRA_FAILURE'
          elif int(development.get('development_gate_pass_count',0))>0:
              status='DEVELOPMENT_PASS'
          else:
              status='DEVELOPMENT_NO_EDGE'
          result={
              'schema_version':2,
              'result_id':'RES-20260725-CROSS-MARGIN-DEVELOPMENT-002',
              'claim_id':'CLM-20260725-2120-CROSS-MARGIN-001',
              'status':status,
              'precondition':pre,
              'development':development,
              'selection_opened':False,
              'confirmation_opened':False,
              '2026_opened':False,
              'orders_submitted':False,
              'paper_live_started':False,
              'champion_eligible':False,
              'target_1pct_daily_test_admissible':False,
          }
          durable=output/'tardis_development_result.json'
          durable.write_text(json.dumps(result,indent=2,sort_keys=True,default=str)+'\n')
          (output/'tardis_development_result.sha256').write_text(hashlib.sha256(durable.read_bytes()).hexdigest()+'  tardis_development_result.json\n')
          for old in output.glob('STATUS_DEVELOPMENT_*.txt'):
              old.unlink()
          (output/f'STATUS_{status}.txt').write_text(json.dumps({'status':status,'development_gate_pass_count':0 if not development else int(development.get('development_gate_pass_count',0)),'selection_opened':False,'2026_opened':False,'orders_submitted':False},indent=2,sort_keys=True)+'\n')
          PY
          find research_results/r5_cross_margin_dislocation_001 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > research_results/r5_cross_margin_dislocation_001/SHA256SUMS.txt
          git config user.name "smc-ict-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_results/r5_cross_margin_dislocation_001
          if ! git diff --cached --quiet; then
            git commit -m "Record contingent cross-margin development decision"
            git push origin HEAD:agent/r5-cross-margin-dislocation-001
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-margin-tardis-development-${{ github.sha }}
          path: research_runs/cross_margin_dislocation_20260725/tardis_development
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
