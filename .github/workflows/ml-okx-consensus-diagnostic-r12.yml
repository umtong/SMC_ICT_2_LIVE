name: OKX consensus pre-market diagnostic

on:
  push:
    branches:
      - agent/r12-ml-okx-consensus-relay-001
    paths:
      - "research/ml_okx_consensus_relay_20260726/**"
      - ".github/workflows/ml-okx-consensus-diagnostic-r12.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/ml_okx_consensus_relay_20260726/**"
      - ".github/workflows/ml-okx-consensus-diagnostic-r12.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-okx-consensus-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact frozen environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scikit-learn==1.6.1" \
            "pytest==8.3.4"
          python - <<'PY'
          import json, platform, sys
          import numpy, pandas, sklearn, pytest
          print(json.dumps({
              "python": sys.version,
              "platform": platform.platform(),
              "numpy": numpy.__version__,
              "pandas": pandas.__version__,
              "sklearn": sklearn.__version__,
              "pytest": pytest.__version__,
          }, sort_keys=True))
          PY

      - name: Reconstruct immutable source
        run: |
          set -euo pipefail
          root=research/ml_okx_consensus_relay_20260726
          python "$root/reconstruct.py"

      - name: Compile source
        run: |
          set -euo pipefail
          root=research/ml_okx_consensus_relay_20260726
          python -m py_compile "$root/reconstruct.py" "$root/run.py" "$root/test_run.py"

      - name: Run adversarial tests
        run: |
          set -euo pipefail
          root=research/ml_okx_consensus_relay_20260726
          PYTHONPATH="$root" pytest -vv "$root/test_run.py"

      - name: Run deterministic self-test
        run: |
          set -euo pipefail
          root=research/ml_okx_consensus_relay_20260726
          PYTHONPATH="$root" python "$root/run.py" self-test

      - name: Validate frozen JSON contracts
        run: |
          set -euo pipefail
          root=research/ml_okx_consensus_relay_20260726
          python -m json.tool "$root/WORK_CLAIM.json" >/dev/null
          python -m json.tool "$root/preregistration.json" >/dev/null
          python -m json.tool "$root/bundle_manifest.json" >/dev/null

      - name: Validate current project state
        run: |
          set -euo pipefail
          python scripts/validate_project.py

      - name: Record diagnostic hashes
        if: always()
        run: |
          set -euo pipefail
          out=research_runs/ml_okx_consensus_relay_20260726/diagnostic
          root=research/ml_okx_consensus_relay_20260726
          mkdir -p "$out"
          sha256sum \
            "$root/WORK_CLAIM.json" \
            "$root/preregistration.json" \
            "$root/bundle_manifest.json" \
            "$root/reconstruct.py" \
            "$root"/source_bundle.tar.gz.b64.part* \
            .github/workflows/ml-okx-consensus-diagnostic-r12.yml \
            > "$out/INPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-okx-consensus-diagnostic-${{ github.sha }}
          path: research_runs/ml_okx_consensus_relay_20260726/diagnostic
          if-no-files-found: error
          retention-days: 14
