name: YT Trinity frozen 2024H1 v2

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-frozen-2024h1-v2.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-frozen-2024h1-v2
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Persist run identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          payload={'schema_version':2,'run_id':int(os.environ['GITHUB_RUN_ID']),'trigger_sha':os.environ['GITHUB_SHA'],'source_sha':'d7486872efccf0b67b7209baeadfd12ff35b56d0','artifact_name':f"yt-trinity-frozen-2024h1-v2-{os.environ['GITHUB_SHA']}",'status':'in_progress'}
          Path('research/yt_trinity_ml/FROZEN_2024H1_V2_POINTER.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/FROZEN_2024H1_V2_POINTER.json
          git commit -m "Announce frozen YT Trinity 2024H1 v2 ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

  evaluate:
    needs: announce
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7486872efccf0b67b7209baeadfd12ff35b56d0
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: a2bb231966a517d29495bed7673e4d08ab8e30a9
          path: canonical_repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'pyarrow==19.0.1' 'scikit-learn==1.6.1'
      - name: Download frozen labels and market shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_artifact() {
            curl --fail --silent --show-error --location -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"
          }
          mkdir -p inputs/labels inputs/data/PRE_2024_2023/BTCUSDT inputs/data/PRE_2024_2023/ETHUSDT inputs/data/2024_H1/BTCUSDT inputs/data/2024_H1/ETHUSDT output
          fetch_artifact 8643192491 /tmp/labels.zip
          fetch_artifact 8636781702 /tmp/btc2023.zip
          fetch_artifact 8636761741 /tmp/eth2023.zip
          fetch_artifact 8636867995 /tmp/btc2024h1.zip
          fetch_artifact 8636882043 /tmp/eth2024h1.zip
          unzip -q /tmp/labels.zip -d inputs/labels
          unzip -q /tmp/btc2023.zip -d inputs/data/PRE_2024_2023/BTCUSDT
          unzip -q /tmp/eth2023.zip -d inputs/data/PRE_2024_2023/ETHUSDT
          unzip -q /tmp/btc2024h1.zip -d inputs/data/2024_H1/BTCUSDT
          unzip -q /tmp/eth2024h1.zip -d inputs/data/2024_H1/ETHUSDT
      - name: Verify exact code and execute
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd7486872efccf0b67b7209baeadfd12ff35b56d0'
          python -m py_compile research/yt_trinity_ml/run_frozen_period_v1.py research/yt_trinity_ml/system/corpus_alpha.py research/yt_trinity_ml/system/coarse.py
          python research/yt_trinity_ml/run_frozen_period_v1.py \
            --repo-root canonical_repo \
            --data-root inputs/data \
            --labels inputs/labels/EVENT_LABELS.pkl.gz \
            --output output \
            --segments PRE_2024_2023 2024_H1 \
            --start 2024-01-01T00:00:00Z \
            --end-exclusive 2024-07-01T00:00:00Z \
            --initial-nav 10000 \
            --risk-fraction 0.17 \
            --maximum-leverage 20 \
            --stage 2024_H1_FROZEN_CAUSAL_ML_COARSE_PROVISIONAL
      - uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-frozen-2024h1-v2-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Persist compact result pointer
        if: always()
        run: |
          set -euo pipefail
          git fetch origin agent/r22-yt-trinity-ml-001
          git checkout -B agent/r22-yt-trinity-ml-001 origin/agent/r22-yt-trinity-ml-001
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          path=Path('output/FROZEN_PERIOD_RESULT.json')
          result=json.loads(path.read_text()) if path.exists() else None
          payload={'schema_version':2,'run_id':int(os.environ['GITHUB_RUN_ID']),'trigger_sha':os.environ['GITHUB_SHA'],'source_sha':'d7486872efccf0b67b7209baeadfd12ff35b56d0','artifact_name':f"yt-trinity-frozen-2024h1-v2-{os.environ['GITHUB_SHA']}",'status':'success' if result else 'execution_failure_not_economic_failure','result_sha256':hashlib.sha256(path.read_bytes()).hexdigest() if result else None,'result':result}
          Path('research/yt_trinity_ml/FROZEN_2024H1_V2_POINTER.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True,default=str)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/FROZEN_2024H1_V2_POINTER.json
          git commit -m "Record frozen YT Trinity 2024H1 v2 ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt*3))
          done
          exit 1
