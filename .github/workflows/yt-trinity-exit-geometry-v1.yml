name: YT Trinity unified SMC exit geometry v1

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/run_exit_geometry_v1.py
      - .github/workflows/yt-trinity-exit-geometry-v1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-exit-geometry-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deterministic dependencies
        run: python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'pyarrow==19.0.1'
      - name: Download immutable labels and canonical 2023 bars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/labels input/btc input/eth output
          fetch_artifact() {
            local id="$1" target="$2"
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "${target}"
          }
          fetch_artifact 8643128359 /tmp/labels.zip
          fetch_artifact 8636781702 /tmp/btc.zip
          fetch_artifact 8636761741 /tmp/eth.zip
          unzip -q /tmp/labels.zip -d input/labels
          unzip -q /tmp/btc.zip -d input/btc
          unzip -q /tmp/eth.zip -d input/eth
          find input -type f | sort
          find input/labels -name EVENT_LABELS.pkl.gz -print -quit | tee /tmp/label_path
          find input/btc -path '*/trade_bars/1m.parquet' -print -quit | tee /tmp/btc_path
          find input/eth -path '*/trade_bars/1m.parquet' -print -quit | tee /tmp/eth_path
          test -s /tmp/label_path
          test -s /tmp/btc_path
          test -s /tmp/eth_path
      - name: Execute H1 discovery and frozen H2 validation
        run: |
          set +e
          python research/yt_trinity_ml/run_exit_geometry_v1.py \
            --labels "$(cat /tmp/label_path)" \
            --btc-bars "$(cat /tmp/btc_path)" \
            --eth-bars "$(cat /tmp/eth_path)" \
            --output output \
            2>&1 | tee output/STDOUT.log
          code=${PIPESTATUS[0]}
          echo "$code" > output/EXIT_CODE.txt
          exit 0
      - name: Bind and persist result pointer
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path('output')
          result_path = out / 'EXIT_GEOMETRY_RESULT.json'
          code = int((out / 'EXIT_CODE.txt').read_text().strip()) if (out / 'EXIT_CODE.txt').exists() else 99
          result = json.loads(result_path.read_text()) if result_path.exists() else None
          log = (out / 'STDOUT.log').read_text(errors='replace') if (out / 'STDOUT.log').exists() else ''
          pointer = {
              'schema_version': 1,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'stage': 'PRE2024_EXIT_GEOMETRY_H1_DISCOVERY_H2_VALIDATION_NOT_RANKABLE',
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'exit_code': code,
              'job_status': 'success' if code == 0 else 'execution_failure_not_economic_failure',
              'result': result,
              'result_sha256': hashlib.sha256(result_path.read_bytes()).hexdigest() if result_path.exists() else None,
              'stdout_tail': log[-12000:],
              'ranking_effect': 'NONE_PRE2024_NOT_RANKABLE',
          }
          target = Path('research/yt_trinity_ml/EXIT_GEOMETRY_V1_POINTER.json')
          target.write_text(json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/EXIT_GEOMETRY_V1_POINTER.json
          if ! git diff --cached --quiet; then
            git commit -m "Record unified SMC exit geometry ${GITHUB_RUN_ID}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin agent/r22-yt-trinity-ml-001
              if git push origin HEAD:agent/r22-yt-trinity-ml-001; then break; fi
              sleep $((attempt * 3))
            done
          fi
      - name: Hash and upload immutable evidence
        if: always()
        run: |
          (cd output && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-exit-geometry-v1-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Fail after evidence preservation
        if: always()
        run: test "$(cat output/EXIT_CODE.txt 2>/dev/null || echo 99)" = 0
