name: BTC ETF flow source export

on:
  push:
    branches: [agent/ml-btc-etf-flow-001]
    paths:
      - 'research/ml_btc_etf_flow/fetch_farside.py'
      - '.github/workflows/btc-etf-flow-source.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/ml_btc_etf_flow/fetch_farside.py'
      - '.github/workflows/btc-etf-flow-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas==2.3.3 pyarrow==21.0.0 requests==2.32.5 lxml==5.3.0
      - name: Preserve direct and fallback transports
        shell: bash
        run: |
          mkdir -p artifact/transport
          curl -L --fail-with-body --max-time 120 -A 'Mozilla/5.0 SMC-ICT-ETF-flow-research/2.0' \
            -o artifact/transport/farside_direct.bin \
            'https://farside.co.uk/bitcoin-etf-flow-all-data/' || true
          curl -L --fail-with-body --max-time 120 \
            -o artifact/transport/farside_jina_http.txt \
            'https://r.jina.ai/http://farside.co.uk/bitcoin-etf-flow-all-data/' || true
          curl -L --fail-with-body --max-time 120 \
            -o artifact/transport/farside_jina_https.txt \
            'https://r.jina.ai/https://farside.co.uk/bitcoin-etf-flow-all-data/' || true
          echo '--- Jina first 120 lines ---'
          sed -n '1,120p' artifact/transport/farside_jina_http.txt || true
          find artifact/transport -type f -print0 | sort -z | xargs -0 sha256sum > artifact/transport/SHA256SUMS
      - name: Fetch and validate Farside all-data table
        run: |
          python research/ml_btc_etf_flow/fetch_farside.py --output artifact/btc_etf_flow
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifact/btc_etf_flow/MANIFEST.json').read_text())
          assert m['rows'] >= 600
          assert m['start'].startswith('2024-01')
          assert m['end'] >= '2026-06-29'
          print(json.dumps(m, indent=2))
          PY
          find artifact/btc_etf_flow -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-etf-flow-source-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
