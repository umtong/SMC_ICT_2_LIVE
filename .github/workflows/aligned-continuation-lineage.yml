name: Trace aligned-continuation source lineage

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aligned-continuation-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace exact source and original package through retained refs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/original_packages
          git fetch --quiet --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*' || true
          blob='2eb432b03b7126d0feda365c4af44669c58336a0'
          git log --all --format='%H%x09%P%x09%ad%x09%s' --date=iso-strict --find-object="$blob" > artifact/source_commits.tsv || true
          : > artifact/source_refs.tsv
          : > artifact/source_trees.tsv
          while IFS=$'\t' read -r commit parents date subject; do
            [ -n "${commit:-}" ] || continue
            while read -r ref; do printf '%s\t%s\n' "$commit" "$ref" >> artifact/source_refs.tsv; done < <(git for-each-ref --format='%(refname)' --contains "$commit")
            git ls-tree -r --name-only "$commit" | grep -E '(^|/)(absorption|flow)|\.github/workflows' | sed "s#^#$commit\t#" >> artifact/source_trees.tsv || true
          done < artifact/source_commits.tsv

          git rev-list --objects --all | grep 'research/absorption_flow_benchmark_v1/' | sort -u > artifact/original_objects.tsv || true
          git log --all --format='%H%x09%P%x09%ad%x09%s' --date=iso-strict -- 'research/absorption_flow_benchmark_v1' | sort -u > artifact/original_commits.tsv || true
          : > artifact/original_refs.tsv
          : > artifact/original_trees.tsv
          cut -f1 artifact/original_commits.tsv | sort -u | while read -r commit; do
            [ -n "${commit:-}" ] || continue
            while read -r ref; do printf '%s\t%s\n' "$commit" "$ref" >> artifact/original_refs.tsv; done < <(git for-each-ref --format='%(refname)' --contains "$commit")
            git ls-tree -r --name-only "$commit" | grep -E 'absorption_flow_benchmark_v1|\.github/workflows/.*(absorption|flow)' | sed "s#^#$commit\t#" >> artifact/original_trees.tsv || true
            if git cat-file -e "$commit:research/absorption_flow_benchmark_v1" 2>/dev/null; then
              git archive "$commit" research/absorption_flow_benchmark_v1 | gzip -9 > "artifact/original_packages/${commit}.tar.gz"
            fi
          done
          find artifact -type f -print0 | sort -z | xargs -0 sha256sum > artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aligned-continuation-lineage-${{ github.sha }}
          path: artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
