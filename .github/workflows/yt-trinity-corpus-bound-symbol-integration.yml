name: YT Trinity corpus-bound conditional symbol integration

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/apply_corpus_bound_conditional_symbols.py
      - .github/workflows/yt-trinity-corpus-bound-symbol-integration.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-corpus-bound-symbol-integration
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Apply conditional symbol selection
        run: python research/yt_trinity_ml/apply_corpus_bound_conditional_symbols.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Compile and test symbol integration
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q --upgrade numpy pandas scikit-learn pyarrow requests pytest playwright
          python -m py_compile \
            research/yt_trinity_ml/run_corpus_bound_system.py \
            research/yt_trinity_ml/synthesize_corpus_system_contract.py
          pytest -q research/yt_trinity_ml/tests
      - name: Commit integration and remove materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/yt_trinity_ml/run_corpus_bound_system.py \
            research/yt_trinity_ml/synthesize_corpus_system_contract.py
          git rm -f \
            research/yt_trinity_ml/apply_corpus_bound_conditional_symbols.py \
            .github/workflows/yt-trinity-corpus-bound-symbol-integration.yml
          git commit -m "Select SOL and XRP only on pre-2024 account growth"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
