name: YT Trinity 2024H1 decision frame export

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-2024h1-decision-frame-export.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-2024h1-decision-frame-export
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Persist observable run
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          payload={'schema_version':1,'run_id':int(os.environ['GITHUB_RUN_ID']),'trigger_sha':os.environ['GITHUB_SHA'],'source_sha':'d7486872efccf0b67b7209baeadfd12ff35b56d0','artifact_name':f"yt-trinity-2024h1-decision-frames-{os.environ['GITHUB_SHA']}",'status':'in_progress'}
          Path('research/yt_trinity_ml/DECISION_FRAMES_2024H1_POINTER.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/DECISION_FRAMES_2024H1_POINTER.json
          git commit -m "Announce 2024H1 decision frame export ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

  export:
    needs: announce
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7486872efccf0b67b7209baeadfd12ff35b56d0
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: a2bb231966a517d29495bed7673e4d08ab8e30a9
          path: canonical_repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'pyarrow==19.0.1'
      - name: Download immutable shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_artifact() {
            curl --fail --silent --show-error --location -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"
          }
          mkdir -p inputs/data/PRE_2024_2023/{BTCUSDT,ETHUSDT} inputs/data/2024_H1/{BTCUSDT,ETHUSDT} output
          fetch_artifact 8636781702 /tmp/btc2023.zip
          fetch_artifact 8636761741 /tmp/eth2023.zip
          fetch_artifact 8636867995 /tmp/btc2024h1.zip
          fetch_artifact 8636882043 /tmp/eth2024h1.zip
          unzip -q /tmp/btc2023.zip -d inputs/data/PRE_2024_2023/BTCUSDT
          unzip -q /tmp/eth2023.zip -d inputs/data/PRE_2024_2023/ETHUSDT
          unzip -q /tmp/btc2024h1.zip -d inputs/data/2024_H1/BTCUSDT
          unzip -q /tmp/eth2024h1.zip -d inputs/data/2024_H1/ETHUSDT
      - name: Assemble and export causal 5m frames only
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python - <<'PY'
          import gzip,hashlib,json,os,pickle
          from pathlib import Path
          from system.canonical_adapter import CanonicalInputConfig,assemble_symbol_frame
          frames={}
          for symbol in ('BTCUSDT','ETHUSDT'):
              frame,_=assemble_symbol_frame(Path('inputs/data'),Path('canonical_repo'),symbol,('PRE_2024_2023','2024_H1'),CanonicalInputConfig(trade_timeframe='5m',decision_timeframe_ms=300000))
              frames[symbol]=frame
          with gzip.open('output/DECISION_FRAMES_2024H1.pkl.gz','wb',compresslevel=6) as fh:pickle.dump(frames,fh,pickle.HIGHEST_PROTOCOL)
          path=Path('output/DECISION_FRAMES_2024H1.pkl.gz')
          manifest={'schema_version':1,'source_sha':os.environ['GITHUB_SHA'],'rows':{s:len(f) for s,f in frames.items()},'columns':{s:list(f.columns) for s,f in frames.items()},'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'bytes':path.stat().st_size}
          Path('output/MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-2024h1-decision-frames-${{ github.sha }}
          path: output
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
