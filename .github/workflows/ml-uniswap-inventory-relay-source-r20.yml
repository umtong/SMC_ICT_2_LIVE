name: ML Uniswap inventory-relay source gate

on:
  push:
    branches:
      - agent/r20-ml-uniswap-inventory-relay-001
    paths:
      - "research/uniswap_inventory_relay_20260726/**"
      - ".github/workflows/ml-uniswap-inventory-relay-source-r20.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/uniswap_inventory_relay_20260726/**"
      - ".github/workflows/ml-uniswap-inventory-relay-source-r20.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-uniswap-inventory-relay-source-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      ROOT: research/uniswap_inventory_relay_20260726
      OUT: research_runs/uniswap_inventory_relay_20260726/source_r20
      CACHE: ${{ runner.temp }}/uniswap_inventory_relay_cache
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen source environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "pandas==2.2.3" \
            "pyarrow==18.1.0" \
            "requests==2.32.4" \
            "pytest==8.3.4"

      - name: Verify frozen contract and deterministic pre-outcome correction
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$ROOT/preregistration.json" >/dev/null
          python -m json.tool "$ROOT/EXECUTION_CORRECTION_001_SOURCE_TYPO_BEFORE_OUTCOME.json" >/dev/null
          python -m py_compile "$ROOT/source_gate_launcher.py" "$ROOT/test_source_gate_launcher.py"
          PYTHONPATH="$ROOT" pytest -q "$ROOT/test_source_gate_launcher.py"
          python "$ROOT/source_gate_launcher.py" --verify-only
          python scripts/validate_project.py

      - name: Run outcome-sealed immutable source gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$CACHE"
          mkdir -p "$OUT" "$CACHE"
          python "$ROOT/source_gate_launcher.py" \
            --output "$OUT" \
            --cache "$CACHE" \
            2>&1 | tee "$OUT/RUN_SOURCE.log"

      - name: Verify source decision and outcome seal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUT/SOURCE_GATE.json"
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("research_runs/uniswap_inventory_relay_20260726/source_r20/SOURCE_GATE.json")
          result=json.loads(path.read_text())
          assert result["claim_id"]=="CLM-20260726-2315-ML-UNISWAP-INVENTORY-001"
          assert result["status"]=="SOURCE_GATE_PASS"
          assert result["decision"]=="OPEN_FROZEN_PRE2024_MODEL_STAGE"
          assert result["outcome_market_data_opened"] is False
          assert result["model_fitted"] is False
          assert result["strategy_pnl_opened"] is False
          assert result["2024_strategy_outcome_opened"] is False
          assert result["orders_submitted"] is False
          print(json.dumps({
              "status":result["status"],
              "uniswap_rows":result["uniswap"]["rows"],
              "uniswap_files":result["uniswap"]["file_count"],
              "block_files":result["ethereum_blocks"]["file_count"],
              "bybit_probe_files":len(result["bybit_probe"]),
          },sort_keys=True))
          PY
          (cd "$OUT" && sha256sum --check SHA256SUMS.txt)
          mkdir -p "$OUT/input"
          sha256sum \
            "$ROOT/README.md" \
            "$ROOT/preregistration.json" \
            "$ROOT/source_gate.py" \
            "$ROOT/source_gate_launcher.py" \
            "$ROOT/test_source_gate_launcher.py" \
            "$ROOT/EXECUTION_CORRECTION_001_SOURCE_TYPO_BEFORE_OUTCOME.json" \
            .github/workflows/ml-uniswap-inventory-relay-source-r20.yml \
            > "$OUT/input/INPUT_SHA256SUMS.txt"
          python scripts/validate_project.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-uniswap-inventory-relay-source-${{ github.sha }}
          path: research_runs/uniswap_inventory_relay_20260726/source_r20
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
