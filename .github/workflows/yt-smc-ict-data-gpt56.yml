name: YT SMC ICT causal Bybit data gpt56

on:
  workflow_dispatch:
  push:
    branches:
      - agent/yt-smc-ict-causal-ml-gpt56-20260727
    paths:
      - research/yt_smc_ict_gpt56/download_bybit.py
      - .github/workflows/yt-smc-ict-data-gpt56.yml

permissions:
  contents: write

concurrency:
  group: yt-smc-ict-data-gpt56-${{ github.ref }}
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pandas pyarrow requests

      - name: Compile and test downloader
        run: |
          python -m py_compile research/yt_smc_ict_gpt56/download_bybit.py
          python research/yt_smc_ict_gpt56/download_bybit.py --self-test

      - name: Restore causal Bybit data cache
        id: cache
        uses: actions/cache@v4
        with:
          path: artifact/bybit_data
          key: yt-smc-ict-gpt56-bybit-linear-5m-btc-eth-20210101-20260701-v1

      - name: Download complete causal research window
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf artifact/bybit_data
          python research/yt_smc_ict_gpt56/download_bybit.py \
            --output artifact/bybit_data \
            --start 2021-01-01T00:00:00Z \
            --end-exclusive 2026-07-01T00:00:00Z \
            --symbols BTCUSDT ETHUSDT \
            --interval 5 \
            2>&1 | tee artifact/BYBIT_DATA_STDOUT.log
          cp artifact/BYBIT_DATA_STDOUT.log artifact/bybit_data/BYBIT_DATA_STDOUT.log

      - name: Verify data manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifact/bybit_data/DATA_MANIFEST.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          required = {'BTCUSDT', 'ETHUSDT'}
          found = set(manifest['symbols'])
          if found != required:
              raise SystemExit(f'symbol mismatch: {found}')
          for symbol, item in manifest['symbols'].items():
              bars = item['bars']
              if bars['rows'] < 550_000:
                  raise SystemExit(f'{symbol} insufficient rows: {bars["rows"]}')
              if bars['missing_count'] > 100:
                  raise SystemExit(f'{symbol} excessive missing bars: {bars["missing_count"]}')
          print(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Write recoverable data pointer
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest_path = Path('artifact/bybit_data/DATA_MANIFEST.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          source_sha = os.environ['GITHUB_SHA']
          pointer = {
              'schema_version': 1,
              'data_id': 'BYBIT-LINEAR-5M-BTCETH-20210101-20260630-GPT56-V1',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'source_sha': source_sha,
              'branch': os.environ['GITHUB_REF_NAME'],
              'artifact_name': f'yt-smc-ict-bybit-data-gpt56-{source_sha}',
              'cache_key': 'yt-smc-ict-gpt56-bybit-linear-5m-btc-eth-20210101-20260701-v1',
              'manifest_sha256': hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              'manifest': manifest,
          }
          path = Path('research/yt_smc_ict_gpt56/DATA_POINTER.json')
          path.write_text(json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload immutable data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-smc-ict-bybit-data-gpt56-${{ github.sha }}
          path: artifact/bybit_data
          if-no-files-found: error
          compression-level: 3
          retention-days: 30

      - name: Commit data pointer to research branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/yt_smc_ict_gpt56/DATA_POINTER.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record causal Bybit data ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
