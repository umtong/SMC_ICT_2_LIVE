name: Option surface public data probe

on:
  push:
    branches: [agent/r9-option-surface-skew-001]
    paths:
      - 'research/option_surface_skew_20260726/**'
      - '.github/workflows/option-surface-data-probe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/option_surface_skew_20260726/**'
      - '.github/workflows/option-surface-data-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed probe environment
        run: python -m pip install 'requests==2.32.3'
      - name: Compile and run data probe before any strategy PnL
        run: |
          set -euo pipefail
          python -m py_compile research/option_surface_skew_20260726/probe_public_option_data.py
          python research/option_surface_skew_20260726/probe_public_option_data.py \
            --output /tmp/option-surface-probe \
            --max-tardis-rows 100000 \
            | tee /tmp/option-surface-probe.log
      - name: Freeze probe hashes
        if: always()
        run: |
          mkdir -p /tmp/option-surface-probe
          cp /tmp/option-surface-probe.log /tmp/option-surface-probe/run.log 2>/dev/null || true
          find /tmp/option-surface-probe -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/option-surface-probe/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: option-surface-public-data-probe-${{ github.run_id }}
          path: /tmp/option-surface-probe
          if-no-files-found: error
          retention-days: 30
