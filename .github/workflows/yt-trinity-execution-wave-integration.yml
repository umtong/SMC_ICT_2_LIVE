name: YT Trinity latest-head execution wave integration

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/apply_execution_wave_trigger.py
      - .github/workflows/yt-trinity-execution-wave-integration.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-latest-head-execution-wave-integration
  cancel-in-progress: false

jobs:
  apply-commit-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Attach and create common execution trigger
        run: python research/yt_trinity_ml/apply_execution_wave_trigger.py
      - name: Commit one latest-head execution wave
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/yt-trinity-*.yml control/yt-trinity-execution-wave-trigger.json
          git rm -f \
            research/yt_trinity_ml/apply_execution_wave_trigger.py \
            .github/workflows/yt-trinity-execution-wave-integration.yml
          git commit -m "Start latest-head YT Trinity execution wave"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
