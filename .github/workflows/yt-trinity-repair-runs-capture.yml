name: YT Trinity capture repair workflow states

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-repair-runs-capture.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Capture latest runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          workflows=[
              'yt-trinity-cancel-latency-repair.yml',
              'yt-trinity-h1-context-carry-repair.yml',
              'yt-trinity-history-model-screen.yml',
          ]
          result={}
          for workflow in workflows:
              url=f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch=agent/r22-yt-trinity-ml-001&per_page=20'
              req=urllib.request.Request(url,headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f'Bearer {token}',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'github-actions',
              })
              with urllib.request.urlopen(req) as response:
                  data=json.load(response)
              runs=data.get('workflow_runs',[])
              result[workflow]=[
                  {k:r.get(k) for k in ('id','head_sha','status','conclusion','event','created_at','updated_at','run_attempt')}
                  for r in runs[:5]
              ]
          Path('research/yt_trinity_ml/REPAIR_RUN_STATES.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist and remove carrier
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/REPAIR_RUN_STATES.json
          git rm .github/workflows/yt-trinity-repair-runs-capture.yml
          git commit -m 'Capture SMC repair and history run states'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
