name: YT Trinity explicit 2021-2023 causal action screen

on:
  workflow_dispatch:
  push:
    branches:
      - agent/r22-yt-trinity-ml-001
    paths:
      - .github/workflows/yt-trinity-history-model-screen.yml
      - research/yt_trinity_ml/PRE2024_HISTORY_READY.json
      - research/yt_trinity_ml/run_causal_action_history.py
      - research/yt_trinity_ml/run_causal_action_v1.py
      - research/yt_trinity_ml/run_causal_action_fast.py
      - research/yt_trinity_ml/system/corpus_alpha.py
      - research/yt_trinity_ml/system/causal_action_candidates.py
      - research/yt_trinity_ml/system/causal_action_history_model.py
      - research/yt_trinity_ml/tests/test_causal_action_history_model.py

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-history-model-screen-${{ github.sha }}
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/r22-yt-trinity-ml-001
  CANONICAL_COMMIT: a2bb231966a517d29495bed7673e4d08ab8e30a9

jobs:
  explicit-history-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact research source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Authorize complete 2021-2022 history only
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('research/yt_trinity_ml/PRE2024_HISTORY_READY.json')
          if not path.exists():
              raise SystemExit('PRE2024_HISTORY_READY.json is absent')
          payload = json.loads(path.read_text())
          assert payload['status'] == 'PASS_COMPLETE', payload
          assert payload['segments'] == ['PRE_2024_2021', 'PRE_2024_2022'], payload
          assert payload['symbols'] == ['BTCUSDT', 'ETHUSDT'], payload
          assert payload['training_use']['base_learning'] == ['2021', '2022'], payload
          assert payload['training_use']['calibration'] == '2023_H1', payload
          assert payload['training_use']['final_pre2024_selection'] == '2023_H2', payload
          assert payload['training_use']['official_evaluation_opened'] is False, payload
          PY

      - name: Checkout exact canonical loader
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: ${{ env.CANONICAL_COMMIT }}
          path: canonical_repo
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic dependencies
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q \
            "numpy==2.2.6" "pandas==2.2.3" "scikit-learn==1.6.1" \
            "pyarrow==19.0.1" "pytest==8.3.5"

      - name: Download immutable 2021-2024H1 BTC ETH shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/data output
          fetch_named_artifact() {
            local name="$1" target="$2"
            local metadata id digest
            metadata="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100")"
            id="$(python -c 'import json,sys; a=[x for x in json.load(sys.stdin)["artifacts"] if not x["expired"]]; print(max(a,key=lambda x:x["created_at"])["id"])' <<<"${metadata}")"
            digest="$(python -c 'import json,sys; a=[x for x in json.load(sys.stdin)["artifacts"] if not x["expired"]]; print(max(a,key=lambda x:x["created_at"])["digest"])' <<<"${metadata}")"
            mkdir -p "${target}"
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "/tmp/${id}.zip"
            unzip -q "/tmp/${id}.zip" -d "${target}"
            printf '%s\t%s\t%s\n' "${name}" "${id}" "${digest}" >> output/DATA_ARTIFACTS.tsv
          }
          for segment in PRE_2024_2021 PRE_2024_2022 PRE_2024_2023 2024_H1; do
            for symbol in BTCUSDT ETHUSDT; do
              fetch_named_artifact \
                "canonical-bybit-${segment}-${symbol}" \
                "inputs/data/${segment}/${symbol}"
            done
          done

      - name: Verify data periods, causal source signatures and regressions
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set +e
          {
            python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              'PRE_2024_2021': ('2021-01-01T00:00:00Z', '2022-01-01T00:00:00Z'),
              'PRE_2024_2022': ('2022-01-01T00:00:00Z', '2023-01-01T00:00:00Z'),
              'PRE_2024_2023': ('2023-01-01T00:00:00Z', '2024-01-01T00:00:00Z'),
              '2024_H1': ('2024-01-01T00:00:00Z', '2024-07-01T00:00:00Z'),
          }
          required_streams = (
              'trade_price_1m', 'mark_price_1m', 'index_price_1m',
              'premium_index_1m', 'open_interest_5m', 'account_ratio_5m',
          )
          for segment, (start, end) in expected.items():
              for symbol in ('BTCUSDT', 'ETHUSDT'):
                  root = Path(f'inputs/data/{segment}/{symbol}')
                  manifest = json.loads((root / 'DATASET_MANIFEST.json').read_text())
                  assert manifest['symbol'] == symbol, manifest
                  assert manifest['physical_segment'] == segment, manifest
                  assert manifest['start'] == start, manifest
                  assert manifest['end_exclusive'] == end, manifest
                  for stream in required_streams:
                      coverage = manifest['coverage'][stream]
                      assert int(coverage['missing_rows']) == 0, (segment, symbol, stream, coverage)
                      assert float(coverage['coverage']) == 1.0, (segment, symbol, stream, coverage)
                  assert (root / 'trade_bars/1m.parquet').exists()
                  assert (root / 'trade_bars/5m.parquet').exists()
          PY
            grep -q 'passive_depth_fraction' research/yt_trinity_ml/system/causal_action_candidates.py
            grep -q 'structural_cancel_at' research/yt_trinity_ml/run_causal_action_fast.py
            grep -q 'PD_ARRAY_CLOSE_FAILURE' research/yt_trinity_ml/run_causal_action_fast.py
            grep -q '_causal_risk_grid' research/yt_trinity_ml/run_causal_action_v1.py
            grep -q 'fallback_fill_probability' research/yt_trinity_ml/system/causal_action_history_model.py
            python -m py_compile \
              research/yt_trinity_ml/system/corpus_alpha.py \
              research/yt_trinity_ml/system/canonical_adapter.py \
              research/yt_trinity_ml/system/causal_action_candidates.py \
              research/yt_trinity_ml/system/causal_action_history_model.py \
              research/yt_trinity_ml/run_causal_action_v1.py \
              research/yt_trinity_ml/run_causal_action_fast.py \
              research/yt_trinity_ml/run_causal_action_history.py
            pytest -q \
              research/yt_trinity_ml/tests/test_corpus_alpha.py \
              research/yt_trinity_ml/tests/test_causal_action_candidates.py \
              research/yt_trinity_ml/tests/test_causal_action_fast.py \
              research/yt_trinity_ml/tests/test_passive_transition_cancel.py \
              research/yt_trinity_ml/tests/test_passive_supersession.py \
              research/yt_trinity_ml/tests/test_pd_array_failure_exit.py \
              research/yt_trinity_ml/tests/test_causal_risk_domain.py \
              research/yt_trinity_ml/tests/test_causal_action_history_model.py \
              research/yt_trinity_ml/tests/test_execution_realism.py \
              research/yt_trinity_ml/tests/test_entry_fill_guard.py \
              research/yt_trinity_ml/tests/test_yt_trinity_system.py
          } 2>&1 | tee output/VERIFY.log
          code=${PIPESTATUS[0]}
          echo "$code" > output/VERIFY_EXIT_CODE.txt
          exit "$code"

      - name: Run explicit pre-2024 selection and untouched 2024H1
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set +e
          python research/yt_trinity_ml/run_causal_action_history.py \
            --repo-root canonical_repo \
            --data-root inputs/data \
            --instrument-rules research/yt_trinity_ml/INSTRUMENT_RULES.json \
            --output output \
            2>&1 | tee output/STDOUT.log
          code=${PIPESTATUS[0]}
          echo "$code" > output/EXIT_CODE.txt
          exit 0

      - name: Bind immutable result and publish compact pointer
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          output = Path('output')
          output.mkdir(exist_ok=True)
          verify_code = int((output / 'VERIFY_EXIT_CODE.txt').read_text()) if (output / 'VERIFY_EXIT_CODE.txt').exists() else 99
          exit_code = int((output / 'EXIT_CODE.txt').read_text()) if (output / 'EXIT_CODE.txt').exists() else 99
          result_path = output / 'CAUSAL_ACTION_HISTORY_RESULT.json'
          result = json.loads(result_path.read_text()) if result_path.exists() else None
          verify_log = (output / 'VERIFY.log').read_text(errors='replace') if (output / 'VERIFY.log').exists() else ''
          run_log = (output / 'STDOUT.log').read_text(errors='replace') if (output / 'STDOUT.log').exists() else ''
          if verify_code != 0:
              status = 'verification_failure_not_economic_failure'
          elif exit_code != 0:
              status = 'execution_failure_not_economic_failure'
          else:
              status = 'success'
          pointer = {
              'schema_version': 1,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'stage': 'EXPLICIT_2021_2023_TO_2024H1_COARSE_NOT_RANKABLE',
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ.get('GITHUB_RUN_ATTEMPT', '1')),
              'canonical_loader_commit': os.environ['CANONICAL_COMMIT'],
              'verification_exit_code': verify_code,
              'exit_code': exit_code,
              'job_status': status,
              'result': result,
              'result_sha256': hashlib.sha256(result_path.read_bytes()).hexdigest() if result_path.exists() else None,
              'verification_tail': verify_log[-12000:],
              'stdout_tail': run_log[-16000:],
              'python': sys.version,
              'platform': platform.platform(),
              'ranking_effect': 'NONE_COARSE_1M_NOT_RANKABLE',
          }
          target = output / 'CAUSAL_ACTION_HISTORY_POINTER.json'
          target.write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('/tmp/CAUSAL_ACTION_HISTORY_POINTER.json').write_bytes(target.read_bytes())
          PY
          (
            cd output
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          cp /tmp/CAUSAL_ACTION_HISTORY_POINTER.json \
            research/yt_trinity_ml/CAUSAL_ACTION_HISTORY_POINTER.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/CAUSAL_ACTION_HISTORY_POINTER.json
          if ! git diff --cached --quiet; then
            git commit -m "Record explicit-history causal action result ${GITHUB_RUN_ID}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin "$TARGET_BRANCH"
              if git push origin "HEAD:$TARGET_BRANCH"; then break; fi
              sleep $((attempt * 3))
            done
          fi

      - name: Upload immutable explicit-history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-history-model-screen-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Fail only after evidence is preserved
        if: always()
        run: |
          test "$(cat output/VERIFY_EXIT_CODE.txt 2>/dev/null || echo 99)" = 0
          test "$(cat output/EXIT_CODE.txt 2>/dev/null || echo 99)" = 0
