name: Synthetic two-factor microshock self-test

on:
  pull_request:
    branches:
      - main
    paths:
      - "research/bybit_twofactor_microshock_20260726/screen.py"
      - "research/bybit_twofactor_microshock_20260726/test_screen.py"
      - ".github/workflows/twofactor-microshock-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy==2.2.6" "pandas==2.2.3" "requests==2.32.4" "pytest==8.3.4"
      - run: PYTHONPATH=research/bybit_twofactor_microshock_20260726 pytest -q research/bybit_twofactor_microshock_20260726/test_screen.py
