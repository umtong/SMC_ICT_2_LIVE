name: L2 maker toxicity V1

on:
  pull_request:
    branches: [main]
    paths:
      - "research/l2_maker_toxicity_v1/**"
      - ".github/workflows/l2-maker-toxicity-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l2-maker-toxicity-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ETAG_TIMEOUT: "120"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      OUT: ${{ github.workspace }}/research_runs/l2_maker_toxicity_v1
      CACHE: ${{ github.workspace }}/.cache/l2_maker_toxicity_v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixed research environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "pyarrow==18.1.0" \
            "scikit-learn==1.6.1" \
            "huggingface_hub==0.27.1" \
            "hf_xet==1.1.10" \
            "pytest==8.3.4"

      - name: Run causal execution tests
        run: |
          set -euo pipefail
          pytest -q research/l2_maker_toxicity_v1/test_run.py

      - name: Run preregistered discovery and validation
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$CACHE"
          cp research/l2_maker_toxicity_v1/preregistration.json "$OUT/preregistration.json"
          python research/l2_maker_toxicity_v1/run.py --output "$OUT" --cache "$CACHE" 2>&1 | tee "$OUT/run.log"

      - name: Assert sealed dates and safety state
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('research_runs/l2_maker_toxicity_v1')
          status={'orders_submitted':False,'paper_live_enabled':False,'terminal_dates_opened':False}
          if (out/'summary.json').exists():
              s=json.loads((out/'summary.json').read_text())
              assert not s.get('terminal_dates_opened',False)
              assert not s.get('orders_submitted',False)
              assert not s.get('paper_live_enabled',False)
              status['status']=s.get('status')
              status['candidate_count']=s.get('candidate_count')
              status['calibration_gate_count']=s.get('calibration_gate_count')
              status['validation_gate_count']=s.get('validation_gate_count')
          (out/'wrapper_status.json').write_text(json.dumps(status,indent=2,sort_keys=True))
          print(json.dumps(status,sort_keys=True))
          PY

      - name: Record immutable output hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          find "$OUT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2-maker-toxicity-v1-${{ github.sha }}
          path: research_runs/l2_maker_toxicity_v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
