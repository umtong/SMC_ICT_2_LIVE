name: Hazard OCO V5 boundary-accounting diagnostic

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/hazard-oco-boundary-v5.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hazard-oco-boundary-v5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "numpy==2.1.3" "pandas==2.2.3" "scipy==1.14.1" "scikit-learn==1.5.2" "pytest==8.3.4"
      - name: Reconstruct and patch
        shell: bash
        run: |
          set -euo pipefail
          root=research/hazard_oco_20260726
          python "$root/reconstruct.py"
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path

          root = Path("research/hazard_oco_20260726")
          source = root / "reconstructed/run.py"
          out = root / "boundary_v5"
          out.mkdir(parents=True, exist_ok=True)
          original = source.read_text()
          original_sha = hashlib.sha256(original.encode()).hexdigest()
          assert original_sha == "378ce2219b460829f93c201068cae7b4c1b192b6fc9d3ef59b64396ef93989ee"
          old = base64.b64decode("").decode()
          new = base64.b64decode("").decode()
          assert original.count(old) == 1
          patched = original.replace(old, new).replace(
              'ENGINE_VERSION = "BYBIT_HAZARD_OCO_V1"',
              'ENGINE_VERSION = "BYBIT_HAZARD_OCO_V1_BOUNDARY_ACCOUNTING_DIAGNOSTIC"', 1,
          )
          patched_sha = hashlib.sha256(patched.encode()).hexdigest()
          assert patched_sha == "d65a27341a9da1167a35b8ef1b0e88066f72646e29f162d2a0fca0eebb566eb3"
          (out / "run.py").write_text(patched)
          (out / "PATCH_ATTESTATION.json").write_text(json.dumps({
              "schema_version": 1,
              "claim_id": "CLM-20260726-0248-HAZARD-OCO-001",
              "status": "POST_OUTCOME_ACCOUNTING_DIAGNOSTIC_NOT_CLEAN_HOLDOUT",
              "original_source_sha256": original_sha,
              "patched_source_sha256": patched_sha,
              "changes": [
                  "no executable entry quote means no fill",
                  "accepted unresolved entry is charged full planned stop plus frozen cost",
                  "dates signals thresholds candidates and market rules unchanged",
              ],
          }, indent=2, sort_keys=True) + "\n")
          PY
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          root=research/hazard_oco_20260726
          code="$root/boundary_v5"
          cp "$root/reconstructed/test_run.py" "$code/test_run_legacy.py"
          python -m py_compile "$code/run.py" "$code/test_run_legacy.py"
          PYTHONPATH="$code" pytest -q "$code/test_run_legacy.py" -k "not unresolved_trade_sets_terminal_nav"
          PYTHONPATH="$code" python - <<'PY'
          import numpy as np
          import run as h
          from test_run_legacy import candidate, decision_frame, synthetic_grid

          f = decision_frame()
          for name in h.FEATURE_COLUMNS:
              f[name] = 0.0
          m = h.TrainedModel("logistic", None, np.array([0.9]), {0.95: 0.5}, 0.5, {})
          old_days, old_resolver = h.DEVELOPMENT_DAYS, h.resolve_pair
          h.DEVELOPMENT_DAYS = ("synthetic",)
          try:
              filled = h.PotentialOutcome(
                  str(f.iloc[0].decision_key), "synthetic", int(f.iloc[0].decision_us), 99_000_000,
                  1_000_000.0, True, True, 1, 10_000_000, None, 100.0, None, -1.0, False, "unresolved",
              )
              h.resolve_pair = lambda *a, **k: filled
              trades, state = h.simulate_account(
                  candidate(), m, 0.5, {"synthetic": f}, {"synthetic": np.array([0.9])},
                  {"synthetic": synthetic_grid()}, 12.0, 100,
              )
              expected = trades[0].notional * (candidate().stop_bp + 12.0) / 1e4
              assert not state["terminal_account_loss"]
              assert abs(state["ending_nav"] - (h.INITIAL_NAV - expected)) < 1e-9
              assert trades[0].exit_reason.endswith("__charged_full_planned_stop")

              no_fill = h.PotentialOutcome(
                  str(f.iloc[0].decision_key), "synthetic", int(f.iloc[0].decision_us), 99_000_000,
                  1_000_000.0, True, True, 1, None, None, None, None, -1.0, False, "entry_fill_unresolved",
              )
              h.resolve_pair = lambda *a, **k: no_fill
              trades, state = h.simulate_account(
                  candidate(), m, 0.5, {"synthetic": f}, {"synthetic": np.array([0.9])},
                  {"synthetic": synthetic_grid()}, 12.0, 100,
              )
              assert trades == [] and state["ending_nav"] == h.INITIAL_NAV
          finally:
              h.DEVELOPMENT_DAYS, h.resolve_pair = old_days, old_resolver
          print("boundary accounting tests passed")
          PY
          PYTHONPATH="$code" python "$code/run.py" --self-test
          python scripts/validate_project.py
      - name: Run corrected 162-candidate screen
        shell: bash
        run: |
          set -euo pipefail
          code=research/hazard_oco_20260726/boundary_v5
          out=research_runs/hazard_oco_20260726/boundary_v5
          mkdir -p "$out"
          cp "$code/PATCH_ATTESTATION.json" "$out/"
          PYTHONPATH="$code" python "$code/run.py" --output "$out" --cache "$RUNNER_TEMP/hazard-oco-bybit-cache" 2>&1 | tee "$out/run.log"
      - name: Checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=research/hazard_oco_20260726
          out=research_runs/hazard_oco_20260726/boundary_v5
          mkdir -p "$out"
          sha256sum "$root/reconstructed/run.py" "$root/boundary_v5/run.py" "$root/boundary_v5/PATCH_ATTESTATION.json" ".github/workflows/hazard-oco-boundary-v5.yml" > "$out/INPUT_SHA256SUMS.txt"
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hazard-oco-boundary-v5-${{ github.sha }}
          path: research_runs/hazard_oco_20260726/boundary_v5
          if-no-files-found: error
          retention-days: 90
