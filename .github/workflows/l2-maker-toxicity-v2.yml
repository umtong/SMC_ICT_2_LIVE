name: L2 maker toxicity V2 causal research

on:
  pull_request:
    branches: [main]
    paths:
      - "research/l2_maker_toxicity_v1/**"
      - ".github/workflows/l2-maker-toxicity-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l2-maker-toxicity-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ETAG_TIMEOUT: "120"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      ROOT: ${{ github.workspace }}/research_runs/l2_maker_toxicity_v2
      SOURCE_ROOT: ${{ github.workspace }}/research_runs/l2_maker_toxicity_v2/source
      CACHE: ${{ github.workspace }}/.cache/l2_maker_toxicity_v2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct and verify corrected immutable sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_ROOT" "$ROOT" "$CACHE"
          python - <<'PY'
          from __future__ import annotations
          import base64, gzip, hashlib, json
          from pathlib import Path

          transport=Path('research/l2_maker_toxicity_v1/v2_source')
          output=Path('research_runs/l2_maker_toxicity_v2/source')
          manifest=json.loads((transport/'manifest.json').read_text(encoding='utf-8'))
          names={'run.py':'run_py.gz.b64.part', 'test_run.py':'test_run_py.gz.b64.part', 'preregistration.json':'preregistration_json.gz.b64.part'}
          for logical,prefix in names.items():
              spec=manifest[logical]
              chunks=[]
              for part in spec['parts']:
                  path=transport/part['name']
                  payload=path.read_bytes()
                  assert len(payload)==part['bytes']
                  assert hashlib.sha256(payload).hexdigest()==part['sha256']
                  chunks.append(payload)
              encoded=b''.join(chunks)
              assert len(encoded)==spec['base64_bytes']
              assert hashlib.sha256(encoded).hexdigest()==spec['base64_sha256']
              compressed=base64.b64decode(encoded,validate=True)
              assert len(compressed)==spec['gzip_bytes']
              assert hashlib.sha256(compressed).hexdigest()==spec['gzip_sha256']
              raw=gzip.decompress(compressed)
              assert len(raw)==spec['raw_bytes']
              assert hashlib.sha256(raw).hexdigest()==spec['raw_sha256']
              (output/logical).write_bytes(raw)
          (output/'transport_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True),encoding='utf-8')
          compile((output/'run.py').read_bytes(),str(output/'run.py'),'exec')
          compile((output/'test_run.py').read_bytes(),str(output/'test_run.py'),'exec')
          print({k:v['raw_sha256'] for k,v in manifest.items()})
          PY

      - name: Install fixed research environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "pyarrow==18.1.0" \
            "scikit-learn==1.6.1" \
            "huggingface_hub==0.27.1" \
            "hf_xet==1.1.10" \
            "pytest==8.3.4"
          python - <<'PY'
          import json, platform, sys
          import numpy, pandas, pyarrow, sklearn, huggingface_hub
          from pathlib import Path
          payload={
            'python':sys.version,'platform':platform.platform(),'machine':platform.machine(),
            'numpy':numpy.__version__,'pandas':pandas.__version__,'pyarrow':pyarrow.__version__,
            'scikit_learn':sklearn.__version__,'huggingface_hub':huggingface_hub.__version__,
            'orders_submitted':False,'paper_live_enabled':False,'terminal_dates_opened':False,
          }
          Path('research_runs/l2_maker_toxicity_v2/environment.json').write_text(json.dumps(payload,indent=2,sort_keys=True))
          PY

      - name: Run corrected causality and execution regression tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q "$SOURCE_ROOT/test_run.py" 2>&1 | tee "$ROOT/unit_tests.log"

      - name: Run preregistered discovery and validation
        shell: bash
        run: |
          set -euo pipefail
          python "$SOURCE_ROOT/run.py" --output "$ROOT" --cache "$CACHE" 2>&1 | tee "$ROOT/run.log"

      - name: Assert safety and evidence status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_runs/l2_maker_toxicity_v2')
          payload={'orders_submitted':False,'paper_live_enabled':False,'terminal_dates_opened':False,'v1_evidence_accepted':False}
          summary=root/'summary.json'
          if summary.exists():
              value=json.loads(summary.read_text(encoding='utf-8'))
              assert not value.get('terminal_dates_opened',False)
              assert not value.get('orders_submitted',False)
              assert not value.get('paper_live_enabled',False)
              payload.update({k:value.get(k) for k in ('status','candidate_count','calibration_gate_count','validation_gate_count','target_met')})
          payload['summary_present']=summary.exists()
          (root/'wrapper_status.json').write_text(json.dumps(payload,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Record immutable output hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          find "$ROOT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$ROOT/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2-maker-toxicity-v2-${{ github.sha }}
          path: research_runs/l2_maker_toxicity_v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
