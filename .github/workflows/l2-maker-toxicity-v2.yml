name: L2 maker toxicity V4 independent tick research

on:
  pull_request:
    branches: [main]
    paths:
      - "research/l2_maker_toxicity_v1/**"
      - ".github/workflows/l2-maker-toxicity-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l2-maker-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"
      ROOT: ${{ github.workspace }}/research_runs/l2_maker_toxicity_v4
      SOURCE_ROOT: ${{ github.workspace }}/research_runs/l2_maker_toxicity_v4/source
      CACHE: ${{ github.workspace }}/.cache/l2_maker_toxicity_v4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct and verify immutable V4 source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_ROOT" "$ROOT" "$CACHE"
          python - <<'PY'
          from __future__ import annotations
          import base64, gzip, hashlib, io, json, subprocess, tarfile
          from pathlib import Path, PurePosixPath

          transport = Path("research/l2_maker_toxicity_v1/v4_source")
          output = Path("research_runs/l2_maker_toxicity_v4/source")
          manifest = json.loads((transport / "manifest.json").read_text(encoding="utf-8"))
          part_paths = [transport / part["name"] for part in manifest["bundle"]["parts"]]
          encoded_parts = []
          for path, spec in zip(part_paths, manifest["bundle"]["parts"]):
              payload = path.read_bytes()
              assert len(payload) == spec["bytes"], (path, len(payload), spec["bytes"])
              assert hashlib.sha256(payload).hexdigest() == spec["sha256"], path
              encoded_parts.append(payload)
          encoded = b"".join(encoded_parts)
          assert len(encoded) == manifest["bundle"]["base64_bytes"]
          assert hashlib.sha256(encoded).hexdigest() == manifest["bundle"]["base64_sha256"]
          compressed = base64.b64decode(encoded, validate=True)
          assert len(compressed) == manifest["bundle"]["gzip_bytes"]
          assert hashlib.sha256(compressed).hexdigest() == manifest["bundle"]["gzip_sha256"]
          tar_bytes = gzip.decompress(compressed)
          assert len(tar_bytes) == manifest["bundle"]["tar_bytes"]
          assert hashlib.sha256(tar_bytes).hexdigest() == manifest["bundle"]["tar_sha256"]
          expected = set(manifest["files"])
          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode="r:") as archive:
              members = archive.getmembers()
              assert {member.name for member in members} == expected
              for member in members:
                  pure = PurePosixPath(member.name)
                  assert member.isfile() and not pure.is_absolute() and ".." not in pure.parts and len(pure.parts) == 1
                  payload = archive.extractfile(member).read()
                  spec = manifest["files"][member.name]
                  assert len(payload) == spec["bytes"]
                  assert hashlib.sha256(payload).hexdigest() == spec["sha256"]
                  (output / member.name).write_bytes(payload)
          compile((output / "run.py").read_bytes(), str(output / "run.py"), "exec")
          compile((output / "test_run.py").read_bytes(), str(output / "test_run.py"), "exec")
          record = {
              "status": "PASS",
              "git_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "manifest": manifest,
          }
          (Path("research_runs/l2_maker_toxicity_v4") / "reconstruction.json").write_text(
              json.dumps(record, indent=2, sort_keys=True), encoding="utf-8"
          )
          PY
          cp "$SOURCE_ROOT/preregistration.json" "$ROOT/preregistration.json"

      - name: Install fixed V4 environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scikit-learn==1.6.1" \
            "pytest==8.3.4"
          python - <<'PY'
          import json, platform, sys
          import numpy, pandas, sklearn
          from pathlib import Path
          payload={
              "python":sys.version,"platform":platform.platform(),"machine":platform.machine(),
              "numpy":numpy.__version__,"pandas":pandas.__version__,"scikit_learn":sklearn.__version__,
              "orders_submitted":False,"paper_live_enabled":False,
          }
          Path("research_runs/l2_maker_toxicity_v4/environment.json").write_text(json.dumps(payload,indent=2,sort_keys=True))
          PY

      - name: Run V4 causality and execution regression tests
        run: |
          set -euo pipefail
          pytest -q "$SOURCE_ROOT/test_run.py" 2>&1 | tee "$ROOT/unit_tests.log"

      - name: Run preregistered V4 fit calibration and validation
        run: |
          set -euo pipefail
          python "$SOURCE_ROOT/run.py" --output "$ROOT" --cache "$CACHE" 2>&1 | tee "$ROOT/run.log"

      - name: Assert safety and evidence state
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("research_runs/l2_maker_toxicity_v4")
          status={
              "orders_submitted":False,"paper_live_enabled":False,
              "champion_eligible":False,"terminal_dates_opened":False,
          }
          summary=root/"summary.json"
          if summary.exists():
              value=json.loads(summary.read_text())
              assert not value.get("orders_submitted",False)
              assert not value.get("paper_live_enabled",False)
              assert not value.get("champion_eligible",False)
              status.update({key:value.get(key) for key in (
                  "status","decision_rows","candidate_count","calibration_gate_count",
                  "validation_gate_count","component_daily_target_met","target_met"
              )})
          status["summary_present"]=summary.exists()
          (root/"wrapper_status.json").write_text(json.dumps(status,indent=2,sort_keys=True))
          print(json.dumps(status,sort_keys=True))
          PY

      - name: Record immutable output hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$ROOT"
          find "$ROOT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$ROOT/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2-maker-toxicity-v4-${{ github.sha }}
          path: research_runs/l2_maker_toxicity_v4
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
