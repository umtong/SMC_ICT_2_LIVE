name: L2 independent tick sample integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "research/l2_maker_toxicity_v1/**"
      - ".github/workflows/l2-maker-toxicity-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l2-maker-independent-sample-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OUT: ${{ github.workspace }}/research_runs/l2_independent_sample_v1
      RAW: ${{ runner.temp }}/tardis_sample
      BASE: https://datasets.tardis.dev/v1/binance-futures
      DATE_PATH: 2025/08/01
      DATE_ISO: 2025-08-01
      SYMBOL: BTCUSDT
    steps:
      - uses: actions/checkout@v4

      - name: Download independent normalized BBO, trades and top-five depth
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$RAW"
          printf 'data_type,compressed_bytes,row_count,elapsed_seconds\n' > "$OUT/sample_metrics.csv"
          : > "$OUT/SOURCE_SHA256SUMS.txt"
          for kind in book_ticker trades book_snapshot_5; do
            url="$BASE/$kind/$DATE_PATH/$SYMBOL.csv.gz"
            file="$RAW/${SYMBOL}_${kind}_${DATE_ISO}.csv.gz"
            start=$(date +%s)
            echo "DOWNLOAD $url"
            curl -L --fail --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 30 --max-time 3600 \
              --user-agent 'SMC-ICT-2-LIVE-research/1.0' \
              --max-filesize 8589934592 \
              --output "$file" "$url"
            elapsed=$(( $(date +%s) - start ))
            gzip -t "$file"
            sha256sum "$file" >> "$OUT/SOURCE_SHA256SUMS.txt"
            bytes=$(stat --printf='%s' "$file")
            rows=$(gzip -cd "$file" | wc -l)
            printf '%s,%s,%s,%s\n' "$kind" "$bytes" "$rows" "$elapsed" >> "$OUT/sample_metrics.csv"
            gzip -cd "$file" | sed -n '1,6p' > "$OUT/${kind}_head.csv"
            df -h "$RAW" | tee -a "$OUT/disk_usage.log"
          done

      - name: Build immutable sample manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          out=Path(os.environ['OUT'])
          metrics={r['data_type']:r for r in csv.DictReader((out/'sample_metrics.csv').open())}
          sha={}
          for line in (out/'SOURCE_SHA256SUMS.txt').read_text().splitlines():
              digest, path=line.split(maxsplit=1)
              name=Path(path).name
              for kind in ('book_ticker','trades','book_snapshot_5'):
                  if f'_{kind}_' in name: sha[kind]=digest
          rows=[]
          for kind in ('book_ticker','trades','book_snapshot_5'):
              m=metrics[kind]
              rows.append({
                  'exchange':'binance-futures','symbol':'BTCUSDT','date':'2025-08-01',
                  'data_type':kind,'compressed_bytes':int(m['compressed_bytes']),
                  'row_count':int(m['row_count']),'download_seconds':int(m['elapsed_seconds']),
                  'sha256':sha[kind],
                  'url':f'https://datasets.tardis.dev/v1/binance-futures/{kind}/2025/08/01/BTCUSDT.csv.gz',
              })
          payload={
              'study':'L2_INDEPENDENT_SINGLE_SAMPLE_INTEGRITY_V1',
              'source':'Tardis normalized tick CSV exported from captured exchange WebSocket feeds',
              'event_order_contract':'CSV row order is original capture order; local_timestamp is availability clock',
              'strategy_outcomes_opened':False,'orders_simulated':False,
              'rows':rows,
          }
          (out/'manifest.json').write_text(json.dumps(payload,indent=2,sort_keys=True),encoding='utf-8')
          summary={'available_count':len(rows),'total_compressed_bytes':sum(x['compressed_bytes'] for x in rows),
                   'total_rows':sum(x['row_count'] for x in rows),
                   'strategy_outcomes_opened':False,'orders_simulated':False}
          (out/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Assert research-only state
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ['OUT']); out.mkdir(parents=True,exist_ok=True)
          status={'strategy_outcomes_opened':False,'orders_simulated':False,'terminal_dates_opened':False,
                  'orders_submitted':False,'paper_live_enabled':False,'champion_eligible':False}
          if (out/'summary.json').exists(): status.update(json.loads((out/'summary.json').read_text()))
          assert not status['strategy_outcomes_opened'] and not status['orders_simulated']
          (out/'wrapper_status.json').write_text(json.dumps(status,indent=2,sort_keys=True))
          print(json.dumps(status,sort_keys=True))
          PY

      - name: Record immutable output hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          find "$OUT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$OUT/OUTPUT_SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l2-independent-sample-${{ github.sha }}
          path: research_runs/l2_independent_sample_v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
