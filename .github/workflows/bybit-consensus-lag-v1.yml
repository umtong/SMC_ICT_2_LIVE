name: Bybit three-feed consensus-lag executable upper bound

on:
  push:
    branches:
      - agent/r11-bybit-consensus-lag-001
    paths:
      - "research/bybit_consensus_lag_v1/**"
      - ".github/workflows/bybit-consensus-lag-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/bybit_consensus_lag_v1/**"
      - ".github/workflows/bybit-consensus-lag-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bybit-consensus-lag-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  TZ: UTC
  CACHE: /tmp/bybit-consensus-lag-v1
  OUT: ${{ github.workspace }}/research_runs/bybit_consensus_lag_v1

jobs:
  upper-bound-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deterministic research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 requests==2.32.4 pytest==8.3.4
      - name: Validate project and causal engine
        run: |
          set -o pipefail
          mkdir -p "$OUT/source_transport"
          cp research/bybit_consensus_lag_v1/run.py.gz.b64 "$OUT/source_transport/"
          cp research/bybit_consensus_lag_v1/run.py.gz.b64.part01 "$OUT/source_transport/"
          sha256sum "$OUT"/source_transport/* > "$OUT/source_transport/SHA256SUMS.txt"
          (
            set -e
            python scripts/validate_project.py
            python research/bybit_consensus_lag_v1/reconstruct.py
            python -m py_compile research/bybit_consensus_lag_v1/run.py
            python research/bybit_consensus_lag_v1/run.py self-test
            python -m json.tool research/bybit_consensus_lag_v1/WORK_CLAIM.json >/dev/null
            python -m json.tool research/bybit_consensus_lag_v1/preregistration.json >/dev/null
            python -m json.tool research/bybit_consensus_lag_v1/PREREGISTRATION_AMENDMENT_001.json >/dev/null
          ) 2>&1 | tee "$OUT/validate.log"
      - uses: actions/cache@v4
        with:
          path: /tmp/bybit-consensus-lag-v1
          key: bybit-consensus-lag-v1-${{ runner.os }}-${{ hashFiles('research/bybit_consensus_lag_v1/preregistration.json') }}
          restore-keys: |
            bybit-consensus-lag-v1-${{ runner.os }}-
      - name: Probe exact public sources and schemas
        run: |
          mkdir -p "$OUT/probe"
          python research/bybit_consensus_lag_v1/run.py probe \
            --cache "$CACHE" \
            --output "$OUT/probe" | tee "$OUT/probe.log"
      - name: Run staged fit and conditional development upper-bound screen
        run: |
          mkdir -p "$OUT/screen"
          python research/bybit_consensus_lag_v1/run.py run \
            --cache "$CACHE" \
            --output "$OUT/screen" | tee "$OUT/run.log"
      - name: Assert sealed periods and research-only state
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["OUT"])
          summary_path = root / "screen" / "summary.json"
          if not summary_path.exists():
              (root / "wrapper_status.json").write_text(json.dumps({
                  "hard_validity": "INCOMPLETE",
                  "orders_submitted": False,
                  "paper_live_enabled": False,
                  "2024_opened": False,
                  "reason": "screen did not produce summary.json",
              }, indent=2, sort_keys=True) + "\n")
              raise SystemExit("missing summary.json")
          summary = json.loads(summary_path.read_text())
          assert summary["hard_validity"] == "PASS"
          assert summary["candidate_count"] == 324
          assert summary["result_id"] == "RES-20260726-BYBIT-CONSENSUS-LAG-UPPERBOUND-002"
          assert summary["engine_version"] == "BYBIT_CONSENSUS_LAG_V1B_COMPLETED_MESSAGE_GROUP"
          assert summary["orders_submitted"] is False
          assert summary["paper_live_enabled"] is False
          assert summary["2024_opened"] is False
          assert summary["2025_opened"] is False
          assert summary["2026_opened"] is False
          assert summary["official_target_met"] is False
          (root / "wrapper_status.json").write_text(json.dumps({
              "hard_validity": "PASS",
              "economic_status": summary["economic_status"],
              "development_opened": summary["development_opened"],
              "fit_survivor_count": summary["fit_survivor_count"],
              "survivor_count": summary["survivor_count"],
              "orders_submitted": False,
              "paper_live_enabled": False,
              "2024_opened": False,
          }, indent=2, sort_keys=True) + "\n")
          print("SEALED_RESEARCH_STATE_PASS")
          print("DECISION_READY_RESULT=" + json.dumps(summary, sort_keys=True, separators=(",", ":")))
          PY
      - name: Record immutable output hashes
        if: always()
        run: |
          mkdir -p "$OUT"
          find "$OUT" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$OUT/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bybit-consensus-lag-v1-${{ github.sha }}
          path: research_runs/bybit_consensus_lag_v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
