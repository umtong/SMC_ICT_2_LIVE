name: YT Trinity strict corpus-bound target certification

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/STRICT_TRADE_TAPE_RESULT_*.json
      - research/yt_trinity_ml/PUBLIC_TRADE_TAPE_RESULT_*.json
      - research/yt_trinity_ml/CORPUS_BOUND_SYSTEM_CONTRACT.json
      - research/yt_trinity_ml/CORPUS_BOUND_RUN_POINTER.json
      - research/yt_trinity_ml/certify_strict_trade_tape_target.py
      - .github/workflows/yt-trinity-strict-target-certification.yml

permissions:
  contents: write

concurrency:
  group: yt-trinity-strict-target-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Certify all target requirements together
        run: |
          python research/yt_trinity_ml/certify_strict_trade_tape_target.py \
            --root research/yt_trinity_ml \
            --output research/yt_trinity_ml/CERTIFIED_TARGET_CANDIDATE.json
      - name: Persist certification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            research/yt_trinity_ml/CERTIFIED_TARGET_CANDIDATE.json \
            research/yt_trinity_ml/CERTIFIED_TARGET_CANDIDATE.json.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reconcile strict YT Trinity target certification"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
