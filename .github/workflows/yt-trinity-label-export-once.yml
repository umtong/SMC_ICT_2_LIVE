name: YT Trinity one-shot label export

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-label-export-once.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-label-export-once
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'pandas==2.2.3' 'pyarrow==19.0.1' 'numpy==2.2.6'
      - name: Download and convert event labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8641680196/zip" \
            -o /tmp/labels.zip
          mkdir -p input output
          unzip -q /tmp/labels.zip -d input
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import pandas as pd
          frame = pd.read_parquet('input/EVENT_LABELS.parquet')
          frame.to_pickle('output/EVENT_LABELS.pkl.gz', compression='gzip')
          frame.to_csv('output/EVENT_LABELS.csv.gz', index=False, compression='gzip')
          payload = {
              'schema_version': 1,
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'artifact_name': f"yt-trinity-label-export-{os.environ['GITHUB_SHA']}",
              'row_count': int(len(frame)),
              'column_count': int(len(frame.columns)),
              'parquet_sha256': hashlib.sha256(Path('input/EVENT_LABELS.parquet').read_bytes()).hexdigest(),
              'pickle_sha256': hashlib.sha256(Path('output/EVENT_LABELS.pkl.gz').read_bytes()).hexdigest(),
              'csv_sha256': hashlib.sha256(Path('output/EVENT_LABELS.csv.gz').read_bytes()).hexdigest(),
          }
          Path('research/yt_trinity_ml/LABEL_EXPORT_POINTER.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-label-export-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 7
      - name: Persist export pointer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/LABEL_EXPORT_POINTER.json
          git commit -m "Record YT Trinity label export ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
