name: YT Trinity frozen selected SMC ML 2024H1

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - research/yt_trinity_ml/INTEGRATED_SELECTED_CONTRACT_ML_POINTER.json
      - research/yt_trinity_ml/run_frozen_2024h1_selected.py
      - .github/workflows/yt-trinity-frozen-2024h1-selected.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-frozen-2024h1-selected
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: a2bb231966a517d29495bed7673e4d08ab8e30a9
          path: canonical_repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify positive integrated authority and resolve source labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/evidence input/PRE_2024_2023/BTCUSDT input/PRE_2024_2023/ETHUSDT input/2024_H1/BTCUSDT input/2024_H1/ETHUSDT output
          python - <<'PY' > /tmp/source_run_id
          import json
          from pathlib import Path
          pointer = json.loads(Path('research/yt_trinity_ml/INTEGRATED_SELECTED_CONTRACT_ML_POINTER.json').read_text())
          assert pointer['job_status'] == 'success', pointer
          assert pointer['official_2024_open_authority'] is True, pointer
          print(pointer['resolved_route']['selected']['workflow_run_id'])
          PY
          source_run_id="$(cat /tmp/source_run_id)"
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/artifacts?per_page=100" \
            > /tmp/source_artifacts.json
          python - <<'PY' > /tmp/source_artifact_ids
          import json
          for row in json.load(open('/tmp/source_artifacts.json'))['artifacts']:
              if not row.get('expired'):
                  print(row['id'])
          PY
          fetch() {
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"
          }
          while read -r artifact_id; do
            test -n "$artifact_id" || continue
            fetch "$artifact_id" "/tmp/source-${artifact_id}.zip"
            unzip -q -o "/tmp/source-${artifact_id}.zip" -d input/evidence
          done < /tmp/source_artifact_ids
          python - <<'PY' > /tmp/selected_identifier
          import json
          from pathlib import Path
          pointer = json.loads(Path('research/yt_trinity_ml/INTEGRATED_SELECTED_CONTRACT_ML_POINTER.json').read_text())
          frozen = pointer['resolved_route']['selected']['frozen_contract']
          print(frozen.get('selected_identifier') or frozen.get('identifier'))
          PY
          identifier="$(cat /tmp/selected_identifier)"
          find input/evidence -name "${identifier}_LABELS.parquet" -print -quit > /tmp/pre2024_labels
          test -s /tmp/pre2024_labels
      - name: Download 2023 and 2024H1 canonical BTC ETH shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch() {
            curl --fail --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"
          }
          fetch 8636781702 /tmp/btc2023.zip
          fetch 8636761741 /tmp/eth2023.zip
          unzip -q /tmp/btc2023.zip -d input/PRE_2024_2023/BTCUSDT
          unzip -q /tmp/eth2023.zip -d input/PRE_2024_2023/ETHUSDT
          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/umtong/SMC_ICT_2_LIVE/actions/runs/30218767426/artifacts?per_page=100' \
            > /tmp/canonical_artifacts.json
          python - <<'PY' > /tmp/h1_ids
          import json
          wanted = {'canonical-bybit-2024_H1-BTCUSDT', 'canonical-bybit-2024_H1-ETHUSDT'}
          rows = json.load(open('/tmp/canonical_artifacts.json'))['artifacts']
          found = {row['name']: row['id'] for row in rows if row['name'] in wanted and not row.get('expired')}
          assert set(found) == wanted, (found, wanted)
          for name in sorted(found):
              print(name, found[name])
          PY
          while read -r name artifact_id; do
            fetch "$artifact_id" "/tmp/${name}.zip"
            symbol="${name##*-}"
            unzip -q "/tmp/${name}.zip" -d "input/2024_H1/${symbol}"
          done < /tmp/h1_ids
          for segment in PRE_2024_2023 2024_H1; do
            for symbol in BTCUSDT ETHUSDT; do
              root="input/${segment}/${symbol}"
              if [[ ! -f "${root}/DATASET_MANIFEST.json" ]]; then
                manifest="$(find "${root}" -name DATASET_MANIFEST.json -print -quit)"
                test -n "${manifest}"
                source_dir="$(dirname "${manifest}")"
                tmp="${root}.flat"
                mv "${source_dir}" "${tmp}"
                rm -rf "${root}"
                mv "${tmp}" "${root}"
              fi
            done
          done
      - name: Install deterministic dependencies
        run: python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'scikit-learn==1.6.1' 'pyarrow==19.0.1'
      - name: Execute frozen 2024H1 chronological account
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set +e
          python research/yt_trinity_ml/run_frozen_2024h1_selected.py \
            --integrated-pointer research/yt_trinity_ml/INTEGRATED_SELECTED_CONTRACT_ML_POINTER.json \
            --pre2024-labels "$(cat /tmp/pre2024_labels)" \
            --repo-root canonical_repo \
            --data-root input \
            --segments PRE_2024_2023 2024_H1 \
            --output output \
            2>&1 | tee output/STDOUT.log
          code=${PIPESTATUS[0]}
          echo "$code" > output/EXIT_CODE.txt
          exit 0
      - name: Persist frozen 2024H1 pointer
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path('output')
          result_path = out / 'FROZEN_2024H1_RESULT.json'
          code = int((out / 'EXIT_CODE.txt').read_text().strip()) if (out / 'EXIT_CODE.txt').exists() else 99
          result = json.loads(result_path.read_text()) if result_path.exists() else None
          log = (out / 'STDOUT.log').read_text(errors='replace') if (out / 'STDOUT.log').exists() else ''
          pointer = {
              'schema_version': 1,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'stage': '2024H1_FROZEN_SMC_ML_COARSE_PROVISIONAL_NOT_RANKABLE',
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'exit_code': code,
              'job_status': 'success' if code == 0 else 'execution_failure_not_economic_failure',
              'result': result,
              'result_sha256': hashlib.sha256(result_path.read_bytes()).hexdigest() if result_path.exists() else None,
              'stdout_tail': log[-20000:],
              'ranking_effect': 'NONE_COARSE_PROVISIONAL_NOT_RANKABLE',
          }
          Path('research/yt_trinity_ml/FROZEN_2024H1_SELECTED_POINTER.json').write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/FROZEN_2024H1_SELECTED_POINTER.json
          if ! git diff --cached --quiet; then
            git commit -m "Record frozen SMC ML 2024H1 ${GITHUB_RUN_ID}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin agent/r22-yt-trinity-ml-001
              if git push origin HEAD:agent/r22-yt-trinity-ml-001; then break; fi
              sleep $((attempt * 2))
            done
          fi
      - name: Hash and upload immutable evidence
        if: always()
        run: (cd output && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yt-trinity-frozen-2024h1-selected-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90
      - name: Fail after evidence preservation
        if: always()
        run: test "$(cat output/EXIT_CODE.txt 2>/dev/null || echo 99)" = 0
