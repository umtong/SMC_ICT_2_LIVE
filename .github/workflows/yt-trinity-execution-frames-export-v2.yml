name: YT Trinity execution frames export v2

on:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-execution-frames-export-v2.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-execution-frames-export-v2
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r22-yt-trinity-ml-001
          fetch-depth: 0
      - name: Announce run
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          payload={'schema_version':2,'run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'artifact_name':f"yt-trinity-execution-frames-v2-{os.environ['GITHUB_SHA']}",'status':'in_progress'}
          Path('research/yt_trinity_ml/EXECUTION_FRAMES_POINTER.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/EXECUTION_FRAMES_POINTER.json
          git commit -m "Announce YT Trinity execution frame export ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1

  export:
    needs: announce
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d08e0f7f2aa3ea983cc719a16a1569ad61005bbe
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: a2bb231966a517d29495bed7673e4d08ab8e30a9
          path: canonical_repo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q 'numpy==2.2.6' 'pandas==2.2.3' 'pyarrow==19.0.1'
      - name: Download canonical artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_artifact() {
            curl --fail --silent --show-error --location -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"
          }
          mkdir -p inputs/data/PRE_2024_2023/BTCUSDT inputs/data/PRE_2024_2023/ETHUSDT output
          fetch_artifact 8636781702 /tmp/btc.zip
          fetch_artifact 8636761741 /tmp/eth.zip
          unzip -q /tmp/btc.zip -d inputs/data/PRE_2024_2023/BTCUSDT
          unzip -q /tmp/eth.zip -d inputs/data/PRE_2024_2023/ETHUSDT
      - name: Materialize execution frames
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          python - <<'PY'
          import gzip,hashlib,json,os,pickle
          from pathlib import Path
          from system.canonical_adapter import CanonicalInputConfig,assemble_symbol_frame
          frames={};funding={};keep=('bar_start','open','high','low','close','mark_close','spread_bps','available_at_ms')
          for symbol in ('BTCUSDT','ETHUSDT'):
              frame,events=assemble_symbol_frame(Path('inputs/data'),Path('canonical_repo'),symbol,('PRE_2024_2023',),CanonicalInputConfig(trade_timeframe='1m',decision_timeframe_ms=60_000))
              frames[symbol]=frame[[c for c in keep if c in frame.columns]].copy()
              for timestamp,row in events.iterrows():
                  value=row.get('funding_rate')
                  if value==value: funding[(symbol,timestamp)]=float(value)
          for name,obj in {'EXECUTION_FRAMES.pkl.gz':frames,'FUNDING.pkl.gz':funding}.items():
              with gzip.open(Path('output')/name,'wb',compresslevel=6) as fh:pickle.dump(obj,fh,pickle.HIGHEST_PROTOCOL)
          manifest={'schema_version':2,'source_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'artifact_name':f"yt-trinity-execution-frames-v2-{os.environ['GITHUB_SHA']}",'status':'complete','rows':{s:len(f) for s,f in frames.items()},'files':{}}
          for p in Path('output').glob('*'):manifest['files'][p.name]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          Path('output/MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-execution-frames-v2-${{ github.sha }}
          path: output
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
