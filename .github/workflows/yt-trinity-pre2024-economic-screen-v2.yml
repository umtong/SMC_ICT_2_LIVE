name: YT Trinity 2023 economic screen v2

on:
  workflow_dispatch:
  push:
    branches: [agent/r22-yt-trinity-ml-001]
    paths:
      - .github/workflows/yt-trinity-pre2024-economic-screen-v2.yml
      - control/yt-trinity-pre2024-screen-v2-trigger.json

permissions:
  contents: write
  actions: read

concurrency:
  group: yt-trinity-pre2024-economic-screen-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact corpus-alpha source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout exact canonical-data loader
        uses: actions/checkout@v4
        with:
          repository: umtong/SMC_ICT_2_LIVE
          ref: a2bb231966a517d29495bed7673e4d08ab8e30a9
          path: canonical_repo
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deterministic research dependencies
        run: |
          set -euo pipefail
          mkdir -p output
          exec > >(tee -a output/SETUP.log) 2>&1
          python -m pip install -q --upgrade pip
          python -m pip install -q numpy pandas scikit-learn pyarrow pytest
          python - <<'PY'
          import numpy, pandas, pyarrow, sklearn
          print({
              'numpy': numpy.__version__,
              'pandas': pandas.__version__,
              'pyarrow': pyarrow.__version__,
              'scikit_learn': sklearn.__version__,
          })
          PY

      - name: Download immutable corpus and canonical 2023 BTC/ETH artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee -a output/SETUP.log) 2>&1
          mkdir -p inputs/corpus inputs/data/PRE_2024_2023/BTCUSDT inputs/data/PRE_2024_2023/ETHUSDT
          verify_and_fetch_artifact() {
            local id="$1" expected_digest="$2" target="$3"
            local actual_digest
            actual_digest="$(
              curl --fail --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" \
              | python -c 'import json,sys; print(json.load(sys.stdin)["digest"])'
            )"
            [[ "${actual_digest}" == "${expected_digest}" ]] || {
              echo "artifact digest mismatch id=${id} expected=${expected_digest} actual=${actual_digest}" >&2
              exit 1
            }
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "${target}"
          }
          verify_and_fetch_artifact \
            8637502720 \
            sha256:a3f4b69287940536a174e8514ee13392245e8404c9405aa8a8a3be27daf1f41b \
            /tmp/corpus.zip
          verify_and_fetch_artifact \
            8636781702 \
            sha256:88ac7a4da817746dd165fc46b5be86ada65ecd1273270a3f90ddfaf3ae0df860 \
            /tmp/btc.zip
          verify_and_fetch_artifact \
            8636761741 \
            sha256:7e916dac17e66ea43067fa324d471ed20f1dafed9e19b64e02bebdd19d4cf2b8 \
            /tmp/eth.zip
          unzip -q /tmp/corpus.zip -d inputs/corpus
          unzip -q /tmp/btc.zip -d inputs/data/PRE_2024_2023/BTCUSDT
          unzip -q /tmp/eth.zip -d inputs/data/PRE_2024_2023/ETHUSDT
          test -f inputs/corpus/yt-trinity-complete-corpus/manifest.json
          test -f inputs/data/PRE_2024_2023/BTCUSDT/trade_bars/1m.parquet
          test -f inputs/data/PRE_2024_2023/ETHUSDT/trade_bars/1m.parquet

      - name: Freeze official Bybit primary-instrument rules
        run: |
          set -euo pipefail
          exec > >(tee -a output/SETUP.log) 2>&1
          mkdir -p inputs
          python - <<'PY'
          import hashlib
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          symbols = ('BTCUSDT', 'ETHUSDT')
          raw = {}
          rules = {}
          for symbol in symbols:
              url = f'https://api.bybit.com/v5/market/instruments-info?category=linear&symbol={symbol}'
              error = None
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'SMC-ICT-causal-research/1.0'})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          payload = json.loads(response.read().decode('utf-8'))
                      if payload.get('retCode') != 0:
                          raise RuntimeError(payload)
                      row = payload['result']['list'][0]
                      if row['symbol'] != symbol:
                          raise RuntimeError((symbol, row.get('symbol')))
                      lot = row['lotSizeFilter']
                      qty_step = float(lot['qtyStep'])
                      minimum_quantity = float(lot['minOrderQty'])
                      if qty_step <= 0 or minimum_quantity <= 0:
                          raise RuntimeError((symbol, lot))
                      raw[symbol] = payload
                      rules[symbol] = {
                          'quantity_step': qty_step,
                          'minimum_quantity': minimum_quantity,
                      }
                      break
                  except Exception as exc:
                      error = repr(exc)
                      if attempt == 4:
                          raise
                      time.sleep(2 * (attempt + 1))
              print(symbol, rules[symbol], 'last_error=', error)

          captured = {
              'schema_version': 1,
              'captured_at_utc': datetime.now(timezone.utc).isoformat(),
              'source': 'Bybit V5 GET /v5/market/instruments-info category=linear',
              'symbols': rules,
              'raw_response_sha256': {
                  symbol: hashlib.sha256(
                      json.dumps(raw[symbol], sort_keys=True, separators=(',', ':')).encode('utf-8')
                  ).hexdigest()
                  for symbol in symbols
              },
          }
          Path('inputs/instrument_rules.json').write_text(
              json.dumps(rules, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('output/BYBIT_INSTRUMENT_RULES_SNAPSHOT.json').write_text(
              json.dumps(captured, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('output/BYBIT_INSTRUMENT_RULES_RAW.json').write_text(
              json.dumps(raw, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Verify corpus gate, canonical manifests, rules, and causal regressions
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -euo pipefail
          exec > >(tee -a output/SETUP.log) 2>&1
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('inputs/corpus/yt-trinity-complete-corpus/manifest.json').read_text())
          assert manifest['decision'] == 'PASS_COMPLETE', manifest
          assert manifest['inventory_count'] == 186, manifest
          assert manifest['transcript_video_count'] == 186, manifest
          assert manifest['status_counts'] == {'ok': 186}, manifest
          assert manifest['channel_counts'] == {
              'chartbro': 62,
              'indicator_sensei': 98,
              'swipalnam': 26,
          }, manifest
          assert manifest['corpus_digest_sha256'] == '913aa9e98bb696b1c029b410cf3efd5158122f9cf1ff84adaeb536e31157cc53'

          rules = json.loads(Path('inputs/instrument_rules.json').read_text())
          assert set(rules) == {'BTCUSDT', 'ETHUSDT'}, rules
          for symbol, row in rules.items():
              assert row['quantity_step'] > 0, (symbol, row)
              assert row['minimum_quantity'] > 0, (symbol, row)

          for symbol in ('BTCUSDT', 'ETHUSDT'):
              payload = json.loads(Path(f'inputs/data/PRE_2024_2023/{symbol}/DATASET_MANIFEST.json').read_text())
              assert payload['symbol'] == symbol, payload
              assert payload['logical_segment'] == 'PRE_2024', payload
              assert payload['physical_segment'] == 'PRE_2024_2023', payload
              assert payload['start'] == '2023-01-01T00:00:00Z', payload
              assert payload['end_exclusive'] == '2024-01-01T00:00:00Z', payload
              assert payload['product'] == 'USDT linear perpetual', payload
              for stream in ('trade_price_1m', 'mark_price_1m', 'index_price_1m', 'premium_index_1m'):
                  assert payload['coverage'][stream]['coverage'] == 1.0, (symbol, stream, payload['coverage'][stream])
          PY
          pytest -q \
            research/yt_trinity_ml/tests/test_corpus_alpha.py \
            research/yt_trinity_ml/tests/test_execution_realism.py \
            research/yt_trinity_ml/tests/test_entry_fill_guard.py \
            research/yt_trinity_ml/tests/test_yt_trinity_system.py

      - name: Execute causal 2023H2 after-cost sequential account screen
        env:
          PYTHONPATH: research/yt_trinity_ml
        run: |
          set -euo pipefail
          python research/yt_trinity_ml/run_primary_screen.py \
            --repo-root canonical_repo \
            --data-root inputs/data \
            --corpus inputs/corpus/yt-trinity-complete-corpus \
            --instrument-rules inputs/instrument_rules.json \
            --output output \
            --segments PRE_2024_2023 \
            --validation-start 2023-07-01T00:00:00Z \
            --validation-end-exclusive 2024-01-01T00:00:00Z \
            2>&1 | tee output/STDOUT.log

      - name: Bind run identity and hash outputs
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          payload = {
              'schema_version': 2,
              'stage': 'PRE2024_2023H2_COARSE_1M_NOT_RANKABLE',
              'source_commit': os.environ['GITHUB_SHA'],
              'github_run_id': int(os.environ['GITHUB_RUN_ID']),
              'canonical_loader_commit': 'a2bb231966a517d29495bed7673e4d08ab8e30a9',
              'corpus_artifact_id': 8637502720,
              'corpus_artifact_digest': 'sha256:a3f4b69287940536a174e8514ee13392245e8404c9405aa8a8a3be27daf1f41b',
              'corpus_digest_sha256': '913aa9e98bb696b1c029b410cf3efd5158122f9cf1ff84adaeb536e31157cc53',
              'btc_artifact_id': 8636781702,
              'btc_artifact_digest': 'sha256:88ac7a4da817746dd165fc46b5be86ada65ecd1273270a3f90ddfaf3ae0df860',
              'eth_artifact_id': 8636761741,
              'eth_artifact_digest': 'sha256:7e916dac17e66ea43067fa324d471ed20f1dafed9e19b64e02bebdd19d4cf2b8',
              'instrument_rules_snapshot': 'output/BYBIT_INSTRUMENT_RULES_SNAPSHOT.json',
              'training_information_cutoff': 'strictly before each scheduled model update',
              'evaluation_start': '2023-07-01T00:00:00Z',
              'evaluation_end_exclusive': '2024-01-01T00:00:00Z',
              'fixed_activation_latency_ms': 500,
              'python': sys.version,
              'platform': platform.platform(),
          }
          Path('output').mkdir(exist_ok=True)
          Path('output/RUN_IDENTITY.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          (
            cd output
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload immutable economic-screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-trinity-pre2024-screen-v2-${{ github.sha }}
          path: output
          if-no-files-found: error
          retention-days: 90

      - name: Persist compact economic-screen pointer
        if: always()
        env:
          SCREEN_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path('output')
          summary_path = output / 'PRIMARY_SCREEN_SUMMARY.json'
          summary = None
          summary_sha256 = None
          if summary_path.exists():
              raw = summary_path.read_bytes()
              summary = json.loads(raw)
              summary_sha256 = hashlib.sha256(raw).hexdigest()
          tails = []
          for name in ('SETUP.log', 'STDOUT.log'):
              path = output / name
              if path.exists():
                  lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
                  tails.append(f'===== {name} =====\n' + '\n'.join(lines[-80:]))
          pointer = {
              'schema_version': 2,
              'claim_id': 'CLM-20260727-0346-YT-TRINITY-ML-001',
              'workflow': 'YT Trinity 2023 economic screen v2',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ.get('GITHUB_RUN_ATTEMPT', '1')),
              'source_sha': os.environ['GITHUB_SHA'],
              'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
              'job_status': os.environ['SCREEN_JOB_STATUS'],
              'artifact_name': f"yt-trinity-pre2024-screen-v2-{os.environ['GITHUB_SHA']}",
              'stage': 'PRE2024_2023H2_COARSE_1M_NOT_RANKABLE',
              'summary_sha256': summary_sha256,
              'summary': summary,
              'diagnostic_tail': '\n'.join(tails)[-30000:] if tails else None,
          }
          target = output / 'PRE2024_SCREEN_POINTER.json'
          target.write_text(
              json.dumps(pointer, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('/tmp/PRE2024_SCREEN_POINTER.json').write_bytes(target.read_bytes())
          PY

          git fetch origin agent/r22-yt-trinity-ml-001
          git checkout -B agent/r22-yt-trinity-ml-001 origin/agent/r22-yt-trinity-ml-001
          cp /tmp/PRE2024_SCREEN_POINTER.json research/yt_trinity_ml/PRE2024_SCREEN_POINTER.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/yt_trinity_ml/PRE2024_SCREEN_POINTER.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record 2023 YT Trinity economic screen v2 ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin agent/r22-yt-trinity-ml-001
            if git push origin HEAD:agent/r22-yt-trinity-ml-001; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
