name: Authoritative ML option hedge screen

on:
  push:
    branches:
      - agent/r12-ml-option-hedge-001
    paths:
      - "research/ml_option_hedge_20260726/**"
      - ".github/workflows/ml-option-hedge-authoritative-r12.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-option-hedge-authoritative-${{ github.sha }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install \
            "numpy==2.1.3" \
            "pandas==2.2.3" \
            "scipy==1.14.1" \
            "scikit-learn==1.5.2" \
            "requests==2.32.4" \
            "pytest==8.3.4"
      - name: Reconstruct, amend and test before market execution
        run: |
          set -euo pipefail
          root=research/ml_option_hedge_20260726
          out=research_runs/ml_option_hedge_20260726/authoritative
          mkdir -p "$out"
          python "$root/reconstruct.py" 2>&1 | tee "$out/RECONSTRUCT.log"
          python "$root/apply_sample_amendment.py" 2>&1 | tee "$out/SAMPLE_COVERAGE_AMENDMENT.log"
          python -m py_compile "$root/run.py" "$root/test_run.py"
          PYTHONPATH="$root" pytest -q "$root/test_run.py" 2>&1 | tee "$out/PYTEST.log"
          PYTHONPATH="$root" python "$root/run.py" self-test 2>&1 | tee "$out/SELF_TEST.log"
          python scripts/validate_project.py 2>&1 | tee "$out/PROJECT_VALIDATION.log"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('research/ml_option_hedge_20260726/run.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='80d94063c427074b5c10896e659f06cf22a77acb94b9961c08587cd9f3b6905e'
          print('AUTHORITATIVE_SAMPLE_AMENDED_SOURCE_PASS')
          PY
      - uses: actions/cache@v4
        with:
          path: /tmp/ml-option-hedge-authoritative-r12
          key: ml-option-hedge-authoritative-r12-${{ hashFiles('research/ml_option_hedge_20260726/preregistration.json', 'research/ml_option_hedge_20260726/AMENDMENT-002-SAMPLE-COVERAGE.json') }}
      - name: Execute frozen screen
        run: |
          set -euo pipefail
          root=research/ml_option_hedge_20260726
          out=research_runs/ml_option_hedge_20260726/authoritative
          PYTHONPATH="$root" python "$root/run.py" run \
            --output "$out" \
            --cache /tmp/ml-option-hedge-authoritative-r12 \
            2>&1 | tee "$out/RUN.log"
      - name: Enforce result and sealed boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research_runs/ml_option_hedge_20260726/authoritative')
          result=json.loads((root/'RESULT.json').read_text())
          contract=json.loads((root/'MODEL_CONTRACT.json').read_text())
          environment=json.loads((root/'ENVIRONMENT.json').read_text())
          assert result['claim_id']=='CLM-20260726-1732-ML-OPTION-HEDGE-001'
          assert contract['one_model_family'] is True
          assert contract['hyperparameter_grid'] is False
          assert contract['one_economic_decision_rule'] is True
          assert contract['train_dates']==['2022-01-01','2022-02-01','2022-03-01','2022-04-01','2022-05-01','2022-06-01']
          assert contract['calibration_dates']==['2022-07-01','2022-08-01']
          assert environment['2024_opened'] is False
          assert environment['2025_opened'] is False
          assert environment['2026_opened'] is False
          assert result['orders_submitted'] is False
          assert result['prohibited_years_opened']==[]
          if not result['fit']['gate_passed']:
              assert result['development'] is None
              assert result['development_source_file_count']==0
          for cost in ('12','18','24'):
              assert result['fit']['paths'][cost]['trade_count'] >= 0
          print(json.dumps({'status':result['status'],'fit_gate':result['fit']['gate_passed'],'development_opened':result['development'] is not None},sort_keys=True))
          PY
      - name: Record immutable checksums
        if: always()
        run: |
          set -euo pipefail
          root=research/ml_option_hedge_20260726
          out=research_runs/ml_option_hedge_20260726/authoritative
          mkdir -p "$out"
          sha256sum \
            "$root/preregistration.json" \
            "$root/WORK_CLAIM.json" \
            "$root/AMENDMENT-002-SAMPLE-COVERAGE.json" \
            "$root/SUPERSESSION-001-PRESERVE-ORIGINAL-FIT-GUARD.json" \
            "$root/source_manifest.json" \
            "$root/reconstruct.py" \
            "$root/apply_sample_amendment.py" \
            "$root/test_run.py" \
            "$root/run.py" \
            > "$out/INPUT_SHA256SUMS.txt" || true
          find "$out" -type f ! -name OUTPUT_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$out/OUTPUT_SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authoritative-ml-option-hedge-${{ github.sha }}
          path: research_runs/ml_option_hedge_20260726/authoritative
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
