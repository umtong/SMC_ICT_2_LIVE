schema_version = 3

[work]
state_update_protocol = "optimistic_revision"
work_claims_path = "control/work-claims.csv"
result_registry_path = "control/result-registry.jsonl"
validation_cache_path = "control/validation-cache.jsonl"
claim_lease_hours = 8
intentional_replication_requires_reason = true
scope_fingerprint_required = true
claim_required_for_costly_or_reusable_work = true
claim_optional_for_short_local_work = true

[lookup]
targeted_related_records_only = true
full_registry_scan_by_default = false
check_open_pull_requests_for_touched_paths = true

[validation]
mode = "staged"
initial_gate = "causality_calculation_basic_cost_sample_concentration"
promising_gate = "sequential_oos_parameter_neighborhood_period_symbol_execution_sensitivity"
champion_gate = "account_paths_liquidation_tail_top_trade_removal_latency_partial_fill_liquidity_capacity_replication"

[records]
register_used_or_reusable_sources_only = true
minimal_metadata_first = true
full_run_report_for_material_checkpoint_only = true
pull_request_for_shared_or_reusable_changes_only = true
drive_is_live_record = true
github_is_versioned_milestone = true

[defaults]
select_highest_value_unresolved_work = true
reuse_registered_artifacts = true
check_active_claims = true
check_open_pull_requests = true
write_run_report = true
use_own_branch_for_repository_changes = true

[[focus_profile]]
id = "ALPHA_DISCOVERY"
hint = "discover, quantify, implement, and compare new alpha mechanisms"

[[focus_profile]]
id = "EXTERNAL_IDEAS"
hint = "reuse registered sources, fill high-value evidence gaps, and convert ideas into executable hypotheses"

[[focus_profile]]
id = "EXECUTION_AND_COST"
hint = "improve executable net expectancy through orders, costs, latency, liquidity, and capacity"

[[focus_profile]]
id = "PORTFOLIO_AND_ACCOUNT_PATH"
hint = "combine independent alpha and optimize account growth, drawdown, liquidation safety, and capital efficiency"

[[focus_profile]]
id = "TARGETED_VALIDATION"
hint = "test changed surfaces and high-value assumptions, fix defects, and return to alpha discovery"
