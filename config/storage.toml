schema_version = 3

[policy]
raw_files_immutable = true
processed_files_versioned = true
deduplicate_by = ["canonical_url", "sha256"]
large_file_threshold_mb = 10
public_repo_contains_private_drive_ids = false
public_information_and_materials_usable = true
register_research_used_material = true

[efficiency]
registry_lookup_before_external_search = true
reuse_existing_raw_and_processed_material = true
full_video_default = "store_only_when_uniquely_useful"
transcript_default = "store_when_used_or_reusable"
paper_default = "store_or_link_for_fast_reuse"
unchanged_artifacts_are_not_rebuilt = true

[github]
store = [
  "instructions",
  "configuration",
  "code",
  "schemas",
  "small manifests",
  "checksums",
  "dependency fingerprints",
  "reproducible summaries",
]
exclude = [
  "credentials",
  "private Drive bindings",
  "raw large datasets",
  "personal data",
]

[google_drive]
store = [
  "research-used sources",
  "transcripts and source notes",
  "papers and technical materials",
  "market datasets",
  "large experiment artifacts",
  "append-only run reports",
  "validation evidence",
  "milestone snapshots",
]

[retention]
raw_sources = "immutable"
processed_outputs = "versioned"
superseded_outputs = "archive"
duplicates = "reuse_or_quarantine"
registry_or_manifest_required = true
