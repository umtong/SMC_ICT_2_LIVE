schema_version = 5

[objective]
metric = "account_nav_geometric_daily_growth"
target = 0.01
calendar = "trading_days"
fees_and_execution_costs_included = true

[hard_validity]
causal_information_only = true
realistic_execution = true
calculation_accuracy = true
overfitting_controls = true
invalid_if_violated = true

[ranking]
definition = "ordered_hard_valid_strategy_or_portfolio_candidates"
first_place_role = "current_result_closest_to_full_project_objective"
primary_metric = "realistic_after_cost_geometric_daily_growth_gap_to_target"
primary_target = 0.01
hard_invalid_candidates_excluded = true
survival_qualified_candidate_cannot_be_outranked_by_forced_liquidation_raw_return = true
first_place_target_attainment_required = false
first_place_full_validation_required = false
economic_gate_failure_is_not_hard_invalidity = true
allow_provisional_ranking_when_comparison_is_incomplete = true
component_rankings_recorded_separately = true
rank_grants_research_priority = false
rank_creates_default_improvement_target = false
extra_preservation_on_rank_change_required = false
work_selection_criterion = "objective_impact_and_information_value"
secondary_criteria = [
  "max_drawdown_and_recovery",
  "liquidation_and_tail_loss",
  "profit_concentration_and_top_trade_removal",
  "effective_independent_trade_count",
  "cost_slippage_latency_and_liquidity_sensitivity",
  "capital_efficiency",
  "validation_and_comparison_confidence",
]
required_record_fields = [
  "rank",
  "source_result_id",
  "selection_reason",
  "qualification_stage",
  "target_status",
  "target_gap",
  "data_cost_execution_contract",
  "core_metrics",
  "comparison_confidence",
  "known_weaknesses",
]

[validation]
mode = "staged"
depth_proportional_to_economic_promise_and_decision_value = true

[stage.initial]
purpose = "cheap_rejection"
required = [
  "causal_boundary",
  "calculation_smoke_test",
  "basic_cost_after_expectancy",
  "minimum_sample_and_trade_count",
  "basic_profit_concentration",
]

[stage.promising]
entry_condition = "positive_after_basic_cost_with_sufficient_sample"
required = [
  "sequential_out_of_sample",
  "parameter_neighborhood",
  "period_and_symbol_breakdown",
  "basic_execution_sensitivity",
]

[stage.deep_validation]
entry_condition = "material_strategy_account_or_practical_use_decision"
required = [
  "account_nav_paths",
  "max_drawdown_and_recovery",
  "liquidation_and_tail_loss",
  "top_1_5_10pct_trade_removal",
  "latency_partial_fill_liquidity_capacity_stress",
  "independent_replication_when_material",
]

[account_quality]
require_no_forced_liquidation = true
require_recoverable_drawdown = true
require_non_concentrated_profit = true
require_many_repeatable_positive_expectancy_trades = true

[final_reporting]
applies_to = "material_strategy_portfolio_or_practical_use_decision"
metrics = [
  "geometric_daily_growth",
  "ending_nav_multiple",
  "max_drawdown",
  "drawdown_recovery",
  "liquidation_probability_or_distance",
  "tail_loss",
  "trade_count",
  "top_1pct_trade_contribution",
  "top_5pct_trade_contribution",
  "top_10pct_trade_contribution",
  "performance_without_top_trades",
  "cost_and_slippage_sensitivity",
  "regime_and_period_breakdown",
]
